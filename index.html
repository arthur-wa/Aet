هركم رجل قتل الليلة لم يسبقه الأولون بعلم ولا يدركه الآخرون” و هذا من العام المراد به الخاص قطعا فان العقل يخص من لفظ الأولين سيد المرسلين صلى الله عليه و سلم و سائر الأنبياء و جبريل صلوات الله و سلامه عليهم اجمعين …فلم يقصد الحسن بتفضيل ابيه في العلم على احد من هؤلاء … وانما يتوهم ذلك من اشتدت عرانيه في الجهل ولم تكن له خبرة باساليب الكلام ولا له اطلاع على عبارات العلماء و تحقيقاتهم ولا قواعد اصول الفقه و علوم البلاغة . و من هو بهذه المثابة لا يلتفت الى توهماته الفا سدة بل يترك ينعق مع الناعقين .\n\nومن ذلك قول الإمام الشافعي\nولولا الشعر بالعلماء يزري لكنت اليوم اشعر من لبيد\nولولا خشية الرحمان ربي حسبت الناس كلهم عبيدي\n\nفهل يتوهم عاقل قط ان عبارة الشافعي هذه يدخل فيها احد مشايخه فضلا عن التابعين فضلا عن الصحابة فضلا عن الأنبياء صلوات الله عليهم معاذ الله لا يتوهم هذا الا جاهل … انتهى كلام السيوطي\n\nو اذا فهمت ما تقدم علمت ان كلام الشيخ رضي الله عنه و ارضاه لا يتوجه الى الصحابة اصلا رضي الله تعالى عنهم و مما يؤيد ذلك ان الشيخ رضي الله تعالى عنه صرح بان الصحابي افضل من غيره و لو بلغ ذلك الغير ما بلغ في المعرفة بالله – و في جواهر المعاني- و سالته رضي الله عنه عن تفضيل الصحابي الذي لم يفتح عليه عن القطب من غير الصحابة فأجاب :” اختلف الناس في تفضيل الصحابي الذي لم يفتح عليه على القطب من غير الصحابة ، و الراجح تفضيل الصحابي على القطب بشاهد قوله صلى الله عليه و سلم : ان الله اصطفى اصحابي على سائر العالمين سوى النبيين و المرسلين” و قوله صلى الله عليه و سلم :” لوانفق احدكم مثل احد ذهبا ما بلغ مد احدهم و لا نصيفه” و هذا من شدة اعتناء الله بنبيه صلى الله عليه و سلم …\nويؤيد ذلك قول الشيخ رضي الله عنه ان جميع الأولياء من عصر الصحابة الى النفخ في الصور الخ. لأن من لانتهاء الغاية و في هذا المحل يعلم ذلك كل من له ادنى معرفة بعلم النحو، لان من تكون بمعنى الى .\nو بذلك يتبين ان تفضيل الشيخ رضي الله عنه على سائر الأولياء لا يدخل فيه باي شكل الصحابة رضي الله عنهم و الانبياء عليهم الصلاة و السلام."}, {"q": "هل يمكنكم اعلامي حول موضوع القبض و الإسدال في الصلاة ، و هل فعلا أن وضعية الإسدال لا أساس لها في الإسلام", "a": "الجواب عن هذا السؤال سيكون إن شاء الله عبر أربع مراحل :\nــ المرحلة الأولى : في كون القبض من السنن التي لاتبطل الصلاة بتركه\nــ المرحلة الثانية: في بعض الأحاديث التي استنبط منها العلماء السدل\nــ المرحلة الثالثة : في كون السدل من فعل مجموعة من أئمة السلف الصالح وأنه غير محصور في المذهب المالكي فقط .\nــ المرحلة الرابعة: عبارة عن جولة في كتب شراح الحديث والفقهاء المعتمدين على إختلاف مذاهبهم في تقرير السدل في المذهب المالكي دون إنكار منهم ولا تبديع.\nالمرحلة الأولى : في كون القبض من السنن التي لاتبطل الصلاة بتركه .\nــ حديث مسيء الصلاة:\nأخرجه السبعة بألفاظ متقاربة وفيه: أن النبي صلى الله عليه وسلم قال:” إنه لاتتم صلاة لأحد من الناس حتى يتوضأ فيضع الوضوء ثم يكبر ويحمد الله عز وجل ويثني عليه ويقرأ بما تيسر من القرآن ثم يقول الله اكبر ثم يركع حتى تطمئن مفاصله ثم يقول سمع الله لمن حمده حتى يستوي قائما ثم يقول الله أكبر ثم يسجد حتى تطمئن مفاصله ثم يقول الله أكبر ويرفع رأسه حتى يستوي قاعدا ثم يقول الله أكبر ثم يسجد حتى تطمئن مفاصله ثم يرفع رأسه فيكبر فإذا فعل ذلك فقد تمت صلاته.” وهذا اللفظ لأبي داوود.\nوفي رواية أبي هريرة : ” فإذا فعلت هذا فقد تمت صلاتك وماانتقصت من هذا شيئا فإنما انتقصته من صلاتك.” وفي رواية ِرفاعَة بن رافِع :”لاتتم صلاة أحدكم حتى يفعل ذلك. “وفي رواية عنه أيضا: ” وإن انتقصت منه شيئا انتقصت من صلاتك.”\nقال الشيخ العلامة المجتهد محمد ابن اسماعيل الأمير الصنعاني في كتابه سبل السلام شرح بلوغ المرام من أدلة الأحكام:” واعلم أن هذا الحديث جليل تكرر من العلماء الإستدلال به على وجوب كل ماذكر فيه وعدم وجوب كل ما لم يذكر فيه ، أما الاستدلال على أن كل ما ذكر فيه واجب لأنه ساقه صلى الله عليه وسلم بلفظ الأمر بعد قوله لاتتم الصلاة إلا بما ذكر فيه.وأما الإستدلال بأن كل ما لم يذكر فيه لايجب فلأن المقام مقام تعليم الواجبات في الصلاة فلو ترك ذكر بعض ما يجب لكان فيه تأخير البيان عن وقت الحاجة وهو لايجوز بالإجماع. “\nوقال الشوكاني في كتابه نيل الأوطار لما أتى على هذا الحديث ما نصه: ” فإن النزاع في استحباب الوضع لاوجوبه وترك ذكره في حديث المسيء إنما يكون حجة عن القائل بالوجوب . “\nوقال سعد بن عمر بن سعيد الفوتي في كتابه موقف الفصل في أدلة القبض والسدل: ” فبناءً على هذا نتحقق بأنه ليس القبض بواجب في الصلاة لعدم ذكره فيها هنا ولامما تبطل الصلاة بتركه كما يصرح به مثيروا الفتن ومفرقوا الجماعات والذين يحبون أن تشيع الفاحشة في الذين آمنوا وإنه لما لم يكن من واسطة بين القبض والارسال فإن السدل هو المعمول هنا لأنه الأصل فمن لم يكن قابضا فإنه سادل لاغير.”\nوقال الفوزان في كتابه الملخص الفقهي كتاب الصلاة: ” والنوع الثاني سنن الافعال كرفع اليدين عند تكبيرة الاحرام وعند الهوي إلى الركوع وعند الرفع منه ووضع اليمنى على اليسرى ووضعهما على صدره أو تحت السرة في حال القيام والنظر إلى موضع السجود …..وغير ذلك من سنن الأقوال والأفعال مما هو مفصل في كتب الفقه وهذه السنن لايلزم الإتيان بها في الصلاة بل من فعلها أو شيء منها فله زيادة أجر ومن تركها أو بعضها فلا حرج عليه ومن هنا لانرى مبررا لما يفعله بعض الشباب اليوم من التشدد في أمر السنن في الصلاة…” .\nوقال صاحب مطالب أولي النهى في شرح غاية المنتهى :” والثالث من أقوال الصلاة وأفعالها (سننها) وهي ماكان فيها مما سوى ركن وواجب ولاتبطل الصلاة بتركها ولو عمدا بخلاف الأركان والواجبات…..وهي أي السنن ضربان الأول قولية كاستفتاح وتعوذ…..والضرب الثاني فعلية وتسمى هذه السنن (هيئة) لأن الهيئة صفة في غيرها ….. ووضع يمين على شمال تحت سرة ونظر لموضع سجود …”\nوقال ابن عبد البر في الإستذكار باب التشهد في الصلاة :” والذي أقول به وبالله التوفيق أن الاختلاف في التشهد وفي الآذان والإقامة وعدد التكبير على الجنائز وما يقرأ ويدعى به فيها وعدد التكبير في العيدين ورفع الأيدي في ركوع الصلاة وفي التكبير على الجنائز وفي السلام من الصلاة واحدة أو اثنين وفي وضع اليمنى على اليسرى في الصلاة وسدل يدين وفي القنوت وتركه وما كان مثل هذا كله اختلاف مبــاح.”\nالمرحلة الثانية: في بعض الأحاديث التي استنبط منها العلماء السدل.\n2ــ روى أبوداوود بإسناد صحيح عن سالم البراد قال: ” أتينا عقبة بن عامر الأنصاري أبا مسعود فقلنا له:” حدثنا عن صلاة رسول الله.” فقام بين أيدينا في المسجد فكبر فلما ركع وضع يديه على ركبتيه وجعل أصابعه أسفل من ذلك وجافى بين مرفقيه حتى استقر كل شيء منه ثم قال:” سمع الله لمن حمده ” فقام حتى استقر كل شيء منه ثم كبر وسجد ووضع كفيه على الارض ثم جافى بين مرفقيه حتى استقر كل شيء منه ثم رفع رأسه فجلس حتى استقر كل شيء منه ففعل مثل ذلك أيضا ثم صلى أربع ركعات مثل هذه الركعة فصلى صلاته ثم قال:” هكذا رأينا رسول الله صلى الله عليه وسلم يصلي.” .\nوهذا حصر عند العلماء إذ كيف يعقل أن هذا الصحابي بعدما سئل عن صفة صلاة النبي صلى الله عليه وسلم ومطلوب منه تبيين وتعليم السائل صلاته صلى الله عليه وسلم ترك القبض مع وروده عن النبي صلى الله عليه وسلم كلا وحاشاه والصحابة أحرص الناس على تبليغ شرع الله لعباد الله .\n3ــ روى البخاري في صحيحه والترمذي وابن ماجة والإمام أحمد والدارمي في سننه وابن خزيمة في صحيحه وكذا ابن حبان وابي داوود واللفظ له لما في روايته من الشمولية: ” قال عن بن عطاء قال:” سمعت أبا حُميْد الساعدي في عشرة من أصحاب رسول الله صلى الله عليه وسلم منهم أبو قتادة قال أبو حُميد : ” أنا أعلمكم بصلاة رسول الله صلى الله عليه وسلم” قالوا:” فلم ؟ فوالله ما كنت بأكثرنا له تبعة ولاأقدمنا له صحبة !” قال:” بلى!” قالوا:” فاعرض!” قال:” كان رسول الله صلى الله عليه وسلم إذا قام إلى الصلاة يرفع يديه حتى يحاذي بهما منكبيه ثم يكبر حتى يَقر كل عظم في موضعه معتدلا ثم يقرأ ثم يكبر فيرفع يديه حتى يحاذي بهما منكبيه ثم يركع ويضع راحتيه على ركبتيه ثم يعتدل فلا يَصُب رأسه ولا يُقنِع ثم يرفع رأسه فيقول :”سمع الله لمن حمده ” ثم يرفع يديه حتى يحاذي بهما منكبيه معتدلا ثم يقول:” الله أكبر” ثم يهوي إلى الأرض فيجافي يديه عن جنبه ثم يرفع رأسه ويثني رجله اليسرى فيقعد عليها ويفتح أصابع رجليه إذا سجد ويسجد ثم يقول:” الله أكبر” ويرفع رأسه ويثني رجله اليسرى فيقعد عليها حتى يرجع كل عظم إلى موضعه ثم يصنع في الأخرى مثل ذلك ثم إذا قام من الركعتين كبر ورفع يديه حتى يحاذي بهما منكبيه كما كبر عند إفتتاح الصلاة ثم يصنع ذلك في بقية صلاته حتى إذا كانت السجدة التي فيها التسليم أخر رجله اليسرى وقعد متوركا على شقه الأيسر قالوا:” صدقت هكذا كان يصلي صلى الله عليه وسلم! “.\nقال مفتي المالكية في الحرمين الشيخ محمد عابد في رسالته على السدل : ” وهذا الحديث كما ترى حجة واضحة في السدل لأن أبا حُميد في مقام الإحتجاج على الصحابة المنكرين عليه أنه أعلم منهم بصفة صلاته صلى الله عليه وسلم لكونهم ما أسلموا له أول مرة حيث قالوا له :”ما كنت بأكثرنا له تبعة ” كما جبلت عليه نفوس الأقران من التنافس وعدم التسليم للأتراب إلا لما وصف لهم صلاته صلى الله عليه وسلم على سبيل الإستقصاء للسنن والفرائض ولم يترك منها شيئا عَلِمَه فقالوا له:” صدقت …” وسلموا له ما ادعاه لكونه أخبرهم بما عندهم فحينئذ لوكان القبض من وصف صلاته صلى الله عليه وسلم لأنكروا عليه قائلين له :” ياأباحُميد تركت أو نسيت أخذ الشمال باليمين” مع أن في هؤلاء العشرة سهل بن سعد وأبا هريرة وهم ممن ُروي عنهم القبض لأن المقام مقام احتجاج والعادة قاضية بأنهم يناقشونه فيه على أقل شيء فحيث لم يناقشوه في ذلك علمنا أنهم متفقون على ترك القبض في صفة صلاته صلى الله عليه وسلم وأنه صلى الله عليه وسلم كان سادلا لأن السدل هو الأصل لايحتاج إلى ذكره.”\nفتأمل معي أخي قوله:” إذا قام إلى الصلاة يرفع يديه حتى يحاذي بهما منكبيه ثم يكبر حتى يقر كل عظم في موقعه معتدلا” لدليل واضح على سدل اليدين إذ المحل العادي لليدين من الإنسان عند الوقوف والقيام جنباه ولاينازع في ذلك إلامكابر ، فبان لك أن السدل هو المعمول به ، وهذا الحديث اتفقت عليه عشرة من الصحابة زيادة على راويه أو براويه دفعة واحدة في وقت واحد في مجلس واحد لاشك أنه أرجح من أحاديث رواها الآحاد في القبض.\nوهذه هي صلاة رسول الله صلى الله عليه وسلم الخالية من القبض مع أن أبا حُميد ذكر فيها جميع الفرائض والسنن والمستحبات بالإستقصاء وشهد له بصحتها عشرة من الصحابة الكرام فلا ننصت بعدها لاي متشدق يقول ببطلان صلاة غير القابض.\n4ــ روى الطبراني في معجمه الكبير عن معاذ بن جبل رضي الله عنه قال : “كان رسول الله صلى الله عليه وسلم إذا قام إلى الصلاة رفع يديه قبال أذنيه فإذا كبر أرسلهما ثم سكت وربما رأيته يضع يمينه على يساره.”وهذا الحديث رغم ضعفه إلا أنه يصلح للمتابعة، معضدا ومفسرا لما ورد في هذا الباب من الآثارالصحيحة ففي بعضها أنه صلى الله عليه وسلم أخد شماله بيمينه وفي بعضها وصفُ صلاته صلى الله عليه وسلم بدون ذكر ذلك فبين هذا الحديث أنه صلى الله عليه وسلم كان يفعل الأمرين فالوقت الذي أخذ شماله بيمينه رآه من ذكر عنه ذلك والوقت الذي أرسل يديه رآه من لم يذكره فأخذ كلُ راٍو بما رأى وأن كِلا الفريقين امتثل أمره صلى الله عليه وسلم إذ قال :”صلوا كما رأيتموني أصلي “.\n5ــ أما حديث البخاري عن عبد الله ابن مسلمة عن مالك عن أبي حازم عن سهل بن سعد قال :” كان الناس يؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة.” قال أبو حازم :”لاأعلمه إلا يُنمي ذلك إلى النبي صلى الله عليه وسلم.” قال اسماعيل:” يُنمي ذلك ولم يقل يَنمي. “\nوهذا الحديث مدار جميع طرقه على الإمام مالك رحمه الله إذ لم يرويه عن أبي حازم عن سهل غيره ، وقد قال ابن القاسم الذي هو من أجل من روى عن مالك في المدونة الكبرى ، كتاب الصلاة الاول ، ما نصه: قال مالك في وضع اليمنى على اليسرى في الصلاة قال:” لاأعرف ذلك في الفريضة ـ وكان يكرهه ـ ولكن في النوافل إذا طال القيام فلا بأس بذلك يعين به على نفسه” إهـ.\nوقال أهل الصناعة الحديثية أن الراوي أدرى بمعنى روايته والإمام مالك بين وأوضح في فتواه هذه معنى مارواه في الموطأ ومن طريقه أخرج البخاري الحديث أن القبض في النافلة دون الفريضة إذا طال القيام وهو واضح وهذه الحالة التي أشار إليها ابن القاسم عن مالك أتى بها إبن حزم الأندلسي عن علي رضي الله عنه وكرم وجهه فقال في المحلى عند المسألة 448 ما نصه: “وروينا عن علي رضي الله عنه أنه كان إذا طال القيام في الصلاة أخذ بيده اليمنى ذراعه اليسرى.” .\n{ للتوضيح} من قواعد الحديث عند المحدثين أن الراوي للحديث إذا عمل بخلاف مارواه دل ذلك على نسخه قال إبن المعدل سمعت إنسانا سأل ابن الماجشون:” لم رويتم الحديث ثم تركتموه؟” قال:” ليعلم أنا على علم تركناه” وقال مالك كان رجال من التابعين تبلغهم عن غيرهم الأحاديث فيقولون:” ما نجهل هذا ولكن مضى العمل على غير.” وقال النخعي:” لو رأيت الصحابة يتوضؤون إلى الكوع لتوضأت إليه وأنا أقرؤها إلى المرافق.” وقال ابن عبد البر في كتاب العلم:” ليس أحد من علماء الأمة يثبت عنده حديث عن رسول الله صلى الله عليه وسلم بشيء ثم يرده إلا بإدعاء نسخ أو معارضة أثر غيره أو إجماع أو عمل يجب على أصله الانقياد إليه أو طعن في سنده ولو فعل ذلك بغير ذلك لسقطت عدالته فضلا عن أن يتخذ إماما.” .إهـ\nولمزيد توضيح إليك ما يلي : روى رفع الايدي في الصلاة زيادة على تكبيرة الاحرام عن رسول الله صلى الله عليه وسلم نيف وثلاثون من الصحابة وقال ابن المديني :”هذا الحديث عندي حجة على الخلق كل من سمعه عليه أن يعمل به.” والإمام مالك رواه ولم يعمل به في المتفق عليه في مذهبه.\nومع كثرة من رواه من الصحابة لم يعمل به أيضا أبو حنيفة وكثير من الأئمة كالثوري والنخعي وابن ابي ليلى والاسود بن يزيد وعلقمة بن قيس والشعبي وأبو اسحاق السبيعي وجميع أهل الكوفة وإنما اعتمدوا عدم الرفع لثبوت العمل بعدمه وعلى أنه منسوخ .\nومن بين الصحابة الذين ثبتت الرواية عنهم بالرفع عبد الله ابن عمر ورواه عنه الامام مالك في الموطأ قال:” أن رسول الله صلى الله عليه وسلم كان إذا افتتح الصلاة رفع يديه حدو منكبيه وإذا رفع رأسه من الركوع رفعهما كذلك….”.الحديث. غير أن العمل عنده ثبت بعدم الرفع .\nأخرج الطحاوي بسند صحيح عن مجاهد قال:” صليت خلف ابن عمر فلم يكن يرفع يديه إلا في التكبيرة الأولى من الصلاة .”وأخرج ابن أبي شيبة في مصنفه عن مجاهد قال:” ما رأيت ابن عمر يرفع يديه إلا في أول ما يفتتح.” . وممن ثبت عنهم أيضا الرفع من الصحابة بالحديث الصحيح الإمام علي كرم الله وجهه غير أن العمل عنده بخلافه.\nقال العيني وفي البدائع عن ابن عباس أنه قال:” العشرة الذين شهد لهم رسول الله صلى الله عليه وسلم بالجنة ماكانوا يرفعون أيديهم إلا في افتتاح الصلاة . ” ومن الأحاديث التي خالف عمل الامام مالك روايته في الموطأ مارواه عن عمر ابن الخطاب أنه قرأ سجدة وهو على المنبر يوم الجمعة فنزل فسجد وسجد الناس معه…”.الحديث. فقال الامام مالك:” ليس العمل على أن ينزل الامام إذا قرأ السجدة على المنبر فيسجد. “وهذا منهجه رحمه الله في رد الحديث إذا كان مخالفا لعمل أهل المدينة وإن كان هذا الخبر في ظاهره صحيحا مرويا عنده في الموطأ.\nروى أبو داوود (الحديث رقم 727) عن وائل ابن حُجْرقال :”ثم وضع يده اليمنى على ظهر كفه اليسرى والرسغ والساعد ،وقال فيه :” ثم جئت بعد ذلك في زمان فيه برد شديد فرأيت الناس عليهم جل الثياب تحرك أيديهم تحت الثياب”.قال محمد عابد مفتي المالكية بمكة المكرمة في رده على رسالة بن معزوز التونسي ما نصه: “ويعلم أنه آخر فعله صلى الله عليه وسلم من حديث وائل ابن حُجرإذ لم يروي أحد عنه في المجيء الثاني القبض بل قد نص نفسه أنهم يحركون أيديهم وهو ظاهر في السدل كما علمت” إهـ . وتحريك اليدين لايتيسر إلا بتكلف ظاهر لمن كان قابضا يديه .\nالمرحلة الثالثة: في كون السدل من فعل مجموعة من أئمة السلف الصالح وأنه غير محصور في المذهب المالكي فقط.\n{إشكال }: كيف نترك الأيات والأحاديث الصحيحة ونقلد الأئمة في اجتهادهم المحتمل للخطأ ؟\nالجواب :\nكما قال الشيخ عليش المصري :” إن تقليد الأئمة في اجتهادهم ليس تركا للأيات والأحاديث بل هو عين التمسك والأخذ بالايات والاحاديث الصحيحة فإن القرآن ما وصل إلينا إلا بواسطتهم مع كونهم اعلم منا بناسخه ومنسوخه ومطلقه ومقيده ومجمله ومبينه ومتشابهه ومحكمه وأسباب نزوله ومعانيه وتأويلاته ولغاته وسائر علومه وتلقيهم ذلك عن التابعين المتلقين ذلك عن الصحابة المتلقين عن الشارع صلوات الله عليه وسلامه المعصوم من الخطأ الشاهد للقرون الثلاثة بالخيرية وكذلك الأحاديث ماوصلت إلينا إلا بواسطتهم مع كونهم اعلم ممن بعدهم بصحيحها وحسنها وضعيفها ومرفوعها ومرسلها ومتواترها وآحادها ومعضلها وغريبها وتاويلها وتاريخها المتقدم والمتأخر والناسخ والمنسوخ وأسبابها ولغاتها وسائر علومها مع تمام ضبطهم وتحريرهم لها وكمال إدراكهم وقوة ديانتهم واعتنائهم وتفرغهم ونور بصائرهم. “إهـ\nوالتارك للتقليد يقول:” قال الله أو قال رسول الله صلى الله عليه وسلم” مستقلا بفهمه مع عجزه عن ضبط آية أو حديث أو وصل سنده فضلا عن معرفة سائر علومه فأنظر أيهما يقدم قول المقلد قال الامام مالك المجمع على إمامته فاهما من كلام الله أو من كلام رسول الله أو قول الجَهُول قال تعالى أو قال الرسول صلى الله عليه وسلم.\nومن المعروف أن المدونة هي أشهر كتب السادة المالكية وأوثقها وهي رواية ابن القاسم ،وقد نقل الإمام الخرشي في شرحه على مختصر خليل :”أنها بالنسبة إلى غيرها من كتب المذهب كالفاتحة في الصلاة تجزيء عن غيرها ولايجزيء غيرها عنها” ومثله قاله الدسوقي في حاشيته على الشرح الكبير.وقد نصت بوضوح تام لايقبل التأويل على الارسال قال فيها الإمام مالك في وضع اليمنى على اليسرى :” لاأعرف ذلك في الفريضة ولكن في النوافل إذا طال القيام فلا بأس بذلك” يعين به نفسه.\nوقول القائلين بأنها رواية شاذة هو القول الشاذ وكيف تكون كذلك وقد صحت عمن هو أقدم من الإمام مالك يحكيها عن أهل المدينة كلهم روى الإمام أبو زرعة المتوفي سنة 281هـ في تاريخه بسند صحيح وهو على شرط البخاري عن بكر بن عمرو: أنه لم يرأبا أمامة يعني ابن سهل واضعا إحدى يديه على الأخرى قط ولا أحدا من أهل المدينة حتى قدم الشام فرأى الأوزاعي وناسا يضعونه. وأخرجه ابن عساكر باسناده في تاريخه من طريق أبو زرعة .\nوالإرسال هو الثابت في الصلاة عن أعلام السلف الصالح .\nــ وهو الصحيح من مذهب إبن الزبير رضي الله عنه فيما رواه ابن أبي شيبة في المصنف ج1ص344 طبعة مكتبة الرشد الرياض الطبعة الاولى 1409 بتحقيق كمال يوسف الحوت في باب من كان يرسل يديه في الصلاة برقم 3950وبسند رجاله رجال الستة : “حدثنا عفان قال حدثنا يزيد بن ابراهيم قال سمعت عمرو بن دينار قال:” كان بن الزبير إذا صلى يرسل يديه. ” وابن الزبير هو عبد الله ابن الزبير أول مولود للمهاجرين بالمدينة المنورة.\nأخرج الخطيب البغدادي في تاريخه عن أحمد ابن حنبل قال:” حدثني عبد الرزاق قال:” أهل مكة يقولون :”أخذ بن جريج الصلاة عن عطاءعن بن الزبير وأخذها ابن الزبير عن أبي بكر( الصديق ) وأخذها أبوبكر عن النبي صلى الله عليه وسلم .”وإبن الزبير كما تقدم بالسند الصحيح كان السدل صفة صلاته .\nواعترض صاحب الروضة الندية على هذه الرواية فقال:” أنها شاذة مخالفة لما روى الثقات عنه مما أخرجه أبوداوود عن زرعة قال:” سمعت ابن الزبير يقول:” صف القدمين ووضع اليد على اليد من السنة.” قال:” وإن سلم كونها صحيحة فهذه فعله والفعل لاعموم فيه ” ورواية الوضع عنه مرفوعة لأنه نسبه إلى السنة.\nوقول الصحابي من السنة في حكم المرفوع كما حقق في كتب اصول الحديث وفهم الصحابي ليس بحجة ولاسيما إذا خالف أجلة الصحابة .\nوقال في الرد عليه صاحب إبرام النقض واعتراضه هذا ساقط من وجوه : (الأول) قوله أنها شاذة لمخالفته لما روى الثقات عنه فيه أن هذا لايسمى شذودا وإنما يقال له مخالفة عمل الراوي لروايته والشاذ هو ما خالف الراوي من هو أوثق منه أو أكثر عددا والروايتان لامخالفة بينهما أصلا لأن إحداهما عن روايته والأخرى عن عمله .إهـ والحديث الذي قال عنه رواه عنه الثقات ضعيف وقوله ليس بحجة ولاسيما إذا خالف أجلة الصحابة يرده ما رواه أبو داوود بسند صحيح قال ابن عباس رضي الله عنهما : “إن أحببت أن تنظر إلى صلاة رسول الله فاقتد بصلاة عبد الله بن الزبير. “وعمل ابن الزبير المخالف لروايته يشهد على النسخ لروايته. قال علي القاري في شرح الشفا :”أن الراوي إذا عمل بخلاف روايته دل ذلك على أن حديثه منسوخ أو توهم في نقله ورجع عنه بفعله .”\nــ وهو الصحيح من مذهب إبن جريج رواه عنه عبد الرزاق في مصنفه ج2 ص276 قال أبو بكر:” ورأيت بن جريج يصلي في إزار ورداء مسبل يديه. ” .\nروى الخطيب البغدادي في تاريخه عن يحيى إبن معين يقول أصحاب الحديث خمسة فذكر إبن جريج فيهم وعن أحمد ابن حنبل قال: قال عبد الرزاق مارأيت أحدا أحسن صلاة من بن جريج والسدل هو صفة صلاته .\nـــ وهو الصحيح من مذهب ابن المسيب فيما رواه عنه ابن ابي شيبة في المصنف ج12ص344 عن عبد الله بن يزيد قال:” ما رأيت ابن المسيب قابضا يمينه في الصلاة كان يرسلهما .” وابن المسيب تابعي جليل من أشياخ مالك وهو من السبعة الذين أخذ عنهم عمل أهل المدينة .\nوابن المسيب أدرك كبار الصحابة العشرة المبشرين بالجنة ماعدا ابا بكر الصديق وهو لم يغب عن المدينة يوما إلا للحج إلى أن مات بها وإذا كان مذهبه الإرسال في الصلاة ، فكيف يصح منه أن يعمل على خلاف ما أدرك عليه هذا الجم الغفير من الصحابة مع فضله وديانته وهذا الرجل لوحده كاف على ثبوت كون عمل أهل المدينة على الإرسال .\nــ وهوالصحيح من مذهب سعيد ابن جبير فيما رواه عنه ابن ابي شيبة في المصنف عن عبد الله ابن العيزار قال: كنت أطوف مع سعيد بن جبير فرأى رجلا يصلي واضعا إحدى يديه على الأخرى هذه على هذه أو هذه على هذه فذهب ففرق بينهما ثم جاء وابن جبير تابعي جليل.\nـــ وهوالصحيح من مذهب الحسن ومغيرة فيما رواه ابن ابي شيبة في المصنف عن يونس عن الحسن ومغيرة عن ابراهيم أنهما كانا يرسلان أيديهما في الصلاة.\nوالحسن هو الحسن المثنى والد عبد الله الكامل وعنه أيضا روى الامام مالك السدل في الصلاة قال العلامة شعيب الدكالي رحمه الله :” لما سئل عن السدل في الصلاة قال: سئل إمامنا مالك رحمه الله لماذا يسدل يديه في الصلاة؟ فقال: رأيت من هو خير أهل الأرض يفعله ويعني به سيد التابعين عبد الله الكامل ابن الحسن المثنى بن الحسن السبط رضي الله عنهم وولده سيدي محمد النفس الزكية وأخاه الامام إدريس وهو الذي أدخل صلاة السدل إلى المغرب .وفي مرآة المحاسن أن الامام مالك سئل عن السدل فقال :”رأيت من يقتدى بفعله عبد الله بن الحسن يفعله. ”\nـــ وهو الصحيح من مذهب ابراهيم النخعي فيما رواه عبد الرزاق في المصنف عن الثوري وهشيم أو أحدهما عن مغيرة عن ابراهيم أنه كان يصلي مسدلا يديه.\nـــ وهو الصحيح من مذهب ابن سيرين فيما رواه ابن أبي شيبة في مصنفه المجلد 3 ص 325 عن ابن سيرين أنه سئل عن الرجل يمسك يمينه بشماله قال:” إنما فعل ذلك من أجل الدم. ”\nــ وهو الصحيح من مذهب الليث بن سعد وكان كما هو معروف ذو صلة كبيرة بالامام مالك قال ابن عبد البر في التمهيد بعد ان ذكر أحاديث القبض وقال الليث ابن سعد:” سدل اليدين في الصلاة أحب إلي إلا أن يطيل القيام فيعيا فلا بأس أن يضع اليمنى على اليسرى.” وقال النووي في المجموع:” قال الليث بن سعد يرسلهما فإن طال ذلك عليه وضع اليمنى على اليسرى. ”\nــ وهو مذهب الأوزاعي بالتخيير قال محدث الهند الشهير بالكندهلوي في كتابه أوجز المسالك على موطأ الإمام مالك ما نصه قال العيني وحكى ابن المنذر عن عبد الله ابن الزبير والحسن البصري وابن سيرين أنه يرسلهما وكذلك عند مالك في المشهور عنه وقاله الليث ابن سعد وقال الاوزاعي هو مخير بين الوضع والارسال. وذكره النووي في مجموعه وقال الاوزاعي مخير بين الوضع والارسال .\nـــ وهو مذهب الثوري كما في مصنف عبد الرزاق عن الثوري وهشيم أوأحدهما عن مغيرة عن ابراهيم يعني النخعي أنه كان يصلي مسدلا يديه .\nوإذا كان السدل ثبت عن الأئمة مالك والثوري والأوزاعي والليث ابن سعد كما مر ومما هو مقرر في الكتب المعتمدة فإن هؤلاء الاربعة حجة بدليل أن الامام أحمد إحتج بهم على عدم وجوب الفاتحة على المأموم ففي المغني لابن قدامة ما نصه : قال أحمد: وهذا مالك في أهل الحجاز وهذا الثوري في اهل العراق وهذا الاوزاعي في اهل الشام وهذا الليث بن سعد في اهل مصر لم يقولوا أن من أنصت لقراءة إمامه ولم يقرأ هو صلاته باطلة. وإذا كان الأمر كذلك فالإحتجاج بهم للسدل حجة .\nوبهذه النقول يتضح لكل منصف ثبوت السدل في الصلاة فمذهب أئمته ابن الزبير وعطاء وابن جريج وابن المسيب وسعيد ابن جبير وابن سيرين وابراهيم النخعي ومالك والحسن البصري والليث بن سعد وجميع أهل المدينة لهو مذهب جدير بالاحترام والنظر إليه كقول معتمد وليس كرأي مخالف للهدي النبوي والعياذ بالله . فرواية بكر بن عمرو المتقدمة الصحيحة كفيلة بجعل السدل أصح من القبض إذ هو عمل أهل المدينة الذين قبض النبي صلى الله عليه وسلم بين أظهرهم أي أنه من آخر أعماله صلى الله عليه وسلم .\nأما ما ورد عن الامام الترمذي في سننه بعد أن ذكر حديث هلب وحسنه ما نصه : والعمل على هذا عند أهل العلم من أصحاب النبي صلى الله عليه وسلم والتابعين ومن بعدهم يرون أن يضع الرجل يمينه على شماله في الصلاة فلا يناقض ما نحن فيه لأنه ذكر ما رآه وسمعه وكذلك الحال في بكر بن عمرو فهو ذكر ما رآه وعاصره بالمدينة وهو أقدم من الترمذي بكثيروأسَنُ من الإمام مالك فيكون قوله هذا حجة قوية للمالكية في مذهبهم .\nالمرحلة الرابعة: عبارة عن جولة في كتب شراح الحديث والفقهاء المعتمدين على إختلاف مذاهبهم في تقرير السدل في المذهب المالكي دون إنكار منهم ولا تبديع.\nـــ وهذه مجموعة من النقول للإستئناس من كتب علماء الأمة في تقرير السدل في المذهب المالكي :\n1ـ فتح الباري لابن حجر العسقلاني ج2 ص224: وروى ابن القاسم عن مالك الإرسال وصار إليه أكثر أصحابه وعنه التفرقة بين الفريضة والنافلة.\n2ــ شرح النووي على مسلم ج4 ص114 : وعن مالك رحمه الله روايتان إحداهما يضعهما تحت صدره والثانية يرسلهما ولايضع إحداهما على الأخرى وهذه رواية جمهور أصحابه وهي الأشهر عندهم وهو مذهب الليث .\n3ــ وفي عمدة القاري شرح صحيح البخاري للعيني بعد أن تكلم على القبض حكى أن إبن المنذر عن عبد الله بن الزبير والحسن البصري وابن سيرين أنه يرسلهما.\n4ــ قال ابن بطال في شرحه على البخاري : اختلف العلماء اختلف في هذا الباب يعني باب وضع اليد على اليد فاستحبت طائفة وضع اليد على اليد ورأت طائفة الإرسال وروي ذلك عن عبد الله بن الزبير والحسن البصري وابن سيرين وسعيد ابن المسيب ورأى سعيد بن جبير رجلا واضعا يمناه على شماله ففرق بينهما وقال عطاء :”من شاء فعل (القبض) ومن شاء ترك (هُـ) ” والاوزاعي كذلك.\n5ــ المغني لابن قدامة ج1ص281 :وظاهر مذهبه (الإمام مالك) الذي عليه أصحابه إرسال اليدين وروى ذلك عن ابن الزبير والحسن.\n6ــ مختصر اختلاف العلماء للطحاوي ج1ص202: وقال مالك :”وضع اليدين إحداهما على الأخرى في الصلاة إنما يفعل في صلاة النوافل في طول القيام وتركه أحب إلي.” وقال الليث:” سدل اليدين في الصلاة أحب إلي إلا أن يطيل القيام فلا بأس أن يضع يده اليمنى على ذراعه اليسرى.” وقال الاوزاعي:” من شاء فعل ومن شاء ترك . ”\n7ــ سبل السلام لمحمد ابن اسماعيل الصنعاني الامير ج1ص169: وروى عن مالك الإرسال وصار إليه أكثر أصحابه.\n8ــ نيل الاوطار للشوكاني ج2ص201: وروى ابن المنذر عن ابن الزبير والحسن البصري والنخعي أنه يرسلهما ولايضع اليمنى على اليسرى ونقله النووي عن الليث بن سعد ونقله المهدي في البحر عن القاسمية والناصرية والباقر ونقله ابن القاسم عن مالك وخالفه ابن الحكم فنقل عن مالك الوضع والرواية الاولى عنه هي رواية جمهور أصحابه وهي المشهورة عندهم ونقل ابن سيد الناس عن الاوزاعي التخيير بين الوضع والارسال.\n9ــ المجموع لمحي الدين النووي ج3ص258 : وحكى ابن المنذر عن عبد الله ابن الزبير والحسن البصري أنه يرسل يديه ولايضع إحداهما على الاخرى وحكاه القاضي أبو الطيب أيضا عن ابن سيرين وقال الليث ابن سعد:” يرسلهما فإن طال ذلك عليه وضع اليمنى على اليسرى للاستراحة .” وقال الأوزاعي :”هو مخير بين الوضع والارسال ” وروى ابن عبد الحكم عن مالك الوضع وروى عنه ابن القاسم الإرسال وهو الأشهر وعليه جميع أهل المغرب من أصحابه أو جمهورهم.\n10ــ عون المعبود لأبو الطيب محمد شمس الحق العظيم آبادي ج2ص322: وروى ابن القاسم عن مالك الإرسال وصار إليه أكثر أصحابه وعنه التفرقة بين الفريضة والنافلة\n11ــ تفسير القرطبي ج20ص221: ورأت جماعة إرسال اليد وممن روينا ذلك عنه ابن المنذر والحسن البصري وابراهيم النخعي وهو مروي أيضا عن مالك قال ابن عبد البر:” إرسال اليدين ووضع اليمنى على الشمال كل ذلك من سنة الصلاة . ”\n12ــ غاية المأمول شرح التاج الجامع للأصول للشيخ منصور علي ناصف المجلد الاول: وقال مالك :” إنه مكروه في الفرض مندوب في النفل.” وقال الاوزاعي وابن المنذر إنه بالخيار …. وروى عن الحسن البصري والنخعي والليث بن سعد أنه يرسلهما.\n13ــ حلية العلماء في معرفة مذاهب الفقهاء ج2ص82 للشاسي القفال: ثم يأخد كوعه الأيسر بكفه الايمن وبه قال أبو حنيفة وأحمد وداوود واختلفت الرواية عن مالك فروي عنه ماذكرناه وروي عنه أنه يرسل يديه إرسالا وروي ذلك عن الحسن البصري وابن سيرين وقال الليث بن سعد:” أنه يرسل يديه إلا أن يطيل القيام فيعيا.” وقال الاوزاعي:” من شاء فعل ومن شاء ترك .”\n14ــ التمهيد لإبن عبد البر ج20ص75: قال الليث :” سدل اليدين في الصلاة أحب إلي إلا أن يطيل القيام فيعيا فلابأس أن يضع اليمنى على اليسرى .” قال عبد الرزاق:” رأيت ابن جريج يصلي في إزار ورداء مسدلا يديه.” وقال الاوزاعي:” من شاء فعل ومن شاء ترك.” وهو قول عطاء. وقال في كتابه الكافي :” ووضع اليمنى على اليسرى وإسالهما كل ذلك سنة في الصلاة.”\n15ــ كتاب غاية البيان في شرح زبد ابن رسلان ج1ص94: “والقصد من وضع اليمنى على اليسرى تسكين يديه فإن أرسلهما بلا عبث فلا بأس . ”\n16ــ تحفة الفقهاء لمحمد بن أحمد السمرقندي الحنفي ج1ص126: وقال مالك:” السنة هي إرسال اليدين حالة القيام.”\n17ــ النوازل الجديدة الكبرى أو المعيار الجديد: ذكر صاحب مرآة المحاسن أن الامام مالك رضي الله عنه سئل عن السدل فقال:” رأيت من يقتدى بفعله عبد الله بن الحسن يفعله.” إهـ وعبد الله هذا هو والد الإمام إدريس الأكبر رضي الله عنه .\n18ــ عوارف المعارف الباب السابع والثلاثون في وصف صلاة أهل القرب: ويستغني حينئذ عن مقاومة النفس ومنع جواذبها بوضع اليمنى على الشمال فيسبل حينئذ ولعل لذلك والله أعلم مانقل عن رسول الله صلى الله عليه وسلم أنه صلى مسبلا وهو مذهب مالك رحمه الله\n19ــ قال الشيخ عليش في شرحه على المختصر مانصه: وبقي من تأويل كراهة القبض مخالفته لعمل الصحابة والتابعين من أهل المدينة الدال على نسخه وإن صح به الحديث.\n20ــ كتاب مصنف عبد الرزاق ج2ص276: باب الرجل يصلي مرسلا يديه أو يضمهما: ورأيت ابن جريج يصلي في إزار ورداء مسبل يديه.\n21ــ مصنف الامام ابن ابي شيبة: باب من كان يرسل يديه في الصلاة .\n22ــ أخرج الأوزاعي في مسنده عن عبد الله بن مسعود رضي الله عنه قال : ترك رسول الله صلى الله عليه وسلم القبض في صلاة الفريضة وسدل يديه فيها في آخر عمره قبل أن يموت بست وثلاثين يوما أو ليلة. وهذا الاثر نقلته من كتاب لأحد الاساتذة الجامعيين من تطوان ولم أقف عليه في مسند الاوزاعي لعدم توفري عليه .\n23ـــ قال العلامة الامير في الكوكب المنيرمانصه: والأمر في قبض اليدين وسدلهما واسع والتفصيل هو مذهب المدونة قال فيها ولايضع يمناه على يسراه في فريضة وذلك جائز في النوافل لطول القيام .\n24ــ قال ابن ابي خيثمة في تاريخه : أخبرنا مصعب قال : مارأيت أحدا من علمائنا يكرمون أحدا ما يكرمون عبد الله ابن الحسن ابن الحسن وعنه روى مالك الحديث في السدل.\n25ــ الميزان للشعراني قال فيه : أن الشافعي قال في كتابه الأم : وإن أرسلهما ولم يعبث بهما فلا بأس .\n26ــ مغني المحتاج في فقه الشافعي : قال الامام والقصد من القبض المذكور تسكين اليدين فإن أرسلهما ولم يعبث بهما فلا باس كما نص عليه في الأم .\n27ــ فقه العبادات عند الشافعي : ولأن وضع اليد على اليد أسلم له من العبث وأحسن في التواضع والتضرع والتذلل فإن أرسلهما ولم يعبث لم يضر.\n28ــ فتح الوهاب بشرح منهج الطلاب للشيخ زكريا الأنصاري ج1ص86: والقصد من القبض المذكور تسكين اليدين فإن أرسلهما ولم يعبث فلابأس نص عليه في الأم.\nوقال أيضا في سنى المطالب شرح روض الطالب الباب الرابع في صفة الصلاة: صرح البغوي بكراهة الإرسال لكنه محمول على من لا يأمن العبث لقول الشافعي في الأم والقصد من وضع اليمنى على اليسرى تسكين يديه فإن أرسلهما بلا عبث فلا بأس.\n29ــ تحفة الأحوذي بشرح جامع الترمذي للمباركفوري: وقال المالكية بإرسال اليدين في الصلاة.\n30ــ الشرح الكبير للدردير ج1ص250: (و) ندب لكل مصل مطلقا (سدل) أي إرسال (يديه) لجنبيه.\n31ــ شرح سنن إبن ماجة للمغلطاي: ولمالك روايتان: إحداهما كقولنا والثانية أنه غير مستحب إنما هو مباح وفي المدونة يكره فعله في الفرض ولا بأس به في النافلة إذا طال القيام وقال أبو عمر : رواية ابن القاسم عنه إرسال اليدين وهو قول الليث.\n32ــ العرف الشذي شرح سنن الترمذي للكشميري: (عند شرحه للحديث رقم 252)قال : خلافا لمالك فإنه يقول بإرسال اليدين خلاف الثلاثة.\n33ــ الأوسط في السنن والاجماع والاختلاف لإبن المنذر: قال وقد روينا عن غير واحد من أهل العلم أنهم كانوا يرسلون أيديهم في الصلاة إرسالا ولايجوزأن يجعل إغفال من أغفل استعمال السنة أو نسيها أو لم يعلمها حجة على من علمها وعمل بها (كيف يقال في ابن الزبير أنه نسي أو لم يعلم القبض وهو الذي تربى وأخذ دينه عن جده أبي بكر الصديق رضي الله عنهما ) فممن روينا عنه أنه كان يرسل يديه عبد الله ابن الزبير والحسن البصري وابراهيم النخعي وابن سيرين وُروي أن سعيد ابن جبير رأى رجلا يصلي واضعا إحدى يديه على الأخرى فذهب ففرق بينهما.\n34ــ فتح الباري شرح صحيح البخاري لإبن رجب الحنبلي: كتاب الصلاة: وحكى ابن المنذر إرسال اليدين في الصلاة عن ابن الزبير والحسن والنخعي…… قال: وقال الليث:” سدل اليدين في الصلاة أحب إلي إلا أن يطول القيام فلابأس أن يضع اليمنى على اليسرى .” وقال الاوزاعي:” من شاء فعل ومن شاء ترك .” وهوقول عطاء قلت وحكي رواية عن أحمد وحكي عنه: أنه يرسل يديه في النوافل خاصة وهذا عكس ما نقله ابن القاسم عن مالك.\n35ــ الفروع لابن مفلح الحنبلي : باب صفة الصلاة: وعن أحمد أو يرسلهما.\n36ــ إعانة الطالبين للدمياطي: قال في شرح الروض بل صرح البغوي بكراهة الإرسال لكنه محمول على من لم يأمن العبث .\n37ــ الفقه الاسلامي وأدلته لوهبة الزحيلي : قال الجمهور غير المالكية:” يسن بعد التكبير أن يضع المصلي يده على ظهر كف ورسغ اليسرى … “وقال المالكية:” يندب ارسال اليدين في الصلاة. ”\n38ــ الشرح الكبير أو فتح العزيز بشرح الوجيز للرافعي القزويني المتوفي 623هـ وهو شرح الوجيز لأبي حامد الغزالي في الفقه الشافعي: ج3 ص273:” يسن بعد التكبير وحط اليدين من رفعهما أن يضع اليمنى على اليسرى خلافا لمالك في احدى الروايتين عنه حيث يرسلهما.”"}, {"q": "يرى البعض ان الألتزام بعدد معين عند القيام بالأذكار يشكل بدعة، ما رأيكم", "a": "عن مولاتنا عائشة أم المؤمنين رضي الله عنها قالت: قال رسول الله صلى الله عليه وسلم:” ياأيها الناس خذوا من الأعمال ماتطيقون فإن الله لايمل حتى تملوا وإن أحب الأعمال إلى الله مادام وإن قل.” وفي رواية:” وكان آل محمد إذا عملوا عملا أثبتوه.” وفي رواية قالت:” إن رسول الله صلى الله عليه وسلم سئل أي الأعمال أحب إلى الله قال:” أدومه وإن قل.”\nوفي رواية البخاري ومسلم أن رسول الله صلى الله عليه وسلم قال:” أحب الأعمال إلى الله أدومها وإن قل .” وللامام مالك والبخاري أيضا قالت:” كان أحب الأعمال إلى الله عز وجل الذي يدوم عليه صاحبه.” ولمسلم:” كان أحب الأعمال إلى الله أدومها وإن قل.” وكانت عائشة رضي الله عنها إذا عملت العمل لزمته. وروى الترمذي عنها كان أحب الأعمال إلى رسول الله صلى الله عليه وسلم ماديم عليه وفي رواية له سئلت عائشة وأم سلمة رضي الله عنهما :” أي العمل كان أحب إلى رسول الله صلى الله عليه وسلم؟ ” قالتا :” ما ديم عليه وإن قل.”\nوروى ابن حبان في صحيحه عن أم سلمة قالت:” كان أحب العمل إلى رسول الله صلى الله عليه وسلم ما داوم عليه العبد وإن كان شيئا يسيرا.” قال الشيخ سيدي محمد الحافظ المصري رضي الله عنه:” ومن البين أن من داوم على قدر من الذكر لابد أن يكون معلوما محدودا ولذلك قال صلى الله عليه:” وإن قل.”\nفمن استغفر الله في اليوم مائة وخمسين مرة ومائة و سبعين مرة في يوم آخر ومائة مرة في غيرها من أيامه ، فالمائة التي داوم عليها هي أحب الأعمال إلى الله وإلى رسول الله صلى الله عليه وسلم والقدر الذي لم يداوم عليه ذكر محبوب ومن داوم على المائة مرة من أول الأمر فقد أتى العمل الأحب إلى الله عز وجل وإلى رسوله صلى الله عليه وسلم وقس على ذلك في التهليل والتسبيح والتكبير والصلاة على مولانا رسول الله صلى الله عليه وسلم وكل أعمال البر . وهذا التحديد موكول إلى كل عامل بحسب ما يرى مما لايشق عليه والناس في ذلك تتفاوت استطاعاتهم وهممهم.\nقال رسول الله صلى الله عليه وسلم فيما رواه البخاري في صحيحه : “اكلفوا من الأعمال ما تطيقون فإن الله لا يمل حتى تملوا.” وفي رواية أبي داوود زيادة:” وإن أحب العمل إلى الله أدومه وإن قل وكان إذا عمل عملا أثبته.” فوكل صلى الله عليه وسلم كلا إلى طاقته وهو بها أعرف ، فمن حدد لنفسه قدرا من العبادة (النافلة طبعا) أو ذكرا مما رغبت فيه السنة المطهرة وبعدد معلوم تسهل المداومة عليه وداوم عليه فقد نص صلى الله عليه وسلم على أنه قد جاء بأحب الأعمال إلى الله عز وجل. ومن وافقت طاقته طاقة أخ له فعمل مثل عمله مختارا فلا حرج عليه ، والمؤمنون كالبنيان يشد بعضهم بعضا قال تعالى في سورة المائدة: {وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان}.\nولا ينبغي أن يلتفت إلى من خالف المصطفى صلى الله عليه وسلم وزعم أن مثل هذا التحديد ممنوع فهو خطأ مردود عليه وأن من يزعم أن التحديد بدعة هو أحق بأن يكون هو المبتدع فإنه متقدم بين يدي الله ورسوله صلى الله عليه وسلم يحرم ما أذن فيه المصطفى صلى الله عليه وسلم وحض عليه وجرى عليه عمل أصحابه من بعده .\nروى الترمذي وقال حسن صحيح والحاكم وقال صحيح وأحمد في المسند والنسائي وابن حبان عن سيدنا أبي بن كعب قال:” قلت:” يارسول الله إني أكثر الصلاة فكم أجعل لك من صلاتي؟ ” فقال:” ماشئت!” قلت:” الربع!” قال:” ماشئت! وإن زدت فهو خير لك!” قلت:” النصف!” قال:” ماشئت! وإن زدت فهو خير لك!” قلت:” أجعل لك صلاتي كلها!” قال:” إذن تكفى همك ويغفر ذنبك .” فذكر رضي الله عنه الربع والنصف علامة على مداومته على ذكر معين تحقق عنده عدده. إذن فالبدعة والضلال إنما فيما لا إذن للشرع فيه والتحديد قد جاء الإذن فيه والحجة كلام المعصوم صلى الله عليه وسلم لا كلام سواه.\nوأخرج مسلم في صحيحه عن سيدنا عمر بن الخطاب رضي الله عنه قال:” قال رسول الله صلى الله عليه وسلم:” من نام عن حزبه من الليل أو عن شيء منه فقرأه مابين صلاة الفجر وصلاة الظهر كتب له كأنما قرأه من الليل.” وفي هذا الحديث الشريف الحض على قضاء ما عود المرء نفسه عليه من العبادة والأذكار وماحدده .\nقال الشوكاني في تحفة الذاكرين:” أقول هكذا ينبغي حتى يصدق عليه أنه مديم للذكر مواظب عليه وقد كان الصحابة رضي الله عنهم يقضون مافاتهم من أذكارهم التي كانوا يفعلونها في أوقات مخصوصة .”\nوعن عبد الله بن عمرو بن العاص قال:” قال لي رسول الله صلى الله عليه وسلم:” ياعبد الله لاتكن مثل فلان إنه كان يقوم من الليل فتركه.” أي لم يكن من الموفين بعهدهم إذا عاهدوا كما قال علي القاري . وروى البخاري في صحيحه عن مولاتنا عائشة رضي الله عنها قالت:” قال رسول الله صلى الله عليه وسلم:” من نذر أن يطيع الله فليطعه ومن نذر أن يعصي الله فلا يعصيه.”\nوقال الشاطبي في الاعتصام :” أحب العمل إلى الله ماداوم عليه صاحبه وإن قل فلذلك كان صلى الله عليه إذا عمل عملا أثبته حتى قضى ركعتي ما بين الظهر والعصر بعد العصر.”\nوقال ابن القيم الجوزية في كتابه بدائع الفوائد:” روى موسى بن هارون قال:” مر بي أحمد ابن حنبل ومعه المروزي وأنا في المسجد قبل الزوال أصلي الضحى لأني كنت شغلت عنها فوقف علي فقال:” ماهذه الصلاة؟” فقلت:” ياأبا عبد الله هذه ركعات كنت أصليها ضحى فشغلت عنها حتى هذا الوقت.” قال:” لاتتركها ولو ذكرتها بعد العتمة !” ووجهه قوله أحب العمل الى الله أدومه وإن قل.” رواه البخاري ومسلم والنسائي وغيرهم.\nومن البديهي عند من له أدنى إلمام باللغة العربية أن من يداوم على عبادة لاتكون إلا معلومة محدودة عنده عددا ووقتا.\nفلا فقه ولا علم لمن ينهى عما أقره صلى الله عليه وسلم ودعا له وفهمه عنه الصحابة وعلماء الأمة من بعدهم.\nوبالجملة فالإلتزام بعدد معين عند القيام بالأذكار مما لايشق على صاحبه ومما يطيقه عمل جائز شرعا بل من الأعمال الأحب إلى الله وإلى رسوله صلى الله عليه وسلم.\nروى البخاري عن عبد الله بن عمرو بن العاص رضي الله عنهما قال:” قال لي رسول الله صلى الله عليه وسلم:” إن بحسبك أن تصوم كل شهر ثلاثة أيام فإن لك بكل حسنة عشر أمثالها فإن ذلك صيام الدهر كله. فشددت فشدد علي. قلت:” يارسول الله إني أجد قوة.” قال:” فصم صيام نبي الله داوود عليه السلام ولاتزد عليه.” قلت :”وماكان صيام نبي الله داوود عليه السلام.” قال:” نصف الدهر” فكان عبد الله يقول بعدما كبر:” ياليتني قبلت رخصة النبي صلى الله عليه وسلم !” ، فقول هذا الصحابي الجليل:” يا ليتني قبلت رخصة النبي…” فيه دليل على أنه لا يترك مافارق عليه الرسول صلى الله عليه وسلم حتى ولو كان مما ألزمه هو على نفسه وإلتزم به وعاهد على أدائه وعن طيب خاطره وبقدر معين و حسب قوته وطاقته وهذا هو منهج العارفين والعلماء العاملين مع مايلتزمونه من نوافل ولايتلاعبون بأعمالهم فمن لم يكن في زيادة أو لم يحافظ على الأقل على ماعود نفسه من الخيرفهو في نقصان نعود بالله من السلب بعد العطاء وما هذا كله إلا امتثالا لأمر رسول الله صلى الله عليه وسلم الذي قال لعبد الله بن عمرو بن العاص:” لاتكن مثل فلان إنه كان يقوم من الليل فتركه.” وقوله تعالى:”{ وأوفوا بعهد الله إذا عاهدتم} وقوله تعالى أيضا:”{ ياأيها الذين امنوا لم تقولون مالا تفعلون كبر مقتا عند الله أن تقولوا مالاتفعلون .} ولحديث مولانا رسول الله كما في صحيح البخاري وغيره آية المنافق ثلاث:” إذا حدث كذب وإذا وعد أخلف وإذا اؤتمن خان.”\nفانظر لك أيها السائل الكريم من العبادة على قدر طاقتك بعد أدائك للفرائض على أكمل وجه والتزمه وداوم عليه يكن لك من سنة مولانا رسول الله صلى الله عليه وسلم نصيب."}, {"q": "هل توجد أدلة في الإسلام على وجود أشخاص يسمون بالأقطب و الأبدال …ألخ", "a": "نعم هناك أشخاص يُسَمَّوْنَ بهذه التسميات ، رغم أن كثيرا من الناس ينكرون على أهل الطريق ذكر الأقطاب والأبدال، والأوتاد والأغواث، والنقباء والنجباء،وهو للأسف نوع من التجني و التعصب .\n\nفاستدلالهم مبني على تسليم عدم وجود هذه المراتب في لسان الشرع، وهي ألقاب لرتب ينالها المرء بفضل الله، وسبيلها المجاهدة، كما أن مراتب الاجتهاد ألقاب لما يناله المرء بفضل الله، وسبيله التفقه في الكتاب و السنة.\nفحكمته تعالى اقتضت تفضيل مخلوقاته بعضهم على بعض جماعات و أفرادا إلى قيام الساعة ، و نجد الألفاظ الدالة على التفاضل و التمايز دارجة عند عامة المسلمين و خاصتهم فيقال شيخ الإسلام ، المحدث ، الحافظ ، الحجة ، الفقهاء ، القراء …\n\nشاحنوهم في أسماء الأقطاب و الأبدال و الأوتاد\nو قالوا ما وجدناها في آية ولا حديث صحيح الإسناد\nأفهل وجدوا نصا في ترتيب مراتب الاجتهاد\nأم يحكمون على اصطلاح الأصوليين أيضا بالفساد\n\nو للعلم أن لفظ القطب و الأبدال قد وردت بها أحاديث و آثار عن السلف الصالح وقد كتب الإمام جلال الدين السيوطي في هذا الموضوع جزءًا كريماً سماه الخبر الدال على وجود الأقطاب والأوتاد والنجباء والأبدال، وقد أجاد وأفاد رفع الله درجاته في الفردوس الأعلى .\nوقد جمع السيوطي أكثر ما جاء في هذا الباب من أحاديث صحاح وحسان وضعاف ومراسيل مقبولة على اعتبار أن الحديث الضعيف مجبور بما له من شواهد ومتابعات، وبأنه جاء من طرق متعددة، فارتفع إلى مرتبة الحسن لغيره، فيؤخذ به حتى في الأحكام، كما كان الإمام أحمد يأخذ بالحديث الضعيف إذا كان مجبوراً بالشهرة .\nفمن تلك الأحاديث : ما رواه الطبراني في الأوسط عن سيدنا أنس رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم :” لن تخلو الأرض من أربعين رجلا مثل خليل الرحمن ،فبهم تسقون ،وبهم تنصَرون ، ما مات منهم أحد إلا أبدل الله مكانه أخر” قال قتادة لسنا نشك أن الحسن منهم ( أي البصري ) رضي الله عنه ، قال الحافظ أبو الحسن الهيثمى في مجمع الزوائد إسناده حسن .\n\nومما خرجه الإمام الحافظ السيوطي عن الإمام أحمد في مسنده وأبى داود وابن أبى شيبة وأبى يعلى الحاكم والبيهقى بإسنادهم عن السيدة أم سلمة زوج النبي صلى الله عليه وسلم أنه قال : “يكون اختلاف عند موت خليفة فيخرج رجل من المدينة هاربا إلى مكة فيأتيه ناس من أهل مكة ويخرجوه وهو كاره فيبايعونه بين الركن والمقام ويبعث إليه بعث من الشام فيخسف بهم بالبيداء بين مكة والمدينة فإذا رأى الناس ذلك أتاه أبدال أهل الشام وعصائب أهل العراق فيبايعونه.”\n\nوكذلك مما خرجه الإمام السيوطي عن الحافظ ابن نعيم ابن عساكر عن الإمام ابن مسعود رض الله عنه أنه قال : قال رسول الله صلى الله عليه وسلم:” إن لله عز وجل في الخلق ثلاثمائة قلوبهم على قلب آدم عليه السلام ،ولله في الخلق أربعون قلوبهم على قلب موسى عليه السلام ولله في الخلق سبعة قلوبهم على قلب إبراهيم عليه السلام ولله في الخلق خمسة قلوبهم على قلب جبريل عليه السلام ، ولله في الخلق ثلاثة قلوبهم على قلب ميكائيل عليه السلام ولله في الخلق واحد قلبه على قلب إسرافيل عليه السلام\nفإذا مات الواحد أبدل الله مكانه من الثلاثة ،وإذا مات من الثلاثة أبدل الله مكانه من الخمسة وإذا مات من الخمسة أبدل الله مكانه من السبعة وإذا مات من السبعة أبدل مكانه من الأربعين ، وإذا مات من الأربعين أبدل الله مكانه من الثلاثمائة وإذا مات من الثلاثمائة أبدل الله مكانه من العامة. “.\n\nوإلى جانب الإمام الحافظ جلال الدين السيوطي قرر الفقيه المحدث الإمام شهاب الدين أحمد ابن حجر الهيثمى في فتاويه ما قرره الإمام السيوطي رضي الله تعالى عنهما فيقول :\nورجال الغيب سُموا بذلك لعدم معرفة أكثر الناس لهم رأسهم القطب الغوث الفرد الجامع جعله الله دائرا في الآفاق الأربعة لأركان الدنيا كدوران الفلك في أفق السماء وقد ستر الله أحواله عن الخاصة والعامة غِيرَةً عليه غير أنه يُرى عالما كجاهل وأبله كفطن وتاركا أخذا بعيدا سهلا عسرا،أمنا حذرا ،ومكانته من الأولياء كالنقطة من الدائرة التي هي مركزها به يقع صلاح العالم .\nوالأوتاد هم أربعة لا يطلع عليهم إلا الخاصة واحد باليمن وواحد بالشام وواحد بالمشرق وواحد بالمغرب\nوالأبدال وهم سبعة على الأصح ،وقيل ثلاثون وقيل أربعة عشر كذا قاله اليافعى والأصح إنهم سبعة\nوالنقباء وهم أربعون والنجباء وهم ثلاثمائة … فإذا أراد الله قيام الساعة آماتهم أجميعن ، وذلك أن الله يدفع عن عباده البلاء بهم وينزل بهم قطر السماء."}, {"q": "هل التصوف هو هرطقة في الإسلام و لماذا أنكره العلماء على مر الأزمان", "a": "اعلم وفقني الله وإياك إلى ما يحب ويرضى أن المسلمون بعد رسول الله صلى الله عليه وسلم لم تعرف في أجيالهم تسمية سوى صحبة الرسول صلى الله عليه وسلم إذ لا مقام فوقها فقيل لهم “الصحابة” فلما أدركهم العصر الثاني سمي أهله “بالتابعين” ورأوا ذلك أشرف اسمٍ ثم قيل لمن بعدهم “أتباع التابعين” ومن بعدهم اختلف الناس في توجهاتهم فقيل لمن غلبت عليه شدة العناية بأمر الدين الزهاد والعباد ثم انفردوا بعد ذلك باسم “الصوفية” .\nيقول الشاطبي في كتابه الاعتصام :” إن كثيرا من الجهال يعتقدون (في الصوفية) أنهم متساهلون في الإتباع ، والتزام ما لم يأت في الشرع التزامه، مما يقولون به ويعملون عليه ، وحاشاهم من ذلك أن يعتقدوه أو يقولوا به.”\nفذكر أن المسلمين بعد رسول الله صلى الله عليه وسلم لم يَتسَم أفاضلهم في عصرهم باسم عَلمٍ سوى الصحبة إذ لا فضيلة فوقها ثم سمي من يليهم التابعون ثم اختلف الناس وتباينت المراتب فقيل لخواص الناس ممن لهم شدة عناية في الدين الزهاد والعباد.\nقال ثم ظهرت البدع وادعى كل فريق أن فيهم زهادا وعبادا فانفرد خواص أهل السنة المراعون أنفسهم مع الله والحافظون قلوبهم عن الغفلة باسم” التصوف “هذا معنى كلامه فقد عد هذا اللقب مخصوصا بإتباع السنة ومباينة البدعة وفي ذلك ما يدل على خلاف ما يعتقده الجهال ومن لا عبرة به من المدعين للعلم . وقال أيضا في كتابه الموافقات :” وقد بنو نحلتهم على إتباع السنة وهم باتفاق أهل السنة صفوة الله من الخليقة.”\nويقول ابن خلدون في مقدمته أن طريقة هؤلاء “القوم” (الصوفية) لم تزل عند سلف الأمة وكبارها من الصحابة والتابعين ومن بعدهم طريقة الحق والهداية وأصلها العكوف على العبادة والانقطاع إلى الله تعالى والإعراض عن زخرف الدنيا وزينتها والزهد فيما يقبل عليه الجمهور من لذة ومال وجاه والانفراد عن الخلق في الخلوة للعبادة وكان ذلك عاما في الصحابة والسلف فلما فشا الإقبال على الدنيا في القرن الثاني وما بعده وجنح الناس إلى مخالفة الدنيا اختص المقبلون على العبادة باسم” الصوفية”. إهـ\nومفهوم التصوف عندنا معاشر التجانيين (التعريف الجامع لما تفرق في تعاريف علماء الأمة لمفهوم التصوف) وهو كما قال شيخنا سيدي أحمد التجاني رضي الله عنه :” اعلم أن التصوف هو امتثال الأمر واجتناب النهي في الظاهر والباطن من حيث يرضى لأمن حيث ترضى.” وهكذا يتبين للمنصف أن التصوف نشأ من الإسلام وهو جزء منه وليس بشيء زائد عليه بل هو التطبيق العملي لظاهر الشريعة والاهتمام بالجانب الروحي منها.\nقال عليه الصلاة والسلام فيما رواه البخاري ومسلم :”ألا إن في الجسد مضغة إذا صلحت صلح الجسد كله وإذا فسدت فسد الجسد كله ألا وهي القلب. ” وما الصوفي إلا المسلم الذي يكون في حاله مع الله ومع الناس أقرب شيء إلى ما كان عليه النبي صلى الله عليه وسلم وأصحابه ، وهو لا يمت بصلة إلى ما يقوله أعداء الدين من المستشرقين وأعوانهم عنه أنه مأخوذ عن أمم أخرى كرتشارد هارتمان، وماكس دورتن في مقالتين كتبهما عام1927 أن التصوف هندي الأصل.\nوانساق معهم جملة من المسلمين عفا الله عنا وعنهم بتصديقهم وترويجهم لمقولتهم هذا من جهة ومن جهة أخرى ينبغي لك أن تعلم أن الخير والشر موجود في كل طائفة من الناس إلى يوم القيامة فليس كل الصوفية سواء كما أنه ليس كل المفسرين لكلام الله سواء ولا كل المحدثين والفقهاء والأصوليين بسواء إذ فيهم الصالح الثقة وفيهم الأصلح وفيهم الفاسد وفيهم الأفسد هذا أمر ظاهر لا شبهة فيه عند الجمهور ، اعرف الحق تعرف أهله وتُعرف الرجال بالحق لا الحق بالرجال، وإنكار بعض العلماء على التصوف وعلى رأسهم علماء صوفية إنما هو إنكار على أفعال المنحرفين من أدعيائه كما أنكروا على المدلسين والوضاعين والكذابين من رواة الحديث الشريف وحذروا الأمة منهم ولا تؤخذ طبقة الثقات من المحدثين بهؤلاء .\nقال الشيخ زروق في “قواعد التصوف” القاعدة35: ” فغلاة المتصوفة كأهل الأهواء من الأصوليين وكالمطعون عليهم من المتفقهين يرد قولهم ويجتنب فعلهم ولا يترك المذهب الحق الثابت بنسبتهم له وظهورهم فيه. “\nويقول الشيخ جلال الدين السيوطي في كتابه ” تأييد الحقيقة العلية ” ص57 :” وعلمت أيضا أنه قد كثر فيه الدخيل من قوم تشبهوا بأهله وليسوا منهم فأدخلوا فيه ما ليس منه فأدى ذلك إلى إساءة الظن بالجميع فوجه أهل العلم للتمييز بين الصنفين ليعلم أهل الحق من أهل الباطل وقد تأملت الأمور التي أنكرها أئمة الشرع على الصوفية فلم أر صوفيا محققا يقول بشيء منها وإنما يقول بها أهل البدع والغلاة الذين ادعوا أنهم صوفية وليسوا منهم.“\nويقول ابن الجوزي في كتابه “اللطائف” الفصل الثامن والثلاثون في صدق العبادة : “لا تعجبوا بصورة التعبد وتلمحوا أحسن المقصد ليس كل مصل متعبد ولا كل صائم بزاهد ولا كل باك بخاشع ولا كل متصوف بصاف . ”\nويقول ابن تيمية في كتابه “الاستقامة” ج1ص163 :” والصوفية يوجد فيهم المصيب والمخطئ كما يوجد في غيرهم.”\nوقال أحمد الرفاعي في “البرهان المؤيد”: ” يا ولدي كن صوفيا صافيا ولاتكن صوفيا منافقا.” وقال الباحث عبد العزيز ابن عبد الله في كتابه “معلمة التصوف الإسلامي” : “إن الدجاجلة لم يخل منهم زمان وأدهى ما في الأمر اندساسهم بين ذوي النزاهة من الصوفيين. ”\nوهذه بعض النقول في ثناء العلماء على التصوف وقارنها أخي بما عندك ممن ينكرونه ثم سألحق بها قائمة أخرى من العلماء الذين انخرطوا في سلك الصوفية ومن بينهم من كانوا أشد الناس بغضا ومحاربة للتصوف والصوفية فلما وقفوا على الوجه الصحيح له ما كان منهم إلا الإذعان والانخراط في سلكه :\n1ـ الإمام سفيان الثوري رحمه الله تعالى فيما نقل عنه ابن القيم في كتابه “مدارج السالكين” أنه قال:” أعز الخلق خمسة أنفس عالم زاهد وفقيه صوفي وغني متواضع وفقير شاكر وشريف سني.“\nوجاء في “الفتاوي الحديثية ” لابن حجر الهيثمي قال : ” أن سفيان الثوري قال:” لولا أبو هاشم الصوفي ما عرفت دقيق الرياء. ” .”\n2ـ الحافظ الذهبي يقول في كتابه” الموقظة” :” وهو مقام خطر (أي التصوف) إذِ القادِحُ في مُحِق الصوفية داخل في حديث من عاد لي وليا فقد بارزني بالمحاربة .”\nوالحافظ رحمه الله ذكر في كتابه تذكرة الحفاظ تراجم العديد من الأئمة الصوفية الحفاظ لحديث مولانا رسول الله صلى الله عليه وسلم معظما لشأنهم ومثنيا عليهم بأنواع التعظيم والتمجيد وبنفس التعظيم كذلك أثنى على جملة من كبار الصوفية القراء المأخوذ عنهم كتاب الله تعالى برواياته وقراءاته في كتابه معرفة القراء الكبار على الطبقات والإعصار. فليراجعهم من شاء التثبت.\n3ـ ابن القيم الجوزية في كتابه” مدارج السالكين” :” والتصوف زاوية من زوايا السلوك الحقيقي وتزكية النفس وتهذيبها .” ويقول فيه أيضا: ” الدين كله خلق فمن زاد عليك في الخلق زاد عليك في الدين وكذلك التصوف .” وقال في كتابه “طريق الهجرتين” ص260 :” ومنها أن هذا العلم (التصوف) هو من أشرف علوم العباد وليس بعد علم التوحيد اشرف منه وهو لا يناسب إلا النفوس الشريفة.”\n4 ـ الشاطبي في” الموافقات”:” وهم (أي الصوفية) باتفاق أهل السنة صفوة الله من الخليقة. ”\n5ـ الشيخ تاج الدين السبكي في كتابه” معيد النعم ومبيد النقم” ص119 :” والحاصل أنهم أهل الله وخاصته الذين ترتجى الرحمة بذكرهم ويستنزل الغيث بدعائهم فرضي الله عنهم . ”\n6ـ حجة الإسلام أبي حامد الغزالي في كتابه “المنقذ من الضلال” ص131 : ” ولقد علمت يقينا أن الصوفية هم السالكون لطريق الله تعالى خاصة وأن سيرتهم أحسن السيرة وطريقتهم أصوب الطرق وأخلاقهم أزكى الأخلاق. ” وقال في الإحياء:” علم التصوف فرض عين إذ لا يخلو أحد من عيب أو مرض إلا الأنبياء عليهم السلام للعصمة التي لهم معجزة.”\n7ـ ابن خلدون في مقدمته ص328: ” إن طريقة هؤلاء القوم لم تزل عند سلف الأمة وكبارها من الصحابة والتابعين ومن بعدهم طريقة الحق والهداية وأصلها العكوف على العبادة والانقطاع إلى الله تعالى.”\n8ـ العلامة عبد الله بن الصديق في كتابه” حسن التلطف في بيان وجوب سلوك التصوف”: ” فغاية ما تدعوا إليه الطريقة وتشير إليه هو مقام الإحسان بعد تصحيح الإسلام والإيمان ليحرز الداخل فيها والمدعو إليها مقامات الدين الثلاثة الضامنة لحرزها والقائم بها السعادة الأبدية في الدنيا والآخرة والضامنة أيضا لحرزها كمال الدين فإنه كما في الحديث عبارة عن الأركان الثلاثة فمن أخل بمقام الإحسان الذي هو الطريقة فدينه ناقص بلا شك لتركه ركنا من أركانه ولهذا نص المحققون على وجوب الدخول في الطريقة وسلوك طريق التصوف وجوبا عينيا واستدلوا على الوجوب بما هو ظاهر عقلا ونقلا …” .\n9ـ سلطان العلماء العز ابن عبد السلام كما جاء في كتاب” نور التحقيق” للشيخ حامد صقرص96:” قعد القوم من الصوفية على قواعد الشريعة التي لا تنهدم دنيا و أخرى وقعد غيرهم على الرسوم ومما يدلك على ذلك ما يقع على يد القوم من الكرامات وخوارق العادات فإنه فرع عن قربات الحق لهم ورضاه عنهم ولو كان العلم من غير عمل يرضي الحق تعالى لأجرى الكرامات على أيدي أصحابها ولو لم يعملوا بعلمهم هيهات هيهات . ” .\n10ـ فخر الدين الرازي المفسر المشهور في كتابه” اعتقادات فرق المسلمين والمشركين “ص72:” والمتصوفة قوم يشتغلون بالفكر وتجرد النفس عن العلائق الجسمانية ويجتهدون ألا يخلوا سرهم وبالهم عن ذكر الله تعالى في سائر تصرفاتهم وأعمالهم منطبعون على كمال الأدب مع الله عز وجل وهؤلاء خير فرق الآدميين. ” .\n11ـ ابن الجوزي رحمه الله في كتابه” صيد الخاطر” يقول :” مجرد العلم بالحلال والحرام ليس له كبير عمل في رقة القلب وإنما ترق القلوب بذكر رقائق الأحاديث وأخبار السلف الصالحين وأذواق أهل التصوف .“.\nولا تعتد أخي بتلك الطبعات التي تم فيها حذف (وأذواق أهل التصوف) لأن التحريف بدا سيمة بعض المطابع عفا الله عن أصحابها.\n12ـ شيخ الأزهر سابقا الدكتور عبد الحليم محمود في كتابه “قضية التصوف”: قال:” التصوف لا يعدو أن يكون جهادا عنيفا ضد الرغبات ليصل الإنسان إلى السمو أو إلى الكمال الروحي ليكون عارفا بالله.” .\n13ـ العلامة الشريف الجرجاني في كتابه” التعريفات” يقول : ” التصوف الوقوف مع الآداب الشرعية ظاهرا فيرى حكمها من الظاهر في الباطن وباطنا فيرى حكمها من الباطن في الظاهر فيحصل للمتأدب بالحكمين كمال وقيل التصوف مذهب كله جد فلا يخلطونه بشيء من الهزل. “.\n14ـ العلامة ابن عابدين في مجموع رسائله الرسالة السابعة بعدما أشار إلى جملة من البدع الدخيلة على الدين من قبل أشخاص تزيوا بزي العلم وباسم التصوف ثم استدرك الكلام عن الصوفية الصادقين حتى لا يظن الجاهل أنه يتكلم عنهم بلا استثناء فقال:” ولا كلام لنا مع الصدق من ساداتنا الصوفية المبرئين عن كل خصلة ردية. ” .\n15ـ الشيخ المفسر محمد متولي الشعراوي في كتاب” أصول الوصول” للشيخ زكي إبراهيم يقول :” الصوفي يتقرب إلى الله بفروض الله ثم يزيدها بسنة الرسول عليه الصلاة والسلام من جنس ما فرض الله . ” .\n16ـ الالوسي في تفسيره مستشهدا بكلام الشعراني وفي ثلاث مواطن من تفسيره ج3 وج6 وج15 قال : ” زبدة علم التصوف الذي وضع القوم فيه رسائلهم فهو نتيجة العمل بالكتاب والسنة .ونقل أيضا في ج6 عند قوله تعالى:{ يا أيها الرسول بلغ ما أنزل إليك من ربك} أن التصوف ليس بأمر زائد على السنة المحمدية وإنما هو عينها. ” .\n17ـ العلامة الاسفرايني في كتابه” التبصرة في الدين وتمييز الفرقة الناجية عن فرق الهالكين”: “وسادسهم علم التصوف والإشارات ومالهم فيها من الدقائق والحقائق لم يكن قط لأحد من أهل البدعة فيه حظ بل كانوا محرومين مما فيه من الراحة والحلاوة والسكينة والطمأنينة وقد ذكر أبو عبد الرحمان السلمي من مشايخهم قريبا من ألف وجمع إشاراتهم وأحاديثهم ولم يوجد في جملتهم قط من ينسب إلى شيء من بدع القدرية والروافض والخوارج…. ” .\n18 ـ أبو الاعلى المودودي في كتابه” مبادئ الإسلام” تحت عنوان التصوف: ” إن علاقة الفقه إنما هي بظاهر الإنسان فقط ، ولا ينظر هل قمت بما أمرت به على الوجه المطلوب أم لا ؟ فإن قمت فلا تهمه حال قلبك وكيفيته أما الشيء الذي يتعلق بالقلب ويبحث عن كيفيته فهو التصوف.”.\n19ـ الدكتور أبو الوفا التفتازاني في كتابه “مدخل إلى التصوف الإسلامي” :” ليس التصوف هروبا من واقع الحياة كما يقول خصومه وإنما هو محاولة الإنسان للتسلح بقيم روحية جديدة تعينه على مواجهة الحياة المادية وتحقق له التوازن النفسي حتى يواجه مصاعبها ومشكلاتها وفي التصوف الإسلامي من المبادئ الايجابية ما يحقق تطور المجتمع إلى الإمام …..والتصوف يجعل من هذه الحياة وسيلة لا غاية .” .\n20ـ الأمير شكيب أرسلان في كتابه “حاضرة العالم الإسلامي” تحت عنوان نهضة الإسلام في إفريقيا وأسبابها ج1ص301: “وأكثر أسباب هذه النهضة الأخيرة راجعة إلى التصوف والاعتقاد في الأولياء.”.\n21ـ الشيخ رشيد رضا في مجلة المنار السنة الأولى ص726 : ” لقد انفرد الصوفية بركن عظيم من أركان الدين لا يطاولهم فيه مطاول وهو التهذيب علما وتخلقا وتحققا ثم لما دونت العلوم في الملة كتب شيوخ هذه الطائفة في الأخلاق ومحاسبة النفس. ” .\n22ـ الإمام الشافعي : قال ابن القيم في كتابه “المدارج”:” قال الشافعي رضي الله عنه:” صحبت الصوفية فما انتفعت منهم إلا بكلمتين سمعتهم يقولون : ” الوقت سيف فإن قطعته وإلا قطعك ونفسك إن لم تشغلها بالحق وإلا شغلتك بالباطل.” .” قلت:” (أي ابن القيم)يا لهما من كلمتين ما أنفعهما وأجمعهما وأدلهما على علو همة قائلها ويقظته ويكفي في هذا ثناء الشافعي على طائفة هذا قدر كلماتهم.” إهـ\nوجاء في كشف الخفاء ومزيل الإلباس عما اشتهر من الأحاديث على السنة الناس للإمام العجلوني ج1ص341: قال الإمام الشافعي :”حبب إلي من دنياكم ثلاث: ترك التكلف وعشرة الخلق بالتلطف والاقتداء بطريق أهل التصوف .”.\nأما ما يُروى عنه في ذم الصوفية فإنما هو من باب الطعن والتحذير من أدعيائه السالكين دربه بلا علم ولا عمل نعوذ بالله منهم وما أكثرهم .\n23ـ الإمام مالك : قال الإمام ملا علي قاري في كتابه شرح عين العلم وزين الحلم أن الإمام مالك قال :” من تفقه ولم يتصوف فقد تفسق ومن تصوف ولم يتفقه فقد تزندق ومن جمع بينهما فقد تحقق. ” ونقله أيضا في كتابه مرقاة المفاتيح شرح مشكلة المصابيح .\n24ـ الإمام أحمد : قال الشيخ أمين الكردي في كتابه” تنوير القلوب” ص405:” كان الإمام أحمد رحمه الله قبل مصاحبته للصوفية يقول لولده عبد الله:” يا ولدي عليك بالحديث وإياك ومجالسة هؤلاء الذين سموا أنفسهم صوفية فإنهم ربما كان أحدهم جاهلا بأحكام دينه .” فلما صحب أبا حمزة البغدادي الصوفي وعرف أحوال القوم أصبح يقول لولده :” يا ولدي عليك بمجالسة هؤلاء القوم فإنهم زادوا علينا بكثرة العلم والمراقبة والخشية والزهد وعلو الهمة.”.\nوجاء في كتاب غذاء الألباب شرح منظومة الأدب عن إبراهيم القلانسي أن الإمام احمد رحمه الله قال في الصوفية:” لا أعلم أقواما أفضل منهم . ”\n25ـ ابن حجر الهيثمي في فتاويه:” ينبغي لكل ذي عقل ودين أن لا يقع في ورطة الإنكار على هؤلاء القوم (الصوفية) فإنه السم القاتل كما شوهد ذلك قديما وحديثا. ”\n26ـ الإمام النووي : قال في كتابه “روضة الطالبين وعمدة المفتين” :” وهم (الصوفية) المشتغلون بالعبادة في أغلب الأوقات المعرضون عن الدنيا.”\n27ـ الإمام المناوي في “فيض القدير” :” دقائق علوم الصوفية منح إلهية ومواهب اختصاصية. ”\n28ـ ابن رجب الحنبلي في كتابه اختيار الأولى في شرح حديث اختصام الملأ الأعلى:” أين رجال الليل ؟ أين ابن أدهم والفضيل ؟ ذهب الأبطال وبقي كل بطال يا من يرضى من الزهد بالزي ومن الفقر بالاسم ومن التصوف بالصوف ومن التسبيح بالسبح ، أين فضل الفضيل؟ أين جد الجنيد؟ أين سر السري ؟ أين بِشرُ بشٍر ؟ أين همة ابن ادهم؟ ويحك إن لم تقدر على معرفة معروف فاندب على ربع رابعة.”\nوهذا منه رحمه الله ثناء عظيم وافتخار بهؤلاء الأعيان فرسان العبادة وقيام الليل من أئمة الصوفية.\n29ـ ابن تيمية في” مجموع الفتاوى” ج11ص510: ” وأما انتساب الطائفة إلى شيخ معين فلا ريب أن الناس يحتاجون من يتلقون عنه الإيمان والقرآن كما تلقى الصحابة ذلك عن النبي صلى الله عليه وسلم وتلقاه عنهم التابعون وبذلك يحصل إتباع السابقين الأولين بإحسان فكما أن المرء له من يعلمه القران والنحو فكذلك له من يعلمه الدين الباطن والظاهر.”\nوقال أيضا في مجموع فتاويه:” والصواب أنهم (أي الصوفية) مجتهدون في طاعة الله كما اجتهد غيرهم من أهل طاعة الله ففيهم السابق المقرب بحسب اجتهاده وفيهم المقتصد الذي هو من أهل اليمين وفي كل من الصنفين من قد يجتهد فيخطئ وفيهم من يذنب فيتوب أو لا يتوب ومن المنتسبين إليهم من هو ظالم لنفسه عاص لربه .”\n30ـ سعيد رمضان البوطي في مقال بمجلة منار الإسلام رمضان 1408ص103 وما بعدها : “صفوة القول غياب التصوف هو المسؤول عن جل مشكلاتنا اليوم بل هو المسؤول أيضا عن البدع والانحرافات التي تسللت إلى جوهر التصوف وحقيقته فلو أن النفوس زكيت وتطهرت من أهوائها ورعونتها وعصبيتها ـ وهذا هو لب التصوف ومعناه ـ لما تحول التصوف عند أرباب هذه النفوس إلى مطية لشهرة أو حرفة لمال أو إطار لأبهة أو خندق لمحاربة العلم والانضباط بقيوده وأحكامه. “.\n31ـ عبد القاهر البغدادي في كتابه” الفَرق بين الفِرق” : الفصل الأول من فصول هذا الباب في بيان أصناف أهل السنة والجماعة : “اعلموا أسعدكم الله أن أهل السنة والجماعة ثمانية أصناف من الناس حتى قال : والصنف السادس منهم الزهاد الصوفية.”\n33ـ الحافظ أبو نعيم في الحلية قال:” فسالك منهجهم (أي الصوفية) ناج من الغمرات وسالم من الهلكات . ”\nوهذه النقول إنما هي نقطة من بحر ثناء حفاظ الأمة وعلمائها الكبار العاملين على التصوف و الذين هم المراجع المعتمدة لأتباعهم باختلاف توجهاتهم الفقهية ومناهجهم العلمية وكما وعدتك إليك لائحة أسماء بعض المشهورين من العلماء والفقهاء الذين انخرطوا في سلك التصوف ومنهم مَن بَعْدَمَا كان من المنكرين المبغضين للصوفية والتصوف وربما ألف في الرد على الصوفية يرجع عن أقواله ويعترف بالتصوف .\nفتجد هؤلاء المتفيقهين الذين لا يجدون راحة إلا في مخالفة المحققين من العلماء يعتمدون ما كان هؤلاء العلماء ينادون به قبل تراجعاتهم غير مبالين بما استقرت عليه آخر فتاويهم ، ولا تستغرب أخي إذا صادفت في من أدرجهم لك اسماءا قد تظن أنهم يستحيل تصوفهم :\n1ـ الإمام الشوكاني : (صاحب نيل الاوطار وفتح القدير الجامع بين فني الرواية والدراية من علم التفسير ) والذي يعتبر عند من يدعي السلفية أنه منهم ويحتفلون بكتبه أيما احتفال تحدث عن نفسه في كتابه البدر الطالع بمحاسن من بعد القرن السابع عند ترجمة السيد عبد الوهاب بن محمد شاكر بن عبد الوهاب بن حسين بن العباس بن جعفر فقال : “وقد تلقيت منه الذكر على الطريقة النقشبندية.”\n2ـ الشيخ موفق الدين عبد الله بن قدامة المقدسي (صاحب الكتاب المشهور المغني في فقه الإمام أحمد بن حنبل) قال فيه ابن تيمية كما ذكر ذلك ابن رجب الحنبلي في الذيل على طبقات الحنابلة ما دخل الشام بعد الأوزاعي أفقه من الشيخ الموفق.\nقال العليمي في كتابه “المنهج الأحمد” ج2ص191:” قال الموفق:” لبست أنا والحافظ عبد الغني الخرقة من يد شيخ الإسلام عبد القادر واشتغلنا عليه بالفقه وسمعنا منه وانتفعنا بصحبته ولم ندرك من حياته غير خمسين يوما وليلة. ”\nوالحافظ عبد الغني هذا المذكور في أخذه مع الموفق الطريقة القادرية هو الحافظ عبد الغني بن عبد الواحد المقدسي صاحب كتاب الكمال .\n3ـ الإمام الذهبي : قال في كتابه “سير أعلام النبلاء” عند ترجمة صاحب عوارف المعارف الشيخ السهروردي :” ألبسني خرق التصوف شيخنا المحدث الزاهد ضياء الدين عيسى بن يحيى الأنصاري بالقاهرة وقال ألبسنيها الشيخ شهاب الدين السهروردي بمكة عن عمه أبي النجيب.” وقال أيضا في كتابه تاريخ الإسلام ووفيات المشاهير الأعلام عند نفس الترجمة ترجمة السهروردي:” وقد لبست الخرقة بالقاهرة من الشيخ ضياء الدين عيسى بن يحيى الأنصاري السبتي وقال ألبسنيها الشيخ شهاب الدين بمكة في سنة سبع وعشرين وستمائة. ”\n4ـ سلطان العلماء العز بن عبد السلام : نقل السبكي في طبقاته أن الشيخ عز الدين لبس خرقة التصوف من الشيخ شهاب الدين السهروردي وأخذ عنه . قال ابن دقيق العيد في العز: ” كان ابن عبد السلام أحد سلاطين العلماء.” وقال عنه الذهبي في تاريخ الإسلام:” بلغ رتبة الاجتهاد.”\n5ـ الإمام النووي: الغني عن التعريف بكتبه التي نالت القبول عند العام والخاص وخاصة رياض الصالحين. نقل السبكي في طبقاته عن والده أن الإمام النووي كان شيخه في الطريقة الشيخ ياسين بن يوسف الزركشي.\n6ـ أبو حيان الأندلسي: صاحب التفسير المشهور : “البحر المحيط” أخذ التصوف عن شيخه قطب الدين القسطلاني كما في طبقات ابن الملقن.\n7ـ الحافظ ابن حجر الهيثمي صاحب كتاب : “مجمع الزوائد” ، ذكر في معجم مشايخه أن له في لبس الخرقة جملة طرق يرجع بعضها إلى العيدروس.\n8ـ ابن كثير : المفسر المشهور كان ممن ينكرون على الصوفية ويشتدون على أهله إلا أنه في آخر عمره رجع واعترف وتتلمذ ودخل في صف الشاذلية.\nقال الصلاح الصفدي في كتابيه الوافي في الوفيات ونكث الهميان عند ترجمة أبو الحسن الشاذلي : ” ورأيت شيخنا عماد الدين (ابن كثير) قد فتر عنه (أي أبي الحسن الشاذلي) وبقي واقفا في هذه العبارات حائرا في الرجل لأنه قد تصوف على طريقته وأخذ عن نجم الدين الأصفهاني نزيل الحرم ونجم الدين صحب الشيخ أبا العباس المرسي صاحب الشيخ أبي الحسن.”\n9ـ الحافظ السلفي : قال الإمام الذهبي في كتابه “سير أعلام النبلاء”:” أخذ التصوف عن معمر بن أحمد اللنباني .” وذكر عنه صاحب طبقات الأولياء أنه قال :” وكان لباسي من معمر بأصبهان بحضرة والدي .”\n10ـ ابن الملقن : صاحب كتاب “طبقات الأولياء” قال في طبقاته:” وقد لبست الخرقة من جماعات بطرق متنوعات جليلات منهم الحافظ شرف الدين عبد المؤمن ابن خلف الدمياطي .”\n11ـ السمهودي : قال السخاوي في كتابه “الضوء اللامع” أن السمهودي أكثر من ملازمة المناوي وألبسه خرقة التصوف.\n12ـ شيخ الإسلام زكريا الأنصاري: نقل عنه الشعراني في كتابه” الطبقات الكبرى” أنه قال : “وقد ألبسني الخرقة ولقنني الذكر سيدي محمد الغمري .”\n13ـ عبد الله اليافعي : قال ابن حجر العسقلاني في كتابه” الدرر الكامنة في أعيان المائة الثامنة” : ” لبس خرقة التصوف من محمد ابن احمد البصال اليمني .”\n14ـ الحافظ ابن مسدي وهو من شيوخ الدارقطني الذين روى عنهم قال الصلاح الصفدي في الوافي في الوفيات لبس الخرقة عن جده أبي موسى ومن الأمين عبد اللطيف النرسي ولبسهم عن الشيخ عبد القادر .\n15ـ الحافظ اليونيني : قال ابن كثير في كتابه “البداية والنهاية” : ” وقد لبس الخرقة من شيخ شيخه عبد الله البطائحي وبرع في علم الحديث وحفظ الجمع بين الصحيحين بالفاء والواو (حتى قال فيه) وكان مشايخ الفقهاء كابن الصلاح وابن عبد السلام وابن الحاجب والحصري وشمس الدين وابن الجوزي وغيرهم يعظمونه ويرجعون إلى قوله لعلمه وعمله وديانته وأمانته. ”\n16ـ الشهاب الرملي : قال الشوكاني في كتابه “البدر الطالع” : “وأخذ عن جماعة من أهل الطريقة .” ونقل عن السخاوي أنه قال فيه : “وهو في الزهد والورع والتقشف وإتباع السنة وصحة العقيدة كلمة إجماع بحيث لا أعلم في وقته من يدانيه في ذلك . ”\n17ـ القسطلاني : قال الشيخ عبد السلام ياسين في كتابه” الإحسان” :” يفتي القسطلاني بحرمة قراءة الكتب المشتملة على العبارات الغامضة والشطحات وينصح بعدم تضييع الوقت في طلب علم القوم لان العلم بلا عمل بطالة وكانت سعادته بلقاء الشيخ شهاب الدين السهروردي وهو ابن أخ الشيخ أبي النجيب السهروردي الأشهر لبس منه خرقة التصوف . قال السبكي في طبقاته : ….ومن الشيخ شهاب الدين السهروردي ولبس منه خرقة التصوف. ”\n18ـ تقي الدين السبكي: الملقب بالشافعي الثاني قال الشوكاني في كتابه “البدر الطالع” عند ترجمة الشيخ ابن عطاء الله السكندري الشاذلي نقلا عن الإمام الذهبي : ” ومن جملة من أخذ عنه الشيخ تقي الدين السبكي.”\n19ـ حفيدة سراج الدين البلقيني: قال ابن حجر العسقلاني في كتابه “الدرر الكامنة”:” لبست الخرقة من جماعة .”\n20ـ مسعود ابن عبد الرحمان :قال ابن حجر العسقلاني في الدرر الكامنة :” لبس الخرقة من القطب القسطلاني ولبس منه الخرقة جماعة من شيوخنا (أي شيوخ ابن حجر العسقلاني ). ”\n21 ـ ابن العماد : جاء في الدرر الكامنة للعسقلاني أنه لبس خرقة التصوف عن محمد بن قدامة.\n22ـ مولانا زاد العجمي الحنفي : قال ابن حجر في الدرر :” ثم سلك طريق التصوف وصحب جماعة من المشايخ .”\n23ـ المقرئ عبد الوهاب ابن الأمين بن سكينة البغدادي : قال فيه الإمام الذهبي في كتابه ” معرفة القراء الكبار” : ” شيخ العراق في عصره ولبس الخرقة من جده لأمه أبي البركات النيسابوري .”\n24ـ المقرئ ابن أبي العلاء الشافعي الصوفي: قال الإمام الذهبي :”عنه أخذت التجويد في كتابه معرفة القراء الكبار .”\n25ـ ابن دقيق العيد : قال الشيخ عبد السلام ياسين في كتابه “الإحسان” :” كان تقي الدين ابن دقيق العيد شيخا إماما زاهدا محدثا حافظا ورعا فقيها بلغ درجة الاجتهاد المطلق. قال السبكي:” ولم ندرك أحدا من مشايخنا يختلف في أن ابن دقيق العيد هو العالم المبعوث على رأس السبعمائة المشار إليه في الحديث المصطفوي النبوي صلى الله عليه وسلم وأنه أستاذ زمانه علما ودينا.” هذا الإمام الأوحد في قرنه سلك طريق القوم على يد الشيخ الصالح كمال الدين بن عبد الظاهر الهاشمي .”\n26ـ الإمام الحسن البنا : قال في “مذكرات الدعوة والداعية” : ” وواظبت على الحضرة في مسجد التوبة في كل ليلة . وسألت عن مقدم الإخوان فعرفت أنه الرجل الصالح التقي الشيخ بسيوني العبد التاجر فرجوته أن يأذن لي بأخذ العهد عليه ففعل . ” (والطريقة التي أخذها عنه هي الطريقة الحصافية)\n27ـ ابن بطوطة : الرحالة المشهور قال في كتابه المعروف “برحلة ابن بطوطة “عند ذكره لبعض فضلاء القدس : ” ومنهم الشيخ الصالح العابد أبو عبد الرحمان بن مصطفى وهو من تلامذة تاج الدين الرفاعي صحبته ولبست منه خرقة التصوف.”\n28ـ سبط الإمام محب الدين الطبري : نقل عنه ابن الملقن في طبقاته أن قال :” ألبسني أي الخرقة الإمام مفتي القرن جمال الدين محمد بن سليمان بن الحسن بن حسين عرف بابن النقيب عن الشيخ شهاب الدين السهروردي. “\n29ـ عمر المختار : أخذ عن الإمام محمد المهدي السنوسي . قال محمد الطيب الأشهب في كتاب عمر المختار أن عمر المختار قال لشيخه محمد المهدي السنوسي :” يا سيدي إن الكثيرين من الإخوان يقرؤون أورادا معينة من الأدعية والتضرعات أجزتموهم قراءتها وأنا لا أقرأ إلا الأوراد الخفيفة عقب الصلوات فأطلب منكم إجازتي بما ترون.” فأجابني بقوله:” يا عمر وردك القرآن .” فقبلت يده وخرجت أحمل هذه الهدية العظيمة المصحف ولم أزل بفضل الله احتفظ بها في حلي وترحالي . ”\nأخي القارئ اسمع مني ما قاله ابن القيم الجوزية في” مدارج السالكين” قال :” فلا تعجل بإنكار ما لم تحط بعلمه فضلا عن ذوق حاله وأعط القوس باريها وخل المطايا وحاديها فلو أنصفت لعرفت .”\nوقال الشاطبي في” الموافقات” : “عهد بالتجربة من أن الاعتراض على الكبراء قاض بامتناع الفائدة.”\nأخي القارئ سأختم لك بخاتمة (سائلا من الله أن يختم لنا بحسن الخاتمة ) تقف من خلالها على ما قد يكون سببا قويا فيما يحصل للتصوف والصوفية من الإنكار :\n1ـ ابتعاد بعض الصوفية أنفسهم عن نهج مشايخهم . وكنمودج على ذلك أن الشيخ سيدي أحمد التجاني رضي الله عنه يوصي أتباعه ويؤكد غاية التأكيد على أن الصلوات الخمس في الجماعة من آكد الشروط في الطريقة التجانية و بجميع أركانها وعلى الوجه الأكمل الذي سطره العلماء والفقهاء فتجد من التجانيين من يستخف بها ولا يأتيها فيعود ذلك بالإنكار على الطريقة التجانية عامة بسبب فعل هؤلاء المتهاونين.\nأما لو إلتزم كل اتباع التجانية بوصايا الشيخ التجاني رضي الله عنه لما وجد من يستطيع أن ينطق ولو ببنت شفة أو بالأحرى الطعن في الطريقة.\nوكيف يكون ذلك ؟ ووصايا الشيخ التجاني رضي الله عنه كلها محررة على الكتاب والسنة.\n2ـ الافتراءات على الصوفية و دس الأباطيل الواضحة والأساطير والخرافات التي لا يقول بها العامة فضلا عن العلماء في كتبهم .\nقال سيدي محمد الحافظ المصري التجاني في كتابه علماء تزكية النفس من اعلم الناس بالكتاب والسنة ص4 : ” وما من شك أنه دس على كثيرين من الأئمة ما ليس من أقوالهم كذبا وافتراءا فقد كذب على الشيخ محي الدين بن العربي وكذب على الإمام أحمد وعلى الإمام مجد الدين الفيروزابادي صاحب القاموس كما دس على الشيخ الشعراني ودس على الشيخ التجاني رضي الله عنه ، وقد قال الشيخ التجاني رضي الله عنه عندما سئل أيكذب عليك قال: ” نعم ، إذا سمعتم عني شيئا فزنوه بميزان الشرع فإن وافق فاعملوا به وإن خالف فاتركوه. ” .\nوقد أعلن أصحاب الشيخ الذين عاصروه أن في الكتب المنسوبة للطريق أقوالا حرفت عن الشيخ وأقوالا لم يقلها …… والتجانيون في كل عصر عقيدتهم عقيدة السلف الصالح من الأمة فهم مالكية أو شافعية أو أحناف أو حنابلة وليس فيهم من عقيدته فيها زيغ ولا يتقيدون إلا بالشرع كما ذكر الشيخ رضي الله عنه ، وقد اختلفت نسخ جواهر المعاني وفي بعضها زيادة ونقص وقد أخبرني الشيخ إبراهيم انياس رحمه الله وقد اجتمعت به مرارا وهو من كبار علماء المسلمين أن لديه نسخة من الجواهر بخط المؤلف خلو من الأمور التي وقع عليها الاعتراض في الجواهر المطبوع وقد رأينا في الجواهر وغيره من الكتب ما هو مفسد للمعنى بالزيادة أوالنقص بين الطبعات المختلفة فكيف بالمخطوط ، والقاعدة التي سار عليها أهل الطريق أن كل ما ينسب للشيخ لابد من عرضه على الشرع وأن ما لا يمكن حمله على وجه صالح فهو مكذوب على الشيخ رضي الله عنه.”\nوإليك بعض أمثلة الدس المفتراة على الصوفية والعلماء في كتبهم والتي اعتمدها المنكرون لنيل من صفاء التصوف والصوفية :\nــ قال ابن العماد الحنبلي في كتابه “شذرات الذهب “عند ترجمة الشعراني :” بعد أن أثنى عليه وذكر مؤلفاته قال فيه وحسده طوائف فدسوا عليه كلمات يخالف ظاهرها الشرع وعقائد زائغة ومسائل تخالف الإجماع وأقاموا عليه القيامة وشنعوا وسبوا ورموه بكل عظيمة فخذلهم الله وأظهره الله عليهم وكلن مواظبا على السنة. “\nــ قال ابن حجر الهيثمي في فتاويه : ” وإياك أن تغتر بما وقع في كتاب الغنية لإمام العارفين وقطب الإسلام والمسلمين الشيخ عبد القادر الجيلاني فإنه دس عليه فيها من سينتقم الله منه. “\nــ قال الحصكفي في الدر المختار عن فصوص الحكم لمحي الدين بن عربي : “فيه كلمات تباين الشريعة لكن الذي تيقنته أن بعض اليهود افتراها على الشيخ قدس الله سره .” وقال العلامة ابن عابدين في حاشيته على الدر المختار عند قوله:” لكن الذي تيقنته : وذلك بدليل ثبت عنده. ”\nــ كما دس على رابعة العدوية قولها عن الكعبة هذا الصنم المعبود في الأرض .\nوابن تيمية يكذب سنية هذا القول إليها ويبين أنه مدسوس ومكذوب عليها فقال في مجموع الفتاوى:” وأما ما ذكر عن رابعة من قولها عن البيت إنه الصنم المعبود في الأرض فهو كذب على رابعة المؤمنة التقية ولو قال هذا من قال لكان كافرا يستتاب فإن تاب وإلا قتل وهو كذب فإن البيت لا يعبده المسلمون ولكنهم يعبدون رب البيت بالطواف به والصلاة إليه. ”\nوالتحريفات والزيادات والنقص في الكتب مما يطول بنا ذكره لو أردنا تقصي ذلك ولكن فيما ذكرت كفاية واللبيب بالإشارة يفهم .\n\nوأسأل من الله سبحانه وتعالى أن يرينا الحق حقا ويرزقنا إتباعه والباطل باطلا ويرزقنا اجتنابه والسلام عليكم ورحمة الله وبركاته."}, {"q": "ناقشني بعض الإخوة المسلمين حول التصوف و التجانية و الشيخ (ر) باسطين بعض أقوال تنسب إليه في بعض الكتب ، أقوال قد نفيتها، أرجو معرفة وجهة نظركم حول هذا الموضوع و حول وجود هذه الكتب . أيضا ما هي كتب الطريقة التي يجب إعتمادها و ما هي التي يجب تركها؟", "a": "للأسف هذه الانتقادات و غيرها تتكرر دائما و ذلك للعديد من الأسباب :\nإما جهلا بهذه الطريقة المباركة و بأنها طريقة علم و عمل واقتداء بالسنة الشريفة ، أوجهلا بشيخها رضي الله عنه الذي تلقاها من سيد الوجود صلى الله عليه وسلم ، أوعائد لنقل كل ما يُسمع أو يُروج عن الطريقة من أباطيل و أكاذيب بدون تثبت ، في حين أن الله تعالى يقول :[وَلا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُوْلَئِكَ كَانَ عَنْهُ مَسْئُولاً] .الإسراء. ويقول أيضا : [ َيا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءكُمْ فَاسِقٌ بِنَبَأٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْماً بِجَهَالَةٍ فَتُصْبِحُوا عَلَى مَا فَعَلْتُمْ نَادِمِينَ ] .الحجرات .\nو يقول صلى الله عليه و سلم: ” كفى بالمرء إثما أن يحدث بكل ما يسمع .”\nأو أن مرد ذلك أنه توجد فعلا كتب محرفة أوفيها أقوال مدسوسة على الطريقة أو منسوبة زورا و كذبا للشيخ رضي الله عنه.\nيقول سيدي محمد الحافظ رضي الله عنه: ”\nوليس ما يؤلفه بعض المنتسبين للطريقة بحجة على كل أهل الطريقة ما داموا لم يقروه فإن المؤلفين ليسوا بمعصومين من الخطأ ، وعندنا كتب التفسير فيها ما فيها و لكثير من أفذاذ العلماء مؤلفات بها أمور قد أخطأوا فيها أو دست عليهم .\nوقد ذكر الشيخ الشعراني في “اليواقيت و الجواهر” أنه كذب على الشيخ محي الدين ابن عربي وثبت ذلك لديه وكذب على الإمام أحمد و على الشيخ مجد الدين الفيروز آبادي صاحب “القاموس” دسوا عليه كتابا في الرد على أبي حنيفة و تكفيره و دفعوه إلى أبي بكر الخياط فأرسل يلوم الشيخ مجد الدين على ذلك فكتب إليه أن احرق ذلك الكتاب فإنه افتراء من الأعداء وأنا من أعظم المعتقدين في الإمام أبي حنيفة وذكرت مناقبه في مجلد .\nوقال الشعراني :” وكذلك دسوا عليّ أنا في كتابي المسمى “البحر المورود”جملة من العقائد الزائغة وأشاعوا تلك العقائد في مصر ومكة نحو ثلاث سنين وأنا بريء منها كما بينت ذلك في خطبة الكتاب لما غيرتها وكان العلماء كتبوا عليها وأجازوه فما سكتت الفتنة حتى أرسلت إليهم النسخة التي عليها خطوطهم وهذا في حياته فكيف الأمر بعد وفاته .\nوإننا قد أعلنا مرارا أن أصحاب الشيخ الذين عاصروه قرروا أن في الكتب المنسوبة للطريقة أقوالا حرفت عن الشيخ و أقوالا لم يقلها و ذكر ذلك سيدي إبراهيم الرياحي شيخ الإسلام بتونس في عصره و مؤلف “جواهر المعاني” نفسه ذكر فيه أنه لم يتلق كل ما ذكر فيه عن الشيخ وأنه روى بعضه عن قوم عنه .\nوبعضهم كان يروي القدر الذي فهمه وكثيرا ما يخطئ إنسان في فهمه […] فإن وجد فيه ما يخالف الشريعة على فرض أنه لا يمكن حمله على وجه شرعي فلا تقوم به الحجة شرعا على من نسب إليه لاسيما وقد تبرأ الشيخ مما يخالف الشريعة ولم يجعل بينه وبين أصحابه ميزانا إلا الكتاب و السنة وقد سئل شيخ الطريقة نفسه:” أيكذب عليك؟ ” ، قال :” نعم , إذا سمعتم عني شيئا فزنوه بميزان الشرع . ” وقد قال تعالى :[ فإن تنازعتم في شيء فردوه إلى الله والرسول] […] و أن الشيخ وعلماء الطريقة بينوا أنهم لا يتقيدون إلا بالشرع الشريف وإن ما لا يمكن حمله على وجه شرعي مما نسب إلى الشيخ فهو مكذوب عليه نرده و لا نأخذ به وإن كان في الكتب التي ألفها بعض المنتسبين للطريقة .\n\nوقد اختلفت نسخ ” جواهر المعاني” وفي بعضها زيادة ونقص وقد اجتمعت بمكة المكرمة بالشيخ إبراهيم أنياس الكولخي من علماء السنغال فأخبرني أن لديه نسخة من “الجواهر” بخط المؤلف وهي خلو من الأوامر التي وقع عليها الاعتراض في “الجواهر” المطبوعة …\nوقد ثبت أن أولاد الشيخ رضي الله عنه أحرقوا بعض الكتب التي نسبت للشيخ و للطريق زورا وأعلنوا أنها مكذوبة وقد وضح ذلك علماء الطريق قبل أن نولد … ”\nأما بالنسبة لسؤالك عن كتب الطريقة التي يجب إعتمادها و ما هي التي يجب تركها…\nالمؤلفات في هذه الطريقة المحمدية كثيرة و غزيرة فمن شيوخها الأفاضل رضوان الله عليهم من ألف بالعشرات حتى أنه هناك من تجاوزت مؤلفاته المائة والخمسين كالعلامة سيدي أحمد بن العياشي سكيرج رضي الله عنه .\nو القاعدة في ذلك دائما هو ما قاله سيدنا أحمد التجاني رضي الله عنه:” إذا سمعتم عني شيئا فزنوه بميزان الشرع فإن وافق فاعملوا به وإن خالف فاتركوه . ”\nومن مؤلفات الطريقة على سبيل الذكر :\nكتاب “جواهر المعاني” لسيدي علي حرازم برادة رضي الله عنه\nكتاب ” الرماح ” لسيدي عمر الفوتي رضي الله عنه\nكتاب ” بغية المستفيد ” لسيدي العربي ابن السايح رضي الله عنه\nكتاب ” الجامع ” لسيدي محمد بن المشري رضي الله عنه\nكتاب ” كشف الحجاب ” لسيدي أحمد سكيرج رضي الله عنه\nكتاب ” الدرة الخريدة ” لسيدي محمد النظيفي رضي الله عنه\nو القائمة لا تزال طويلة…"}, {"q": "لأي سبب تتعدد أسماء هذه الطريقة ؟", "a": "قال سيدي عمر الفوتي رضي الله عنه في كتابه” الرماح” :\nسميت بأسماء كثيرة لأن لها من الفضائل والخصائص ماليس لغيرها ،لأن كثرة الأسماء دالة على فضل المسمى .\nقال في السراج المنير ولها (يعني سورة الإخلاص) أسماء كثيرة وزيادة الأسماء تدل على شرف المسمى.\nوقال إبن أبي جمرة في بهجة النفوس: “يحتمل أن تكون (يعني فاتحة الكتاب) سميت بأسماء كثيرة لأن لها من الخصائص والفضائل ماليس لغيرها فكانت أسماؤها عديدة دون غيرها لأن كثرة الأسماء دالة على فضل المسمى إما مطلقا أوعلى جنسه. ”\nومن بين هذه الخصائص والميزات التي استوجبت تعدد أسمائها ماأشار إليه العارف بالله المحقق سيدي العربي ابن السائح التجاني رضي الله عنه في البغية المطلب السابع: في بيان تسمية هذه الطريقة السنية بالأحمدية والمحمدية والإبراهيمية الحنيفية فقال:\nاعلم أمدنا الله وإياك بأنوار اليقين وسلك بنا وبك مسالك الذين يؤمنون بالغيب من عباده المتقين أن لهذه الطريقة الشريفة بين الطرق مكانة عالية ومرتبة قصوى سامية وذلك لما امتاز به أهلها من الانتماء الحقيقي إلى إمام حضرة الأنبياء..\nفنقول متبرئين من القوة والحول مستندين إلى فضل مَنْ له المنة والطول:\nأما تسميتها بالأحمدية كما عليه إطلاقاتُ جميع أصحاب الشيخ رضي الله عنه فمن وجوه:\n(أولها) وهو الظاهر المتبادر لكل أحد إنما سميت بذلك نسبة إلى اسم صاحبها لأن اسمه رضي الله عنه أحمد وهو إمامها المتلقي لها من حضرة سيد الوجود من دون وساطة شيخ آخر فلا إشكال في تسميتها بالأحمدية.\n(الوجه الثاني) أنها إنما سميت بذلك لكونها طريقة شكر فلكون القطب الذي عليه مدارها هو الحمد بالوجه الأبلغ سميت أحمدية وهو ظاهر.\n(الوجه الثالث) فلكون أذكارها المتداولة بين أصحابها دائرة على أبلغ الحمد صريحا أو ضمنا سميت أحمدية.\n(الوجه الرابع) كون صاحبها هو الخاتم الأكبر المخصوص بوراثة السر الأبهر …….قد سبق في حمد الله تعالى كل حامد من الأولياء فما حمده أحد من الأولياء مثل ماحمده خاتم الأولياء فيتحقق فيه مالم يتحقق في غيره من الاتصاف بالحمد على جهة الأبلغية فصح اتصاف طريقه بالأحمدية.\nأما تسميتها بالمحمدية فهي متعددة أيضا :\n(أولها) كون القطب الذي يدور عليه السلوك في الطريقة المحمدية عندنا هو الإكثار من الصلاة والتسليم على رسول الله صلى الله عليه وسلم مع كون الذاكر على أحسن الحالات وأكملها …..وهذا ملخص ما للمشايخ في تحقيق معنى الطريقة المحمدية بالوجه الخاص .\n(الوجه الثاني) أنه صلى الله عليه وسلم أضاف جميع الفقراء المتمسكين بهذا العهد المواظبين على هذا الورد إلى سيادته السنية ومكانته العلية إضافة خاصة تؤذن بشرف منزلتهم وشفوف مرتبتهم عند الله تعالى وذلك أنه قال صلى الله عليه وسلم لسيدنا رضي الله عنه يقظة لامناما فقراؤك فقرائي وتلامذك تلامذي حسبما صح بالإخبار به عنه رضي الله عنه من غير واحد من أعيان أصحابه فكان كل من أخذ هذا الورد عن الشيخ أو عمن عنده الإذن فيه حائزا لهذه الإضافة الشريفة والنسبة المنيفة……. فوجب تخصيصها باسم المحمدية.\n(الوجه الثالث) أنه صلى الله عليه وسلم هو الضامن لجميع ما بشر به أهلها من الشيخ رضي الله عنه عن أعظم الوسائل من باهر الكرامات وسني الفضائل كما أنه هو القائم مقامه معهم لدى كل خطب هائل كحضوره صلى الله عليه وسلم موت من مات منهم على تباعد أوطانهم وتباين بلدانهم واختلاف ألسنتهم وألوانهم وجدير لطريق امتاز أهلها بهذه المزية أن تخص بالتشريف بالإضافة المحمدية.\n(الوجه الرابع) أن لأهل هذه الطريقة علامة يتميزون بها عن غيرهم ويعرف بها أن رسول الله صلى الله عليه وسلم هو صاحبها بوجه خاص ……وإن كل واحد من أهلها مكتوب بين عينيه بطابع النبي صلى الله عليه وسلم {محمد رسول الله}صلى الله عليه وسلم وعلى قلبه مما يلي ظهره {محمد بن عبد الله }وعلى رأسه تاج من نور مكتوب فيه {الطريقة التجانية منشؤها الحقيقة المحمدية}…..ويؤيد ما تواتر بين الأصحاب عن جماعة من أرباب الأحوال أنهم صرحوا لبعض أهل هذه الطريقة بأنهم رأو ا طابع النبي صلى الله عليه وسلم بين عينيه. وقد رأينا بعض الأصحاب إذا رأى أحدا من أهل هذه الطريق عرفه وقطع له بأنه من أهلها ولم يكن رآه قبل ذلك،…..ومعلوم أن مثل هذا إنما يراه من كشف الله له عن بعض أسراره الغيبية وأيده بأنواره الوهبية فلا مجال فيه للأفكار إذ لا نفاق لبضاعة العقل في هذا المضمار وهو من جائز الكرامات التي يتحف الله بها من شاء من عباده المؤمنين ويختص بها من أراد من أوليائه المكرمين الأبرار فسلم تسلم.\n(الوجه الخامس ) أن هذه الطريقة أشبهت الملة المحمدية في كونها آخر الملل وذلك لأنها آخر الطرق فلا يأتي أحد بعدها بطريق جديدة لأن سائر الطرق تدخل في طريقة الشاذلي رضي الله عنه كما تقدم عن الشيخ رضي الله عنه إلا هذه الطريقة الأحمدية ولذلك سميت المحمدية.\n(الوجه السادس) أن هذه الطريقة تدخل على سائر الطرق فتطلبها وطابعها ينزل على كل طابع ولاينزل عليه طابع كما أن شرع سيدنا محمد صلى الله عليه كذلك يدخل على جميع الشرائع ولايدخل عليه غيره فلما أشبهت الشريعة المحمدية من هذه الحيثية قيل لها المحمدية .\n(الوجه السابع) أن من ترك وردا من أوراد المشايخ لأجْلِ الدخول في هذه الطريقة المحمدية آمنه الله في الدنيا والآخرة ولايخاف من شيء يصيبه لامن الله ولامن رسول الله ولامن شيخه أيا كان من الأحياء أو الأموات وأن من دخلها وتأخر عنها ودخل غيرها تحل المصائب به دنيا وأخرى كما أن شرع رسول الله كذلك فمن أجل هذه الخصوصية قيل لها المحمدية .\n(الوجه الثامن) أن الطرق كلها في آخر الزمان تصير إلى هذه الطريقة المحمدية وذلك عندما تصير الطرق طريقا واحدا المذاهب مذهبا واحدا على ما أخبر به أهل الكشف رضوان الله عليهم فأشبهت أيضا الشريعة المحمدية من هذه الحيثية فقيل لها المحمدية\n(الوجه التاسع) أنه صلى الله عليه وسلم يغار لأهلها غيرة خاصة وأنه يؤذيه ما يؤذيهم حسبما أخبر به الشيخ رضي الله عنه …….فمن أجل اختصاصهم بهذه الغيرة المصطفوية صحت لهم النسبة المحمدية.\n(الوجه العاشر) أن هذا الشيخ الأكبر لما كان هو الختم المحمدي الأشهر الحائز لكل ما للأولياء من الكرامات الإختصاصية كما أن رسول الله صلى الله عليه وسلم الحائز لجميع ما للأنبياء والرسل من الكمالات الإلهية سميت طريقه بالمحمدية.\n(الوجه الحادي عشر) أن الله سبحانه وتعالى بمحض فضله العميم تفضل على أهل طريق هذا الشيخ العظيم بأن جعل سبحانه وتعالى نسبة تضعيف حسناتهم بالنسبة إلى تضعيف حسنات غيرهم من أهل الطرق كنسبة تضعيف ثواب حسنات هذه الأمة إلى تضعيف ثواب حسنات غيرها من سائر الأمم وراثة محمدية حبيبة مصطفوية …….وفي هذا القدر الذي ذكرناه من وجوه تسمية هذه الطريقة بالمحمدية كفاية في بساط التذكير ببعض ما اختصت به هذه الطريقة السنية من أسرار هذه النسبة العلية.\n(الأول) أنها لاتكون محمدية بالوجه الأخص إلاإذا كانت إبراهيمية حنيفية كما يشير إليه قوله سبحانه وتعالى :{قل إنني هداني ربي إلى صراط مستقيم دينا قيما ملة إبراهسم حنيفا}الانعام الاية161.\n\nوأما تسميتها بالإبراهيمية الحنيفية فمن وجوه :\n(الوجه الثاني) أنها ناشئة عن الدائرة الفضلية التي منها اتخذ الله إبراهيم خليلا في الأزل قبل إيجاده وإيجاد الكون ومافيه {ولقد آتينا إبراهيم رشده من قبل}الأنبياء الاية51\n(الوجه الثالث) أنها طريقة شكر ….وقد أثنى سبحانه وتعالى على إبراهيم عليه السلام بقوله {شاكرا لأنعمه}النحل الاية121\n(الوجه الرابع) أن الله تعالى جعلها بمحض فضله وكرمه معلم الخير في هذا الزمان الذي هو آخر الأزمان وألبسها ملابس طاعته في السر والإعلان فكانت أمة وحدها قانتة لله تعالى حنيفة وذلك من ملة إبراهيم كما أشار إليه قوله سبحانه وتعالى:{إن إبراهيم كان أمة قانتا لله حنيفا}النحل الاية120. قال الشيخ محي الدين والأمة معلم الخير والقانت المطيع لله في السر والعلانية .\n(الوجه الخامس) أن من أركان هذا الطريق إسلامَ الوجْهِ إلى الله تعالى الإسلام التام والإنقياد إلى كل مأمور به على الوجه الأكمل في شريعة الإسلام :{إذ قال له ربه أسلم قال أسلمت لرب العالمين}البقرةالاية131 …….\n(الوجه السادس) أن هذه الطريقة لما كانت طريق اجتباء سهلة لاحرج فيها ولامشقة ولاضيق كانت إبراهيمية حنيفية اعتبارا بما أشار إليه قوله سبحانه وتعالى :{هو اجتباكم وما جعل عليكم في الدين من حرج ملة أبيكم إبراهيم}الحج الاية 78.\n(الوجه السابع) أن من شأن السالكين على هذه الطريقة أن يغلب على أحوالهم كثرة الحلم والصبر على من يؤذيهم وينقصهم وكثرة التأوه لما يشاهدون من جلال الله تعالى فلا تجدهم يتميزون عن عامة المؤمنين بشيء مما يشير إلى الكمال ولايدعون لأنفسهم مع الله تعالى شيئا من المقامات والأحوال بل ترى الغالب عليهم في كل حال الإنابة إلى المولى الكبير المتعال المنفرد بالعزة والجلال سبحانه وتعالى وذلك من ملة إبراهيم {إن إبراهيم لحليم أواه منيب}هود الاية 75 .\n(الوجه الثامن) من فضائل هذه الطريق أن من دخلها وأسلم قيادها إلى صاحبها بطريق المحبة الخاصة وكمال التصديق كان من الأمنين عند الله تعالى في الدنيا والآخرة لقول سيد الوجود لسيدنا رضي الله عنه:” أنت من الأمنين وكل من أحبك من الآمنين…” إلى آخر كلامه في جواهر المعاني ……وقد قال مولانا جل علاه في حق مقام إبراهيم عليه الصلاة و السلام {ومن دخله كان امنا}آل عمران الاية 97 .\n(الوجه التاسع) أن سيدنا إبراهيم عليه الصلاة والسلام أسكن ذريته وعياله وادي الحرم بلا زاد ولاراحلة فنادى مولاه سبحانه ودعاه باسم الرب رجاء لتربية ذريته وعياله وأهله وإيوائهم إلى جوار كرامته سبحانه وفضله فقال فيما حكاه الله تعالى عنه في محكم وحيه{ربنا إني أسكنت من ذريتي بواد غير ذي زرع عند بيتك المحرم } ابراهيم الاية 37 ، فكانت في ذلك إشارة إلى تربية ذريته وعياله بحقائق التوكل والرضى والتسليم ……وصاحب هذه الطريقة رضي الله عنه وأرضاه أسكن ذريته وعياله في قصده عليه وهو سيد الوجود وعلم الشهود صلى الله عليه وسلم لأنه صلى الله عليه وسلم هو أستاذهم ومربيهم والضامن لهم وكفيلهم ومتوليهم وفي ذلك إشارة إلى تربيتهم بقصد النظر في استمداداتهم واستناداتهم عليه وصرف الوجهة في سائر تقلباتهم إليه نعمت التربية هذه لأنه صلى الله عليه وسلم باب الله الأعظم الذي من صد عنه لايجد بابا يدخل منه والوسيلة العظمى التي من تخلف عنها لايجد سببا يتعلق به ورضي الله عن إمام دار الهجرة سيدنا مالك ابن انس في قوله للخليفة حين قال له : ” أأستقبل القبلة وأدعوا أوأستقبل القبر وأدعوا؟” “وأين تصرف وجهك عنه وهو وسيلتك ووسيلة أبيك آدم؟”\n(الوجه العاشر) أن مدار دلالة صاحب هذه الطريقة رضي الله عنه على تعلق القلب بالله تعالى وعلى مايوصل إلى ذلك وكلامه في رسائله وأجوبته وإملاآته طافح من ذلك بما يبهر العقول ولايصدر إلا عن أكابر الفحول ومن كلامه فيه مانصه زبدة الأعمال الشرعية وغاية ارتفاعها هو التعلق بالله تعالى بلا انفصام ولاتزلزل ولو دَهَمَته دهمات الفتن الصعبة التي لاينجوا منها إلا بانخلاع يده من الله تعالى والانفصام عنه فهذا غاية العمل ومنتهاه… وهذا من ملة إبراهيم عليه الصلاة والسلام ومن كمال تعلقه بالله وتمام إخلاص وجهته إلى مولاه وتبرئه من التعلق بما سواه أنه أدرج في المنجنيق ليرقى به في النار فعرض له الأمين جبريل عليه السلام بعدما أعرض عن ملك الرياح وملك الأمطار فقال له:” ألك حاجة ؟” فقال له:” أما إليك فلا وأما إلى الله فبلى.” فقال له الأمين جبريل:” فسله إذن!” فقال عليه السلام :”علمه بحالي، يغنيني عن سؤالي!” .فمن أجل كون مدار الدلالة في هذه الطريقة المحمدية على هذه الحالة الشريفة السنية كانت إبراهيمية حنيفية ……ووراء هذه الوجوه التي ذكرناها لهذه النسبة الجليلة القدر والإضافة السنية الفخر ما لايسعنا الآن شرحه واستيفاؤه ولايمكننا في هذه العجالة بسطه واستقصاؤه. “"}, {"q": "منذ سنوات عديدة وأنا أسأل الأئمة والمقدمين هنا في السنغال ولا أحد أم
