علم."},{"id":534,"c":87,"d":"2019-02-03","t":"أكل لحوم الأسواق الكبرى في أوروبا","q":"السلام عليكم\n\nهل هو حرام علينا نحن المسلمين أن نأكل اللحوم المباعة في الأسواق الكبرى هنا في أوروبا؟","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nقال الله تعالى:\n\n«قُلْ مَنْ حَرَّمَ زِينَةَ اللَّهِ الَّتِي أَخْرَجَ لِعِبَادِهِ وَالطَّيِّبَاتِ مِنَ الرِّزْقِ»\n\n«وَمَا لَكُمْ أَلَّا تَأْكُلُوا مِمَّا ذُكِرَ اسْمُ اللَّهِ عَلَيْهِ وَقَدْ فَصَّلَ لَكُم مَّا حَرَّمَ عَلَيْكُمْ [...]»\n\nليس حرامًا أكل اللحوم المباعة في الأسواق الكبرى في أوروبا نظرًا لأنها تأتي من حيوانات ذُبحت وفق الطقوس الإسلامية وأن قواعد الذبح الشرعية محترمة. ونعلم أن هناك مسالخ خاضعة للمراقبة ومعتمدة من هيئات تحقق إسلامية.\n\nفي حالة ما إذا كان اللحم محل شك (مثلًا إذا لم يكن يحمل ختم هيئة الاعتماد وكان من مصدر مجهول)، فلا يجوز استهلاكه احتياطًا وتورعًا، لكن هذا يحدث نادرًا جدًا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":531,"c":81,"d":"2019-01-23","t":"معلومات عن الصدقات","q":"السلام عليكم ورحمة الله وبركاته.\n\nأود الحصول على معلومات عن الصدقات. لمن يمكن أن نقدمها؟ كيف نعرّف الفقير وكيف نتعرف عليه؟\n\nهل جميع المتسولين يُعتبرون فقراء؟\n\nما الفرق بين المسكين والفقير؟\n\nشكرًا على إجابتكم.\n\nوالسلام عليكم","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبيّن الله (جل شأنه) في كتابه الكريم أن الصدقات أو الزكاة (الصدقات الواجبة) يجب أن تُعطى في المقام الأول للفقراء والمساكين.\n\nاختلف العلماء في تعريف هذين المصطلحين: قال بعضهم إن الفقير هو من يملك مالًا لكنه غير كافٍ لتلبية احتياجاته، والمسكين هو من لا يملك شيئًا البتة. وبالتالي، ووفق هذه التعاريف، الفقير في وضع أفضل من المسكين.\n\nلكن هناك علماء آخرون قالوا العكس تمامًا.\n\nويظهر إذن أن هاتين الفئتين (الفقير والمسكين) من أهل الحاجة، ويمكن أن يدل أحدهما على الآخر إذا ذُكر منفردًا.\n\nيجب على المسلم أن يبذل جهدًا للفحص والاستعلام من أجل تسليم زكاته إلى مستحقيها الشرعيين. ومع ذلك، ليس ملزمًا بالتنقيب في خصوصيات الناس لمعرفة صدق حالتهم لأن ذلك مُحرج. يكفيه أن يعطي زكاته لمن ظهر فقره، وعلم أن ظروفه صعبة وأنه من أهل الحاجة.\n\nأما المتسولون والذين يترددون على مداخل المساجد، فلا يمكن تعميم حالتهم ولا معاملتهم بنفس الطريقة. قد يوجد بينهم من يتخذ التسول مهنة مع أنه قادر على كسب عيشه بطريقة أخرى، وهذه ظاهرة اجتماعية مؤسفة. لكن هناك أيضًا أشخاص آخرين تدفعهم ظروف قاهرة وهم حقًا في حالة مزرية، فلا حرج في إعطائهم.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":530,"c":86,"d":"2019-01-22","t":"ثلاث صيغ للطلاق","q":"أنا مقيمة في بلجيكا، وتزوجنا أنا وزوجي زواجًا دينيًا أمام مفتي. كان زوجي يمر بفترة اكتئاب شديدة وكان يتناول مضادات الاكتئاب. غالبًا كان يهلوس وكان مقتنعًا بأنني أخونه أو أن لدي شيئًا أخفيه. كان يفقد عقله غالبًا، وخلال هذه الفترة، نطق بالطلاق ثلاث مرات في فترة 4 أشهر. في النهاية، دام زواجنا 8 أشهر منها ثلاثة أشهر من الحياة المشتركة. الآن هو نادم ويقول إنه فقد عقله في ذلك الوقت. وإنه لم يكن صافي الذهن ويريد أن يستردني كزوجة له. وأنا أريد ذلك أيضًا، لكنني خائفة لأنه في النهاية نطق بالطلاق 3 مرات ولا أعرف إن كان هناك وسيلة لبقائنا معًا. أشكركم على إجابتكم، بارك الله فيك","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nمن الصعب تحديد الحالة الصحية العقلية للزوج. لذلك، يُفضَّل أن يستشيره طبيب مختص لتحديد حقيقة حالته.\n\nأما بالنسبة للطلاق الذي نطق به الزوج، فيجب أن نعلم أن الطلاق لا يقع إذا نُطق في حالة جنون أو فقدان العقل. فلكي تُرتَّب آثار فعل ارتكبه شخص مسؤول، يجب أن تكون له سلامته العقلية الكاملة والنية والاختيار الحر الموافق لفعله.\n\nإذن إذا نطق هذا الزوج بالطلاق تحت تأثير المرض ولم يكن يعلم ما يقوله، ففعله باطل وكلامه لغو (كلام باطل لا يترتب عليه شيء)، وبالتالي تبقى هذه المرأة زوجته شرعًا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":508,"c":77,"d":"2019-01-15","t":"سلام الصلاة","q":"السلام عليكم ورحمة الله وبركاته.\n\nأود الحصول على مزيد من المعلومات حول كيفية أداء التسليم (التحية الأخيرة) في الصلاة،\n\nفي الواقع، الرأي الراجح عند المدرسة المالكية في الفقه (المذهب) هو أن التسليم (السلام عليكم) يكون فقط إلى اليمين للإمام (الذي يؤم الصلاة) أو للشخص الذي يصلي وحده. بينما المأموم (الذي يصلي خلف الإمام) يجب عليه اثنتان بل ثلاث. تسليمة على يمينه، وواحدة في الوسط للرد على تسليمة الإمام، وإذا وُجد شخص على يسار المصلي يجب عليه أن يرد عليه أيضًا.\n\nهل يمكنكم أن تبينوا لنا الأدلة الشرعية لمثل هذه الممارسات (الأحاديث، الآثار، عمل أهل المدينة إلخ...)؟\n\nوفقكم الله، ورحمكم، ويسّر لكم كما يسّر لنا. والسلام على نبينا محمد، وعلى آله وأصحابه.\n\nوالسلام عليكم ورحمة الله وبركاته.","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته\n\nفعلًا، هذه الكيفية التي ذكرتموها لأداء التسليم (التحية الأخيرة في الصلاة)، هي الطريقة المنتشرة والمعمول بها عند المالكية.\n\nنشير فقط إلى أن التسليمة الثانية والثالثة للمأموم (الذي يصلي خلف الإمام) مستحبة فقط وليست واجبة، لأن الخروج من الصلاة يتم بتسليمة واحدة.\n\nفي «بداية المجتهد ونهاية المقتصد» لابن رشد، ورد ما يلي:\n\nدليل المالكية على أن الإمام يؤدي تسليمة واحدة فقط هو حديث عائشة أم المؤمنين (رضي الله عنها) حيث تصف صلاة الوتر التي أداها النبي (صلى الله عليه وسلم). قالت: «... ثم يؤدي التسليم مرة واحدة قائلًا السلام عليكم، رافعًا صوته حتى أيقظنا من نومنا». (رواه أحمد والنسائي)\n\nوبهذه الكيفية كان يفعل أيضًا عدة من الصحابة مثل ابن عمر وأنس وعائشة (رضي الله عنهم). وقد ورد أيضًا أنه كان يُؤدَّى تسليمتان في مسجد الأنصار وتسليمة واحدة في مسجد المهاجرين.\n\nلكن هناك إجماع على صحة صلاة من يؤدي تسليمة واحدة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":507,"c":87,"d":"2018-11-24","t":"طول السروال والصور","q":"السلام عليكم إخواني المسلمين الأعزاء. قبل كل شيء، شكرًا على هذا العمل الرائع الذي تقومون به على الموقع. لقد مرّ أكثر من سنة بقليل منذ أن اكتشفت هذه الصفحة وتعلمت الكثير عن الدين، وخاصة التصوف والطريقة، بارك الله فيك. في الواقع لدي سؤال لأطرحه عليكم. أنا سنغالي وهنا إخوان من مدرسة أخرى يزعجوننا بمسألة السروال الذي يتجاوز الكاحلين أو تلك المتعلقة بالصور قائلين إنها حرام. أود الحصول على توضيحات، وبشكل أدق رأي شيخنا أحمد التجاني (قدس الله سره العزيز) في المسألة. شكرًا مسبقًا.","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته\n\nالرأي الفقهي المتعلق بالثوب الذي ينزل تحت الكاحلين:\n\nهذا موضوع محل خلاف. آراء الفقهاء منقسمة بين: التحريم، والكراهة، والإباحة.\n\nجمهور العلماء على أن ترك الثوب يتجاوز الكاحلين دون إظهار الكبر والخيلاء بذلك ليس حرامًا ولا يدخل في الفئة المقصودة بالتحذير المتعلق بمنع إسبال الثياب.\n\nوقد ورد أن الإمام أبا حنيفة لبس ثوبًا ثمينًا وأسْبله إلى الأرض. فقيل له: «ألم نُنْهَ عن فعل ذلك!؟» فأجاب: «هذا يخص من يفعل ذلك تكبرًا ولسنا منهم».\n\nقال الحافظ ابن عبد البر في «التمهيد» في شرحه للحديث المتعلق بهذا الموضوع: «هذا الحديث يدل على أن من أسبل ثوبه دون كبر ولا خيلاء لا يشمله الوعيد المذكور، لكن إسبال الثياب مكروه على كل حال».\n\nويُلاحظ أن آراء المالكية تتراوح بين التحريم والإباحة. أما الشافعية فقد صرحوا بوضوح بأن ذلك ليس حرامًا إلا في حالة الكبر.\n\nالرأي الفقهي المتعلق بالتصوير:\n\nأخذ الصور بآلة التصوير أو الكاميرا أو بالهاتف المحمول هو أيضًا محل خلاف. صحيح أن هناك منعًا صريحًا من رسم ذوات الأرواح لأن بهذا الفعل يُحاكى الخلق الإلهي. إلا أن أخذ الصور بالآلة ليس تشكيلًا لصورة ولا رسمًا ولا نحتًا بل هو آلية بصرية للانعكاس. علاوة على ذلك، فالصورة الفوتوغرافية ثنائية الأبعاد فقط وليست ثلاثية.\n\nإذن الحديث المتعلق بالمنع لا يشمل هذه الصور لأن هذه الآلة بالطبع لم تكن موجودة في زمن النبي (صلى الله عليه وسلم).\n\nلهذا، قدّر عدة من العلماء المعاصرين أن التصوير جائز ما دام موضوع الصور جائزًا، وخاصة عندما يتعلق الأمر بضرورة كصور الهوية المخصصة للأوراق والوثائق الرسمية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":506,"c":79,"d":"2018-11-21","t":"أيام الصوم الواجب قضاؤها","q":"السلام عليكم،\n\nفي حالة امرأة عليها أيام صوم يجب قضاؤها لكنها تعود إلى عدة سنوات مضت (2-3 سنوات) وبالتالي لم تُقضَ خلال السنة التي كان يجب أن تُقضى فيها.\n\nما الحكم في ذلك، هل يجب على المرأة أن تقضي هذه الأيام بالصيام حتى بعد سنتين/ثلاث سنوات؟ أم يجب عليها أن تطعم المساكين عن كل يوم صوم؟\n\nبعبارة أخرى، ماذا يجب عليها أن تفعل بخصوص هذه الأيام التي لم تُصَم ولم تُقضَ؟\n\nوكيف تُقدَّر عدد الأيام في حالة أنها لا تتذكر؟\n\nبارك الله فيكم","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته\n\nيجب على المرأة أن تقضي ما فاتها من أيام صوم شهر رمضان. فإذا تركتها عمدًا وبدون عذر شرعي حتى حلول رمضان التالي، خلال سنة أو عدة سنوات، فهي مدينة بكفارة إضافة إلى القضاء. هذا هو رأي المالكية.\n\nفإذا كانت قادرة على الصوم، يجب على هذه السيدة إذن أن تقضي الأيام التي فاتتها. وعلاوة على ذلك، يجب عليها أن تطعم مسكينًا عن كل يوم فات، أو أن تتصدق بما يعادله. لكن لا يمكنها الاكتفاء بإطعام المساكين إذا كانت قادرة على الصوم.\n\nوإذا نسيت كم يومًا فاتها، يجب عليها أن تبذل جهدًا لتقدير وتحديد هذا العدد وفق ما يبدو لها أقرب إلى الحقيقة، وتقضي هذا العدد من الأيام.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":505,"c":87,"d":"2018-11-21","t":"الحيوانات الأليفة","q":"السلام\n\nهل يجوز اقتناء ثعبان كحيوان أليف، وهو غير سام؟\n\nهل يجوز إطعام ثعبان (حيوان أليف) بالفئران والحيوانات الأخرى وهي ما زالت حية؟\n\nالقانون الفرنسي يمنع الشخص من اقتناء بعض الحيوانات الأليفة كالسلاحف البرية الصغيرة والسناجب الحمراء والببغاوات دون التراخيص. لكن، إذا كان المؤمن يستطيع اقتناء ببغاوات وسلاحف برية صغيرة في بيته، وهذه الحيوانات لم تُؤخذ من الطبيعة ولم تُسرق، فهل يمكنني اقتناؤها كحيوانات أليفة دون الأوراق اللازمة مع الأخذ في الاعتبار أنني أنوي الاعتناء بها جيدًا وأن هذه الرحمة بهذه الحيوانات (الاعتناء الجيد بها) تُرضي الله؟\n\nقرأت أنه يجب قتل السحلية الصغيرة المسماة (gecko) لأنها كانت تنفخ على الحطب الذي كان سيحرق النبي إبراهيم (عليه السلام)، هل هذا صحيح؟ كيف يمكن لحيوان يُسبّح الله ككل مخلوق أن يفعل ذلك؟","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته\n\nالثعبان حيوان خطير على الإنسان وهو من الخمسة الحيوانات المؤذية التي أمر النبي (صلى الله عليه وسلم) بقتلها. وبالتالي لا يجوز للمسلم اقتناء ثعبان في بيته ولا فائدة من الحصول عليه.\n\nقال الإمام ابن قدامة: «ما يجب قتله يحرم اقتناؤه».\n\nقال الإمام السيوطي: «ما حُرِّم استعماله حُرِّم اقتناؤه».\n\nأما الطيور، ومنها الببغاء، فلا حرج في تربيتها ويجوز اتخاذها حيوانات أليفة لجمال أصواتها وهيئاتها، بشرط الاعتناء بها جيدًا.\n\nأما الحيوانات البرية الأخرى والوحوش كالذئاب والزواحف والحشرات، فجمهور العلماء يمنع ذلك، من جهة لخطورتها المحتملة وعدم فائدة تربيتها، ومن جهة أخرى لأن في ذلك تشبهًا بالمترفين والمبذرين.\n\nوأخيرًا، بالنسبة للسحلية التي ذكرتموها، فالرأي الفقهي المعتمد عند جمهور العلماء هو الأمر بقتلها، تطبيقًا للحديث المتعلق بها. إلا أن بعض العلماء، وخاصة المعاصرين، يرون أن ذلك مبالغة وأنه يتعارض مع الحكمة الإلهية في الخلق. والمهم أن تعلموا أنه ليس واجبًا عليكم أن تسعوا لقتل هذه الحيوانات. فإذا وجدتموها في بيتكم وقتلتموها فهذا جائز، وإذا تركتموها تخرج وتذهب لسبب أو لآخر فهذا ليس حرامًا أيضًا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":504,"c":87,"d":"2018-11-09","t":"تضفير الشعر","q":"السلام عليكم ورحمة الله.\n\nأردت أن أعرف إن كان تضفير شعرها الخاص، أي عمل الراستا، لامرأة تتحجب، هل هو محرم في الإسلام؟\n\nالسلام","a":"إجابة الشيخ لطيم، حفظه الله.\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته\n\nلا حرج على المرأة في تضفير شعرها ما دام مستورًا وفق الضوابط الشرعية.\n\nوالقاعدة المتعلقة بتحريم التشبه بغير المسلمين في أزيائهم وعاداتهم، هي أن من يفعل ذلك لا يفعله إلا للتشبه بهم وأنه يتبنى إحدى علاماتهم المميزة. لا يفعل ذلك إلا من هو تحت تأثيرهم العقدي.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته\n\nالسلام عليكم ورحمة الله وبركاته."},{"id":503,"c":84,"d":"2018-10-31","t":"اسم المولود الجديد","q":"السلام عليكم\n\nأريد أن أعرف الحكم الإسلامي المتعلق باسم المولود الجديد، هل يجوز تسميته عند الولادة؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله.\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيوجد في السنة (التقليد النبوي) ما يدل على استحباب تسمية المولود الجديد في اليوم السابع من ولادته، وفق الحديث الذي رواه الإمام أحمد وغيره من الرواة: «كل غلام مرتهن بعقيقته، تذبح عنه يوم سابعه، ويحلق رأسه ويسمى.»\n\nوهذا رأي جمهور العلماء، إذ قالوا إنه يجوز تسمية الطفل في اليوم الأول من ولادته لكن الأفضل في اليوم السابع.\n\nغير أن المالكية يرون أن الأفضل التسمية في يوم الولادة نفسه، اتباعاً لما فعله النبي (صلى الله عليه وسلم) بعد ولادة ابنه إبراهيم. ويبقى اليوم السابع مستحباً أيضاً؛ والأمر فيه سعة والاختيار إن شاء الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته.\n\nالسلام عليكم ورحمة الله وبركاته."},{"id":502,"c":82,"d":"2018-10-13","t":"البيع بسعر أعلى إذا…","q":"السلام عليكم. عندي سلعة ثمنها 500 فرنك لمن يريدها بدون أجل. أما من يريدها بالأجل فسيدفع 1500 فرنك. هل هذا النوع من التجارة جائز في الإسلام؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nهذا النوع من البيع يدخل فيما يسمى بيع «النسيئة».\n\nيوجد خلاف في مسألة زيادة ثمن الشيء مقابل دفعه إلى أجل؛ غير أن هذا النوع من التجارة يعتبر جائزاً عند جمهور العلماء ومنهم المالكية. وهم في ذلك يتبعون القاعدة التي تنص على أن الأصل في الأشياء الإباحة (الحكم بالإباحة افتراضياً).\n\nقال الله تعالى: {وأحل الله البيع وحرم الربا}، ولا يوجد نص صريح يمنع هذا النوع من البيع.\n\nيجب أن يتفق البائع والمشتري من البداية على صيغة واحدة للبيع (في حالتنا: 500 نقداً أو 1500 إلى أجل)، ويجب أيضاً، بالطبع، رضا الطرفين (البائع والمشتري).\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته\nالسلام عليكم ورحمة الله وبركاته."},{"id":501,"c":82,"d":"2018-09-24","t":"استئجار عقار مُشترى بالقرض…","q":"السلام عليكم ورحمة الله\n\nلا أريد أن آخذ قرضاً لشراء منزل لأنه حرام، فاقترحت على شخص غير مسلم أن يشتري عقاراً لأكون أنا مستأجراً لهذا العقار، لكن هذا الشخص يشتريه بالقرض\n\nليس لي أي حصة في هذا العقار ولن يصبح ملكي أبداً، أدفع فقط إيجاراً كمستأجر\n\nأردت أن أعرف هل هذا جائز في الإسلام إذا كنت أنا السبب في شرائه لهذا العقار بالقرض حتى لو كنت مجرد مستأجر ولا أشارك في هذا القرض. بارك الله فيكم، الأمر عاجل إلى حد ما","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلك هذا فيه شبهة مريبة لأن هذا الشخص ليست له نية شراء هذا العقار لنفسه بل سيشتريه من أجلك وبناءً على طلبك.\n\nالقاعدة الفقهية تنص على أن التحايل للالتفاف على المحرم محرم، فلا يجوز التوسط بشخص للحصول على شيء محرم.\n\nلو كان هذا الشخص مالكاً لهذا العقار، حتى ولو اقتناه بقرض ربوي، فلا حرج في أن تستأجره، لأنك لست مسؤولاً عن أفعال الآخرين.\n\nأما أن تجرّ غيرك إلى القيام باقتناء محرم من أجلك فلا يجوز.\n\nوالله أعلم.\n\nوعليكم السلام ورحمة الله وبركاته."},{"id":500,"c":76,"d":"2018-09-24","t":"إفرازات","q":"صباح الخير،\n\nعندما أستعيد حالتي من الطهارة، بعد 20 يوماً من حيضي يحدث أحياناً أن يخرج مني سائل أبيض/مصفر. علاوة على ذلك، هذا السائل لا يخرج أثناء التبول، بل في أثناء النهار مثلاً.\n\nهل هو نجس؟ سؤالي هو أساساً معرفة هل يوجب عليّ الغسل الكبير أم الصغير؟\n\nشكراً","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nهذا السائل إما أن يكون حيضاً جديداً، وإما أن يكون اضطراباً أو مرضاً. على هذه الأخت أن تتحقق وتقارن بين هذا السائل والدم الذي يخرج عادة، وفي كل الأحوال هذا السائل نجس.\n\nوفيما يخص الطهارة الشرعية، إن كان حيضاً فيجب الغسل الكبير، وإن كان شيئاً آخر فيجب الوضوء الصغير.\n\nيجب التحقق، فالمرأة أعلم بحيضها.\n\nوالله أعلم.\n\nوعليكم السلام ورحمة الله وبركاته."},{"id":498,"c":85,"d":"2018-09-21","t":"مشاكل زوجية","q":"صباح الخير، السلام عليكم\n\nبعد العديد من الشجارات في علاقتي مع زوجتي بخصوص العائلة وخاصة الأمهات، انفصلنا لبعض الوقت للتفكير في المسار الذي سنعطيه لحياتنا لأن لدينا 3 أطفال.\n\nإذن رغم مشاكل الماضي قررنا أن نأخذ زمام علاقتنا بأيدينا وننسى الباقي. وضعنا شروطاً ومن بينها قررنا أن نهتم بأطفالنا أولاً وأن نضع العائلتين جانباً لبعض الوقت.\n\nأنا وحماتي (أم زوجتي) كانت بيننا مشاكل كثيرة في الماضي وكذلك زوجتي وأمي\n\nزوجتي اليوم تأخذ بناتنا وتذهب بهن إلى والديها بدوني. هذا لا يزعجني وأنا موافق لأن الصغيرات لهن الحق في رؤية أجدادهن. مشاكل الكبار لا تخص الأطفال.\n\nوأنا أقبل ذلك، لا أمنع زوجتي.\n\nلكن زوجتي تقول لي: لك الحق أن تأخذ الأطفال إلى أمك إذا ذهبت قبل ذلك لرؤية أمي. وهي تدعي أنها تفعل ذلك لكي يكبر الأطفال ويعيشوا بشكل طبيعي\n\nتريد أن تتجنب أن أقطع أنا الصلة بعائلتها. وبما أن مشاكلنا ما زالت حديثة فأنا لا أريد ولست مستعداً للذهاب لرؤيتها.\n\nوزوجتي تقول لي إذن: إذا لم تذهب لرؤية أمها فلا تأخذ أطفالك للذهاب إلى أمك.\n\nأمي لم ترَ أطفالي منذ شهرين، بينما والداها يريان أطفالي مرة في الأسبوع على الأقل.\n\nعلماً أنني لا أفرض عليها شيئاً ولا أضع لها أي شرط، كيف أجعلها تفهم أن ما تفعله ظلم وخطأ\n\nتقول إنها لا تريد قطع الصلات لكنها لا شعورياً تفعل ذلك لأن أطفالي لم يعودوا يرون أمي.\n\nأرفض هذا الابتزاز.\n\nأردت أن أعرف ماذا يقول الإسلام في ذلك\nشكراً جزيلاً","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالحياة الزوجية الناجحة هي التي تبنى على المودة والاحترام المتبادلين. الحب يجمع أفراد الأسرة وتنزل عليها السكينة، كما ورد في القرآن الكريم والسنة.\n\nأنصح هذين الزوجين بالدخول في حوار هادئ وموضوعي وفق قواعد الشريعة الإسلامية، حوار يقوم على الرغبة المشتركة في تليين الوضع، عازمين كلاهما على التنازلات والعدل والإحسان. {إن الله يأمر بالعدل والإحسان ويحب المحسنين.}\n\nالله (تعالى) يوصي الأزواج بقوله: {وعاشروهن بالمعروف}. أنصح الزوجين بألا يدعا أحداً يتدخل في شؤونهما العائلية، إلا بصفة مستشار أمين وبموافقتهما المتبادلة. لقد أمر الإسلام ببر الوالدين وحسن المعاملة مع الأقارب؛ وبالتالي ليس لنا الحق في حرمان الأطفال من زيارة أقارب العائلتين. بل على العكس، نحن ملزمون بتربيتهم على حبهم. ويجب علينا أيضاً إبعادهم عن الخصومات والشجارات والحرص على ألا نتخذهم وسيلة ضغط لمصالح البعض الشخصية على البعض الآخر. فلنتق الله في أنفسنا وفي أسرنا.\n\nأسأل الله لهذين الزوجين، ولجميع المسلمين، الصلح والتوفيق والهداية الحسنة. آمين\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":495,"c":77,"d":"2018-09-06","t":"لغة خطبة الجمعة وخطبتي العيدين","q":"بسم الله الرحمن الرحيم\n\nوالصلاة والسلام على رسول الله\n\nالسلام عليكم إخوتي الأعزاء\n\nماذا تقول المدرسة المالكية عن إلقاء الخطبة بلغة غير العربية؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nعند المالكية، الخطبة باللغة العربية من شروط صحة خطبة الجمعة، حتى لو كان الحاضرون غير ناطقين بالعربية. وجمهور العلماء على هذا الرأي إلا الحنفية الذين يجيزون الخطبة بلغة أخرى.\n\nوالسبب في ذلك أن هذه الخطبة عبادة كالصلاة، ولم يثبت أن النبي (صلى الله عليه وسلم) خطب بغير العربية، ولا الخلفاء الراشدون والسلف الصالح بعده.\n\nأما خطبة عيدي الفطر والأضحى، فالخطبة ليست شرطاً لصحة صلاة العيد وحضورها مستحب فقط. والأصل أن تكون الخطبة بالعربية قياساً على خطبة الجمعة لكن هذا ليس واجباً.\n\nومع ذلك يجب أن نأخذ بعين الاعتبار في هذه المسألة الوضع الحالي للمسلمين في الغرب حيث الغالبية العظمى من الناس لا يتكلمون العربية، مما يجعل الخطبة بلا فائدة. فيجوز حينئذ ترجمة الخطاب وإلقاؤه، إما من الإمام أثناء الخطبة، أو خارج الخطبة (قبلها أو بعدها) من الإمام أو من شخص آخر.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":486,"c":82,"d":"2018-09-05","t":"العمل في شركة لليانصيب والمراهنات","q":"السلام عليكم\n\nصباح الخير\n\nأريد أن أعرف هل يجوز للمسلمين العمل في شركة تعنى بالمراهنات واليانصيب.\n\nيتعلق الأمر بأن يكون موظف مكتب (إدارة) في شركة تعنى بالمراهنات على الخيل واليانصيب (ألعاب الحظ).\n\nوكذلك في بنك تجاري كلاسيكي كموظف مكتب.\nشكراً","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nألعاب الحظ والربا شيئان محرمان في الإسلام.\n\nمسألة عمل المسلمين في هذا النوع من الشركات (كالبنوك التي تتعامل بالربا أو التي تعمل في مجال اليانصيب) أصبحت سؤالاً متكرراً جداً، وأمر التعامل مع البنوك قد عمّ بحيث لا يستطيع عامة الناس تجنبه.\n\nوللإجابة على هذا السؤال يجب، من جهة، تحليل أنشطة هذه الشركات وتفصيلها ومدى توافقها مع الشرع والفقه الإسلامي، ومن جهة أخرى، مراعاة الضرورات المفروضة على الموظفين والتيسيرات التي يمكن تطبيقها وفق الضوابط الفقهية.\n\nوآراء العلماء كالتالي:\n\n– فريق يمنع العمل في البنوك منعاً باتاً ومطلقاً، لأن نشاطها مبني على الربا، فالعمل فيها معصية لأنه مساهمة في إتمام المحرم، والله تعالى يقول: {ولا تعاونوا على الإثم والعدوان} سورة المائدة 5/2.\n\n– وفريق فصّل في الموضوع وقال:\n\nإذا كان عمل الموظف يتمثل في كتابة عقود الربا وتسجيلها أو تنظيم المراهنات واليانصيب، فإنه يشارك في الإثم وهذا غير جائز شرعاً. قال جابر (رضي الله عنه): لعن النبي (صلى الله عليه وسلم) آكل الربا وموكله وكاتبه وشاهديه، وقال: «هم سواء في الإثم». رواه مسلم وأحمد وغيرهما.\n\nأما إذا لم يكن العمل مرتبطاً مباشرة بنشاط الشركة، كأن يكون مثلاً: سائقاً، أو حارساً، أو موظف استقبال أو صيانة… فلا حرج في ذلك خاصة عند الضرورة وإذا لم يجد عملاً آخر.\n\nعمل البنوك يقوم على نظام مالي عالمي، وعملياً يجد جميع المسلمين أنفسهم مضطرين للتعامل معها بطريقة أو بأخرى، فالمنع الكامل لهذه التعاملات سيمثل تعطيلاً لمصالح الأمة.\n\nويجب التوضيح أخيراً أن على جميع المسلمين أن يتعاونوا لإصلاح هذا الأمر، كلٌّ حسب مجاله وتخصصه.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":494,"c":87,"d":"2018-08-20","t":"أسئلة عن الغيبة","q":"السلام عليكم،\n\nعندي أسئلة عن الغيبة:\n\n– ما الفرق بين «الغيبة» و«النميمة»؟\n\n– كيف نتوب من ذنب الغيبة؟\n\nهل يجب حتماً طلب العفو ممن اغتبناه أم أن ذلك فقط إذا كان على علم بأننا اغتبناه؟\n\nشكراً على جوابكم","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\n«النميمة» (نقل الكلام)، هي نقل كلام بعضهم عن بعض بقصد إحداث المشاكل وبث الفتنة والعداوة بين الناس، كأن تقول لشخص: فلان تكلم عنك وقال كذا وكذا…\n\nوهي من أسوأ آفات اللسان المحرمة ونعوذ بالله منها.\n\nأما «الغيبة» فهي أن تتكلم عن أخيك في غيبته بما يكره أن يقال عنه. فإن كان بريئاً مما قلت فقد بهتّه.\n\nوهي أيضاً من آفات اللسان المحرمة، قال الله تعالى: {ولا يغتب بعضكم بعضا} سورة الحجرات 49/12\n\nوللتوبة من الغيبة يجب الإقلاع الفوري عن هذا الذنب، والندم على ارتكابه، والعزم على ألا يعود إليه أبداً. ثم يمكنك الاعتذار للشخص الذي اغتبته بشرط ألا يؤدي ذلك إلى شر أو بغضاء أو قطيعة رحم.\n\nولا يلزمك الاعتذار له خصوصاً إذا لم يكن على علم بما قلت. بل استغفر الله له كأن تقول مثلاً: «اللهم اغفر لي ولأخي»، وحاول إصلاح هذا الضرر حسب قدرتك بذكر محاسنه عند الناس الذين تكلمت عنه عندهم بسوء، كأن تقول مثلاً إن ما قلته عنه غير صحيح وإنه بريء من كل ذلك…\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":479,"c":82,"d":"2018-08-14","t":"أجر مشروع مسجد","q":"السلام عليكم ورحمة الله.\n\nأنا مقدم خدمات لرخص البناء، وأنجز أحياناً مخططات لبناء المساجد أو توسيعها.\n\nالإخوة يعرضون عليّ إذن أجراً مقابل خدمتي. هل يحق لي قبول كلها أو جزء منها؟\n\nشكراً مقدماً على جوابكم، أخوكم في الله عبد المحيي.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالأفضل له أن يقوم بهذا العمل تطوعاً ابتغاء مرضاة الله تعالى. لكن يجوز له أن يأخذ أجراً على عمله ولا حرج في ذلك.\n\nفله الخيار بين التطوع والأجر.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":490,"c":87,"d":"2018-07-31","t":"البدعة في المدرسة المالكية","q":"السلام عليكم يا سيدي،\n\nيا سيدي، انشغالنا يتعلق بمسألة البدعة في مدرستنا المالكية النبيلة، وبما أنني لا أعرف أين أنشرها وضعتها هنا.\n\nيا سيدي، مسألة تقسيم البدعة قد عولجت بشكل ممتاز في الجواب على سؤال الأسئلة الشائعة، لكننا نهتم حصرياً بالآراء المختلفة للمدرسة المالكية.\n\nيا سيدي، إخواننا الذين هم ضد التمييز بين البدعة الحسنة والسيئة يلوموننا على عدم اتباع موقف إمامنا مالك (رحمه الله) الذي ينقلون عنه هذه الكلمة: «من ابتدع في الإسلام بدعة يراها حسنة فقد زعم أن محمداً (صلى الله عليه وسلم) خان الرسالة، لأن الله عز وجل يقول: اليوم أكملت لكم دينكم. فما لم يكن يومئذ ديناً فلا يكون اليوم ديناً.» (الاعتصام، 1/48).\n\nويستعملون أيضاً مؤلفات أئمتنا ابن الحاج والشاطبي (رضي الله عنهما) لرفض هذا التمييز.\n\nأسئلتنا هي كالتالي:\n1) ماذا كان يقصد الإمام مالك (رحمه الله) بكلمته المذكورة أعلاه؟\n2) كيف نفهم أن يكون للأئمة رأي مختلف عن رأي إمامهم؟\n3) هل يمكن الحصول على ملخص موجز للمواقف الدقيقة للإمامين ابن الحاج والشاطبي؟\n4) هل طرق هؤلاء الأئمة انتُقدت أم أُقرّت؟\n5) ما هو الموقف الرسمي للمدرسة المالكية في هذه المسألة؟\n\nنسأل الله عز وجل أن يرزقكم الصبر على الصبر معنا.","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته\n\nأحييكم وأسأل الله أن يهدينا إلى ما يحب ويرضى.\n\n– أولاً، التعريف اللغوي لكلمة «بدعة» هو الشيء المبتدع الذي لم يكن موجوداً من قبل. وفي الشرع الإسلامي، هو ما أُحدث دون أن يُذكر في القرآن ولا في السنة.\n\nفي القرآن، أثنى الله تعالى على المؤمنين من أمة سيدنا عيسى (عليه السلام):\n\n{وجعلنا في قلوب الذين اتبعوه رأفة ورحمة ورهبانية ابتدعوها ما كتبناها عليهم إلا ابتغاء رضوان الله} (سورة الحديد 57، الآية 27).\n\nوهكذا، فقد هنّأ الله هؤلاء المؤمنين لأنهم كانوا أناساً ذوي رأفة ورحمة، ولأنهم ابتدعوا الرهبانية، أي أنهم كانوا يتجردون من الملذات المباحة فضلاً عن اجتناب المحرمات، فأثنى الله عليهم لهذه الرهبانية التي لم يأمرهم بها سيدنا عيسى (عليه السلام).\n\nوفي آخر هذه الآية قال الله: {فما رعوها حق رعايتها}، وهذه الكلمة لا تتضمن لوماً لهم ولا للرهبانية التي ابتدعها هؤلاء المؤمنون المخلصون، بل للأجيال اللاحقة التي خلفتهم بإضافة الشرك، وعبادة عيسى (عليه السلام)، والاعتقاد بالتثليث.\n\n– الدليل المستمد من السنة النبوية على وجود بدعة حسنة\n\nقال النبي (صلى الله عليه وسلم):\n\n«من سن في الإسلام سنة"},{"id":489,"c":87,"d":"2018-07-31","t":"لبس العمامة والوشاح","q":"السلام عليكم ورحمة الله\nيا سيدي،\n\nأحب العمائم كثيراً، هل لبسها سنة؟ إذا كان الجواب نعم، فتوجد عدة طرق للفها على الرأس، هل يمكن معرفة الطرق التي كان النبي الكريم (صلى الله عليه وسلم) يحبها، والألوان. نفس السؤال بالنسبة للوشاح.\n\nوالسلام عليكم ورحمة الله وبركاته","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي شرح زاد المستقنع، قال الشيخ الشنقيطي:\n\n«أما لبس العمامة فهو يعتبر من السنن.\n\nوعليه فمن لبس العمامة اقتداءً بالنبي (صلى الله عليه وسلم)، فالذي فهمناه من الفتاوى الفقهية لعلمائنا (رحمهم الله) أنه من السنن. وهذا مذكور في كتبهم (رحمهم الله). […]\n\nإذا لبسها الرجل اقتداءً بالنبي (صلى الله عليه وسلم) أُجر على ذلك، ومن هذه الجهة يعتبر سنة، أي بنية الاقتداء بالنبي (صلى الله عليه وسلم).\n\nأما ازدراء من يلبسون العمامة، والتشدد في هذا، واعتبار أنهم لا يقتدون بالنبي (صلى الله عليه وسلم)، فقد أخبر العلماء أنه لا يصح فرض الرأي على غيرهم. فإذا رأيت أن النبي (صلى الله عليه وسلم) كان يلبس العمامة وأردت بذلك الاقتداء به في فعله، فاعلم أنه لا حرج في ذلك وستُؤجر عليه.\n\nوالقاعدة الأساسية هي: الاقتداء بالنبي (صلى الله عليه وسلم) ما لم يوجد دليل يثبت أنه ليس اقتداءً.\n\nقال الله: {لقد كان لكم في رسول الله أسوة حسنة} (سورة الأحزاب؛ الآية 21)\n\nرأى أنس بن مالك (رضي الله عنه) النبي (صلى الله عليه وسلم) يتتبع الدبّاء في طبق فقال: «ما زلت أحب الدباء منذ رأيته يتتبعها.»\n\nإذا كان هذا في الدباء والطعام فكيف بالهيئة والآداب والحال؟\n\nلا شك أن الله أعطاه أكمل الهيئات وأشرفها.\n\nوقد ثبت في الحديث أن النبي (صلى الله عليه وسلم) كان يخطب وهو لابس عمامة سوداء كما ورد في الصحيح.\n\nوالمقصود هنا أن من فعل هذا اقتداءً بالنبي (صلى الله عليه وسلم) لا يمكن لومه.\n\nبعض الطلبة اليوم يزدرون من يقتدون بالنبي (صلى الله عليه وسلم) بلبس العمامة، وهذا لا ينبغي فعله.\n\nحتى لو أخذنا بالرأي القائل إنها ليست سنة، فلا يجب إجبار من يريدون على العكس الاقتداء بالنبي (صلى الله عليه وسلم). فالصحابة (رضي الله عنهم) كانوا يقتدون بالنبي (صلى الله عليه وسلم) حتى في الطعام والشراب، وخاصة في الهيئة والآداب.\n\nأما الخلاف بين السنن العادية غير العبادية والسنن العبادية، فهو نظر عقلي معروف عند علماء أصول الفقه، وهم لا ينتقدون الاقتداء.\n\nوكون الرجل يحب أن يشبه هيئة النبي (صلى الله عليه"},{"id":488,"c":87,"d":"2018-07-31","t":"شراء السجائر","q":"بسم الله، الصلاة والسلام على رسول الله (صلى الله عليه وسلم)،\n\nفي البداية، أشكركم على الجهود التي تبذلونها. أسأل الله أن يعينكم ويساعدكم ويجازيكم بحبيبه النبي (صلى الله عليه وسلم).\n\nثم السؤال هو كالتالي:\n\nشخص يطلب مني أن أشتري له سجائر لأنه في حاجة وليس له بديل آخر سوى أن يطلب مني.\n\nبماذا تنصحونني آخذاً بعين الاعتبار القرآن والسنة، هل أشتري له أم لا.\n\nجزاكم الله الهدف الذي تفعلون من أجله كل هذا.\n\nوالسلام عليكم ورحمة الله وبركاته","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nاحذر أخي العزيز، لا يجب أن تستمر في تقديم مساعدتك له في مثل هذا الأمر. حرمة استهلاك التبغ ثابتة في الفقه، وهي مكروهة عند أهل العلم (رضي الله عنهم). أنت تعينه على ارتكاب محرم، وهذا ليس من القرآن ولا من سنة النبي (صلى الله عليه وسلم). والعقل أيضاً يأمرك بالكف عن مساعدته في شراء التبغ. بل يجب أن تساعده على الإقلاع عن هذه العادة السيئة الضارة. هداه الله.\n\nوالله ورسوله (صلى الله عليه وسلم) أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته\n\nلمزيد من التفاصيل حول هذا الموضوع، راجع المدرسة الأحمدية – نصائح لأبناء الإسلام الصغار، نص الشيخ محمد المنصور المحي الدين التجاني، حفظه الله:\n\nأيها الطفل العزيز، اعلم أن جميع أنواع التبغ، والسجائر، والشمة، والغليون، وكل مادة ضارة أخرى، من الأشياء المحرمة في ديننا السليم الجميل.\n\nاعلم أيها الطفل أن السيجارة ضارة لجميع الكائنات عموماً، فإذا كانت هذه المادة خبيثة لجميع المخلوقات فاعلم أننا نحن المسلمين هي أخبث علينا بكثير… اقرأ التتمة"},{"id":487,"c":87,"d":"2018-07-31","t":"قرض بنكي بفائدة","q":"السلام عليكم.\n\nأتصل بكم لمعرفة رأي شيوخ الطريقة التيجانية بخصوص القرض البنكي للمسلمين عموماً و«مسلمي أوروبا».\n\nلقد اشتريت شقة بالتقسيط نعيش فيها حالياً.\n\nلكن اليوم نريد شراء منزل لمساحة أكبر وجودة حياة أفضل. لكني أخشى أن أسيء استعمال الرخصة الممنوحة للمسلمين في التعاقد على قروض بالتقسيط. ولهذا أتوجه إليكم لمعرفة ما هو الموصى به في الطريقة عموماً، حتى أتمكن من اتخاذ الحل الأنسب الذي لن يترك مجالاً للتردد.\n\nبارك الله فيكم.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\nوعليكم السلام ورحمة الله وبركاته.\n\nالضرورة تقدر بقدرها. ما أُبيح لضرورة ملحة لا يُباح في غيرها. قال الله تعالى: [فمن اضطر غير باغ ولا عاد فلا إثم عليه].\n\nهذا الموضوع، أخي العزيز، محل خلاف. وتعددت آراء الفقهاء فيه بين من يمنع ومن يجيز، مع مراعاة وضع الجالية المسلمة الموجودة في بلد لا يُحكم بالشريعة الإسلامية.\n\nوفي طريقتنا التيجانية المحمدية، نأخذ بالأيسر لكن في طريق الوسطية والاتباع. وطريقتنا تأمرنا أيضاً بالورع وألا نقع في إساءة استعمال الرخص باتباع الأهواء.\n\nإذن، خوفاً وحرصاً على الابتعاد عن مسائل الخلاف، يجب الاكتفاء بالقرض الذي أخذته لشراء مسكنك الحالي، بما أنك لست في وضع ضرورة شرعية.\n\nوالله أعلم."},{"id":485,"c":86,"d":"2018-07-31","t":"الطلاق","q":"السلام عليكم، أكتب إليكم اليوم لأنني أمام وضع حرج إلى حد ما. أنا متزوجة منذ 16 سنة ولدي 3 أطفال. المشكلة أن السنوات السبع الأخيرة أنا وزوجي لم تعد بيننا علاقات جنسية والرفض يأتي منه دون أي عذر مقبول. زوجي لا يريد الطلاق وحتى عندما أطرح موضوع الانفصال يهددني بأخذ الأطفال وتركي دون دخل بما أنني منذ بداية الزواج لم أعمل أبداً وأنا معتمدة عليه كلياً. لقد تحملت هذه السنوات الطويلة دون تقارب جسدي والآن وصلت إلى حدي لأني كنت في رأيي صبورة أكثر من اللازم على أمل أن يتحسن الوضع لكن دون جدوى. إذن أريد أن أعرف هل بعد 7 سنوات هل نحن ما زلنا متزوجين من الناحية الإسلامية؟ ماذا يقول الإسلام بخصوص مسؤولية هجر الزوج للفراش الزوجي ورفض الزوج أداء واجبه الزوجي؟ هل من الناحية الدينية لي الحق في الاحتفاظ بأطفالي بما أن الوضع ناتج عن سلوكه؟؟ شكراً مقدماً على مساعدتي.","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأشكركم على هذا السؤال القيّم، بارك الله تعالى فيكم.\n\nقال الله تعالى في كتابه الكريم: {ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودة ورحمة} (سورة الروم 30، الآية 21)\n\nقال رسول الله (صلى الله عليه وسلم): «ألا إن لكم على نسائكم حقا، ولنسائكم عليكم حقا.» (رواه الترمذي، متفق عليه.)\n\nقال الله تعالى: {وعاشروهن بالمعروف} (سورة النساء 4، الآية 19)\n\nيجب على زوجك أن يتقي الله تعالى في طريقة تعامله معك، لأنه سيحاسب على هذا الفعل المرتكب دون سبب وجيه، كما تشرحين في سؤالك.\n\nقال النبي (صلى الله عليه وسلم): «استوصوا بالنساء خيرا، فإنهن عوان عندكم.» (متفق عليه.)\n\nوهذا يعني أنهن كالأسيرات، وهذا يكشف عن ضعفهن.\n\nوتأملوا معنى قول النبي (صلى الله عليه وسلم): «استوصوا» بالعربية، فهي تحمل معنى قبول الوصية، كأن النبي (صلى الله عليه وسلم) يقول: «أوصيكم وصيتي في النساء، فاقبلوا توصياتي في شأنهن».\n\nوقال النبي (صلى الله عليه وسلم) أيضاً: «استوصوا بالنساء، فإن المرأة خلقت من ضلع، وإن أعوج شيء في الضلع أعلاه، فإن ذهبت تقيمه كسرته، وإن تركته لم يزل أعوج، فاستوصوا بالنساء.» (رواه البخاري ومسلم، متفق عليه)\n\nواعلموا أن آخر وصايا النبي (صلى الله عليه وسلم) كانت: «الصلاة الصلاة، وما ملكت أيمانكم.» متفق عليه.\n\nهذا الزوج يرتكب إثماً بما يفعله، دون خوف من الله ودون إعطاء الحق لزوجته، دون"},{"id":484,"c":86,"d":"2018-07-31","t":"الطلاق والزواج من جديد","q":"السلام عليكم\nأبو أطفالي نطق بالطلاق وهو حرام لأني كنت حاملاً في شهرين\n\nكانت المرة الأولى وكان غاضباً\n\nانتهت فترة العدة ووضعت ولداً صغيراً الحمد لله\n\nأريد أن أعرف هل يمكننا أن نتزوج من جديد\nشكراً مقدماً على ردكم","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\nوعليكم السلام ورحمة الله وبركاته.\n\nنعم، بالفعل وقع الطلاق حتى لو كان محرماً إيقاعه، وبما أن فترة العدة انقضت فهو طلاق بائن بينونة صغرى. فإذا رغب الزوجان السابقان في الزواج من جديد، فعليهما حينئذ إبرام زواج جديد بشروطه وأركانه: الرضا، والولي، والمهر، والشهود…"},{"id":483,"c":85,"d":"2018-07-31","t":"الزواج","q":"السلام عليكم،\n\nتابعت مؤخراً مناظرة بين أئمة كان موضوعها الزواج، وأحدهم كان يؤيد أنه يمكن عقد الزواج بالرسائل النصية أو رسائل الوسائط، دون شاهد. لا أنكر هذه الأطروحة، لكني أود أن توضحوا لي هذا النوع من الزواج، إن كان موجوداً.\n\nبارك الله فينا، بجاه سيدنا محمد (صلى الله عليه وسلم)","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nقبل كل شيء اعلموا أن هذه المسألة تتناقض تماماً مع نصوص الشرع والأحكام المتعلقة بالزواج المذكورة في كتاب الله تعالى، وسنة نبيه (صلى الله عليه وسلم)، وآراء المذاهب الفقهية الأربعة، وهي مسألة يجب إنكارها، وهذا النوع من الزواج غير مطلوب ولا شرعية له.\n\nيمكنكم مراجعة الأحكام المتعلقة بصحة الزواج وفق المذاهب الأربعة وبشكل خاص في مذهبنا المالكي.\n\nالإعلان، والرضا، والشهود، وصيغة القبول، والعقد، كل هذه الأمور ضرورية لإتمام الزواج.\n\nوالله تعالى هو العظيم الأعلم وكذلك رسوله (صلى الله عليه وسلم).\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":482,"c":85,"d":"2018-07-31","t":"الزواج بغير مسلمة","q":"السلام،\nأود أن أعرف موقف الإسلام وبشكل خاص الطريقة التيجانية، من زواج مسلم بغير مسلمة.\nأيضاً، هل موافقة الوالدين غير المسلمين واجبة؟\nبارك الله فيك.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالطريقة التيجانية طريقة سنية، لا تأمر أتباعها إلا باتباع أحكام الدين في الظاهر والباطن.\n\nفي الشريعة الإسلامية، يجوز بلا خلاف للمسلم أن يتزوج بغير مسلمة من أهل الكتاب، يهودية أو نصرانية، بشرط أن تكون صالحة، أي امرأة عفيفة لا تتعاطى الفاحشة.\n\nوفي جميع الحالات الأخرى، لا يجوز للمسلم أن يتزوج من أهل الديانات الأخرى كالمشركة، والملحدة، وعابدة الأوثان، إلخ.\n\nوالحكمة في ذلك أن من تنتمي إلى أهل الكتاب تقرّ بدين، وتعترف بوجود خالق، وتقر بالرسالات، والبعث، إلخ.\n\nلكن هذه الإباحة ليست مطلقة، لأن أساس الزواج هو التكامل والانسجام والتوافق على المبادئ التي تجمع القلوب.\n\nيجب على المريد أن ينظر في هذه المسألة: هل فيها مصلحة لدينه ولحياته؟ خاصة فيما يتعلق بتربية الأطفال والتزاماته الروحية في هذا الطريق…\n\nوعليه أن يستخير ربه كما عليه أن يطلب إذن شيخه المربي، فهو له ناصح أمين بإذن الله تعالى.\n\nأما مسألة قبول الولي فهي واجبة وفق الآية القرآنية: [فانكحوهن بإذن أهلهن]\n\nوقول النبي (صلى الله عليه وسلم): «لا نكاح إلا بولي.»\n\nالولي ركن أساسي لقيام عقد الزواج، وولي المرأة غير المسلمة هو من يكون على دينها كأبيها، وجدها، وأخيها، وعمها…\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":481,"c":83,"d":"2018-07-31","t":"الإباحية","q":"السلام عليكم، هذا ما يحدث لي.'\nأنا في طريقة الشيخ التجاني منذ 2010.\nمشكلتي الوحيدة كانت أنه كان يحدث أن أضر نفسي بمشاهدة مقاطع إباحية على هاتفي. ذات صباح في مجلس الوظيفة نحو أوقات جوهرة الكمال وضعت هاتفي على الراية البيضاء القماشية وقلت في نفسي\nلن أحمّل الإباحية على هاتفي أبداً بعد الآن.\nبعد ثلاثة أشهر ليلةً حلمت أنني أمارس الحب مع أمي فأخذني الخوف.\nفي تلك الليلة نفسها كنت قد حمّلت مجدداً. وعرفت أن حلمي كان يتنبأ لي\nبأنني سأعود إلى الحرام. لأني جئت من أمي.\nساعدوني على الخروج إن شاء الله من هذه الهاوية.","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته\n\nأخي العزيز في الله تعالى، اعلم أن الحياء وخوف الله هما ما يحمي العبد من الوقوع في الخطأ، فخوف الله واستشعار مراقبته في جميع الأحوال، بقلب وحضور، هو ما يكسب الحفظ ومن بعده جنات الفردوس.\n\nقال الله تعالى في كتابه الكريم: {ولمن خاف مقام ربه جنتان} (سورة الرحمن 55، الآية 46)\n\n{وأما من خاف مقام ربه ونهى النفس عن الهوى فإن الجنة هي المأوى} (سورة النازعات 79، الآيتان 40-41)\n\nوهذه هي مرتبة الإحسان التي قال عنها النبي (صلى الله عليه وسلم): «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك.» حديث متفق عليه.\n\nفعليك أن تحذر، وتحاسب نفسك، وتخف الله متذكراً قوله: {يستخفون من الناس ولا يستخفون من الله وهو معهم إذ يبيتون ما لا يرضى من القول وكان الله بما يعملون محيطا} (سورة النساء 4، الآية 108)\n\nوتضرع إلى الله طالباً السلامة وتكرر دائماً ما علمنا إياه رسول الله وخير الخلق (صلى الله عليه وسلم): «اللهم أعني على ذكرك وشكرك وحسن عبادتك، واجعلني أخشاك كأني أراك، وأسعدني بتقواك»\n\nواعلم أخي أن غض البصر يقطع الطريق على الشيطان، قال النبي (صلى الله عليه وسلم): «ما من مسلم ينظر إلى محاسن امرأة ثم يغض بصره إلا أحدث الله له عبادة يجد حلاوتها.» رواه أحمد والترمذي، متفق عليه.\n\nواعلم أن كثرة الذكر تؤدي إلى الحضور، وأنك مع كثرة الصلاة على النبي (صلى الله عليه وسلم)، وخاصة بصلاة الفاتح، التي بها تسأل الله وتضرع إليه أن يعينك على هذا الذنب بضبط نفسك الأمارة، يمكنك أن ترجو الإجابة إن شاء الله.\n\nواعلم أيضاً أن الله تعالى غفور رحيم، وقال الله: «قل: يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن"},{"id":480,"c":83,"d":"2018-07-31","t":"النذور","q":"السلام عليكم،\nكنت قد نذرت ألا أحمّل لعبة كرة قدم على هاتفي المحمول ويَدي على القرآن. إذا عدت إليها هل يجب عليّ الكفارة","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأخي العزيز في الله،\n\nستكون ملزماً بأداء كفارة عدم احترام اليمين (كفارة اليمين).\n\nوالكفارة هي إطعام عشرة مساكين، أو صيام ثلاثة أيام.\n\nعندنا، هذه هي الكفارة المطلوبة في حالة نقض يمين أو نذر، والله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":478,"c":82,"d":"2018-07-31","t":"القرض المالي والربا","q":"السلام عليكم ورحمة الله وبركاته؛\nأرغب في أن أُستنار حول معاملة جارية في مكان عملي.\nيتعلق الأمر بصندوق اجتماعي أنشأه الموظفون لمنح قروض عقارية للمنخرطين. فالصندوق يُموَّل بمساهمة شهرية قدرها 5% من منح التحفيز الخاصة بنا. غير أن اقتطاعاً بنسبة 3% يُطبق على مبلغ القرض لمواجهة نفقات لجنة تسيير الصندوق. وهكذا، عندما يمنحني الصندوق قرضاً قدره 3,000,000 فرنك، تقتطع اللجنة 90,000 فرنك وتسلمني 2,910,000 فرنك. لكن المبلغ الذي سأسدده سيكون 3,000,000 فرنك وفق جدول سداد. إذن هناك فرق بين المبلغ المُقرض والمبلغ المُسدد، وهو 90,000 فرنك. ألا يُعتبر هذا ربا (فائدة في الإسلام)؟ شكراً","a":"بسم الله الرحمن الرحيم، الحمد لله أولاً، والحمد لله آخراً، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني ورضي عنا برضاه. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبارك الله فيك أخي على سؤالك، وعلى بحثك عن الحلال، حفظك الله تعالى.\n\nالحالة التي ذكرتها، أخي العزيز، تدل على أن هذا القرض يبدو قرضاً ربوياً محرماً، واعلم أنه لا يجوز للمسلم أن يقترض قرضاً بفائدة ربوية.\n\nفي الحديث عن جابر: «لعن النبي (صلى الله عليه وسلم) آكل الربا، وموكله، وكاتبه، وشاهديه.» ثم زاد: «هم سواء».» رواه مسلم وأحمد.\n\nوعن سمرة بن جندب (رضي الله عنه)، قال النبي (صلى الله عليه وسلم):\n\n«هذه الليلة رأيت في المنام رجلين أتياني، أخذا بيدي وأخرجاني إلى الأرض المقدسة. فانطلقنا حتى وصلنا إلى نهر من دم في وسطه رجل، وعلى الضفة رجل آخر واقف يحمل حجارة في يديه. الذي كان في النهر كان يقف أمامه، وعندما أراد الخروج رماه الرجل الآخر بحجر في فمه أعاده إلى المكان الذي كان فيه. وكلما أراد الخروج رماه بحجر في فمه أعاده إلى المكان الذي كان فيه. قلت: من هذا؟ قالا لي: هذا آكل الربا.» رواه البخاري ومسلم والترمذي وأحمد.\n\nإذن يجب الحذر وتقوى الله، وإذا اختلفت الآراء فاعمل بالكلمة المقدسة لرسول الله (صلى الله عليه وعلى آله) التي رواها الحسن بن علي بن أبي طالب: «دع ما يريبك إلى ما لا يريبك.» رواه الترمذي وقال: حسن صحيح.\n\nوقال النعمان بن بشير (رضي الله عنه): «سمعت النبي (صلى الله عليه وسلم) يقول: الحلال بين والحرام بين، وبينهما أمور مشتبهات لا يعلمها كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام، كالراعي يرعى حول الحمى يوشك أن يقع فيه، ألا وإن لكل ملك حمى، ألا وإن حمى الله محارمه، ألا وإن في الجسد مضغة إذا صلحت صلح الجسد كله، وإذا فسدت فسد الجسد"},{"id":477,"c":82,"d":"2018-07-31","t":"نسبة الربح","q":"السلام عليكم،\n\nالحمد لله! شكرا لكم على إنشاء هذا الفضاء الذي يتيح لنا طرح أسئلتنا.\n\nأود أن أمارس التجارة لكنني لا أعرف ما هي نسبة الربح المسموح بها في المبيعات في الإسلام.\n\nهل يمكنكم من فضلكم أن تنيروني في هذا الموضوع؟\n\nشكرا مسبقا على ردكم.","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته\n\nأحييكم وأسأل الله أن يهدينا إلى ما يحب ويرضى.\n\nقال الله تعالى: «يا أيها الذين آمنوا لا تأكلوا أموالكم بينكم بالباطل إلا أن تكون تجارة عن تراض منكم».\n\nوقال الله تعالى: «رجال لا تلهيهم تجارة ولا بيع عن ذكر الله وإقام الصلاة وإيتاء الزكاة يخافون يوما تتقلب فيه القلوب والأبصار».\n\nقال النبي (صلى الله عليه وسلم):\n\n«التاجر الصدوق الأمين مع النبيين والصديقين والشهداء» رواه الترمذي، صحيح\n\nوقال النبي (صلى الله عليه وسلم):\n\n«رحم الله رجلا سمحا إذا باع، وسمحا إذا اشترى، وسمحا إذا اقتضى» حديث رواه البخاري ومسلم، وفي رواية الموطأ عن مالك: «إن الله يحب سمح البيع، سمح الشراء، سمح القضاء».\n\nلا يوجد في الشريعة الإسلامية حد يحدد نسبة الربح التجاري، لكن العلماء يقولون إنه يجب احترام الأسعار المحددة التي حددتها الدولة، أو السلطة، أو جماعة تجارية بشأن عدد من المنتجات الحيوية، أو الأساسية، أو غيرها... وفي هذه الحالة يصبح تجاوز هذه الأسعار المحددة حراما لأن الأمر يتعلق بالمصلحة العامة.\n\nأما بالنسبة للمنتجات الأخرى التي لم يحدد سعرها، فيجب احترام القواعد والمعايير المعتمدة من مجموع التجار، فإذا كان لكل سلعة مجال سعري عرفي أدنى وأقصى، فلا يجوز في هذه الحالة خداع الآخرين والبيع بسعر أعلى من سعر السوق.\n\nهذا المجال السعري الأقصى والأدنى يختلف بحسب وضع الزبون والكمية التي سيشتريها، فالفقير ليس كالغني. فمثلا، روي أن النبي (صلى الله عليه وسلم) أعطى عروة البارقي دينارا ووكله بمهمة شراء شاة.\n\nفاشترى عروة – رضي الله عنه – شاة بالدينار ثم باعها بدينارين، ثم عاد إلى السوق واشترى شاة ثانية بدينار، ورجع إلى النبي (صلى الله عليه وسلم) بالشاة والدينار، فأقره ولم يقل له شيئا.\n\nهذا الصحابي حقق نسبة ربح 100%، بربح حلال تماما، بينما قد يربح آخر خمسة سنتيمات في كيلو السكر لكن ربحه قد يكون حراما. فالمهم إذن هو احترام القواعد وأسعار السوق وعدم ارتكاب الخداع والاستغلال والغش إلخ.\n\nوقد ثبت عن عدة علماء مالكية تحديد نسبة الربح بثلث الثمن لكن"},{"id":476,"c":79,"d":"2018-07-31","t":"تحديد بداية الصيام","q":"السلام عليكم يا سيدي،\n\nنسأل الله عز وجل أن تجدكم هذه الرسالة وأنتم في صحة جيدة، أنتم وأقاربكم وكل فريق الترجمة.\n\nإن نقاشا يأخذ مكانا متزايدا في المجتمع المسلم، وهو تحديد بداية شهر رمضان. فمنهم من يرى الرؤية بالعين المجردة للهلال ومنهم من يرى الحساب الفلكي. وحجج الطرفين تبدو مؤسسة أكثر أو أقل. ماذا تقول مدارس الفقه في هذا الموضوع (العلماء القدامى والعلماء المعاصرون) وما هو الموقف الذي يجب اتخاذه فيما يخص المدرسة المالكية؟\n\nوالسلام عليكم ورحمة الله وبركاته\n\n—\n\nالسلام عليكم يا سيدي،\nفي فرنسا، باريس، 13 شعبان 1535 – 11 جوان 2014\nالمجلس اللاهوتي والفلكي لتحديد رمضان – CTADR\n«...نعلن أن المعطيات العلمية الدقيقة المتعلقة بشهر رمضان 1435 هـ، تحدد ولادة الهلال يوم الجمعة 27 جوان 2014 على الساعة 08:08 بتوقيت غرينتش (11:08 بتوقيت مكة). ويؤكد الحساب العلمي أن الهلال الجديد سيستوفي كل الشروط الشرعية التي وضعها CEFR من الشيلي إلى بولينيزيا الفرنسية ضمنا.\nبالنسبة لشهر شوال 1435 هـ، فمن المتوقع ولادة الهلال يوم السبت 26 جويلية 2014 على الساعة 22:42 بتوقيت غرينتش (الأحد 27 جويلية – 01:42 بتوقيت مكة). وهكذا ستكون رؤية الهلال الجديد يوم الأحد 27 جويلية 2014 في جنوب إفريقيا وفي كل أمريكا اللاتينية.\nوبناء عليه،\nسيكون أول أيام شهر رمضان يوم السبت 28 جوان 2014\nوسيكون عيد الفطر يوم الاثنين 28 جويلية 2014»\nالبيان الكامل موجود في هذا الرابط الذي آمل ألا يكون مخالفا للنظام (وإلا يمكن للإدارة حذفه) http://www.mohamedbajrafil.com/declarat … wwal-2014/\n\nأمام هذا البيان، لا نعرف ما رأيكم يا سيدي.\nوالسلام عليكم ورحمة الله وبركاته","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأشكرك على سؤالك وسنجيب وفق ما هو معتمد في مذهبنا المالكي. أما فيما يخص آراء السلف الصالح والحديث فيمكنك البحث أكثر في كتب السنة نظرا لكثرة الأقوال واختلاف الآراء بين العلماء، وكلها تميل إلى الحق، لكن بالنسبة لنا فإن أقربها إلى الحق هو المذهب المالكي.\n\nأولا\n\nكيف يتحقق دخول شهر رمضان؟\n\nإن دخول شهر رمضان يتحدد بانتهاء شهر شعبان: فإذا كان الجو مغيما ولم يمكن رؤية الهلال الجديد، فإن بداية رمضان تثبت بإتمام الثلاثين يوما من شهر شعبان، كل ذلك تطبيقا للحديث الذي رواه أبو هريرة (رضي الله عنه)، قال النبي (صلى الله عليه وسلم): «صوموا لرؤيته وأفطروا لرؤيته، فإن غم عليكم فأكملوا عدة شعبان ثلاثين» (متفق عليه)\n\nوتطبيقا لما رواه عبد الله بن عمر (رضي الله عنه) الذي قال إن النبي (صلى الله عليه وسلم) ذكر رمضان فقال: «لا تصوموا قبل مشاهدة ولادة الـ"},{"id":475,"c":79,"d":"2018-07-31","t":"الديون والكفارة والفدية","q":"السلام عليكم ورحمة الله وبركاته،\n\nبعد ذكر اسم الله، وحمده والصلاة على النبي الكريم (صلى الله عليه وسلم).\n\nأطلب مجددا مساعدتكم فيما يخص وضعيتي الخاصة:\n\nللتوضيح، لم أدخل الإسلام حقيقة إلا في سن الثلاثين رغم انتمائي لعائلة مسلمة ملتزمة. واليوم، بسبب مرض لا شفاء منه لا أستطيع الصيام. ومع ذلك، رغبت في إصلاح ديوني كما فعلت مع صلواتي وفق ما علمنا إياه شيخنا الحبيب، حفظه الله.\n\nإليكم إذن فترات إهمالي التي أرغب في إصلاحها، إن شاء الله، بمساعدتكم:\n\n1 – من الطفولة إلى بلوغي (18 أو 19 سنة)، كنت أصوم مع والدي شهر رمضان. لكنني لم أقض أبدا الفترات التي لم أصمها والتي كانت توافق الحيض. كيف يمكنني إصلاح ذلك؟\n\n2 – ثم، بعد خروجي من الدائرة العائلية، توقفت عن الصيام، إذ كنت مؤمنة فقط دون ممارسة أركان الإسلام الخمسة. ومع ذلك، بعد سنتين على ما يبدو، أعطاني الله هذا المرض الذي لا يسمح لي بالصيام. فلم أؤد أي كفارة، ولم أعط أي فدية، لأنني لم أكن أهتم بذلك وكنت أجهل الشعائر التعبدية للإسلام. هل يجب علي أن أعطي تعويضا عن تلك السنوات؟ يمثل ذلك حوالي 12 سنة.\n\n3 – بعد اعتناقي الإسلام في سن الثلاثين وبدئي الممارسة التعبدية، لم أصم بسبب مرضي، لكن يبدو لي أنني إلى اليوم كنت دائما أعطي فدية (ما يعادل وجبة في اليوم عن كل شهر رمضان).\n\nومع ذلك، أود أن أعرف هل يجب على شخص مثلي مرضه لا شفاء منه أن يعطي عن كل شهر رمضان فديته. أسأل هذا، لأنه إذا كان الله يرزق، الحمد لله، فإنه يبتلينا أحيانا بوسائل أكثر تواضعا. فما هي حلولي إذن لو لم أستطع إعطاء هذه الفدية؟ مرة، في مسجد، قيل لي إنه يمكنني دفع ذلك على عدة أشهر، لكن أخي كان قد نصحني بعدم ذلك في ذلك الوقت وأقرضني مالا رددته له بعد ذلك على مهل. وما زال ينصحني بذلك إلى الآن.\n\nكل هذه الأسئلة لا تخص زكاة آخر رمضان التي أعطيتها منذ دخولي الإسلام.\n\nأطرح عليكم إذن كل هذه الأسئلة، لأنني بدأت أدرك قيمة الصيام. فأرغب إذن في تصفية كل ديوني تجاه الله وبإذنه، مع ربما في الطريق كسب يوم صيام واحد على الأقل لكن دون صيام كما فهمتم...\n\nشكرا مجددا على مساعدتكم الثمينة وأسأل الله أن يعينكم. آمين","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي البداية أسأل الله أن يعينكم وأن يتقبل حرصكم على أداء الواجبات الدينية. أكثروا من دعاء الله وطلب المغفرة والالتجاء إليه.\n\nقال الله تعالى:\n\n«يا أيها الذين آمنوا كتب عليكم الصيام كما كتب على الذين من قبلكم لعلكم تتقون. أياما معدودات فمن كان منكم مريضا أو على سفر فعدة من أيام أخر وعلى الذين يطيقونه فدية طعام مسكين»"},{"id":474,"c":79,"d":"2018-07-31","t":"صيام النافلة","q":"السلام عليكم يا معلم\n\nأود أن أعرف هل يجوز للمسلم أن يصوم 40 يوما\n\nتطوعا من أول شهر إلى التاسع من الشهر الموالي.\n\nكل يوم صيام كما تقتضيه سنة المصطفى محمد (صلى الله عليه وسلم)\n\nشكرا","a":"بعد ذكر اسم الله المعظم المجل، وحمده، والصلاة على النبي صلى الله عليه وسلم...\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبالنسبة لنا، لا مانع من الصيام التطوعي. فوفق حديث صحيح قال النبي (صلى الله عليه وسلم): «من صام يوما في سبيل الله، بعد الله وجهه عن النار سبعين خريفا» رواه البخاري ومسلم\n\nلكن يجب عقد النية، لأن النية عندنا نحن المالكية واجبة في العبادات الواجبة والتطوعية.\n\nومع ذلك، يكره أداء صيام تطوعي قبل أداء صيام واجب، كقضاء بعض أيام رمضان أو كفارة أو نذر (فإذا كان نذر الصيام قد صيغ ليوم معين فإنه يصبح حراما صيامه تطوعا).\n\nيجب البدء أولا بقضاء الصيام الواجب، ثم البدء بالصيام التطوعي.\n\nويجب التوضيح أن المرأة المتزوجة لا يحق لها أداء الصيام التطوعي دون إذن زوجها، لأنها بممارسته تحرمه من حق عليها، لكن إذا أذن لها بذلك فلا حرج.\n\nتقبل الله، وأسأل الله أن يفيض عليكم نعمه الظاهرة والباطنة وأن يجعلنا من المقبولين عنده.\n\nوالله ورسوله صلى الله عليه وسلم أعلم\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم."},{"id":473,"c":79,"d":"2018-07-31","t":"الصيام أثناء الامتحانات","q":"السلام عليكم ورحمة الله وبركاته\n\nسأجتاز هذا الشهر امتحان البكالوريا وأود أن أعرف هل يجوز عدم الصيام أثناء الامتحان لأنه يجري خلال شهر رمضان علما أننا ليس لدينا عمليا سوى مادة واحدة في اليوم وبعض الأشخاص يؤكدون لي أنه يمكن الإفطار.\n\nإليكم جدول مواد شعبتى:\n\nالخميس 15 جوان 2017: الفلسفة: 8 سا - 12 سا\n\nالجمعة 16 جوان 2017: التاريخ – الجغرافيا: 8 سا – 11 سا\n\nالاثنين 19 جوان 2017: الإنجليزية: 14 سا – 17 سا\n\nالثلاثاء 20 جوان 2017: الفيزياء-الكيمياء: 8 سا – 11 سا 30\n\nالأربعاء 21 جوان 2017: الرياضيات: 8 سا – 12 سا؛ الإسبانية: 14 سا – 16 سا\n\nالخميس 22 جوان 2017: علوم المهندس: 14 سا – 18 سا\n\nجزاكم الله خيرا والسلام عليكم ورحمة الله وبركاته","a":"(جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم، حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالأهم الذي يجب معرفته، هو أنه لا يجوز في أي حال لهذا الشخص أن يبيت نية الإفطار، أي أن يضع مسبقا نية عدم الصيام بسبب امتحان مدرسي.\n\nيجب على هذا الشخص أن يذهب إلى امتحانه وهو صائم، ولا يمكنه الإفطار إلا إذا طرأ عذر صحيح. مثلا عندما يتأكد أن مواصلة الصيام قد تسبب ضررا «ضرار»، كوعكة لا تطاق، أو تعب أو عطش شديد يشكل خطرا...\n\nوإلا، إذا كانت المشقة محتملة فيجب عليه اجتياز البكالوريا وهو صائم، وهذا أمر عادي.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":472,"c":77,"d":"2018-07-31","t":"صلاة الليل","q":"السلام عليكم،\n\nشيخنا حفظكم الله وكان في عونكم.\n\nأود طرح عدة أسئلة حول صلاة الليل، ما هو أفضل وقت لأدائها؟\n\nهل يجب أداء الشفع والوتر قبل النوم أم أداؤهما مع هذه الصلاة؟\n\nما هي فضائلها؟ كم ركعة يستحب أداؤها؟ ماذا يجب فعله عندما نستيقظ لهذه الصلاة\n\nوكيف كان سيدنا أحمد التجاني (رضي الله عنه) يؤديها؟ جزاكم الله خيرا","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأولا نعتذر عن تأخر الرد على سؤالكم، حفظكم الله وبارك فيكم لحرصكم على الدين وممارسته وفق كتاب الله تعالى وسنة خير المرسلين، سيدنا محمد، صلى الله عليه وسلم.\n\nإن قيام الليل عادة الصالحين، وطريق الفائزين الطائعين، وسنة في اتباع خاتم الأنبياء والمرسلين (صلى الله عليهم أجمعين). من أحياه، أحيا الله تعالى قلبه، ونور بصيرته، وبيض وجهه وثبت أقدامه. أما من حرم منه، فقد حرم خيرا عظيما ونسأل الله العافية والمغفرة والسلامة.\n\nوقد تضافرت الأدلة على فضله من الكتاب والسنة:\n\nفي الكتاب، قال الله تعالى:\n\n«أمن هو قانت آناء الليل ساجدا وقائما يحذر الآخرة ويرجو رحمة ربه... قل هل يستوي الذين يعلمون والذين لا يعلمون إنما يتذكر أولو الألباب» (سورة الزمر 39، الآية 9)\n\nوقال الله تعالى واصفا أهل قيام الليل:\n\n«تتجافى جنوبهم عن المضاجع يدعون ربهم خوفا وطمعا ومما رزقناهم ينفقون» (سورة السجدة 32، الآية 16)\n\nوقال الله تعالى: «والمستغفرين بالأسحار» (سورة آل عمران 3، الآية 17). وهناك عدة آيات أخرى في هذا الفضل.\n\nفي السنة:\n\nقال عبد الله بن سلام (رضي الله عنه) إن النبي (صلى الله عليه وسلم) قال: «يا أيها الناس، أفشوا السلام، وأطعموا الطعام، وصلوا بالليل والناس نيام، تدخلوا الجنة بسلام» (رواه الترمذي)\n\nوروى أبو هريرة (رضي الله عنه) أن النبي (صلى الله عليه وسلم) قال: «أفضل الصيام بعد رمضان شهر الله المحرم، وأفضل الصلاة بعد الفريضة صلاة الليل».\n\nإن الوقت الفاضل لصلاة الليل يبدأ بعد صلاة العشاء إلى دخول صلاة الفجر، وأفضل وقت هو بعد منتصف الليل. أما عدد الركعات فبحسب قدرتكم، فحتى بركعتين ليليتين، ستكونان لكم خيرا من هذه الدنيا وما فيها.\n\nأفضل وقت لهذه الصلاة\n\nقال جابر (رضي الله عنه) إن النبي (صلى الله عليه وسلم) قال: «من خاف أن لا يقوم من آخر الليل فليوتر أوله، ومن طمع أن يقوم آخره"},{"id":471,"c":77,"d":"2018-07-31","t":"قضاء الصلاة","q":"السلام عليكم ورحمة الله.\n\nأردت أن أعرف، إذا كان شخص يصلي ثم تركها لسنوات ثم عاد إليها بتوبة واستغفار. هل يجب عليه قضاء كل صلواته الفائتة؟ وإذا كان الجواب نعم فكيف يجب عليه أن يفعل؟\n\nبارك الله فيك يا سيدي.","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nنعم، يجب قضاء كل الصلوات الفائتة، وإذا كانت كثيرة جدا وعددها غير معروف، فيجب حينها قضاؤها حتى يغلب على الظن أداء ما عليه.\n\nالأصل أنه يجب قضاء كل الصلوات الفائتة فور تذكرها أو فور زوال سبب تأخيرها. لكن إذا كان عاجزا عن قضائها كلها دفعة واحدة بسبب كثرتها، فيمكنه توزيعها على الصلوات الخمس اليومية المفروضة، بحيث يصلي مع كل صلاة مثلها واحدة أو اثنتين أخريين.\n\nويجوز قضاء مجموعة من الصلوات الفائتة كلها معا، إذا وجد في نفسه القوة لذلك.\n\nإن قضاء الفرائض واجب (فرض)، أما قضاء الصلوات التطوعية فمستحب، لكن إذا كان قضاء التطوعية سيؤخر كثيرا قضاء الفرائض، فيجب تقديم الفرائض أولا.\n\nهذا هو رأي أستاذي، الشيخ إسماعيل بن صادق العدوي، شيخ المالكية وإمام مسجد الأزهر، رحمه الله ورضي عنه، وإليكم التفاصيل:\n\nأجمع العلماء على أن قضاء الصلاة الفائتة واجب على من نسي أو نام وفق قول النبي (صلى الله عليه وسلم) الذي قال: «من نسي صلاة أو نام عنها فليصلها إذا ذكرها». وبما أنه يأثم بترك الصلاة فإن القضاء واجب.\n\nهذا هو رأي جمهور العلماء، ويجب عليه أيضا الإكثار من الاستغفار والتوبة، مع الإكثار من الصلوات التطوعية.\n\nيرى الشافعية والحنابلة أن من عليه قضاء صلوات لا يعرف عددها، يجب عليه قضاؤها حتى يتيقن من أداء ما عليه.\n\nأما الحنفية والمالكية، فقالوا: يكفي أن يغلب على ظنه أداء ما عليه، ولا يلزم له تعيين الصلاة المقضاة في النية بتحديدها في الزمن (مثلا: صلاة الظهر من يوم كذا أو بترتيب كذا)، بل يكفي تعيين الصلاة المقصودة، مثلا «صلاة الظهر» أو «صلاة العصر».\n\nوقد اختلف الحنفية في هذا الموضوع فقالوا إنه يجب تعيين وقت الصلاة المقضاة في النية كما لو نوى مثلا قضاء أول صلاة ظهر فائتة أو آخرها...\n\nإن القضاء الفوري للصلاة الفائتة واجب، سواء كانت الصلاة الفائتة لعذر صحيح أو الفائتة دون أي عذر، وهذا رأي الأئمة الثلاثة.\n\nأما الشافعية فقالوا: إذا كان التأخير دون عذر، فيجب قضاؤها فورا، وإذا كان بعذر صحيح، فيجب دائما"},{"id":470,"c":77,"d":"2018-07-31","t":"دعاء الإمام بعد إمامته للصلاة","q":"السلام عليكم ورحمة الله\n\nيا سيدي،\n\nهل يمكن معرفة حكم دعاء الإمام بعد الصلاة المفروضة؟ هل يمكن معرفة ما تستند إليه هذه الممارسة التي يقول بعضهم إنها لا أساس لها؟ ما هو موقف المدرسة المالكية في هذا الموضوع؟\n\nوالسلام عليكم ورحمة الله وبركاته","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nكثيرون هم الذين تكلموا في موضوع الدعاء بعد الصلوات المفروضة، وبعضهم يزعم أنها بدعة بتأويل الأحاديث التي تذكر الدعاء بعد الصلاة. قالوا إن معنى كلمة «في دبر كل صلاة» يعني بعد التشهد وقبل السلام، رغم أن حديث مسلم استعمل هذا المصطلح بوضوح للدلالة على ما بعد السلام،\n\nعن أبي هريرة، رضي الله عنه، قال النبي (صلى الله عليه وسلم): «من سبح الله في دبر كل صلاة ثلاثا وثلاثين...\n\nوكذلك، فإن مشروعية الدعاء بعد الصلاة ثابتة بحديث البخاري رقم 805، وهو يدل على أن رفع الصوت بالدعاء بعد الصلاة جائز. قال ابن عباس (رضي الله عنهما): «إن رفع الصوت بالذكر حين ينصرف الناس من المكتوبة كان على عهد النبي (صلى الله عليه وسلم)».\n\nواعلموا أن هناك قاعدة حددها قول الله تعالى:\n\n«يا أيها الذين آمنوا اركعوا واسجدوا واعبدوا ربكم وافعلوا الخير لعلكم تفلحون» (الحج؛ 77)\n\nهذه القاعدة تمثل مشروعية كل ممارسة فيها خير للناس ما دامت لا تهدم أصلا من أصول الشرع.\n\nإن الدعاء الجماعي لله مع الإمام يدخل في المعنى العام للآية القرآنية: «وقال ربكم ادعوني أستجب لكم إن الذين يستكبرون عن عبادتي سيدخلون جهنم داخرين»، والخطاب موجه للجماعة، وهذا هو الأصل.\n\nوروى البخاري أيضا في كتاب الدعوات (رقم 6045) الحديث المتفق عليه الذي رواه أبو هريرة (رضي الله عنه):\n\n«إن لله ملائكة يطوفون في الطرق يلتمسون أهل الذكر، فإذا وجدوا قوما يذكرون الله تنادوا: هلموا إلى حاجتكم. فيحفونهم بأجنحتهم إلى السماء الدنيا. فيسألهم ربهم (وهو أعلم منهم): ما يقول عبادي. قالوا: يسبحونك ويكبرونك ويحمدونك ويمجدونك. فيقول: هل رأوني؟ فيقولون: لا والله ما رأوك. فيقول: فكيف لو رأوني؟ فيقولون: لو رأوك كانوا أشد لك عبادة، وأشد لك تمجيدا وتحميدا، وأكثر لك تسبيحا. فيقول: فما يسألوني؟ فيقولون: يسألونك الجنة. فيقول: وهل رأوها؟ فيقولون: لا والله يا رب ما رأوها. فيقول: فكيف لو أنهم رأوها؟ فيقولون: لو أنهم رأوها كانوا أشد عليها حرصا، وأشد لها طلبا، وأعظم فيها رغبة. فيقول: فمم يتعوذون؟ فيقولون: من"},{"id":469,"c":77,"d":"2018-07-31","t":"إمامة الصلاة أمام إخوة من المذهب الحنفي","q":"السلام عليكم ورحمة الله وبركاته.\n\nأصلي عادة في مسجد يديره إخوة أتراك، وحاليا في غياب إمام رسمي لبعض الوقت، يحدث لي نظرا لقلة المصلين الحاضرين في بعض الصلوات (العصر في هذه الحالة) أن يجبرني إخوتي على إمامة الصلاة المفروضة.\n\nوبعد أن غيرت عاداتي الجسدية منذ قليل (اليدان على طول الجسم، ووضع اليدين أثناء السجود، ...) لأتبع قدر الإمكان المدرسة المالكية، طرح علي بعض الإخوة سؤال متابعة حركات إمام من المذهب المالكي من طرف المأموم من المذهب الحنفي.\n\nأبلغكم إذن هنا بهذا السؤال لأقدم لهم أفضل جواب.\n\nأخوكم في الله عبد المحيي","a":"(جواب الإمام الخطيب الشيخ سيدي محمد الهادي ليتيم، حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالصلاة جائزة خلف من يأخذ ببعض الخلافات الفرعية في فروع الفقه، كما في صلاة شخص يتبع المدرسة الحنفية خلف مالكي أو شخص آخر ينتمي إلى المدارس السنية المعروفة الأخرى، لأن أصحاب النبي (صلى الله عليه وسلم) والأجيال التي تلتهم لم يزالوا يصلون بعضهم خلف بعض رغم الخلافات الفرعية التي كانت بينهم في الفروع. وقد حصل هذا على مرتبة الإجماع.\n\nولا يجب على من يصلي خلف إمام أن يتابعه في كل الحركات أو الهيئات التي ليست من فرائض الصلاة. فالواجب هو متابعته في الأفعال الركنية كتكبيرة الإحرام، والركوع، والسجود...\nأما اختلاف طرق وضع اليدين في الصلاة أو حركات السبابة أثناء التشهد، فهذا من الفروع الثانوية الخاضعة للخلاف.\n\nوقد ذكر في «شرح مختصر خليل»:\n\nيجوز الاقتداء بمن يخالف في الفروع، كما في صلاة مالكي خلف شافعي أو غيره، وذلك حتى لو رآه من يصلي خلفه يفعل شيئا ليس في مذهبه.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":468,"c":76,"d":"2018-07-30","t":"العطور المحتوية على الكحول","q":"ما هو حكم العطور التي تحتوي على الكحول علما أن هذه الكحوليات لها عدة أنواع، بعضها يستعمل في صناعة الأدوية.","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالمدارس الفقهية الأربع متفق على أن الكحول في ذاته ليس نجسا وأنه يمكن استعماله في العطور، ومنتجات التنظيف، والأدوية أو أي استعمال نافع آخر.\n\nإذا صلى الشخص وهو متعطر بهذا العطر، فصلاته صحيحة، لأن القاعدة الفقهية تقرر أن الأصل في كل المواد الطهارة، مع العلم طبعا أنه يحرم شرب الكحول، لكن كون الشيء حراما لا يستلزم أنه نجس، لأن الحكم بنجاسة شيء ما هو حكم فقهي يحتاج إلى دليل شرعي مستقل.\n\nفمثلا، المخدرات والسموم الضارة الأخرى محرمة ومع ذلك هي طاهرة لأنه لا يوجد دليل على نجاستها، وفي هذا الصدد نجد من القواعد الفقهية: «النجاسة تستلزم التحريم، لكن التحريم لا يستلزم النجاسة»، بمعنى آخر كل ما هو نجس حرام، لكن ليس العكس.\n\nإن مادة الكحول الطبيعي ليست مشروبا صالحا للأكل، وهي غير قابلة للشرب، وكونها سائلا لا يقتضي أنها نجسة، فليست المادة السائلة للكحول في ذاتها هي المقصودة عندهم بالنجاسة، بل المشروب القابل للشرب المسكر.\n\nوقد ثبت في المذاهب الأربعة أن كل مشروب يسكر نجس، يقصدون بذلك كل مشروب قابل للاستهلاك مسكر يحدث نشوة شديدة.\n\nوكذلك بالنسبة لمصطلح المشروبات المعصورة المسماة اعتصار أو المشروبات المصنوعة من العنب أو التمر المنقوع في الماء والتي تسمى النبيذ، فهي حلال لمدة يومين إلى ثلاثة أيام قبل أن تتخمر وتصبح خمرا والتي ستسمى حينها في المصطلح خمرا.\n\nالأصل أن المادة المسكرة التي حرمت في النصوص تدل على المشروبات الكحولية القابلة للاستهلاك المعروفة، أما ما ليس قابلا للشرب، كالكحول في حالته الطبيعية، فلا تشمله هذه النصوص ما دام لا يوجد دليل مستقل، وخصوصا أن الكحول في حالته الطبيعية لم يكن موجودا في زمن النبوة، لكن شربه يصبح حراما بسبب الضرر الذي سيحدثه (كحال السم).\n\nالأدلة كثيرة، لكن اعلم أنه لا حرج في العطور التي تضعونها والتي تصلون بها.\n\nلا تنسوني في دعائكم بارك الله فيكم.\n\nوالله تعالى هو العظيم الأعلم وكذلك رسوله (صلى الله عليه وسلم).\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":467,"c":76,"d":"2018-07-30","t":"الاحتلام","q":"السلام عليكم ورحمة الله وبركاته،\n\nبعد ذكر اسم الله، وحمده والصلاة على النبي الكريم (صلى الله عليه وسلم).\n\nقبل كل شيء أشكركم على ردودكم السريعة والمدعمة على نطاق واسع.\n\nطلبي الجديد للمساعدة يخص الشخص المقيم أو المسافر:\n\nما حكم الشخص الذي، تكاسلا أو لأنه غلبه النوم، يستيقظ وهو في حالة جنابة:\n\n1: إذا كان وقت التطهر بالغسل يمنعه من أداء صلاة الصبح في وقتها، هل يمكنه (أو هل يجب عليه) التيمم حتى لا تفوته؟\n\n2: إذا كان هذا الشخص يصلي جماعة ثم يذكر معهم الوظيفة (الذكر)، هل يمكنه الذهاب إلى المسجد إذا كان الوقت يكفيه بالكاد وسيتيمم ليصلي معهم الصبح ويتلو الورد؟\n\n3. هل يمكن اعتبار الاحتلامات المتكررة مرضا، وفي هذه الحالة ما هي القاعدة الواجب اتباعها؟\n\nبارك الله فيكم،\n\nالسلام عليكم ورحمة الله وبركاته.","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأحييكم وأهنئكم على حرصكم.\n\nما حكم الشخص الذي، تكاسلا أو لأنه غلبه النوم، يستيقظ وهو في حالة جنابة:\n\n1. إذا كان وقت التطهر بالغسل يمنعه من أداء صلاة الصبح في وقتها، هل يمكنه (أو هل يجب عليه) التيمم حتى لا تفوته؟\n\nالجواب:\n\nلا يجوز التيمم في الحالة التي يجد فيها الماء، فهذه قاعدة فقهية: إذا وجد الماء بطل التيمم.\n\nعن مالك، عن هشام بن عروة، عن أبيه، عن زيد بن الصلت، قال: «خرجت مع عمر بن الخطاب (رضي الله عنه) إلى موضع يقال له الجرف، فلما أصبح وقد احتلم ولم يغتسل.\n\nقال: «والله لقد احتلمت وما شعرت، وصليت وما اغتسلت»، فاغتسل حينئذ وغسل ما رأى من الاحتلام على ثوبه، ونضح ما لم ير، ثم أذن، وأقام، وصلى بعد ما طلعت الشمس، وقد ارتفع النهار» موطأ الإمام مالك.\n\nعن مالك، عن إسماعيل بن أبي حكيم، عن سليمان بن يسار: «أن عمر بن الخطاب خرج إلى ضيعته بالجرف فرأى أثر الاحتلام على ثوبه. فقال: «منذ ولينا أمر الناس ابتلينا بالاحتلام» فاغتسل، وغسل ما رأى من الاحتلام على ثوبه وصلى بعد ما طلعت الشمس».\n\n2. إذا كان هذا الشخص يصلي جماعة ثم يذكر معهم الوظيفة (الذكر)، هل يمكنه الذهاب إلى المسجد إذا كان الوقت يكفيه بالكاد ويتيمم ليصلي معهم الصبح ويتلو الورد؟\n\nلا يجوز له أن يتيمم ويذهب إلى المسجد ليصلي ويتلو الوظيفة التي تستلزم التطهر بالماء إذا لم يمنعه شيء، كما أنه"},{"id":466,"c":76,"d":"2018-07-30","t":"قراءة السور","q":"السلام عليكم\n\nأنا جديد على هذا الموقع وما زلت أبحث عن المعرفة حول ممارسات الإسلام.\n\nأعتقد أن الله أعطانا القرآن لنستعمله كما ينبغي ما دمنا لا نشرك به شيئا ونعترف أن الرسول الوحيد الذي أرسله إلى البشرية جمعاء هو محمد (صلى الله عليه وسلم)\n\nأود أن أعرف هل يجوز قراءة السور أثناء الوضوء لأننا نؤمن بكلام الله إذ يمكننا قراءة آيات قرآنية على أجزاء الجسم أو على الماء للتداوي أو للحماية من هجمات الشيطان، والسحرة إلخ.\n\nمثلا عندما نغسل الأعضاء.\n\nأشكركم.\nالسلام عليكم","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأحييك أخي في الله.\n\nلقد سررت بتلقي رسالتك ورؤية حرصك على أحكام ديننا الحنيف، الحمد لله تعالى على نعمة الإسلام، وهي نعمة تامة.\n\nثم، إن ما يجوز أثناء الوضوء هو الدعاء كما علمنا.\n\nعند غسل اليدين، ينبغي أن يقول: «اللهم نقني من خطاياي كما ينقى الثوب الأبيض من الدنس (Allahoumma naqqini minal khataya kama younaqqa-thawbou-l-abyadou mina-d-danas)». وعند غسل الوجه، ينبغي أن يقول: «اللهم نور وجهي يوم تبيض وجوه وتسود وجوه (Allahoumma nawir wajhî yawma tabyadou woujouh wa taswadou woujouh)»\n\nوعند المضمضة، ينبغي أن يقول: «اللهم طهر لساني عن كل حرام واجعله لذكرك على الدوام (Allahoumma tahir lisani ‘an koulli haram waj’alhou li dhikrika ‘ala-dawam)»\n\nوعند غسل الأنف، ينبغي أن يقول: «اللهم شممني ريح الجنة في جنتك (Allahouma chammamni riha-l-jannati fi jannatika)»\n\nوعند غسل المرفق الأيمن، ينبغي أن يقول: «اللهم أعطني كتابي بيميني (Allahouma a-tini kitabi bilyamin)»\n\nوعند غسل المرفق الأيسر ينبغي أن يقول: «اللهم لا تعطني كتابي بشمالي ولا من وراء ظهري (Allahouma la tou-tini kitabi bi chimali wala min wara-i dhahri)»\n\nوعند غسل القدمين: «اللهم ثبت قدمي على الصراط يوم تزل الأقدام (Allahouma thabbit kadami ‘ala-sirat yawma tazillou-l-akdam)»\n\nبعد الانتهاء من الوضوء يقول الشهادتين ويقول: «اللهم اجعلني من التوابين واجعلني من المتطهرين (Allahouma ij’alni mina-tawabina waj’alni mina-l-moutatahirin). آمين»\n\nهذا ما ينبغي قوله عند غسل كل عضو أثناء الوضوء، أما قراءة القرآن الكريم أثناء الوضوء، عند غسل كل عضو، فهي ممارسة غير موجودة، وهي لا فضل فيها ولا استحباب.\n\nأما قراءة القرآن على الماء، فيجوز قراءة بعض آيات أو سور القرآن على الماء بقصد الحماية، وهذا ليس ممنوعا وقد فعله السلف، والعلماء والصالحون.\n\nوالله تعالى هو العظيم الأعلم."},{"id":465,"c":76,"d":"2018-07-30","t":"الحيض ومدة الطهر","q":"السلام عليكم ورحمة الله وبركاته،\n\nقبل كل شيء، شكرا على مساعدتكم الثمينة.\n\nإليكم وضعية خاصة:\n\nبعد الغسل الذي يعلن نهاية حيضي يعود الحيض بعد 13 إلى 14 يوما، وأحيانا أقل.\n\nوبما أن المرأة يجب أن تكون في حالة طهر خمسة عشر يوما على الأقل وفق المذهب المالكي، أجد نفسي ملزمة بالصلاة في هذه الوضعية إلى اليوم السادس عشر (الذي يعلن نهاية مدة الطهر) وآمل أن يكون هذا صحيحا.\n\nوبناء على ذلك أود أن أعرف هل أحترم الفقه جيدا:\n\n1 – هل يجب علي إذن (مع هذا الحيض الذي يعتبر حينها مرضا) أن أتوضأ قبل كل صلاة مفروضة وتطوعية؟ ففي الواقع، إذا صليت ركعتين تطوعا قبل الظهر فهذا يجعلني أجدد وضوئي 3 مرات في المجموع. في هذه الوضعية أترك إذن الصلوات التطوعية بسبب ذلك وأيضا بسبب نقص المعلومات حول هذا الموضوع.\n\n2 – هل يمكنكم توضيح كيف يمكن للمرأة أن تتأكد من نهاية حيضها قبل أن تتطهر بالغسل؟ هل عند نهاية النزيف أم بعد الإفرازات وفق الحديث المعروف لعائشة (رضي الله عنها) في الموضوع وخصوصا بالنسبة للنساء في وضعيتي؟\n\n3- أخيرا، أثناء حيضي، هل يمكنني تعلم سوري القرآنية ممسكة بالكتاب (بالعربية) أو بتلاوته مع دعم صوتي أو إنترنت، بما أنه لا يجوز للمرأة قراءة القرآن خلال هذه الفترة. لقد فهمت أن هذا ممكن دون أن أكون متأكدة.\n\nأشكركم على مساعدتكم لأن هذه الأسئلة صعبة الطرح.\n\nالسلام عليكم ورحمة الله وبركاته","a":"بسم الله الرحمن الرحيم، الحمد لله أولا، والحمد لله آخرا، والحمد لله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي إلى صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم. ورضي الله عن سيدنا أحمد التجاني وعنا به. آمين\n\nعن مالك عن علقمة عن أبيه، عن أم علقمة، خادمة أم المؤمنين عائشة (رضي الله عنها):\n\n«كانت النساء يبعثن إلى عائشة (رضي الله عنها) بالدرجة فيها الكرسف فيه الصفرة، فتقول: لا تعجلن حتى ترين القصة البيضاء»\n\nعن مالك عن هشام بن عروة، عن أبيه: «المستحاضة تغتسل غسلا واحدا، ثم تتوضأ لكل صلاة».\n\nوفي تعليقه على حديث هشام بن عروة، قال مالك: «هذه أحسن ما سمعت في ذلك».\n\n1 – إليكم وضعية خاصة:\n\n«بعد الغسل الذي يعلن نهاية حيضي يعود الحيض بعد 13 إلى 14 يوما، وأحيانا أقل. وبما أن المرأة يجب أن تكون في حالة طهر خمسة عشر يوما على الأقل وفق المذهب المالكي، أجد نفسي ملزمة بالصلاة في هذه الوضعية إلى اليوم السادس عشر (الذي يعلن نهاية مدة الطهر) وآمل أن يكون هذا صحيحا. وبناء على ذلك أود أن أعرف هل أحترم الفقه جيدا»\n\nالجواب:\n\nالحمد لله، وجزاكم الله خيرا على سؤالكم وزادكم حرصا.\n\nاعلمن، حفظكم الله، أن تحديد طبيعة الدم لمعرفة هل هو دم حيض أم مجرد استحاضة، يرجع إلى تحديد المدة الدنيا بين حيضتين متتاليتين، وهو أمر لا إجماع فيه عند علماء المالكية، فمنهم من قال ثمانية أيام، ومنهم من قال عشرة لكن الأشهر"},{"id":350,"c":77,"d":"2018-07-21","t":"الجهر بالقراءة خطأ في الصلاة","q":"السلام عليكم، بعد كم مقطع/كلمة مقروءة جهرا (كما في صلاة المغرب مثلا)، بينما نصلي الظهر سرا مثلا، يعتبر ذلك زيادة في الصلاة يجب تصحيحها بسجدتين بعد السلام النهائي؟","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nاعلم أن من قرأ جهرا في صلاة يجب فيها القراءة سرا فقد زاد في صلاته وبالتالي يجب عليه أداء السجدتين بعد التسليم إذا كان في صلاة مفروضة، لأنه زاد سنة.\n\nقال الإمام مالك (رضي الله عنه): «من قرأ سرا ناسيا حيث يجب الجهر، فإنه يسجد قبل السلام النهائي. ومن قرأ جهرا حيث يجب القراءة سرا، فإنه يسجد بعد السلام النهائي. وإذا كان الأمر يسيرا فيما يخص الجهر أو عكسه، كقراءة نحو آية جهرا بدل السر، فلا سجود عليه».\n\nإذن لم يحدد الفقهاء بدقة عدد الكلمات، سوى قول آية كاملة تقريبا. فما تجاوز هذا الحد يصبح كثيرا، وما لم يبلغه فهو قليل ولا يجب عليه شيء كجبر. والله أعلم.\n\nيرجع إلى «المختصر» للإمام الأخضري، باب السهو.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":348,"c":76,"d":"2018-07-21","t":"الوضوء دون الدلك","q":"السلام عليكم.\n\nرأيت في الحج إخوة يبدو أنهم ينتمون إلى مدرسة غير مدرسة الإمام مالك يتوضؤون مكتفين بتبليل أقدامهم تحت الصنبور دون تمرير اليد للدلك. هل يمكن الاكتفاء بغسل القدمين دون دلكهما بهذه الطريقة وفق الفقه المالكي؟ وفق مدرسة أخرى؟ وإذا كانت فعلا مدرسة أخرى تجيز غسل القدمين دون دلك، فهل هذا صحيح أيضا بالنسبة للأعضاء الأخرى المعنية بالوضوء الأصغر؟ وهل هذه الإمكانية دون دلك، إذا وجدت للوضوء الأصغر، موجودة للوضوء الأكبر أيضا؟","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nاعلموا أن القدمين من الأعضاء المعنية بالوضوء. وقد وقع خلاف بين العلماء في كيفية تحقيق طهارتهما الشرعية بسبب حركة تميز قراءتين للآية 6 من السورة 5 المائدة. فقال جمهور العلماء إن الواجب هو الغسل، مستندين إلى قراءة كلمة «وأرجلكم» بفتح اللام، وقال آخرون إن الواجب هو المسح، متبعين في ذلك القراءة بكسر اللام (في القراءة الأولى كلمة «أرجلكم» تابعة للآية «...فاغسلوا وجوهكم وأيديكم إلى المرافق...» وفي القراءة الثانية كلمة «أرجلكم» تابعة للآية «...وامسحوا برؤوسكم...»)\n\nإن الغسل لا يتحقق دون «الدلك» أي تمرير اليد على العضو المعني بعد صب الماء. وهو شيء واجب عند المالكية بهذين الشرطين: القدرة عليه وتذكره، وإلا فلا يبقى واجبا في حالة العجز أو النسيان، وهذا صحيح للوضوء الأكبر كما للوضوء الأصغر.\n\nقال العالم الجليل ابن عاشر في منظومته:\n\n«فرائض الوضوء سبع: الدلك، والفور، والنية في بدئه [...]»\n\nإن وجوب «الدلك» هو المشهور في المدرسة المالكية، لكن يوجد رأي شاذ ينص على أنه ليس واجبا. وقيل إن «الدلك» ليس واجبا في ذاته بل لإيصال الماء إلى المواضع المعنية، فإذا تحقق ذلك كفى.\n\nويجب أيضا الدلك الخفيف («الدلك») أثناء الغسل باليد؛ فإذا لم تصل اليد إلى جزء من الجسم، فيمكن استعمال خرقة أو حبل أو تفويض شخص ليدلكنا – كما ذكر في «المعيار الكبرى». فإذا تعذرت كل هذه البدائل، لم يعد الدلك واجبا.\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":347,"c":76,"d":"2018-07-21","t":"سلس البول","q":"بسم الله الرحمن الرحيم، الحمد لله رب العالمين.\n\nوصلى الله وسلم على نبيه الكريم، الهادي إلى الحق بالحق، وعلى آله وصحبه.\n\nالسلام عليكم ورحمة الله وبركاته.\n\nبعد التبول، يحدث لي أحيانا أن أشعر كأن قطرة بول تخرج. وبشكل أعم، يحدث لي كثيرا أن أشك وأتساءل هل وضوئي ما زال صحيحا. وحسب ما قرأت، فإن من هو في هذه الوضعية غير ملزم بإعادة الوضوء. أود أن أعرف هل يجوز تلاوة جوهرة الكمال في هذه الوضعية.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nالجواب أعطاه الإمام سيدي لحسن البعقيلي (رضي الله عنه):\n\nإنه يقوم بالاستبراء دون مد الذكر كما ذكر في مجموع ابن عاشر،\n\nالاستبراء: هو إفراغ مجرى البول (القناة البولية) حتى تخرج آخر القطرات تماما، دون المبالغة في المد لأنه قد يؤدي إلى ارتخاء المثانة.\n\nبعد ذلك يقوم بالاستنجاء (استعمال الماء وتنظيف الفرج جيدا)، ثم يجب أن يكون على يقين أن طهارته الشرعية صحيحة، ويدفع هذه الوساوس بحسب قدرته، لأن هذه الأفكار مغفورة.\nلطرد هذه الأفكار تماما يمكنه تبليل ملابسه الداخلية بقليل من الماء، فإذا شعر برطوبة أو برودة نسبها إلى هذا الماء، دون إمعان في البحث، وطهارته صحيحة.\n\nأما جوهرة الكمال، فإنها تتبع القاعدة المعروفة، إذا كان متوضئا بالماء فإنه يتلوها، وفي الحالة التي يتوضأ فيها بالتيمم، فإنه يستبدلها بعشرين صلاة فاتح...\n\nوالله أعلم.\nوالسلام عليكم ورحمة الله وبركاته."}];

document.documentElement.style.setProperty('--fs',fs+'px');
const th=S.get('th');if(th)document.documentElement.dataset.theme=th;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).split(/\n\s*\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
const list=()=>D.filter(x=>(cat=='all'||(cat=='fav'?fav.includes(x.id):x.c==cat))&&(x.t+' '+x.q+' '+x.a).includes(qry));
function home(){
const cs=['all','fav',...new Set(D.map(x=>x.c))];
app.innerHTML='<input id="s" type="search" placeholder="ابحث في الأسئلة والأجوبة…" value="'+esc(qry)+'"><div class="chips">'+cs.map(c=>'<button data-c="'+c+'" class="'+(c==cat?'on':'')+'">'+(c=='all'?'الكل':c=='fav'?'★ المفضلة':C[c])+'</button>').join('')+'</div><div id="l"></div>';
$('#s').oninput=e=>{qry=e.target.value;rl()};
app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;home()});
rl();document.title='أسئلة وأجوبة فقهية';nav(null);
}
function rl(){const r=list();$('#l').innerHTML=r.length?r.map(x=>'<a class="card" href="#q'+x.id+'"><b>'+esc(x.t)+'</b><span class="meta">'+C[x.c]+' · '+x.d+'</span></a>').join(''):'<p class="meta">لا توجد نتائج.</p>'}
function show(id){
const r=list().some(x=>x.id==id)?list():D,i=r.findIndex(x=>x.id==id),x=r[i];
if(!x)return home();
app.innerHTML='<p class="meta">'+C[x.c]+' · '+x.d+' · رقم '+x.id+'</p><div class="box q"><b>'+esc(x.t)+'</b><br><br>'+fmt(x.q)+'</div><div class="box"><b>الجواب</b><br><br>'+fmt(x.a)+'</div><p class="meta">الجواب للشيخ الإمام محمد الهادي ليتيم — ترجمة حرفية من الفرنسية</p><div class="tools"><button id="fv">'+(fav.includes(x.id)?'★ في المفضلة':'☆ أضف للمفضلة')+'</button><button id="cp">نسخ</button><button id="bk">القائمة</button></div>';
$('#fv').onclick=()=>{fav=fav.includes(x.id)?fav.filter(v=>v!=x.id):[...fav,x.id];S.set('fav',JSON.stringify(fav));show(id)};
$('#cp').onclick=e=>{try{navigator.clipboard.writeText(x.t+'\n\n'+x.q+'\n\n'+x.a);e.target.textContent='تم ✓'}catch(_){}};
$('#bk').onclick=()=>location.hash='';
document.title=x.t.slice(0,40);scrollTo(0,0);
nav(r[i-1],r[i+1]);
}
function nav(p,n){
let e=$('.pn');if(e)e.remove();
if(p===null)return;
document.body.insertAdjacentHTML('beforeend','<nav class="pn"><button id="np" '+(n?'':'disabled')+'>→ السابق</button><button id="nn" '+(p?'':'disabled')+'>التالي ←</button></nav>');
$('#np').onclick=()=>location.hash='q'+n.id;
$('#nn').onclick=()=>location.hash='q'+p.id;
}
function route(){const m=location.hash.match(/q(\d+)/);m?show(+m[1]):home()}
addEventListener('hashchange',route);route();
$('#home').onclick=()=>location.hash='';
$('#th').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme=='dark';d.dataset.theme=dark?'light':'dark';S.set('th',d.dataset.theme)};
const fz=n=>{fs=Math.min(26,Math.max(14,fs+n));document.documentElement.style.setProperty('--fs',fs+'px');S.set('fs',fs)};
$('#fp').onclick=()=>fz(2);$('#fm').onclick=()=>fz(-2);
$('#top').onclick=()=>scrollTo(0,0);
addEventListener('scroll',()=>{const h=document.documentElement,p=scrollY/(h.scrollHeight-innerHeight||1);$('#bar').style.width=p*100+'%';$('#top').style.display=scrollY>300?'block':'none'});
</script>
</body>
</html>
