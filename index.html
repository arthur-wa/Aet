<style>
:root{--bg:#fff;--fg:#000;--mute:#555;--line:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#aaa;--line:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#aaa;--line:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",Tahoma,serif;line-height:2;font-size:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand svg{width:34px;height:34px;flex:none}
main{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.count{color:var(--mute);font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bar{height:3px;background:var(--mute);opacity:.35;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .25s}
.label{display:inline-block;border:2px solid var(--line);padding:0 12px;font-size:15px;font-weight:700;line-height:1.7;margin-bottom:8px}
.label.a{background:var(--fg);color:var(--bg)}
.q{font-size:22px;font-weight:700;white-space:pre-wrap;margin:0 0 24px;line-height:2}
.ans{white-space:pre-wrap;margin:0;border-right:4px solid var(--line);padding-right:14px;overflow-wrap:anywhere}
.none{color:var(--mute);border:2px dashed var(--mute);padding:10px 14px;margin:0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
button{font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;background:var(--bg);color:var(--fg);border:2px solid var(--line);min-height:46px}
button:hover,button:focus-visible{background:var(--fg);color:var(--bg);outline:none}
button.main{flex:1 1 180px;background:var(--fg);color:var(--bg)}
button.main:hover,button.main:focus-visible{background:var(--bg);color:var(--fg)}
button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.ic{padding:8px 12px}
</style>

<script>
var D=[{"q": "تقسيم أضحية العيد في المذهب المالكي ؟", "a": "بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق والخاتم لما سبق ناصر الحق بالحق والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم\n\nقال تعالى:\nيَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ وَمَن يَتَّبِعْ خُطُوَاتِ الشَّيْطَانِ فَإِنَّهُ يَأْمُرُ بِالْفَحْشَاءِ وَالْمُنكَرِ\n(سورة النور، الآية 21)\n\nقال تعالى:\nقُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ\n(سورة آل عمران، الآية 31)\n\nقال تعالى:\nلَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ\n(سورة الأحزاب، الآية 21)\n\nقال تعالى:\nوَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا\n(سورة الحشر، الآية 7)\n\nقال تعالى:\nقُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا ۖ هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ\n(سورة يونس، الآية 58)\n\nقال سيدنا أحمد التجاني قدس الله سره:\n• كلُّ فتحٍ، وكلُّ نورٍ، وكلُّ ترقٍّ لا يتحقَّق إلا بالاتباع الصادق للحبيب ﷺ.\n• كل طريقٍ لا يؤدّي إلى اتباع النبي ﷺ فهو طريقُ ضلال.\n• الخير كله في اتباع السنة، والشر كله في مخالفتها.\n\nتقسيم أضحية العيد في المذهب المالكي\n\nفي مذهب الإمام مالك بن أنس، تُعدّ الأضحية عبادةً عظيمة وسنّةً مؤكدة. وقد بيّن علماء المالكية الأحكام المتعلقة بتقسيم لحم الأضحية، اعتمادًا على القرآن الكريم وسنّة النبي الكريم ﷺ.\n\nقال تعالى:\n\nفَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ\n(سورة الحج، الآية 36)\n\nوقد فهم العلماء من هذه الآية الكريمة أنه يُستحب:\n\nأن يأكل المضحي جزءًا من أضحيته؛\n\nوأن يُهدي جزءًا منها؛\n\nوأن يتصدّق بجزء منها على الفقراء والمحتاجين.\n\nما ذكره علماء المالكية\n\nأوضح فقهاء المالكية أن الشريعة لم تُحدد نسبةً واجبةً لتقسيم الأضحية.\n\nوعليه، فإن تقسيمها إلى ثلاثة أجزاء متساوية:\n\nجزء للأهل ،\n\nوجزء للأقارب والجيران،\n\nوجزء للفقراء،\n\nهو أمر مستحب وليس واجبًا.\n\nوقد ذكر الإمام خليل بن إسحاق الجندي في مختصره استحباب الأكل من الأضحية وإطعام الآخرين منها.\n\nكما شرح الإمام أحمد الدردير في «الشرح الكبير» أنه يُستحب:\n\nأن يأكل الإنسان جزءًا من اللحم؛\n\nوأن يُهدي جزءًا منه؛\n\nوأن يتصدّق بجزء منه.\n\nوفي المذهب المالكي، فإن إعطاء جزء من الأضحية للفقراء والمحتاجين يُعد من المندوب، أي من الأعمال المستحبة ذات الأجر، وليس أمرًا واجبًا.\n\nلذلك، إذا احتفظ الشخص بكل اللحم لأسرته، فإن أضحيته تبقى صحيحة عند علماء المالكية، خاصة عند الحاجة، أو كثرة أفراد الأسرة، أو ضيق الحال.\n\nغير أن الفقهاء نبّهوا إلى أن ترك مشاركة الفقراء والمحتاجين بالكلية يخالف:\n\nالحكمة الروحية من الأضحية؛\n\nوروح الكرم التي شرعت من أجلها؛\n\nوالهدي النبوي الشريف.\n\nفالأضحية ليست عبادة فردية فحسب، بل هي أيضًا مظهر من مظاهر:\n\nالرحمة؛\n\nوالأخوّة؛\n\nوالتكافل مع المحتاجين.\n\nولهذا رأى العلماء أن الأفضل والمستحب:\n\nأن يأكل المضحي جزءًا؛\n\nوأن يُهدي جزءًا؛\n\nوأن يتصدّق بجزء على الفقراء،\n\nمن غير إلزام بنسبة محددة شرعًا.\n\nهل يجوز الاحتفاظ بكل اللحم؟\n\nنعم. أجاز علماء المالكية أن يحتفظ الإنسان بكل لحم الأضحية لأسرته، خاصة عند الحاجة أو الفقر.\n\nلكنهم أكدوا أن إهمال الفقراء والمحتاجين تمامًا يتعارض مع روح هذه العبادة المباركة.\n\nفالأضحية عبادة تتضمن:\n\nشكر الله تعالى؛\n\nوالكرم؛\n\nوالأخوّة؛\n\nوالتذكير بتضحية النبي الكريم إبراهيم ـ عليه السلام.\n\nهل يجوز إهداء جزء منها لغير المسلم؟\n\nأجاز عدد من علماء المالكية إهداء جزء من لحم الأضحية للجار غير المسلم، من باب حسن المعاملة، واحترام الجوار، وإظهار أخلاق الإسلام، ما دام ذلك لا يَحْرِمُ المسلمين الفقراء.\n\nبيع اللحم أو الجلد\n\nصرّح علماء المالكية بتحريم:\n\nبيع لحم الأضحية؛\n\nوبيع جلدها؛\n\nوكل صور المتاجرة بشيء من الأضحية.\n\nكما لا يجوز دفع أجرة الجزار بجزء من الأضحية.\n\nبل يجب دفع أجرته بشكل منفصل.\n\nوذلك استنادًا إلى الحديث الذي رواه علي بن أبي طالب، وفيه أن النبي ﷺ أمر بتوزيع جلود الأضاحي، ونهى عن إعطاء الجزار منها مقابل عمله.\n\nالخاتمة\n\nيُعلّمنا المذهب المالكي أن:\n\nتقسيم الأضحية أمر مستحب؛\n\nوإطعام الفقراء من أعظم حكم هذه العبادة؛\n\nولا توجد نسبة واجبة محددة للتقسيم؛\n\nوينبغي أن تصاحب الأضحية روح التقوى والكرم.\n\nقال تعالى:\n\nلَن يَنَالَ اللَّهَ لُحُومُهَا وَلَا دِمَاؤُهَا وَلَٰكِن يَنَالُهُ التَّقْوَىٰ مِنكُمْ\n(سورة الحج، الآية 37)\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق والخاتم لما سبق ناصر الحق بالحق والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم\n\nالعبد الفقير إلى الله وتلميذ سيدنا الشيخ أحمد التجاني قدس الله سره:\nمحمد المنصور المحيي الدين التجاني"}, {"q": "هل يمنع على التجاني قراءة كتاب دلائل الخيرات و كتب التصوف الأخرى؟", "a": "قال العلامة سيدي أحمد سكيرج رضي الله عنه في كتابه الرحلة الحبيبية الوهرانية الجامعة للطائف العرفانية بتحقيق سيدي محمد الراضي كنون ص238: إن تلاوة دلائل الخيرات من جملة أذكار الشيخ رضي الله عنه الغير اللازمة فذكره وتلاوته متابعة للشيخ رضي الله عنه وذلك من كمال المريد و لا بأس على المريد التجاني إن كان محافظا على أذكاره اللازمة أن يذكر ما شاء من الأذكار الغير اللازمة في الطريقة وغيرها من الأذكار وإن لم تكن من أذكار الشيخ رضي الله عنه لأن الشيخ رضي الله عنه لم يمنع من ذكر الأذكار مطلقا وإنما الممنوع في طريقته أخذ طريقة أخرى على طريقه ولا تعطى طريقه إلا لمن ترك غيرها من جميع الطرق.إهـ\n\nأما قراءة كتب التصوف فقد قال الإمام البعقيلي رضي الله عنه في الإراءة ج1ص159:لا يجوز للفقير أن يطالع كتب القوم وإن ابتلي بها فلا ينجح إلا إذا كان من العلماء الراسخين في الطريقة فيطالع تبحرا وتغلغلا في العلوم لا غير…إلى أن قال رضي الله عنه:فيجب على عالم في الطريقة و مقتدى به ألا يدرس في الزوايا لضعفاء الفقراء إلا ما يناسب الطريقة وهو القرآن وحديث النبي الكريم ولا بأس بفروع مذهبه من أحكام الوضوء والعبادة لا غير من كل ما فيه مصلحة عائدة على الفقراء.إهـ\n\nقال المقدم سيدي أمين محمد الفطواكي رضي الله عنه في كتابه التربية في الطريقة التجانية في ضمن الأجوبة البعقيلية ص 67 أن الإمام البعقيلي رضي الله عنه سئل :هل يجوز للتجانيين أن يسردوا نحو دلائل الخيرات من الأحزاب والأدعية المروية عن مولاي عبد القادر وسيدي زروق وسيدي أحمد بناصر مع أنها لا تخلوا غالبا عن التوسلان بالأقطاب والأبدال والنجباء والشهداء وحملة القرآن إلى آخره فالجواب: أن من وصله الإذن في دلائل الخيرات من القدوة رضي الله عنه فلا بأس إن كان مجردا من الأدعية التي لم تنسب لمؤلفه…فمن لم يصله الإذن تركه فإن سيدنا الحاج الحسين اليفراني قال لي وأما الأحزاب كحزب البحر والدور الأعلى فلا بأس لمن أذن فيهما كغيره من كل ما ثبت عن القدوة رضي الله عنه من غير زيادة ولا نقصان…وأما قولكم مع أنها لا تخلوا من التوسلات بالأقطاب وهذا يحرم عليه حينئذ أن يتعاطاها ذكرا وتبركا فإنه لم يكن فيه إذن لأحد من أهل الطريقة فمن توسل بهم رضي الله عنهم انقطع عن شيخه.إهـ"}, {"q": "هل من الممكن أن تقدم المرأة لتلقين الورد؟", "a": "قال سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص5:قد أنجبت الطريقة التجانية العديد من النساء العابدات القانتات العارفات الكبار وقد عرفن بالفتح وبمراتب عالية في الولاية والمعرفة بالله وكان ساداتنا العارفون بالله من أهل الطريقة التجانية يقدمون النساء لأن المرأة عندما تكون مستعدة ولها الأهلية فبدورها تعطي الطريقة للنساء وتكون قريبة منهن وقد كانت العديد من النساء التجانيات مقدمات مأذونات في جميع أوراد الطريقة وفي أسرار وفوائد أهل الحقيقة وكن يلقن الأوراد والأذكار والفوائد و الأسرار كلها لجميع نساء بلادهن.إهـ\n\nوقال العلامة أبي بكر عتيق ابن خضر التجاني رضي الله عنه في رسالته رفع الإعتراض و الملام عمن قدم المرأة لتلقين ورد خاتم الأعلام: اعلم أيها الأخ أن تقديم النساء لإعطاء الورد التجاني اللازم وغيره من أسرار الطريقة وأورادها الخاصة جائز لا اعتراض على فاعله ولا لوم بشرط الأهلية في ذلك والدليل على جواز ذلك أن جميع مشايخ الطريقة الذين وضعوا التآليف في شأن الورد ما اشترطوا الذكورة في المقدم وإنما اشترطوا الأهلية فقط كما هو مبسوط في كتبهم كبغية المستفيد و شهدة الجاني وشرحها تيسير الأماني ودرة التاج وشرحها المسمى بالكوكب الوهاج والفتح الرباني ثم إن الشيوخ المعتبرين في هذه الطريقة ممن يحتج بهم قدموا النساء لتلقين الورد وأشهرهم في وقتنا الشيخ محمد الفوتي الشهير بألفا هاشم المتوفي بالمدينة المنورة فإنه قدم الشيخة العارفة الملقبة بالله حي لكثرة قولها ذلك.إهـ\n\nوقال العلامة أحمد بن محم بن العباس العلوي الشنجيطي رضي الله عنه في كتابه روض شمائل أهل الحقيقة في التعريف بأكابر أهل الطريقة عند ترجمته للسيد محمد الحنفي رضي الله عنه ص54:ووالدته من الواصلات في الطريق العارفات بالله تعالى على التحقيق قدمها الشيخ محمد الحافظ وجعلها من العشرة الذين أمره الشيخ التجاني بتقديمهم.إهـ\n\nوقال سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص53عند ترجمته للسيدة سكينة:من المقدمات التجانيات بالمدينة المنورة كانت امرأة صالحة تقية نقية معروفة بالإستقامة أجرى الله على يديها كرامات كثيرة كما كانت تتمتع بأخلاق عالية من الكرم والسخاء والحياء والرقة أخذت الطريقة التجانية عن المقدمة السيدة فاطمة الملقبة بين عامة الناس ب{الله حي}وهي أيضا التي قدمتها لتلقين أوراد هذه الطريقة لمن طلبها منها.إهـ\n\nوقال العلامة أبي بكر عتيق ابن خضر التجاني رضي الله عنه في رسالته رفع الإعتراض والملام عمن قدم المرأة لتلقين ورد خاتم الأعلام :ثم بعد فراغي من كتابة هذه الرسالة بخمس سنين وقفت على جوابين فيهما الزيادة على ما كتبت فأردت إلحاقهما بها أحدهما للعارف بالله القطب الكامل سيدنا ومولانا الحاج إبراهيم بن الحاج عبد الله الكولخي رضي الله عنه في ضمن إفادة المريد عن أسئلة السيد محمد بن محمد العيد والثاني للعارف بالله سيدي ومولاي الحاج أحمد سكيرج الأنصاري رضي الله عنه في ضمن أجوبة أسئلة مرزوق الأنصاري ونص الأول مع جوابه هو قوله:{السؤال}الحادي والعشرون عن حكم تقديم المرأة إذا كانت أهلا للتقديم وعلى أنها تقدم هل تعطي الورد للرجال؟ فالجواب:والله الموفق للصواب إننا ما عرفنا من المقدمات إلا ما قال صاحب روض الشمائل في ترجمة السيد محمد الحنفي ووالدته من الواصلات في الطريق العارفات بالله تعالى على التحقيق قدمها الشيخ محمد الحافظ رضي الله عنه وجعلها من العشرة الذين أمره الشيخ بتقديمهم فعلى هذا إن أدت الحال إلى تقديم امرأة صالحة فلها أن تلقن الأوراد للرجال والنساء على الوجه الذي يليق شرعا و لا تصافح الرجال الذين ليسوا بالمحارم كما أن المقدم ليس له أن يصافح غير ذوات المحارم وقد قال السيد العربي بن السائح في الجواب الشافي وقد طالعت إجازة الشيخ للشيخ أبي سالم العياشي ومن جملة ما رأيت فيها من الشروط أن لا يصافح الملقن بيده يد امرأة ليست بذات محرم منه.وفي البغية وكان الشيخ رضي الله عنه يأمر ذوي محارمهن أن يلقنوهن وربما لقن بعضهن بالكلام فقط ويده لم تصافح يد امرأة قط عند التلقين للورد…إهـ ونص السؤال الثاني مع جوابه {السؤال الحادي عشر}لم أجد فيما وقفت عليه من كلام علماء الطريقة باشتراط الذكورة والبلوغ في أهلية التقديم لإعطاء الإذن في الورد وقد ذكروا صفات المقدم بصيغة التذكير المسندة للشخص المحتمل للذكر البالغ وغيره فما حقيقة الأمر؟ وهل حكم الإذن في الورد من باب الرواية والسند والعلم ؟أو من باب الإمامة والإمارة والحكم؟ وقد وقفت في بعض الرسائل على وصف بعض السيدات التجانيات بالتقديم{الجواب}من المقرر عندنا في الطريقة تقديم المرأة لتلقين الأوراد كما جرى عليه عمل الشيخ رضي الله عنه وعمل خلفائه بعده وقد قدم رضي الله عنه جماعة من النساء تعرضنا لذكر بعضهن في كشف الحجاب ورفع النقاب وكان يكاتبهن ويراسلهن وإذا اجتمع بواحدة منهن لا يصافحهن مع إلقاء طرف برنوسه على وجهه ويأمرهن بالجلوس وراءه ويحدثهن فيما يرجع للطريقة وغيرها ومنهن من أطلق لهن في تقديم المستحقات من النساء وغيرها من الرجال الذين فيهم الأهلية كما بلغنا ذلك على لسان الثقة من الإخوان ووقفنا عليه في بعض رسائل الشيخ قدس سره وكفى دليلا على صحة تقديم السيدات التجانيات ما وقفتم عليه من الرسائل بوصفهم بالتقديم وبذلك نتحقق بأنه لا تشترط في التقديم الذكورة بل يقدم من فيه الأهلية ذكرا كان أو أنثى كبيرا كان أو صغيرا حرا أو عبدا مثل تلقين الورد لهم وللمقدم أن يلقن مقدمة لتقوم مقامه في تلقين الأوراد للنساء وهو أولى من مباشرة تلقينهن بنفسه لما فيه من الإحتياط من مشافهة النساء والإنسان غير معصوم ويجري الشيطان من الشخص مجرى الدم ولا يثق بالنساء إلا مغرور أو غبي غير معذور فما في كتب الطريقة من عدم التعرض للمقدمات الإناث إنما هو جرى على الغالب في التقديم للذكور كما لم يصرح بالتقديم للصبيان المستحقين اتكالا على شرط الأهلية فيه مطلقا في حق الذكر والأنثى طبق ما هو مذكور في المأذون له بالورد مع توفر الشروط المقررة والأركان المعتبرة فحقيقة الأمر عندنا في التقديم للشخص الداخل فيه الذكر والأنثى على حد سواء بالغا كان أو غير بالغ كما قررنا…إهـ\n\nوفي كشف الحجاب للعلامة سيدي أحمد سكيرج رضي الله عنه عند ترجمته للسيد الحاج الطيب القبَّاب قال:ووقفت على رسالة بخط الفقيه سيدي محمد بن المشري رحمه الله يخاطب بها جماعة من أعيان فقراء فاس وصدر فيها بصاحب الترجمة ونصها{بعد حمد الله جل ثناؤه وتقدست أسماؤه وعز كرمه ومجده يصل الكتاب إلى أحبابنا ومن أعز الناس لدينا ذي الشيبة الطاهرة والأحوال الزاهرة محبنا صدقا وصفينا حقا سيدي الحاج الطيب القباب ومحبنا وولده أبي عبد الله سيدي محمد وأولاده والحرة الجليلة الكريمة السيدة المقدمة فاطمة}…إلى أن قال في آخر الرسالة والسلام عليكم من الفقير إلى ربه أخيكم كاتب الحروف محمد بن المشري عن إذن سيدنا رضي الله تعالى عنه إهـ\n\nوقال العلامة سيدي أحمد سكيرج رضي الله عنه في كتابه رفع النقاب الربع الثالث ص192عند ترجمته للعلامة سيدي محمد بن المشري رضي الله عنه:ومما بلغني عنه أنه قدم الشيخ مرة إلى عين ماضي من إحدى سفراته من فاس فنزل قرب القرية وقد نصبت له هناك قبة للنزول بها ليتلاقى مع الذين قدموا لملاقاته وزيارته فنزل على القرب منه سيدي محمد بن المشري في قبة نصبها كما نزل سيدي محمود قبالته في قبة أخرى فكان جل الزائرين لا يدخلون لقبة الشيخ إلا بعد ملاقاتهم مع كل واحد منهما وكان من جملة الزائرين المرابطة الزهراء إحدى المقدمات في رفقة جماعة من الأصحاب…فدخلوا إلى قبة الفقيه المذكور ولم تدخل هي معهم وقصدت قبة الشيخ رضي الله عنه وكان معه نجلاه سيدي محمد الكبير وسيدي محمد الحبيب فسألهما عمن قدم معها فقالت فلان وفلان وقد دخلوا إلى قبة الفقيه المذكور فقال ولم لم تدخلين معهم فقالت إنما جئت لزيارتك ولو كان في محل كل منهما ضربت قبة لنجليك ما دخلت لمحلهما إلا بعد زيارتك ولا أعرف غيرك فقال لها رضي الله عنه{أحسنت من يعرفني يعرفني وحدي}.إهـ وقال عنها سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص25:من المقدمات التجانيات كانت معاصرة للشيخ أبي العباس التجاني ولها فيه محبة عظيمة.إهـ"}, {"q": "ما عقيدتكم في الإمام المهدي وهل تعتقدون فعلا أنه من طريقتكم؟", "a": "بعد التحية و السلام\n\nقال العلامة سيدي محي الدين الطعمي التجاني رضي الله عنه في معجم من رأى رسول الله في النوم واليقظة ص36: الولاية من حيث هي على قسمين ظاهرة وباطنة فالظاهرة لأهل الأمر و التصريف الظاهر وهي معروفة وهذه الولاية تختم على الإمام العدل المسمى بالمهدي المنتظر والباطنة لأهل التصريف الباطن وتنقسم إلى عامة وخاصة فالعامة من آدم إلى سيدنا عيسى عليه السلام وعليه تختم حين ينزل في آخر الزمان والخاصة هي من نبينا صلى الله عليه وسلم إلى الختم الأكبر سيدي أبي العباس أحمد التجاني رضي الله عنه فالحمد لله الذي جعلنا من مريديه ومحبيه رضي الله عنه.إهـ\n\nوذكر العلامة سيدي أحمد سكيرج رضي الله عنه في كشف الحجاب عند ترجمته للسيد مولاي أحمد بن عبد السلام الفيلالي الودغيري أن الشيخ سيدي أحمد التجاني قال{إن المهدي رضي الله عنه يأخذ عنا إذا قام آخر الزمان بعد مماتنا وانتقالنا من دار الفناء إلى دار البقاء}.إهـ\n\nوقال العارف بالله سيدي محمد بن عبد الواحد النظيفي رضي الله عنه في الدرة الخريدة شرح الياقوتة الفريدة م1ج1ص187:\n\nفيأخذها المهدي عند ظهوره لدا من له الإذن الصحيح بطيبة\n\n{فيأخذها} أي بسبب ما ذكر من بقائها وحدها آخر الدهر يأخذها الإمام المنتظر سيدي محمد بن عبد الله المهدي رضي الله عنه.إهـ\n\nوقال الشيخ سيدي أحمد التجاني رضي الله عنه في الإفادة الأحمدية:{إذا جاء المنتظر يطلب من أصحابنا الفاتحة}قال سيدي محمد الطيب السفياني رضي الله عنه مؤلفها:سببه أنه قيل له إنه المنتظر يذبح طلبة العلم ويفعل كذلك بالطلبة من أصحابك فذكره.إهـ\n\nوقال العلامة سيدي أحمد سكيرج رضي الله عنه في رفع النقاب الربع الثالث ص8عند ترجمته للعلامة سيدي محمد الكبير بن الشيخ رضي الله عنه:قد أشاع بعض الإخوان ممن لهم الغلو في محبة جنابه أن سيدنا محمد الكبير لازال إلى الآن حيا في أحد الدهاليز إلى أن يخرج مع المنتظر ولم يستشهد في تلك الوقعة وإنما شبه لهم وهذا الإعتقاد فاسد وهو من غلو جهلة الطريق بل توفاه الله شهيدا وكان أمر الله قدرا مقدورا ولا يخفى على أهل التصديق وذوي التحقق والتحقيق أن طريقة سيدنا رضي الله عنه وكمال فضله ومناقبه ومناقب أصله ونسله لا يحتاج في تكثير سوادها بما يختلقه المختلقون ويجد فيه سبيلا للطعن المنتقدون مثل هذه القولة التي يشيعها الجهال ويظنون ذلك فيه مما له من الكمال ويشبه هذه القولة ما يتقوله بعض الإخوان عن الشيخ عمر الفوتي مؤلف الرماح بأنه دخل دهليز إلى أن يخرج أيضا مع المنتظر أو مع أهل الكهف إن هذا لشيء عجاب فاعتقاد مثل هذا والتنويه به مضر ومؤد إلى سوء الإعتقاد في ذلك الجناب المتنور وإن كانت المحبة تقضي على صاحبها بما لم تقض به على غيره لكن خير الأمور الوسط ويشبه هذا الإعتقاد تمسك الإمامية من الشيعة فاعتقدوا المهدوية في العارف الكامل الإمام العدل السيد محمد بن الحسن العسكري أحد الأئمة الإثنى عشر فإنهم يقولون بأنه هو المهدي المنتظر وهو في دهليزه قد استتر وينتظرون خروجه في آخر الزمان وإلى الآن في اعتقادهم حي ولكن طال منهم الإنتظار وذلك من غلو المحبة التي لها الإستيلاء على القلوب في حضور وغيبة وهو اعتقاد الشيعة ولهم أشياع من زمانه إلى الآن…إلى أن قال ونحن نقول إن المهدي غيره…إلى أن قال وليس المهدي من أصحاب سيدنا رضي الله عنه ولكن من المحبين في جنابه وجناب أحبابه وقد بلغنا عن سيدنا رضي الله عنه أنه إذا جاء المنتظر فإنه يطلب الفاتحة من أصحابنا و أعدى الأعادي إلى هذا الإمام فقهاء عصره المتراسين وهم من المبغضين فيه ولكن لا يتظاهرون بالبغض لما له من السطوة فهم يطيعون أوامره بالسيف الذي في يده مسلول…وقد بلغنا عن سيدنا رضي الله عنه أنه قال إذا جاء سلطان الحق جمع العلماء في صرة وقطعهم بالمرة فقيل له مرة حتى علماء الطريق فقال إنه يطلب من أصحابنا الفاتحة فإن قيل في أي وقت يخرج هذا المنتظر فالجواب أن ذلك في القول الحق لا سبيل إلى معرفته غير أن جل العارفين يقربون زمانه وغالبهم يقول إنه ولد الآن بما يكشف لكل واحد من حاله الذي تحقق به في سره وما ذاك إلا أنهم يرون بلا شك مرتبته عند الفتح الهجومي عليهم فيقولون إن المنتظر الآن ولد وبفهم هذا يندفع الإعتراض عليهم فأما من يقول منهم أنه اجتمع به في المحل الفلاني فالحق أنه اجتمع بروحانيته وكثير من الأولياء يجتمعون بأرواح أشخاص قبل وجود ذواتهم وليس ذلك بعجيب في جانب الكرامة وإن كل مثل هذا يستبعده الواقفون مع الظاهر إن لم نقل القاصرون عن إعطاء الحق للمظاهر فإن قلت ما تقولون فيما بلغكم عن سيدنا رضي الله عنه من أنه وجه بعض خاصة أحبابه ليجتمع بالمهدي في عرفات وبذلك أخبر العارف بالله سيدي محمد الغالي بوطالب الشيخ عمر الفوتي أيضا بأنه أقام بالحرم الشريف ليجتمع به هناك فالجواب أن ذلك من هذا القبيل وتوجيه ذلك الصاحب إنما هو من باب إرشاد المريد لما فيه نفعه فكان فتح ذلك الموجه هناك ولا يبعد اجتماعه بروحانيته كما لا يبعد أن يكون قد أقام العارف المذكور لهذا المعنى وأما ما يشاع عن الشيخ عمر الفوتي المذكور بأنه دخل دهليز حتى يخرج مع المنتظر فلا شك أنه متقول ما عليه معول.إهـ\n\nوقال العلامة سيدي أحمد سكيرج رضي الله عنه في رفع النقاب الربع الرابع عند ترجمته للسيد محمد الغالي بوطالب رضي الله عنه:قد بلغنا على لسان الثقة أن سيدنا رضي الله عنه قد وجه صاحب الترجمة ليقوم مقامه في ذكر بعض الأذكار بالحرمين الشريفين وبشره بأنه لا يخرج من الدنيا حتى يفتح عليه ويجتمع بالإمام المهدي.إهـ"}, {"q": "السلام عليكم هل يمكن أن تعطوني بعض المعلومات عن الجن عموما، وكذلك في الطريقة التجانية ؟", "a": "و عليكم السلام و رحمة الله و بركاته\nقال العارف بالله سيدي العربي بن السايح رضي الله عنه في البغية ص 233 طبعة دار التجاني: تنبيه:ما ذكر من أن هذه الطائفة المخصوصة من أهل هذه الطريقة المباركة مشتملة على الإنس والجن هنا يستدعي التنبيه على طرف مما هو معتقد أهل السنة في الجان وأحواله وما يدور على ذلك من الأحكام فنقول :اختلف في وجود الجن قديما وحديثا وأكثر الفلاسفة على إنكار وجوده والجمهور من أرباب الملل والمصدقين للأنبياء عليهم السلام على إثبات وجوده وهو معتقد أهل السنة رضوان الله عليهم ثم اختلف المثبتون لوجوده أيضا على قولين فمنهم من زعم أنها ليست أجساما ولا حالَّة في الأجسام وإنما هي جواهر قائمة بأنفسها ثم هي عندهم مختلفة بالماهية كاختلاف ماهيات الأعراض بعد استوائها في الحاجة إلى المحل فبعضها خيِّرة وبعضها شريرة وبعضها كريمة محبة للخيرات وبعضها دَنيَّة خسيسة محبة للشرور والآفات قالوا ولا يعلم عدد أنواعهم وأصنافهم إلا الله تعالى والقول الثاني: في الجن أنهم أجسام واختلف هؤلاء أيضا على قولين فقيل إن الأجسام مختلفة في ماهياتها والقول الثاني أنها متساوية في تمام الماهية ثم هؤلاء القائلون بهذا القول الثاني فرقتان الأولى قائلة بأن البنية ليست شرطا للحياة وهو قول الإمام الأشعري وجمهور أتباعه وأدلتهم في هذا الباب ظاهرة قوية والثانية قائلة بأن البنية شرط للحياة وهو مذهب المعتزلة ولا دليل لهم عليه إلا الاستقراء وهو إنما يتمشى على مذهبهم من إنكار وجود خرق العادة واستقراؤهم في ذلك ركيك ومذهبهم فاسد حسبما أوضح المحققون من أهل السنة ذلك وإذا ثبت كما عليه الأشعرية أن البنية ليست شرطا للحياة لم يبعد أن يخلق الله تعالى في الجوهر الفرد علما بأمور كثيرة وقدرة على أشياء شاقة شديد فبان من مجموع هذا صحة القول بإمكان وجود الجان سواء كانت أجسامهم لطيفة أو كثيفة وسواء كانت أجرامهم كبيرة أو صغيرة.إهـ مخلص ما في هذا المبحث على طريقة المتكلمين .وقد دل القرآن العظيم، والذكر الحكيم، الذي{لا ياتيه الباطل من بين يديه ولا من خلفه}على وجود الجان ويكفي قوله تعالى:{قل اوحي إلي}الآية.قال الرازي:هو أمر منه تعالى لرسوله عليه الصلاة والسلام أن يظهر لأصحابه ما أوحي إليه في واقعة الجن وفيه فوائد: إحداها: أن يعرفوا أنه بعث إليهم كما بعث إلى الإنس. الثانية:أن يعلم أنهم مع تمردهم لما عرفوا إعجاز القرآن آمنوا .الثالثة: أن يعلم أنهم يسمعون كلامنا ويفهمون لغاتنا. الرابعة: أن يعلم أنهم مكلفون كالإنس الخامسة: أن يظهر أن الموفق منهم يدعو غيره إلى الإيمان.قال الرازي: وفي هذه الوجوه مصالح كثيرة إذا عرفها الناس.إهـ فبان من كون النبي صلى الله عليه وسلم مبعوثا إليهم وأنهم مكلفون وأن الموفق منهم يدعو غيره إلى الله أن لهم الثواب وعليهم العقاب وأنهم يصح الاقتداء بمن تأهل له منهم. وقد روى أصبغ عن ابن القاسم رضي الله عنهما أن للجن الثواب والعقاب وتلا أعني ابن القاسم {وإنا منا المسلمون} الآية. قال ابن رشد: استدلال ابن القاسم صحيح بلا إشكال بل هو نص جلي في ذلك ففي الجن مسلمون ويهود ونصارى ومجوس وعبدة الأوثان وقالوا في قوله تعالى:{كنا طرآئق قددا} أي مختلفين في الكفر. والإجماع على تعذيب الكفار منهم لقوله تعالى: {لأملأن جهنم من الجنة والناس } الآية .واختلف في دخولهم الجنة. قال صاحب أحكام الجان: وهل يدخل المؤمنون منهم الجنة؟ أكثر العلماء على ذلك والمأثور عن مالك والشافعي رضي الله عنهما: لا يدخلون وإنما يدخلون أرباضها بحيث يراهم المؤمنون من الجنة ولا يراهم الجن .واختلف أيضا على القول بالدخول هل يرون الله أم لا؟ قال عز الدين ابن عبد السلام: لا يرونه إذ الرؤية مخصوصة بالبشر .فهذا بعض ما ينبئ على تكليفهم. وكون النبي عليه الصلاة والسلام مبعوثا إليهم بذلك وعلى صحة الاقتداء بهم.فلو فرضنا جنيا مسلما هل تصح الصلاة خلفه أم لا. قال صاحب أحكام الجان: تصح لأن الرسالة لنا ولهم.إهـ وهو الذي صرح به الرازي في الوجوه السابقة وإذا صح الاقتداء به في الصلاة فكذلك يصح جعله قدوة في الطريق كما يصح اقتداؤه بالإنسي وأخذه عنه، وهو من المعروف المشهور عند أهل الطريق. نعم لم ينقل لنا عن أحد من أهل الطريق أنه شَيَّخَ جنيا في الطريق إلا ما في بعض طرق المسلسل بالمصافحة، وكذلك تلقي بعض العارفين لبعض الأسرار الخاصة من خاصتهم كتلقي سيدي علي حرازم تلميذ سيدنا رضي الله عنه للحزب السيفي وغيره من الأسرار مشافهة من القاضي أبي محمد شمهورش الصحابي المعروف رضي الله عنه وذلك بإذن من سيدنا رضي الله عنه كما هو معروف عند الأصحاب.وكأخذ الشيخ أبي العباس سيدي أحمد ابن الشيخ محمد بن ناصر الدرعي رضي الله عنهما فاتحة الكتاب بالقراءة الورشية متصلة ميم البسملة بالحمد لله رب العالمين عن عبد المؤمن الجني الصحابي رضي الله عنه لما لقيه ببدر حين حج عن رسول الله صلى الله عليه وسلم حسبما وقفنا عليه في أسانيد بعض العلماء وما وقع لسيدي على حرازم أدخل وأوجه في التمثيل به في هذا المقام وهذا بالنسبة لنا معهم وأما هم مع بعضهم بعضا فمقتضى ما تقدم أنه يشيخ بعضهم بعضا ولا إشكال والله تعالى أعلم .تتمة: قد ذكر الشيخ محيي الدين رحمه الله تعالى في الباب الحادي والخمسين من فتوحاته المكية ما يرشد إلى أن الهرب من صحبة الجان وترك مجالستهم أولى بالعاقل وأن الإيثار لمجالستهم جهل قائلا: فإن مجالستهم ردية جدا قل أن تنتج خيرا لأن أصلهم نار والنار كثيرة الحركة ومن كثرت حركته كان الفضول أسرع إليه ثم قال بعد كلام في بيان ما ذكره ما نصه: وما جالس الجان أحد فحصل عنده منهم علم بالله جملة واحدة لأنهم أجهل العالم الطبيعي بالله تعالى ويتخيل جليسهم بما يخبرونه به من حوادث الأكوان وما يجري في العالم مما يحصل لهم من استراق السمع من الملأ الأعلى فيظن أن ذلك من كرامة الله بهم وهيهات ما ظنوا وغاية الرجل الذي تعتني به أرواح الجن أن يمنحوه من علم خواص النبات والأحجار والأسماء والحروف وهو علم السيمياء فلم يكتسب هذا منهم إلا العلم الذي رمته ألسنة الشرائع.وأطال في ذلك ثم قال رضي الله عنه: ومن ادعى صحبتهم وهو صادق في دعواه فاسألوه عن مسألة في العلم الإلهي فما تجدون عنده من ذلك ذوقا أصلا فرجال الله يفرون من صحبة الجان وقد أُخبرت بأن صحبتهم تورث التكبر على الناس ومن تكبر على الناس مقته الله تعالى من حيث لا يشعر فنسأل الله العافية.إهـ\nوقال الخليفة المعظم سيدي علي حرازم رضي الله عنه في جواهر المعاني وبلوغ الأماني ص 538 بتحقيق سيدي محمد الراضي كنون:وسألته رضي الله عنه عن الجن هل يدخلون الجنة ويتنعمون فيها كالآدميين أولا نصيب لهم فيها؟ وهل يرجعون ترابا كالحيوانات أم لا؟ فأجاب رضي الله عنه بقوله: اعلم أن القول الذي يجب المصير إليه وهو عين الحق والصواب أن الجان مستوون مع بني آدم في عموم التكليف بالقيام بأمر الله أمرا ونهيا وتحريما ووجوبا وفي عموم الرسالة إليهم ودعوتهم إلى الله تعالى لا فرق بينهم وبين بني آدم في هذا الأمر الذي ذكرناه بقواطع نصوص الكتاب والسنة و الإجماع. أما الكتاب فما ذكر الله عنهم في سورة الأحقاف وفي سورة الجن وهو صريح لا يقبل التأويل.وأما السنة فقوله صلى الله عليه وسلم:{بعثت إلى الثقلين الإنس والجن} وهو حديث مجمع على صحته وتواتره كل من اعتقد خلافه كفر وانعقد إجماع الأمة على هذا في عموم الرسالة لنا ولهم وعموم دعوتنا ودعوتهم إلى الله تعالى على لسان رسوله صلى الله عليه وسلم وفي عموم تكليفنا وتكليفهم بالقيام بأمر الله تعالى وحيث كان الأمر هكذا فهم مساوون لنا فيما يشتمل عليه عموم الخطاب الإلهي والنبوي من تقرير الثواب والعقاب لمن أطاع الله أو عصاه منا ومنهم ودخول الجنة والتمتع بها لمن أطاع الله أو غفر له معاصيه وكان مؤمنا منا ومنهم والعذاب بالنار ودخولها لمن عصا الله ولم يغفر له منا ومنهم.يشهد لهذا قوله سبحانه وتعالى:(ومآ أرسلنا من رسول إلا ليطاع بإذن الله) وقوله سبحانه وتعالى:(من يطع الرسول فقد اطاع الله) فهي صادقة في كل من أرسل إليهم لمن آمن بالله وقام برعاية حدوده وأحكامه أمرا ونهيا فلا فرق بينهم وبين الآدميين في هذا لشمول الرسالة والدعوة إلى الله تعالى والتكليف بالقيام بأمر الله منا ومنهم قال سبحانه وتعالى:(تلك حدود الله ومن يطع الله ورسوله ندخله جنات تجري من تحتها الانهار خالدين فيها وذلك الفوز العظيم)إلى قوله:(مهين) مشتملة بجميع أحكامها على كل فرد من أفراد المرسول إليهم الذين أمر الرسول بدعوتهم إلى الله تعالى وقال سبحانه وتعالى:(ومن يعمل من الصالحات من ذكر او انثى وهو مؤمن فأولئك يدخلون الجنة ولا يظلمون نقيرا) فهي مشتملة على كل من أرسل إليهم الرسول ودعاهم إلى الله تعالى وقال تعالى في حق أولي الألباب من المؤمنين حيث أخبر عنهم أنهم قالوا:(ربنا إننا سمعنا مناديا ينادي للايمان) إلى قوله:(من ذكر او انثى) فهي مشتملة على كل من اشتملت عليه الرسالة والدعوة إلى الله تعالى من الجن والإنس.وقال تعالى:(وعد الله المومنين والمومنات جنات تجري من تحتها الانهار) الآية فهي مشتملة أيضا وقال تعالى:(ان الذين ءامنوا وعملوا الصالحات كانت لهم جنات الفردوس) الآية وكل هذه الآيات وأمثالها مشتملة على كل فرد من المرسول إليهم ولا يلتفت لما سطر في الأوراق مما يناقض هذا فإن تلك تخيلات عقلية بينة البطلان بصريح نصوص الكتاب والسنة كما ذكرناه آنفا وفي غيرها. وفي هذا كفاية لمن تأمل والسلام. انتهى من خط محبنا سيدي المختار بن الطالب من إملاء شيخنا رضي الله عنه عليه من حفظه ولفظه .\nوفي جواهر المعاني وبلوغ الأماني للخليفة المعظم سيدي علي حرازم رضي الله عنه ص 543 بتحقيق سيدي محمد الراضي كنون:وسألته رضي الله عنه عن مشاهدة الخلق أعني الملائكة والجن والإنس فأجاب رضي الله عنه بقوله:اعلم أن أولياء الجن دورانهم حول الفعل وسر الفعل ونور الفعل والروحانيون دورانهم حول الإسم وسر الإسم ونور الإسم والملائكة دورانهم حول الصفات وسر الصفات ونور الصفات وأولياء الآدميين دورانهم حول الذات وسر الذات ونور الذات قد علم كل أناس مشربهم.الآدمي أول مرتبة يطلع عليها في الكشف مرتبة الجن ثم يترقى إلى الرابعة لا حرمنا الله منها والسلام.إهـ\nوقال المحقق سيدي العربي بن السائح رضي الله عنه في البغية ص 144 طبعة دار التجاني ما نصه: تسخير الروحانية منه ما يكون من طريق الاستخدامات والاستنـزالات المعروفة عند أربابها وهو طريق مذموم وصاحبه على ألسنة الشرائع والحقائق مٌدْنِفٌ ملوم بل هو طريق مشؤوم وصاحبه مخذول محروم وهو سيء العاقبة بلا شك والعياذ بالله والتسخير من هذا الطريق منزه عنه من كان من أمثال والد الشيخ رضي الله عنه ومنه ما يكون من طريق انقياد الكون بما احتوى عليه لمن أهله الله تعالى لبساط قربه ومشاهدته واصطفاء لحضرة تخصيصه وعنايته وهذا من باب كرامات الأولياء وخرق العوائد لخاصة الأصفياء إلا أن الزهد فيه وعدم الإكتراث به هو الكرامة الحقيقية الخاصة بخاصة الخاصة من عباد الله الأتقياء الأبرياء…إهـ\nويقول العارف بالله سيدي ابراهيم صالح الحسيني التجاني في كتابه النهج الحميد فيما يجب على المقدم والمريد : فلا بد من محافظة المقدم على سلوك المريدين والسعي في تقويم انحرافات بعضهم وإصلاح أخطائهم ومن نصحه لهم أن لا يرشدهم إلا إلى ما يعلم أنه فيه صلاحهم دينا ودنيا وأن لا يغشهم بحملهم على التصديق والإيمان بالأباطيل والأوهام وأن لا يحملهم على الإيمان بما لا أصل له من الطلاسم والأشكال والخواص والخط رمليا كان أو غيره والقرعة والعرافة والكهانة وسائر العلوم السحرية والكيمياء وفتح المغاليق والكنوز وإخراج المدفون والمندل بجميع أنواعه والتنجيم والتوجه إلى الجن والروحانيين بالدعاء والعبادة وأخذ الفأل بالنية والقصد فكل هذا وأمثاله من الباطل الذي لا يحل ولا يجوز للمقدم المقتدي بسيدي أحمد التجاني رضي الله عنه أن يتعاطاه لأنه نهى عنه وحذر وأوضح أن الرسول صلى الله عليه وسلم نهاه عنه ولا تعجب فإن الرسول صلى الله عليه وسلم قد نهى عن ذلك الأمة كلها في أحاديث صحيحة ثابتة يعلمها علماء السنة العاملون وصوفية الحق المخلصون .إنتهى\nوقال العارف بالله سيدي محمد عز الدين التجاني الحسني رضي الله عنه:الذبيحة للجن قطعا محرمة كلما ذبح الإنسان لإرضاء الجن إلا وسلطه الله عليه ليركبه.إهـ"}, {"q": "ماذا تقولون في الشيخ حامد ادم القطب التائب من التجانية كما يقول وفي كلامه الموجود على مواقع شبكة النت حول التصوف و السحر والشعوذة و قلب الآيات بالعكس وكثير من الأمور التي وردت… وشكرا", "a": "بسم الله و الحمد لله و الصلاة و السلام على اشرف خلق الله…\nبالنسبة لسؤالك حول محاضرات حامد آدم عن التجانية و السحر\nيوجد سحرة ومشعوذين يدخلون على العوام باسم التصوف أو تحت مسميات أخرى أو أنهم يريدون إيصالهم إلى الله ويظهرون أمامهم خوارق و سحر و أشياء شيطانية أخرى، ومن ثم يسيطرون عليهم ويسرقون أموالهم ويعلمونهم السحر والشعوذة، كما حدث مع هذا الشيخ حامد آدم\nنحن نأسف لما حصل لهذا الرجل أو لغيره من التعرض لأنواع السحر و الشعوذة و الدجل لكننا ننكر عليه أنه جعل أمور الشعوذة والسحر التي يتكلم عنها متعلقة بأصحاب الطريقة التجانية أو الطرق الصوفية ، ألا يعلم هذا أن أمثال هؤلاء الناس موجودون في كل مكان و زمان ؟ و ما هم إلا دخلاء على التصوف و أول من يشوه صورته في قلوب الناس فيعتقد بعض العامة أن كل الشيوخ مثل هذا الشيخ الذي افتتن به حامد آدم وأراد أن يعلمه السحر والشعوذة.\n\nفقد وجد من لبس لباس المسلمين وخدعَ الناس وأمَّهم وخطب بهم وكان شيخاً عليهم ثم اكتشف الناس بعد ذلك أنه إما مشعوذ أو يهودي أو نصراني، فمن العيب والجهلٌ أن نقول أن كل أئمة المسلمين هكذا ! والمنصف يقول أنه يوجد صالحون ويوجد مفسدون في كل زمان و مكان وليس كلهم على سوية واحدة، فلماذا التعميم ؟\n\nو من علامات هؤلاء المشايخ السحرة اللابسين لباس التصوف أنهم لا يقرؤون القرآن الكريم كما أنزل، بل يقرؤونه بشكل معكوس ، أو يخلطونه بطلسمات غير مفهومة ، ولا يذكرون معها أسماء الملائكة ولا أسماء الأنبياء والمرسلين و غيرها من الأشياء المنكرة النجسة .\nفليس كل من ينسب نفسه للتجانية تجانيا إذا لم يلتزم بشروطها و أولها المحافظة على الحدود الشرعية فشيخه هذا بالعكس فعل الموبقات و تعاطى السحر الذي حرمه الدين و العياذ بالله\nفهؤلاء السحرة و الدجالون و المشعوذون يتخفون في زي شيوخ كي يصلوا الى مآربهم ، و الكشف عنهم يسير جدا وهو أنهم لا يراعون الدين و الشريعة في شيء و لذلك نستغرب كيف يقع في مصائدهم من كان يدعي ان له دراية بعلوم الدين\n\nجاء في رسائل الشيخ رضي الله عنه لمريديه\n\nفتعلقك بالخواص في طلب الدنيا وأغراضها وشهواتها، وأنت مشغول بإطلاق لسانك في الغيبة والنميمة، وفيما لا يرضي الله، منهمك في البعد عن الله، لا ربح في هذه التجارة إلا التعب، فلا تظفر منها بشيء .\nفلا ينبغي الخوض في الخواص المتعلقة بالأذكار و الأسماء و الحروف و الجداول لأن الإقبال عليها و الولوع بها يؤدي إلى خطر عظيم “\nيقول سيدي الأحسن البعقيلي رضي الله عنه ضمن كتابه سوق الأسرار إلى حضرة الشاهد الستار :\nوالتعرض للأرزاق بالأسباب الحلالية التي أذن فيها الله ولا يأذن الله إلا فيما فيه مصلحتك وعدم إذايتك لنفسك ولغيرك وهذه الحكمة مقررة في سياسة كتاب الله لتعيش في الدنيا والآخرة مُنعما فإن آذيت نفسك وغيرك يربك الله بما ذكره الله في كتابه ثم إن الأسباب الحسنة هي التي كانت في الطريقة الأولى في عهد رسول الله صلى الله عليه وسلم من فلاحة وتجارة بشروطها وحرفة بشروطها\nوما أحدث بَعدهم من التعرض للأرزاق باستخدام الأسماء في عرفهم والروحانيين بإهلاكهم وقتل ملوكهم بإحراقهم بأنوار الأسماء الجلالية على كيفية معلومة عندهم وكأخذ الأجرة على تناول مثل الكتف فينظر فيها فيريه الشيطان صورا شيطانية تدل على المغيبات من موت أمير وغيره كالخط لرجم الغيب من نحو الزناتي وكرجم الغيب بالرمل وعلم النجوم عندهم وكرجم الغيب بمثل قرعة الأنبياء عندهم وقرعة الطيور وكاستعمال أسماء البركة وكتغيير سكة الأمير وكحرق مثل نحاس حتى يصير مثل فضة فيعيش بها فضة وكالتثقيف للجنين والولادة وإفساده ورميه وكالتفريق بين الأحبة وكالجمع بين الزناة وكالضمائر والخط وكل ما لم تأذن فيه حقيقة الشريعة فكل ذلك ضلال مبين لا شك في ضلال صاحبه لتلبسه بمثل الكفر وذلك كله عمل الكفر بل فعل الأغمار من العاجزين.إهـ\nوقراءة الطالع والتنجيم وغيره من المسميات داخلة كلها في مسمى السحر.فعن سيدنا علي بن أبي طالب رضي الله عنه :قال مولانا رسول الله صلى الله عليه وسلم :{ثلاثة لا يدخلون الجنة مدمن خمر وقاطع رحم ومصدق بالسحر } وقال النبي صلى الله عليه وسلم {اجتنبوا السبع الموبقات } فذكر منها السحر . انتهى\n\nوالله أعلم وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم"}, {"q": "تعقيب حول الأسئلة المتعلقة بأن أصحاب الطريقة التجانية يعتبرون صلاة الفاتح أفضل من القرآن و تعدل ستة أو ستة آلاف ختمة من القرآن الكريم", "a": "بسم الله و الحمد لله اللهم صل على سيدنا محمد الفاتح لما أغلق و الخاتم لما سبق ناصر الحق بالحق و الهادي إلى صراطك المستقيم و على آله حق قدره و مقداره العظيم\n\nكثيرا ما يتكرر في رسائل السادة القراء طرح الأسئلة المتعلقة بتفضيل صلاة الفاتح على القرآن التي ينشرها المنكرون حيث صرح الشيخ التجاني رضي الله عنه أنها تعدل ستة أو ستة آلاف ختمة من القرآن\n\nو أصل في هذه الشبهة هو خلط المنكر لمفهوم ” تعدل ” بمفهوم ” تفضل ” فهناك فرق شاسع كبير بين الثواب والأفضلية\n\nو كون ان هذه الصلاة “تعدل” ذلك الفضل و التضعيف جائز شرعا و عقلا و لا ينافي أي أصل من أصول الشريعة و لا يعني بآي حال تفضيلها على جوهر لفظ القرآن و هناك العديد من الأذكار في السنة التي تعدل أجورها ما لا يعلم إلا الله تعالى\nو الصلاة على النبي صلى الله عليه و سلم هي من أعظم القربات فأين المانع من أن تعدل ذلك أو حتى أكثر منه – والله يضاعف لمن يشاء والله واسع عليم\n\nبعض ما جاء في تضعيف الحسنات و الأجور\n( قال تعالى ( وإن تك حسنة يضاعفها ويؤت من لدنه أجراً عظيما\nوفي ” الصحيحين ” عن أبي هريرة عن النبي صلى الله عليه وسلم قال: كل عمل ابن آدم\nيضاعف : الحسنة بعشر أمثالها إلى سبعمائة ضعف ، وفي رواية بعد قوله : إلى سبعمائة ضعف : إلى ما يشاء الله\nعن أبي عثمان النهدي قال قال أبو هريرة : سمعت رسول الله صلى الله عليه وسلم يقول : ” إن الله عز وجل يعطيه ألفي ألف حسنة ” . ثم تلا : ( يضاعفها ويؤت من لدنه أجرا عظيما ) . فقال : إذا قال الله عز وجل : ( أجرا عظيما ) فمن يقدر قدره\nوفي رواية : أتيت أبا هريرة فقلت : بلغني أنك تقول : إن الحسنة تضاعف ألف ألف حسنة . فقال : وما أعجبك من ذلك ؟ فوالله ، لقد سمعته ، فذكر نحوه . رواه أحمد بإسنادين ، والبزار بنحوه ، وأحد إسنادي أحمد جيد\nو جميع ما هو مذكور عن شيخنا رضي الله عنه مما تلقاه من الحضرة المحمدية في فضل هاتين الصلاتين ليس فيه مصادمة للنصوص القطعية ، و ليس فيه ما يؤدي إلى انخرام القواعد الشرعية ، إذ غايته أنه إخبار عدل عنه صلى الله عليه و سلم ، بذكر غير خارج عن معنى ما أتى به ، و لا منحرف عن أصول دينه القويم ، و بتضعيف الأجر الثابت أصله في الكتاب و السنة { و الله يضاعف لمن يشاء } البقرة. و في الحديث ” بعشر أمثالها إلى سبعمائة ضعف إلى أضعاف كثيرة “\nو من المقرر لدى العلماء في التضعيف أنه يكون تارة باعتبار لفظه ، كاشتماله على جميع الأوصاف الذاتية و الفعلية ، و تارة يكون باعتبار الأشخاص فإن عبادة أهل المراتب ليست كعبادة غيرهم في الفضل ، و قد يعظَّم فضل الله تعالى على أهل المراتب فيَسري سر التضعيف في أتباعهم بسبب إذنهم لهم ، فيحصل للمأذون له قسط مما للآذن و إن لم يجاهد مجاهدته ، و تارة يكون باعتبار الأزمان ، و تارة باعتبار الأمكنة كالعمل في الحرمين الشريفين على ما ورد .\nو هذه الصلاة الشريفة، قد اشتملت على الوجوه التي تكون سببا للضعف المذكور كالثناء على حبيبه الأعظم و رسوله الأكرم على أبلغ الثناء و أعم المدح، مع ما اشتمل عليه قوله فيها :” حق قدره و مقداره العظيم ” ،هذا باعتبار اللفظ\nوأما باعتبار الأزمان فمن حيثية كونهم في آخر الأزمان الذي ورد الخبر أن القابض فيه على دينه كالقابض على الجمر، و أن للعامل من أهل هذا الزمان أجر الخمسين ، قالوا:” منا أو منهم؟» قال صلى الله عليه و سلم: ” منكم لأنكم تجدون على الخير أعوانا وهم لا يجدون عليه أعوانا .”\nوالذي نعتقد به أن الله تعالى تفضل بذلك بمحض جوده و كرمه ، إما بلا سبب أو بسبب لا يدركه أمثالنا إلا بتعريف من الله تعالى\nوالشيخ التجاني رضي الله عنه لم يقل أنها من القرآن أو أنها من وحي النبوة بوجه من الوجوه، ولا أنها من أي كتاب من كتب الله تعالى، ولا أنها من الحديث القدسي، ولا وجود لهذا الكلام في أي مكان من كتب الطريق. ولم يقل، بأنها أفضل من القرآن أو توازن به. ومن نسب إليه ذلك فهو كاذب، وقد صرح بأن القرآن أفضل الكلام، ولا يتردد في هذا عاقل من المسلمين\nأعمال قليلة عظيمة الأجر\nكما ان هنالك الكثير من الأعمال في السنة النبوية بسيطة القدر والجهد عظيمة في أجرها وثوابها بل قد يتجاوز ثوابها أفضل العبادات في الدين كالجهاد والصيام والحج وغيرها من الأعمال ذوات المشقة والصعوبة\nقال رسولنا الكريم صلى الله عليه وسلم : « من دخل السوق فقال: “لا إله إلا الله وحده لا شريك له، له الملك وله الحمد يحيي ويميت وهو حي لا يموت بيده الخير وهو على كل شيء قدير” كتب الله له ألف ألف حسنة ومحا عنه ألف ألف سيئة ورفع له ألف الف درجة » وفي رواية: « وبنى له بيتا في الجنة » [ رواه الإمام أحمد والترمذي وابن ماجه والحاكم عن ابن عمر\n\nقال صلى الله عليه وسلم: (من قال بعد صلاة الصبح أشهد أن لا إله إلا الله وحده لا شريك له له الملك إلها واحداً صمدا لم يتخذ صاحبة ولا ولدا ولم يكن له كفوا أحد كتب الله له أربعين ألف حسنة\nحديث حسن ذكره ابن السني في عمل اليوم والليلة\nروى الطبراني عن عبادة بن الصامت، قال: سمعت رسول الله صلى الله عليه وسلم يقول: من استغفر للمؤمنين والمؤمنات كتب الله له بكل مؤمن ومؤمنة حسنة. قال الهيثمي في المجمع: إسناده جيد، وحسنه الألباني في الجامع\nفتأمل رحمك الله قوله بكل مؤمن حسنة و هذه الٱلاف المؤلفة من الحسنات التي لا يعلم عددها الا الله على قدر كل مؤمن من إنس أو جن\n\nأخرج الترمذي عن عمر بن شعيب عن ابيه عن جده أنه قال : قال رسول الله صلى الله عليه وسلم (من سبح الله مائة بالغداة ومائة بالعشي كان كمن حج مائة حجة ومن حمد الله مائة بالغداة ومائة بالعشي كان كمن حمل مائة فرس في سبيل الله أو قال غزا مائة غزوة ومن هلل الله مائة بالغداة ومائة بالعشي كان كمن اعتق مائة رقبة من ولد اسماعيل ومن كبر الله مائة بالغداة ومائة بالعشي لم يأتي أحد اكثر من مما أتى به الا من قال مثل ما قال أو زاد عليه ) قال الترمذي حديث حسن صحيح . واخرجه النسائي\n\nحديث ام هانئ رضي الله عنها حينما سألت الرسول صلى الله عليه وسلم أن يدلها على عمل بسيط يكون به أجر كبير لانها اشتكت كبر السن فقال لها (كبري الله مائة مرة واحمدي الله مائة مرة وسبحي الله مائة مرة خير من مائة فرس ملجم مسرج في سبيل الله وخير من مائة بدنة وخير من مائة رقبة) أخرجه ابن ماجة . وحسنه الحاكم كما حسنه السيوطي\n\nوهذا هو في المرتبة الدنيا لهذا الذكر ، الذي يناله أي مسلم ثم يضاعف له عشر مرات لقوله صلى الله عليه وسلم ((من اتى بالحسنة فله عشر أمثالها)) . فكيف لو كان التالي من أهل التضعيف ! فمنهم من يضاعف له بالعشرات ومنهم من يضاعف له بالمئات ومنهم من يضاعف له بالآلاف ومنهم من يضاعف له بما لايعلم به الا الله ، قال تعالى ((والله يضاعف لمن يشاء)) وقال ((والله يرزق من يشاء بغير حساب))\n\nوالقرآن عدد حروفه معلوم ومحدود مضروباً في عشر حسنات يكون الناتج هو ثواب الختمة الواحدة من القران الكريم\nكما ثبت عنه صلى الله عليه وسلم أنه قال في سورة الإخلاص [ أنها تعدل ثلث القران ] متفق عليه\n\nفخلاصة الأمر أن هذا الأجر مزية لهذا الذكر لا غير . ولايلزم بذلك أن يكون أفضل منها ، أو أن يغني عن فعلها فكيف يستعجب البعض من هذا الفضل خاصة أن الشيخ رضي الله عنه قد بين في نفس الكتاب الذي ذكر فيه قولهم عن ثوابها وتكلم عن أفضلية القرآن على سائر الأذكار\nما قاله الشيخ التجاني رضي الله عنه في فضل القرآن\nقال الشيخ التجاني رضي الله عنه في فضل القرآن [أما تفضيل القران على جميع الكلام من الأذكار والصلاة على النبي صلى الله عليه وسلم وغيره من الكلام فأمره واضح وضوح الشمس كما هو في إستقراآت الشرع وأصوله ، شهدت به الآثار الصحيحة . وتفضيله من حيثيتين . الحيثية الأولى : كونه كلام الذات المقدسة المتصفة بالعظمة والجلال فهو من هذه المرتبة لايوازية كلام . والحيثية الثانية : مادل عليه من العلوم والمعارف ومحاسن الآداب وطرق الهدى ومكارم الأخلاق والأحكام الإلهية والأوصاف العلية التي لايتصف بها إلا الربانيون ، فهو في هذه المرتبة أيضاً لايوازيه كلام في الدلالة على هذه الأمور.] اهـ من لفظه رضي الله عنه\nبل وقد حث الشيخ التجاني رضي الله عنه مريديه على تلاوة القران قائلاً [إن أقل ما يجزئ المريد في طريقتنا أن يقرأ في كل يوم حزبين من القرآن] اهـ أي جزء كاملاً\nكما جاء في جواهر المعاني\nربما يطلع بعض القاصرين ومن لا علم له بسعة الفضل والكرم فيقول: إذا كان هذا كما ذكر فينبغي الاشتغال به أولى من كل ذكر حتى القرآن\nقلنا بل تلاوة القرآن أولى لأنها مطلوبة شرعا لأجل الفضل الذي ورد فيه ولكونه أساس الشريعة وبساط المعاملة الإلهية، ولما ورد في تركه من الوعيد الشديد، فلهذا لا يحلّ لقارئه ترك تلاوته\nو في المجمل\nفالصلاة على النبي صلى الله عليه وسلم لها مزية الثواب على بقية الأعمال وذلك لقوله صلى الله عليه و سلم (خرج من عندي جبريل آنفا وأخبرني عن ربي جل جلاله فقال : ما على الأرض من مسلم يصلي عليك مرة إلا صليت أنا وملائكتي عليه عشرا )\nقال تبارك وتعالى ((وما يعلم جنود ربك إلا هو)) وذلك لكثرتهم\nثم انظر الى قوله (صلى عليك مرة واحدة) وتخيل مقدار العشرة إذا ضربت في عدد لايعلمه إلا الله!، وهو أمر لاتستطيع العقول أن تحيط به وهذا الناتج جزء من الصلاة الواحدة صلاة المولى عز وجل عليه\n\nفإذا علمت هذا علمت ان الفضل بيد الله يعطيه من يشاء والله ذو الفضل العظيم ، وأنه يرزق من يشاء بغير حساب وبغير عدد . فهذا الذي ذكر من فضل صلاة الفاتح ليس فيه أي تفضيل على جوهر لفظ القرآن و ما هو إلا قطرة من بحر فضل الله تعالى و رحمته على عباده قال تعالى ((قل بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون)) و في الحديث القدسي (يَا عِبَادِي ، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ ، وَإِنْسَكُمْ وَجِنَّكُمُ اجْتَمَعُوا فِي صَعِيدٍ وَاحِدٍ ، فَسَأَلُونِي فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مِنْهُمْ مَا سَأَلَ لَمْ يَنْقُصْ ذَلِكَ مِنْ مُلْكِي شَيْئًا ، إِلَّا كَمَا يَنْقُصُ الْبَحْرُ أَنْ يُغْمَسَ فِيهِ الْمَخِيطُ غَمْسَةً وَاحِدَة"}, {"q": "السلام عليكم ورحمة الله\nقال مجنون: قال في جواهر المعاني “ص145 ج2”: ( إن وليًّا – وذكر اسمه – كان كثيرًا ما يلقى النبي صلّى الله عليه وسلّم، و يعلمه الشعر ). كيف ؟ و قد قال الله تعالى: { وَ مَا عَلَّمْنَاهُ الشِّعْرَ وَ مَا يَنبَغِي لَهُ } [يس: 69] و هذا كذب على رسول الله صلّى الله عليه و سلّم و افتراء عليه .\nهل قال شيخنا أحمد التجاني هذا وماذا تقولون جزاكم الله خيرا انتظر جوابكم", "a": "سيدي الفاضل !\nالسلام عليكم و رحمة الله و بركاته !\nيروج البعض أن اصحاب الطريقة التجانية يعتقدون ان الرسول صلى الله عليه و سلم شاعر و يعلم الشعر و اصل هذه الشبهات ما قد ورد في كتاب جواهر المعاني كما أخبر بذلك سيدي علي حرازم براده رضي الله عنه في\nالفصل الثالث: في إشارته العلوية و حل مشكلاتها بعبارات وهبية [ص342 لطبعة دار الكتب العلمية ] ما يلي :\nوَهَذِهِ الأَبْيَاتُ الَّتِي نَذْكُرُهَا بَعْدُ عَلَّمَهَا سَيِّدُ الوُجُودِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي المَنَامِ، لِلْوَلِيِّ الصَّالِحِ وَالسَّعْيِ الرَّابِحِ، صَاحِبِ المَشْهَدِ الكَرِيمِ الوَاضِحِ أَبِي عَبْدِ اللَّهِ سَيِّدِي مُحَمَّدٍ بْنِ العَرْبِيِّ التَّازِي دَاراً الدَّمْرَاوِيِّ أَصْلاً. المُتَوَفَّى بِعَيْنِ مَاضِي سَنَةَ 1214، فَلَمَّا اسْتَيْقَظَ وَجَدَهَا فِي فِيهِ يَذْكُرُهَا فَحَفِظَهَا، فَبَعْدَ ذَلِكَ لَقِيَ مَوْلَانَا رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقَظَةً، وَكَانَ يُلَاقِيهِ فِي اليَقَظَةِ كَثِيراً.\nفَسَأَلَهُ عَنْ مَعْنَى الأَبْيَاتِ وَطَلَبَ مِنْهُ شَرْحَ الأَبْيَاتِ، فَأَجَابَهُ لِذَلِكَ مَوْلَانَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِمَحَبَّتِهِ فِي شَيْخِنَا وَأُسْتَاذِنَا مَوْلَانَا أَحْمَدَ بْنِ مَحَمَّدٍ التِّجَانِي رَضِيَ اللَّهُ عَنْهُ، وَهُوَ تِلْمِيذٌ لَهُ، وَصَرَّحَ لَهُ سَيِّدُ الوُجُودِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِأَنْ قَالَ لَهُ: لَوْلَا مَحَبَّتُكَ فِي التِّجَانِي مَا رَأَيْتَنِي قَطُّ، أَوْ كَمَا قَالَ لَهُ مِمَّا هَذَا مَعْنَاهُ، وَقَالَ لَهُ: أَعْطِ شَرْحَ هَذِهِ الأَبْيَاتِ لِلتِّجَانِي، وَهَذَا نَصُّ الأَبْيَاتِ:\n\nفَبِالمَجْدِ وَالتَّحْمِيدِ بِهِ تَتَجَلَّى ذَاتُهُ * وَبِالقَصْدِ كَانَ المَنْعُ لِي وَحْدِي\nوَبِحَقِّ الحَقِّ بِالحَقِّ تَرَى حَقِيقَتَهُ * وَبِالحَقِّ لَا بِالحَقِّ احْتَجَبَ عَنِّي زَنْدِي\nوَفِي تَدْبِيرِ أَمْرِهِ أَحَاطَتْ قُدْرَتُهُ * وَبِالقَصْدِ لَا بِالقَصْدِ احْتَجَبَ عَنْهُمْ أَخْذِي\nفَاغْرَقْ فِي بَحْرِ الوَحْدَةِ تَرَى وَحْدَتَهُ * تَرْتَفِعُ عَنْكَ الحُجُبُ حَتَّى تَرَى الأَسْوَدَ بِالضِّدِّ\n\nهذا بالنسبة للشق الأول من سؤالك أما بالنسبة للشق الثاني و ماذا تقولون في ذلك ؟\nفي ما يخص قوله تعالى : ” وما علمناه الشعر وما ينبغي له “.[يس: 69 ]\nوعلى تسليم أن هذا شعر حتى يسقط الإعتراض\nقال بعض المفسرين :” أخبر الله تعالى عن حال نبيه صلى الله عليه وسلم أنه لا يعلم الشعر ، ورد قول من قال من الكفار إنه شاعر ، وأن القرآن شعر ، بقوله : ” وما علمناه الشعر وما ينبغي له ” فكان رسول الله صلى الله عليه وسلم لا يقول الشعر ولا يزنه .\nوقال أبو إسحاق الزجاج:” في معنى ” وما علمناه الشعر” وما علمناه أن يشعر أي ما جعلناه شاعراً، وهذا لا يمنع أن ينشد شيئاً من الشعر” و قال النحاس:” وهذا من أحسن ما قيل في هذا. ” وقد قيل: إنما خبر الله عز وجل أنه ما علمه الله الشعر، ولم يخبر أنه لا ينشد شعراً، وهذا ظاهر الكلام .\nقوله تعالى: ” وما ينبغي له ” أي وما ينبغي له أن يقوله. وجعل الله عز و جل ذلك علماً من أعلام نبيه عليه السلام لئلا تدخل الشبهة على من أرسل إليه، فيظن أنه قوي على القرآن بما في طبعه من القوة على الشعر .\nقال ابن العربي : هذه الآية ليست من عيب الشعر؛ كما لم يكن قوله: { وما كنت تتلو من قبله من كتاب ولا تخطه بيمينك} [العنكبوت : 48] من عيب الكتابة، فلما لم تكن الأمية من عيب الخط، كذلك لا يكون نفي النظم عن النبي صلى الله عليه وسلم من عيب الشعر\nيعني: لم نُعلمه الشعر لنقصٍ ، فلو أراد أنْ يقول شعراً لَقَالَ الشعر على أحسن مَا يُقَال، لكن لا ينبغي له ذلك\nوهذا كله أمر مقيد بزمن بعثته صلى الله عليه و سلم حتى تذهب شبهة صدور القرآن عن القريحة البشرية، أما و قد مضى زمن بعثته صلى الله عليه و سلم فلا مانع شرعا ولا عقلا أن يعلّم رسول الله صلى الله عليه وسلم أحد الأولياء من أمته بعض العلوم اللدنية عبر وعاء الرجز أو الشعر أو أن يلقنه بعض الأبيات اللدنية ، فالشعر غير مذموم في حد ذاته ، إنما عدم تمكن رسول الله صلى الله عليه وسلم من ملكة الشعر قيد حياته كان تنزيها لكتاب الله عن كونه بشري المصدر، وبما أن رسول الله صلى الله عليه وسلم انتقل إلى جوار ربه و انتفت بذلك شبهة تأليف القرآن من بشر، فلا مانع إذن من أن يمدّ الله أحد أوليائه بعلوم لدنية عبر وعاء الشعر بوساطة رسول الله صلى الله عليه و سلم إذا كان ذلك الولي ذا قريحة شعرية ، ألم يقل صلى الله عليه و سلم:” : مَنْ يُرِدْ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ، وَاللَّهُ الْمُعْطِي، وَأَنَا الْقَاسِمُ.” فكل ما برز من علوم على بساط الولاية فعائد إلى رسول الله صلى الله عليه و سلم فهو البرزخ الأعظم و هذا الأمر ثابت في حياته و بعد وفاته صلى الله عليه و سلم .\nو ما علمناه الشعر أي قيد حياته الدنيوية و زمان بعثته صلى الله عليه و سلم ولا يعني ذلك أنه لن يعلمه الشعر على الإطلاق. كيف ذلك ؟ فهو صلى الله عليه و سلم محل بروز كل العلوم على الإطلاق و إنما كان النفي في سياق هذه الآية عائد إلى إزاحة شبهة بشرية القرآن و هذا الأمر من جنس العام الذي أريد به الخصوص كقوله تعالى :” تدمر كل شيء بأمر ربها ” إنما عنى به تعالى مما أرسلت بهلاكه ؛ لأنها لم تدمر هودا عليه السلام ومن كان آمن به .\nو بهذا يتبين لك أن الاستدلال بهذه الآية لإثبات كذب شيخنا أحمد التجاني الصادق الصدّيق قدس الله سره و رضي الله عنه استدلال خاطئ عائد إلى سطحية المستدل من جهة و من جهة أخرى الذي أورد هذه الحادثة هو الخليفة سيدي علي حرازم رضي الله عنه في جواهر المعاني كما بينا ذلك ناقلا هذه الواقعة عن سيدي محمد بن العربي التازي الدمراوي رضي الله عنه رزقنا الله حسن الظن بأوليائه و حسن الأدب معهم . و الله هو الموفق للصواب .\n\nو السلام عليكم و رحمة الله و بركاته ."}, {"q": "السلام عليكم ورحمة الله وبركاته، أرجو من حضرتكم أن تبينوا لي هل أن معاوية إبن ابي سفيان نلعنه أو نترضا عليه وما هي أدلتكم على ذلك؟ جزاكم الله خيراً ونفعنا بعلمكم", "a": "وعليكم السلام ورحمة الله وبركاته\n\nعن أبي هريرة رضي الله عنه قال رسول الله صلى الله عليه وسلم: ” لا تَسُبُّوا أَصحَابِي؛ فَوَالَّذِي نَفسِي بِيَدِهِ لَو أَنَّ أَحَدَكُم أَنفَقَ مِثلَ أُحُدٍ ذَهَبًا مَا أَدرَكَ مُدَّ أَحَدِهِم وَلا نَصِيفَهُ.” رواه البخاري ومسلم\n\nقال ابن مسعود رضي الله عنه:\n” إن الله نظر في قلوب العباد، فوجد قلب محمد صلى الله عليه وسلم خير قلوب العباد، فاصطفاه لنفسه، فابتعثه برسالته، ثم نظر في قلوب العباد بعد قلب محمد، فوجد قلوب أصحابه خير قلوب العباد، فجعلهم وزراء نبيه، يقاتلون على دينه، فما رأى المسلمون حسنا فهو عند الله حسن، وما رأوا سيئا فهو عند الله سيئ ” رواه أحمد في “المسند” .\n\nقال الخطيب البغدادي رحمه الله في “الكفاية”:\n” على أنه لو لم يرد من الله عز وجل ورسوله فيهم شيء، لأوجبت الحال التي كانوا عليها من الهجرة، والجهاد، والنصرة، وبذل المهج والأموال، وقتل الآباء والأولاد، و المناصحة في الدين، وقوة الإيمان واليقين، القطعَ على عدالتهم، والاعتقاد لنزاهتهم، وأنهم أفضل من جميع المعدلين والمزكين الذين يجيؤون من بعدهم أبد الآبدين، هذا مذهب كافة العلماء، ومن يعتد بقوله من الفقهاء ” . .\n\nقال ابن تيمية رحمه الله: ” وأهل السنة تحسن القول فيهم وتترحم عليهم وتستغفر لهم، لكن لا يعتقدون العصمة من الإقرار على الذنوب وعلى الخطأ في الاجتهاد إلا لرسول الله، ومن سواه فيجوز عليه الإقرار على الذنب والخطأ، لكن هم كما قال تعالى:” أُولَئِكَ الَّذِينَ نَتَقَبَّلُ عَنْهُمْ أَحْسَنَ مَا عَمِلُوا وَنَتَجَاوَزُ عَنْ سَيِّئَاتِهِمْ ” ، وفضائل الأعمال إنما هي بنتائجها وعواقبها لا بصورها ” “مجموع الفتاوي” .\n\nوقد قرر ذلك الكتاب والسنة في أكثر من موقف :\nفقد تجاوزَ الله سبحانه وتعالى عمن تولى يوم أُحُدٍ من الصحابة ، فقال سبحانه وتعالى : ” إِنَّ الَّذِينَ تَوَلَّوْاْ مِنكُمْ يَوْمَ الْتَقَى الْجَمْعَانِ إِنَّمَا اسْتَزَلَّهُمُ الشَّيْطَانُ بِبَعْضِ مَا كَسَبُواْ وَلَقَدْ عَفَا اللّهُ عَنْهُمْ إِنَّ اللّهَ غَفُورٌ حَلِيمٌ “\n\nولما أذنب بعض الصحابة حين أخبر قريشا بمقدم النبي صلى الله عليه وسلم بالجيش عام الفتح ، وهَمَّ عمر بن الخطاب رضي الله عنه بقتله ، قال صلى الله عليه وسلم : ” إِنَّهُ قَد شَهِدَ بَدرًا ، وَمَا يُدرِيكَ ؟ لَعَلَّ اللَّهَ اطَّلَعَ عَلَى أَهلِ بَدرٍ فَقَالَ: اعمَلُوا مَا شِئتُم، فَقَد غَفَرتُ لَكُم.” رواه البخاري ومسلم\nوتلك أخبار لا ينسخها شيء. والله تعالى أعلم.\n\nأما فيما يخص معاوية ابن أبي سفيان رضي الله عنه:\nالجمع بين ” معاوية ابن أبي سفيان ” وابنه ” يزيد ” بحكم واحد هو خطأ كبير، وحكم جائر . فمعاوية صحابي جليل، يترضى عنه أهل السنَّة، ولم يحصل منه قتل لأهل البيت، ولا قتال لهم، بخلاف ابنه يزيد، فهو ليس صحابيّاً، وهو الذي كان في خلافته قتل الحسين رضي الله عنه ومن معه من أهله. ومن أهل السنة من يلعنه فضلا عن الشيعة.\n\nومن ذلك ما قد صح عن صالح بن أحمد بن حنبل رحمهما الله قال: قلت لأبي: إن قوما ينسبوننا إلى تولي يزيد! فقال: يا بني وهل يتولى يزيد أحد يؤمن بالله، ولم لا يلعن من لعنه الله في كتابه؟! فقلت: في أي آية؟ قال: في قوله تعالى: (فهل عسيتم إن توليتم أن تفسدوا في الأرض وتقطعوا أرحامكم). فهل يكون فساد أعظم من القتل؟ !\n\nفي الافادة الاحمدية لمريد السعادة الابدية لسيدي محمد الطيب السفياني رضي الله عنه، تقديم وتعليق الشيخ سيدي محمد الحافظ التجاني رضي الله عنه في حرف الياء -263-\n\nقال سيدنا احمد التجاني رضي الله عنه: يزيد بن معاوية ملعون لقوله تعالى (إن الذين يؤذون الله ورسوله لعنهم الله في الدنيا والآخرة وأعد لهم عذابا مهينا) ولقوله عز وجل فهل عسيتم إن توليتم أن تفسدوا في الأرض وتقطعوا أرحامكم. أولئك الذين لعنهم الله فأصمهم وأعمى أبصارهم). ولا إذاية له صلى الله عليه وسلم أعظم من قتل ولده وقطع رحمه صلى الله عليه وسلم وعلى آله.\n\nوعلق على ذلك الشيخ سيدي محمد الحافظ رضي الله عنه: لأنه فعل ما يستحق عليه الطرد، وقد ورد ذلك عن بعض الأئمة من السلف رضي الله عنهم، ويفعل الله ما يشاء. أه\n\nسئل عبد الله بن المبارك رحمه الله أيهما أفضل: معاوية بن أبي سفيان، أم عمر بن عبد العزيز؟ فقال: والله إن الغبار الذي دخل في أنف معاوية مع رسول الله صلى الله عليه وسلم أفضل من عمر بألف مرة، صلَّى معاوية خلف رسول الله صلى الله عليه وسلم، فقال: سمع الله لمن حمده، فقال معاوية: ربنا ولك الحمد، فما بعد هذا؟ ” وفيات الأعيان ” لابن خلكان.\nوعن الجراح الموصلي قال : سمعتُ رجلاً يسأل المعافى بن عمران فقال : يا أبا مسعود ؛ أين عمر بن عبد العزيز من معاوية بن أبي سفيان ؟ فرأيته غضب غضباً شديداً، وقال: لا يقاس بأصحاب محمد صلى الله عليه وسلم أحد، معاوية رضي الله عنه كاتبه وصاحبه وصهره وأمينه على وحيه عز وجل. ” الشريعة ” للآجري.\n\nوالحاصل ، علينا أن نعتقد أن معاوية رضي الله عنه ، صحابي جليل ، قد فتح على يديه وفي زمانه بلداناً ، ودخل بسبب ذلك في دين الله أفواج من الناس .\n\nو نختم بما نقله سيدي علي حرازم رضي الله عنه في “جواهر المعاني” عن سيدنا أحمد التجاني رضي الله عنه :\n” سألته رضي الله عنه عن تفضيل الصحابي الذي لم يفتح عليه عن القطب من غير الصحابة فأجاب : الراجح تفضيل الصحابي على القطب بشاهد قوله صلى الله عليه و سلم :” إن الله اصطفى أصحابي على سائر العالمين سوى النبيين و المرسلين” ، و قوله صلى الله عليه و سلم :” لَو أنفق أحدكم مثل أحد ذهبا ما بلغ مد أحدهم و لا نصيفه .” وهذا من شدة اعتناء الله بنبيه صلى الله عليه وسلم …”\nوقال سيدنا أحمد التجاني رضي الله عنه وفي موضع آخر من “جواهر المعاني”:\n\n“ كل واحد من الصحابة الذين بلّغوا الدين مكتوب في صحيفته جميع أعمال من بعده من وقته إلى هذه الأمة، فإذا فهم هذا ففضل الصحابة لا مطمع فيه لمن بعدهم… ثم ضرب مثلا رضي الله عنه لعمل الصحابة مع غيرهم: عملنا معهم كمشي النملة مع سرعة طيران القطاة ” -أي الصقرـ.\n\nفلنحسن الظن إذن بكل الصحابة رضي الله عنهم ومن بينهم الصحابي الجليل معاوية ابن أبي سفيان رضي الله تعالى عنه والله هو ولي التوفيق وصلى الله على سيدنا محمد وعلى آله وصحبه أجمعين وآخر دعوانا أن الحمد لله رب العالمين.\n\nوالسلام عليكم ورحمة الله وبركاته"}, {"q": "أريد أن أعرف العلاقة بين الشيعة أهل البيت والطريقة التجانية هل كان شيخ الطريقة شيعيا ؟وهل يجوز في التجانية أن تكون شيعيا؟ (أسئلة جمعناها لمدارها حول نفس الموضوع)", "a": "بسم الله و الحمد لله و الصلاة و السلام على رسول الله\nالسائل أو السائلة الكريمة،\nأما بالنسبة لسؤالك حول إن كان الشيخ أحمد التجاني قدس الله سره شيعيا\n\nفالجواب هو لا ، فهو سني المذهب بتغليب مالكي دون التقيد به ، و العلاقة التي تجمعه مع الشيعة هي استغراقه رضي الله عنه في محبة ساداتنا آل البيت رضي الله عنهم .\nورد في ” جواهر المعاني ” : ” ويحب أل البيت النبوي المحبة العظيمة ويودهم المودة الجسيمة ويهتم بأمورهم لا يزال حريصا إلى إيصال الخير إليهم ويضرع إلى الله فيما يصلحهم ويكرمهم الإكرام ويبر غاية بهم أشد البرور ويتواضع لهم أشد التواضع ويتأدب معهم أحسن الأدب وينصحهم ويذكرهم ويرشدهم إلى التخلق بأخلاق النبي صلى الله عليه وسلم والعمل بسنته، ويقول: الشرفاء أولى الناس بالإرث من رسول الله صلى الله عليه وسلم. ويحض على محبتهم، وتوقيرهم والتواضع لهم والأدب معهم، ويبين عظيم مجدهم ورفيع قدرهم، ويرى أن التواني في أمورهم ومحبتهم نقص في الإيمان ولا يحب من يناويهم، أو يباريهم أو يخل بالأدب معهم، ويشدد النكير على من فعل ذلك معهم رضي الله عنه وعنهم ومتعنا برضاه آمين .”.\nوقال العلامة سكيرج رضي الله عنه في أجوبته :”\n“وقد كان الشيخ رضي الله عنه في حب هذا الجانب، بما علت به مرتبته لأعلى المراتب، ورأى الناس من إخلاصه في موالاة آل البيت وصدق محبتهم قيد حياته ما بهر المتمسكين بحبل حبهم، فتنافسوا معه في المحبة فلم يدركوا شأوه. وقد كان يوصي أصحابه وأحبابه على تعظيم آل البيت والصدق في محبتهم في السر والعلانية بإخلاص نية، ويؤكد على الشرفاء في تعظيم بعضهم بعضا ويقول ما معناه : لا ينبغي للشريف أن يتهاون بحق الشريف، فإن العوام غير مخاطبين وحدهم بولائهم.“.\n\nبالنسبة للشطر الثاني من سؤالك : وهل يجوز في التجانية أن تكون شيعيا؟ :\nفهو سؤال نظري بالدرجة الأولى ، فمن الناحية النظرية شروط الطريقة معلومة للجميع ليس فيها وجوب التقيد بمذهب معين و إنما تُلَقَّنُ الطريقة التجانية لكل من طلبها من المسلمين ، ذَكَرا كان أو أنثى ، صغيرا أو كبيرا ، حُرّاً أو عبدا ، طائعا أو عاصيا ، بشرط أن يلتزم بشروطها ، وأن يَصْدُق الله على ما عاهد عليه.\nوكناقد طرحنا هذا السؤال شفويا على أحد كبار علماء الطريقة التجانية المرحوم سيدي إدريس العراقي رضي الله عنه فأجاب بما مضمونه:”\nليس هناك شرط في الطريقة التجانية يجبر المريد أن يكون تابعا لمدرسة أو لمذهب معين خاصة في الفقه أو أن يكون تابعا للمذهب السني أو الشيعي فكل واحد حر في اختياره، الاعتبار الوحيد في ذلك هو صحة العقيدة ، (لأن من بين من ينسبون أنفسهم الى الشيعة طوائف و أقليات ذات معتقدات منحرفة ومزورة مرفوضة من قبل الجميع).”\nلذلك فليس هناك مبرر للقول بأن كل الشيعة “ضالون” أو كلهم ” مهتدون “، كما هو الحال أيضا في بعض أدعياء التصوف في وقتنا الحالي ، فكل شيء منوط بصحة المعتقدات و الأفعال و موافقتها لأصول الدين و الشريعة .\nلذلك، يجب على المرء أن يدرك أن هذا الدين الحنيف هو دين الوسط و الاعتدال وإنها لمخاطرة كبيرة جدا أن نتبنى المواقف المتطرفة البعيدة عن الاحترام المتبادل.\nو أشد من ذلك خطرا الاشتراك في نقد أولئك الذين اختارهم الله لمرافقة نبيه صلى الله عليه وسلم سواء من أهله أو أصحابه ، قال الله تعالى : { لَقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمْ فَأَنْزَلَ السَّكِينَةَ عَلَيْهِمْ وَأَثَابَهُمْ فَتْحاً قَرِيباً} [الفتح ، 18 ]\nقال رسول الله صلى الله عليه وسلم :” الله الله في أصحابي لا تتخذوهم غرضا بعدي فمن أحبهم فبحبي أحبهم ومن أبغضهم فببغضي أبغضهم ومن آذاهم فقد آذاني ومن آذاني فقد آذى الله تبارك وتعالى ومن آذى الله فيوشك أن يأخذه .”\nقال تعالى: { إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنْكُمْ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تطهيرا } [ سورة الأحزاب ، 33 ]\nو قال رسول الله صلى الله عليه وسلم:” إِنِّي تَارِكٌ فِيكُمُ الثَّقَلَيْنِ : أَوَّلُهُمَا كِتَابُ اللَّهِ، فِيهِ الْهُدَى وَالنُّورُ ، مَنِ اسْتَمْسَكَ بِهِ وَأَخَذَ بِهِ كَانَ عَلَى الْهُدَى، وَمَنْ تَرَكَهُ وَأَخْطَأَهُ كَانَ عَلَى الضَّلالَةِ، وَأَهْلُ بَيْتِي أُذَكِّرْكُمُ اللَّهَ فِي أَهْلِ بَيْتِي ثَلاثَ مَرَّاتٍ .” .\nفليس هناك عاقل مهما كان مذهبه الذي ينتسب إليه سنيا أو شيعيا ممن يغامرون في هذا الميدان الخطر لتبرير رفضهم و نبذهم للطرف المقابل ما يستندون عليه من أقوال السلف الصالح وأفعالهم وهي أشياء بعيدة عن التربية النبوية المشرفة وهذه أمثلة على بعض المواقف المعتدلة من أعلام الشيعة و كتبهم .\nقال سيدنا علي بن أبي طالب كرم الله وجهه في نهج البلاغة : ” لقد رأيت أصحاب محمد صلى الله عليه وسلم، فما أرى أحداً يشبههم منكم لقد كانوا يصبحون شعثاً غبراً، وقد باتوا سجّداً وقياماً يراوحون بين جباهِهِم وخـدودهم ويقفون على مثل الجمر من ذكر معـادهم، كأن بين أعينهم رُكب المعزي من طول سجودهم، إذا ذكر الله هملت أعينهم حتى تبل جيوبهم، ومـادوا كمـا يميـد الشجـر يوم الريح العاصف، خـوفاً من العقاب ورجـاءً للثواب.”.\nو في “كشف الغمة في معرفة الأئمة”، أنه سئل الإمام أبو جعفر عن حليته السيف هل تجوز؟ فقال: “ نعم قد حلى أبو بكر الصديق سيفه بالفضة.”، فقال (السائل):” أتقول هذا؟” فوثب الإمام عن مكانه، فقال:” نعم، الصديق، نعم الصديق، فمن لم يقل له الصديق، فلا صدق الله قوله في الدنيا والآخرة“.\nقال الشيخ أبو جعفر محمد ابن علي بن بابويه القمي في رسالة الاعتقادات تحت عنوان : الاعتقاد في مبلغ القرآن : ” اعتقادنا ان القرآن الذي انزله الله تعالى على نبيه محمد صلى الله عليه وسلم و ما بين الدفتين وما في أيدي الناس ليس بأكثر من ذلك ومبلغ سوره عند الناس مائة وأربعة عشر سورة وعندنا والضحى وألم نشرح سورة واحدة ولإيلاف وألم تر كيف سورة واحدة ومن نسب إلينا أنا نقول أنه أكثر من ذلك فهو كاذب.”.\n\nو لهذا فنحن نحن نؤيد ما ورد ضمن البيان الختامي لمؤتمر القمة الإسلامي الأول بعمّان 1426/2005 وبمشاركة أكثر من مئة وسبعين عالماً من مختلف بلاد المسلمين ومن أتباع المذاهب الإسلامية الثمانية حيث أقر ممثلو أتباع هذه المذاهب بناءً على فتاوى جميع المراجع الدينية الإسلامية وأجمعوا على ما يلي:\n\nأولاً:\nإن كل من يتبع أحد المذاهب الأربعة من أهل السنة والجماعة (الحنفي، والمالكي، والشافعي، والحنبلي) والمذهبين الشيعيين (الجعفري والزيدي) والمذهب الأباضي والمذهب الظاهري فهو مسلم ولا يجوز تكفيره ويحرم دمه وعرضه وماله ولا يجوز أيضاً تكفير أصحاب العقيدة الأشعرية ومن يمارس التصوف الحقيقي وكذلك لا يجوز تكفير أصحاب الفكر السلفي الصحيح كما لا يجوز تكفير أي فئة أخرى من المسلمين تؤمن بالله سبحانه وتعالى وبرسوله صلى الله عليه وسلم وأركان الإيمان وتحترم أركان الإسلام ولا تنكر معلوماً من الدين بالضرورة.\nثانيا:\nإن ما يجمع بين المذاهب أكثر بكثير مما بينها من الاختلاف. فأصحاب المذاهب الثمانية متفقون على المبادئ الأساسية للإسلام فكلهم يؤمنون بالله سبحانه وتعالى واحداً أحداً وبأن القرآن الكريم كلام الله المنزل وسيدنا محمد عليه الصلاة والسلام نبياً ورسولاً للبشرية كافة وكلهم متفقون على أركان الإسلام الخمسة الشهادتين، والصلاة، والزكاة وصوم رمضان، وحج البيت وعلى أركان الإيمان ، الإيمان بالله، وملائكته وكتبه ورسله واليوم الآخر وبالقدر خيره وشره واختلاف العلماء من أصحاب المذاهب هو اختلافٌ في الفروع وليس في الأصول وهو رحمة وقديمًا قيل أن اختلاف العلماء في الرأي أمرٌ جيد.\nثالثا:\nإن الاعتراف بالمذاهب في الإسلام يعني الالتزام بمنهجية معينة في الفتاوى فلا يجوز لأحد أن يتصدى للإفتاء دون مؤهلات شخصية يحددها كل مذهب ولا يجوز الإفتاء دون التقيد بمنهجية المذهب ولا يجوز لأحد أن يدعي الاجتهاد ويستحدث مذهباً جديدًا أو يقدم فتاوى مرفوضةً تخرج المسلمين عن قواعد الشريعة وثوابتها وما استقر من مذاهبها."}, {"q": "علمت من موقعكم أن جوهرة الكمال لا تجوز من غير طهارة مائية فهل هي أفضل من تلاوة القرآن كلام الله و الصلاة التي هي ركن الإسلام …", "a": "الجواب على هذا السؤال على ثلاث وجوه\n\nالوجه الأول : الفرق بين الفضل و الأفضلية\nالمزية لا تعني الأفضلية\nفلم يقل أحد من أصحاب الطريقة أن جوهرة الكمال أو غيرها من أذكار الطريقة أفضل من أو تجزئ عن غيرها من العبادات كتلاوة القرآن و الصلاة فهناك فرق شاسع بين الفضل و الأفضلية\nفقد جاء في السنة مثلا كما ثبت في سنن الترمذي بإسناد صحيح عن أنس رضي الله عنه أن النبي صلى الله عليه وسلم قال: من صلى الفجر في جماعة، ثم قعد يذكر الله تعالى حتى تطلع الشمس، ثم صلى ركعتين، كانت له كأجر حجة وعمرة وهذا لا يعني بحال أنها تجزئ عن الحج و العمرة كما جاء في الصحيحين أن سورة الإخلاص تعدل ثلث القرآن\nو ما يدعيه بعض المنكرين زورا و بهتانا من أننا نقدمها و نفضلها على القرآن هو محض كذب و الدليل على ذلك مسطر في كتب الطريقة لمن أراد أن يراجعه و نذكر على سبيل المثال ما قال في جواهر المعاني\nثم قال سيدنا رضي الله عنه: “و هذا الفضل المذكور فيم دون الفرائض و أما هي فلا، لحديث” أي الأعمال أفضل يا رسول الله ؟” قال صلى الله عليه و سلم: ” الصلاة في أول مواقيتها\nكما قال أيضا\nأما تفضيل القرآن على جميع الكلام من الأذكار و الصلاة على النبي صلى الله عليه و سلم و غيره من الكلام فأمر اوضح من الشمس ،… و تفضيله من حيثيتين الاولى كونه كلام الذات المقدسة المتصفة بالعظمة و الجلال فهو في هذه المرتبة لا يوازيه كلام ، والثانية ما دل عليه من العلوم و المعارف و محاسن الآداب و طرق الهدى و مكارم الأخلاق و الأحكام الإلهية و الأوصاف العلية …\nو قال أيضا\nربما يطلع بعض القاصرين ومن لا علم له بسعة الفضل والكرم فيقول : إذا كان هذا كما ذكر فينبغي الاشتغال به أولى من كل ذكر حتى القرآن\nقلنا بل تلاوة القرآن أولى لأنها مطلوبة شرعا لأجل الفضل الذي ورد فيه ولكونه أساس الشريعة وبساط المعاملة الإلهية، ولما ورد في تركه من الوعيد الشديد، فلهذا لا يحلّ لقارئه ترك تلاوته\n\nو ما لم يقم شيء مقامه أفضل مما قام شيء مقامه بلا شك. ولو لم تكن الصلاة مقبولة الا بالوضوء وقراءة القرآن لا تجوز مع الحدث, لأدى ذلك الى ترك الصلاة عند فقد الماء مع أننا مأمورون باقامتها لوقتها فكيف يقتضي التفضيل مع حصول الفرق بينهما بأن هذه يقوم شيء مقامها وهو عشرون من صلاة الفاتح والصلاة والقرآن لا يقوم شيء مقامهما , وهذا الفرق يقتضي عكس ما يقول المعترض\n\nالوجه الثاني : من الناحية الشرعية\nفالطهارة المائية للصلاة على النبي صلى الله عليه و سلم ليست فرضا لكن إذا ما التزمتها و أوجبتها على نفسك صارت لازمة\nو لا تلقن جوهرة الكمال الا لمن التزم شروطها طوال حياته فأن أذكار الطريقة تؤخذ عن طريق النذر\nوالنذر: أن توجب على نفسك ما ليس بواجب لحدوث أمر أي هو ما أوجبه المكلف على نفسه من العبادات و أعمال البر مما لو لم يوجبه لم يلزمه\nوفى الحديث عن عائشة رضي الله عنها عن النبي صلى الله عليه و سلم : مَنْ نَذَرَ أَنْ يُطِيعَ اللَّهَ فَلْيُطِعْهُ وَمَنْ نَذَرَ أَنْ يَعْصِيَهُ فَلَا يَعْصِهِ\nقال تعالى والموفون بعهدهم\nوقال يوفون بالنذر\nو الطهارة كما هو معلوم من أعمال البر بلا اختلاف\nقال تعالى\nإن الله يحب التوابين ويحب المتطهرين\nو قال صلى الله عليه و سلم\nلا يحافظ على الوضوء إلا المؤمن، كما قال :الطهور شطر الإيمان\nوقد كره صلى الله عليه و سلم أن يذكر الله على غير طهر كما جاء في الحديث إِنِّي كَرِهْتُ أَنْ أَذْكُرَ اللَّهَ إِلا عَلَى طُهْرٍ\n\nالوجه الثالث : وهو من الناحية الروحية لعلها كانت تحتوي على سر أو فضل لا يدرك إلا بالطهارة المائية كما أشار إليه بعض أهل الطريقة و الله أعلم\n\nقال الشيخ سيدي أحمد بن العياشي سكيرج في رفع النقاب بعد كشف الحجاب عمن تلاقى مع الشيخ التجاني من الاصحاب، الربع1، ص125 سؤال: كيف لا تصح قراءة جوهرة الكمال بدون طهارة مائية؟: الجواب: جاء سيدي أحمد الصغير الشنجيطي عالم من علماء قطره و سأل عن قراءة جوهرة الكمال كيف لا تصح إلا بالطهارة المائية فقال له إن المشايخ يشترطون على تلاميذتهم في طريقهم ما شاؤوا كيف شاؤوا فقال له يا سيدي لم يرد نص من الشارع بأن لا يقر ذكرا إلا بالطهارة المائية فقال له و لكن قلنا لك إن المشايخ يشترطون ما شاؤوا على مريدهم و هذه دعوة في مقام الخاصة و دعوة الشارع في مقام التبليغ العام فإن اشترط الأولياء شيئا فلا حرج عليهم فيه"}, {"q": "السلام عليكم…. سؤالي حول الطريقة التجانية هو لماذا يقال أن من ترك الطريقة بعد أخذها هلك أو كفر رغم أنه لم يترك فرضا و لا واجبا في الدين أليس هذا رجما بالغيب ؟", "a": "بسم الله و الحمد لله و الصلاة و السلام على رسول الله و عليكم السلام و رحمة الله و بركاته أخينا العزيز …\nبالنسبة لسؤالك حول ترك الطريقة بعد أخذها فليس هناك أي رجم بالغيب في هذا الصدد\nصحيح أن الطريقة ليست فرضا أو واجبا في الدين لكن أورادها لا تلقن لطالبها إلا التزمها طوال حياته فتصبح واجبة كسائر النوافل المنذورة\nأخرج الطبري بسند صحيح عن قتادة في قوله تعالى (يوفون بالنذر) قال كانوا ينذرون طاعة الله من الصلاة والصيام والزكاة والحج والعمرة ومما افترض عليهم فسماهم الله أبرارا\nقال سيدي محمد الحافظ التجاني رضي الله عنه\nمداومة الورد الى الممات،قال تعالى “و يوفون بالنذر و يخافون يوما كان شره مستطيرا” فالأوراد اللازمة للطريقة لا تعطى إلا لمن التزمها طول حياته فتصبح واجبة كسائر العبادات المنذورة ،وحكمة نذر الأوراد أن يثاب عليه ثواب الفريضة ،و بهذه الوسيلة يكثر الثواب و يسهل القيام به والمداومة عليه، جاء في الحديث الشريف “ان أحب الأعمال الى الله أدومها وان قل رواه الشيخان. إنتهى\n\nعن عبد الله بن عمر بن العاص رضي الله عنهما قال : قال لي رسول الله : ( يا عبد الله لا تكن مثل فلان ، كان يقوم الليل فترك قيام الليل ) متفق عليه\nوفي هذا التحذير من ترك العمل الصالح بعد المداومة عليه، وهذا خطر عظيم، فإذا تركه لعذر وجب عليه القضاء\nهذا وهو لم ينذره فما بالك إذا كان قد التزمه ونذره على نفسه\nوقد مدح تعالى الذين يوفون بما عاهدوا الله عليه\nقال تعالى والْمُوفُونَ بِعَهْدِهِمْ\nوقال تعالى يوفون بالنذر\n\nوفي من أخلف قال\nفَأَعْقَبَهُمْ نِفَاقًا فِي قُلُوبِهِمْ إِلَى يَوْمِ يَلْقَوْنَهُ بِمَا أَخْلَفُواْ اللّهَ مَا وَعَدُوهُ وَبِمَا كَانُواْ يَكْذِبُونَ\nوقال تعالى فمن نكث فإنما ينكث على نفسه\n\nوقال تعالى:” يَاأَيُّهَا الَّذِينَ آَمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ(2) كَبُرَ مَقْتًا عِنْدَ اللَّهِ أَنْ تَقُولُوا مَا لَا تَفْعَلُونَ.الصف. والآيات في ذلك كثيرة\n\nفهذه الآيات توجب على كل من ألزم نفسه عملا من الطاعة والبر أن يفي به لأن من التزم شيئا لزمه شرعا وأصبح تركه كترك الفريضة ومن أصر على ذلك و داوم لاشك تحل عليه العقوبة ويأتيه الهلاك"}, {"q": "ما معنى أن سيدي أحمد التجاني رضي الله عنه هو خاتم الأولياء رغم أنه يوجد أولياء في عصرنا الحالي؟", "a": "حول هذا السؤال يجيب سيدي العربي بن السائح رضي الله عنه في كتابه “بغية المستفيد” حيث يقول:\n\n“معنى الختمية في هذا المقام هو أن لا يظهرَفيه أحدٌ بالكمال الذي ظهر به فيه هذا الختم رضي الله عنه ، و ليس المراد أنه لا ولي بعدَه لأن ذلك إنما هو معنى الختمية في مقام النبوة و الرسالة ، فإنه ختم على نبينا صلى الله عليه و سلم فلا نبي و لا رسول بعده ، و معنى الختمية فيه هو أن لا يظهر أحد في ذلك المقام بعده أصلا .وأما معنى الختمية في مقام الولاية الظاهرة والباطنة بقسميها فهو أن معناه أن لا يظهر أحد في ذلك المقام قبله ولا بعده بالظهور الذي ظهر به فيه من الكمال ”\n\nوقد قدم قبل هذا توضيحا لمعاني الختمية في الولاية حيث يقول رضي الله عنه :إذ الولاية من حيث هي على قسمين ظاهرة و باطنة ، فالظاهرة لأهل الأمر و التصريف الظاهر وهي معروفة ، وهذه الولاية تختم على الإمام العدل المسمى المنتظر (المهدي) الذي يظهره الله آخر هذه الأمة حسبما هو مشهور من خبره .و الباطنة لأهل التصريف الباطن وهذه الباطنة تنقسم إلى قسمين أيضا عامة وخاصة فالعامة من آدم إلى سيدنا عيسى عليه السلام و عليه تختم حين ينزل في آخر الزمان. و الخاصة (في امّتنا المحمدية) هي من نبينا صلى الله عليه و سلم الى الختم الأكبر الذي يختم عليه مقامها و ينتهي اليه مرامها و الأقطاب المخصوصون بإدراك مقام ختم القطبانية هم أهل الولاية الباطنة الخاصة ، و يسمى كل واحد ممن بلغ مقام الختمية بمعنى من المعاني المتقدمة بالختم و بالخاتم كذلك .فالختم بالمعنى الأول هو الذي بلغ الرتبة العليا من القطبانية ، لكن في زمانه خاصة ، لأن القطب من حيث هو واحد في زمانه ، و على هذا فلا اشكال في قول من قال ان لكل زمان ختما ‘ الا أنه ليس المراد انه لا يخلو زمان عنه و الا لزم ان يدرك كل واحد من الأقطاب هذه الدرجة ، بل المراد انه يتعدد وجود من يبلغ هذه الدرجة في الأقطاب بمعنى انه يأتي على رأس كل مدة من يصل ذلك المقام كما ورد في المجدد من انه يكون على رأس كل مائة سنة …و الختم بالمعنى الثاني هو الإمام الذي يبعثه الله في آخر الزمان حكما عدلا واحد في الزمان بلا شك عند القائل به ، و عليه أهل الكشف رضي الله عنهم و الختم بالمعنى الثالث هو الذي تختم عليه الولاية العامة الباطنة ، فهو واحد كذلك أيضا وهو سيدنا عيسى عليه السلام و أما الختم الأكبر الذي هو ختم الولاية المحمدية(سيدنا أبو العباس أحمد ابن محمد التجاني رضي الله عنه) فهو واحد ايضا في الزمان لا يكون منه الا واحد من عصر النبي صلى الله عليه و سلم اليه ، يختم به الله الولاية المحمدية ، اعني الباطنة … و معنى الختم في هذا المقام انه لا يظهر بكمال الظهور الذي ظهر به فيه أحد قبله و لا بعده …و من علاماته أنه يحقق مواجيد الأولياء كلهم و يختص عنهم بوجده كما حقق خاتم الأنبياء مواجيد الأنبياء كلهم واختص عنهم بخصوصيته …….و قد ذكر هذا الختم غير واحد من الأئمة الكبار رضي الله عنهم …… كالحاتمي و الشاذلي رضي الله عنهما و الإمام المحدث الصوفي أبو عبد الله محمد الترمذي الحكيم ……أما الشيخ محيي الدين رضي الله عنه فذكره في عدة مواضع من كتاب الفتوحات المكية وألف فيه بالخصوص كتابه الذي سماه عنقاء مغرب في شمس الأولياء وختم المغرب ….وكذلك الشعراني رضي الله عنه في اليواقيت والجواهر وفي الطبقات وغيرهما .إهـ و من كلام سيدي أبا العباس أحمد التجاني رضي الله عنه عن حقيقة القطبانية قوله :” القطبانية هي الخلافة العظمى عن الحق تبارك و تعالى مطلقا في جميع الوجود جملة و تفصيلا …” والأقطاب متفاوتون في هذا وأكملهم درجة هو من بلغ الرتبة العليا المسماة بختم المقامات ، ولم يرتقه منهم إلا القليل لبعد مرامه ، و أعلاهم هو الختم الأكبر الذي هو ختم الولاية المحمدية يختم به الله الولاية المحمدية الباطنة كما نبه رضي الله عنه أن سيد الوجود صلى الله عليه و سلم أخبره يقظة بأنه هو الخاتم المحمدي المعروف و بأن مقامه لا مقام فوقه في بساط المعرفة بالله ، و هذا الختم هو المتلقي لجميع ما يفاض من ذوات الأنبياء عليهم السلام من الإمداد وهو المفيض على جميع الأولياء وإن لم يعلموا به إلى غير ذلك من فضائله العظام .إهـ\n\nوفي كتاب قاموس المصطلح الصوفي لأيمن حمدي التجاني : قد يتصور البعض أن الختمية تعني أنه ثم ولي خاتم ليس بعده ولي وهذا أول ما يجب نفيه ، فالإمام المهدي رضي الله عنه يختم به الله الولاية العامة آخر الزمان ولا يستطيع مسلم أن يقول أن الولاية تنتهي عند فلان فمدد الله لا ينقطع عند أوليائه إلى يوم الدين كذا يبعث الله تعالى عيسى عليه السلام وليا ليحكم بشريعة نبينا صلى الله عليه وسلم ويختم الولاية المطلقة ……وربما يبني البعض تصورهم على كون رسول الله صلى الله عليه وسلم ختم النبوة والرسالة فيظن أنها ختمية زمانية حاشا لله أن يتطرق لعقيدة المسلم مثل هذا الظن . فقد قال صلى الله عليه وسلم {إني عند الله في أم الكتاب لخاتم النبيئين وإن آدم لمنجدل في طينته }رواه الإمام أحمد في مسنده والحاكم والبيهقي فهو صلى الله عليه وسلم النبي الجامع لمشارب الأنبياء والمرسلين لذا قال : {والذي نفسي بيده لو أن موسى كان حيا ما وسعه إلا أن يتبعني }رواه الامام أحمد في مسنده ومن هنا يتضح أن الختم هو الجامع للأمر كله ختامه وإبتداءه.إهـ\n\nوفي الدرة الخريدة شرح الياقوتة الفريدة لسيدي النظيفي رضي الله عنه عند قوله : به ختم المولى كمال الولاية ما نصه : {ختم }يقال ختم الشيء بلغ غايته ونهايته إهـ\n\nوفي كتاب رماح حزب الرحيم على نحور حزب الرجيم لسيدي عمر الفوتي رضي الله عنه الباب السادس والثلاثون قال : قد أخبرني شيخي وسيدي محمد الغالي أبو طالب الشريف الحسني وأنا معه في المدينة المنورة على ساكنها أفضل الصلاة وأزكى السلام : إن الشيخ { أي سيدي أحمد التجاني }رضي الله عنه وأرضاه وعنا به قال ذات ليلة في مجلسه أين السيد محمد الغالي فجعل أصحابه ينادون أين السيد محمد الغالي على عادة الناس مع الكبير إذا نادى أحدا فلما حضر بين يدي الشيخ قال رضي الله عنه وأرضاه وعنا به : قدماي هاتان على رقبة كل ولي لله تعالى ، وقال سيدي محمد الغالي وكان لا يخافه لأنه من أكابر أحبابه وأمرائهم ياسيدي أنت في الصحو والبقاء أو في السكر والفناء فقال رضي الله عنه وأرضاه وعنا به أنا في الصحو والبقاء وكمال العقل ولله الحمد وقال قلت : ما تقول بقول سيدي عبد القادر رضي الله عنه قدمي هذه على رقبة كل ولي لله تعالى فقال صدق رضي الله عنه يعني أهل عصره وأما أنا فأقول قدماي هاتان على رقبة كل ولي لله تعالى من لدن آدم إلى النفخ في الصور قال فقلت له ياسيدي فكيف تقول إذا قال أحد بعدك مثل ما قلت فقال رضي الله عنه وأرضاه وعنا به لا يقوله أحد بعدي قال فقلت له يا سيدي قد حجرت على الله تعالى واسعا ألم يكن الله تعالى قادرا على أن يفتح على ولي فيعطيه من الفيوضات والتجليات والمنح والمقامات والمعارف والعلوم والأسرار والترقيات والأحوال أكثر مما أعطاك فقال رضي الله عنه وأرضاه وعنا به : بلى قادر على ذلك وأكثر منه لكن لا يفعله لأنه لم يرده ألم يكن قادرا على أن ينبيء أحدا ويرسله إلى الخلق ويعطيه أكثر مما أعطى محمدا صلى الله عليه وسلم قال قلت بلى لكنه تعالى لا يفعله لأنه ما أراده في الأزل فقال رضي الله عنه وأرضاه وعنا به وهذا مثل ذلك ما أراد في الأزل ولم يسبق به علمه تعالى .إهـ\n\nوقال العلامة سكيرج في : وقد أعرب الشيخ التجاني رضي الله عنه عن ولايته المحمدية وقطبانيته وختميته وكتميته فلم يبق إلا تصديق المعتقد لما أخبر به عن نفسه اقتداءا بالنبي صلى الله عليه وسلم في قوله أنا النبي لا كذب حيث أعرب عن نفسه فصدقه من أراد الله سعادتهم وأما المنتقد المكذب فلا كلام لنا معه .إهـ\n\nوفي كتاب عنقاء لإبن العربي الحاتمي قال فيه : سألت الله أن أجتمع بخاتم الأولياء فأجابني واجتمعت به اجتماعا روحانيا منزها عن الوقت والزمان وكان ذلك بمدينة فاس ورأيت العلامة التي أخفاها الله تعالى فيه عن عباده وكشفها لي حتى رأيت خاتم الولاية المحمدية منه ورأيته مبتلى بالإنكار عليه لما يتحقق به في سره من العلوم اللدنية وكان ذلك سنة 595هـ وكنيته أبو العباس وأنه مكتوم الإسم عنهم أي أنه مكتوم لا يعرفه الأولياء ولا يشمون له رائحة أصلا رغم إيمانهم بوجود المقام .إهـ"}, {"q": "اريد ان اطرح عليكم سؤالا ما معنى استخدام الرداء الابيض في الطريقة التجانية ارجو ان تسرعوا في الاجابة جزاكم الله خيرا", "a": "أخي الكريم\n\nبالنسبة لسؤالك حول نشر الرداء الأبيض في الوظيفة\n\nيجب العلم أولا ان هذا ليس من شروط الذكر بل من مستحباته\n\nوأصله كما ورد في كتاب ” كشف الحجاب ” لسيدي الحاج احمد سكيرج انه قبل انشاء الزاوية كانت الوظيفة تقرأ بباب دار الشيخ احمد التجاني رضي الله عنه وهو حاضر معهم ، لكن حيث كان المكان محل توارد الناس للزيارة و المرور أمر بنشر ثوب يعم البقعة كلها اي وسط الحلقة ، و يكون محقق الطهارة ثم يطوى و يصان الى المرة القادمة\nثم بعد انشاء الزاوية استمر الاخوان على ذلك العمل بمرأى و مسمع من الشيخ رضي الله عنه لاستحسانهم له لما فيه من الادب الخاص و لأنه معين على الحضور… ثم تتابع الناس في سائر الأقطار على هذا العمل الا القليل النادر\n\nجاء في “الفتح الرباني”\nورد في اقوال السادة الصوفية انه ينبغي تعظيم محل الذكر و المبالغة في طهارته ووضع الطيب فيه\nو قال في البغية ، قال في شرح الحسن، و جاء عن الامام الجليل ابي ميسرة رضي الله عنه قال لا يذكر الله الا في مكان طيب\nو نقل صاحب تهذيب الاذكار : ينبغي تطييب المجلس بالرائحة الطيبة لاجل الملائكة و الجن وقطع العلائق المشوشة\nوهل لنشر الازار معنى الا التعظيم للذكر و المبالغة في النظافة الى ان قال العلماء بأنها مستحبة\n\nيقول الشيخ محمد الحافظ المصري رضي لله عنه في كتابه قصد السبيل في الطريقة التجانية : ومن شروط الكمال فيها {أي جوهرة الكمال} نشر ثوب أبيض محقق الطهارة عند السابعة وليس هذا لأن النبي صلى الله عليه وسلم يجلس عليه كما يظن بعض الجهلاء بل هو لأنه يحسن بالذاكرين أن يكونوا على أحسن حال وقد جرب أن الجلوس في أمكنة طاهرة رحبة مع كمال الطهارة من أسباب حصول الصفاء .إنتهى\nويقول العارف بالله سيدي العربي ابن السائح رضي الله عنه في البغية : أن ما استمر عليه عمل أصحاب سيدنا الشيخ رضي الله عنه من نشر الثوب محقق الطهارة عند قراءة جوهرة الكمال في الوظيفة من عهد الشيخ رضي الله عنه إلى الآن ليس بلازم في الطريق بحيث يسوغ ذكرها إلا معه وإن كان المحل طاهرا حكما لكنه مما ينبغي ويستحب لمكان الخاصية التي اختصت بها هذه الصلاة الشريفة عن غيرها من الأذكار وهي حضور النبي صلى الله عليه وسلم والخلفاء الأربعة والأصل فيه عندنا خصوصا على ما حدثني به السيد الجليل الحاج الأبر الفاضل الناسك سيدي عبد الوهاب بن التاودي أحد خاصة أصحاب سيدنا رضي الله عنه وخزانة أسراره وورثة أنواره قدس الله سره وأعاد علينا من بركاته وهو أنهم كانوا يقرؤون الوظيفة في أول الأمر قبل إنشاء الزاوية بفاس بباب دار الشيخ رضي الله عنه وهو حاضر معهم رضي الله عنه وكانت البقعة طاهرة حكما يصلي رضي الله عنه بها مع جماعة من أصحابه لكن حيث كان المحل محل توارد الناس عليه للزيارة وممر الداخل للدار والخارج منها أمر رضي الله عنه بنشر ثوب يعم البقعة كلها أعني وسط الحلقة ويكون محقق الطهارة غير مكتفى فيه بالطهارة الحكمية بحيث لا ينشر إلا عند قراءة الأصحاب لجوهرة الكمال ثم يطوى ويصان إلى مثل ذلك الوقت ثم بعد نشء الزاوية استمر الإخوان على ذلك العمل بمرأى ومسمع من الشيخ رضي الله عنه لاستحسانهم له لما فيه من الأدب الخاص مع هذا الحضور الخاص ولأنه مشعر به ومعين على الحضور والتأدب الواجب فيه ثم تتابع الناس في سائر أقطار الأرض على هذا العمل إلا النادر منهم ممن لم يتبين وجهه ومن أجل هذا تعسف بعض من ينتسب للعلم في البحث فيه وأفرغ ذلك في قوالب من الألفاظ بشيعة تنادي عليه عند كل مؤمن منصف بالفضيحة الفظيعة وتسمه بكل ذميمة شنيعة لأن كل مؤمن منصف بمجرد ما يسمع ذلك المقال يعلم تحقيقا أنه مقال من قطع الحسد منه الأحشاء والأوصال …..هذا وقد عرف ما قاله العلماء حسبما في عدة الحصن الحصين وشرحه من أنه ينبغي أن يكون المكان الذي يذكرالله فيه نظيفا خاليا قالوا فإنه أعظم في احترام الذكر والمذكور ولهذا مدح الذكر في المساجد والمواضع الشريفة ولا معنى للنظافة إلا المبالغة في التطهير وتحصيل القدر الزائد على الطهارة الحكمية كما لا يخفى .قال في شرح الحصن : وجاء عن الامام الجليل أبي ميسرة رضي الله عنه قال ك لا يذكر الله تعالى إلا في مكان طيب إهـ ونقل عن صاحب تهذيب الأذكار : ينبغي تطييب المجلس بالرائحة الطيبة لأجل الملائكة والجن وقطع العلائق المشوشة إلخ ….فأنت ترى ما قاله العلماء رضي الله عنهم في آداب الذكر على الإطلاق فكيف ينكر على من أكد هذه الآداب أو بعضها في ذكر الله تعالى وأسمائه الحسنى وصفاته العلى وذكر الحبيب الأعظم ومدحه والثناء عليه ببعض أوصافه الكمالية ونعوته الجمالية والجلالية ……وهل لنشر الثوب المذكور معنى إلا المبالغة في النظافة التي نص العلماء على أنها مستحبة وأنها أعظم في احترام الذكر والمذكور وهل المتعسف بالبحث في ذلك بعدما تقرر عن العلماء فيه من الإستحباب إلا من أكبر الجهلة الأغمار وممن سجل عليه بالشقاء لمحاربته مولاه جل وعلا بمعاداة أوليائه الأبرار.إنتهى\nويقول العلامة مْحمد بن محمد كنون في كتابه حل الأقفال لقراء جوهرة الكمال : التنبيه الخامس : من شروط الصحة لقراءة الجوهرة الطهارة المائية فلا تكفي الترابية لمن كان من أهلها لعدم الماء أو لعدم القدرة على استعماله وطهارة البدن والثياب والمكان الذي يسع ستة ولا تقرأ على ظهر الدابة ولا على ظهر السفينة ويستحب زيادة على ذلك نشر ثوب محقق الطهارة مبالغة في النظافة فقد ذكر العلماء أنه ينبغي أن يكون المجلس مطيبا بالروائح الطيبة ولا سيما ذكر يحضره النبي صلى الله عليه وسلم ، وقد بسط صلى الله عليه وسلم رداءه لأخته من الرضاعة حين جاءت في وفد هوازن كما قال في الهمزية :\nبسط المصطفى لها من رداء أي فضل حواه ذاك الرداء\nوكذا بسطه أيضا لدحية الكلبي لما جاءه يريد الإسلام فبكى دحية وقبل الرداء ووضعه على رأسه وعينيه كما في روح البيان {وهو كتاب للشيخ إسماعيل حقي البرسوي } وقد ثبت عن أبي بكر الصديق رضي الله عنه أنه كان ينشر ثوبه للملائكة . وكان إبراهيم بن أدهم رضي الله عنه يقول بلغنا أن عثمان بن عفان رضي الله عنه كان يفرش رداءه للملائكة على باب الخلاء ويقول اجلسوا هاهنا حتى أخرج إليكم . فإذا كان هذا في حضور الملائكة فكيف مع حضوره صلى الله عليه وسلم بل لو فرش الإنسان حينئذ جبينه أو قلبه أو مقلته لحقّ له ذلك .\nلو علمنا مجيئكـــــم لفرشنا مهج القلب أو سواد العيون\nوجعلنا فوق الجفون طريقا ليكون المرور فوق الجفون\nعلى أنه لو فرضنا عدم حضوره صلى الله عليه وسلم يكون نشر الثوب كتبخير مجلس الذكر وتطييبه لمن
