<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--bd:#000;--soft:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#999;--bd:#fff;--soft:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#999;--bd:#fff;--soft:#161616;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.9;font-size:var(--fs,18px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:10px 14px}
header h1{font-size:1.05rem;margin:0;flex:1;cursor:pointer}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover,button.on{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.35;pointer-events:none}
#bar{position:fixed;top:0;right:0;height:3px;background:var(--fg);width:0;z-index:9}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
input{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chips button{white-space:nowrap;border-radius:99px}
.card{display:block;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer;background:var(--bg);color:var(--fg);text-decoration:none}
.card:hover{background:var(--soft)}
.card b{display:block}
.meta{color:var(--mut);font-size:.8rem}
.box{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
.box p{margin:.6em 0}
.box p:first-child{margin-top:0}
.box p:last-child{margin-bottom:0}
.q{background:var(--soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
nav.pn{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav.pn button{flex:1}
#top{position:fixed;left:14px;bottom:80px;border-radius:50%;width:44px;height:44px;padding:0;display:none}
.hide{display:none!important}
</style>

<script>
const C={85:'الزواج',86:'الطلاق',78:'الزكاة',81:'الصدقات',82:'المعاملات',83:'مسائل متنوعة',87:'متفرقات',84:'الأطفال',79:'الصيام',77:'الصلاة',76:'الطهارة'};
const D=[{"id":4846,"c":85,"d":"2026-10-04","t":"الزواج بعد الزنا: التوبة ومدة الاستبراء قبل عقد النكاح على المذهب المالكي","q":"السلام عليكم،\n\nأود الحصول، إن أمكن، على جواب دقيق وفق رأي المرجع في المذهب المالكي.\n\nخطيبي وأنا كلانا أعزب وقد ارتكبنا الزنا قبل زواجنا. نريد أن نتوب توبة صادقة، ونقطع العلاقات المحرمة نهائياً، ونتزوج معاً. أنا واعية بخطورة هذا الذنب وبوجوب التوبة؛ سؤالي يتعلق تحديداً بالمدة التي يجب احترامها قبل عقد النكاح.\n\nكان آخر جماع لنا بتاريخ 07/08/26. ولم يحدث أي جماع آخر منذ ذلك الحين\nمنذ ذلك الجماع الأخير، جاءتني حيضتان كاملتان. ولست حاملاً على حد علمي. زواجنا المدني مقرر في بداية نوفمبر 2026 وعقد النكاح في نفس اليوم\n\nلقد وجدت جوابين مختلفين: بعض العلماء يتحدثون عن حيضة واحدة للاستبراء، بينما يبدو أن الموقف الكلاسيكي المالكي يطلب ثلاثاً.\n\nهل يمكنكم توضيح ما يلي:\n\nفي حالتنا، هل يجب الانتظار حيضة واحدة أم ثلاث حيضات قبل عقد النكاح؟\n\nهل كون الزواج من نفس الرجل الذي ارتُكب معه الزنا يغير الحكم؟\n\nهل تبدأ المدة من الجماع الأخير أم فقط من لحظة التوبة الصادقة؟\n\nهل يمكن احتساب الحيضات التي مرت منذ الجماع الأخير؟\n\nخلال هذه المدة، هل يجب قطع كل اتصال بشكل مطلق أم فقط الجماع والتصرفات المحرمة، مع الاحتفاظ بتبادلات منظمة للتحضير للزواج؟\n\nهل رأي الحيضة الواحدة رأي صحيح يمكننا اتباعه في حالتنا؟\n\nأنا لا أبحث ببساطة عن أسهل رأي، بل أريد أن أعرف تحديداً أي قاعدة يجب احترامها حتى يكون عقد نكاحنا صحيحاً. إن أمكن، هل يمكنكم أيضاً ذكر المرجع المالكي الذي يستند إليه جوابكم؟\n\nبارك الله فيكم على وقتكم وعلى السرية.","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nبسم الله، الحمد لله، والصلاة والسلام على رسول الله.\n\nوبعد،\n\nالزنا معصية وذنب عظيم. وهو من الكبائر التي حرمها الشرع الإسلامي.\n\nقال الله تعالى: «وَلَا تَقْرَبُوا الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا»\n\nمن ارتكب هذا الذنب عليه أن يتوب توبة صادقة.\n\nإذا وقع -لا قدر الله- شخص في هذه الفاحشة وارتكب الزنا مع امرأة، ثم أراد بعد ذلك الزواج بها، فإن العلماء يشترطون التوبة الصادقة. ويجب أن تتحقق فعلاً، بشروطها وأركانها: الندم على الذنب، والإقلاع عنه فوراً، والعزم الصادق على عدم العودة إليه مستقبلاً.\n\nوفي هذه الحالة، يشترط العلماء أيضاً الاستبراء، أي الانتظار للتأكد من أن المرأة ليست حاملاً. وقد اختلفوا في مدته: عند الحنابلة، الاستبراء حيضة واحدة، بينما عند المالكية، ثلاث حيضات أو ثلاثة أشهر.\n\nوعليه، نقول للسائلة الكريمة: إذا كانت قادرة على الانتظار حتى الحيضة الثالثة ولم يسبب لها ذلك أي صعوبة فيما يتعلق بموعد الزواج المدني، فالأفضل أن تفعل ذلك.\n\nأما إذا ترتب على ذلك مشقة أو ضرر، فتكفي حيضة واحدة أو حيضتان.\n\nخلال هذه المدة، بالطبع، يجب على الطرفين الامتناع عن كل شكل من أشكال الاتصال الجسدي المباشر. أما التواصل الكلامي من أجل التحضير للزواج فلا مانع منه، لأن الطرفين قد تابا إلى الله، وأصلحا حالهما، ورتبا وضعهما بإذن الله. وقد اتفقا على بداية جديدة وعلى الانطلاق على أسس سليمة، أي زواج ديني يحترم شروطه وأركانه.\n\nفلا يُمنع إذن أن... [نهاية الجواب مقطوعة في المصدر الفرنسي]"},{"id":4845,"c":78,"d":"2026-10-04","t":"الأموال المدخرة في صندوق التقاعد","q":"السلام عليكم الشيخ\nأطلب رأيكم في هذه المسألة.\nمنذ زمن بعيد، وبسبب الجهل، اشتركت في خطة ادخار للتقاعد. كل شهر، يُحوَّل 30 يورو من راتبي إلى هذا الحساب وهذا المال مجمد حتى التقاعد. من المستحيل إلغاؤه واسترداد هذه الأموال قبل ذلك.\nلم أكن أطرح أبداً سؤال وجوب دفع الزكاة على هذا المبلغ حتى وقت قريب. لقد فهمت أنها واجبة على هذا المال. لكن هذا المال غير قابل للوصول إليه. يقول البعض إنه في هذه الحالة يمكن الانتظار حتى تُفرَج عن هذه الأموال (عند التقاعد) ودفع الزكاة في ذلك الوقت، إما مرة واحدة أو عن كل سنة مضت حسب المذاهب.\nهل يمكنكم توضيح هذا لي من فضلكم؟\nأنا مالكية.\nجزاكم الله خيراً","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nبسم الله. الحمد لله، والصلاة والسلام على رسول الله، سيدنا محمد وعلى آله وأصحابه.\nإذا كان هذا الادخار اختيارياً وللشخص الحق في استعمال هذا المال متى شاء، أي يمكنه سحبه والتصرف فيه، فهو مال مدخر تجب فيه الزكاة، بشرط تحقق شروطها، لا سيما مرور الحول (سنة قمرية) وبلوغ النصاب.\nأما إذا كان هذا الادخار إلزامياً والشخص لا يستطيع سحب هذا المال ولا التصرف فيه بحرية، فلا زكاة على هذا المال، لأن من شروط وجوب الزكاة الملك التام.\nفلا يعتبر هذا الشخص مالكاً لهذا المال ملكاً كاملاً. وعلى رأي جمهور العلماء، لا زكاة واجبة على هذا المال حتى وقت التقاعد، عندما يصبح ملكاً له ملكاً تاماً، وفق الشروط المتفق عليها.\nومنذ لحظة استلامه الفعلي لهذا المال، تصبح الزكاة واجبة إذا بلغ النصاب بالطبع.\nهل تُدفع الزكاة عن سنة واحدة أم عن كل السنوات؟\nعلى رأي الإمام مالك، تُدفع الزكاة مرة واحدة.\nوعلى رأي علماء آخرين، يجب دفعها عن كل السنوات التي بقي فيها المال فوق النصاب.\nوالله أعلم."},{"id":4777,"c":76,"d":"2026-06-21","t":"النزيف تحت حبوب منع الحمل","q":"السلام عليكم،\n\nلدي سؤال بخصوص موضوع يشغلني حالياً. آخذ حبوب منع الحمل منذ حوالي سنتين. هذه الحبوب توقف الإباضة لدي وتنظم دورتي هرمونياً. لدي نزيف كل شهر، يُسمى طبياً نزيف الانسحاب.\n\nومع ذلك، أردت أن أعرف هل يُعتبر هذا النزيف حيضاً. هل يجب احتسابه عند حساب، على سبيل المثال، مدة العدة من أجل الزواج مجدداً؟ أم يجب بالأحرى انتظار عودة الدورة الطبيعية «الحقيقية»، مع العلم أن ذلك قد يستغرق بعض الوقت (بضعة أشهر) قبل أن ينتظم الجسم وأن تتمكن المرأة من إتمام فترة الانتظار؟\n\nهل يمكنكم تأكيد ذلك لي؟\n\nأشكركم مقدماً على مساعدتكم.","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nبسم الله، الحمد لله، والصلاة والسلام على رسول الله.\n\nهذه الحالة تخص النساء اللواتي يأخذن حبوب منع الحمل. قد يحدث أن يظهر عندهن نزيف. وقد درس العلماء هذا النوع من النزيف لتحديد ما إذا كان يجب اعتباره حيضاً أم لا.\n\nأولاً، يجب أخذ المدة في الاعتبار. إذا ظهر هذا الدم أو هذا النزيف بعد 15 يوماً من الطهر من الحيض، يُعتبر حيضاً، لأن أدنى مدة للطهر بين فترتي الحيض هي 15 يوماً. وهكذا، عندما تطهر المرأة من حيضها وتعود إلى حالتها المعتادة، إذا عاد الدم بعد 15 يوماً، يُعتبر حيضاً. أما إذا ظهر قبل انقضاء 15 يوماً، فلا يُعتبر حيضاً.\n\nوهذه هي القاعدة المطبقة على النساء اللواتي يظهر عندهن نزيف غير طبيعي أو غير منتظم.\n\nثانياً، هناك معيار آخر: المرأة تعرف عادةً خصائص دم حيضها. فيجب إذن النظر هل يحمل هذا الدم خصائص الحيض، لا سيما فيما يتعلق بلونه ورائحته وغيرها من الخصائص.\n\nفإذا كان الدم يحمل خصائص دم الحيض، حُكم عليه بأنه دم حيض.\n\nوعليه، وبناءً على ما سبق، إذا كانت المرأة مطلقة، فتحتسب ثلاث فترات حيض (أقراء) لعدتها. كل دورة مكونة من فترة حيض تليها فترة طهر تشكل قرءاً.\n\nوالله أعلم."},{"id":4776,"c":87,"d":"2026-06-21","t":"غرامات النقل","q":"السلام عليكم،\nلقد تهربت من دفع تذاكر النقل لسنوات لأنه لم تكن لدي وسائل لشراء تذكرة نقل وفي ذلك الوقت كنت أذهب إلى المدرسة أو إلى مواعيد المساعدات المالية.\nعليّ غرامات ولا أملك الوسائل لدفعها، ماذا أفعل من فضلكم؟ أنا مدينة بمبلغ كبير. لكن لا أملك حتى ما أشتري به تذكرة.\nشكراً","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nبسم الله، الحمد لله، والصلاة والسلام على رسول الله.\n\nالغرامة دين تجاه الدولة، أو تجاه الشركة، أو تجاه الجهات المعنية. فهي إذن قانوناً تشكل ديناً.\n\nأما بخصوص كيفية التصرف، فتدفعون حسب قدراتكم. في الواقع، يجب النظر في المسألة مع الجهة المعنية: فهي تدرس معكم طريقة للدفع أو جدولاً للتقسيط.\nومن الناحية الدينية، إذا طالبتكم هذه الجهة أو هذه الشركة، فعليكم الدفع حسب وسائلكم.\n\nوالله أعلم."},{"id":4775,"c":85,"d":"2026-06-21","t":"هل يمكن للأخ الوصي منع أخته من الزواج دون سبب وجيه؟","q":"السلام عليكم،\nعمري 31 سنة وأريد الزواج قريباً إن شاء الله.\nجاء أخ مباشرة لطلب يدي لدى عائلتي بالقلب، حيث رآني. بعد ذلك، طلبت منه العائلة تحديد موعد الزواج المدني مباشرة للتقدم (من بين أمور أخرى للتأكد من حسن نيته). وهذا ما فعلناه. والموعد محدد في 26 يونيو المقبل إن شاء الله. فأخبرت أخي الوحيد من أبي وأمي أنني أريد الزواج. (توفي والداي رحمهما الله وأعيش وحدي منذ وفاتهما، أي منذ أكثر من 7 سنوات). لم ينفق عليّ أبداً ولا حافظ على أي رابط جسدي أو عاطفي معي منذ وفاة والديّ.\nلا يريد تزويجي في الوقت الحالي دون سبب وجيه رغم أنني وجدت له عدة حلول.\nوبما أنه غير متاح لتزويجي، طلبت منه أن يسلم المهمة لعمي من جهة الأب. فرفض.\nكما يقول لي إن الزواج المدني لا يجب أن يتم قبل الزواج الديني، وإلا سيشكل ذلك خطأً جسيماً وسيعارض الزواج بالتأكيد.\nويقول لي أيضاً إنه إذا رفض تزويجي فسأبقى معلقة ولن أستطيع الزواج طوال حياتي.\nأطلب منكم توضيح هذه الحالة لي من فضلكم، أنا تائهة…","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nبسم الله، الحمد لله، والصلاة والسلام على رسول الله.\nقبل الإجابة على السؤال، نود أن نعرف هل هذه الأخت، التي توفي والداها، ليس لديها إلا هذا الأخ أم لديها أيضاً إخوة آخرون أو أقارب ذكور يمكنهم ممارسة الولاية. ما هي الأسباب التي تدفع هذا الأخ إلى عدم رغبته في تحمل هذه المسؤولية؟\n\nففي غياب الوالدين، يكون الأخ الشقيق عادةً وليها. ومع ذلك، هل لديه مبرر شرعي وجيه للتصرف هكذا؟ هل لديه اعتراض حقيقي بخصوص اختيار الزوج المستقبلي؟\n\nتوجد في الفقه الإسلامي مسألة «منع الولي» (عضل الولي). عندما يتعسف الولي في حقه، أو يرفض دوره، أو يعارض الزواج دون مبرر شرعي، يمكن رفع القضية إلى القاضي في بلد يطبق القانون الإسلامي.\n\nرفض الولي تزويج المرأة دون مبرر وجيه لا يسمح لها مع ذلك بالزواج دون ولي. ومع ذلك، في هذه الحالة، يمكن لولي شرعي آخر في ترتيب الأولوية أن يعقد الزواج، أو يمكن عرض القضية على قاضٍ شرعي ليُعقد الزواج.\n\nوعليه، إذا أظهر أخ هذه الأخت ظلماً أو تعسفاً في رفضه — نسأل الله أن يهديه — فيمكنها اللجوء إلى عمها من جهة الأب أو أي شخص آخر مؤهل لممارسة الولاية. فلم يجعل الله في الدين مشقة مفرطة.\n\nنعم، وجود الولي ضروري. ومع ذلك، عندما يتعسف الولي في سلطته ويرفض دون سبب وجيه، فإن ذلك يسبب ضرراً ويمنع تحقيق مصلحة شرعية. والأصل الأساسي في الإسلام هو: «لا ضرر ولا ضرار».\n\nسلوك الولي في هذه الحالة قد يسبب ضرراً حقيقياً لهذه الأخت ويعرضها لعواقب مؤسفة.\n\nننصح هذه الأخت أيضاً بالتحلي بالتمييز في اختيارها. يمكن القول لها أن تتوكل على الله، لكن بشرط أن يكون اختيارها صائباً حتى لا تندم عليه لاحقاً.\n\nوخلاصة القول:\n\nإذا كان هذا الزواج يحقق مصلحة حقيقية وكان اختيار الزوج المستقبلي مناسباً، فعند الرفض التعسفي من الولي، يمكنها أن تطلب من عمها أو من ولي شرعي آخر التدخل.\n\nومن جهة أخرى، يُعتبر الزواج المدني صحيحاً. فإذا كان أخوها يسعى إلى منعها من عقد زواج ديني، فلماذا لا يعارض أيضاً الزواج المدني؟\nوبمجرد إتمام الزواج المدني والحصول على دفتر العائلة، يمكنها أن تقوم... [نهاية الجواب مقطوعة في المصدر الفرنسي]"},{"id":4763,"c":84,"d":"2026-06-01","t":"هل طلب من الأب ترك طفله المولود خارج الزواج لدى أمه المسيحية ذنب؟","q":"السلام عليكم ورحمة الله وبركاته،\n\nأسمح لنفسي أن أكتب إليكم اليوم لأن لدي انشغالاً دينياً وشخصياً أود بشأنه توضيحاً وفق القرآن والسنة والفقه.\n\nخطيبي أنجب طفلاً خارج الزواج مع امرأة غير مسلمة. عندما أخبرني بذلك، حاولت أن أتقبل هذه المحنة بصبر قائلة: «قدر الله وما شاء فعل». ومع ذلك، مع مرور الوقت، أدرك أن قلبي يجد صعوبة كبيرة في تحمل هذه الحالة.\n\nيريد خطيبي استرجاع الطفل عندما يبلغ حوالي سبع سنوات لينشأ في الإسلام، لأن الأم مسيحية. لكن بعد بعض الأبحاث في الفقه، لا سيما في الآراء المالكية، فهمت أن الطفل المولود خارج الزواج لا يُنسب شرعاً إلى الأب كالطفل الناتج عن زواج صحيح، حتى لو كان الأب يمكنه الإحسان إليه ومساعدته أو تقديم الهدايا له.\n\nواليوم، أفكر في أن أطلب منه ترك الطفل يعيش لدى أمه ومواصلة مساعدته هناك إن شاء دون إدماجه بالضرورة في بيتنا المستقبلي. وأقر أن هذه الحالة صعبة عاطفياً بالنسبة لي، إلى درجة أنني أفكر أحياناً في إنهاء العلاقة لأنني لا أظن أنني سأنجح في تحمل ذلك في الزواج.\n\nفسؤالي إذن هو التالي:\n\nإذا طلبت منه ترك الطفل يعيش لدى أمه المسيحية، ونشأ الطفل في النهاية في الديانة المسيحية، فهل:\n\nسيكون على خطيبي ذنب؟\n\nهل سأكون أنا آثمة لطلبي ذلك؟\n\nأم أن أياً منا لن يحمل الذنب بخصوص ديانة هذا الطفل المستقبلية؟\n\nأوضح أن نيتي ليست ظلم الطفل ولا منع أي مساعدة أو إحسان تجاهه. أسعى فقط إلى فهم ما هو عادل دينياً وما لا يجعلني أحمل ذنباً أمام الله.\n\nجزاكم الله خيراً على جوابكم ومساعدتكم.\n\nبارك الله فيكم.\n\nوالسلام عليكم ورحمة الله وبركاته.","a":"جواب الإمام الواعظ الشيخ محمد الهادي ليتيم\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبسم الله، الحمد لله، والصلاة والسلام على رسول الله.\n\nيتضمن السؤال عدة نقاط تحتاج إلى توضيحات:\n\nنسب الطفل إلى أبيه؛\n\nحقوقه الاجتماعية؛\n\nثم مسألة قبول الأخت لهذا الطفل من عدمه.\n\nمقدمة للجواب:\n\nعلى رأي جمهور العلماء، هذا الطفل لا يُنسب شرعاً إلى أبيه البيولوجي، لأنه مولود من علاقة غير شرعية (زنا)، وفق قول النبي ﷺ: «الولد للفراش».\nفلا بد إذن من وجود زواج صحيح.\n\nومع ذلك يوجد رأي ثانٍ، أقلي، يقضي بأن الطفل يمكن أن يُنسب إلى أبيه إذا اعترف به. وهذا الرأي تؤيده أقلية من العلماء وفيه مصلحة للطفل وللمجتمع.\n\nبخصوص حقوقه الاجتماعية:\n\nهذا الطفل يولد في الإسلام على الفطرة السليمة، كما قال النبي ﷺ: «كل مولود يولد على الفطرة».\nولم يرتكب أي ذنب، لأن «لا تزر وازرة وزر أخرى». فيجب إذن معاملته كغيره من الأطفال المسلمين، سواء في تربيته ورعايته أو في عدم تحميله ذنب والديه اللذين كانا سبب وجوده.\n\nعندما يبلغ سن الرشد، يكون كغيره من المسلمين: له نفس الحقوق وعليه نفس الواجبات. له أهلية كاملة وكفاءة، ويمكن حتى أن يكون شاهداً عدلاً. وإذا كان مسلماً ملتزماً متمسكاً بدينه، فهو كغيره من المسلمين ولا ينبغي النظر إليه بشكل مختلف.\n\nأما كون هذا الرجل يريد الاحتفاظ بهذا الطفل لتربيته ورعايته، فذلك من أعظم الأعمال المستحبة. فكفالة... [نهاية الجواب مقطوعة في المصدر الفرنسي]"},{"id":4755,"c":81,"d":"2026-05-15","t":"تقسيم أضحية العيد في المذهب المالكي","q":"ما حكم تقسيم أضحية العيد في المذهب المالكي؟","a":"بسم الله الرحمن الرحيم\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق والخاتم لما سبق ناصر الحق بالحق والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم\n\n«اللهم صل على سيدنا محمد،\n\nفاتح ما أُغلق،\nوخاتم ما سبق،\nناصر الحق بالحق،\nوالهادي إلى صراطك المستقيم.\nوعلى آله،\nبحق قدره العظيم وعظمة مقامه.»\n\nقال الله تعالى:\n\nيَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ وَمَن يَتَّبِعْ خُطُوَاتِ الشَّيْطَانِ فَإِنَّهُ يَأْمُرُ بِالْفَحْشَاءِ وَالْمُنكَرِ\n\n«يا أيها الذين آمنوا لا تتبعوا خطوات الشيطان، ومن يتبع خطوات الشيطان فإنه يأمر بالفحشاء والمنكر.»\n(سورة النور، 24:21)\n\nقال الله تعالى:\n\nقُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ\n\n«قل: إن كنتم تحبون الله فاتبعوني يحببكم الله.»\n(سورة آل عمران، 3:31)\n\nقال الله تعالى:\n\nلَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ\n\n«لقد كان لكم في رسول الله أسوة حسنة.»\n(سورة الأحزاب، 33:21)\n\nقال الله تعالى:\n\nوَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا\n\n«وما آتاكم الرسول فخذوه وما نهاكم عنه فانتهوا.»\n(سورة الحشر، 59:7)\n\nقال الله تعالى:\n\nقُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا ۖ هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ\n\n«قل: بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون.»\n(سورة يونس، 10:58)\n\nكلام سيدنا الشيخ أحمد التجاني\n\n(قدس الله سره العزيز)\n\n«كل فتح وكل نور وكل ترقٍّ روحي لا يتحقق إلا بالاتباع الصادق للحبيب ﷺ.»\n\n«كل الخير في اتباع السنة، وكل الشر فيما يخالف السنة.»\n\n«كل طريق لا يؤدي إلى اتباع النبي ﷺ هو طريق هلاك.»\n\nتقسيم أضحية العيد في المذهب المالكي\n\nفي مذهب مالك بن أنس، أضحية عيد الأضحى (الأضحية) عبادة نبيلة ومستحبة بقوة. وقد شرح علماء المالكية الأحكام المتعلقة بتقسيم لحم الأضحية، استناداً إلى القرآن الكريم وسنة الحبيب النبي ﷺ.\n\nقال الله تعالى:\n\nفَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ\n\n«كلوا منها وأطعموا القانع والمعتر.»\n(سورة الحج، 22:36)\n\nفهم العلماء من هذه الآية الكريمة أنه يُستحب:\n\nأكل جزء من الأضحية؛\n\nوإهداء جزء منها؛\n\nوإعطاء جزء منها للفقراء والمحتاجين.\n\nما ذكره علماء المالكية\n\nبين فقهاء المالكية أنه لم تحدد الشريعة أي نسبة إلزامية فيما يتعلق بتقسيم الأضحية.\n\nوعليه، فإن التقسيم إلى ثلاثة أثلاث متساوية:\n\nواحد للعائلة،\n\nوواحد للأقارب والجيران،\n\nوواحد للفقراء،\n\nمستحب لكنه غير واجب.\n\nذكر الإمام خليل بن إسحاق الجندي في مختصره أنه يُستحب أكل الأضحية وإطعام الغير منها.\n\nوشرح الإمام أحمد الدردير في الشرح الكبير أنه يُفضل:\n\nأكل جزء من اللحم؛\n\nوإهداؤه؛\n\nوالتصدق به.\n\nفي المذهب المالكي، إعطاء جزء من الأضحية للفقراء والمحتاجين من المندوب، أي عمل مستحب ومثاب عليه، لكنه غير واجب.\n\nوعليه، إذا احتفظ شخص بكل اللحم لعائلته، تبقى أضحيته صحيحة وفق علماء المالكية، خاصة في حالة الحاجة أو العائلة الكبيرة أو الصعوبة المالية.\n\nومع ذلك، ذكر الفقهاء أن ترك التقسيم مع الفقراء كلياً يخالف... [نهاية الجواب مقطوعة في المصدر الفرنسي]"},{"id":4754,"c":85,"d":"2026-05-15","t":"السلطة الزوجية للزوج: خروج الزوجة والعلاقة الحميمة بين الزوجين","q":"السلام عليكم ورحمة الله\nأريد أن أعرف هل يمكن للزوج منع كل خروج لزوجته، مثل الذهاب لرؤية العائلة بشكل معقول، أو التسوق، أو مجرد الخروج لأخذ نفس نادراً مرة أخرى؟\nهل له الحق في منعها من كل الخروج بحبسها باستمرار في بيتها دون أن تخرج؟\nهل يمكن للمرأة رفض العلاقة الحميمة إذا كان الزوج عنيفاً، ويشتمها ويحط من قدرها إلخ؟\nبارك الله فيك","a":"بسم الله، الحمد لله، والصلاة والسلام على رسول الله.\nاعلموا أن العلاقة الزوجية مبنية على المعروف وحسن المعاملة.\nقال الله تعالى: «وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ».\nوفي آية أخرى: «وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَى وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنبِ».\nوقال بعض المفسرين إن «الصاحب بالجنب» يقصد به الزوجة.\nفالأمر هنا هو أمر بالإحسان.\nوفي الحديث الشريف: «خيركم خيركم لأهله».\nهذه إذن هي توجيهات الإسلام: ليس للزوج الحق في التعسف في سلطته. نعم، توجد طاعة زوجية: على الزوجة أن تكرم زوجها وتطيعه في المعروف وبطريقة صحيحة.\nإذا وجد ضرر حقيقي أو خطر مؤكد، يمكن للزوج أن يمنع زوجته مؤقتاً من الخروج لسبب محدد، كالخوف من ضرر أو فساد أو خطر. لكن عليه حينئذ أن يشرح ويوضح ويبرر.\nأما المنع المطلق — وخاصة منعها من زيارة عائلتها — فنميل إلى الرأي المتوافق مع المبادئ العامة للإسلام. بعض الآراء تقول إن الزوجة يجب أن تطيع زوجها طاعة مطلقة. لكن الله تعالى يأمر بالعدل والإحسان، ولا يأمر بالظلم والفحشاء. فلا يجوز للزوج منعها كلياً بنية الإضرار بها أو حبسها أو الانتقام منها، لأن ذلك يؤدي إلى عواقب وخيمة، ويلحق الضرر بالزوجة، وينتهي بإفساد العلاقة الزوجية.\nوبالمثل، ليس للزوجة الحق في حرمان زوجها من حقوقه، لأن ذلك غالباً ما يكون رد فعل على مشاكل أخرى. وفي النهاية، يسيء كل منهما إلى الآخر، وتتجه العلاقة نحو الانقطاع والتباعد، وهو ما لا نريده أيضاً.\nيجب تغليب النصح والحوار واستشارة أهل العلم والمعرفة.\nوالله هو الموفق."},{"id":4748,"c":85,"d":"2026-05-10","t":"تجديد عقد النكاح بعد الشك في صحة الولي ومسألة الدورات الشهرية الاصطناعية","q":"السلام عليكم،\n\nتزوجت بزوجي منذ حوالي سنتين. ومع ذلك، بعد أبحاث معمقة، علمت أن الوصي المختار (وهو أخي غير الشقيق من جهة الأم، لأن أبي ليس مسلماً) لم يكن من العصبة، أي من جهة الأب.\n\nنريد تجديد زواجنا مع كل الشروط اللازمة (التوبة، الاستبراء، إلخ). ومع ذلك، منذ بضع سنوات، آخذ حبوب منع الحمل، مما يسبب حيضاً يسمى «اصطناعياً» يُثار أثناء توقف العلاج.\n\nأردت أن أعرف هل يُعتبر هذا الحيض الاصطناعي دورة كاملة أم لا، وهل من الضروري إيقاف الحبوب لاستعادة دورة طبيعية (مع العلم أن الدورة الطبيعية قد تستغرق وقتاً لتعود) قبل الشروع في تجديد الزواج في ظروف جيدة.\n\nأنا تائهة بعض الشيء في هذا الموضوع.\n\nبارك الله فيكم.","a":"بخصوص مسألة هل يمكن للأخ غير الشقيق من جهة الأم أن يكون ولياً للزواج، توجد حالتان: هل عُقد الزواج في بلد مسلم مع قاضٍ مسلم، أم في بلد غير مسلم؟\n\nالحالة الأولى:\nإذا تم الزواج في بلد مسلم ولم يكن للمرأة ولي، فالقاضي هو ولي من لا ولي لها. هذه هي القاعدة. وعليه، لا يمكن لأخيها غير الشقيق من جهة الأم أن يكون ولياً، لأن للقاضي أولوية عليه.\n\nالحالة الثانية:\nأما إذا تم الزواج في بلد غير مسلم، فالذي يقوم مقام القاضي هو الإمام أو الشخص الذي يمثل المسلمين في مركز إسلامي أو ما يعادله.\n\nوفي هذه الحالة، توجد مرونة معينة: الأخ من جهة الأم أقرب إلى هذه المرأة من الإمام. فضلاً عن أن الأخ من جهة الأم يمكن أن يرث في غياب الأخ الشقيق أو الأخ من جهة الأب. وعليه، يمكن اعتبار ولايته صحيحة، لا سيما على المذهب الحنفي. فهم يرون هذا الزواج صحيحاً، والمرأة ليست ملزمة بإبطاله ولا بإعادة حساب مدة العدة، إلخ.\n\nومع ذلك، إذا كانت مقتنعة بأن هذا الزواج غير صحيح وتريد إعادة عقد الزواج، فعليها حينئذ مراعاة العدة، سواء كانت طبيعية أو متأثرة بالأدوية أو دورة غير منتظمة، وهي ثلاثة أشهر.\n\nوالله أعلم."},{"id":4750,"c":82,"d":"2026-05-10","t":"حكم الاستثمار في الأسهم وفق ضوابط الشريعة","q":"السلام عليكم ورحمة الله وبركاته.\nالشيخ الكريم، جزاكم الله خيراً وبارك في جهودكم.\nهل يمكنكم الإجابة على سؤالي أدناه؟ بارك الله فيكم:\nأود معرفة الحكم بخصوص الاستثمار في البورصة (شراء أسهم الشركات).\nلقد فهمت أن هناك خلافاً بين العلماء:\nبعضهم يحرم هذا النوع من الاستثمار كلياً،\nوبعضهم يجيزه بشروط، لا سيما إذا كان نشاط الشركة مباحاً،\nوبعضهم يجيزه مع طلب تطهير الجزء الحرام المرتبط بالفوائد.\nواليوم، توجد أيضاً أدوات تدعي أنها تسمح باختيار الشركات وفق معايير متوافقة مع الشريعة.\nأسئلتي هي التالية:\nهل يجوز الاستثمار في البورصة بشكل عام؟\nهل اختيار الشركات ذات النشاط المباح فقط يجعل ذلك جائزاً؟\nماذا عن الشركات التي تتضمن جزءاً من الفائدة (الربا) في عملها: هل يجوز الاستثمار فيها مع تطهير هذا الجزء؟\nهل يجوز الاستثمار في صناديق تجمع عدة شركات تحترم معايير إسلامية معينة؟\nجزاكم الله خيراً على جوابكم ووفقكم الله.\nوالسلام عليكم ورحمة الله وبركاته.","a":"موضوع البورصة والأسهم موضوع دقيق ومعقد، وهو محل خلافات وله فروع كثيرة.\n\nبشكل عام، يجوز التعامل في البورصة وشراء الأسهم بشروط معينة:\n\nأولاً، أن يكون نشاط الشركات مباحاً. بعبارة أخرى، يجب ألا يتعارض نشاطها مع الدين وألا يتضمن عناصر محرمة. يجب ألا تبيع منتجات أو خدمات محظورة ولا تقدم أشياء مخالفة للنظام العام.\nفهذا هو الشرط الأول: أن يكون النشاط مباحاً، نافعاً للمجتمع والأمة، وألا يتعارض مع القانون الديني ولا مع القانون الساري.\n\nثانياً، ألا تكون هناك معاملات ربوية (فائدة). فيجب ألا تتضمن عمليات الشراء والبيع فوائد.\n\nثالثاً، شرط تقني: ألا يكون الهدف التلاعب بالأسهم بقصد خفض الأسعار أو رفعها.\n\nوبالتوفيق إن شاء الله."},{"id":3995,"c":87,"d":"2023-02-01","t":"زوج الحماة ولبس الحجاب","q":"السلام عليكم ورحمة الله وبركاته\n\nأرجو أن تكونوا بخير.\n\nكان لدي سؤال. لقد تزوجت الحمد لله. رأيت آية من القرآن تتعلق بالحجاب والمحارم. زوجي لا يرى أباه تقريباً، يعيش مع أمه وزوج أمه. وهو شخص حسن الأخلاق.\n\nهل يُعتبر زوج أمه من محارمي؟ هل يجب أن أحافظ على حجابي أمامه؟\n\nبارك الله فيكم على الجواب.\n\nيوم سعيد إن شاء الله.","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nزوج الحماة ليس من المحارم، فيجب عليها إذن أن تستتر قدر الإمكان أمامه، هذا هو الأصل.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3994,"c":87,"d":"2023-02-01","t":"رفض الإنعاش","q":"السلام عليكم أخي في الله.\n\nسأخضع لعملية جراحية. إذا سارت الأمور على نحو سيئ، هل يمكنني رفض الإنعاش؟\n\nلأنه إذا توقف قلبي فالله هو من قرر ذلك. الحمد لله.\n\nوليس للبشر أن يقرروا خلاف ذلك.\n\nشكراً","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nعلى المسلم أن يأخذ بالأسباب ويجب أن يحترم كل التدابير الصحية التي تضمن حياته لأن الحياة نعمة من الله، والصحة أيضاً نعمة، كما قال النبي (صلى الله عليه وسلم). ويجب أن يعلم أن الأمر بيد الله: فيتوكل عليه إذن، وهذا جزء من القضاء والقدر، لكن الأخذ بالأسباب جزء من القدر أيضاً.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3993,"c":85,"d":"2023-02-01","t":"الزواج من جنية مسلمة","q":"مرحباً! أنا على وشك الزواج من جنية مسلمة بطلب من والديها. هل يوجد حديث في ذلك؟ ماذا يقول الفقه الإسلامي؟ هل هذا جائز؟","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nالزواج من نعم الله التي أنعم بها على الإنسان وهو آية من آيات الله. قال الله تعالى في القرآن:\n\n{وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ} (سورة الروم، الآية 21)\n\nالزواج سكن وله أهداف إنسانية واجتماعية، ومنها تأسيس الأسرة، وحفظ النسب والذرية. كل هذا لا يمكن أن يتحقق بين البشر والجن. والرأي المعروف والمؤكد عند العلماء هو أن هذا النوع من الزواج لا يمكن أن يقع. قال الله تعالى في الآية المذكورة: {خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ}؛ «من أنفسكم» أي من جنسكم. وقال في سورة النساء: يجوز الزواج من النساء اللواتي تعجبكم ولم يقل جن.\n\nهذا النوع من الزواج مشبوه ولا يمكن أن يقع عند عدة علماء لأنه في هذه الحالة يمكن أن نجد امرأة حاملاً تنسب أبوة طفلها إلى جني، مما يفتح باب الفساد. ننصحكم بترك هذه الفكرة ونسأل الله أن يعينكم. ومن يتق الله يجعل له مخرجاً.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3992,"c":85,"d":"2023-02-01","t":"زواج المرأة المسلمة من غير مسلم","q":"السلام عليكم،\n\nأشكركم أولاً مقدماً على الوقت والاهتمام المبذولين لسؤالي.\n\nأسمح لنفسي أن أكتب إليكم لأني امرأة مسلمة الديانة. وأيضاً، أنوي في المستقبل القريب الانخراط في الطريقة التيجانية إن شاء الله.\n\nالتقيت برجل مؤمن ينتمي إلى ديانة مختلفة عن الإسلام ألاحظ معه تفاهماً وثيقاً في المجالات الروحية وحياة الدنيا. نعترف ببعضنا في حبنا لله لكن ديانتينا مختلفتان. نحترم ديانة كل منا.\n\nنود الزواج. وأود أن أعرف هل سيكون زواجنا صحيحاً وفق تعاليم الإسلام.\n\nفي فهمي المتواضع، أفهم أن تحريم الاتحاد مع أشخاص خارج الإسلام يتعلق بالمشركين والملحدين إلخ وليس بالأشخاص من الديانات المسماة «أهل الكتاب». أرجو توضيح هذه النقطة لي.\n\nمع شكري لكم مقدماً،\n\nأن يضيء نور الله كيانينا.","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nلا يجوز للمرأة المسلمة الزواج من غير مسلم. وهذا هو الإجماع المعروف عند علماء المسلمين. فالشريعة الإسلامية تجيز للمسلم الزواج من امرأة من أهل الكتاب لأنه يؤمن بإلهها ونبيها وكتابها. وفي الحالة العكسية، لا يؤمن غير المسلم بالديانة ولا بالنبي ولا بكتاب المرأة المسلمة، وعليه لا يجوز لها الزواج منه.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3991,"c":85,"d":"2023-02-01","t":"ولي للزواج","q":"السلام عليكم ورحمة الله وبركاته،\n\nأنا أخت اعتنقت الإسلام منذ ثلاث سنوات وأنا على علاقة مع أخ من أجل الزواج.\n\nأخي الأكبر الذي أشاركه نفس الأم اعتنق الإسلام أيضاً منذ 5/6 سنوات الحمد لله.\n\nهل يمكنه أن يكون وليّي؟\n\nقرأت أن الأشخاص من جهة الأم عادة لا يمكنهم أن يكونوا أولياء الفتاة.\n\nفي أحد أجوبتكم، نصحتم أختاً أن تتخذ زوج أختها ولياً لها فأردت مزيداً من التفاصيل عن حالتي الخاصة.\n\nأنا أتبع أساساً الفقه المالكي.\n\nبارك الله فيكم على جوابكم.","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nالأخ غير الشقيق من جهة الأم لا يمكن أن يكون ولياً للزواج. الأولياء الشرعيون في الزواج الديني الإسلامي هم: الأب، والجد، والإخوة، والأخ غير الشقيق من جهة الأب. ثم العم من جهة الأب وأبناؤه، إلخ. فأقرب ولي هو الذي يزوج المرأة. توجد بعض الخلافات في ترتيب الأولياء (في غياب الأب) لكن الأخ غير الشقيق من جهة الأم لا يمكنه تزويجها إلا في غياب أي ولي آخر أو إذا حصل على توكيل من الولي الشرعي.\n\nأما الجواب المتعلق بالأخت التي اتخذت زوج أختها ولياً، فيفسر بغياب أي ولي شرعي آخر لتزويجها في عائلتها. وفي هذه الحالة، نبحث عن الأقرب.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3931,"c":78,"d":"2022-06-26","t":"اعتناق الإسلام وقضاء الزكاة المتأخرة","q":"السلام عليكم ورحمة الله\n\nبفضل الله عز وجل وهدايته، اعتنقت الإسلام في سبتمبر 2021 الحمد لله.\n\nعندما طُرح موضوع الزكاة، تصرفت على النحو التالي:\n\nذهبت لأتحقق من الفترة التي تجاوزت فيها مواردي النصاب. وكانت في شهر فبراير منذ سنوات مضت.\n\nوبهذه الطريقة حددت تاريخ إخراج زكاتي لشهر فبراير 2022.\n\nوتم الحساب وفق الموارد التي كنت أملكها خلال تلك الفترة.\n\nسؤالي هو التالي:\n\nهل يجب عليّ قضاء زكاة كل سنة من السنوات منذ تجاوز النصاب حتى 2022؟\n\nجزاكم الله خيراً","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nقبل الإسلام، أنت غير معني بذلك، والإسلام يمحو ما قبله. فيجب إذن أداء الواجبات الدينية، وفعل الخيرات، وحسن الظن بالله، فباب الصدقة والإحسان مفتوح دائماً. لكن لا قضاء عليك فيما يخص الزكاة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":3929,"c":79,"d":"2022-06-26","t":"الاستمناء في رمضان","q":"عمري 16 سنة وأنا نادم حقاً لكن الشهوة كانت أقوى مني لكنني مارست الاستمناء في رمضان. وبما أن صومي أصبح الآن باطلاً أعلم أن عليّ قضاءه بصيام 60 يوماً أو إطعام 60 مسكيناً. والمشكلة أنني أشعر أنني عاجز عن صيام 60 يوماً وما زلت تحت جناح والديّ فلا أملك الوسائل لإطعام 60 مسكيناً.\n\nماذا يجب أن أفعل في هذه الحالة؟","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nما ارتكبته من انتهاك لحرمة شهر رمضان ذنب عظيم لأن من مقاصد الصوم تربية النفس وتزكيتها وتعودها على الانضباط، وكذلك الشعور بمراقبة الله والوعي بأن الله تعالى مطلع على كل عمل نقوم به، وكل كلمة ننطق بها، وكل فكرة تخطر ببالنا.\n\nعليك أن تتوب توبة صادقة مع العزم على عدم العودة أبداً إلى مثل هذا الفعل. وعليك أيضاً قضاء ذلك اليوم، ويكفيك الندم وطلب المغفرة بسبب عجزك عن الكفارة.\n\nملاحظة:\n\nهذه مسألة فيها خلاف بين الآراء الفقهية. فعند المالكية، الكفارة واجبة؛ أما عند الحنابلة، فالقضاء وحده هو الواجب.\n\nلكن هذا الفعل يبقى ذنباً لا يليق بحرمة هذا الشهر الكريم.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":3892,"c":82,"d":"2022-01-04","t":"التمويل بدون رسوم بالتقسيط","q":"السلام عليكم،\n\nأتوجه إليكم للحصول على جواب ديني. فأنا أرغب في الالتحاق بتكوين معتمد. وبعد أن صليت الاستخارة أتساءل: هذا التكوين يكلف أكثر من 3000 يورو ومركز التكوين يقترح تمويلاً بدون رسوم بالتقسيط مع سحب كل شهر. هل يجوز ممارسة هذا الفعل أم أنه ربا؟\n\nالسلام عليكم ورحمة الله وبركاته،","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nهذا جائز. وهو كالبيع بالتسهيل: لا حرج في ذلك، فالشريعة الإسلامية لا تحرم هذا النوع من المعاملات التي لا تتضمن في الواقع فائدة ربوية (ربا).\n\nانظروا جوابنا عن الدفع الآجل أو بالتسهيل:\n\nhttps://tidjaniya.com/fr/fiqh-question/vendre-plus-cher-si/\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":3893,"c":85,"d":"2022-01-04","t":"ولادة من زنا وزواج","q":"السلام عليكم\n\nأنا مولود من الزنا. وحسب شروحاتكم وبعض أبحاثي كما تقولون وقد لاحظت أنه وفق المذاهب الأربعة لست ابن هذا الرجل فلا محرمية فيما يخص أفراد عائلته، ورأيت أنه وفق الإمام الشافعي وكذلك مالك وغيرهما لا يوجد مانع زواجي فيما يخص موانع الزواج المذكورة في سورة النساء بالنسبة لطفل غير شرعي، فهل يمكنني الزواج من امرأة طلقها أي هذا الرجل في انتظار جوابكم إن شاء الله جزاكم الله خيراً.\n\nبارك الله فيك\n\nالسلام عليكم","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلاً، هذه مسألة تثير خلافاً في الآراء الفقهية.\n\nالحنفية منعوا هذا الشكل من الزواج. والقاعدة عندهم هي أن ما يصبح حراماً بفعل الزواج يصبح حراماً بفعل الزنا، والله تعالى يقول: {وَلَا تَنكِحُوا مَا نَكَحَ آبَاؤُكُم مِّنَ النِّسَاءِ} (سورة النساء، الآية 22). فهذا إذن رأيهم خلافاً للآراء المعروفة للشافعية والمالكية في هذا الموضوع.\n\nنتبنى رأي الحنفية القاضي بتحريم هذا الزواج، لتجنب الوقوع في الاشتباه ودفعاً للفساد المحتمل. وننصح هذا الابن بترك هذه الفكرة حفاظاً على دينه.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":3891,"c":85,"d":"2022-01-04","t":"من يمكن أن يكون ولياً لزواج فتاة تطلق والداها…؟","q":"السلام عليكم ورحمة الله وبركاته،\n\nأتوجه إليكم اليوم لأني في وضعية معقدة ولا أعرف ماذا أفعل، وهذا يخص الزواج. سأشرح لكم: لم يكن لدي دين لسنوات عديدة رغم أن أمي اعتنقت الإسلام منذ سنوات عديدة وتزوجت بمسلم منذ أن كان عمري سنة واحدة. ليس لدي أي اتصال بأبي البيولوجي، وأعتبر أبي الحقيقي فعلاً كأبي لأنه أطعمني واعتنى بي منذ أن كنت رضيعة. للأسف عندما كبرت ارتكب خطأً في حقي، كنت ضحية تحرش وقد حملت عليه ضغينة لسنوات عديدة وشعرت أن قلبي يمتلئ بالحقد مع أن عمري كان 15 أو 16 سنة فقط. اعتنقت الإسلام في سن 16 ولم أعد أستطيع العيش مع هذا الثقل في قلبي فقررت يوماً ما التحدث عنه لأني عشت مع الخوف وقد اعتذر وأعلم أن اعتذاره كان صادقاً ولم يرتكب هذه الخطيئة مجدداً أبداً ولم أحمل عليه ضغينة بعد ذلك أبداً. أعلم أنه محرمي دينياً والآن المشكلة أن الرجل الذي نرغب في الزواج منه على علم بذلك ويرفض طلب يدي إذا كان هو محرمي، يقول إن زوج الأم ليس محرماً ويريدني أن أختار آخر وهو ما أرفضه لأنه بالنسبة لي أبي قبل كل شيء، لست جاحدة ولا أريد أن أحكم على شخص بفعل واحد ولا أريد إبعاده عن هذا اليوم المهم بالنسبة لي. لا أريد أن أجعله يشعر بإبعاده عن هذا اليوم وللأسف لا نتفق على ذلك، ويريد أيضاً رأي شخص من أهل العلم.","a":"جواب الإمام الواعظ الشيخ سيدي محمد الهادي ليتيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nطلاق الوالدين لا يؤثر شرعاً على ولاية الأب على ابنته لزواجها. فهو أبوها وشرعاً هو وليها، حتى لو كانت تحت كفالة أمها، إلا في حالة قرار قضائي يقضي بخلاف ذلك. وعليه، يجب على الفتاة أن تتواصل مع أبيها، وتتحدث معه وتستشيره بخصوص زواجها.\n\nويمكنه أن يفوض شخصاً آخر ليحل محله كولي لزواج ابنته إذا لم يكن قادراً على الحضور لذلك أو لا يرغب في المشاركة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":3890,"c":82,"d":"2022-01-04","t":"العملة المشفّرة","q":"السلام عليكم ورحمة الله وبركاته، اسمي خزالي ديالو وأودّ الحصول على رأي شرعي حول العملة المشفّرة. هل هي حرام أم حلال؟\n\nسيساعدني رأيكم كثيرا في اختياري إن شاء الله.\n\nأشكركم.\n\nخزالي","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلا، هذا النوع من العملات الرقمية أو الإلكترونية ظهر حديثا وانتشر استعماله.\n\nهذه المسألة، كغيرها من المواضيع المستجدة في الفقه الإسلامي، مرتبطة بمستجد أو أمر حديث. والبحوث والتحقيقات بشأنها ما زالت مستمرة من طرف المتخصصين في العلوم المالية والاقتصادية، وعدة تساؤلات ما زالت قيد الدراسة من طرف علماء الشريعة لمعرفة ما إذا كانت هذه العملة موافقة لتعاليم ديننا.\n\nمعظم علماء العلم الشرعي يحذّرون من استعمال هذه العملة، ومن العمل بها أو إجراء المعاملات والعمليات بها. وبعضهم يحرّمها تحريما صريحا بسبب المخاطر المحتملة المرتبطة بالجهل، وإمكانية الخداع والتزوير أو الغش، مما يؤدي لاحقا إلى معاملات مضرة وفقدان الثقة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":634,"c":85,"d":"2021-03-01","t":"خطيبي المستقبلي يرفض وليّ أمري","q":"السلام عليكم ورحمة الله وبركاته،\n\nأتوجّه إليكم اليوم لأنني في وضعية معقّدة ولا أعرف ماذا أفعل، وهي تخصّ الزواج. سأشرح لكم: لم يكن لي دين لسنوات عديدة رغم أن أمي أسلمت منذ سنوات عديدة وتزوّجت بمسلم منذ أن كان عمري سنة واحدة. ليس لي أي اتصال بأبي البيولوجي، وأعتبر زوج أمي أبي الحقيقي لأنه أطعمني واعتنى بي منذ أن كنت رضيعة. للأسف عندما كبرت ارتكب في حقي خطأ؛ كنت ضحية لمسّ غير لائق وحقدت عليه سنوات عديدة وشعرت أن قلبي يمتلئ كراهية مع أن عمري لم يكن يتجاوز 15 أو 16 سنة. اعتنقت الإسلام في سن 16 ولم أعد أستطع العيش مع هذا الثقل في قلبي فقرّرت يوما ما أن أتكلّم لأنني عشت مع الخوف، وقد اعتذر وأعرف أن اعتذاره كان صادقا ولم يعُد أبدا إلى ارتكاب هذا الخطأ ولم أحقد عليه بعد ذلك أبدا. أعرف أنه محرمي شرعا، والآن المشكلة هي أن الرجل الذي نريد أن نتزوّج على علم بذلك ويرفض أن يطلب يدي إذا كان هو محرمي، يقول إن زوج الأم ليس محرما ويريد مني أن أختار غيره، وهو ما أرفضه لأنني بالنسبة لي هو أبي قبل كل شيء؛ لست ناكرة للجميل ولا أريد أن أحكم على شخص بسبب فعل واحد ولا أريد أن أُبعده عن هذا اليوم المهم بالنسبة لي. لا أريد أن أجعل أبي يشعر بأنني أُبعده عن هذا اليوم، وللأسف لا نتفق على ذلك، وهو يريد أيضا رأي شخص من أهل العلم.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأستغفر الله، لا حول ولا قوة إلا بالله.\n\nلقد تعرّضتِ لمحنة شديدة وألم كبير، لكن الحمد لله نجحتِ في تجاوز ذلك بمسامحة زوج أمك والمحافظة على أسرتك.\n\nالآن، إذا كان هذا الرجل، الذي نسأل الله أن يغفر له، قد ندم وتاب توبة صادقة وعاد إلى الطريق المستقيم، فيمكنه أن يتولّى تزويجك لأنه يُعتبر بمثابة أبيك، وربما لا يوجد شخص آخر ليكون وليّك.\n\nالرجل الذي تنوين الزواج به يجب أن يثق بك ويقبل الوضع، وألا يسعى إلى إثارة المشاكل والخلافات العائلية. هذا من باب الإحسان. والعفو عن الناس عمل عظيم من أعمال التقوى وخلق كريم من أخلاق المؤمن.\n\nنسأل الله أن ييسّر لك وأن يمنحك عونه.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":633,"c":79,"d":"2021-03-01","t":"أيام صيام تم إفطارها عمدا","q":"السلام عليكم\n\nأنا طالب عمري 19 سنة وعندي السؤال التالي: في رمضان الماضي للأسف أفطرت أياما من رمضان عمدا، غفر الله لي. فتساءلت إن كان لديّ أجل محدّد لأداء الكفارة، وبما أنني طالب سأدفعها من منحتي الشهرية (لا أعمل وأعيش ما زلت عند والديّ). وبما أن رمضان 2021 يقترب، أخشى ألا يكون لديّ الوقت لأدائها قبل بداية رمضان، وأردت أن أعرف هل يجب عليّ حتما أن أؤدّيها قبل ذلك، وهل هناك حلول، وهل لديكم نصائح. شكرا مسبقا.\n\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالحمد لله الذي وفّقك للندم والتوبة. من عاد إلى الله قبِل الله توبته. انتهاك حرمة صيام رمضان ذنب عظيم لا ينبغي تكراره، ويجب الابتعاد عنه وعن كل ما قد يؤدي إليه.\n\n{إِلَّا مَن تَابَ وَآمَنَ وَعَمِلَ عَمَلًا صَالِحًا فَأُولَٰئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ ۗ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا} (سورة 25، الآية 70)\n\nما يجب عليك فعله الآن:\n\n1- الندم والتوبة\n\n2- قضاء الأيام التي أفطرتَها (القضاء)، ولو على وجه متقطّع.\n\n3- الكفارة: إما بإطعام الطعام أو بالصيام. بالنسبة لنا، الإطعام أولى، أي إطعام 60 مسكينا بمقدار «مُدّ» (أي وجبة) عن كل يوم تم إفطاره.\n\nوبما أنك طالب، أعانك الله ووفّقك للنجاح، يمكنك أن تبدأ هذه الكفارة حسب قدراتك ووسائلك المادية.\n\nليس واجبا أن تُنهي كفارتك قبل حلول شهر رمضان. الأهم هو أن تبدأها في أقرب وقت ممكن، ثم تُتمّها حسب قدرتك ولو استغرق ذلك وقتا طويلا.\n\nوبالنظر إلى وضعيتك المالية، يمكنك أيضا أن تدفع المبلغ الأدنى الذي يمكن دفعه وهو 3 يورو عن كل وجبة. يمكنك أداءها دفعة واحدة حسب عدد الأيام، أو على دفعات متعددة، ولا حرج في ذلك أيضا.\n\nوالتوفيق من الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":631,"c":87,"d":"2021-03-01","t":"إهداء صليب لمسيحي","q":"السلام عليكم ورحمة الله وبركاته يا أستاذ،\n\nأسمح لنفسي بالاتصال بكم لأحصل على الرأي الصحيح قبل اتخاذ أي قرار. ولدت في عائلة كاثوليكية، والحمد لله، هُديت إلى الإسلام. عندي في بيتي مسبحة كاثوليكية عليها صليب، بالإضافة إلى ثلاثة صلبان أخرى وكتاب مقدس على شكل قصص مصورة كانت ملكا لي. أحد أبناء عمومتي كاثوليكي متديّن وكنت أقول في نفسي إنني قد أهديها له، لكنني لا أعرف الحكم الشرعي في هذا الموضوع. فإذا كان يحرم عليّ إهداؤها، فماذا يجب أن أفعل بها؟\n\nجزاكم الله خيرا وحفظكم!","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالأصل أنه لا ينبغي الاحتفاظ في البيت بما يتعارض مع عقيدة التوحيد التي اعتنقتَها، لكن إذا كنت ما تزال تسكن في بيت العائلة وعائلتك ما زالت كاثوليكية فيجب عليك احترام معتقداتهم.\n\nأما إذا كنت تسكن وحدك، ففي هذه الحالة يجب التخلّص من هذه الصلبان وكل ما يتعارض مع معتقدات الإسلام. وإذا أراد قريبك أن يسترجعها، فيمكنك أن تعطيها له، لا على أنها هدية بل بنية التخلّص منها.\n\nالمسلم يحترم معتقدات الآخرين دون أن يتبعها.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":630,"c":85,"d":"2021-02-28","t":"زوجي خانني","q":"صباح الخير،\n\nلا أعرف إلى من أتوجّه. أنا امرأة اعتنقت الإسلام منذ أكثر من 15 سنة، تزوّجت منذ 13 سنة ورزقت بثلاثة أطفال، وعلمت للتوّ أن زوجي يخونني مع امرأة أخرى. أنجب منها طفلا ثم عقدا زواجا دينيا. يقول لي إنه نادم وإنه يريد استرجاعي، لكن كيف يمكن إلغاء زواجه؟ وهل زواجنا ما زال ساريا؟ أنا ضائعة، وأتألم كما لم أتألم أبدا، وقد بذلت دائما قصارى جهدي، فلماذا مثل هذه المحنة؟\n\nشكرا لإعطائي إجابات.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأختي الكريمة،\n\nنسأل الله أن يفيض عليك عنايته ورضاه، وأن يرزقك الصبر في هذه المحنة وأن يثبّتك في دينك.\n\nواعلمي أن هذه الدنيا دار الابتلاء والمصائب. فالله لم يُنزل ابن آدم إلى هذه الدنيا إلا ليصطدم بالفتن والمحن.\n\nزوجك ارتكب فعلا شنيعا بخيانتك وعصيانه لله ورسوله. يجب أن يندم على ذنبه وأن يعود إلى الله بتوبة صادقة وأن يُصلح ما فعله قبل فوات الأوان.\n\nأما زواجك، فهو ما زال صحيحا بلا شك لأنه لم يحدث انفصال ولا طلاق. وبما أنه يريد العودة إليك وإلى أسرته، فيمكنه ذلك. وعلاقتكما يجب ألا تتضرّر نهائيا بسبب هذه القضية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":629,"c":87,"d":"2021-02-28","t":"هل يجوز تناول الأطعمة التي تحتوي على الجيلاتين؟","q":"السلام عليكم ورحمة الله وبركاته،\n\nعندي سؤال أصبح اليوم محل اهتمام كل مسلم يعيش في أوروبا أو في أي بلد غير مسلم.\n\nهل يمكن أكل كل طعام يحتوي على الجيلاتين سواء كان من الخنزير أو من البقر أو وُصف بأنه «جيلاتين» فقط أي غير محدّد صراحة؟\n\nلأنه حسب آراء المالكية، كل مادة تتحوّل وتفقد طبيعتها يمكن استهلاكها مثل مثال الخمر الذي هو حرام لكنه يتحوّل إلى خل فيصبح حلالا. فهل الأمر نفسه بالنسبة للجيلاتين البقري والخنزيري؟\n\nوفي نفس الحالة هل يمكن استهلاك طعام مثل مثال حلوى البريوش التي تحتوي على «الروم» أو «نكهة الكحول»، والتي بنفس العملية تتحوّل أو يمكن حتى القول إن المادة تتبخّر عند الطهي.\n\nأشكركم مسبقا وأشكركم على العمل الذي تقومون به للمجتمع، وأنارنا الله بنور وحب حبيبه النبي صلى الله عليه وعلى آله وسلم إلى الأبد.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيوجد عدة أنواع من الجيلاتين المستعملة في صناعة المنتجات الغذائية.\n\nأما تلك التي من أصل نباتي، فاستهلاكها مباح.\n\nومنها ما هو من أصل حيواني؛ وفي هذه الحالة نميّز عدة فئات:\n\nتلك المستخرجة من الحيوانات التي يُباح أكلها، كالأسماك أو الحيوانات المذبوحة وفق الشعائر (البقر أو الغنم أو غيرها). في هذه الحالة لا حرج في استهلاكها.\n\nوهناك فئة أخرى تتعلّق بالجيلاتين المتحصل من أصل نجس كتلك المستخرجة من حيوان ميت أو غير مذبوح وفق الشعائر أو المستخرجة من الخنزير. في الأصل لا يجوز استعمالها أو استهلاك الأطعمة التي تحتوي هذه المادة.\n\nغير أنه يوجد استثناء يتعلّق بما يُسمّى في الفقه بعملية الاستحالة الكاملة («الاستحالة») وهي تحوّل مادة نجسة إلى أخرى طاهرة، كتحوّل الخمر إلى خل. ويمكن أن تتم هذه الاستحالة بتفاعل تلقائي أو بإضافة عناصر أخرى.\n\nالمشكلة المطروحة هنا هي أنه يوجد خلاف بشأن تحوّل الجيلاتين ذي الأصل النجس. وهذا الخلاف ناتج عن الشكوك حول هذه العمليات الصناعية المعقّدة التي لا يمكن معرفتها بالتفصيل إلا من طرف المتخصصين في هذا المجال. هذا الموضوع ما زال محل خلاف وتساؤل مثل: هل هذه الاستحالة كلية أم جزئية، وعدة نقاط بحث أخرى. هذه التفاصيل العلمية ليست في متناول عامة الناس ولم يُؤمَر بأن يبحثوا عنها.\n\nما يمكننا قوله حاليا هو أنه في حالة الخلاف، فإن اعتماد رأي فقهي معيّن يجب أن يبقى خيارا شخصيا: إما أن نختار التورّع بتجنّب المنتجات التي قد تكون محل شك، وإما أن نختار رأيا مبنيا على البحث عن الرخصة الشرعية («الرخصة») لدفع المشقة وتيسير الأمر على الجماعة، وهو رأي صادر عن أهل العلم مع احترام قواعده المعروفة.\n\nوفي الحالتين، يجب اعتبار ذلك خيارا شخصيا واحترام الخيارات الأخرى دون السعي إلى الجدال أو فرض خياره.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":628,"c":87,"d":"2021-02-28","t":"امتلاك كلب","q":"سلام\n\nمن فضلكم\n\nحكم الله في تبنّي جرو «كانش»\n\nحلال أم حرام\n\nتبنّيته وعمره شهر واحد، اعتنيت به، عمره الآن 4 أشهر، كنت أظن أنني أفعل خيرا، والآن يقولون لي حرام والملائكة لا تدخل بيتك، هذا مكتوب في الحديث، والقيراط ينقص أيضا... أنا امرأة مسلمة وممارسة ولا أريد أن أفعل شيئا غير صواب! وظننت أنني سأحصد الحسنات.\n\nأنا ضائعة، طمئنوني من فضلكم.\n\nشكرا","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالإسلام يأمر بالإحسان إلى الحيوانات بالعناية بها وإطعامها وسقيها والإحسان إليها.\n\nفي الحديث: «بينما رجل يمشي فاشتد عليه العطش، فنزل بئرا فشرب منها، ثم خرج فإذا هو بكلب يلهث يأكل الثرى من العطش، فقال: لقد بلغ هذا مثل الذي بلغ بي، فملأ خفه ثم أمسكه بفيه، ثم رقي، فسقى الكلب، فشكر الله له فغفر له». قال الصحابة: يا رسول الله، وإن لنا في البهائم أجرا؟ فقال النبي (صلى الله عليه وسلم): «في كل ذات كبد رطبة أجر».\n\nإذن كل عمل خير تجاه حيوان هو عمل صالح.\n\nونلاحظ أيضا أن في مذهبنا المالكي الكلب يُعتبر «طاهرا»، سواء كان شعره أو لعابه أو عرقه، وفق قاعدة «كل حي طاهر».\n\nما هو محظور في التراث الإسلامي ليس الإحسان إلى الكلاب بل اتخاذها حيوانات أليفة وتربيتها داخل البيت، لأن تربيتها لا تجوز إلا لمصلحة شرعية وسبب وجيه، ككلاب الحراسة وكلاب الصيد والتي تحرس القطيع والتي تقود ضعاف البصر... ففي الحديث الصحيح أن الملائكة لا تدخل بيتا فيه كلب.\n\nلقد أحسنتِ إلى هذا الكلب بنية حسنة وهذا عمل صالح. نسأل الله أن يجازيك. وقد احتفظتِ به جهلا بهذا التحريم؛ الآن، إذا كانت لديك مصلحة وجيهة للاحتفاظ بهذا الكلب كما بيّنا سابقا، فيمكنك الاحتفاظ به، وإلا فأعطيه للجمعيات أو الهيئات التي تعتني بالحيوانات وستُثابين على ذلك إن شاء الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":627,"c":79,"d":"2021-02-28","t":"الصيام والسفر","q":"السلام عليكم،\n\nعندي سؤال يتعلّق بالسفر خلال رمضان. سأشرح لكم: أنا وأخي وأبي نخطط لزيارة عائلة لم نرها منذ سنوات في بلد آخر. وهي عائلة غير مسلمة. وأبونا ليس مسلما أيضا. سيكون هذا السفر خلال فترة رمضان. نخطط للبقاء هناك 3 أيام. فهل إمكانية عدم الصيام تنطبق فقط على مدة السفر أم على كامل الإقامة؟\n\nنطرح هذا السؤال لأننا لا نعرف كيف نجعل عائلتنا التي تنتظرنا منذ سنوات تفهم أننا لن نشارك في كل وجبة. وأبونا سيأكل وحده خلال النهار.\n\nنرغب في الحصول على إجابة.\n\nبارك الله فيك\n\nمانون","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا نوى المسافر البقاء أكثر من 4 أيام خارج مكان إقامته، فسيُعتبر مقيما (عند وصوله). فيُتمّ إذن صلاته (لا يقصرها)، ويصوم أيامه عندما يكون في شهر رمضان.\n\nأما إذا كانت مدة السفر أقل من 4 أيام، فقد أجاز العلماء قصر الصلاة والفطر، لأنه يُعتبر مسافرا.\n\nوطبيعي أن هذا السفر يجب أن يكون مباحا ودون أي نية للتحايل لتجنّب الصيام المفروض.\n\nبالنسبة لكم، سفركم هدفه زيارة العائلة وهو سفر بِرّ، وبالتالي يجوز لكم ألا تصوموا في هذه الشروط.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":626,"c":87,"d":"2021-02-28","t":"هل الحجاب واجب؟","q":"صباح الخير،\n\nأودّ أن أعرف إن كانت تغطية الشعر واجبا إلهيا فعلا، لأنه عندما أقرأ القرآن، الآية التي تتحدث عن الخمار «فلْيَضْرِبْنَ بخُمُرِهِنَّ على جُيوبِهِنَّ» توحي بأن نساء ذلك الزمن كنّ يرتدين خُمُرا ثقافية أصلا، إذن فالآية تبدو تشير إلى أن الصدر والجسم هما ما يجب تغطيته. وإذا أعدنا قراءة هذه الآية في الزمن الحالي حيث النساء ليس لديهن خمار على رؤوسهن أصلا، فماذا يترتّب على ذلك؟ لماذا لا يُقال فقط «فلْيَضْرِبْنَ بخُمُرٍ على جُيوبِهِنَّ»؟ باختصار، أودّ فعلا أن أرتدي الحجاب إذا كان واجبا، لكنه لا يبدو واجبا في هذا المقطع. أحتاج فعلا إلى إجابة من فضلكم، فهذا يؤرقني كثيرا.\n\nشكرا جزيلا على وقتكم.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأختي الكريمة،\n\nقبل كل شيء، أنتهز سؤالك لأذكّر بأن إقامة حكم شرعي في الدين ليست في متناول عامة الناس ولا تتم بمجرد قراءة آية من القرآن أو حديث من أحاديث النبي (صلى الله عليه وسلم). بل يجب إتقان فن العلم الشرعي الذي هو بحر عميق ومسار طويل جدا.\n\nعندما نتحدث عن الأئمة العلماء، فإننا نعني رجالا أتقياء برعوا في العلم والعمل، وحظوا بشهادة حسنة من عدد لا يحصى من المؤمنين عبر التاريخ.\n\nقال ابن أبي زيد (رضي الله عنه) تعليقا على قول سفيان الثوري: «إن من ليس بفقيه يأخذ النصوص على ظاهرها بينما يجب تأويلها في ضوء حديث آخر أو دليل آخر يبقى خافيا عليه، أو قد يكون دليلا منسوخا بسبب ناسخ له. ولا يتصدّى لمسؤولية العلم إلا من تعمّقوا في تعلّمهم وحصّلوا الفقه». وقال الإمام الهيتمي (رضي الله عنه) شيئا مشابها.\n\nوقد رُوي عن ابن وهب (رضي الله عنه): «لقيت 316 عالما من أهل العلم، ولولا مالك والليث (رضي الله عنهما) لضللت». (رواه ابن حبان في مقدمة المجروحين).\n\nإن حصن المذاهب الفقهية وما جمعته من علم وآراء هو أوثق وسيلة للسلامة.\n\nأما سؤالك، فالإسلام أمر النساء المسلمات بالحشمة وألا يُظهرن زينتهن أمام الرجال الأجانب، لأن في ذلك حفظا لكرامتهن وشرفهن.\n\nوقد ذُكر الأمر بالتستّر والاحتجاب في القرآن الكريم في سورة النور بهذه الألفاظ: {وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ}.\n\nالـ«خمار» هو الغطاء الذي تضعه المرأة على رأسها لتغطية شعرها، والـ«جيوب» هي فتحات القميص عند مستوى الصدر والذراع. وكانت النساء في ذلك الزمن يخرجن إلى الأسواق بينما تظهر أجزاء من أجسادهن من خلال هذه الفتحات. فأُمرن بتغطيتها حفظا لهن من الأنظار الفضولية كما ذكر المفسّرون.\n\nوقد استنبط علماء العلم الشرعي الأمر المتعلّق بوجوب الاحتجاب.\n\nوفي صحيح الإمام البخاري، قالت عائشة (رضي الله عنها): «يرحم الله نساء الأنصار، لما نزلت هذه الآية ({وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ}) شققن مروطهن فاختمرن بها».\n\nويوجد أيضا نص في سورة الأحزاب: {يَا أَيُّهَا النَّبِيُّ قُل لِّأَزْوَاجِكَ وَبَنَاتِكَ وَنِسَاءِ الْمُؤْمِنِينَ..."},{"id":625,"c":87,"d":"2021-02-09","t":"قبول مال شخص مسنّ أعتني به","q":"السلام عليكم يا شيخ،\n\nعندي سؤال. أعتني بشخص مسنّ (تصليحات، مشتريات إلخ...) منذ مدة، هذا السيد غني جدا ولديه وسائل كثيرة، وهو حاليا في حالة صحية سيئة، وقد قال لي دائما إنه يوم يغادر هذا المكان، إذا وجدت مالا يمكنني أخذه. فهل يمكنني أخذ ماله واستعماله كما أشاء في هذه الحالة؟\n\nشكرا على إجابتكم إن شاء الله","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالإسلام يحثّنا على الإحسان إلى الأقارب والجيران وجميع المخلوقات. ويشجّعنا أيضا على زيارة المرضى ومساعدة المحتاج وتكريم كبار السن والعناية بهم، لأن «خير الناس أنفعهم للناس».\n\nما تقوم به تجاه هذا الشخص المسنّ عمل خير، سواء كان نشاطا تطوعيا مجانيا أو مأجورا. وبالطبع، لا يمكنك أن تأخذ شيئا من أمواله أو ماله إلا في حالة أنه أذن لك بأخذ شيء أو تركه لك بمحض إرادته. فهذا أمانة وأنت مسؤول وحارس عنها.\n\nفي الخلاصة، توجد إمكانيتان يمكنك فيهما أن تأخذ شيئا من ماله: إما أن يعطيك هذا الشخص طوعا من ماله على سبيل الهبة أو الهدية، وإما أن يوصي لك في وصيته بالانتفاع بجزء من تركته، على ألا يتجاوز ثلث ميراثه، والباقي لورثته.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":624,"c":87,"d":"2021-02-09","t":"حكم الختان","q":"سلام\nأودّ أن أعرف ما هو الختان «الكامل» في الإسلام وهل هو واجب؟\n\nسأشرح لك. بما أنني مختون جزئيا (الحشفة مغطاة تماما عندما أشعر بالبرد أو بعد السباحة). زوجتي تطلب مني «إكمال» الختان وألا يكون لي قلفة بحيث تكون الحشفة مكشوفة تماما، لأن هذه هي السنة وأخاطر بأن أكون «غير صالح» للصلاة. ماذا تقول السنة وهل يجب عليّ إعادته؟\n\nشكرا على نصائحكم بارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالختان من سنن الأنبياء (عليهم السلام)، وممارسة أقرّتها الشرائع والتعاليم المقدسة. وفي الحديث المتفق على صحته، قال النبي (صلى الله عليه وسلم): «خمس من الفطرة: الاستحداد، والختان، وقص الشارب، ونتف الإبط، وتقليم الأظافر».\n\nالـ«فطرة» تعني الطريقة السليمة النقية. والحفاظ على هذه السنن واتباع الهدي النبوي يتطلّب العناية والاهتمام بالطهارة من كل جوانبها. وهذا أيضا جزء من هدف في الشريعة الإسلامية وهو الطهارة والحفاظ على الصحة.\n\nأما الحكم الشرعي، فالرأي الفقهي المنتشر هو أن الختان «سنة» وليس واجبا. وقد اعتبره بعض العلماء مطلوبا («واجبا»).\n\nالختان وفق الشريعة هو قطع طرف الجلدة التي تغطي الحشفة. وفي حالتك، لا نعرف سبب كونه ناقصا: هل هو نتيجة خطأ من الممارس أم بسبب إهمال منك؟\n\nفي كل الأحوال، يمكنك أن تعرض المشكلة على طبيب أو جرّاح للحصول على رأي طبي والتأكد. فإذا أكّد لك الطبيب أنه لا خطر ولا ضرر على صحتك في إجراء العملية، فيمكنك القيام بها.\n\nلكن يجب أن تعلم أن صحة الصلاة وغيرها من الأعمال الدينية لا تتوقّف على الختان.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":623,"c":87,"d":"2021-02-09","t":"ما هي العلاقات بين الرجل والمرأة؟","q":"السلام عليكم،\n\nأنا فتاة عمرها 19 سنة وأودّ أن أعرف كيف أتصرّف مع الشباب دون ارتكاب الذنوب، لا أعرف إن كان يجب أن أسلّم عليهم وهل يمكنني التحدث معهم وطلب المساعدة إذا احتجت أم تجاهلهم ببساطة. لا أعرف كيف يجب أن أتصرّف معهم. وأيضا إن كان يمكنني التحدث معهم على شبكات التواصل الاجتماعي والاطمئنان على صحتهم.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأشكرك أولا أختي الكريمة على حرصك على دينك وأسأل الله أن يباركك ويحفظك في سيرك على طريق الهداية والعفاف، خاصة في هذا الزمن الذي تكاثرت فيه أسباب الانحراف والضلال، لا سيما فيما يتعلّق بالعلاقات بين الرجال والنساء.\n\nعلاقتك بزملائك، سواء في إطار المدرسة أو العمل، يجب أن تكون عادية، علاقة احترام متبادل وتعاون وإخلاص، مع مراعاة الحدود التي تقتضيها الحشمة والآداب.\n\nأما العلاقات التي تنشأ عبر شبكات التواصل الاجتماعي، فيجب الحذر منها لأنها في أغلبها باب للفتنة، تشمل الخداع والكذب، وقد تؤدي إلى فساد كبير في الأسر، خاصة عند المراهقين. يجب عليك توخّي الحذر واتقاء الله في كل ذلك وتجنّب كل حديث أو تواصل غير ضروري قد يقودك إلى شيء محرّم. وبالطبع، نحن لسنا ضد استعمال التقنيات الجديدة لأغراض نبيلة ومشروعة كالبحث العلمي بين مجموعات الطلاب أو الأنشطة الثقافية والتربوية والإعلامية والاجتماعية إلخ... بل ضد الانحرافات والتجاوزات المتعلّقة بها.\n\nوفي الحديث: «الحلال بيّن والحرام بيّن، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام». والتوفيق من الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":622,"c":87,"d":"2021-02-09","t":"إجراء عملية للحول","q":"السلام عليكم،\nأستعدّ لإجراء عملية للحول في سن 25 سنة، لم يُعالَج أبدا في طفولتي. أودّ أن أستعيد عينا مستقيما منحرفا بشدة إلى الخارج. أتساءل إن كان هذا النوع من العمليات جائزا، وإن لم يُعتبر تغييرا لخلق الله.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا كان هذا الحول يُظهر تشوّها واضحا أو اعوجاجا ظاهرا، فعلاجه جائز لإزالة الضرر. وهذا من العلاجات الطبية المشروعة، بشرط بالطبع ألا يكون هناك أي خطر على الشخص عند إجراء هذه العملية.\n\nأما إذا كان انحراف العين خفيفا، ولا يؤثر على دقة النظر ولا يُظهر تشوّها، فلا ينبغي السعي إلى إزالته لأنه في هذه الحالة عملية تجميلية، وهذا يدخل في باب التغيير في خلق الله.\n\nوفي هذه الحالة، يجب على المسلم أن يصبر ويرضى بقضاء الله وقدره وأن ينظر إلى من هم أشد ابتلاء منه، الذين هم في وضع أصعب من وضعه، ليتمكّن من شكر الله والرضا بجميع نعمه التي لا تحصى، وألا يفقد الأمل وحسن الظن بالله. كم من أشخاص عميان، أو فقدوا إحدى عينَيهم، أو لديهم تشوّه أو إعاقة، ونجحوا رغم ذلك في حياتهم وأصبحوا قدوة حسنة في مجتمعهم؟ ففي خلق الله آيات للتأمّل.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":618,"c":87,"d":"2021-01-24","t":"الغش في وسائل النقل العام","q":"السلام عليكم،\n\nأشعر بالخجل لكنني غششت كثيرا في وسائل النقل (أحيانا دون غرامة)، ماذا يجب أن أفعل؟ أنوي دفع غراماتي لكن بالنسبة لما غششته دون أن «يُمسَك بي» ماذا يجب أن أفعل؟ أشعر بشيء من الخجل أن أعترف بذلك لشركة النقل، وإذا فعلت، لكن لم تُحرَّر في حقي مخالفة وكان اعترافي غير كاف، فهل أنا ملزمة بأداء المبلغ؟ لأنني لا أستطيع تقديره فقد فعلت ذلك لسنوات.\n\nشكرا","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلا يجوز الغش في وسائل النقل، وخاصة يحرم تكرار ذلك، لأن الذنب الصغير (الصغيرة) يصبح بالإصرار ذنبا كبيرا.\n\nالمطلوب هو الندم والتوبة الصادقة إلى الله بترك هذه المخالفة فورا، لأن التوبة الصادقة تمحو الذنوب وتبدّلها حسنات بفضل الله تعالى. ثم يجب عقد النية بعزم على ألا تعود أبدا إلى مثل هذا الفعل.\n\nاكتم هذا الأمر ولا تتحدث عنه مع أصدقائك ومحيطك حتى لا تكون قدوة سيئة. أما شركة النقل، فإذا كانت عليك ديون فيجب دفعها، لكنني لا أظن أنه من الضروري أو أن فيه مصلحة أن تُعلمهم بذلك، إلا إذا أردت ذلك. فيمكنك إذن التصدّق بهذا المبلغ، سواء للفقراء والمحتاجين أو لجمعيات خيرية تقدّم خدمات إنسانية مثل كفالة الأيتام وتقديم وجبات للفقراء، إلخ.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":617,"c":85,"d":"2021-01-24","t":"الوعد المتبادل قبل طلب الزواج","q":"السلام عليكم،\n\nأودّ أن أعرف هل يمكن للمرأة أن تعد رجلا بأن تنتظره حتى يأتي لطلب يدها؟ وخلال هذه المدة لا يتحدثان معا ولا يلتقيان.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلا حرج في أن تُعلن المرأة رغبتها في الزواج ممن يملك الخلق والدين، أو أن تنتظر قدومه لطلب يدها، بشرط أن يتم ذلك في إطار احترام القواعد والحدود الشرعية التي حدّدها الدين. إذن لا لقاءات، ولا خلوة، ولا إكثار من تبادل الكلام أو على شبكات التواصل الاجتماعي، لتجنّب أي فتنة أو شبهة، لأن النية الحسنة لا تجعل الحرام حلالا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":616,"c":87,"d":"2021-01-24","t":"هل يجوز للرجل أن يلبس الأقراط؟","q":"السلام عليكم ورحمة الله\n\nسؤالي يتعلّق من فضلك بلبس الرجل للأقراط. هل يجوز في دين محمد صلى الله عليه وسلم أن يلبس الرجل الأقراط؟ هل هو ذنب؟ هل يقول القرآن أو السنة شيئا عن هذا الموضوع؟ بارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلا يجوز للرجل أن يلبس أقراطا أو حليّ الأذن أو شيئا مشابها، سواء كانت من ذهب أو من معدن آخر، لأن في ذلك تشبّها بالنساء، وهو محرّم في ديننا ولا تُقرّه العادات الأصيلة والأذواق السليمة.\n\nومن فعل ذلك فقد ارتكب مخالفة دينية، وهو مدعوّ إلى التوبة والاستغفار إلى الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":615,"c":82,"d":"2021-01-24","t":"هل يجوز شراء المنتجات المقلّدة؟","q":"السلام عليكم يا شيخ،\n\nعلمت مؤخرا أن التقليد حرام. لكنني كنت قد اشتريت كثيرا من الأحذية الرياضية والملابس لأنني لم أكن أملك الوسائل وألبسها كثيرا جدا وهي مزوّرة. هل يجب أن أتخلّص منها؟ إنني ألبسها فعلا كثيرا كثيرا وأظن أن بعضها لا يمكن بيعه بسبب حالته.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبالنسبة للمنتجات المقلّدة كالملابس والأحذية وغيرها، لا يجوز تسويقها وبيعها على أنها علامات أصلية، لأن ذلك يمثّل خداعا وتزويرا محرّما شرعا وقانونا ويضرّ بالمشتري؛ ومن جهة أخرى، يضرّ بصاحب العلامة.\n\nوقد فصّل بعض العلماء المسألة وقالوا إنه إذا عُرضت السلع بطريقة قانونية وكان المشتري على علم بأنها ليست أصلية (بسبب اختلاف السعر والجودة)، وكان المشتري يظن ظنا قويا أنه لن يضرّ بصاحب العلامة الأصلية، فيجوز إذن شراؤها.\n\nصاحب السؤال يصرّح أنه اشترى المقلّد لأنه لم يستطع شراء العلامة الأصلية وأنه فعل ذلك جهلا دون أن يعلم أن هناك كراهية شرعية وأخلاقية في هذا الموضوع. إذن لا لوم عليه، لكن التقوى والورع يقتضيان ألا يعود إلى هذا الفعل حتى لا يتورّط في خداع أو تجاوز تجاه الدين والقانون.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":614,"c":79,"d":"2021-01-24","t":"صيام الاثنين والخميس","q":"السلام عليكم،\n\nبخصوص الصيام التطوّعي يومَي الاثنين والخميس، هل يمكن صيام الاثنين فقط أو الخميس فقط أم أن أحدهما لا يغني عن الآخر؟ عندما نريد صيام الاثنين هل يجب علينا أيضا صيام الخميس إلزاميا؟\n\nشكرا","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nصيام يومَي الاثنين والجمعة ممارسة مستحبّة ثابتة بالسنة، ولا خلاف في ذلك. ومن صام اليومين نال الأجر الكامل بفضل الله وهذا هو الأكمل. وبما أنه عمل تطوّعي وليس واجبا كصيام رمضان، فمن اقتصر على صيام يوم واحد منهما نال أجر ذلك، والفضل من الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":613,"c":85,"d":"2020-11-25","t":"رفض خاطب لا يصلي","q":"السلام عليكم\n\nأنا ضائعة وأحتاج مساعدتكم.\n\nأنا امرأة عمري 38 سنة، أعيش في فرنسا منذ 4 سنوات للحصول على شهادة في الطب وأعمل أيضا كطبيبة.\n\nأنا وحيدة في فرنسا وليس حولي عائلة، الحمد لله ربي معي لكن لديّ أيضا مشاكل صحية أعالجها هنا، وأصاب بإغماءات كثيرة.\n\nتعرّفت على رجل قبل مجيئي إلى فرنسا يكبرني بـ14 سنة وهو مطلّق، وهو شخص محترم ولطيف جدا ونتفاهم جيدا وهو كذلك، لكن المشكلة هي عائلتي.\n\nحدّثتهم عن هذا الرجل منذ 3 سنوات، لكن بالنسبة لهم أستحق أفضل منه، وعندما رأوا أنني مقتنعة بهذا الشخص لأنني أشعر بالراحة معه وهو كذلك، قال لي إخوتي إنه لأنه لا يصلي رغم أنه مسلم (إن الله يهدي من يشاء)، يرفضون أن يكونوا «وليّي» لعقد الزواج الديني.\n\nأنا يتيمة الأب والأم.\n\nأنا مرتاحة مع هذا الشخص، وأرغب في إنجاب طفل إن شاء الله إن أراد الله، وخاصة أن يكون لديّ شخص بجانبي، والله وحده يعلم ما أعيشه يوميا بما أنني وحيدة.\n\nأنا متعبة من هذه الوضعية، لا أعرف إن كان هناك حل لمشكلتي.\n\nوالأدهى من كل ذلك، قبل أسابيع قليلة اكتشفت مشكلة خطيرة في الرحم وقال لي طبيب النساء إنه لم يتبقّ لي وقت كثير لإنجاب طفل، وأنه من الممكن أن يكون ذلك بعدها خطرا عليّ لأنني مصابة بالسكري أيضا.\n\nأعلم أن كل شيء بإذن الله، لكنني أرغب في أن أجرّب حظي في إنجاب طفل مع هذا الرجل.\n\nأنا فعلا ضائعة وحزينة بسبب ذلك.\n\nفهل هناك حل لمشكلتي؟\n\nأحتاج مساعدتكم.\n\nشكرا لتنويري بارك الله فيكم.","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالزواج هو «نصف الدين»، وسنة من سنن الأنبياء، وخلق من أخلاق الصالحين. وهو أيضا طريق العفاف والاستقرار النفسي. ويجب أيضا أن يكون هناك توافق وانسجام في الرأي والفكر بين الشخصين.\n\nوبديهي أن صاحب الاستقامة الدينية أولى، اتباعا لقول النبي (صلى الله عليه وسلم): «إذا جاءكم من ترضون دينه وخلقه فزوّجوه. فإن لم تفعلوا تكن فتنة في الأرض وفساد كبير». والمسلم الصالح يُعرَف بأداء الواجبات وترك المحرّمات، والصلاة عماد الدين.\n\nنصيحتي هي أن تزيدي الحوار مع عائلتك. هل لديهم اقتراحات حقيقية بخصوص مسألة زواجك؟ هل يمكنهم تقديم أشخاص آخرين أجدر؟ ومن جهة أخرى، هل الشخص المعني مستعدّ للتوبة من تركه للصلاة؟ هل لديه الإرادة والإخلاص لأداء واجباته الدينية؟ في ضوء هذه المعطيات، يمكن تصوّر إجابة مقنعة.\n\nتحدّثي وتحاوري مع عائلتك واستمعي إلى وجهة نظرهم لإيجاد أرضية مشتركة لأن الزواج شيء مهم جدا في حياة الإنسان. وابدئي قبل كل شيء بالتوجّه إلى الله وسؤاله العون، وصلّي صلاة الاستخارة، فربما يحدث الله بعد ذلك أمرا جديدا!\n\nأسأل الله أن ييسّر لك وأن يعينك. آمين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":612,"c":85,"d":"2020-11-25","t":"الزنا والتوبة والزواج","q":"السلام عليكم.\n\nأكتب لكم هذه الرسالة اليائسة كأنني أرسل قارورة في وسط المحيط... لكنني أحاول مع ذلك أن أطلب مساعدتكم.\n\nها أنا إذن، منذ سنة وأنا أصاحب شابا في الحرام. لست فخورة بذلك أبدا. قبل أسبوع، تجاوزنا خطا خطيرا جدا لا عودة فيه: لقد زنينا.\n\nأشعر بخجل شديد أن أتحدث بهذه الطريقة، لكنني يائسة وأبحث عن المساعدة أينما أجدها...\n\nمهما يكن، لقد ارتكبنا هذا الذنب الذي لا يُصلَح، لكن هذا الشاب قدّم لي اقتراحا: الزواج لإصلاح هذا الخطأ. تردّدت طويلا لأنني لا أعرف إن كانت هذه فكرة جيدة. هل سنكون سعداء حقا؟\n\nمن جهة، أقول لنفسي إن فعل الحلال لا يمكن إلا أن يكون مفيدا لنا. لكن من جهة أخرى، أقول لنفسي إن الزواج ليس لعبة ويجب ألا يُؤخذ باستخفاف.\n\nأنا ضائعة ولا أعرف ماذا أفعل. لقد صلّيت صلاة الاستخارة حاليا وأنتظر الإشارات. ومن البديهي أنني تبت وما زلت أتوب...\n\nآمل أن أتلقّى إجابة منكم","a":"بسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالزنا ذنب شنيع. يقول الله تعالى: {وَلَا تَقْرَبُوا الزِّنَا ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا}.\n\nغير أن باب التوبة إلى الله مفتوح دائما لمن عاد إليه. يقول الله تعالى في القرآن: {إِلَّا مَن تَابَ وَآمَنَ وَعَمِلَ عَمَلًا صَالِحًا فَأُولَٰئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ ۗ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا}.\n\nيجوز لشخصين ارتكبا الزنا أن يتزوّجا إذا تابا ووضعا نية حسنة لإصلاح الماضي. ويمكنهما الاجتماع بزواج شرعي بعد مرور فترة العدة للمرأة.\n\nفإذا وضعا نية حسنة وتابا توبة صادقة، فإن الله سيعينهما وسيسهّل لهما طريق الخير.\n\nالتوبة الصادقة تفتح باب الأمل وتجدّد وتحيي الروح والحياة. يقول تعالى في القرآن: {وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ}.\n\nأسأل الله أن يصلح حالك وأن يهديك إلى ما فيه الخير.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":611,"c":79,"d":"2020-11-25","t":"الاستِمناء، رمضان والتوبة","q":"مرحبا، اسمي ياسين، وعندما كان عمري 15 سنة كنت مدمنا على الاستمناء، وكنت أفعله في رمضان. لكن بفضل الله تبت، وسأبلغ 17 سنة بعد 3 أشهر، وبدأت أصلي كل يوم، وقد مرّ الآن 3 أسابيع منذ أن توقفت. هل سيغفر الله لي هذا الذنب؟ لأنني نادم كثيرا وأطلب دائما المغفرة من الله. شكرا","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالحمد لله الذي يسّر لك طريق الهداية والطاعة، وأبشر يا بني: إن الله تعالى يفرح بتوبة الشاب الذي يرجع إليه أكثر من فرحه بتوبة غيره من الناس. أسأل الله أن يثبتك على الإيمان والعمل الصالح.\n\nأما فيما يتعلق بالاستمناء، فإنه يبطل الصوم بلا شك. فيجب التوبة والاستغفار من الله تعالى، مع الندم والعزم على ألا يعود إلى هذا الذنب أبدا؛ بل ويجب قضاء أيام الصوم التي أُبطلت.\n\nوأما الكفارة، وهي صيام شهرين متتابعين أو إطعام 60 مسكينا لمن أفطر في صومه الواجب عمدا دون عذر شرعي معتبر، فهي محل خلاف في حالتنا هذه.\n\nفإذا كانت هذه الكفارة واجبة في المذهب المالكي، فإن جمهور العلماء لا يوجبونها في هذا الفعل؛ بل يكفي قضاء عدد الأيام التي أُبطلت، بعد التوبة، مع الإكثار من طلب المغفرة.\n\nوالتوفيق والعون من الله عز وجل.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":610,"c":87,"d":"2020-11-25","t":"تغيير الاسم الشخصي عند الدخول في الإسلام","q":"السلام عليكم ورحمة الله وبركاته\nاعتنقت الإسلام منذ بضعة أشهر الآن، وبدأت أطرح على نفسي أسئلة حول اسمي الشخصي، لأني عند بحثي عن معناه (Laetitia) وجدت هذا:\n«التاريخ: منذ القرن الثاني عشر، لقي اسم Laëtitia نجاحا معينا، لا سيما بفضل المسيحية. ففي الواقع، هو مرتبط بالسيدة مريم العذراء والعبادة التي تُقدَّم لها. وبما أنه لا توجد قديسة اسمها Laëtitia، فإننا نعبد سيدة الفرح (Notre-Dame de Liesse) عند ذكره. لاحقا، أصبحت كلمة \"liesse\" مرادفة للفرح والسعادة. وفي البلدان البريطانية، أعطى الاسمُ المتغيرَ Lettice. وبقي اسم Laëtitia رائجا على مدى القرون، لكن نجاحه الكبير لدى الآباء كان خاصة في النصف الثاني من القرن العشرين.»\nهل يدخل هذا في ضوابط الإسلام؟\nوإن لم يكن، فهل لتغيير الاسم الشخصي يجب أن أفعله رسميا في البلدية؟ أم أكتفي بأن يناديني الناس بالاسم الذي سأختاره مع إبقاء اسمي الأصلي في أوراقي؟\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nتغيير الاسم الشخصي ليس واجبا ولا شرطا لمن يدخل في الإسلام. فقد حافظ أصحاب النبي (صلى الله عليه وسلم) عموما على أسمائهم بعد دخولهم في الإسلام.\n\nأما في الحالات التي يتضمن فيها الاسم معنى شركيا أو ما يتعارض مع التوحيد وأسس العقيدة، فإنه من البديهي أن يجب تغييره.\n\nأما بالنسبة لاسمك الشخصي، الذي له على الأرجح علاقة بالمسيحية، فإننا لا نعرف معناه الدقيق بالتحديد. ومن المستحب أو المندوب تغييره لكنه ليس واجبا على كل حال.\n\nوفيما يتعلق بتغيير الاسم الشخصي في الوثائق الرسمية، في حالة رغبة الشخص المتحول إلى الإسلام في ذلك، فهذا يعتمد على البلدان والقوانين والإجراءات... فإذا كانت الإجراءات الإدارية سهلة وميسورة فليغيره، وإلا أمكنه الاحتفاظ به في أوراقه وأن ينادى باسمه الجديد. فلا حرج في الدين، والأهم هو الإخلاص والعمل الصالح.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":609,"c":77,"d":"2020-11-25","t":"التوقف عن الذهاب للصلاة في المسجد بسبب كوفيد","q":"سلام،\nمنذ بضعة أسابيع لم أعد أذهب إلى المسجد حتى يوم الجمعة، لأن والدي يأمرني ألا أذهب حتى لا أصاب بالعدوى من الفيروس. أنا خائف جدا لأني أخشى الله. هل يجب أن أطيع والدي أم أذهب إلى المسجد؟\nأود أن أوضح أنه في بعض المساجد يصلون بالكمامة ومع التباعد. فهل يجوز الصلاة هكذا؟","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالصلاة جماعة شعيرة عظيمة من شعائر الدين، من أجلها بُنيت المساجد ورُفع الأذان، لما فيها من الخير العظيم والبركات التي لا تُحصى للفرد والجماعة. ولهذا، يرى معظم العلماء أنها واجبة، ولا يجوز تركها إلا لعذر معتبر (مرض، عمل، انعدام أمن).\n\nوقد أصدر عدد من العلماء المعاصرين فتوى عقب هذا الوباء (كوفيد)، تجيز لكبار السن والمرضى والأطفال، ولكل من يخشى أن يُصاب بهذا الفيروس أو أن ينقله إلى غيره، عدمَ حضور صلاة الجماعة، تطبيقا لقاعدة «لا ضرر ولا ضرار».\n\nوبناء على ذلك، إذا كان هذا الضرر محتملا أو مؤكدا فيجب اجتنابه واتباع نصيحة الأب؛ أما إذا كان مستبعدا ولوحظت شروط السلامة والوقاية، وتوفرت شروط صلاة الجماعة، فالأفضل في هذه الحالة أداؤها في المسجد مع إخبار الأب، بشرط ألا يسبب ذلك خلافا في الأسرة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":608,"c":76,"d":"2020-11-25","t":"هل الغسل الأكبر ضروري للدخول في الإسلام؟","q":"السلام عليكم ورحمة الله وبركاته،\nها أنا ذا اعتنقت الإسلام، والحمد لله. لكن للأسف لم أبدأ الصلاة بعد، فقد نطقت بالشهادة فقط ولم أغتسل الغسل الأكبر. فهل عدم اغتسالي الغسل الأكبر يمنعني من أن أكون مسلمة حتى وإن نطقت بالشهادة؟\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالإيمان إقرار باللسان، واعتقاد بالقلب، وتطبيق للأركان. والأصل في ذلك الاعتقاد والإقرار الباطني مع صدق النية.\n\nفإذا كان نطقك بالشهادتين قد تم بوعي وعن قناعة وصدق، فهو صحيح والاعتناق صحيح. والغسل (الاغتسال الأكبر) ليس شرطا للدخول في الإسلام، بل هو أمر مستحب.\n\nومع ذلك، يجب أن نؤكد على أهمية الصلاة التي هي عماد الدين وصلة بين العبد وخالقه. فيها يخاطب ربه ويتقرب إليه. وتركها ذنب.\n\nسنأخذ بعين الاعتبار أن هذه الشخص دخلت حديثا في الدين، لكن من واجبنا لفت انتباهها إلى أهمية أداء الصلاة وتحذيرها من سوء عاقبة تركها. فيجب عليها أن تبذل جهدا لأدائها ولو تدريجيا، ونحن نشجعها على ذلك سائلين الله أن يثبتها ويمنحها فضله ورضوانه.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":607,"c":82,"d":"2020-11-25","t":"شراء تذاكر مباريات كرة القدم وبيعها بسعر أعلى","q":"السلام عليكم،\nأشتري تذاكر مباريات كرة القدم وأبيعها بسعر أعلى.\nأود أن أعرف هل هذا المال حرام أم لا؟\nشكرا مقدما على مساعدتكم.","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا كانت مباريات كرة القدم هذه خالية من كل محظور شرعي، فتنطبق القاعدة: «الأصل في الأشياء الإباحة». فهذا جائز من حيث المبدأ. ومع ذلك، يجب التأكيد على وجوب احترام القانون. فإذا كانت الأنظمة والقرارات تمنع مثل هذه الممارسة، فيجب الامتناع عنها. ويجب أيضا مراعاة هامش ربح معقول وعدم استغلال حاجة الناس.\n\nوعلى السائل أن يعلم أن أبواب الكسب الحلال كثيرة، وأن العاقل يجب أن يبحث عنها حتى لا يقع في الحرام، وأن ترك ما فيه شبهة مطلوب.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":606,"c":85,"d":"2020-11-25","t":"كيف نفعل إذا تعذَّر حضور الولي في الزواج؟","q":"السلام عليكم،\nهل يمكنكم إفادتي من فضلكم. أنا امرأة عمرها 35 سنة، مطلقة، أعيش في الجزائر وخطيبي في فرنسا، وكلانا مسلم، وسألتحق به قريبا لنتزوج.\nالسؤال الذي أود طرحه عليكم هو: هل يكفي الزواج المدني أم يجب الزواج الديني؟ علما أن خطيبي طلب يدي من أخي وقد وافق.\nالحصول على التأشيرة صعب، فسأسافر وحدي، ولن يكون معي أخي ولا أحد من عائلتي، أي لا ولي بجانبي.\nهل الزواج الديني واجب بعد الزواج المدني أم لا؟ وإن كان واجبا فكيف نفعل دون حضور الولي من فضلكم؟","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالولي من أركان الزواج الإسلامي، وبدونه لا يمكن إتمام الزواج. «لا نكاح إلا بولي»، لقول النبي (صلى الله عليه وسلم).\n\nفي حالتنا هذه، يوجد الزوج في بلد آخر ولا يستطيع الانتقال لإتمام عقد الزواج في بلد المرأة. والحل الممكن يكمن في التوكيل، لأن عقد الزواج من العقود التي يجوز فيها التوكيل.\n\nفيمكن للزوج أن يوكل شخصا ثالثا لإبرام العقد نيابة عنه؛ وله الحق في اختيار شخص ثقة ليمثله في إتمام عقد الزواج بالوكالة.\n\nوإذا كانت المرأة قد سافرت إلى فرنسا، فيمكن لولي المرأة أيضا أن يوكل من ينوب عنه لتزويج من هي تحت ولايته، مع إعطاء الأولوية لأقرب الأقارب. فإن لم يجد، أمكنه توكيل من يمثل الجالية المسلمة في ذلك البلد.\n\nولا يصح الزواج دينيا إلا بعقد يتم بحضور الولي والشهود، واستكمال شروطه المعروفة في الشريعة الإسلامية. والعقد المدني لا يكفي.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":605,"c":87,"d":"2020-11-25","t":"هل يجوز إجراء عملية للثدي المترهل؟","q":"السلام عليكم ورحمة الله وبركاته،\nعمري 21 سنة ولدي ترهل ثديي مهم جدا، الثدي يشير حقا إلى الأسفل، وهذا يسبب لي حاجزا حتى في الزواج للأسف لأنه يعقدني كثيرا.\nأود أن أعرف هل هو حرام أن أخضع لعملية لرفعهما فقط دون أي إضافة؟","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلقد عالج علماء الفقه الإسلامي هذه المسألة، والخلاصة كالتالي:\n\nإذا كان هذا الترهل خارجا عن المعتاد، وكان مؤذيا ولا يُحتمل، أو كان يمثل تشوها، جاز علاجه. أولا بالأدوية أو العلاجات التي تساعد على شد الثدي، وفي حال عدم حصول نتيجة، جاز استثناء إجراء عملية حسب الحالة والضرورة، و«الضرورة تُقدَّر بقدرها» كما تنص القاعدة. فيجوز فقط إزالة التشوه المؤذي بحيث لا تتحول العملية إلى فعل من «تغيير خلق الله»، وهو محرم في الدين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":603,"c":85,"d":"2020-09-16","t":"رفض طلب الزواج من رجل بلا عمل","q":"السلام عليكم،\nأتوجه إليكم لأني تلقيت طلب زواج من رجل درس الإسلام في مصر. يُقال عنه إنه ذو علم غزير في العلوم الإسلامية، من عائلة طيبة، وحسن السلوك عموما. سألني ما هي شروطي في الزواج؟ أجبته: أن يكون زوجي صالحا لنفسه ونافعا للناس (صالح لنفسه ومصلح لغيره). وأن يكون قادرا على تأمين الاحتياجات المالية لأسرته (مهنة مستقرة). فأجابني بأني كنت مخطئة في رفض طلب زواج من شخص تقي فقط لأنه بلا عمل. وقدّرت أنه غير قادر على تأمين الاحتياجات الأساسية لأسرته ماليا. هذا هو سبب رفضي.\nأود أن أعرف من الناحية الفقهية هل كنت مخطئة أم مصيبة في رفضي لأني لا أريد أن أتعرض لغضب الله.\nجزاكم الله خيرا","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي هذا الموضوع المتكرر، يجب التمييز بين شيئين. ففي العلم الشرعي مفهومان:\n\n- «الرخصة»، أي التخفيف والتيسير والإذن؛\n\n- ونقيضها «العزيمة»، أي العزم وأداء الواجب دون اعتبار العوائق.\n\nمن الناحية الفقهية، الأمر الوارد في الحديث: «إذا جاءكم من ترضون دينه وخلقه فزوجوه» يُعد عملا مندوبا. وفي تصنيف الأعمال، العمل المندوب يُثاب على فعله، وتركه ليس إثما.\n\nثم إنها مسألة درجة إيمان وتقوى وعزم على التقرب إلى الله. فالمؤمن على يقين أن الرزق من الله وهو وحده الرزاق. وكل عمل مبني على النية، والأصل في هذا الأمر هو الدين والخلق. قال الله تعالى: «وأنكحوا الأيامى منكم والصالحين من عبادكم وإمائكم إن يكونوا فقراء يغنهم الله من فضله» (سورة 24، الآية 32).\n\nويجوز للمرأة أن تتزوج رجلا ذا إيمان ودين لكن موارده المالية محدودة، وأن تصبر معه إن شاءت. وهذا خيار شخصي من التقوى.\n\n«ومن يتق الله يجعل له مخرجا، ويرزقه من حيث لا يحتسب ومن يتوكل على الله فهو حسبه» (سورة 65، الآيتان 2-3).\n\nويجب أيضا التمييز بين من لا يعمل بسبب وضع لا إرادي ومؤقت، ومن لا يعمل بسبب الكسل، وهو عاجز عن تأمين الحد الأدنى من الاحتياجات الأسرية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":602,"c":86,"d":"2020-09-16","t":"تزوجت تحت ضغط والدتها","q":"السلام عليكم\nتزوجت رجلا لا أحبه بسبب ضغط والدتي (استسلمت لإرضائها) واليوم أنا نادمة. لا أسكن بعد مع هذا الرجل ولا أرى نفسي معه، ولا أتصور مستقبلي معه. أريد الطلاق لكني تحدثت إلى والدتي فأخذت الأمر بشكل سيئ جدا (شعور بالضيق، نوبة). أخاف أن أؤذيها وأن تضر قراري بصحتها.\nما النصيحة التي يمكنكم تقديمها لي؟","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nقال الله تعالى:\n\n«ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودة ورحمة إن في ذلك لآيات لقوم يتفكرون».\n\nالخطأ الذي ارتكبته الأخت منذ البداية هو أنها ارتبطت برجل لا تحبه، بهدف وحيد هو إرضاء والدتها.\n\nعليها الآن أن تطرح على نفسها الأسئلة الصحيحة، وأن تفكر في الضرر الذي قد يلحق بوالدتها إذا طلقت، والضرر الذي قد يلحق بها هي نفسها إذا استمرت. والقاعدة في الإسلام هي: «لا ضرر ولا ضرار».\n\nفي الآية المذكورة أعلاه، تحدث الله تعالى عن المودة والرحمة، لأن الحب والمشاعر أمور تأتي وتذهب، ومن نحبه اليوم قد ننفصل عنه أو حتى نكرهه في المستقبل، أو العكس.\n\nهل هناك أمل في أن تتغير مشاعرها تجاه الرجل الذي عقدت معه الزواج؟ فقد يضع الله بينهما المودة مع المعاشرة وحسن سلوك الزوج؟ وإلا فهل يمكن التحدث معه بصراحة وإخباره بحقيقة مشاعرها وتحمل العواقب؟\n\nهل تظن أن الطلاق هو الحل؟ وهل سيجلب لها الراحة والاستقرار النفسي بعده؟...\n\nهي وحدها من يمكنها أن تعرف أي الوضعين أقل إيلاما. وعليها أن تتوجه إلى الله بالدعاء وتسأله أن ييسر لها حالها، ونسأل الله أن يمنحها مخرجا حسنا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":601,"c":85,"d":"2020-09-16","t":"هل يجوز الزواج مجددا بعد الطلاق ثلاثا؟","q":"السلام عليكم\nسؤالي يتعلق بالطلاق. قبل سنتين ونصف تطلقنا. زوجي السابق نطق 3 مرات «أنت طالق»، ولم يكن في حالة غضب وكان سليم العقل. اليوم يريد أن نتزوج من جديد. لأنه يقول إن نيته لم تكن طلاقا نهائيا.\nأود أن أعرف هل الزواج من جديد بيننا جائز في نظر الله؟ لأني قرأت أن الطلاق المنطوق 3 مرات يجعل المرأة غير حلال للرجل (إلا إذا تزوجت للأسف من رجل آخر ثم طُلقت منه أو ترملت...)\nهل يمكنكم إفادتي بارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالرأي الفقهي المعتبر والمعمول به هو أن نطق صيغة الطلاق ثلاث مرات في مجلس واحد يُعد طلقة واحدة. وحتى لو كرر الزوج صيغة الطلاق عدة مرات، فسيُعد ذلك مجرد تأكيد وتكرار. وهذا هو الرأي الذي اختاره شيخ الإسلام ابن تيمية وعدد من العلماء بعده، بهدف الحفاظ على الأسرة وتجنب الفتنة والفساد.\n\nوبناء على ذلك، إذا رغب الزوج في الزواج من جديد بزوجته السابقة، وانقضت عدتها، فعليه أن يعقد الزواج من جديد بشروطه المعروفة في الدين (الولي، المهر، الرضا، الشهود).\n\nوعليه أيضا أن يحسن النية ويريد أن يجعل من هذا الزواج سببا للسعادة الأسرية وحسن المعاشرة، لأن ذلك من المقاصد الشرعية المرجوة من الزواج.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":600,"c":77,"d":"2020-09-16","t":"جمع الصلوات في بعض المساجد أثناء كوفيد","q":"السلام عليكم\nحاليًا مع كوفيد19 في مساجدنا نجمع صلوات المساء. لكن بعض الأشخاص يصلون متأخرين بينما نكون قد أدينا المغرب وسنبدأ العشاء.\nأود أن أعرف كيف يجب أن أتصرف إزاء ذلك؟\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيجوز جمع صلاتي الظهر والعصر وكذلك المغرب والعشاء بسبب المطر أو المرض أو الوباء وغير ذلك.\n\nوقد اختارت بعض المساجد الجمع أثناء وباء كوفيد-19. فإذا وصل بعض الأشخاص متأخرين بعد انتهاء أداء المغرب، فما عليهم إلا أن يقضوا هذه الصلاة، ثم يؤدوا العشاء إن كان ذلك لا يزال ممكنا، وإلا عادوا وأدوا العشاء في بيوتهم مع عائلاتهم.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":599,"c":85,"d":"2020-09-16","t":"ما مدة فترة العدة؟","q":"السلام عليكم\nبعد علاقة في الزنا، ما هي فترة التوبة الدقيقة؟\nالبعض يقول انتظر شهرا واحدا قبل الزواج، وتسمى أيضا «فترة الاستبراء» للمرأة، والبعض الآخر يقول لا تنتظر.\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفترة الفصل بين شخصين عاشا علاقة جسدية غير شرعية قبل أن يتزوجا زواجا شرعيا يشترطها عدد من العلماء. وهي معروفة بـ«الاستبراء» أو العدة للمرأة، وتتحقق بحيضة واحدة على الأقل، وحتى ثلاث حيضات.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":598,"c":87,"d":"2020-09-16","t":"كيف نتعامل مع من يستشير العرافين","q":"السلام عليكم ورحمة الله.\nباسم الله والحمد لله. والصلاة والسلام على محمد.\nأشكركم على دوركم في الإسلام. عسى أن يمنحكم الله أجرا سخيا.\nسؤالي هو التالي:\nما هو حكم الشخص الذي يستشير المشعوذين ويستخدم منتجاتهم النتنة لحل أموره مع السعي لإيذاء الناس؟\nكيف نتعامل مع هذا الشخص إذا كان أخاك؟\nهل يجوز الجلوس معه، والأكل من نفس الصحن معه، والنوم في نفس الفراش معه؟","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي الحديث: «من أتى عرافا أو كاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد».\n\nهذه الممارسات غير جائزة وهي من الشرك. فالمؤمن يؤمن بالقضاء والقدر
