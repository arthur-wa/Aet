، ويجب أن يدعو الله ويفوض إليه كل أموره ويتوجه إليه لحل أموره.\n\nأما كيفية التعامل مع الشخص المبتلى بمثل هذه الأفعال، فيجب نصحه بحكمة، وتذكيره ووعظه، ولا نبتعد عنه إلا بقدر الضرورة؛ فإذا كان من العائلة، فلا بأس في الأكل أو النوم معه، بل على العكس يجب دعوته إلى التوبة بأن نكون قدوة ومثالا حسنا له في سلوكنا.\n\nيجب العناية بصلة الرحم في كل ما يلين القلب ويبعث على المحبة، كما يجب العفو عمن يرتكبون الزلات، لأنه كلما انحدر شخص إلى مقابلة الشر بالشر، تضاعفت الشرور عليه وتكسرت أموره.\n\nيُنصح بعدم منازعة المراكز التي وضع الله فيها بعض الناس، وهي مراكز لا تُحمد لا في الشرع ولا في الآداب الحسنة. ولا يجوز ذلك إلا في الحالة التي يأمر فيها الشرع بالتصرف ضدهم، بالتحريض والزجر، في بعض الحالات والظروف الخاصة، في أوقات معينة وليس طوال الوقت. ويجب الوقوف عند قول النبي (صلى الله عليه وسلم) الذي يقول:\n\n«مروا بالمعروف وانهوا عن المنكر. فإذا رأيت شحا مطاعا، وهوى متبعا، وإعجاب كل ذي رأي برأيه، فعليك بنفسك».\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":597,"c":87,"d":"2020-09-14","t":"الحيوانات والجنة","q":"السلام عليكم،\nقد يبدو سؤالي غريبا، لكن مهما بحثت لا أجد إجابات دقيقة.\nأمارس الدين بجد، والحمد لله، وعند كل وفاة لقريب، رغم الحزن الذي لا يُطاق، أعزي نفسي بقولي إنه إذا استحققنا أن نكون في الجنة سنلتقي من جديد، فهو إذن مجرد وداع، في هذه الحياة الدنيا الزائلة.\nلكنني أعمل أيضا كثيرا من أجل الحيوانات عموما (التي أراها في الشارع، أعطيها الأكل والشرب)، ولدينا قطة وكلب منذ عدة سنوات. اعتنيت بهما منذ ولادتهما، أسهر عليهما عندما كانا مريضين، أعالجهما، ألعب معهما. نحبهما كثيرا. للأسف، بدآ يكبران في السن، وتعلقي بهما قوي بشكل لا يُصدق. أعلم أنهما سيرحلان في النهاية... ولا أعرف إن كنت سأتمكن من رؤيتهما في الجنة إن شاء الله، إذا رأى الله أنني أستحق ذلك...\nالسؤال هو التالي: إذا قدّر الله أنني أستحق الجنة ودخلتها، إن شاء الله، هل تظنون أنني سأتمكن من لقاء قطتي وكلبي للأبد؟ فمحبتي لهما عظيمة...\nأشكركم على إجابتكم","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي الواقع، قال الله تعالى في القرآن الكريم: «وما هذه الحياة الدنيا إلا لهو ولعب وإن الدار الآخرة لهي الحيوان لو كانوا يعلمون».\n\nفالإحسان إلى الحيوانات عمل خير وتقوى، وعمل صالح سيجد المؤمن أجره يوم القيامة.\n\nوما يدخل في مجال الغيب وما سيحدث في الآخرة لا يعتمد على تفكير شخصي أو تخمين اعتباطي، فبعض المواضيع الأساسية واضحة ومجمع عليها، بينما بعض الفروع والمسائل الثانوية كانت فيها آراء وتفسيرات مختلفة.\n\nأما مصير الحيوانات، فيخبر القرآن: «وإذا الوحوش حشرت» (سورة 81، الآية 5)، وفي الحديث: «إن الله ليقضي بين كل ما خلق: الإنس والجن والحيوان».\n\nوقد رُوي أيضا أن بعض الحيوانات المذكورة في القرآن ستدخل الجنة.\n\nوروى الترمذي أن النبي (صلى الله عليه وسلم) قال: قال الله: «أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر»، فلا يجب أن نقلق بشأن مصير الحيوانات لأن الله عادل وقد حرّم على نفسه كل ظلم.\n\nنسأل الله أن يجعلنا وإياكم من أهل الجنة. آمين\n\nإضافة\n\nرُوي أيضا في «رفع النقاب» أن الصحابي الكبير لسيدنا أحمد التجاني (رضي الله عنه) والوسيط النبيل سيدي محمد بن العربي الدمراوي سُئل عن الفئة الاستثنائية من الحيوانات التي ستدخل الجنة وهل توجد درجات تفرق بينها. فاعتذر أولا لعدم امتلاكه علما بهذا الشأن، ثم سأل النبي (صلى الله عليه وسلم) أثناء رؤية في اليقظة فأجابه:\n\n«إن أرواح الحيوانات التي ستدخل الجنة كلها في درجات مختلفة، سيخلق الله لها أراضي واسعة فيها أنوار شديدة وأعشاب متنوعة هي متعة للنظر بلونها ورائحتها، وستنبت بقدر ما يُستهلك منها. وأعظم الحيوانات فضلا هي التي ركبها الأنبياء (عليهم السلام)، ثم التي ركبها الصحابة والخلفاء في عهدهم، ثم تأتي بعد ذلك حيوانات المجاهدين في سبيل الله، ثم حيوانات المنف...»\n\n[ملاحظة: إجابة المصدر مقطوعة هنا في منتصف الجملة]"},{"id":596,"c":85,"d":"2020-09-14","t":"الزواج الإجباري: ماذا نفعل؟","q":"السلام عليكم،\nصديقتي في وضعية معقدة، فقد زُوجت إجبارا دينيا ومدنيا في الجزائر، لكن الرجل لم يحصل بعد على أوراقه، وهي تريد مغادرة بيتها لهذا السبب وأيضا لأن والديها يجعلانها تعيش جحيما، لكن والديها قالا لها إنها إن غادرت البيت فلن يكلمانها أبدا، وفي الإسلام حرام قطع الصلة بالوالدين، فماذا يجب عليها أن تفعل من فضلكم؟\nشكرا","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلا حول ولا قوة إلا بالله!\n\nلا يجوز للولي أن يجبر على الزواج من هي تحت مسؤوليته، خاصة إذا لم يكن لها في ذلك أي مصلحة. فإذا زُوجت هذه المرأة إجبارا، فهي ضحية جهل والديها، وكان عليها أن تعلن رفضها صراحة أمام القاضي عند إبرام عقد الزواج.\n\nأولا، لا أنصحها بمغادرة البيت بهذه الطريقة. ثم إن مثل هذه الوضعية لا يمكن معالجتها عن بعد، خاصة وأن عدة عناصر تنقصنا: ما مدة هذا الزواج؟ هل الزوج رجل يتقي الله ويعاشرها بالمعروف؟ هل حاولت التحدث والنقاش معه؟ هل تظن أنها تستطيع الصبر، فلعل الله ينزل المحبة والمودة في زواجهما؟ وعدة عناصر أخرى يجب أخذها بعين الاعتبار حسب الحالة. وعلى الأخت أن تفكر في الشر والعواقب السيئة المحتملة إذا غادرت البيت.\n\nنسأل الله لها أن يصلح حالها الصعب وأن يبدله بحال ومخرج حسن.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":595,"c":77,"d":"2020-09-14","t":"النطق السيئ في الفاتحة","q":"السلام عليكم شيخ،\nأود أن أعرف هل يجب أن أعيد صلواتي؟ لأني عندما أتلو سورة الفاتحة، أكرر كثيرا صوت الراء في كلمة «غير». أحيانا أنجح في تصحيح أخطائي وأحيانا لا، مما يجعلني أعيد الكلمة 3 مرات دون أن أنجح في نطقها.\nهل يجب أن أعيد صلواتي؟ لأن هذا يحدث لي طوال الوقت وحتى عندما أعيدها يحدث أن أخطئ من جديد.\nبارك الله فيك وحفظك الله.","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nتلاوة الفاتحة واجبة في الصلاة، وهي من أركانها، لحديث النبي (صلى الله عليه وسلم) الذي بموجبه لا تصح صلاة من لم يتل الفاتحة.\n\nويجب أن نعلم أيضا أنه يجب تلاوتها بكل كلماتها وحروفها وحركاتها؛ ويحرم ارتكاب خطأ أو انحراف عمدا في تلاوتها.\n\nهذا الأخ لديه مشكلة في نطق حرف «الراء»، فعليه إذن أن يبذل جهدا لتصحيح تلاوته، وأن يتدرب ويتمرن مع شخص مختص مثل شيخ قرآن معتمد.\n\nومع ذلك، فهو غير ملزم بإعادة صلواته في كل مرة بسبب النطق السيئ لحرف، وذلك لتجنب المشقة والحرج.\n\nويجب أن نعلم أيضا أنه إذا صلى جماعة، فإن الإمام يتحمل مسؤولية التلاوة، مما يجنبه هذه المشكلة.\n\nهذا الأخ في طور التعلم ولا حرج عليه إن شاء الله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":594,"c":82,"d":"2020-09-14","t":"هل يجوز بيع القطط؟","q":"السلام عليكم أيها الإمام العزيز،\nأود أن أعرف هل بيع القطط الأصيلة محرم؟ فقد تجولت على الإنترنت وقليل من الآراء تُعطى هناك ومعظمها يختلف حسب المذاهب.\nأود إذن أن أعرف، لأني أنوي الشروع في تربية قطط أصيلة بنغالية.\nفهل تربية وبيع القطط الأصيلة حرام؟ مكروه؟ أم مباح؟\nبارك الله فيك!","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي الواقع، طائفة من العلماء تحرم بيع القطط تبعا للحديث الذي رواه أبو داود والترمذي عن جابر (رضي الله عنه) أن النبي (صلى الله عليه وسلم) نهى عن ثمن الكلب والسنور.\n\nومع ذلك، اختار جمهور أهل العلم الجواز تبعا لعدة فهوم، إما باعتبار أنه مكروه فقط، وليس محرما، أو أنه يخص السنور الوحشي فقط، أو باعتبار أن الحديث ضعيف...\n\nوبناء على ذلك، لا بأس في اقتناء هذا النوع من القطط، وتربيتها مباحة أيضا بشرط الاعتناء بها جيدا واحترام معايير وشروط التربية الحسنة قدر الإمكان.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":593,"c":85,"d":"2020-09-14","t":"علاقة غير شرعية، توبة ومهلة الاستبراء","q":"السلام عليكم،\nأخ متزوج منذ أكثر من سنتين. للأسف، قبل زواجه، كانت له ولزوجته علاقات حميمة.\nلم ينتظرا مهلة الاستبراء، وحتى وإن تزوجا لتجنب الوقوع في الذنب، فهو يشك في أن التوبة كانت على الوجه الصحيح.\nرأينا مؤخرا أن بعض العلماء يجعلون التوبة ومهلة الاستبراء شرطين ضروريين لصحة الزواج، بينما آخرون لا يجعلونهما شرطي صحة. نحن تائهون بعض الشيء. هل يجب عليه إعادة الزواج؟\nبارك الله فيك","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالزنا فاحشة عظيمة وذنب كبير، وشره خطير على الفرد والمجتمع. قال الله تعالى: «ولا تقربوا الزنا إنه كان فاحشة وساء سبيلا». ومن ابتلي بهذه الفاحشة فعليه أن يتوب توبة نصوحا ويرجع إلى الله ويكثر من الاستغفار.\n\nقال الله تعالى في القرآن: «والذين لا يدعون مع الله إلها آخر ولا يقتلون النفس التي حرم الله إلا بالحق ولا يزنون ومن يفعل ذلك يلق أثاما. يضاعف له العذاب يوم القيامة ويخلد فيه مهانا. إلا من تاب وآمن وعمل عملا صالحا فأولئك يبدل الله سيئاتهم حسنات وكان الله غفورا رحيما».\n\nثم إذا تاب من ارتكب الزنا توبة نصوحا جاز لهما الزواج. وجمهور العلماء يرون أن الزواج بالمرأة التي زنى بها زواج صحيح دينيا.\n\nويوجد فعلا خلاف فيما يتعلق بفترة استبراء المرأة التي ارتكبت هذا الذنب: فالحنابلة والمالكية يرون أن مراعاتها واجبة؛ أما رأي الحنفية والشافعية فأنها غير واجبة.\n\nوبناء على ذلك، وانطلاقا من المبدأ المشجع على التوبة وإصلاح الأخطاء، وتبعا لقاعدة التيسير في الدين، نأخذ بالرأي الذي يرى أن هذا الزواج صحيح ما دامت شروطه الأساسية قد روعيت، وأنصح الزوجين بالإكثار من الاستغفار والدعاء وحسن الظن بالله عز وجل.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":592,"c":87,"d":"2020-09-14","t":"أكل طعام يحتوي على الكحول عن طريق الخطأ","q":"سلام\nلدي سؤال كبير من فضلكم، أكلت طبقا أساسه الكريمة وفي المنتصف أحسست بطعم غريب، تذوقت مرة أخرى لكني لم أحس بالطعم مرة ثانية، ثم قرب النهاية أحسست بطعم فتوقفت ثم ذهبت لرؤية الطباخ المعني وسألته إن كان هناك نبيذ أو غيره، وكان هناك نبيذ، والآن أخاف ألا تُقبل صلاتي...","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلقد أكلت عن طريق الخطأ طبقا كان يحتوي على قليل من النبيذ في مكوناته. لا بأس في ذلك إن شاء الله، لأن الله قد عفا لهذه الأمة عن الذنوب المرتكبة خطأ أو نسيانا أو ما أُكرهوا عليه.\n\nأما فيما يخص الصلاة، فهي صحيحة أيضا، مثل الوضوء، لأن ذلك لا علاقة له بالصحة الفقهية للصلاة.\n\nوما عليك إلا أن تنتبه في المستقبل لما تأكله.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":591,"c":85,"d":"2020-09-14","t":"علاقة غير شرعية ثم زواج شرعي","q":"السلام عليكم\nأود أن أطرح عليكم سؤالا من فضلكم يتعلق بزواج أخي. أخي قبل بضع سنوات كان يرافق فرنسية مسيحية. كانت والدتي دائما ضد ذلك لأنها فرنسية وكانت تريد أن يتزوج جزائرية مسلمة. ورغم أن والدتي كانت ضد ذلك، غادر أخي مع هذه المرأة من يوم إلى آخر عشية رمضان قائلا لوالدتي: سأغادر بيت العائلة وسأسكن معها.\nكانت والدتي ضده فغادر، وبعد مدة أخبرنا أنه عقد الزواج الديني معها بالفاتحة وأنه لم يسكن معها في الحرام. هذه كلمته، ولم يصر لا والدي ولا والدتي ولا أحد من عائلتي\nعلمنا بعد بضعة أشهر أن هذه الفتاة قد اعتنقت الإسلام في المسجد. وعلمنا أيضا بعد ذلك أنها حامل، وبعد 9 أشهر من مغادرة أخي وُلد ابن أخي.\nمرت السنوات ووالدتي ما زالت ترفض هذا الاتحاد وحتى مع وجود طفل ترفض الاعتراف به معتبرة إياه ابن زنا...\nذهبت إلى العمرة ومنذ ذلك الحين قبلت أن تتحدث وتستقبل أخي في بيتها دون أن تتحدث عن الطفل أو تراه هو أو المرأة.\nسنحت مناسبة في العائلة، أختي نظمت عقيقة ابنتها ودعت كل العائلة فالتقينا جميعا، فرأت ابن أخي لأول مرة دون أن تحدث فضيحة.\nجاء عيد 2020 فأحضر أخي زوجته وابنه إلى بيتي أنا الأخت الثانية فرأت أيضا المرأة دون أن تكلمها والابن. تكلمت معه وبذلت جهدا لتكلمه وتلعب معه وتقدم له هدية.\nظننا أن الأمور ستتحسن شيئا فشيئا حتى قبل 3 أيام حيث غيرت رأيها فجأة وعادت إلى مواقفها، لا تريد أن تسمع عن هذا الطفل ولا عن زوجته. تشتم أخي قائلة إنها تخجل منه لأنه تزوج فتاة غير عفيفة ليست معتنقة بل معتنقة فقط من أجل أخي، وتقول له إنها غير راضية عنه ولن ينال بركتها أبدا.\nالحالة اليوم هي أن العائلة كلها مضطربة، أخي يرى أنه لم يفعل شيئا سيئا ولا يريد الاتصال بوالدتي بعد، ووالدتي لا تريد أن تسمع عن أخي بعد. أخي يحظى بدعم كل العائلة من جهة الأم، الأعمام والخالات الذين يتفقون معه، ويرى أن والدتي هي المخطئة وأنها قاسية جدا لأنه بما أن الجميع معه فهي المخطئة.\nأتوجه إليكم اليوم إذن لتعطونا رأيا دينيا.\nمن المخطئ؟ من يتصرف بشكل صحيح؟\nماذا نفعل لحل هذه المشكلة؟ ماذا نفعل لتلطيف سلوك أخي ووالدتي؟ وقبل كل شيء ماذا يقول ديننا الجميل عن حالة مثل حالتنا من فضلكم ساعدونا؟\nجزاكم الله خيرا","a":"بسم الله الرحمن الرحيم، الحمد لله، والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nسلوك هذا الشاب غير لائق لأنه لا يجوز للمسلم أن يعيش مع امرأة إلا عن طريق الزواج الشرعي. قال الله تعالى في سورة المؤمنون: «والذين هم لفروجهم حافظون».\n\nومع ذلك، إذا تبين أن وضعه أصبح الآن صحيحا بعد توبة نصوح، وأنه ارتبط بهذه المرأة عن طريق عقد زواج شرعي بشروطه، وبعد مراعاة فترة الاستبراء، فإنه يُعد الزواج شرعيا ولم يعد يجوز لنا سوء الظن أو الحكم بأن الزواج أو الحمل غير شرعيين...\n\nأرجو أن تنجح هذه العائلة في معالجة هذه الوضعية بحكمة ورحمة، لأن صلة الرحم والقرابة والأخوة وبر الوالدين من المبادئ الأساسية في رسالة الإسلا...\n\n[ملاحظة: إجابة المصدر مقطوعة هنا في منتصف الكلمة]"},{"id":590,"c":86,"d":"2020-09-14","t":"هل نيّة الطلاق تجعل الزواج باطلاً؟","q":"السلام عليكم، أنا فرنسية اعتنقت الإسلام بفخر والحمد لله\n\nلأسباب وجيهة عديدة قررت أن أقبل من أجل حياتي وحياة طفلي أن أُطلَّق، لأنه في الواقع هو أول من قرر أن يطلقني.\nأمهاتنا على علم بإجراءاتنا الإدارية للطلاق.\n\nالسيد مسلم بالولادة وغير ممارس. يقترح عليّ أن نطلق ثم نحافظ على العلاقات العاطفية بودّ لكن كل واحد سيعيش على حدة.\nيقول لي إنه عازم على أن يطلقني، لكن في إحدى الأمسيات كان واضحاً جداً فقررت أن أدخل في فترة العدة وأخبرته بذلك، لأن السيد لا يريد أن يفعل ما يلزم ليطلقني أمام الشهود، لأنه بالنسبة إليه فترة العدة لا فائدة منها لأنه يقول إننا في بلد علماني!!!!\n\nيقول إن فترة عدتي تبدأ من اللحظة التي طُلِّقنا فيها أمام القاضي، لكن بالنسبة لي تبدأ من اللحظة التي صرّح فيها بوضوح بإرادته في أن يطلقني وأن أمه على علم وتعطي موافقتها بما في ذلك الأم.\n\nلكنه يأتي إليّ دائماً ليطلبني في الفراش، وأنا نفسياً أعتبر نفسي في فترة عدة وأسأله: هل تنوي أن تردّني؟ فيجيب لا، فأجيب عليه: إذن لا تلمسني مجدداً حتى تقرر أن تردّني.\n\nوهناك يجيب أن فترة العدة تبدأ بعد أن يشهد القاضي رسمياً أننا مطلقان.\n\nأن تكون لي علاقة مع رجل عنده نية راسخة في أن يطلقني لا أستطيع، بالنسبة لي هذا كارتكاب ذنب.\n\nفي سبيل الله أنتم ملجئي الوحيد حالياً لأجد أخيراً أجوبة على أسئلتي.\nإن شاء الله بكم سأتمكن أخيراً من أن أفهم أين تبدأ حقاً فترة عدتي وأين تنتهي\n\nخصوصاً أنني أريد الطلاق بحقي في الطلاق بالخلع (هذا الرجل لم يساعدني دينياً أبداً، ضربني وأهانني مرات عديدة، يقول إن السنة كانت موجودة في زمن نبينا الحبيب محمد صلى الله عليه وسلم وأنه اليوم لم يعد لها عملياً أي معنى، قول شيء كهذا والله قتلني داخلياً، مقززة منه، وأقول إنه قال ذلك ليجرحني، لكن في كل الأحوال هذا الرجل لم يعد حلالاً لي)\nالله أعلم.\n\nبارك الله فيك على مساعدتك.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\n«الحلال بيّن، والحرام بيّن، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات فقد استبرأ لدينه وعرضه...» (حديث صحيح)\n\nما يجب أن نستخلصه في حالتنا هو أن لدينا فقط مشروع طلاق ولكن لم يحدث النطق بصيغة الطلاق. ولم يصدر أيضاً حكم طلاق، ولا أي شيء آخر يجعل الطلاق نافذاً وفق الفقه.\n\nيجب أن نعلم أن العلماء متفقون على أن نية الطلاق ليس لها أثر شرعي على العلاقة الزوجية، إذن رابطة الزواج ما تزال قائمة.\n\nوحتى لو نوى الزوج أن يطلق زوجته بعد مدة معينة، وحتى لو كانت هي على علم بذلك، فستبقى زوجته شرعاً ما دام الطلاق لم يقع، وله (لهما) حق المعاشرة الزوجية.\n\nنصيحتي للزوجين أن يتوجهوا إلى لجنة إسلامية معترف بها أو إمام كفء ليصلح بينهما، وليقدم لهما النصح فيما يخص وضعهما، وليعظ الزوج؛ فلعل الله يحدث بعد ذلك أمراً.\n\nقال الله تعالى: «وَعَاشِرُوهُنَّ بِال"},{"id":589,"c":77,"d":"2020-06-29","t":"كيف تُقرأ الفاتحة بصوت خافت","q":"السلام عليكم،\n\nقرأت كتاباً يشرح الشروط الأحد عشر لصحة سورة الفاتحة. ومن هذه الشروط هذا: «أن تُقرأ الفاتحة بطريقة يُسمِع بها المرء نفسه». لكنني لاحظت أيضاً أن المدرسة المالكية تشير إلى أداء الصلاة بصوت خافت، بمجرد تحريك اللسان دون أن يُسمِع نفسه.\nأود أن أعرف ماذا يجب أن أفعل وفق المدرسة المالكية، وأن أعرف هل يمكنني أن أقرأ الفاتحة بمجرد تحريك اللسان رغم أنني امرأة.\n\nشكراً.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nقراءة «الفاتحة» بجميع حروفها وحركاتها واجبة في الصلاة. ويجب على المصلي أيضاً أن يحترم نوع القراءة المعروف في الصلوات: جهراً أو سراً (بالنسبة للرجال).\n\nأما عن اختلاف آراء العلماء حول تعريف السرّ في الصلاة، فيجب أن نعلم أن عند المالكية مدى الصحة هو التالي: الحد الأدنى هو «تحريك اللسان فقط» والحد الأقصى هو «أن يُسمِع نفسه».\n\nالمرأة يجب أن تقرأ القرآن سراً عندما تصلي؛ ويجب عليها أن تتجنب رفع صوتها عمداً حتى لا تقع في الشبهة والشك.\n\nالأهم هو حضور القلب والعقل. فالخشوع في الصلاة هو المطلوب. قال الله تعالى: ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ ۝ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ﴾.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":588,"c":76,"d":"2020-06-29","t":"الحيض بفواصل تقل عن 15 يوماً","q":"السلام عليكم،\n\nماذا يجب أن تفعل المرأة عندما يعود إليها الحيض قبل أن تبلغ 15 يوماً كاملة من الطهر؟ وأيضاً، إذا اعتبرنا أن هذا دم استحاضة، فبالنسبة للحيضات القادمة، كيف يجب أن نحسب مدة الطهر بين الدورتين؟ وبعد كم من الوقت يمكن أن نعتبر أنها دورة حيض جديدة؟\n\nبارك الله فيك","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبعد انتهاء الحيض، قد يخرج من المرأة دم مجدداً. فيجب إذن أن نعرف كيف نفرق بين حالتين:\n\nالحالة الأولى هي دم الاستحاضة أو العرق النازف «استحاضة»، وهو مختلف عن دم الحيض ويستلزم فقط الوضوء الأصغر لأن المرأة لم تعد في الحالة المرتبطة بنجاسة الحيض.\n\nأما الحالة الثانية، فيحدث أن عند بعض النساء يأتي حيضهن بطريقة متقطعة. فمثلاً، يبدأ الحيض، ثم ينقطع سيلان الدم، وبعد يوم أو بضعة أيام يبدأ مجدداً (دون أن يبلغ 15 يوماً).\n\nعند المالكية، يجب على المرأة أن تطبق «التَّلْفِيق» في هذه الحالة، وهو أن تجمع أيام النزيف (دون حساب أيام الطهر). فإذا بلغ مجموع الأيام عدد أيام حيضها المعتاد «عادتها»، ولم ينقطع الدم بعد، فإنها تضيف ثلاثة أيام إضافية (على الأكثر) تعتبر فيها أن هذا السيلان هو استمرار حيضها. وبعد هذه الأيام الثلاثة، يجب عليها أن تغتسل الغسل الأكبر وتستأنف صلواتها وعباداتها، لأن هذا لم يعد يُعتبر دم حيض بل دم مرض أو فساد. وبالتالي تجد نفسها في الحالة الأولى «استحاضة»، التي فيها تتوضأ الوضوء الأصغر لكل صلاة، كما هو معروف عند عدة فقهاء مالكية.\n\nويمكنها أيضاً أن تستشير الطبيب إذا تكررت الاضطرابات أو ساءت الحالة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":587,"c":87,"d":"2020-06-24","t":"الاعتناق وارتداء الحجاب","q":"السلام عليكم ورحمة الله،\n\nأتوجه إليكم لأنني أجد نفسي في وضع لا أعرف فيه ما هو الأفضل فعله.\nأضع السياق لتتمكنوا من الفهم:\nأنا اعتنقت الإسلام منذ الآن عام ونصف وما زلت أسكن مع والديّ خلال العطل المدرسية لأنني طالبة. وهما لا يعلمان بوضعي وهما ضد هذه الديانة تماماً. لذلك من المستحيل حالياً أن أعلن لهما.\n\nالأمر هو أنني أود ارتداء الحجاب، أظن أنني مستعدة لأرتديه ولدي رغبة صادقة في ذلك لأنني أريد أن أتمم واجباتي كمسلمة على أحسن وجه.\nمشكلتي هي أنني لن أستطيع ارتداءه عندما أكون معهما. مما قد يضعني في مواقف يجب فيها أن أرتديه وحيث لن أستطيع لأنها سيكونان حاضرين.\nولن أستطيع أيضاً ارتداءه في مكان عملي (في عطل نهاية الأسبوع).\n\nالسؤال إذن ما هو الأفضل فعله؟ هل الأسوأ هو ألا أرتديه أبداً، أم أن أرتديه فقط عندما لا يكونان معي؟ وهل كوني لا أرتديه في المرات التي أكون فيها مع والديّ يزيل كل معنى عن نيتي عندما أرتديه؟\n\nأخيراً لا أعرف هل يجب أن أنتظر حتى أتمكن من إخبارهما أنني مسلمة (مما قد يعني عدة سنوات)، لألا أنزعه أبداً متى بدأت في ارتدائه، أم أبدأ من الآن في ارتدائه عندما أستطيع لأقلل الأوقات التي لا أكون مرتدية له فيها.\n\nشكراً لوقتكم.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأولاً، أهنئ هذه الأخت المعتنقة على حرصها على واجباتها الدينية.\n\nحقوق الوالدين في الإسلام أساسية، يجب إظهار الاحترام والتقدير للوالدين، والتذلل لهما، ومخاطبتهما بكلام لين، وحسن معاملتهما...\n\nأما موضوع ارتداء الحجاب، وهو واجب ديني، ووضعك العائلي، فيجب أن نعلم أنه يوجد في العلم الديني ما يسمى «التدرج»، أي التقدم خطوة بخطوة. أنت مؤمنة وممارسة بفضل الله، وارتداء الحجاب ليس من أركان الدين. إذا وجدت فرصة لارتدائه، فافعلي؛ إذا كنت وحدك أو بعيدة عنهما مثلاً، فهذا شيء حسن. الحجاب هو جمال المرأة المسلمة. وبعد زواجك إن شاء الله...\n\nإذا كنت تجدين حالياً حرجاً في إخبار والديك باعتناقك، فلا تفعلي. انظري ما يناسبك واختاري الوقت والمناسبة المناسبين.\n\nتدبير الأولويات والتقدم خطوة بخطوة في الإسلام جزء من ديننا الوسط المعتدل.\n\nأسأل الله أن ييسر لك الطريق وأن ينير قلبك بالإيمان وأن يضيئه بالحكمة والعلم. آمين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":586,"c":85,"d":"2020-06-24","t":"أخذ المال من زوج لا يتحمل مسؤولياته المالية","q":"السلام عليكم\n\nعندي سؤال. هل يمكن لزوجي أن يسامحني على ما فعلت؟\n\nأشرح لكم: سرقت زوجي لمدة 11 سنة كنت آخذ منه المال ليس للمتعة بل لاحتياجات العائلة. ففي الواقع هو لديه راتب لكنه يتركني وحدي أتحمل احتياجات أطفالي. ولما لم يكن لي مخرج أخذت منه المال لأكمل هذه الشهور الصعبة. هو لا يساعدني في شيء رغم أنه مسلم جيد يصلي لا يكذب لا يسرق لكنه ليس له السلوك تجاهي أنا زوجته وتجاه أطفاله. لا أستطيع أن أعقله فهو صعب الكلام معه خاصة في المال. كيف يمكنني إصلاح الأمور وهل يمكنه أن يسامحني؟ والأهم من كل ذلك هل سيسامحني الله على أخطائي؟ أصلي وأدعو كل يوم ليهدأ قلبه. أفكر في زوجي، في الحزن الذي هو فيه، وفي زوجي. أنا آتي في الدور الثاني. هل يمكنكم أن تجيبوني؟\n\nبارك الله فيك","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nهذه السيدة أخذت سراً مالاً من زوجها دون أن تُعلمه، لكنها أوضحت جيداً أنها فعلت ذلك بدافع الضرورة لتغطية احتياجاتها الضرورية أو احتياجات أطفالهما والبيت دون إسراف أو تبذير.\n\nفي هذه الحالة، لا يمكن اعتبارها سارقة، وما فعلته ليس ذنباً يبعث على الخوف من العقوبة، لأنها كانت في ضرورة و«الضرورة تقدر بقدرها»، والله يحكم على النيات.\n\nنظراً للحالة الموصوفة للزوج، لا يجب عليها أن تُعلمه بذلك، ولتطمئن نفسها بشأن ذلك. لكن إذا استعاد مسؤولياته المالية تجاه عائلته، فيجب عليها أن تتوقف فوراً وألا تعود أبداً إلى هذه الأفعال.\n\nاسعي، أيتها الأخت الكريمة، إلى التقرب من زوجك بالكلام الطيب وبالحوار الهادئ، مع الإكثار من الدعاء والطلب إلى الله العلي أن يهدئ قلوبكما وأن يجعل المودة والرحمة في عائلتك. وكوني دائماً طائعة له ولا تهتمي كثيراً بالماضي.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":585,"c":87,"d":"2020-06-24","t":"تلقي مال من التأمينات بعد وفاة","q":"مرحباً! شكراً على هذا الموقع الرائع الذي اكتشفته مؤخراً!\nتوفي أخي في أوروبا. كان متزوجاً وله طفلان! بعد موته، اتصلت بنا شركة التأمين من أوروبا لتقول إن أفراداً من العائلة سيتلقون مبلغاً معيناً حددوه وفق نسب ثابتة.\nسؤالي هو هل هو حلال أن نتلقى نحن الإخوة والأخوات هذا المال؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nما تعطيه شركة التأمين لعائلة المتوفى يدخل في الميراث، إلا أن نسب التقسيم في عقود التأمين قد تكون مختلفة عن تلك المعمول بها في الميراث الشرعي الإسلامي.\n\nإذا حددت شركة التأمين جيداً قيمة التعويضات لكل فرد من العائلة وفق الشروط المحددة في العقد، فلا حرج في أن يأخذ إخوة وأخوات المتوفى حصصهم الخاصة. من المهم احترام هذا التقسيم في الميراث.\n\nومع ذلك يمكن لكل واحد منهم أن يتنازل عن حصته لأطفال الأخ المتوفى، وهذا عمل برّ وتقوى بنوية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":584,"c":77,"d":"2020-06-24","t":"هل الشفع والوتر واجبان؟","q":"السلام عليكم.\n\nسؤالي هو التالي: هل صلاة الشفع والوتر واجبة؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nصلاتا الشفع والوتر تدخلان في فئة من الواجبات التي تسمى السنن المؤكدة «مؤكدة»؛ والوتر أشد تأكيداً.\n\nبخلاف الصلوات الخمس المفروضة التي لها حكم الواجب الديني «فرض»، فإن هاتين الصلاتين مهمتان لأنهما من «السنن المؤكدة» وهي سنن واظب النبي (صلى الله عليه وسلم) على أدائها. توجد أحاديث «حديث» صحيحة تؤكد فضلهما وأهميتهما، لذلك لا يجب على المسلم أن يهملهما أو يتركهما.\n\nوقد روي عن أبي داود والنسائي وغيرهما أن النبي (صلى الله عليه وسلم) قال: «الوتر حق على كل مسلم».\n\nوعن جابر (رضي الله عنه)، أن النبي (صلى الله عليه وسلم) قال: «يا أهل القرآن! أوتروا فإن الله وتر يحب الوتر».\n\nإذن يمكن للمصلي أن يؤدي الوتر بركعة واحدة أو أكثر (بعد فردي: 3، 5، 7...)\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":583,"c":87,"d":"2020-06-23","t":"ارتداء الحزام عند المرأة","q":"السلام عليكم ورحمة الله وبركاته يا شيخ\n\nسؤال يؤرقني وأود أن يكون لي سند من شخص من أهل العلم إن شاء الله، جزاك الله خيراً إن شاء الله.\n\nما حكم موضة ارتداء الحزام لتضييق الخصر الذي يبرز صدورهن التي ترتديها النساء مع الملابس (مثل الفستان الطويل) أو ببساطة الفساتين ذات القصات التي تضيق الخصر وتُظهر شكل صدورهن؟\n\nبارك الله فيك","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nما يُطلب من المرأة المسلمة هو أن ترتدي لباساً محتشماً لا يُظهر أشكال جسدها ويستجيب للخصائص الشرعية لملابس المرأة المسلمة.\n\nومن ثم يجب أن ننظر لأي أسباب وفي أي ظروف ترتدي المرأة حزاماً لتضييق الخصر أو ملابس تُظهر أشكالها.\n\nهل تفعل ذلك لتتزين أمام الناس وتجذب انتباههم ونظراتهم؟ أم تفعل ذلك في بيتها لزوجها بعيداً عن الأنظار الأجنبية؟ أم ترتدي حزاماً لأسباب صحية مثلاً؟\n\nإذن توجد حالات مختلفة عديدة، «الحلال بيّن، والحرام بيّن».\n\nمن العبث أن ترتدي امرأة مسلمة فستاناً يُظهر أشكالها وتخرج به أمام الناس لتجذب انتباههم. وهذا بالطبع غير جائز.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":582,"c":82,"d":"2020-06-23","t":"شراء بيت محجوز عليه في مزاد","q":"السلام عليكم.\n\nأود مساعدتكم من فضلكم. أصرّ زوجي على أن نشتري بيتاً (محجوزاً عليه) في مزاد. لم أكن مرتاحة جداً لذلك لكنني قبلت على مضض. وقد تمكنت مع ذلك من تجنب القرض البنكي الربوي لأنه كان يريد أن يتعاقد عليه. دفعناه بقرض عائلي. المشكلة هي أنني الآن، بعد بعض الأبحاث، ندمت وأود أن أعرف هل هذا الشراء جائز. ما حكم شراء عقار محجوز عليه في مزاد؟\n\nإذا كان ذنباً، كيف أكفّر عن ذلك أمام الله؟ وماذا أفعل إذا كان زوجي لا يريد التخلي عن هذا العقار؟ نحن نسكن حالياً شقة، ولا أريد أن أنتقل.\n\nبارك الله فيكم على مساعدتكم. أنا حقاً بحاجة إليها.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالبيع بالمزاد (في حد ذاته) جائز وفق قواعد شرعية دقيقة، وقد كان معمولاً به عند النبي (صلى الله عليه وسلم) وفق رواية صحيحة.\n\nالمشكلة المطروحة في حالتنا (الحجز القضائي) هي الطابع (القسري) للعملية وغياب رضا مالك هذا العقار، مما يجعل الفعل محرماً عادة. لكن علماء الفقه الإسلامي «الفقهاء» استثنوا من هذا التحريم البيوع الناتجة عن حجز من السلطة القضائية، التي تُجرى لسبب شرعي مثل دفع ديون الشركات أو الأشخاص أو أي سبب وجيه آخر.\n\nوبالتالي، لا حرج ولا خوف على هذه العائلة في أن تستقر في هذا البيت الجديد.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":581,"c":87,"d":"2020-05-13","t":"العمل في المحاسبة","q":"السلام عليكم يا شيخ\n\nأود أن أطرح عليكم سؤالاً يخص مهن المحاسبة في فرنسا لأن حديثاً يتحدث عن الذي يوقع عقد الربا والشاهدين عليه، ومع ذلك لا أعرف هل المحاسب معني بهذا الحديث، وإمام المسجد المحلي شرح لي أن الأحاديث لا تُؤخذ خارج سياقها وأنه يجب الرجوع إلى المجتمع الذي أعيش فيه. أود أن أعرف وجهة نظركم في ذلك. أشكركم مقدماً.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبالفعل، لا يجب أن تُؤخذ النصوص (القرآن أو الحديث) خارج سياقها أو بجهل، يجب أن تكون هناك معرفة كاملة بالأسباب والظروف التي نزلت وقيلت فيها هذه النصوص. وهكذا، عدة علوم أخرى ضرورية قبل أن يتمكن المرء من إعطاء رأي شرعي.\n\nقال الله تعالى: ﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾.\n\nهذا النوع من الاجتهاد هو دور العلماء ولا يجوز لأي شخص أن يقرر أن يأخذ أو يترك تطبيق نص لعدم توافقه مع وضع حالي.\n\nفي الأصل، العمل في المحاسبة نشاط جائز لأنه وظيفة ضرورية للشركات والاقتصاد. الخلاف بين العلماء يوجد في ممارستها في البنوك والشركات التي تستخدم الفائدة الربوية. الآراء الفقهية تختلف بين من يحرمونها، وفق الأحاديث النبوية «أحاديث» المحرمة للفائدة الربوية «الربا»، مما يشكل تعاوناً على الإثم والعدوان، ومن جهة أخرى من يمتنعون عن تحريمها (خاصة الأحناف)، اعتماداً على ما يسمى البلاء العام «عموم البلوى»، أي أن أمراً محرماً في الأصل انتشر إلى حد أن عامة الناس لا يمكنهم تجنبه ومجموع المسلمين يجد نفسه مضطراً للتعامل معه بطريقة أو بأخرى، إذن فالمنع الكامل لهذه المعاملات سيمثل عرقلة لمصالح الأمة.\n\nهذا هو الرأي الأخير الذي نأخذ به لتجنب الحرج لكثير من العمال. لكن يبقى أن نشير إلى أنه إذا كان نشاط الشركة محرماً تماماً، مثل بيع الخمر مثلاً، فإنه يصبح محرماً العمل معها.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":580,"c":82,"d":"2020-05-12","t":"بيع ملابس تحتوي على الحرير","q":"السلام عليكم،\n\nأنا صاحبة مشروع في صناعة النسيج الرجالي. سأطلق قريباً علامتي للملابس الجاهزة للرجال إن شاء الله.\n\nومع ذلك لدي سؤال جوهري لا أجد له جواباً واضحاً:\n\nهل لي الحق في صنع ربطات عنق وملابس أخرى للرجال من حرير مخلوط بمادة أخرى؟ وإذا كان نعم، فما هي نسبة الحرير التي يجب ألا تُتجاوز؟\n\nبطانة ربطات العنق ذات الجودة العالية تتكون عموماً من حرير خالص حتى لو لم نرها. هل بيع هذا النوع من ربطات العنق حرام؟\n\nأشكركم جزيل الشكر على مساعدتكم. إنها أسئلة جوهرية بالنسبة لي لأنني لا أريد بأي حال أن أفعل الحرام.\n\nشكراً مجدداً","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nتحريم لبس الحرير على الرجال في الإسلام أمر معروف وواضح، لأنه من الترف والإسراف الذي لا يليق بالرجال، بخلاف المرأة التي يمكنها أن تتزين به دون إساءة أو إسراف.\n\nقال الله تعالى: ﴿وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ﴾.\n\nوبالتالي، لا يجوز إنتاج ملابس للرجال مصنوعة من حرير طبيعي خالص 100% ولا يجوز بيعها.\n\nوهذا يخص بالطبع الملابس المنسوجة من خيوط الحرير الطبيعي 100%. أما إذا كانت الملابس مصنوعة من القطن أو الصوف أو أي مادة أخرى، ثم أُضيفت نسبة من الحرير، مثل التطريز وخيوط الحرير التي تزين الملابس، فلا حرج في ذلك.\n\nنسبة الحرير يجب ألا تكون أعلى من المواد الأخرى لأن العبرة بالأغلبية، كما تشير القاعدة.\n\nأما تحديد النسبة المئوية الدقيقة التي تقابل مفاهيم مثل «القليل» و«الكثير» أو «الأغلبية»، فهذه مسألة فقهية معقدة تختلف وفق الآراء «الاجتهاد». والرأي الأكثر تسامحاً هو أنها يجب ألا تتجاوز 50% مثلاً لكي لا يكون الشيء هو الغالب.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":579,"c":79,"d":"2020-05-12","t":"هل هذا يُبطل الصيام؟","q":"السلام عليكم،\n\nأولاً، ما حكم الشخص الذي يأكل للسحور قبل الإمساك أو بعده بقليل ويجد نفسه مع أطعمة عالقة في الأسنان دون أن ينتبه بعد الفجر فيبتلعها على الأرجح دائماً بعد دخول الصيام؟\n\nثانياً، لما كنت أعمل قبل بضع سنوات في عالم العطور، ما حكم أن يجد المرء نفسه على الأرجح يشم العطر في حلقه (في فترة الصيام) في اللحظة التي يتعطر فيها الزبائن باستقلال عن نفسه أو بواسطته؟\n\nإذا كان كل هذا مُبطلاً للصيام، وبعد كل هذه السنوات لم أقضِ الأيام الفائتة، فهل يجب عليّ إذن أن أدفع الفدية وأنا في شك من وقوع الفعل؟\n\nبارك الله فيكم.","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفيما يخص سؤالك الأول، ابتلاع بقايا الطعام التي تبقى بين الأسنان معفو عنه، ولا يُبطل الصيام. وكذلك كل كمية ضئيلة لا تتجاوز حبة الحمص على سبيل التقدير، لأنه ليس من السهل دائماً الاحتراز منها.\n\nأحكام الشريعة مبنية على اليسر لا على المشقة. قال الله تعالى: ﴿يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾.\n\nيُستحب غسل الأسنان بمعجون الأسنان لتجنب الشك، وكذلك استعمال المسواك لأنه من سنة وهدي نبينا (صلى الله عليه وسلم).\n\nبالنسبة للسؤال الثاني، ما هو معروف عند جمهور العلماء «الجمهور»، هو أن استعمال العطر واستنشاقه خلال نهار رمضان لا يُبطل الصيام، لأنه ليس له جرم صلب. أما دخان البخور، فلا يُبطل الصيام إلا في حالة ما إذا فُعل بطريقة متعمدة ووصل إلى الحلق، في هذه الحالة يُبطل الصيام. العطور ليست من نفس طبيعة الأطعمة والمشروبات، فلا حرج، إن شاء الله، لهذا البائع عندما يجرب العطور للزبائن.\n\nوتقبل الله صيامنا وأعمالنا. آمين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":578,"c":87,"d":"2020-05-12","t":"والداي يمارسان السحر","q":"السلام عليكم،\n\nأنا مسلمة، والداي ليسا كذلك. هما يمارسان السحر كلاهما. هل يمكنني أن أغادر بيت والديّ؟!\n\nشكراً جزيلاً...","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالموضوع يفتقر إلى عدة تفاصيل. الشخص الذي طرح السؤال لم يحدد سنه، وكيف يمكنه مغادرة البيت العائلي، وأين سيذهب بعد ذلك، إلخ؟ هل يتعرض لأضرار بسبب ممارسات والديه؟\n\nلعلها ستتعرض لأضرار أشد خطورة إذا غادرت البيت العائلي. إذا كانت تستطيع أداء الشعائر الدينية في بيتها دون حرج، فإن الشر الناتج عن أفعال والديها لا يمسها.\n\nننصحها بالصبر وأن تحاول قدر ما تستطيع أن تكون مثالاً حسناً لوالديها. قال الله: ﴿وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ﴾.\n\nنسأل الله لها التوفيق والبركة وأن يمنحها مخرجاً حسناً.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":577,"c":87,"d":"2020-05-12","t":"الاعتناق عندما يكون الوالدان مسلمين","q":"مرحباً،\n\nنشأت مع أبي الذي لا يمارس الدين، لكنني أنا منذ أن وعيت ما هو الدين أؤمن بالله لأني نشأت في بلد مسلم. عائلة أمي مسلمة ممارسة.\n\nأصلي منذ زمن طويل وأردت أن أعرف هل يجب عليّ أن أعتنق الإسلام؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nسن الشخص الذي طرح السؤال وديانة أبيه غير مذكورين. على كل حال، إذا كان أبوه مسلماً، حتى لو لم يكن يمارس، فهو مسلم بالطبيعة؛ وإلا فإنه يتبع ديانة أمه في حال كانت الأم هي المسلمة.\n\nالحمد لله، هذا الشخص يعلن أنه مؤمن وأنه يمارس الواجبات الدينية وهذا كافٍ له.\n\nإذا كان يتحدث في سؤاله عن إعلان الإسلام الذي يُفعل بحضور شهود مسلمين وإمام مسجد، فيجب أن نعلم أن القاعدة هي أن من وُلد من والدين مسلمين فهو مسلم شرعاً. وفي حال كان أحد والديه فقط مسلماً، فإنه يتبعه (المسلم) ولا يُلزَم بتجديد إسلامه عند سن البلوغ.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":576,"c":86,"d":"2020-05-12","t":"طلاق غير مكتمل وزواج جديد","q":"السلام عليكم عمي حسن،\n\nأتوجه إليكم لتسدوني النصح من فضلكم.\n\nمنفصلة تقريباً منذ 3 سنوات أنتظر جلسة الطلاق التي أُجّلت مرتين من طرف زوجي السابق. قدّم لي صهرُ أختي شخصاً قمنا بالتعارف بحضور العائلة. قلبي مطمئن والحمد لله مع هذا الشخص. نود أن نعقد الزواج الشرعي بانتظار طلاقي المدني. لكن زوجي السابق لم يصرح أنه يطلقني. هل يمكنني أن أعقد زواجي الشرعي مع ذلك؟ (مرت سنة ونصف ونحن ننتظر) لم نلتقِ خلال هذه المدة، فقط مكالمات. هل هذا صحيح أم كان يجب علينا ألا نحافظ على الاتصال؟ هل سيغمرنا الله ببركته إن شاء الله؟\nجزاك الله خيراً","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nهذا الانفصال بين الزوجين لم يتبعه طلاق مكتمل، لأن الزوج لم ينطق بالطلاق، كما أن القاضي لم يصدر قراراً بشأن الطلاق. لذلك لا يجوز عقد زواج جديد لهذه المرأة لأنها ما تزال مرتبطة شرعاً بزوجها الأول. يجب عليها أن تناقش مسألة الطلاق مع السلطة القضائية أو المحامي لدراسة إجراءات الطلاق، والله أعلم.\n\nمن الأفضل أيضاً أن تتجنب أي صلة كانت مع رجل أو الحديث عن موضوع الزواج حالياً، يجب عليها أن تتوجه إلى الله وتكثر من الدعاء وتؤدي صلاة الاستخارة، آملة أن يرسل الله الفرج.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":575,"c":87,"d":"2020-05-12","t":"امتلاك القصص المصورة","q":"السلام عليكم،\n\nأنا رجل في 28 من عمره أملك في بيته مانغا (قصص مصورة يابانية). أود أن أعرف هل امتلاك مثل هذه الكتب (مع رسوم وشخصيات خيالية) جائز أم يجب عليّ أن أتخلص منها.\n\nبارك الله فيك","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالأحكام المتعلقة بالقصص المصورة هي نفسها التي تميز الرسوم المتحركة: إذا لم تحتوِ على صور أو أشياء مخالفة لشريعتنا وأخلاقنا، فلا حرج في الاحتفاظ بها إذا كنا نحتاج إليها. ويجب دائماً اتباع طريق الاعتدال في كل شيء.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":574,"c":87,"d":"2020-05-12","t":"العمل في الرسوم المتحركة","q":"العمل في مجال الرسوم المتحركة، مثلاً رسم رسوم متحركة (تربوية أو لا) للأطفال (لا تحتوي على مواقف حرام فيها) وكسب المال بذلك (في بلد غير إسلامي، في هذه الحالة فرنسا)، هل هو حرام أم لا؟ شكراً جزيلاً!","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا كانت هذه الرسوم المتحركة تُصنع لأغراض نافعة وجائزة مثل الرسوم المتحركة التربوية للأطفال أو لتسليتهم وإسعادهم، فإن العمل في إنتاجها أو تسويقها جائز، سواء كان ذلك في فرنسا أو في غيرها، لأن المهم هو الغرض والنية.\n\nالقاعدة هي أن الأصل في كل شيء الإباحة (الجائز)، ولا تحريم دون دليل، وكل ما يؤدي إلى محرم (حرام) يصبح محرماً في هذه الحالة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":573,"c":87,"d":"2020-05-12","t":"الاحتفال بذكرى الإسراء","q":"السلام عليكم\n\nاللهم صل على محمد وآل محمد وسلم\n\nهل يجب علينا أن نحتفل بليلة 27 رجب كذكرى لرحلة الإسراء لنبينا الحبيب (صلى الله عليه وسلم)؟\n\n1- إذا كان نعم، ما الذي يجب أن يكون موقفنا تجاه من يعترض؟ وما هي الممارسات المستحبة في هذه المناسبة؟\n\n2- إذا كان لا فماذا نقول لمن يمارسها؟","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nنحمد الله العلي على جميع نعمه علينا ونسأله أن يعيننا ويثبتنا.\n\nبالفعل، الرأي المنتشر في الأمة هو أن ليلة 27 رجب هي تاريخ ليلة الإسراء والمعراج، مع العلم أنه توجد آراء أخرى وأن ذلك ليس محل إجماع العلماء.\n\nلم يُروَ فضل خاص يتعلق بإحياء ذكراها. ومع ذلك، فالاحتفال بهذه الليلة كسهرة تقوية هو تذكير للأمة بهذه المعجزة العظيمة وهذه النعمة الكبيرة التي فضّل الله بها نبيه (صلى الله عليه وسلم) وأمته. وهو أيضاً تذكير بجميع التعاليم التي تشملها هذا الحدث مثل إقامة الصلوات الخمس وجميع التعاليم النبوية والربانية الأخرى. وقد ذكر الله تعالى هذا الحدث في كتابه الكريم، قرآناً يُتلى إلى نهاية الزمان.\n\nباختصار، إنها محطة مهمة في حياة النبي (صلى الله عليه وسلم). إحياء ذكراها بالنية وبالطريقة التي ذكرناها، مع الابتعاد عن البدع والأشياء المحرمة في الشرع، ليس محرماً؛ بل على العكس، هو تذكير نافع للأمة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":572,"c":84,"d":"2020-05-12","t":"هل يمكن رفض الإنعاش؟","q":"السلام عليكم ورحمة الله وبركاته\n\nأنا حامل بطفلي الثاني وسألد عادة بعد 15 يوماً إن شاء الله. طفلي الأول بصحة جيدة والحمد لله. لكن مع هذا الحمل، يعاني جنيننا من كثير من مشاكل التشوهات. اكتشف الأطباء تشوهاً في القدم اليمنى، وتشوهاً في الكليتين، وتشوهاً كبيراً في القلب وتشوهاً خطيراً جداً في الدماغ. قيل لنا أنا وزوجي إن جنيننا على الأرجح لن يكون قادراً على التنفس وحده عند الولادة أو أن يرضع الحليب. لذلك سيكون على الأرجح موصولاً بجهاز تنفس وسيُغذى بالتغذية القسرية. علاوة على ذلك قيل لنا إن توقعات الحياة ليست إيجابية وأننا لا نعرف حتى هل سينجو من مخاض الولادة. وإذا عاش، شُرح لنا أنه لن يستطيع الكلام أو المشي أو الرؤية أو حتى أن يكون له ذكاء لأن دماغه لم يتطور وأن كل ذلك يأتي مع نوبات صرع.\n\nهذا مع العلم أنه في مناقشتنا مع الأطباء شُرح لنا أنه إذا وُجد الجنين في حالة طارئة أثناء الولادة بسبب ضعف قلبه، فيجب إجراء عملية قيصرية طارئة وأنني يمكنني أن أرفض لأننا نرغب في إنجاب أطفال آخرين ومع العملية القيصرية ما بعد الولادة أصعب. ومع ذلك اتخذت قرار إجراء عملية قيصرية طارئة إذا كان ذلك ضرورياً لإنقاذ حياة الجنين لأني لا أريد أن أفعل شيئاً سأُحاسب عليه أمام الله خاصة أن تحديد الحياة أو الموت ليس من شأننا.\n\nلكن هناك نقطة ناقشناها مع الأطباء وهي أنه نظراً لأن الجنين يعاني من كثير من المشاكل قيل لنا إنه قد يموت عند الولادة أو بعدها بوقت قصير وأننا يمكننا رفض الإنعاش لأن هذا سيزيد من سوء حالة قلبه ودماغه وأنه بعد الإنعاش سيعيش الجنين حياة موصولاً اصطناعياً.\n\nأردت إذن أن أعرف هل هو حرام رفض الإنعاش إذا مات الجنين رغم كل الألم الذي يسببه لنا ذلك، فمن الصعب قبول الإنعاش ليعيش طفلنا موصولاً اصطناعياً.\n\nإن أمكن أن تعطونا رأيكم لأني قرأت في مكان ما أن الإنعاش يختلف عن إزهاق الحياة وأنه جائز في الإسلام رفض العلاج أو الإنعاش.\n\nنأمل أن نحصل على رأي سريع لأن قلوبنا كوالدين تتألم كثيراً.\n\nشكراً جزيلاً\nبارك الله فيكم","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nبالفعل، حالة هذا الطفل معقدة جداً. نسأل الله أن يعامله بلطفه الكامل، وأن يمنح والديه الصبر والإيمان والقبول بقضاء الله، الذي يحتوي بلا شك على حكمة إلهية، والله لطيف بعباده، رحيم بخلقه.\n\nأما الجواب على السؤال المطروح، فالمشكلة دقيقة. يجب على الوالدين أن يفوضا الأمر إلى الله، فالحياة والموت بيديه. ويجب أن تُثبت حالة هذا الجنين بإجماع طبي من الأطباء الأخصائيين الموثوقين.\n\nلكن لا يمكن للوالدين أن يرفضا الإنعاش والتنفس الاصطناعي للطفل، إلا إذا لم يعد هناك أمل في حياته، أي أنه يُعتبر ميتاً؛ هنا فقط يجوز وقف الإنعاش.\n\nوهكذا صرحت اللجنة الدائمة للبحوث العلمية والإفتاء في جوابها على سؤال يتعلق بطفل تحت التنفس الاصطناعي الذي إذا نُزع عنه سيموت بعد عشر دقائق:\n\n«إذا كانت الحالة كما ذُكر، فلا مانع من نزع جهاز التنفس عن ابنك إذا أكّد طبيبان أو أكثر"},{"id":571,"c":84,"d":"2020-03-07","t":"إلحاق الطفل غير الشرعي","q":"السلام عليكم\n\nأرجع كثيراً إلى صفحتكم لأعرف دائماً المزيد عن ديني وخاصة عن الطريقة التجانية فشكراً على هذا العمل الرائع الذي تقومون به في هذه الصفحة.\nاليوم سؤالي هو التالي: ماذا يقول الإسلام عن الأطفال المولودين خارج الزواج؟ هل سيحملون اسم أبيهم إذا كانت الأم عزباء؟...","a":"جواب الإمام الخطيب الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nبسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nمسألة إثبات الروابط النسبية للطفل غير الشرعي موضوع معقد ومحل خلاف.\n\nالعنصر الذي يحظى بالإجماع بخصوص ابن وُلد خارج الزواج («ابن زنا»)، هو أن نسبه سيُلحق بأمه. ثم، إذا كانت مسلمة، فسيكون له نفس وضع المسلمين الآخرين وسيخضع لنفس الأحكام الشرعية فيما يخص الميراث أو الزواج أو الوصاية، إلخ.\n\nإذا رغب الأب في إلحاقه به نسبياً، فإن جمهور العلماء («الجمهور») يمنعون ذلك، لأنه أنجبه في علاقة غير شرعية، باستثناء الأحناف الذين يجيزونه.\n\nعلى كل حال، حتى لو سجله باسمه في الحالة المدنية، فلن يكون لذلك أي أثر فقهي ولا يمكن في أقصى حد إلا أن يكون جزءاً من البر باليتيم، ونسأل الله المغفرة والحماية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":570,"c":77,"d":"2020-03-07","t":"شروط صلاة الجمعة","q":"السلام عليكم ورحمة الله\n\nلديّ سؤال دقيق نوعًا ما يتعلّق بالمذاهب، وضعٌ ما يثير حيرتي، وأودّ توضيحًا إن أمكن. آمل أن تتمكنوا من الإجابة عليّ إن شاء الله.\n\nصديق سنسمّيه حسنًا، يعيش في فرنسا وهو شافعي لكنه قرّر اتباع المذهب المالكي في ما يتعلق بصلاة الجمعة، «من باب التيسير». وبالتالي «لم يعد بإمكانه صلاة الجمعة» لأنه يحترم المذهب المالكي، بحسب قوله.\n\nأوضح: عند المالكية، من شروط صلاة الجمعة أن تُقام في مسجد، لا في أرض خلاء أو في البيوت (https://www.doctrine-malikite.fr/Salat-Al-jumu-a_a76.html)\nوحسب حسن، في فرنسا لا توجد مساجد بل فقط «قاعات صلاة» لأن الأماكن التي نعتبرها ونستخدمها كمساجد ليست مساجد لأنها ليست أوقافًا، ولم تُبنَ لتكون مساجد إلى الأبد، ولأن الكثير منها ندفع عنه إيجارًا، إلخ...، وبالتالي فبالنسبة له، لا توجد مساجد فلا يمكنه أداء صلاة الجمعة.\n\nانطلاقًا من هذا التعريف للمسجد، هل يحقّ له أن يصل إلى استنتاج أنه لا يمكن صلاة الجمعة؟ وهل يمكنه بعد ذلك تطبيقه، أي ألّا يذهب بعد الآن إلى صلاة الجمعة؟\n\nعندما أقول له لماذا أنت الوحيد الذي يقدّم هذه النظرية وهل قال أحدهم هذا قبلك، يقول لي إنه في الحقيقة ليس وحيدًا لأنه حسب قوله جميع المالكية الذين يؤدّون الجمعة في فرنسا لا يتبعون المذهب المالكي في هذا الموضوع بل يتبعون في الحقيقة مدرسة أخرى لأنه حسب المذهب المالكي لا يمكن أداء صلاة الجمعة إذ ينقص شرط: المسجد.\n\nلقد حاولت أن أشرح له بكل الطرق لكن حسنًا لا يتعامل إلا بالنصوص، وحاولت أن أجد نصوصًا تُظهر له أنه على خطأ لكنني لم أجد.\n\nقلت له إن شرط أن لا تُصلَّى صلاة الجمعة إلا في مسجد ليس بالضرورة صالحًا في حالتنا في فرنسا لأنها وضعية تعتمد على السياق (نحن لسنا في أرض الإسلام)، لكن حتى في هذا لا يصدّقني، يريد دليلًا، نصًّا من العلماء.\n\nأخيرًا أظن أنه في الحالة التي يحرمنا فيها اتباع مذهب من عملٍ مهمٍّ مثل صلاة الجمعة، يُمنع اتباع رأي هذا المذهب في هذه المسألة بل يجب اتباع مذهب يمكّننا من أداء صلاة الجمعة، وهنا أيضًا ليس لديّ نص من العلماء لدعم كلامي فإن كان عندكم فأنا آخذ به. لكن ربما أكون مخطئًا.\n\nآمل أن تتمكنوا من الإجابة لأنني لم أجد أحدًا يمكنه أن يقدّم لي إجابات.\nبارك الله فيكم","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلًا، عند المالكية، من شروط صحة صلاة الجمعة وجود مسجد «جامع» (لا قاعة أو أرض)، يجب أن يكون مبنيًّا وله سقف. غير أن رأي الجمهور (الشافعية، الحنفية، الحنابلة) لا يشترط هذا الشرط. وبالتالي فصلاة الجمعة صحيحة عندهم في القاعات الرياضية، والقاعات، والشقق، إلخ. وهذا رأي المجلس الأوروبي للإفتاء. وهذا الرأي هو الذي نراه الأنسب بسبب نقص المساجد «الجامعة».\n\nأداء صلاة الجمعة فيه مصلحة كبيرة ومنفعة عظيمة للفرد والجماعة وأنصح هذا الأخ ألّا يترك الجمعة لهذا السبب.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":569,"c":77,"d":"2020-03-07","t":"قضاء الصلوات","q":"السلام عليكم ورحمة الله وبركاته\n\nنشأت كمسلمة لكنني لم أصلِّ لمدة عشر سنوات تقريبًا وحسب الحسابات عليّ قضاء حوالي 15.000 صلاة.\n\nهل يجب أن أقضيها بالترتيب أم يمكنني أن أصليها سنةً سنة أو أصلي 3000 صلاة من كل وقت أولًا؟\n\nبارك الله فيكم","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيجب على المسلم أن يقضي («قضاء») كل ما فاته من الواجبات، وخاصة الصلوات الخمس المفروضة. ويجب أن يكون القضاء بالترتيب. يقضي اليوم كاملًا ويبدأ ويفضَّل أن يبدأ بصلاة الظهر. فإن لم يكن ذلك ممكنًا، يُكثر من الصلوات النافلة بنية القضاء، كما أجاز ذلك بعض العلماء. والأهم في هذا كله هو الصدق في التوبة وحسن التوجه إلى الله بالإكثار من الأعمال الصالحة والعبادات مع الدعاء والاستغفار.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":568,"c":84,"d":"2020-03-07","t":"الولادة وغفران الذنوب","q":"السلام عليكم\n\nأريد أن أعرف هل عندما تلد المرأة تُغفر ذنوبها الكبيرة والصغيرة أم تُغفر ذنوبها الصغيرة فقط؟\n\nبارك الله فيك","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nلا شك أن الحمل والولادة من أصعب وأشدّ ما تمرّ به المرأة. وثبت في السنة أن كل ما يصيب المؤمن من حزن أو ألم فيه تطهير من الذنوب الصغيرة. وهذا من رحمة الله تعالى. أما المغفرة الكاملة لجميع الذنوب فلا يوجد حديث صحيح يثبتها. والثابت أنه إذا ماتت المرأة أثناء الولادة فلها أجر الشهيد، كما يدل عليه الحديث المذكور في «الموطأ»: الشهداء سبعة، وذكر منهم المرأة تموت بسبب الولادة، سواء قبلها أو أثناءها أو بعدها.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":567,"c":85,"d":"2020-03-07","t":"وليّ المرأة المعتنقة للإسلام","q":"السلام عليكم،\n\nأتصل بكم لأنني أريد إجابات عن بعض الأسئلة. أولًا سأشرح لكم الوضع.\nسنسمّيهما أبراه وسيرين، أبراه مسلم منذ طفولته ووالداه كذلك، سيرين لم تولد مسلمة ووالداها فرنسيان لكن لها أخت اعتنقت الإسلام ثم تزوجت دينيًّا ومدنيًّا. عند طلاق والدي سيرين، اهتمت سيرين كثيرًا بالإسلام وتعلّمت عنه جيدًا قبل أن تعتنقه بعد أن أعلنت ذلك لوالديها. لم يكونا موافقين لكن سيرين كانت تعيش عندهما ثم جاءت مشاكل، فأسند القاضي الحضانة إلى أخت سيرين. فعاشت سيرين عند أختها وزوج أختها. وبعد سنتين في الإسلام فكّرت سيرين وقرّرت بنفسها أن تضع الحجاب في سنّ السابعة عشرة. واستفسرت من الأئمة فقالوا لها أن تبقيه أيضًا أمام زوج أختها فأبقته.\nأبراه وسيرين فكّرا جيدًا ومتأكدان من اختيارهما فتحدثا عن الزواج الديني، أن يتزوجا دينيًّا حتى لا يبدآ في الحرام فتمّت اللقاءات مع عائلة أبراه بشكل جيد جدًّا ثم مع عائلة سيرين كذلك بشكل جيد جدًّا. والتقت العائلتان بعد ذلك وتفاهمتا بشكل رائع. وبما أن والدي سيرين غير مسلمان فكّرنا في اتخاذ زوج أختها وليًّا لها حتى يطلب والدا أبراه يدها من زوج أختها ومن أخت سيرين لكن زوج الأخت قال لنا إنه استفسر وأنه لا يمكن أن نطلب منه يد سيرين. علمًا أن سيرين ستبلغ الثامنة عشرة في أبريل، فإذا فعلنا ذلك في سنّ الثامنة عشرة (الحلال)، هل ما زالت بحاجة إلى وليّ أم لا؟ وإن كان يجب أن يكون لها وليّ غير والديها لأن والديها غير مسلمان، هل يجب مع ذلك أن نطلب يدها من والدي سيرين أم يمكن لسيرين أن تتخذ وليًّا مسلمًا بالغًا تختاره هي بنفسها يمكن أن يكون من عائلة أبراه أو أي شخص آخر موثوق؟ والأهم، حتى يكون الحلال بين أبراه وسيرين مقبولًا، نرجو أن نحصل منكم على بعض النصائح لحلال مقبول أمام الله.\n\nشكرًا مقدمًا على ردّكم،\nبارك الله فيكم","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالزواج الإسلامي لا يمكن أن يتمّ دون وليّ (الممثل القانوني للمرأة)، اتباعًا لقول النبي (صلى الله عليه وسلم): «لا نكاح إلا بوليّ».\n\nوهذا الوليّ هو الأب، ثم الجدّ، ثم الأخ، وهكذا من الأقرب فالأقرب.\n\nهذه الفتاة اعتنقت الإسلام، فيجب أن يكون وليّها مسلمًا، وهذا شرط ضروري لصحة الزواج. القاضي هو وليّ من لا وليّ له؛ فإن لم يكن ذلك ممكنًا، كما في حالتنا، فالذي يمثّل الجالية المسلمة في هذه البلاد، كرئيس مركز إسلامي أو الإمام. فإن لم يوجد، فيمكن أن يكون زوج أختها في حالتنا.\n\nولا مانع من حضور الأب لزواج ابنته. ومن البرّ بالوالدين أن تُعلم الفتاة أباها بالموضوع.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":566,"c":76,"d":"2020-01-09","t":"بقايا الغراء والوضوء","q":"السلام عليكم.\n\nلديّ سؤال صغير عن الوضوء،\n\nأعمل في ورشة ونستخدم الكثير من الغراء.\nفي كل مرة قبل الصلاة أتفقّد يديّ جيدًا وأزيل فائض الغراء حتى أكون متأكدًا أن صلواتي صحيحة.\nثم أتوضأ وأصلي.\n\nالمشكلة أنه في كل مرة، بعد أن أصلي، أجد مكانًا في يدي فيه بقعة غراء صغيرة لم أكن رأيتها لأنها شفافة. هذا حقًّا لا يُطاق.\nالغراء ليس صعب الإزالة حقًّا، لكن رغم أنني أقضي وقتي في التفقّد، بعد صلواتي اليومية، ألاحظ أن هناك بقعة صغيرة.\nوهذه البقع ليست سميكة أبدًا، كسماكة ورقة تقريبًا وليست كبيرة ولا أعرف هل تسمح للماء بالوصول إلى بشرتي.\n\nماذا يجب أن أفعل؟ لأن هذه المشكلة يومية حقًّا في الحياة.\n\nشكرًا لكم حقًّا","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلًا، لا يجوز الوضوء على مادة تمثل حاجزًا يمنع الماء من الوصول إلى البشرة.\n\nلكن إذا أزال المؤمن هذه المادة اللاصقة وبقيت آثار هذه المادة على البشرة، فهذا لا يؤثر على صحة الوضوء. وهذا من التيسير ودفع الحرج في الدين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":565,"c":87,"d":"2020-01-09","t":"الاحتفال بالمولد","q":"السلام عليكم\n\nما هي الأدلة في السنة على أن المولد، ذكرى مولد النبي، ليس بدعة كما يظن غالبية العلماء؟","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nأدلة جواز الاحتفال بمولد النبي (صلى الله عليه وسلم):\n\nالشريعة تأمرنا بحبّ نبينا محمد (صلى الله عليه وسلم)، وتعظيمه وإعطائه الأهمية. والاحتفال بمولده صورة من صور التعبير عن هذا الحب والتعلق بسنته، بشرط أن يكون ذلك خاليًا من محظور يتعلق بالتشريع الديني. وكما أن هذا الاحتفال شكر لله على نعم الإسلام والإيمان، وشكر أيضًا على إرساله رحمة للعالمين.\n\nفلنا إذن الحق في التعبير عن امتناننا بأي طريقة كانت. فالاجتماع ليلة مولده لقراءة سيرته، وإنشاد القصائد التي تذكر صفاته والتي تحثّ المسلمين على اتباع أخلاقه الحميدة وإحيائها، دعوة إلى الله وتذكير مشروع.\n\nونحن في حاجة إلى مثل هذه المظاهر للتأمل وأخذ العبرة لتطوير سلوكياتنا.\n\nنحتفل به في كل وقت وحين. ونصلي عليه في كل مرة ينادي فيها المؤذن بالأذان وكذلك بعد كل صلاة حبًّا له. هو شفيعنا ودليلنا إلى كل خير وإصلاح في هذه الدنيا والآخرة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":564,"c":76,"d":"2019-11-03","t":"خروج الغازات؟","q":"السلام عليكم ورحمة الله وبركاته.\n\nأسأل عن شخص اعتاد خروج الغاز من الخلف على شكل ضراط، أحيانًا كأنه يخرج ويصعد.\n\nهل يمكن اعتباره كمرض «سلس الريح»؟\n\nفي هذه الحالة، هل إذا حدث وقت الصلاة أو أثناء أداء أوراد الطريقة يجب أن نقطعه رغم تكراره؟\n\nوإن كان نعم، هل يجب إعادة جميع الصلوات والأوراد التي أُدّيت منذ أن حدث لنا؟","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيجب أولًا تحديد طبيعة هذا السلس. لذلك يجب رؤية الطبيب والتأكد أنه مرض فعلًا. وقد تكون المشكلة أيضًا بسبب الوساوس «الوسواس»، لأن كل ما قد يشعر به الشخص في دبره ليس دليلًا على خروج ريح. يجب أن يكون الشخص متأكدًا أنه سمع أو شمّ رائحة خروج غاز، وعندها فقط يصبح واجبًا إعادة الطهارة والصلوات أو الأوراد التي تستلزم طهارة.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":563,"c":87,"d":"2019-11-03","t":"الزنا والتوبة","q":"السلام عليكم، سلام الله عز وجل عليكم.\n\nأريد أن أطلب نصيحة منكم لأنني ارتكبت ذنبًا أندم عليه كثيرًا. ارتكبت الزنا، سبحان الله حتى إنني أخجل من نفسي، والأسوأ في كل هذا أنني كنت تجانيًّا منذ سنة ونصف. وحسب أبحاثي فإن من هو خارج الطريقة ويرتكب مثل هذا الذنب يجب أن يتوب ويستغفر الله عز وجل (يمنحه لمن يشاء). والآن بما أنني كنت في الطريقة وكان ذلك خطأً مني أن أفعل ذلك، ماذا يجب أن أفعل؟\n\nأرجوكم ساعدوني.\n\nأنا نادم كثيرًا على أفعالي.\n\nسلام الله عز وجل عليكم.\n\nشكرًا لوقتكم.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nنصيحتي لهذا المريد الذي لم يحترم عهده والتزاماته مع الله ورسوله (صلى الله عليه وسلم) وكذلك مع شيخه أن يسرع إلى التوبة النصوح والرجوع إلى الله تعالى، وألّا يكون على صورة {التي نقضت غزلها من بعد قوة أنكاثا} القرآن 16/92.\n\nشروط التوبة واضحة في الدين والطريقة. يجب الندم على ما ارتُكب في الماضي، وترك الذنب في الحال ووضع عزم صادق على ألّا يعود إلى هذا الذنب أبدًا في المستقبل.\n\nيجب عليه أيضًا الابتعاد عن كل ما قد يقرّبه من هذا الذنب (الزنا) كما يجب أن يُكثر من الاستغفار والدعاء لأن الله غفور رحيم.\n\nقال سيدنا الشيخ أحمد التجاني (رضي الله عنه) في إحدى نصائحه لمريدي الطريقة:\n\n«إذا وقعت معصية، والعبد غير معصوم، فيجب المسارعة إلى التوبة والرجوع إلى الله. فإن لم يُفعل ذلك بسرعة، فليعلم العبد أنه يفقد مكانته عند الحق. في هذه الحالة، هو معرّض لغضب الله، إلا إذا كان بسبب ذنبه يشعر دائمًا في قلبه أنه يستحقه، وبشرط أن يمنحه الله عفوه. فقلبه إذن منكسر، واعٍ بسقوطه وانحطاط نفسه، دون أي كبر منه. فالعبد إذن في طريق الخير ما دام في هذه الحالة.\n\nاحذروا! نعوذ بالله من الشعور بالأمن من مكره فيما يتعلق بذنوبنا، والشعور بالأمان تجاه لومه. فمن بقي طويلًا في هذه الحالة تجاه الله، فهذا دليل على أنه سيموت كافرًا، ونعوذ بالله.»\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":562,"c":76,"d":"2019-11-03","t":"بقايا بعد الغسل","q":"السلام عليكم إخوتي الكرام\n\nأريد أن أعرف هل عباداتي صحيحة. بعد أن أغتسل من الغسل يحدث أن أرى بعض الآثار البيضاء الصغيرة في سروالي الداخلي. بارك الله فيكم على عملكم وجزاكم الله خيرًا آمين.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيجب على الشخص المعني أن يتحقق ويحدّد طبيعة هذا الأثر، ومتى خرج، لأن النتائج تعتمد على ذلك. فإذا مثلًا اكتشف أثرًا على ملابسه الداخلية بعد أن اغتسل الغسل الأكبر وتحقّق أنه كان موجودًا قبل اغتساله، فعباداته صحيحة ويكفيه في هذه الحالة أن يبلّل الثوب ويفركه بالماء، وليس ملزمًا أيضًا بإعادة صلواته.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":561,"c":87,"d":"2019-11-03","t":"السنّ والدخول في الإسلام","q":"السلام عليكم،\n\nأريد أن أعرف هل في سنّ الرابعة عشرة يمكن أن أدخل في الإسلام (أنا مسيحية). منذ صغري يجذبني هذا الدين فبدأت أقرأ وأتعلم السور، السورة الوحيدة التي أعرفها كاملة هي سورة الفاتحة. ثم أيضًا ما هي الخطوات التي يجب اتخاذها للذهاب لرؤية إمام، دائمًا أفكر في الذهاب لرؤية إمام لكن في كل مرة أريد أن أخطو الخطوة أنطوي على نفسي... آمل أن تردّوا عليّ. على هذا أمضوا أمسية طيبة إن شاء الله.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالأحكام المشروعة في الدين الإسلامي مرتبطة بالبلوغ الديني. فعندما يبلغ الشخص سنّ البلوغ يصبح مسؤولًا دينيًّا.\n\nاعتناق الدين الإسلامي أمر تعبّدي لا يعتمد على السنّ القانونية (الرسمية) للرشد، يكفي أن يكون لديك النية الصادقة، والوعي الكامل، والمعرفة العامة بأسس الدين (أركان الإسلام والإيمان).\n\nأما إعلان الدخول في الإسلام، فهو إجراء آخر يمكن للشخص تأجيله أو القيام به في الوقت الذي يراه مناسبًا.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":560,"c":84,"d":"2019-09-30","t":"حلق رأس المولود","q":"السلام عليكم\nأريد أن أعرف هل يجب حلق رأس المولود؟\nشكرًا.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nحلق رأس المولود عمل مستحب ومندوب، لكنه ليس واجبًا. يجب مراعاة الحالة الصحية للرضيع وإذا كان يمكن حلق رأسه دون خطر، وإلّا فيمكن مباشرة التصدّق بمبلغ من المال.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":559,"c":78,"d":"2019-09-30","t":"خصم الدَّين من الزكاة","q":"السلام عليكم،\nأقرضتُ زوج أختي مبلغ\n120.000,00 دينار جزائري (12 مليون سنتيم) لإصلاح سيارته.\nيوم عاشوراء، عندما قمت بحساباتي سأُخرج نفس المبلغ في الزكاة.\nهل يمكنني بالنية أن أقول لا تُرجع لي المبلغ؟\nأو أقول سامحتك؟\nأو ببساطة أعتبر هذا القرض مالَ زكاة عاشوراء؟\n\nشكرًا.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nالسلام عليكم ورحمة الله وبركاته.\n\nللإجابة عن هذا السؤال يجب معرفة الوضع المالي للمقترض والمُقرض.\n\nإصدار الفتوى يدور حول تحقيق المصلحة العامة، وقد نُقاد إلى الاختيار بين عدة آراء حسب الحالات.\n\nفي الأصل، لا يمكن خصم مبلغ دين من مبلغ الزكاة الواجب إخراجه.\n\nلكن بعض العلماء أجازوا هذه العملية بشروط خاصة جدًّا، وحجّتهم أن المدين العاجز عن سداد دينه من الفئات التي يمكن إعطاؤها الزكاة.\n\nفي حالتنا، بما أننا نجهل الوضع المالي للمُقرض والمدين، ننصح هذا الأخ الذي يريد إخراج زكاته أن يُخرجها من ماله الخاص، فهذا أفضل وأقرب إلى التقوى.\n\nوالله أعلم\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":558,"c":84,"d":"2019-09-29","t":"الذبح بالوكالة","q":"السلام عليكم\nسؤالي يتعلق بالعقيقة لابني الذي سيبلغ قريبًا 3 أشهر إن شاء الله:\n– هل يمكنني أن أقوم بذبح الخروفين عن طريق تبرّع بوضع النية (وبالتالي يستفيد أناس محتاجون) أم أنا ملزم أن أقوم بالذبح بنفسي كوني أباه؟ أعترف أنني أخاف أن أُسيء الذبح لأنني لم أفعل ذلك وحدي من قبل.\nبارك الله فيكم مقدمًا على إجابتكم.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالذبح الشرعي للمولد «العقيقة» سنة مستحبة. فإن كان هناك حرج في القيام به بنفسك، يمكنك أن تفعله بالوكالة، أي أن ترسل المال إلى شخص يتولّى القيام بالذبح نيابة عنك؛ ثم تتصدّق باللحم. وهذا جائز ومن يفعل ذلك مأجور.\n\nلكن إذا أعطيت الفقراء تبرّعًا ماليًّا يعادل ثمن خروفين، فهذا صدقة لكنك لن تكون قد أدّيت شعيرة العقيقة.\n\nوالله أعلم\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":557,"c":77,"d":"2019-09-29","t":"الصلاة أمام الإمام؟","q":"السلام عليكم\nصلاة المأموم الذي هو أمام الإمام.\n-هل يمكن أن نصلي أمام الإمام؟\n-وفي أي شرط تكون صلاة المأموم أمام الإمام صحيحة أو باطلة؟","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفي الأصل، من يصلي خلف الإمام «المأموم» يجب ألّا يقف أمام الإمام. فالإمام وُضع ليُتبع كما ورد في الحديث. فإن كان مع الإمام شخص واحد فقط، يقف إذن عن يمينه.\n\nفي الحالة التي لا يمكن للمسجد أن يستوعب كل المصلين الحاضرين خلف الإمام، يمكن للمصلين أن يصلّوا معه عند الضرورة. قال الله تعالى: {وما جعل عليكم في الدين من حرج}.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته."},{"id":556,"c":87,"d":"2019-09-29","t":"الأمانة في العمل","q":"السلام عليكم،\n\nلديّ سؤال يعود إلى ذهني باستمرار منذ أن قرأت مواضيع على الإنترنت. إليكم، عملتُ لشركة متعددة الجنسيات كبيرة في الأدوية لمدة 3 سنوات. في البداية كان لديّ الكثير من العمل وكنت أحيانًا أعمل أكثر من ساعاتي (كان يجب أن أؤدي 8 ساعات عمل يوميًّا). في النهاية أصبح عملي أقل إثارة وكنت أنجزه بسرعة. كان رئيسي دائمًا راضيًا جدًّا عن جودة عملي وقال لي ذلك عدة مرات. كنت أنهي دائمًا ما كان عليّ فعله. لكنني كنت أنهي بسرعة فكنت أبقى دون عمل غالبًا. سألني رئيسي مرة إذا كنت أشعر بالملل لكنني قلت دائمًا لا خوفًا من أن يعطيني عملًا غير محبّب (وقد حدث ذلك من قبل) أو عمل شخص آخر. الآن غادرتُ وأتساءل هل كان مالي حلالًا. كما قلت كان عملي يُنجز دائمًا وكنت أبقى في مكتبي حتى لو لم يكن لديّ ما أفعله في حال طُلب مني شيء. لن أُعيد المال إلى هذه الشركة على أي حال. هل يمكنني أن آخذ جزءًا منه وأعطيه لجمعية لأرتاح ضميريًّا؟\n\nبارك الله فيكم","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا كنت خلال عملك قد أنجزت ما طُلب منك فعله دون غشّ ولا خداع، فلماذا تطرح أسئلة؟\n\nلكن إذا تجنّبت بعض المهام التي جعلها عقدك واجبة لتبقى دون فعل شيء في مكتبك فهذا ليس من الأمانة. فيجب إذن الندم والتوبة إلى الله تعالى.\n\nإذا أردت أن تتبرع لجمعية، فهذا حسن. قال الله تعالى: {هل جزاء الإحسان إلا الإحسان}.\n\nوالله أعلم\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":555,"c":82,"d":"2019-09-29","t":"رسوم التحويل البنكي","q":"السلام عليكم\n\nكان لديّ سؤال بخصوص الرسوم البنكية المتعلقة بالتحويلات، تحويلات الأموال. فعلًا، عند التحويل البنكي الدولي (أو غيره)، تضيف البنوك ومنصات الدفع عبر الإنترنت (باي بال، سكريل إلخ) رسومًا إضافية (يمكنها مثلًا أن تأخذ 1-2% من المبلغ الإجمالي المرسل إلى شخص). أردت إذن أن أعرف هل هذا حرام.\n\nمع خالص التحيات.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالتحويل البنكي عملية إرسال واستقبال مال. والرسوم المقابلة ليست من العمليات البنكية المحرّمة لأن هذه الرسوم تمثل ثمن خدمة تحويل على صورة الرسوم البريدية المأخوذة على إرسال رسالة.\n\nوالله أعلم\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":554,"c":87,"d":"2019-09-29","t":"حضانة الأطفال والمَحْرَم","q":"السلام عليكم ورحمة الله،\nلديّ سؤال يتعلق بعمل زوجتي.\nنعيش في كندا. زوجتي كندية اعتنقت الإسلام والحمد لله.\nزوجتي لديها حضانة أطفال في وسط عائلي. تحضن 4 أطفال بين 1 و4 سنوات. وهكذا تحضن أطفالنا واحد عمره 3 سنوات، ابنتي 5 سنوات، ابني 8 سنوات. سؤالي أن الآباء يأتون لأخذ أطفالهم في البيت بما أنها حضانة في وسط عائلي. فأحيانًا يأتي الآباء فقط لأخذ أطفالهم فيُجبرون على الدخول إلى البيت. هناك أب يدخل ويبقى يلعب مع الأطفال في الحضانة في البيت. أحيانًا يبقى 20 أو 30 دقيقة. هذا الأب يلعب حتى مع أطفالي أنا. سؤالي: هل هذا محرّم في الدين بما أن زوجتي ليس معها محرم؟ وبما أن أطفالنا ما زالوا صغارًا؟ هل سأُصنَّف ديوثًا إن لم أتحدث مع زوجتي؟ أو إن قبلتُ هذا. أنا أثق بزوجتي لكن كون أب يأتي لأخذ ابنه ويبقى في البيت يلعب مع الأطفال أعرف أنه حرام وحتى المال الذي تكسبه زوجتي قد يكون حرامًا بما أنها تكون مع رجل دون محرم؟ فإن كان نعم فهل تركيب كاميرات أراقب بها زوجتي عن بُعد عندما يأتي الآباء لأخذ أطفالهم سيكون حلًّا؟\n\nبارك الله فيك","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيوجد رأي فقهي ينصّ على أن وجود طفل مميّز بلغ سنّ التمييز يزيل حرمة الخلوة بامرأة أجنبية (لسبب معتبر). لكن السؤال الذي يُطرح في حالتنا هو: هل من الضروري أن يبقى الآباء (أو أحدهم) في البيت عندما يأتون لأخذ أطفالهم؟\n\nحضانة الأطفال عمل تربوي مهم، لكن يجب دائمًا احترام المبادئ المشروعة. فيُشترط إذن لهذه السيدة أن تلبس لباسًا شرعيًّا (دينيًّا) وألّا تخلو بأيّ من الآباء، مع احترام دائمًا قوانين البلد الذي تعيش فيه فيما يخص هذه المهنة.\n\nننصح الزوجين بالتحاور لتنظيم هذا النشاط بطريقة تتجنّب كل شبهة أو ريبة، وإن رأيا أن الأمر ما زال غير مناسب، فلتغيّر هذه السيدة عملها لتتجنّب كل شرّ محتمل، فهذا أسلم وأطمأن.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":553,"c":79,"d":"2019-09-29","t":"تحديد بدايات الأشهر القمرية","q":"السلام عليكم يا شيخ.\n\nلديّ سؤال يتعلق بتحديد بدايات الأشهر القمرية خاصة لرمضان وشوال وذي الحجة.\nإذا لم نتفق مع الطريقة المستخدمة لدى السلطات، هل يمكن أن نتبع طريقنا الخاص حتى لو كنّا الوحيدين في هذا البلد؟\nفعلًا، بعض المنظمات تتبع السعودية، وهذا ما لا أعرفه في الشريعة وأيضًا هذا البلد مشهور بعدم الموثوقية في رؤية الهلال.\nوبعضها يحدّد الأشهر مسبقًا حسب التوقعات الفلكية كفرنسا وتركيا بينما أنا على رأي الرؤية المحلية وفقًا لحديث كريب وسيدنا ابن عباس.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nإذا كان الشخص مقيمًا في بلد مسلم فيجب عليه طاعة وليّ الأمر فيما يخص إعلان الشهر القمري الجديد وكل ما يترتب عليه كتواريخ الصيام والأعياد، إلخ.\n\nتوجد هيئات ومؤسسات إسلامية متخصصة تضمّ علماء ومتخصصين في الفلك، ولا يمكن مخالفتها إلا بأدلة وحجج علمية وفقهية معتبرة، وهذا ليس من اختصاص عامة الناس. فيجب إذن الحرص على الوحدة والاتفاق بين المسلمين لأنها غاية مقدّسة.\n\nأما من يقيم في بلد أجنبي، فننصحه أولًا بالشيء نفسه: إن وُجدت هيئات مختصة، يجب أن يلتزم بإعلاناتها. وإن حدث خلاف بينها، فليتبع الرأي الذي يراه أقرب إلى الحق بنية صادقة وليس لاعتبارات شخصية أو دنيوية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":552,"c":86,"d":"2019-08-02","t":"الطلاق والصلح","q":"السلام عليكم ورحمة الله وبركاته\nمن طُلّق طلاقه في المحكمة وأعطت المحكمة مهلة شهرين، للتراجع وإلّا فالقرار نهائي، وقبل انقضاء المهلة، أرسل الزوج إمامين للصلح، فقبلت المرأة وعادت إلى بيتها دون المرور بالمحكمة، ومع ذلك فإن الزواج\nأُقيم في المسجد وفي البلدية\n\nهل هذا الزواج ما زال صحيحًا على الصعيد الديني؟\nوهل الطفل الشرعي، الناتج عن هذا الصلح؟","a":"الرد\n\nردّ الإمام الخطيب الشيخ سيدي محمد الهادي ليتم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nما فهمناه من سؤالكم هو أن المحكمة لم تُعلن الطلاق بل أعطت مهلة للزوجين للتفكير والصلح، والصلح خير.\n\nبما أن الزوجين قرّرا خلال هذه المهلة إلغاء قرار الطلاق واتفقا على الصلح، فعلاقتهما الزوجية ما زالت صحيحة وهي حلال وقانونية.\n\nلكن يجب على الزوجين الذهاب إلى المحكمة لتسوية وضعهما القانوني.\n\nإذا كانت المعطيات هكذا فهذا ردّنا، وإلّا فأرجو تزويدنا بمزيد من التوضيحات.\n\nوعليكم السلام ورحمة الله وبركاته"},{"id":551,"c":87,"d":"2019-08-02","t":"الميراث من غير المسلم","q":"السلام عليكم ورحمة الله وبركاته،\n\nزوجتي (المعتنقة للإسلام حديثًا) تلقّت رسالة من شركة تأمين إثر وفاة خالتها. وبما أن والد زوجتي قد مات، فهي إذن التي يجب أن تتلقى جزءًا من التأمين على الحياة الذي كانت خالتها قد اكتتبت فيه.\nومع ذلك، نعلم أن هذا مال حرام وبالتالي لن نأخذه.\nلكنني أردت أن أعرف هل يمكننا استخدامه لقضية خارجة عنّا وتهمنا:\n– والداي اكتتبا قرضًا لشراء بيت في الماضي: هل يمكننا تسديد جزء من ديونهما بهذا المال؟\n– مسجد قيد الإنشاء في مدينتنا ويبحث عن أموال: هل يمكننا إعطاء جزء من هذا المال لهذا المسجد؟\n\nبارك الله فيكم على إجابتكم المستقبلية إن شاء الله.","a":"باسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، وبعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nيجوز لهذه الزوجة المسلمة أن ترث من خالتها غير المسلمة. ويمكنها أن تتصرّف في هذا المال كما تشاء، سواء لتسديد ديون الوالدين أو للتبرع لمنظمات إنسانية وخيرية تحقق مصلحة عامة. ويمكنها أيضًا أن تعطي لبناء مسجد خاصة إذا كانت هناك ضرورة ونقص في الوسائل المالية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":547,"c":85,"d":"2019-07-12","t":"الذهاب وحدها إلى بيت زوجها","q":"السلام عليكم\n\nتزوجت مؤخرًا، في أبريل 2019 أخرجت دفتر العائلة، وفي يونيو 2019 عقدت الفاتحة، لكنني لم ألتحق بعد ببيت زوجي، ما زلت عند والدي. كان متفقًا عليه أن أغادر بيتي في شهر ديسمبر، وهو الشهر الذي قررت فيه عائلة زوجي وعائلتي إقامة «3caht lahlal».\n\nزوجي يسكن في فرنسا وأخرجنا دفتر عائلة فرنسيًا. علمنا في بداية شهر أغسطس 2019 أن أوراقي أصبحت جاهزة. وتقتضي الإجراءات أن أذهب بنفسي لاستلامها. أراد زوجي أن أذهب لاستلامها وحدي، لكن والدي لم يُرد أن أذهب وحدي، لأنه ما دمت لم أخرج من بيته يفضل ألا أذهب وحدي لأسباب تتعلق بالسترة (soutra) حسب قوله. لم يعجب هذا زوجي، وأراد مني أن آتي بالقوة وأن أعصي والدي، لأن زوجي يرى أننا متزوجان بالفعل أمام الله وأمام القانون ولا شيء يمنع ذلك إلا والدي.\n\nتفاقمت الأمور ووصلت إلى مرحلة قد أُطلَّق فيها. أنا بحاجة ماسة إلى نصائحكم من فضلكم. هل يجب أن أتبع زوجي وأرحل رغم إرادة والدي، أم أتبع والدي رغم موقف زوجي الذي يصر على القول إنني أدرت له ظهري ووقفت إلى جانب والدي؟\n\nأتوسل إليكم أن تنوروني، فأنا على وشك أن أفقد زوجي أو عائلتي، وأنا يائسة لأنني لم أعد أعرف ما هو الصواب وما هو الخطأ وأي منطق هو المنطقي.\n\nبارك الله فيكم","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nقبل كل شيء، نذكّر بأنه من الصعب جدًا معالجة هذا النوع من الخلاف العائلي بمجرد إجابة عبر الإنترنت.\n\nهذه الحالة تحتاج إلى بعض التوضيحات، وتوجد بالتأكيد عدة حلول لحل هذه المشكلة، لكن يجب الكلام والنقاش بصدق من أجل التوصل إلى اتفاق والحفاظ على هذا الزواج الذي هو رابطة مقدسة.\n\nهذه الفتاة عقدت زواجًا لكنها ما زالت تعيش تحت سقف والدها. فأي ذنب اقترفته المسكينة حتى تجد نفسها في وضع يجب أن تختار فيه بين والدها وزوجها؟\n\nإن كنت قد فهمت الوضع جيدًا، فالمشكلة الأساسية تكمن في أن المرأة ستجد نفسها وحدها مع زوجها مع أن الزواج لم يُستكمل بعد؟\n\nيجب أن تعلموا أنه يمكن الاتفاق على اعتبار هذا الانفراد دخولًا شرعيًا بالزواج، نظرًا لأن الزوج ستكون له إمكانية الانفراد بزوجته.\n\nوإلا، فيرجى تزويدنا بمزيد من التفاصيل.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":545,"c":77,"d":"2019-06-06","t":"الإمام الذي يقوم لركعة خامسة","q":"السلام عليكم، بسم الله الرحمن الرحيم\n\nأثناء الصلاة خلف إمام، في الركعة الرابعة، بدل أن يجلس للتشهد، نهض رغم قولنا «سبحان الله» واستمر وأدى ركعة.\n\nنحن الذين خلفه، هل يجب أن نتبعه أم يجب أن نجلس؟ شكرًا. السلام عليكم.","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nالسلام عليكم ورحمة الله وبركاته\n\nإذا قام الإمام لركعة خامسة، وسبّح له المصلون، ومع ذلك لم يرجع، فهذا يعني على الأرجح أن لديه سببًا لذلك. وبالتالي يمكنه إخبار المصلين خلفه لتجنيبهم الشك.\n\nأما بالنسبة للمصلين، فهناك عدة حالات يجب تفصيلها.\n\nمن تيقن أن الإمام زاد وقام لركعة خامسة، فعليه أن يبقى جالسًا ولا يجب أن يتبعه في زيادته. وإذا فعل، بطلت صلاته.\n\nومن تيقن أن الإمام قام لركعة خامسة لسبب وجيه (مثل أنه ألغى ركعة واستبدلها بأخرى)، فعليه أن يتبع الإمام وجوبًا. وإذا لم يفعل، بطلت صلاته.\n\nأما من تردد ولم يتيقن، فهناك خلاف حول صحة صلاته.\n\nوهذا موضوع معقد ومعروف ذُكر في «المعيار الكبرى، شرح ابن عاشر».\n\nلهذا السبب، ينصح العلماء الإمام بأن يُعلم المصلين إذا قام لركعة خامسة لتجنيبهم الالتباس. يمكنه أن يقول مثلًا: «قوموا».\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":544,"c":76,"d":"2019-06-06","t":"العدسات اللاصقة والوضوء","q":"السلام عليكم.\n\nهل يجب حتمًا إزالة العدسات اللاصقة (عدسات النظر) من أجل الوضوء بالماء؟","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nالسلام عليكم ورحمة الله وبركاته\n\nفيما يخص العدسات اللاصقة، لا يجب إزالتها أثناء الوضوء لأن الواجب، وهو غسل الوجه، قد تحقق. والله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":543,"c":85,"d":"2019-04-28","t":"خروج الزوج مع الأصدقاء","q":"السلام عليكم، هل من الممكن الحصول على إجابة من شيخ من فضلكم؟\n\nالسؤال الأول:\n\nهل يجوز للرجل المتزوج أن يرغب في الخروج مساءً دون ضرورة، بل بين الأصدقاء «للترفيه»: مشاهدة مباراة كرة قدم، الذهاب إلى الحمام، بينما زوجته تقول له إنها لا تود أن يخرج مساءً ويتركها وحدها، بل أن يفعل ذلك نهارًا إلا إذا كان لضرورة كالصلاة أو العمل، واستثنائيًا لرؤية الأصدقاء، لكن في هذه الحالة ألا يتأخر طويلًا؟ الزوج يرفض بوضوح التغيير لأن خروجه يُقدَّر بمرتين أو ثلاث مرات، ويراها قليلة، ويقول للزوجة إن عليها أن تتأقلم وأنها ناكرة للجميل وأنانية. هل هذا صحيح أم لا؟\n\nالسؤال الثاني: هل يجوز للزوج أن يسافر وحده مع الأصدقاء للترفيه تاركًا زوجته، مع علمه أن زوجته غير موافقة، إلا في حالة الضرورة مرة أخرى كالعمل أو غيره؟\n\nالسؤال الثالث: هل المرأة أنانية بفرضها هذه الشروط على زوجها، مع أنها لا تقول له أن يبقى محبوسًا، بل أن يكون مسؤولًا بهدف الحفاظ على زواجهما، أم هو الظالم؟\n\nأتمنى أن تكون الأسئلة واضحة.\n\nبارك الله فيكم","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nالسلام عليكم ورحمة الله وبركاته\n\nيجب أن تُبنى العلاقة بين الزوجين على المودة والاحترام المتبادل والثقة. الخروج المتكرر مساءً مع الأصدقاء للترفيه وترك الزوجة وحدها ليس سلوكًا لائقًا من الزوج، خاصة إذا كانت الزوجة تخشى البقاء وحدها.\n\nأنصح الزوجين بالدخول في حوار صادق والتعاون المتبادل من أجل الحفاظ على المودة الزوجية والاستقرار الأسري.\n\nمن المؤكد أنه يجوز للزوج الخروج مع أصدقائه لمناسبة خاصة، بعد التشاور مع زوجته والتأكد من أنها ستكون في أمان أثناء غيابه، لكن يجب أن يبقى ذلك في حدود المعقول.\n\nمن جهة أخرى، يجب على المرأة ألا تبقى جامدة على وجهة نظرها، وأن تسعى لإرضاء زوجها قدر الإمكان، خاصة إذا علمت أنه صادق معها وأن خروجه مع أصدقائه لا يترتب عليه مخالفة دينية. ويجب على الزوج أيضًا أن يسعى لإرضاء زوجته وأن يبحث عن الوسط العادل، كما يجب عليه أن يقدم مصلحة عائلته على كل شيء.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":542,"c":87,"d":"2019-04-08","t":"التنويم المغناطيسي","q":"السلام عليكم\n\nأسمح لنفسي أن أكتب إليكم لأن لدي سؤالًا.\n\nفي الواقع، اليوم مع التنويم المغناطيسي، أصبح من الممكن الشفاء من الإدمان مثل التبغ، أو العادات الغذائية السيئة، أو حتى الرهاب أو الصدمات النفسية.\n\nهل يجوز للمسلم اللجوء إلى هذه الممارسة من أجل التحرر من إدمان؟\n\nبارك الله فيك\n\nالسلام","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالمشكلة الفقهية التي تطرح بخصوص التنويم المغناطيسي نابعة من الغموض الذي يحيط بطبيعته، نظرًا لأن العلماء ليسوا متفقين على تعريفه بدقة.\n\nفعديد منهم يمنعونه لأنهم يعتبرونه نوعًا من السحر أو ممارسة خفية تستعين بالجن، وهذا محظور في شريعتنا.\n\nلكن بعض العلماء يعتبرون أن استعمال التنويم المغناطيسي لأغراض طبية وعلاجية جائز لأنه يسمح مثلًا بالتكيف مع العالم العقلي للمريض وإحداث التغيير بتشجيع استعادة الثقة...\n\nفي ضوء هذه العناصر، يجب البقاء شديدي اليقظة والاستعلام جيدًا عن شخصية الطبيب أو المعالج، والنظر إلى دينه وورعه وتقيده بحدود شريعتنا الإسلامية في ممارسته الطبية، لأن بعض أنواع العلاجات غير التقليدية قد تختلط بسهولة بممارسات أو معتقدات مخالفة لديننا.\n\nومن يعاني من التدخين أو أي إدمان آخر يجب أن يتوكل على الله وأن يحسن الظن به، وأن يكثر من الدعاء مع الثقة بالله والعزيمة، فهذا سيساعده بالتأكيد على ترك هذه العادات السيئة، كما يجب عليه أن يصاحب الصالحين وأن يطلب نصائحهم ومساعدتهم. ويمكنه أيضًا أن يستشير من نجحوا في ترك التدخين أو الإدمان وأن يستفيد من تجربتهم. وبفعله ذلك، لن يحتاج بعد إلى اللجوء إلى التنويم المغناطيسي أو أي ممارسة مشبوهة أخرى.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":541,"c":84,"d":"2019-03-21","t":"ذبيحة العقيقة المتأخرة","q":"ابنتي البكر بلغت اليوم 16 سنة. عند ولادتها لم تكن لدي الإمكانيات لذبح خروف من أجل ذبيحة العقيقة.\n\nهل من الممكن فعل ذلك الآن؟ أم\n\nماذا يجب عليّ أن أفعل؟","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nالسلام عليكم ورحمة الله وبركاته\n\nالذبيحة للمولود الجديد سنة (سنة نبوية). من لم يستطع أداءها لأحد أولاده، بسبب قلة الإمكانيات أو لسبب آخر، يمكنه فعلها عندما تتاح له الفرصة. وقد ورد في الآثار أن النبي (صلى الله عليه وسلم) أدى ذبيحة المولود عن نفسه، وكان ذلك بعد الوحي.\n\nإذن يمكن للشخص المعني أن يشتري خروفًا ويذبحه بنية أداء شعيرة ذبيحة العقيقة (العقيقة) لابنته. ويمكنه التصدق به كله كما يمكنه أن يتصدق بجزء منه ويأكل جزءًا آخر.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":540,"c":87,"d":"2019-03-21","t":"تبني كلب","q":"السلام عليكم ورحمة الله وبركاته\n\nأشكركم مسبقًا على كل العمل الذي تقومون به من أجل الأمة وكذلك من أجل الطريقة. سؤالي يتعلق بإجازة تربية كلب في البيت، هل هو حرام؟\n\nرأيت كثيرًا من الأحاديث سواء عن أن الملائكة لا تدخل بيتًا فيه كلب، وأحاديث أخرى حيث ترك النبي صلى الله عليه وسلم الكلاب تدخل المسجد.\n\nهل يمكنكم توضيح ذلك لي، لأنني أود تبني كلب ولا أعرف إن كنت على خطأ.\n\nبارك الله فيكم","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nفعلًا، إن المنع من اتخاذ كلب في البيت لأن الملائكة لا تدخل بيتًا فيه كلب قد ثبت صحته حسب الحديث الذي رواه البخاري.\n\nوبالتالي لا يجوز للمسلم تبني كلب، إلا في حالات الضرورة المؤكدة مثل: كلاب الحراسة، كلاب الصيد، تلك التي تحرس القطعان، تلك التي تقود العميان، الكلاب الموجودة لدى أعوان الجمارك أو النظام وغيرها من الحالات المشابهة...\n\nإذن هذا جائز إذا كان يجب تحقيق مصلحة أو دفع مضرة. وفي هذه الحالة، يمكن إدخاله إلى البيت وتخصيص مأوى أو بيت له في الحديقة، على شرفة، على سطح أو أي ركن مناسب آخر من البيت.\n\nنجاسة الكلب محل خلاف. عند المالكية، الكلب طاهر وفق القاعدة: كل حي طاهر.\n\nأما ما ورد في السنة أن الكلاب كانت تدخل المسجد وتبول فيه، فكان ذلك في البدايات. ويجب أن تعلموا أن المساجد في تلك الحقبة لم تكن لها أبواب ولا سجاد يمكن أن يتنجس، والقاعدة الأصلية أن الأرض تطهر من النجاسات بالمطر والشمس.\n\nثم جاء الأمر بتطهير المساجد وصيانتها. قال الله تعالى: ﴿فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ﴾. أي يجب أن تُكرَّم وتُطهَّر وتُصان.\n\nلا بأس إذا مر كلب في ساحة المسجد أو حديقته، خاصة في البلدان التي تكون فيها المساجد ملتصقة ببيوت يسكنها غير المسلمين. لا يجب لومهم بسبب ذلك.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":539,"c":87,"d":"2019-02-20","t":"تقسيم الميراث في حالة إعادة الزواج","q":"السلام عليكم، بسم الله الرحمن الرحيم،\n\nسؤالي: والداي توفيا العام الماضي، رحمهما الله وفتح لهما أبواب الفردوس وكذلك لجميع المرحومين. والدي من زواج أول أنجب ولدًا وبنتًا عمرهما 50 و51 سنة، طلق ثم تزوج بأمي بعد ذلك، وأنجبا أولادًا، ولدين وبنات. الآن بالنسبة للميراث، أود أن أعرف إن كان لأخي وأختي من أبي الحق أيضًا في نصيب من ميراث والدي. شكرًا على الإجابة على السؤال، بارك الله فيك. السلام عليكم.","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nنعلم الأخ أو الأخت العزيزين اللذين طرحا السؤال أن لإخوتهما وأخواتهما من الأب نفس الحق في ميراث والدهما، وفق قاعدة التقسيم: «يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ».\n\nإذن يُقسَّم الميراث بين جميع الأولاد (من الزوجة الأولى والثانية): للولد نصيب يعادل نصيب بنتين.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":538,"c":85,"d":"2019-02-20","t":"نصائح للمقبلين على الزواج","q":"السلام عليكم جميعًا\n\nاسمحوا لي أولًا أن أهنئكم على هذه التبرعات التي لا تُحصى التي تقدمونها للمحتاجين، وأدعو الله أن يمنحكم نعمه في الدنيا والآخرة، آمين.\n\nأتيت لأطلب منكم نصائح. في الواقع، إن شاء الله أنوي الزواج في الأشهر القادمة.\n\nأسئلتي إذن هي كالتالي:\n1- ما النصائح التي تقدمونها للعروسين المقبلين؟\n2- ما ستكون واجباتي، أنا الرجل، تجاه زوجتي؟\n\nأشكركم مسبقًا.\nوفقنا الله وهدانا إلى طريق السعادة الدائمة.\nالصلاة والسلام على نبينا الكريم الموقر صلى الله عليه وسلم.\nتقبل الله القطب المكتوم CRTA، آمين.","a":"وعليكم السلام ورحمة الله وبركاته.\n\nنهنئ أخانا على مشروع زواجه ونسأل الله العلي القدير أن يمنحه البركة وحسن السيرة.\n\nأما نصيحتنا له، فهي حسن المعاشرة مع الزوجة كما يأمرنا ربنا (جل شأنه) في قوله: «وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ». فهي له مصدر سكينة وطمأنينة، والثبات على أداء مختلف واجباته العاطفية أو المادية والمالية.\n\nيجب على الزوجين أيضًا الصبر إزاء السلوكيات السيئة المحتملة التي قد تظهر، والمسارعة إلى إصلاح ذلك بلطف كلما حدث. ويجب على الزوجين ألا ينسيا أن الحياة الزوجية مودة ووفاء وصدق وتضحية وتكامل متبادل.\n\nأنصحه أيضًا بأن يكون قدوة حسنة لزوجته في الخلق الكريم لأن «الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ»، وأن يتخذ مثالًا حياة نبينا الحبيب (صلى الله عليه وسلم) ولا سيما سلوكه مع زوجاته. ومن الجيد أيضًا التثقف بقراءة بعض الكتب التي تعالج بالتفصيل موضوع الحقوق الزوجية.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته\n\nسلام."},{"id":537,"c":77,"d":"2019-02-20","t":"غرض أمام المُصلي","q":"السلام عليكم.\n\nعندما نصلي في فضاء ما، نضع غرضًا أمامنا مباشرة يخدم كحاجز بين من يصلي والمارة الآخرين، هل وضع هذا الغرض واجب من اللحظة التي يستطيع فيها من يؤدي صلاته أن يؤديها دون إزعاج؟","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nوضع حاجز (سترة) بين من يصلي والمارة الآخرين من سنن الصلاة. وهي مشروعة للإمام أو لمن يصلي وحده إذا خافا أن يمر أحد أمامهما. أما من يصلي خلف الإمام فإمامه هو من يضع سترته.\n\nأما صفات السترة: شيء طاهر وثابت طوله ذراع وسمكه رمح. وإذا شاء، يمكنه أيضًا أن يؤدي صلاته خلف عمود أو ركن في المسجد من أجل تحديد فضاء صلاته.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":536,"c":77,"d":"2019-02-20","t":"لف الرأس يمينًا ويسارًا في نهاية الصلاة","q":"السلام عليكم.\n\nلماذا في نهاية كل صلاة نلف رأسنا يمينًا ويسارًا ثم؟","a":"وعليكم السلام ورحمة الله وبركاته.\n\nالتسليم الأخير في الصلاة (السلام) من واجبات الصلاة المتفق عليها. عند المالكية، تسليمة واحدة إلى اليمين واجبة، بينما عند جمهور العلماء، السنة أن يلف المصلي رأسه إلى يمينه ويساره. وهناك أيضًا حديث ابن مسعود (رضي الله عنه) الذي يروي أن النبي (صلى الله عليه وسلم) قال: «السلام عليكم ورحمة الله» حتى تُرى بياض خده الأيمن، ثم إلى يساره حتى تُرى بياض خده الأيسر.\n\nويُستحب عند المالكية أن يشير المصلي نحو الإمام ليرد على سلامه وكذلك إلى يساره إذا وُجد هناك شخص.\n\nوالله أعلم.\n\nوالسلام عليكم ورحمة الله وبركاته"},{"id":535,"c":76,"d":"2019-02-12","t":"نزيف المرأة الحامل التي بلغت أوان الولادة","q":"السلام عليكم\n\nأنا حامل حاليًا الحمد لله وعلى وشك الولادة إن شاء الله\n\nفحص الطبيب عنق الرحم مما سبب لي نزيفًا، وفي اليوم التالي لم يبقَ إلا إفرازات بنية ثم لم يعد هناك شيء! واصلت صلواتي دون أن أطرح على نفسي أي سؤال.\n\nفي نهاية المساء عاد النزيف الأحمر لكن هذه المرة مصحوبًا بألم وتقلصات. هل يجب أن أواصل صلاتي أم يجب أن أعتبر أن المخاض لن يتأخر وأن هذا الدم بسبب ولادة وشيكة؟\n\nمهما يكن، سيتم تحفيز ولادتي يوم الأحد أو الاثنين لأنني تجاوزت الموعد المحدد.\n\nشكرًا لإزالة الشك عني لأنني توقفت عن الصلاة لأنني رأيت على موقعكم أنني يجب أن أعتبر ذلك حيضًا، لكن هل أنا حقًا في هذه الحالة؟ هل يجب أن أقضي هذه الصلوات بعد طهارتي؟\n\nشكرًا","a":"إجابة الإمام الداعية الشيخ سيدي محمد الهادي لطيم (حفظه الله)\n\nباسم الله الرحمن الرحيم، الحمد لله والصلاة والسلام على رسول الله، أما بعد:\n\nوعليكم السلام ورحمة الله وبركاته.\n\nالدم الذي يسيل من المرأة الحامل يومًا أو يومين وحتى ثلاثة أيام قبل الولادة هو دم نفاس، ويُعرف بالآلام المصاحبة له. وكلاهما من علامات النفاس. في هذه الحالة، يجب على المرأة أن تتوقف عن الصلاة وعن مس المصحف وعن الطواف حول الكعبة.\n\nوبالتالي سيكون لها نفس حكم المرأة الحائض.\n\nأما الدم الذي يخرج قبل الولادة بثلاثة أيام ودون آلام، فهو إفرازات مهبلية تُبطل الوضوء فقط لأنه دم علة أو مرض.\n\nوالله أ
