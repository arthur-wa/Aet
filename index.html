حضره من الملائكة ومؤمني الإنس والجن كما قيل في آداب الذكر :\nمنه طهارة وطيب المجلس لمؤمني الجن وطيب الملبس\nوتذكر هنا ما ثبت في الشريعة من الأمر بغسل الجمعة والعيد والتجمل والطيب فيهما وما ذكره العلماء في وجه ذلك وما ثبت من أنه صلى الله عليه وسلم كان يتجمل للوفود يفتح لك الباب وينكشف عنك الحجاب فالله حسيب من ينكر علينا معشر التجانيين نشر الثوب إذ ذال .\nونهج سبيلي واضح لمن اهتدى ولكنها الأهواء عمت فأعمت\nوحدثني بعض العلماء الفضلاء من الأصحاب أن أصل نشر الرداء أن الشيخ وأصحابه كانوا يقرؤون الوظيفة قبل بناء الزاوية بباب داره وهو محل المرور فكان لذلك يأمر بنشر الثوب تحفيظا للطهارة فلما بنيت الزاوية استحب ذلك .إنتهى\nوقال العارف بالله سيدي مْحمد بن عبد الواحد النظيفي في مباديء الإشراق والإسعاد : ونشر الإزار أمر خاص لأمر خاص ولحكمة بالغة وما يعقلها إلا العالمون.إنتهى\nوقال العارف بالله القطب سيدي الأحسن البعقيلي رضي الله عنه في كتابه الإراءة الجزء الثاني : وانشر للجوهرة ثوبا نقيا طاهرا نظيفا طيبا وجوبا نظريا واقتداءا بالشيخ رضي الله عنه فوجب عليه جميع ما عليه عمله وإن كان أصله الندب مبالغة في النظافة فإن أطلعك الله على سره في قلبك فذاك وإلا فامتثل تربح …..ويجوز التبرك به وأن يكفن فيه الميت ولا سيما أهل الخصوصية والغرباء ومن أوصى به أو أحب الطريقة وإن لم يسلك في سلكها فلا حسد على الفضل ….ولا ينشر لهيللة الجمعة.إهـ\nوسئل سيدي محمد بن الحسن الجكاني رضي الله عنه ما السر في نشر الإزار عند الجوهرة هل ينشر لحروفها أو لمن يحضر عند السابعة هذا نص السؤال فأجاب رضي الله عنه كما في أجوبته الخمسة والسبعون في فقه الطريقة: الإزار ينشر اقتداءا بالشيخ رضي الله عنه فيصير حكمه الوجوب وجوب اقتداء وإن كان حكمه أصلا الندب وإنما ينشر لحروف الجوهرة لا غير قال في الإراءة فإن أطلعك الله على سره في قلبك فذلك وإلا فامتثل تربح ويجوز التبرك به وأن يكفن فيه الميت لا سيما أهل الخصوصية ومن أوصى به وإن لم يكن فقيرا فلا حسد على فضل الله .إهـ\nويقول الشيخ سيدي محمد بن عبد الله الطصفاوي في كتابه الفتح الرباني فيما يحتاج إليه المريد التجاني : وأما الإنكار على نشر الإزار عند ابتداء جوهرة الكمال فلا معنى له إذ قد ورد في أقوال السادة الصوفية أنه ينبغي تعظيم محل الذكر والمبالغة في طهارته ووضع الطيب فيه قال في البغية قال في شرح الحصن وجاء عن الإمام الجليل أبي ميسرة رضي الله عنه قال لا يذكر الله تعالى إلا في مكان طيب . ونقل عن صاحب تهذيب الأذكار ينبغي تطييب المجلس بالرائحة الطيبة لأجل الملائكة والجن وقطع العلائق المشوشة . وهل لنشر الإزار معنى إلا التعظيم للذكر والمبالغة في النظافة التي قال العلماء بأنها مستحبة وأنها من تعظيم الذكر والمذكور .إهـ\n\nهذا ومنكر افتراش الثوب الأبيض مع إقراره افتراش الزرابي بجميع ألوانها لعلامة على نقص في عقله مع العلم أن النبي صلى الله عليه وسلم تجاوز افتراش المفروشات ليفترش ثيابه المباركة لغيره ففي المغني عن حمل الأسفار في تخريج ما في الإحياء من الأخبار لزين الدين العراقي حديث ” إن ظئر رسول الله صلى الله عليه وسلم التي أرضعته جاءت إليه فبسط لها رداءه ثم قال لها مرحبا بأمي ثم أجلسها على الرداء ثم قال لها اشفعي تشفعي وسلي تعطي فقالت : قومي فقال : أما حقي وحق بني هاشم فهو ذلك فقام الناس من كل ناحية وقالوا : وحقنا يا رسول الله . ثم وصلها بعد وأخدمها ووهب “لها سهمها بحنين أخرجه أبو داود والحاكم وصححه من حديث الطفيل مختصرا في بسط ردائه لها دون ما بعده وفي الإصابة في تمييز الصحابة لإبن حجر العسقلاني قدمت ابنة خالد ابن سنان على النبي صلى الله عليه وسلم فبسط لها رداءه وأجسلها عليه وقال ابنة نبي ضيعه قومه. وفي الطبقات الكبرى لإبن سعد :عن محمد بن المنكدر قال أستأذنت امرأة على النبي صلى الله عليه وسلم قد كانت أرضعته فلما دخلت عليه قال أمي أمي وعمد إلى ردائه فبسطه لها فقعدت عليه قال أخبرنا إبراهيم بن شماس السمرقندي قال أخبرنا الفضل بن موسى السيناني عن عيسى بن فرقد عن عمر بن سعد قال جاءت ظئر النبي إلى النبي صلى الله عليه وسلم فبسط لها رداءه وأدخل يده في ثيابها ووضعها على صدرها قال وقضى حاجتها قال فجاءت إلى أبي بكر فبسط لها رداءه وقال لها دعيني أضع يدي خارجا من الثياب قال ففعل وقضى لها حاجتها ثم جاءت إلى عمر ففعل مثل ذلك. وفي تهذيب الكمال للمزي :أن أبا الطفيل أخبر قال كنت غلاما أحمل عضو البعير فرأيت رسول الله صلى الله عليه وسلم يقسم لحما بالجعرانة فجاءته امرأة فبسط لها رداءه فقلت من هذه قالوا أمه التي أرضعته .وفي زاد المعاد في هدي خير العباد لإبن القيم الجوزية :وقدمت الشيماء بنت الحارث بن عبد العزى أخت رسول الله صلى الله عليه وسلم من الرضاعة فقالت : يا رسول الله ! إني أختك من الرضاعة قال : وما علامة ذلك ؟ قالت : عضة عضضتنيها في ظهري وأنا متوركتك قال : فعرف رسول الله صلى الله عليه وسلم العلامة فبسط لها رداءه وأجلسها عليه . وفي كتاب الشفا للقاضي عياض : و لما جيء بأخته من الرضاعة الشيماء في سبايا هوازن و تعرفت له بسط لها رداءه.\nو لنشر الثوب الأبيض أثناء ذكر الوظيفة فوائد جمة متعددة تعكس تمسك التجانيين بسنة مولانا رسول الله صلى الله عليه وسلم . روى كل من الترمذي والنسائي وابن ماجة في سننهم وابن حبان في صحيحه والحاكم في مستدركه وقال صحيح على شرط مسلم عن أبي هريرة قال قال رسول الله صلى الله عليه وسلم : أكثروا ذكر هاذم اللذات. إهـ وفي مجمع الزوائد للهيثمي عن أبي هريرة قال : قال رسول الله صلى الله عليه وسلم استكثروا ذكر هاذم اللذات فإنه ما ذكره أحد في ضيق إلا وسعه ولا ذكره في سعة إلا ضيقها عليه و رواه الترمذي وغيره باختصارورواه الطبراني في الأوسط وإسناده حسن، وفيه أيضا:عن أنس أن رسول الله صلى الله عليه وسلم مر بمجلس وهم يضحكون قال أكثروا من ذكر هاذم اللذات أحسبه قال- فإنه ما ذكره أحد في ضيق من العيش إلا وسعه عليه ولا في سعة إلا ضيقها عليه.رواه البزار والطبراني باختصار عنه وإسنادهما حسن . وفيه أيضا وعن ابن عمر قال : قال رسول الله صلى الله صلى الله عليه وسلم أكثروا ذكر هاذم اللذات – يعني الموت – فإنه ما كان في كثير إلا قلله ولا قليل إلا جزأه رواه الطبراني في الأوسط وإسناده حسن.إهـ وأكثروا من ذكر هاذم اللذات قال حجة الإسلام أبي حامد الغزالي في إحيائه: ومعناه نغصوا بذكره اللذات حتى ينقطع ركونكم إليها فتقبلوا على الله تعالى .إهـ وقال الشعراني في كتابه لواقح الأنوار القدسية في العهود المحمدية : أخذ علينا العهد العام من رسول الله صلى الله عليه وسلم أن نتعاطى الأسباب التي تذكرنا بالموت وتقصر أملنا كمعاشرة العباد والزهاد في الدنيا امتثالا لقوله صلى الله عليه وسلم : اذكروا هاذم اللذات . وما لا يتوصل إلى فعل المأمور إلا به فهو من جملة المأمور واجبا لواجب ومندوبا لمندوب .وفيه أيضا عن سيدي علي الخواص قال : من الأضداد أن من يذكر الموت يحيا قلبه ومن ينساه يموت وذلك لأن من لازم ذكر الموت قصر الأمل والمبادرة في العمل فمثل هذا ولو طال عمره فعمله حسن إن شاء الله تعالى وذلك أعظم ما يكون العبد عليه .إهـ وقال المناوي في فيض القدير : أكثروا ذكر الموت فإنه أي ذكره يمحص الذنوب أي يزيلها ويزهد في الدنيا فإن ذكرتموه عند الغنى هدمه وإن ذكرتموه عند الفقر أرضاكم بعيشكم وذلك لأن نور التوحيد في القلب وفي الصدر ظلمة من الشهوات فإذا أكثر الإنسان ذكر الموت بقلبه انقشعت الظلمة واستنار الصدر بنور اليقين فأبصر الموت وهو عاقبة الأمر فرآه قاطعا لكل لذة حائلا بينه وبين كل أمنية ورآها أنفاسا معدودة وأوقاتا محدودة لا يدري متى ينفذ العدد وينقضي المدد فركبته أهوال الحط وأذهلته العبر وتردد بين الخوف والرجاء فانكسر قلبه وخمدت نفسه وذبلت نار شهوته .إهـ وقال الصنعاني في كتابه سبل السلام :والحديث دليل على أنه لا ينبغي للإنسان أن يغفل عن ذكر أعظم المواعظ وهو الموت.إهـ\nفإذا كان القدوة الأعظم سيدنا ومولانا محمد صلى الله عليه وسلم يحثنا معشر المسلمين على الإكثار من ذكر هادم اللذات الذي هو الموت ويرغبنا في عدم الغفلة عنه كما مر معنا كقوله صلى الله عليه وسلم : {أكثروا ذكر هاذم اللذاتْ} فنشر التجانيين للإزار الأبيض إنما هو تجسيد حي لهذا الحديث المبارك فالثوب الأبيض كما قال سيدي محمد بن عبد الواحد النظيفي في خريدته :\n***وكفن به الموتى من أجل التبرك***\nوقال في شرحه {به} أي في الإزار المذكور .إنتهى إذ أن النظر إلى الثوب الأبيض مشعر بحقيقة كون الناظرإليه يوما سيكون مستلقيا على مثله وهو يستحضر قوله صلى الله عليه وسلم فيما يرويه النسائي بسند صحيح : {عليكم بالبياض من الثياب فليلبسها أحياؤكم وكفنوا فيها موتاكم فإنها من خير ثيابكم.}ونشر الثوب الأبيض يكون التجانيون به قد امتثلوا أمر النبي صلى الله عليه وسلم ويوميا بذكرهم للموت وهو ما لا يتأتى لمنكريه وغيرهم إلا للقليل منهم وبوجود المنبهات عليه كمرور جنازة مثلا أو زيارة لمقابر .\n\nونشر الثوب الأبيض عند الذكر إنما هو كذلك جمعٌ لهمة الذاكرين على الذكر وقطع للوساوس الدنيوية والخواطر الشيطانية التي هي موانع الخشوع والحضور في الذكر.والمصرعلى إنكار نشر الثوب الأبيض عند الذكر مع علمه لأسباب نشره إنما هو إعانة وعون من أعوان الشيطان في محاربة أسباب الخشوع في الذكر واستعاب ألفاظه وقد أجمع علماء أصول الفقه على أن ما لا يتم الواجب إلا به فهو واجب. فتغميض العينين في الصلاة مثلا من مكروهاتها ففي كتاب الفقه على المذاهب الأربعة لمؤلفه عبد الرحمن الجزيري عند ذكره لمكروهات الصلاة قوله: ومنها تغميض عينيه إلا لمصحلة كتغميضها عما يوجب الاشتغال والتلهي وهذا متفق عليه.إنتهى فلما كان نشر الثوب الأبيض سبب قوي في خشوع الذاكر والتأدب مع المذكوركان الحرص عليه كالحرص على حصول الخشوع .\n\nونشر الثوب الأبيض عند الذكر إنما هو أيضا امتثال واقتداء بصنيع النبي صلى الله عليه وسلم الذي ورد عنه عن عائشة قالت :{قام رسول الله صلى الله عليه وسلم يصلي في خميصة ذات أعلام فنظر إلى علمها فلما قضى صلاته قال اذهبوا بهذه الخميصة إلى أبي جهم بن حذيفة وائتوني بأنبَجانية فإنها ألهتني آنفا في صلاتي} رواه البخاري ومسلم في صحيحهما وفي روايةالامام مالك في الموطأ :{أن عائشة زوج النبي صلى الله عليه وسلم قالت :أهدى أبو جهم بن حذيفة لرسول الله صلى الله عليه وسلم خميصة شامية لها علم فشهد فيها الصلاة فلما انصرف قال ردي هذه الخميصة إلى أبي جهم فإني نظرت إلى علمها في الصلاة فكاد يفتنني} ونشر التجانيين للثوب الأبيض إنما هو من هذا القبيل وعمل بسنة من قال فيه الله سبحانه وتعالى :{لقد كان لكم في رسول الله أسوة حسنة لمن كان يرجو الله واليوم الآخر وذكر الله كثيرا}."}, {"q": "قرأت في احد المواقع ان الشيخ احمد التجاني يقر بعقيدة وحدة الأديان صراحة و ذلك في قوله في جواهر المعاني ” كل عابد أو ساجد لغير الله في الظاهر فما عبد ولا سجد إلا لله تعالى لأنه هو المتجلي في تلك الألباس وتلك المعبودات كلها تسجد لله تعالى إلى أن قال وقوله لا إله إلا أنا يعني لا معبود غيري وإن عبد الأوثان من عبدها فما عبدوا غيري ولا توجهوا بالخضوع والتذلل لغيري بل أنا الإله المعبود فيهم ” فما ردكم على ذلك", "a": "بسم الله و الحمد لله و الصلاة و السلام على رسول الله\n\nجوابا على هذا السؤال نورد ما جاء في جاء في “خلاصة الادلة الشرعية في الرد على تساؤلات الحشوية ” للشيخ محمد مفتاح بن صالح التجاني الابراهيمي\n\nحيث يبين\n\nوأما اعتراضه على قول الشيخ التجاني في جواهر المعاني ج1 ص159: “فكل عابد أو ساجد لغير الله في الظاهر فما عبد ولا سجد إلا لله تعالى لأنه هو المتجلي في تلك الألباس وتلك المعبودات كلها تسجد لله تعالى إلى أن قال وقوله لا إله إلا أنا يعني لا معبود غيري وإن عبد الأوثان من عبدها فما عبدوا غيري ولا توجهوا بالخضوع والتذلل لغيري بل أنا الإله المعبود فيهم\n\nفالجواب عنه من ثلاثة أوجه: أولها : أنه لفق هذه الفقرة من كلام طويل للشيخ أحمد التجاني في تفسير آية قل إن كنتم تحبون الله فاتبعوني يحببكم الله بلغ خمس عشرة صفحة حيث بدأه من ج1 ص155 س7 وأنهاه في ج1 ص170 س2 من جواهر المعاني ط دار الجيل وهو في غاية الإحكام ووحدة الموضوع والانسجام غاص فيه لجج المعاني وأصله بالأدلة الشرعية من علم المباني\n\nفتصرف هو فيه بجعله شذرة شذرة حيث أخر منه وقدم وتجاوز وبتر ليحرفه عما وضع له وبيان ذلك أنه ساق منه ستة أسطر في مختم منشوره معلقا بها على مسألته السابعة التي هي الأخيرة عنده ثم تجاوز سطرين هما محل الاحتجاج عليه وهما:\n\n“فهم ـ يعني عبدة الأوثان ـ محبون لله عابدون له من حيث لا يشعرون وهذه العبادة هي المعبر عنها بالسجود كرها قال سبحانه وتعالى ولله يسجد من في السماوات والأرض طوعا وكرها وظلالهم بالغدو والآصال، وهذه الجملة والآية هما اللتان تربطان بين ما ساقه من كلامه في مختم منشوره وبين ما ساقه في هذه الفقرة التي هي أول مسألة منه. ثم إنه ساق قول الشيخ أحمد التجاني “فكل عابد أو ساجد لغير الله في الظاهر فما عبد ولا سجد إلا لله تعالى لأنه هو المتجلي في تلك الألباس وتلك المعبودات كلها تسجد لله تعالى” ثم وضع نقاط استرسال وتجاوز مرة أخرى أربعة أسطر فيها الحجة عليه، ومزيد تفصيل ما ساق من كلام الشيخ في هذه الفقرة وما تجاوز منه هو قوله:”وتعبده وتسبحه خائفة من سطوة جلاله سبحانه وتعالى ولو أنها برزت لعبادة الخلق لها وبرزت لها بدون تجليه فيها لتحطمت في أسرع من طرفة عين لغيرته سبحانه لنسبة الألوهية لغيره تعالى، قال سبحانه وتعالى لكليمه موسى عليه الصلاة والسلام إنني أنا الله لا إله إلا أنا فاعبدني والإله في اللغة المعبود بالحق\n\nقلت: وبإرجاع هذه الفقرات إلى محالها يلتئم كلام الشيخ التجاني وينسجم على وفق ما جاء في جواهر المعاني ويتبين بجلاء أن ما قاله لا يستساغ إنكاره بوجه شرعي لاعتماده فيه على آيتين محكمتين صريحتين في الاستدلال هما قوله تعالى في سورة الإسراء يسبح له السماوات السبع والأرض ومن فيهن وإن من شيء إلا يسبح بحمده ولكن لا تفقهون تسبيحهم إنه كان حليما غفورا وقوله تعالى في سورة الرعد ولله يسجد من في السماوات والأرض طوعا وكرها وظلالهم بالغدو والآصال\n\nثانيها: أن سجود وصلاة وتسبيح وإذعان جميع المخلوقات طوعا من المؤمنين وكرها من الكافرين جاء في إحدى عشرة آية محكمة احتج الشيخ التجاني بالآيتين المتقدمتين منها والتسع الأخر هي\n\nقوله تعالى في سورة النحل:أولم يروا إلى ما خلق الله من شيء يتفيؤ ظلاله عن اليمين والشمائل سجدا لله وهم داخرون\n\nوقوله تعالى ولله يسجد ما في السماوات وما في الأرض من دابة والملائكة وهم لا يستكبرون\n\nوقوله تعالى في سورة آل عمران وله أسلم من في السماوات والأرض طوعا وكرها وإليه ترجعون وقوله في سورة النور ألم تر أن الله يسبح له من في السماوات والأرض والطير صافات كل قد علم صلاته وتسبيحه والله عليم بما يفعلون\n\nوقوله تعالى في سورة الحديد سبح لله ما في السماوات والأرض،\n\nوقوله تعالى في سورة الحشر سبح لله ما في السماوات وما في الأرض وهو العزيز الحكيم،\n\nوقوله تعالى في سورة الصف سبح لله ما في السماوات وما في الأرض وهو العزيز الحكيم،\n\nوقوله تعالى في سورة الجمعة يسبح لله ما في السماوات وما في الأرض الملك القدوس العزيز الحكيم،\n\nوقوله تعالى في سورة التغابن يسبح لله ما في السماوات وما في الأرض له الملك وله الحمد\n\nقلت: ولا شك ولا ريب أن عموم هذه الآيات يدخل فيه جميع العوالم الكونية بما في ذلك الأصنام وعبدتها، قال الحافظ بن كثير في تفسير الآية التي في سورة الرعد ما لفظه: “يخبر تعالى عن عظمته وسلطانه الذي قهر كل شيء ودان له كل شيء طوعا من المؤمنين وكرها من الكافرين، فالمؤمن مستسلم بقلبه وقالبه لله والكافر مستسلم لله كرها فإنه تحت التسخير و القهر والسلطان العظيم الذي لا يخالف ولا يمانع. وقال القرطبي في تفسير الآية التي في سورة آل عمران\n\nقوله أسلم أي استسلم وانقاد وخضع وذل وكل مخلوق فهو منقاد مستسلم لأنه مجبول على ما لا يقدر أن يخرج عنه، وقال في تفسير الآية التي في الإسراء\n\nفالصحيح أن الكل يسبح للأخبار الدالة على ذلك ولو كان ذلك التسبيح تسبيح دلالة فأي تخصيص لداود فإنما ذلك تسبيح المقال بخلق الحياة والإنطاق بالتسبيح كما ذكرنا وقد نصت السنة على ما دل عليه ظاهر القرآن من تسبيح كل شيء، فالقول به أولى. وقال النووي في شرح مسلم ج 3 ص164 في تفسير قوله تعالى وإن من شيء إلا يسبح بحمده الآية، ما لفظه :\n\n“وذهب المحققون من المفسرين وغيرهم إلى أنه (يعني تسبيح الموجودات) على عمومه ثم اختلف هؤلاء هل يسبح حقيقة أم فيه دلالة على الصانع فيكون مسبحا منزها بصورة حاله والمحققون على أنه يسبح حقيقة، وقد أخبر الله تعالى وإن من الحجارة لما يتفجر منه الأنهار وإن منها لما يشقق فيخرج منه الماء وإن منها لما يهبط من خشية الله وإذا كان العقل لا يحيل جعل التمييز فيها وجاء النص به وجب المصير إليه\n\nثالثها: أن محصل كلام الشيخ التجاني في هذه المسألة يتلخص في محورين\n\nأولهما أن عبدة الأصنام وإن عبدوها في الظاهر فهم يعبدون الله كرها من حيث لا يشعرون والحجة على هذا صريحة في الآيات المتقدمة الذكر وفيما فسرها به الإمام القرطبي والحافظ بن كثير.\n\nثانيهما أن الله لولا أنه تجلى لهم في الأصنام بحكم القهر لما عبدوها. ويجاب عنه بأن التجلي لفظ أطلقه الله على نفسه في محكم كتابه في قوله تعالى فلما تجلى ربه للجبل جعله دكا الآية، ومعنى تجلى ظهر وبان، قاله ابن منظور في لسان العرب تحت مادة جلا عن الزجاج وغيره، قال: وهذا قول أهل السنة والجماعة. وقال القرطبي في تفسير هذه الآية ج 7 ص200 وتجلى معناه ظهر، قال: وتجلى الشيء انكشف، وقيل تجلى: أمره وقدرته، قاله قطرب وغيره\n\nقلت: ويجاب عنه أيضا بأنهم في عبادتهم للأوثان غير خارجين عن حكم إرادة الله تعالى لأن الله هو الذي زينها لهم عدلا منه بدليل آية وكذلك زينا لكل أمة عملهم وبدليل آية إنا هديناه السبيل إما شاكرا وإما كفورا وبدليل والله خلقكم وما تعملون، وهذا العموم الوارد في هذه الآيات لا يقبل التخصيص كما هو القاعدة عند علما ء الأصول في الإلهيات، وأما قوله على سبيل الحكاية عن الله : “بل أنا الإله المعبود فيهم” الذي علق به على آية إنني أنا الله لا إله إلا أنا فاعبدني فيجاب عنه بأن قوله “بل أنا الإله المعبود فيهم” هو على تقدير محذوف، ومعناه عنده : أي المعبود في عبادتهم للأصنام من طريق القهر والإكراه بدليل ما تقدم من قوله في جواهر المعاني ج1 ص159، وهذه العبادة هي المعبر عنها بالسجود كرها وبدليل قوله فيه أيضا ج1 ص221 “واعلم أن حضرة الحق تعالى متحدة من حيث الذات والصفات والوجود كله متوجه إليه بالخضوع والتذلل والعبادة والخمود تحت سلطان القهر وامتثال الأمر والمحبة والتعظيم والإجلال، فمنهم المتوجه إلى صورة الحضرة الإلهية نصا جليا في محو الغير والغيرية ومنهم المتوجه إلى الحضرة العلية من وراء ستر كثيف وهم عبدة الأصنام ومن ضاهاهم، فإنهم في توجههم إلى عبادة الأوثان ما توجهوا لغير الحق سبحانه وتعالى ولا عبدوا غيره لكن الحق سبحانه وتعالى تجلى لهم من وراء تلك الستور بعظمته وجلاله وجذبهم بحسب ذلك بحكم القضاء والقدر الذي لا منازع له فيه وهذا هو التوجه إلى الله كرها"}, {"q": "قرأت في أحد المواقع الإسلامية أن الشيخ التجاني تهجم على كل ولي لله إذ يقول: قدماي على رقبة كل ولي\nهل هذا صحيح ؟ و ما ردكم", "a": "أخي الكريم\n\nبعد التحية و السلام\n\nنود لفت انتباهك أولا أن مثل هذه المواقع قد اختلط فيها الحابل بالنابل حتى إننا نرى مواقعا لا تختص الا بالجدال و المراء و الخوض في أعراض المسلمين يسوسها أناس لا صلة لم بالعلم فوجب الحذر منها\n\nو فيما يخص السؤال الذي طرحته\n\nجاء في الإفادة الأحمدية لمريد السعادة الأبدية لسيدي محمد الطيب السفياني رضي الله عنه أن الشيخ سيدي ومولاي أبا العباس أحمد التجاني رضي الله عنه قال{ قدماي هاتان على رقبة كل ولي لله تعالى من أول نشأة العالم إلى النفخ في الصور}.\n\nوفي تعليق الشيخ سيدي محمد الحافظ المصري رضي الله عنه على الإفادة قال :\n\nالمراد بالقدم الطريق أو المنزلة وإليهما الإشارة ، ومراده بالقدمين الظاهر والباطن قال تعالى:( وبشر الذين ءامنوا أن لهم قدم صدق عند ربهم ) والغرض من ذلك أن بدايته فوق نهاية العارفين ما عداأصحاب رسول الله صلى الله عليه وسلم فقد سئل في ذلك فأجاب : أن الصحابة لا يلحق بهم غيرهم .\n\nوهذه المرتبة التي ذكرها لا شك أنها ثابتة لشخص ما ، فإن الناس متفاوتون في مراتب المعرفة ، ورفع الله بعضهم فوق بعض درجات . فلو قارنا بين نور أهل بلد مثلا ، أو قطر أو عصر فلا بد من وجود مرتبة هي أعلى المراتب ، ولو قارنا بين أصحاب هذه المرتبة في كل عصر فلا بد من وجود من هو أعلى من غيره ، فمن اختصه الله أزلا بهذه المرتبة يسميه العارفون : القطب المكتوم ، والختم الأكبر . وقد ادعاها سيدي محي الدين ورجع عنها ، كما ادعاها غيره ، وادعيت لغيرهم. وعلامات هذه المرتبة التي قد . ذكرها الأولياء ، قد اجتمعت فيه رضي الله عنه فقد ذكر الشيخ محي الدين بن العربي في الفتوحات ، في الباب الثالث والسبعين عن خاتم الولاية . أنه موجود ببلاد المغرب وأنه اجتمع به في فاس وذلك اجتماع برزخي لانه ذكر في موطن اخر أنه يأتي من بعده في آخر الزمن ، فوجود الختم يومها وجود روحاني ، واجتماعه به اجتماع برزخي – وذكر عنه أنه من أكرم المغرب أصلا ويدا ، وذكر أنه مبتلى بإنكار الخلق عليه . وألف في هذا المقام كتابه : {عنقاء مغرب في ختم الأولياء وشمس المغرب }وعين مستقره بفاس.وصرح بكنيته أبي العباس وهذه الكنية اشتهرت فيمن اسمه أحمد . وذكر سيدي المختار الكنتي في كتاب الطرائف والتلائد :أنه في القرن الثاني عشر . ولم تجتمع هذه العلامات في أحد من الأولياء الذين نسبوا إلى هذا المقام ، إلا في سيدي أحمد التجاني رضي الله عنه فهو من الغرب وهو شريف حسني وكرمه كان مضرب الأمثال وهو في القرن الثاني عشر وفي فاس بها وصل المقام وظهر به وبها دفن واسمه أحمد وكنيته أبو العباس وإنكار الخلق عليه من أظهر العلامات التي تزيدنا معرفة به ويقينا . وقد أخبر رضي الله عنه وهو صادق أن رسول الله صلى الله عليه وسلم أخبره خبرا صريحا في اليقظة ــ ولا عبرة بكلام من أنكرها لأنه محجوج ودلائله منقوضة ـــ أخبره أنه صاحب هذا المقام ولا داعي لتكذيب الولي في أمر ممكن وقد صدقناه كجميع الأولياء .\n\nوعلى أي حال لاخلاف بين أهل الله ، أن هذه مرتبة اختص الله بها بعض أوليائه ، فإن لم يكن الشيخ فغيره و لا حرج على من صدق دعوى صادق صالح في أمر يمكن أن يتفضل الله به سبحانه عليه . ومن لم ير بذلك ثابتا له فليحمل كلامه على وجه صالح ، ولو على أنه مما يقع من الشطح للشيوخ الكمل ، ولا ينافي كمالهم . لأنه نتيجة غرق في النور ، وقد نقل عن سيدي أبي اليزيد وسيدي محي الدين وغيرهما من أكمل الكمل ، والغرق في النور لم يخل منه أحد ، وقد صح عنه صلى الله عليه وسلم : إنه ليغان على قلبي فاستغفر الله في اليوم مائة مرة« وهو غين أنوار وأسرار جل أن يكون غين أكدار وأغيار ، غير أن مرتبة النبوة لا يقع فيها الشطح ، ولا بد من مرور الولي بمقام السكر والغيبة والغرق. فإذا كان رضي الله عنه صاحب هذا المقام فكلامه على ظاهره وإلا فهو فان في صاحب المرتبة يتكلم بلسانه . ولا حرج ، علينا شرعا إذا صدقنا أنه صاحبها فما جرب عليه رضي الله عنه إلا الصدق والعلم والعمل وكمال المتابعة .وقد شهد له بعلو القدم في المعرفة أكابر العارفين . ولم يعاده ولي فيما نعلم . وإنما أنكر عليه شرذمة من أطفال القلوب صغار الأحلام لا عبرة بهم ولا يؤبه لهم لأن الدليل يخذلهم في كل موطن من مواطن التحقيق وهم محجوبون بالدلائل العلمية الصحيحة .إهـ"}, {"q": "أمابعد أسألكم أن توضحوا لي التناقض الذي يتردد على ألسن المنكرين حيث قال في الإفادة الأحمدية: نهاني رسول الله صلّى الله عليه و سلّم عن التوجه بالأسماء الحسنى ، وأمرني بالتوجه بصلاة الفاتح إذ كيف ينهى رسول الله صلّى الله عليه وسلّم عن شيء أمره الله تعالى به في قوله: و َلِلَّهِ الأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا", "a": "و عليكم السلام و رحمة الله تعالى و بركاته أخي الكريم\nهؤلاء المنكرون لا يعرفون الفرق بين التوجه و الدعاء أخي الحبيب و التوجه بالأسماء ليس معناه النهي عن الدعاء بأسماء الله الحسنى\nو قد نهى رسول الله صلى الله عليه و سلم سيدنا رضي الله عنه عن التوجه بها و أمره أن يتوجه بصلاة الفاتح بدلا عنها أما الدعاء فيمكن دائما الدعاء بالأسماء الحسنى وفقا للأمر\nوانظر في كتب الطريقة التجانية كم من أذكار وأدعية كان يدعو بها الشيخ التجاني رضي الله عنه فيها دعاء لله تعالى بأسمائه الحسنى و على سبيل الذكر لا الحصر دعاء السيفي و حزب البحر و الأسماء الإدريسية و الدور الأعلى و الدعاء الوارد في قوت القلوب و دعاء يا من أظهر الجميل و دعاء تباركت ألهي\nوانظر تفصيل جميع هذه الأدعية في كتب الطريقة التجانية فهي مملوءة من دعاء الله تعالى بأسمائه الحسنى\nدعاء يا من أظهر الجميل :\nيا من أظهر الجميل و ستر القبيح و لم يؤاخذ بالجريرة و لم يهتك الستر يا عظيم العفو ويا حسن التجاوز و يا واسع المغفرة يا باسط اليدين بالرحمة و يا سامع كل نجوى و يا منتهى كل شكوى و يا كريم الصفح و يا عظيم المن و يا مبدئا بالنعم قبل استحقاقها يا رب و يا سيدي و يا مولاي و يا غاية رغبتي أسألك أن لا تشوه خلقتي ببلاء الدنيا و لا بعذاب النار\nدعاء آخر :\nالهنا أنت المحرك والمسكن لكل ما وقع في الوجود من الخيرات والشرور في حكمك الحل والعقد لجميع الأمور وبيدك وعن مشيئتك تصاريف الأقدار والقضاء المقدور وأنت أعلم بعجزنا وضعفنا وذهاب حولنا وقوتنا عن تباعدنا مما يحل بنا من الشرور عن اتصالنا بما نريد الوقوع فيه من الخيرات أو ما يلائم أغراضنا في جميع الأمور وقد وقفنا ببابك والتجأنا بجنابك وقفنا على أعتابك مستغيثين بك في صرف ما يحل بنا من الشرور وما ينزل بنا من الهلاك مما يجري به تعاقبت الدهور مما لا قدرة لنا على تحمله ولا قوة بنا على طله فضلاً عن وبله وأنت العفو الكريم والمجيد الرحيم الذي ما استغاث بك مستغيث إلا أغثته ولا توجه إليك مكروبا يشكو كربه الا فرجته ولا ناداك ضرير من أليم بلائه الا عافيته ورحمته وهذا مقام المستغيث بك والملتجئ إليك فأرحم ذلي وتضرعي بين يديك وكن لي عونا وناصراً ودافعاً لكل ما يحل بي من المصائب والأحزان ولا تجعل عظائم ذنوبي حاجبه لما ينزل إلينا من فضلك ولا مانعة لما تتحفنا به من طولك وعاملنا في جميع ذبوبنا بعفوك وغفرانك وفي جميع زلاتنا وعثراتنا برحمتك وإحسانك فإن لفضلك راجون وعلى كرمك معولون ولنوالك سائلون ولكمال عزك وجلالك متضرعون فلا تجعل حظنا منك الخيبة والحرمان ولا تنيلنا من فضلك الطرد والخذلان فإنك أكرم من وقف ببابه السائلون وأوسع مجداً من كل من طمع فيه الطامعون فأنه لك المنّ الأعظم والجناب الأكرم وأنت أعظم كرماً وأعلى مجداً من أن يستغيث بك مستغيث فترده خائباً أو يستعطف أحد نوالك متضرعاً إليك فيكون حظه منك الحرمان لا إله إلا أنت يا علي يا عظيم يا مجيد يا كريم يا واسع الجود يا بر يا رحيم"}, {"q": "لي سؤال حول معتقدات الطريقة ، ماذا تقولون عن مبدأ توحد الذات الإلهية مع الوجود", "a": "بسم الله و الحمد لله و الصلاة و السلام على رسول الله\nالأخ الكريم السلام عليكم و رحمة الله تعالى و بركاته\n\nحول هذا الموضوع يقول العارف بالله سيدي محمد الحافظ المصري رضي الله عنه في ” سبيل السلام “\n\nإذا أخذت قطعة من العجين ثم صورتها بصورة شجرة، ثم هدمت تلك الصورة وصورتها بصورة إنسان ثم هدمت صورة الإنسان وجعلتها رغيفا فذلك الجرم المحسوس الذي تعاقبت عليه الصور هو واحد في الجميع. وارجع بصورة العجين إلى أنه كان قبل ذلك قمحاً، وقبل القمح تراباً. فتلك الحقيقة المحسوسة المرئية الملموسة، هي المادة المتطورة التي تلبس شتى الصور وتخلعها لتظهر بغيرها ، وكنه هذه المادة لا يزال مجهولا .\nوقد جعل الهندوس أساس الوجود روحاً نورانية كونت العوالم في ذاتها من ذاتها على النسق السابق ، فهي أجزاء منها وتلك الحقيقة هي المادة لتلك العوالم بأجمعها فكل شيء جزء من ذلك النور ومنه الإنسان منه انبثق وإذا بلغ ذروة الرقي عاد إلى ذلك النور فاتحد به وتلاشى فيه ولذلك يقدسون النار مظهر النور ومثل ذلك مثل النبات يخرج من الأرض ثم ينمو حتى يبلغ أشده ثم يصير هشيماً ثم يعود تراباً فيمتزج بأصله الأرض . وهذه هي وحدة الوجود الهندوسية ،وهذا هو الفناء الهندوسي الذي يسمونه ” نيرفانا”\nوهذه العقيدة الهندوسية لم يختلف المسلمون في بطلانها ، سواء في ذلك السلف والخلف ، من فقهاء ومحدثين وصوفية ومتكلمين وقراء ومفسرين\nوالإجماع منعقد على أن ذات البارئ عز وجل يستحيل أن تكون محلاً للحوادث ولا الحوادث محلاً لها ، وقد اتفق السلف والخلف أن كل ما أوهم ذلك في المأثور يستحيل حمله على المعهود في الخلق وإنما يراد به معنى الهي يليق بمن ليس كمثله شيء\nولا شك في ان ما يجوز فيه التجزئة ويخضع للاتحاد والامتزاج والانفصال وغير ذلك من صفات الحوادث – وان سير به في المهيع الروحاني – فقد سرى عليه قانون الحوادث حيث خالطها وخالطته ومازجها ومازجته ووقع الحد في كله أو في بعضه وما جاز عليه وصف من صفات الحوادث جاز عليه باقيها فانتفى عنه الوجوب وانتفى عنه القدم . والأحد القديم منزه عن ذلك كله فلا تجسد ولا حلول ولا اتحاد ولا مخالطة ولا سريان ولا ممازجة تعالى الحق عما يقول الظالمون علوا كبيرا\nوالفرق شاسع بين عقيدة الهندوس وبين الاحدية الإلهية التي جاء بها الأنبياء والمرسلون فان الله عز وجل خالق كل شيء بغير اقتطاع وإذا صح في الخلق انك إذا نظرت في المرآة انطبعت صورتك فيها من غير أن ينقص منك شيء أو يقتطع ، فالحق أقدس – وله المثل الأعلى – وهو منزه عن الانفصال والاقتطاع وعن كل ما يجري على الحوادث ، وبه قام كل شيء من غير مماسة أو مخالطة\n\nوالفرق شاسع بين من يعتقد أن الحق مادة الأشياء وبين من يعتقد أن الحق قيومها وهو على نزاهته سبحانه وعلوه عن صفات الحوادث والتغيير والتبديل فهو هو قبل إنشاء المخلوقات وبعد إنشائها وهو الفاعل المختار ما شاء كان وما لم يشأ لم يكن\n\nفوحدة الوجود التي يقصدها الصوفية في نثرهم وفي شعرهم حقيقتها ان المنفرد بالوجود الحق الغني عما سواه الذي يفتقر إليه كل ما عداه هو الله وحده تبارك وتعالى\n\nفإذا قال احدهم ” لا موجود إلا الله ” فإنما يعني أن وجوده تبارك وتعالى هو الوجود الحق الذاتي ، لم يكتسبه من غيره ، أما ما سواه فهو تابع لوجود الحق ، وليس له وجود من ذاته حيث لم يوجد نفسه إنما أوجده الله . ولا وجوده بنفسه فانه لا يقوم بذاته وإنما هو قائم بالله ولا وجوده لنفسه فانه لا يستطيع التصرف في ذاته وإنما هو لله يصرفه كيف يشاء فليس من ذاته ولا بذاته ولا لذاته فليس بالوجود الحقيقي . ولولا إيجاد الحق له لما كان له وجود . فهو من الله بالله لله .\nوعلى هذا قد وضح أنهم يريدون بالوجود الحق الذات العلية ، وما سوى الذات لا بد له من اسم يليق به ، فالحق موجد – فاعل – والمخلوق موجد – مفعول – . والاشتراك في لفظ الوجود عند الناس اشتراك لفظي ليس باشتراك حقيقي . وحقيقة الحق أحدية ، فوجوده حقيقي وما سواه ليس بوجود حقيقي ، ولا شيئيته شيئية ذاتية\n\nوقد تنزه البارئ تبارك وتعالى أن يشارك في صفة أو اسم. فالسمع الذاتي المنزه عن القيود والحدود والأعضاء والجوارح والآلات، غير سمع المخلوقات المحدود بالقيود والآلات، فالاشتراك باللفظ أمر غير الاشتراك في الحقيقة . ولا شبه بين سمع المخلوق وبين السمع الحقيقي بأي وجه من الوجوه حيث الماهية غير الماهية\nوهل يعقل اشتراك حقيقي بين العلم الذاتي المطلق الذي تنشأ عنه الموجودات – وهو سابق عليها – وبين العلم الحادث عن وجود الحوادث ؟\nعلى انك إذا حققت النظر وجدت انك ما سمعت إلا بفضل الله وما سمعت بإذنك . وما علمت إلا بالله لا بنفسك . فأنت بالله لا بك\nوعين الماء ، وان اشتركت في اللفظ مع عين الإنسان ، فهي غيرها ، وكلاهما ممكن . والحق يعلو عن التصورات والأمثال\nومن عبر عن نور القمر في البحر بأنه نور الشمس فليس بكاذب ، فقد نشأ عنها بغير اقتطاع منها . وهذا مثل تقريبي لكلام السادة الصوفية الذي يرجع معناه إلى أن سائر الممكنات قائمة بالحق لا بذاتها\n{الله لا إله إلا هو الحي القيوم } لا يحتاج لشيء ويمد العوالم كلها بحاجاتها . يمسك السماء أن تقع على الأرض ويمسك الطير. وهو قيوم كل شيء\nومن لم يفرق بين وحدة كافر – يجعل صاحبها الحق سبحانه مادة الوجود وذلك باطل – وبين وحدة ينفى فيها المؤمن ذلك الكفر ، وينادي بان الحق سبحانه هو قيوم الوجود بلا كيف ولا مثل ، فقد برهن على جهله العريق\nفكل ما ذكر من كلام القوم رضي الله عنهم مما يفهم منه انه لا موجود إلا الله ، فهو على هذا المهيع النوراني ، ان لا موجود وجوداً ذاتياً الا الله ، وهو الحق الذي عليه جميع المسلمين خاصتهم وعامتهم . رضوان الله على الجميع"}, {"q": "هل يمكن للأموات أن يسمعونا ؟ و هل يمكنهم معرفة أحوالنا ؟", "a": "اعلم أن البعض توهم أن الأموات لا يسمعون ظنا منه أن قول الله تعالى في سورة فاطر الآية 22 : {وما أنت بمسمع من في القبور} دليل على ذلك وليس كذلك بل هذه الآية دليل على أن من الكفار من لن ينتفعوا بالتذكير والموعظة كما أن الأموات الذين صاروا إلى قبورهم لن ينتفعوا بما يسمعونه من التذكير والموعظة بعد أن خرجوا من الدنيا ، فشبه الله تعالى هؤلاء الكفار القائمين على كفرهم بالأموات من هذا الوجه، ونص على ذلك أهل التفسير:\n\nقال أبو حيان الأندلسي في تفسيره البحر المحيط ما نصه : {وما أنت بمسمع منفي القبور} أي هؤلاء من عدم إصغائهم إلى سمع الحق بمنزلة من هم قد ماتوا فأقاموا في قبورهم فكما أن من مات لا يمكن أن يقبل منك قول الحق فكذلك هؤلاء لأنهم أموات القلوب.وفي تفسير ابن كثير قوله تعالى إن الله يُسمع من يشاء أي يهديهم إلى سماع الحجة وقبولها والانقياد لها وما أنت بمسمع من في القبور أي كما لا ينتفع الأموات بعد موتهم وصيرورتهم إلى قبورهم وهم كفار بالهداية والدعوة إليها كذلك هؤلاء المشركون الذين كتب عليهم الشقاوة لاحيلة لك فيهم ولا تستطيع هدايتهم.)انتهى وجاء في مختصر تفسير ابن كثير رحمه الله للشيخ الصابوني في تفسير آية (وما أنت بمسمع من في القبور) : أي كما لا ينتفع الأموات بعد موتهم وصيرورتهم إلى قبورهم وهم كفار بالهداية والدعوة إليها كذلك هؤلاء المشركون الذين كتب عليهم الشقاوة لا حيلة لك فيهم، ولا تستطيع هدايتهم (إن أنت إلا نذير).انتهى وقال الإمام القرطبي : وما أنت بمسمع من في القبور” أي الكفار الذين أمات الكفر قلوبهم؛ أي كما لا تسمع من مات، كذلك لاتسمع من مات قلبه.إهـ وذكر الحافظ ابن حجر العسقلاني في فتح الباري:{ انك لا تسمع الموتى } فقالوا معناها لا تسمعهم سماعا ينفعهم .\n\nوروى الإمام مسلم في صحيحه عن أنس ابن مالك أن رسول الله صلى الله عليه وسلم ترك قتلى بدر ثلاثا ثم أتاهم فقام عليهم فناداهم فقال يا أبا جهل بن هشام يا أمية بن خلف يا عتبة بن ربيعة يا شيبة بن ربيعة أليس قد وجدتم ما وعدكم ربكم حقا فإني قد وجدت ما وعدني ربي حقا فسمع عمر قول النبي صلى الله عليه وسلم فقال يا رسول الله كيف يسمعوا وأنى يجيبوا وقد جيفوا قال والذي نفسي بيده ما أنتم بأسمع لما أقول منهم ولكنهم لا يقدرون أن يجيبوا ثم أمر بهم فسحبوا فألقوا في قليب بدر. وفي رواية للبخاري قال عمر يارسول الله ما تكلم من أجساد لا أرواح لها فقال رسول الله صلى الله عليه وسلم والذي نفس محمد بيده ما أنتم بأسمع لما أقول منهم.وروي أيضا عن ابن عمر رضي الله عنهما.\n\nوقال ابن كثير في تفسيره بعد إيراد لما قيل في قوله تعالى{ إنك لا تسمع الموتى}والصحيح عند العلماء رواية عبد الله ابن عمر لما لها من الشواهد على صحتها من وجوه كثيرة من أشهر ذلك ما رواه ابن عبد البر مصححا له عن ابن عباس مرفوعا : ما من أحد يمر بقبر أخيه المسلم كان يعرفه في الدنيا فيسلم عليه إلا رد الله عليه روحه حتى يرد عليه السلام. وروى مثله ابن عساكر وابن النجار عن أبي هريرة بسند جيد كما قال المتقي الهندي في كنز العمال.\n\nوروى البخاري ومسلم عن أنس بن مالك رضي الله عنه قال قال النبي صلى الله عليه وسلم: {العبد إذا وضع في قبره وتُوُلى وذهب عنه أصحابه حتى إنه ليسمع قرع نعالهم. }قال العيني في شرحه لصحيح البخاري: قوله قرع نعالهم أي نعال الناس الذين حول قبره من الذين باشروا دفنه وقرع النعال صوتها عند المشي.إهـ\n\nوروى الإمام مالك في الموطأ ومسلم في صحيحه عن أبي هريرة رضي الله عنه قال أن رسول الله صلى الله عليه وسلم خرج إلى المقبرة فقال : السلام عليكم دار قوم مؤمنين وإنا إن شاء الله بكم لاحقون . قلت وهذا خطاب منه صلى الله عليه وسلم لمن يسمع . قال القرطبي في تفسيره الجامع لأحكام القرآن : فلو لم يسمع الميت لم يسلم عليه وهذا واضح. وقال ابن القيم في كتابه الروح : والسلف مجمعون على أن الميت يعرف زيارة الحي له ويستبشر به.\n\nوروى الإمام مسلم في صحيحه من حديث قال فيه عمرو ابن العاص فإذا أنا مت فلا تصحبني نائحة ولا نار فإذا دفنتموني فسنوا علي التراب سنا ثم أقيموا حول قبري قدر ما تنحر جزور ويقسم لحمها حتى أستأنس بكم وأنظر ما أراجع به رسل ربي .قال الإمام النووي في شرحه على مسلم: فيه فوائد منها استحباب المكث عند القبر بعد الدفن لحظة نحو ما ذكر لما ذكر وفيه أن الميت يسمع حينئذ من حول القبر.إهـ و قال ابن القيم إثر هذا الأثر فدل على أن الميت يستأنس بالحاضرين عند قبره ويسر بهم.إهـ\n\nوقال الملا علي قاري في مرقاة المفاتيح شرح مشكاة المصابيح : عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم أتى المقبرة والظاهر أنها مقبرة البقيع فقال السلام عليكم إشارة إلى أنهم يعرفون الزائر ويدركون كلامه وسلامه.إهـ\n\nوعقد صاحب كتاب الروح فصلا في سماع الأموات ومما قال فيه : ويدل على سماع الموتى ما جرى عليه عمل الناس قديما وإلى الآن من تلقين الميت في قبره ولو لا أنه يسمع ذلك وينتفع به لم يكن فيه فائدة وكان عبثا وقد سئل الإمام أحمد فاستحسنه واحتج عليه بالعمل ويروى فيه حديث ضعيف ذكره الطبراني من حديث أبي أمامة ثم قال أيضا فيه : هذا الحديث وإن لم يثبت فاتصال العمل به في سائر الأمصار والأعصار من غير إنكار كاف في العمل به وما أجرى الله سبحانه العادة قط بأن أمة طبقت مشارق الأرض ومغاربها وهي أكمل الأمم عقولا وأوفرها معارف تطبق على مخاطبة من لا يسمع ولا يعقل وتستحسن ذلك ولا ينكره منها منكر بل سنه الأول للآخر ويقتدي فيه الآخر بالأول إهــ\n\nوحديث أبي أمامة رضي الله عنه هو قوله: إذا أنا مت فاصنعوا بي كما أمرنا رسول الله صلى الله عليه وسلم أن نصنع بموتانا، أمرنا رسول الله صلى الله عليه وسلم فقال: إذا مات أحد من إخوانكم فسويتم التراب على قبره فليقم أحدكم على رأس قبره ثم ليقل: يافلان ابن فلانة فإنه يسمعه ولا يجيب، ثم يقول: يا فلان ابن فلانة فإنه يستوي قاعداً، ثم يقول: يا فلان ابن فلانة فإنه يقول أرشدنا يرحمك الله ولكن لا تشعرون، فليقل: اذكر ما خرجت عليه من الدنيا شهادة أن لا إله إلا الله وأن محمداً عبده ورسوله وأنك رضيت بالله رباً وبالإسلام ديناً وبمحمد نبياً وبالقرءان إماماً فإن منكراً ونكيراً يأخذ كل واحد منهما بيد صاحبه ويقول: انطلق بنا ما يقعدنا عند من لُقّن حجته، قال: فقال رجل: يا رسول الله فإن لم يُعرف أمه، قال: ينسبه إلى أمه حواء، يا فلان بن حواء . و يقول ا لإمام ابن الملقن كما في خلاصة البدر المنير:رواه الطبراني في أكبر معاجمه هكذا، وليس في إسناده إلا سعيد بن عبد الله فلا أعرفه، وله شواهد كثيرة يعتضد بها ذكرتها في الأصل”.إهـ وقال الإمام النووي في روضةِ الطالبين وعمدة المفتين: والحديث وَإِنْ كَانَ ضَعِيفًا لَكِنَّهُ اعْتَضَدَ بِشَوَاهِدَ مِنْ الْأَحَادِيثِ الصَّحِيحَةِ وَلَمْ تَزَلْ النَّاسُ عَلَى الْعَمَلِ بِهِ مِنْ الْعَصْرِ الْأَوَّلِ إهـ ويقول الحافظ ابن حجر العسقلاني في كتابه التلخيص الكبير : وإسناده صالح وقد قواه الضياء في أحكامه إهـ وقوله صالح معناه صالح للإحتجاج به والعمل .\n\nوفي الفتاوى الكبرى الفقهية للإمام ابن حجر الهيثمي :”وسئل” هل يعلم الأموات بزيارة الأحياء وبما هم فيه؟ “فأجاب” بقوله نعم يعلمون بذلك من غير تقييد بزمان خلافا لمن قيد كما أفاده حديث ابن أبي الدنيا: “ما من رجل يزور قبر أخيه ويجلس عليه إلا استأنس ورد حتى يقوم” وصح حديث: “ما من أحد يمر بقبر أخيه المؤمن كان يعرفه في الدنيا فيسلم عليه إلا عرفه ورد عليه السلام”و”سئل” هل يعلم الأموات بأحوال الأحياء وبما هم فيه؟ “فأجاب” بقوله نعم لحديث مسند أحمد: “إن أعمالكم تعرض على أقاربكم وعشائركم من الأموات فإن كان خيرا استبشروا وإن كان غير ذلك قالوا اللهم لا تمتهم حتى تهديهم كما هديتنا” وبه يعلم أنها إنما تعرض على صالحي الأقارب وفي رواية لأبي داود الطيالسي: “وإن كان غير ذلك قالوا اللهم ألهمهم أن يعملوا بطاعتك” وفي حديث ضعيف: “إن نفس المؤمن إذا قبضت تلقاها أهل الرحمة من عباد الله كما يلقون البشير من أهل الدنيا فيقولون انظروا صاحبكم ليستريح فإنه في كرب شديد ثم يسألونه ما فعل فلان وفلانة هل تزوجت” الحديث وفيه: “إن أعمالكم تعرض على أقاربكم وعشائركم من أهل الآخرة فإن كان خيرا فرحوا واستبشروا وقالوا اللهم هذا فضلك ورحمتك فأتمم نعمتك عليه وأمته عليها ويعرض عليهم عمل المسيء فيقولون اللهم ألهمه عملا صالحا ترضى به ويقربه إليك” وروى الترمذي الحكيم حديث: “تعرض الأعمال يوم الاثنين والخميس على الله وتعرض على الأنبياء وعلى الآباء والأمهات الجمعة فيفرحون بحسناتهم وتزداد وجوههم بياضا وإشراقا فاتقوا الله ولا تؤذوا أمواتكم” وفي حديث ابن أبي الدنيا: “لا تفضحوا موتاكم بسيئات أعمالكم فإنها تعرض على أوليائكم من أهل القبور”.إهـ\n\nوأكثر من ذلك أن الميت قد يُسمع الحي أخرج أبو يعلى الموصلي في مسنده عن أبي هريرة رضي الله عنه قال: سمعت رسول الله صلي الله عليه وسلم يقول {والذي نفس أبي القاسم بيده لينـزلن عيسى بن مريم إماما مقسطا وحكما عدلا فليكسرن الصليب وليقتلن الخنـزير وليصلحن ذات البين وليذهبن الشحناء وليعرضن عليه المال فلا يقبله، ثم لئن قام على قبري فقال: يا محمد لأجبته}.ورواه الحافظ ابن حجر في المطالب العالية بعنوان : حياته صلى الله عليه وسلم في قبره .وذكره الحافظ الهيثمي في مجمع الزوائد وقال رواه أبو يعلى ورجاله رجال الصحيح.وفي قوله لأجبته دلالة ظاهرة علي سماعه إياه ورده صلى الله عليه وسلم عليه وأخرجه الحاكم في المستدرك وفيه « وليأتين قبري حتى يسلم علي ولأردن عليه وقال هذا حديث صحيح الاسناد ووافقه الذهبي في التلخيص.\n\nوروى الترمذي في سننه وقال حديث حسن غريب والبيهقي في شعب الإيمان والطبراني في الكبير عن ابن عباس رضي الله عنهما قال : ضرب بعض أصحاب النبي صلى الله عليه وسلم خباءه على قبر وهو لا يحسب أنه قبر فإذا فيه إنسان يقرأ سورة تبارك الذي بيده الملك حتى ختمها فأتى النبي صلى الله عليه وسلم فقال يارسول الله إني ضربت خبائي على قبر وأنا لا أحسب أنه قبر فإذا فيه إنسان يقرأ سورة تبارك حتى ختمها فقال رسول الله صلى الله عليه وسلم هي المانعة هي المنجية تنجيه من عذاب القبر.\n\nوروى الحافظ الدارمي في سننه عن سعيد ابن عبد العزيز قال : لما كان أيام الحرة لم يؤذن في مسجد النبي صلى الله عليه وسلم ثلاثا ولم يقم ولم يبرح سعيد بن المسيب من المسجد وكان لايعرف وقت الصلاة إلا بهمهمة يسمعها من قبر النبي صلى الله عليه وسلم .\n\nوروى ابن عبد البر في الاستذكار و التمهيد من حديث ابن عباس قال : قال رسول الله ما من أحد يمر بقبر أخيه المؤمن كان يعرفه في الدنيا فيسلِّم عليه إلا عرفه ورد عليه السلام\n\nوالحديث صححه الحافظ أبو محمد بن عبد الحق وهو إمام في العلل ومعرفة الحديث كما في تذكرة الحفاظ للذهبي كما أشار إلى صحة الحديث صاحب عون المعبود. ولا يستبعد سماع رد السلام من الأموات ، ففي المستدرك للحاكم عن عبد الأعلى بن عبد الله بن أبي فروة عن أبيه : أن النبي صلى الله عليه وسلم زار قبور الشهداء بأحد فقال اللهم إن عبدك ونبيك يشهد أن هؤلاء وأنه من زارهم وسلم عليهم إلى يوم القيامة ردوا عليه ، قال العطاف (وثقه ابن معين كما في الكاشف للذهبي) وحدثتني خالتي أنها زارت قبور الشهداء بأحد قالت وليس معي إلا غلامان يحفظان علي الدابة قالت فسلمت عليهم فسمعت رد السلام قالوا : والله إنا نعرفكم كما يعرف بعضنا بعضا قالت فاقشعررت فقلت يا غلام ادن بغلتي فركبت قال الحاكم إثره هذا إسناد مدني صحيح ولم يخرجاه (يعني البخاري ومسلم) وقال الذهبي في التلخيص مرسل . والحديث المرسل حجة عند الأئمة مالك وأبو حنيفة وأحمد.\n\nوروى الحاكم أيضا في المستدرك والطبراني في الكبير وابن ابي عاصم في الاحاد والمثاني وابن بشكوال في غوامض الاسماء المبهمة والاصبهاني في دلائل النبوة من حديث طويل عن ابنة ثابت بن قيس بن شماس أن أباها كان يوم اليمامة مع خالد بن الوليد واستشهد فرآه رجل من المسلمين في منامه فقال : إني لما قتلت انتزع درعي رجل من المسلمين وخبأه في أقصى المعسكر وهو عنده وقد أكب على الدرع برمة فائت خالد بن الوليد فليبعث إلى درعي فليأخذها فإذا قدمت على خليفة رسول الله صلى الله عليه وسلم فأعلمه أن علي من الدين كذا ولي من المال كذا وفلان من رقيقي عتيق وإياك أن تقول هذا حلم فتضيعه قال : فأتى خالد بن الوليد فوجه إلى الدرع فوجدها كما ذكر وقدم على أبي بكر رضي الله عنه فأخبره فأنفد أبو بكر وصيته بعد موته فلا نعلم أن أحدا اجازت وصيته بعد موته إلا ثابت بن قيس بن شماس رضي الله عنه.\n\nوذكر القرطبي في تفسيره عند قول الله تعالى :{ الله يتوفى الأنفس حين موتها والتي لم تمت في منامها …..الآية ( سورة الزمر الآية : 39 ) . أن ابن عباس وغيره من المفسرين قالوا : إن أرواح الاحياء والاموات تلتقي في المنام فتتعارف ما شاء الله منها .وذكر أيضا عن سعيد ابن جبير إن الله يقبض أرواح الاموات إذا ماتوا وأرواح الاحياء إذا ناموا فتتعارف ما شاء الله أن تتعارف .إهـ وقال السدي كما في تفسير ابن ابي حاتم : يلتقي روح الحي وروح الميت فيتذاكران ويتعارفان.\n\nوأخرج ابن ابي الدنيا في المنامات بسند صحيح وابن القيم في الروح عن سعيد بن المسيب قال : التقى عبد الله ابن سلام وسلمان الفارسي فقال أحدهما للآخر إن مت قبلي فالقني فأخبرني ما لقيت من ربك وإن أنا مت قبلك لقيتك فأخبرتك فقال الآخر وهل تلتقي الأموات والأحياء قال نعم أرواحهم في الجنة تذهب حيث تشاء قال فمات فلان فلقيه في المنام فقال توكل وأبشر فلم أر مثل التوكل قط .\n\nوصح كذلك كما قال صاحب الروح عن الصعب بن جثامة وعوف بن مالك رضي الله عنهما وكانا متآخيين أنهما تعاهدا على أن من مات قبل صاحبه أن يتراء له فمات الصعب فرآه عوف….. والأثر طويل .\n\nوجاء في الإصابة في تمييز الصحابة أن الصحابي الجليل الخيبري بن النعمان رضي الله عنه نزل على حاتم الطائي بعد أن مات وطلب منه القرى فرآه في المنام وأنشده أبياتا والقصة مشهورة ومثله في أسد الغابة وذكر هذه القصة أيضا ابن كثير في البداية والنهاية عن المحرر مولى أبي هريرة وفيها وقالوا : والله لقد أضافنا حاتم حيا وميتا ، وذكرها أيضا عبد القادر بدران في تهذيب تاريخ دمشق.\n\nوفي صحيح مسلم عن أنس بن مالك رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم مررت على موسى وهو يصلي في قبره وفي الحديث الذي رواه البخاري أن النبي صلى الله عليه وسلم قال :…..حتى جئت موسى فقال ما صنعت قلت فرضت علي خمسون صلاة قال أنا أعلم بالناس منك عالجت بني إسرائيل أشد المعالجة وإن أمتك لا تطيق فارجع إلى ربك فسله فرجعت فسألته …..الحديث . وبين سيدنا محمد صلى الله عليه وسلم وسيدنا موسى قرونا عديدة ، والعلماء متفقون على أن كل ما جازأن يكون معجزة لنبي جاز أن يكون كرامة لولي . ففهم. كما روى الامام مسلم في كتاب الايمان من صحيحه عن أنس بن مالك أن رسول الله صلى الله عليه وسلم قال : فإذا أنا بآدم فرحب بي ودعا لي بخير ثم ذكر أن عيسى بن مريم ويحيى وزكريا صلوات ربي وسلامه عليهم دعوا له بخير ثم يوسف وإدريس وهارون وموسى دعا كل منهم له صلى الله عليه وسلم . فقوله فرحب بي فيه ترحيب الأموات بالأحياء. وهذا من باب نفع الأموات للأحياء فكما أن الميت ينتفع بدعاء الحي كذلك الأحياء ينتفعون بدعاء الأموات. روى البزار بسنده عن عبد الله يعني ابن مسعود عن النبي صلى الله عليه وسلم قال حياتي خير لكم تحدثون ويحدث لكم ووفاتي خير لكم تعرض علي أعمالكم فما رأيت من خير حمدت الله عليه وما رأيت من شر استغفرت لكم قال الحافظ العراقي في طرح التثريب إسناده جيد وقال الهيثمي في مجمع الزوائد رواه البزار ورجاله رجال الصحيح وصححه السيوطي في الخصائص الكبرى ."}, {"q": "هل من الممكن توضيح سبب الاختلاف حول عدد مرات جوهرة الكمال في الوظيفة بين 11 و 12 و أيهما الصحيح ؟", "a": "قال العلامة سيدي أحمد سكيرج رضي الله عنه في كتابه :زهر الأفانين بالجواب عن الأسئلة الثلاثين: قد كان عدد جوهرة الكمال في الوظيفة إحدى عشرة مرة عدد حروف الاسم الأعظم، وبالحادية عشر منها كان يختم الشيخ الوظيفة وعند الفاتحة يرفع يديه، ثم عمل أصحابه قيد حياته بحضوره على ختم الوظيفة بزيادة واحدة من الجوهرة على العدد المذكور ويرفعون أيديهم عند الثانية عشر المزيدة، فكان العدد عدد البروج الإثني عشر ولم ينههم الشيخ لا عن الزيادة ولا عن رفع الأيدي، بل كان يرفع يده معهم ويرفعها حالة الدعاء وحالة الفاتحة.إهـ\nقال صاحب منية المريد:\nوبعد ذا جوهـــرة الكمال تقرأ إحدى عشرة في الحال\nوفي حياة شيخنا قد زادوا واحـــدة فــــزيــدها ســــداد\nوقال شارحها سيدنا العربي ابن السائح رضي الله عنه : وقوله {وفي حياة شيخنا } إلخ أشار إلى أن زيادة هذه الواحدة تقرير من الشيخ رضي الله عنه ولذلك قال ك {فزيدها سداد } أي غير خطأ….إلى أن قال رضي الله عنه : والذي عليه العمل في جل البلاد المغربية والمشرقية والأمصار الكبار هي : أستغفر الله العظيم الذي لا إله إلا هو الحي القيوم فقط ثلاثين مرة ثم صلاة الفاتح خمسين مرة ثم الهيللة مائة مرة ثم جوهرة الكمال اثنتي عشرة مرة .إهـ وبقول سيدي العربي ابن السائح رضي الله عنه هذا قال العارف بالله سيدي الحاج الحسين الإفراني في كتابه ترياق القلوب من أدواء الغفلة والذنوب .إهـ"}, {"q": "إن عندي أصدقاء من بلد فيه ملايين التجانيين لكن للأسف وقع في بعضهم نزاع بسبب اختلافهم على حكم شرب الدخان، فما فتواكم فى هذا الأمر ؟", "a": "بسم الله الرحمان الرحيم والصلاة والسلام على سيدنا محمد أشرف المخلوقين وعلى آله وأصحابه أجمعين ،بالنسبة لسؤالك حول شرب الدخان فإن هناك نقطتان يجب أن نوضحها لمن يشرب الدخان\nالنقطة الأولى : أن هناك اتفاقا حاصلا بين علماء الشريعة يكاد يصل الى الإجماع أن التدخين حرام شرعا لما له من المساوئ على الدين و الصحة و المال .\nقال شيخنا أحمد التجاني رضي الله عنه في تحريم التبغ : التبغة حرام و الأصل في حرمتها قوله صلى الله عليه و سلم: { كل مفتر حرام} وهي من المفترات.\nوقال الحافظ المصري رضي الله عنه في تعليقه على الإفادة الأحمدية : التبغة هي الدخان : أخرج الإمام أحمد وأبو داوود عن أم سلمة رضي الله عنها قالت نهى رسول الله صلى الله عليه وسلم عن كل مسكر ومفتر .فقرن صلى الله عليه وسلم بين المسكر والمفتر والعبرة في الإفتار من كان سليم الفكرة فإن من تعود السكر حتى صار لا تسكره الخمر فهي حرام عليه لأن من شأنها الإسكار وإن لم تسكر من أدمن شربها فكذلك الدخان يحدث الفتور لمن كان على فطرته ولم يتعاطاه على ما فيه من إسراف وضرر إلى أن قال رضي الله عنه : وجلب الضرر حرام بغير خلاف وإنفاق المال في جلب الضرر أشد حرمة فإن إنفاق المال عبثا بلا فائدة إسراف وهو حرام قال تعالى : { وكلوا واشربوا ولا تسرفوا } فكيف بإنفاق المال في جلب الضرر وقد أثبت الأطباء في المشرق والمغرب أخيرا ضرره وأنه سبب لبعض الأمراض الخبيثة .إهـ\nوقال سيدي محمد الطيب السفياني في الإفادة الأحمدية : وكان رضي الله عنه { أي الشيخ سيدي أحمد التجاني رضي الله عنه } يشدد فيها غاية ويسلم من قال إن صاحبها الذي لم يتب من استعمالها لا يموت على حسن الخاتمة .إهـ\nوفي ترجمة سيدي عبد الوهاب بنيس الضريرمن كتاب كشف الحجاب للعلامة سكيرج قال : وبلغني على لسان بعض الثقات أن البركة سيدي الحاج عبد الوهاب بن الأحمر رحمه الله حدث أن بعض عبيد سيدنا رضي الله عنه حصل له مرض شديد و لما احتضر صار يتكلم بكلام متهور و لسانه لا يطاوعه على النطق بالشهادة إذا لقنوها له فصار الإخوان يستلطفون مما رأوه منه ، وقال بعضهم لبعض:” كيف يقع هذا بخديم سيدنا رضي الله عنه و سيدنا على قيد الحياة ؟” ثم إنهم اجتمعوا بسيدنا رضي الله عنه و أخبروه بالقضية فقال لهم رضي الله عنه :”سلوا زوجته عما كان يفعل” فقالت:” إنه كان كذا و كذا ووصفته بأوصاف حسنة من الديانة و الحزم الشديد في طاعة ربه غير أنه كان يستعمل تبغة.” ، فقال لهم سيدنا رضي الله عنه :” من استعمال هذه العشبة الخبيثة أصيب، فاذهبوا إليه و قولوا له يتوب إلى الله. ” فلما ذهبوا إليه و قالوا له ذلك، تاب إلى الله تعالى فبمجرد توبته نطق بالشهادة و خرجت روحه رحمه الله. وعليه فهي من الأمور التي لا ينبغي أن يغفل المقدمون عن التنبيه عليها لمن وفقه الله من المريدين ليجتنبوها وكذلك كل مذموم شرعا أو عقلا أو عادة من خمر ودخان وحشيشة وأفيون إلى أن قال : وكثيرا ما كان ينشد الولي الصالح سيدي العربي بن السائح رضي الله عنه في صاحب الأفيون :\nلا تأمنن صاحب الأفيون في خلق ولا تثـــــــــق بوداده وإن صافي\nلو دمت عمــــــرك توليه مجاملة ما كان يوليك طول الدهر إنصافا\n\nو أخبر الولي الصالح سيدي العربي بن السائح رضي الله عنه أن صاحب الترجمة قال له :” التقديم الذي عندي من قبل الشيخ رضي الله عنه مشروط فيه أن لا أعطي الورد لمن يستعمل هذه العفونات شما أو أكلا أو بخارا.” ، و حدث بذلك أيضا المقدم سيدي الطيب السفياني رضي الله عنه ، و ذكر أنه رأى تقديم صاحب الترجمة و من جملة ما فيه :” و لا يعطى هذا الورد لمن يستعمل القاذورات شما أو أكلا أو شربا، و ذلك كاستعمال العشبة الخبيثة الحشيشة والتبغة و الأفيون ، بل يعطى لشارب الخمر و لا يعطى لهم ، لأن شارب الخمر ترجى توبته بخلاف هؤلاء فإنهم في الغالب لا يتوبون عن تعاطيها. وقال العلامة سكيرج رضي الله عنه في نفس الترجمة وقد بلغني من طريق آخر أن المقدم البركة الشريف سيدي موسى بن معزوز كان إذا علم بأحد معه تبغة يقوم بنفسه ويخرجه من صف الوظيفة .إهـ\nالنقطةالثانية:هي أنه من الممكن أن يأخذ الطريقة التجانية من كان يشرب الدخان لأن الغرض منها هو التصفية والتنقية بمجاهدة رعـونات النفس وهي وسيلة تساعـد المريد على التخلي عن هذه العادة السيئة وغيرها من المحرمات.\nجاء في كتاب كشف الحجاب عند ترجمته للسيد عبد الوهاب بنيس الضرير أن المقدم سيدي الطيب السفياني حكى عن جده البركة الأجل سيدي الطيب رحمه الله أنه لما ذهب إلى تونس لأمر من الأمور استدعاه بعض الأصحاب لداره مع جماعة من الإخوان فصار بعض الحاضرين يمدحون سيدنا رضي الله عنه ويثنون على طريقته الأحمدية ويتمنون الدخول فيها وقالوا له إن العلامة سيدنا إبراهيم الرياحي يمنعنا من أخذ هذه الطريقة لكوننا نستعمل تابغة والدخان ويشترط علينا ترك ذلك إن أردنا ذلك ونحن لا نقدر على ترك ذلك فقال لهم المقدم سيدي الطيب المذكور إن عزمتم على الدخول في هذه الطريقة فإنا نأذن لكم وإن كنتم تستعملون ذلك فحصل لهم من الفرح بذلك ما الله أعلم به وحين خرجوا من الدار كسروا حكوكهم وقالوا لا خير في هذا الشيء الذي يمنعنا لأجله بعض المقدمين من الدخول في هذه الطريقة وعاهدوا الله أن لا يستعملوا ذلك .إهـ\nوفي كتاب التربية في الطريقة التجانية في ضمن الأجوبة البعقيلية لأمين محمد الفطواكي ص53 أن سيدنا الأحسن البعقيلي قال : قال في الخواتم الذهبية ما هذا معناه : إعلم أن الشيخ رضي الله عنه قد أكثر ونفر النفوس عن عشبة التبغة غاية إلا أنه لم ينقل عنه أنه قال يرفع الإذن عن فلان لأنه يستعملها فمن أغلظ على الفقير بمثله يخاف عليه من اللعن والطرد عن حضرة أهل السعادة …إلى أن قال فقد أمر النبي صلى الله عليه وسلم أن يلقن ورده لكل مسلم طلبه طائعا أو عاصيا فهو عام أمر الشيخ فلا يخرجه من الطريقة فقول الشيخ السيد الحاج الحسين الإفراني في الخواتم الذهبية هو عين الحق .إهـ\nوفي كتاب النهج الحميد فيما يجب على المقدم والمريد للشيخ إبراهيم صالح الحسيني أنه قال : واختلف في شارب الدخان فهل يخرج من الطريقة باستعماله أم لا صرح بالاول عدد من أئمة الطريق ومال إلى عدم خروجه من الطريقة شيخنا أبوبكر عتيق في آخر إفتاء له في ضمن أجوبة وجهها إلى سائليه من أهل تشاد ومن فهم هذه المسألة على وجه العلم لم يفهم منها إلا ما فهمه الشيخ أبو بكر عتيق وذلك لأن الدخان قد اختلف العلماء في تحريمه أو كراهته وإن كانت حجة التحريم أقوى من حجة الكراهة إلا أننا اتفقنا على عدم لزوم التجديد للتجاني بسبب وقوعه في جميع المحرمات بل الواجب عليه هناك التوبة إلى الله فقط باتفاق فلماذا لا يكون حكم مستعمل الدخان كذلك مع القول بالتحريم ، واعلم أن الشيخ التجاني له في الدخان قول واحد فقط بالتحريم ومازال عليه حتى لقي الله .إهـ\nأما ما جاء في تقييد التلقين بعدم تعاطي التبغة فإنه كما حكى العلامة سكيرج عن المقدم سيدي الطيب السفياني عند ترجمته لسيدي عبد الوهاب بنيس الضرير من كتابه كشف الحجاب أنه قال : وهذا لم أره في تقديم غيره إلا ما بلغنا عن الشيخ العلامة سيدي إبراهيم الرياحي رضي الله عنه أنه كان يمنع مريد الدخول في هذه الطريقة من استعمال ما ذكر إهـ\nلكن من المعلوم أن سيدنا رضي الله عنه قد أجاز للعديد من أصحابه بالتلقين دون اشتراط هذا الشرط الذي لم نجده الا عند هذين السيدين الجليلين، وهو يمثل حالة خاصة و ليست عامة و بذلك فإنه لا يفسد به انتساب المريد للطريقة غيرأنه من واجب المقدمين التأكيد على المريدين في هذه النقطة و من واجب المريد بذل الجهد للإقلاع عن هذه العادة لأنه لابد في الطريقة من المحافظة على الأمور الشرعية باجتناب المنكرات و المحرمات.\nوهذه بعض أقوال العلماء ليكون المسلم على بصيرة من أمره قال الإمام بدر الدين الزركشي في كتابه زهر العريش في تحريم الحشيش : روى الإمام أحمد رحمه الله في مسنده وأبو داوود في سننه عن أم سلمة قالت : نهى رسول الله صلى الله عليه وسلم عن كل مسكر ومفتر قال العلماء المفتر كل ما يورث الفتور والخدر في الأطراف وهذا الحديث أدل دليل على تحريم الحشيشة بخصوصها فإنها إن لم تكن مسكرة كانت مفترة مخدرة إهـ وقال ابن حجر العسقلاني في كتابه فتح الباري شرح صحيح البخاري :استدل بمطلق قوله كل مسكر حرام على تحريم ما يسكر ولو لم يكن شرابا فيدخل في ذلك الحشيشة وغيرها وقد جزم النووي وغيره بأنها مسكرة وجزم آخرون بأنها مخدرة وهو مكابرة لأنها تحدث بالمشاهدة ما يحدث الخمر من الطرب والنشوة والمداومة عليها والانهماك فيها وعلى تقدير تسليم أنها ليست بمسكرة فقد ثبت في أبي داود النهي عن كل مسكر ومفتر وهو بالفاء.إهـ وقال الصنعاني في كتابه سبل السلام : فإن الحشيشة محرمة إهـ وفي جامع العلوم والحكم لإبن رجب الحنبلي قال :عن أم سلمة قالت نهى رسول الله صلى الله عليه وسلم عن كل مسكر ومفتر والمفتر هو المخدر للجسد وإن لم ينته إلى حد الإسكار والثاني ما يزيل العقل إهـ"}, {"q": "ما رأي الطريقة في قراءة الطالع و التنجيم بصفة عامة ؟", "a": "يجيب عنه العارف بالله سيدي الأحسن البعقيلي رضي الله عنه ضمن كتابه سوق الأسرار إلى حضرة الشاهد الستار فيقول :\n\nوالتعرض للأرزاق بالأسباب الحلالية التي أذن فيها الله ولا يأذن الله إلا فيما فيه مصلحتك وعدم إذايتك لنفسك ولغيرك وهذه الحكمة مقررة في سياسة كتاب الله لتعيش في الدنيا والآخرة مُنعما فإن آذيت نفسك وغيرك يربك الله بما ذكره الله في كتابه ثم إن الأسباب الحسنة هي التي كانت في الطريقة الأولى في عهد رسول الله صلى الله عليه وسلم من فلاحة وتجارة بشروطها وحرفة بشروطها\n\nوما أحدث بَعدهم من التعرض للأرزاق باستخدام الأسماء في عرفهم والروحانيين باهلاكهم وقتل ملوكهم باحراقهم بأنوار الأسماء الجلالية على كيفية معلومة عندهم وكأخذ الأجرة على تناول مثل الكتف فينظر فيها فيريه الشيطان صورا شيطانية تدل على المغيبات من موت أمير وغيره كالخط لرجم الغيب من نحو الزناتي وكرجم الغيب بالرمل وعلم النجوم عندهم وكرجم الغيب بمثل قرعة الأنبياء عندهم وقرعة الطيور وكاستعمال أسماء البركة وكتغيير سكة الأمير وكحرق مثل نحاس حتى يصير مثل فضة فيعيش بها فضة وكالتثقيف للجنين والولادة وإفساده ورميه وكالتفريق بين الأحبة وكالجمع بين الزناة وكالضمائر والخط وكل ما لم تأذن فيه حقيقة الشريعة فكل ذلك ضلال مبين لا شك في ضلال صاحبه لتلبسه بمثل الكفر وذلك كله عمل الكفر بل فعل الأغمار من العاجزين.إهـ\n\nوقراءة الطالع والتنجيم وغيره من المسميات داخلة كلها في مسمى السحر.فعن سيدنا علي بن ابي طالب رضي الله عنه :قال مولانا رسول الله صلى الله عليه وسلم :{ثلاثة لا يدخلون الجنة مدمن خمر وقاطع رحم ومصدق بالسحر } وقال النبي صلى الله عليه وسلم {اجتنبوا السبع الموبقات } فذكر منها السحر ."}, {"q": "هل يوجد فعلا أشخاص يرون بنور الله ؟", "a": "نعم يوجد أشخاص يرون بنور الله كما أوضح ذلك النبي المصطفى صلى الله عليه وسلم فعن أبي أمامة الباهلي رضي الله عنه قال :” قال النبي صلى الله عليه وسلم:” اتقوا فراسة المؤمن فإنه ينظر بنور الله !” قال الهيثمي في مجمع الزوائد رواه الطبراني وإسناده حسن .\nوروى الترمذي في سننه من حديث أبي سعيد الخدري رضي الله عنه أن النبي صلى الله عليه وسلم قال:” إتقوا فراسة المؤمن فإنه ينظر بنور الله ! ” والحديث كما قال الشوكاني في كتابه الفوائد المجموعة حسن لغيره. قال المناوي في تحفة الاحوذي بشرح الجامع الترمذي للمباركفوري :” (اتقوا فراسة المؤمن )أي اطلاعه على ما في الضمائر بسواطع أنوار أشرقت على قلبه فتجلت له بها الحقائق (فإنه ينظر بنور الله ) أي يبصر بعين قلبه المشرق بنور الله تعالى وأصل الفراسة أن بصر الروح متصل ببصر العقل في عيني الإنسان فالعين جارحة والبصر من الروح وإدراك الأشياء من بينهما فإذا تفرغ العقل والروح من أشغال النفس أبصر الروح وأدرك العقل ما أبصر الروح ، وإنما عجز العامة عن هذا لشغل أرواحهم بالنفوس واشتباك الشهوات بها فشُغل بصر الروح عن درك الأشياء الباطنة ومن أكب على شهواته وتشاغل عن العبودية حتى خلط على نفسه الأمور وتراكمت عليه الظلمات كيف يبصر شيئا غاب عنه.” قال ابن خلدون في مقدمته : ” ثم إن هذه المجاهدة والخلوة والذكر يتبعها غالبا كشف حجاب الحس والإطلاع على عوالم من أمر الله ليس لصاحب الحس إدراكُ شيء منها ….إلى أن قال وقد كان الصحابة رضي الله عنهم على مثل هذه المجاهدة وكان حظهم من هذه الكرامات أوفر الحظوظ لكنهم لم يقع لهم بها عناية وفي فضائل أبي بكر وعمر وعثمان وعلي رضي الله عنهم كثير منها وتبعهم في ذلك أهل الطريقة ممن اشتملت الرسالة القشيرية على ذكرهم ومن تبع طريقتهم من بعدهم.\nــ نمادج من واقع الصحابة\nـ أبوبكر الصديق رضي الله عنه:\nأخرج ابن سعد في الطبقات ذكر وصية أبي بكر عن عروة عن أبيه عن عائشة رضي الله عنها أن أبا بكر لما حضرته الوفاة دعاها فقال:” إنه ليس في أهلي بعدي أحَدٌ أحب إلي غنى منك ولا أعزعلي فقرا منك وإني كنت نحلتك [النحلة :العطية من غير عوض ولا استحقاق] من أرض بالعالية جَدادَ[الجداد :صرام النخل وهو قطع ثمرتها] يعني صرام عشرين وسقا [الوسق ستون صاعا أوحمل بعير] فلو كنت جددْتِهِ تمرا عاما واحدا انحاز لك وإنما هو مال الوارث وإنما هما أخواكِ وأختاك فقلت:” إنما هي أسماء فقال :”وذاتُ بطن خارجة قد ألقي في روعي أنها جارية فاستوصي بها خيرا ” فولدت أم كلثوم . ” قال التاج السبكي في حجة الله على العالمين للنبهاني : ” وفيه كرامتان لأبي بكر رضي الله عنه إحداهما إخباره أنه يموت في ذلك المرض حيث قال:” وإنما هو مال وارث ” والثانية إخباره بمولود يولد له وهو جارية .\nـ عمر إبن الخطاب رضي الله عنه:\nجاء في كتاب معيد النعم ومبيد النقم لتاج الدين السبكي قال: ” كان عمر ابن الخطاب رضي الله عنه قد أمر سارية ابن زنيم على جيش من جيوش المسلمين وجهزه إلى بلاد فارس فاشتد الحال على عسكره بباب نَهَاوَنْدَ وكاد المسلمون ينهزمون وعمر رضي الله عنه بالمدينة فصعد المنبر ثم استغاث في اثناء خطبته بأعلى صوته: “ياسارية الجبل! ياسارية الجبل !”فأسمع الله سارية وجيشه أجمعين وهم على باب نهاوند صوت عمر فلجؤوا إلى الجبل فنجوا وانتصروا.” قال العجلوني في كشف الخفاء وإسناده كما قال الحافظ ابن حجر حسن.\nوذكره البيهقي في الدلائل واللالكائي في شرح السنة وابن الاعرابي في كرامات الاولياء وألف القطب الحلبي في صحته جزءا.\nـ عثمان ابن عفان رضي الله عنه:\nذكر التاج السبكي في الطبقات والقرطبي في تفسيره وغيره:\nأنه دخل على عثمان ابن عفان رضي الله عنه رجل كان قد لقي امرأة في الطريق فتأملها فقال له عثمان رضي الله عنه:” يدخل أحدكم وفي عينيه أثر الزنا!” ، فقال الرجل أوحي بعد رسول الله صلى الله عليه وسلم قال :”لا ولكنها فراسة المؤمن.” وانظر أيضا حجة الله على العالمين للنبهاني.\nقال السبكي :”اعلم أن المرء إذا صفا قلبه صار ينظر بنور الله فلا يقع بصره على كدر أو صاف إلا عرفه ثم تختلف المقامات فمنهم من يعرف أن هناك كدرًا ولايدري ماأصله ومنهم من يكون أعلى من هذا المقام فيدري ما أصله كما اتفق لعثمان بن عفان رضي الله عنه فإن تأمل الرجل للمرأة أورثه كدرا فأبصره عثمان وفهم سببه. ”\n–علي ابن ابي طالب رضي الله عنه:\nذكر الامام الطبري في كتابه الرياض النضرة في مناقب العشرة: عن الأصبغ قال :” أتينا مع علي فمررنا بموضع قبر الحسين فقال علي :”ههنا مناخ ركابهم وههنا موضع رحالهم وههنا مهراق دمائهم فتية من آل محمد صلى الله عليه وسلم يقتلون بهذه العرصة تبكي عليهم السماء والأرض ! ”\nـ أبو الدرداء رضي الله عنه:\nذكر اللالكائي في كتابه كرمات الأولياء :\n” أن أبا الدرداء ذكر يوما الفتنة فقال رجل من السكون :”فأين أسيافنا؟” قال أبو الدرداء :”إني أخاف إن حضرتها أن تعور عينك وتكسر سنك.” فحضر السكوني يوم صفين فتعورت عينه وكسرت سنه فقال :\n” يغفر الله لأبي الدرداء واحدة كانت تكفيني ! “\nــ نمادج من الطريقة التجانية\nذكر العلامة أحمد سكيرج في كتابه كشف الحجاب عند ترجمة سيدي محمد بن حرز الله أن سيدي أحمد العبدلاوي حدثه أن إبن صاحب الترجمة حدثه أن أباه شد الرحلة إلى زيارة سيدنا الشيخ أحمد التجاني رضي الله عنه وأتاه ليسأله عن ثلاثة أشياء:” عن الحجامة بالليل ، وأخذ السبحة باليد اليسرى ، وعن سلطان الحق .فاتفق أن قدم لدار الشيخ التجاني ليلا فاستأذن الدخول عليه فأذن له فبينما هو داخل قبل اجتماعه بسيدنا رضي الله عنه إذ سمعه يقول:” ائتوني بالحجام ليحجم لي!” فقال صاحب الترجمة :”هذا جواب المسألة الأولى من مسائلي.” فلما دخل للموضع الذي فيه سيدنا رضي الله عنه وجده آخذا سبحته بيده اليسرى وهو يذكر بها فقال:” في نفسه هذا جواب المسألة الثانية.” ثم لما استقر به المجلس بعد إعطاء مرتبة سيدنا رضي الله عنه حقها صار سيدنا رضي الله عنه يتكلم عن الإمام المهدي فأخذ الجواب عن مسائله الثلاث من غير سؤال سيدنا رضي الله عنه.\nوذكر أيضا عند ترجمة القطب سيدي الحاج علي التماسيني رضي الله عنه:\nأن سيدي أحمد العبدلاوي رضي الله عنه حدثه أنه كان في يوم من الأيام مع سيدي علي التماسيني فأراد أن يطلب منه التقديم لتلقين الورد الشريف ونوى ذلك في خاطره قال:” فبمجرد ما خطر ببالي هذا الخاطر التفت إلي وقال لي رضي الله عنه:” أنت مأذون في إعطاء الطريقة لكل من طلبها .”، وهكذا كان يكاشف كل من يأتيه .\nقلت (أي سكيرج):” لما حدثني مولاي أحمد العبدلاوي رضي الله عنه بهذه المنقبة الشريفة قلت في نفسي :”ما أحسن هذا الاذن على هذه الصورة وياترى إذا سألت منه ذلك يمنحني به أو لا ؟ ” ثم عزمت على عدم سؤالي له لأن الشيء إذا جاء بغير سؤال كان على أحسن حال . فبمجرد ما خطر ذلك ببالي التفت إلي رضي الله عنه كما التفت إليه صاحب الترجمة وقال لي:” أنت مأذون!” وذلك منه مكاشفة كما هي عادته معي في غير ما مرة. ”\nفالنظر بنور الله أمر جائز الوقوع وهو عطية ربانية يكرم الله بها عباده الصالحين الذين تمسكوا بدينهم وحفظوا جوارحهم وهذبوا نفوسهم ، فلا تغتر أيها السائل بمن يجعل نفسه ميزانا يقيس به غيره فإنها لاتقاس القلوب الصافية بالقلوب المكدرة ونفي هذه الكرامة ممن ينكرها إنما هو راجع لعدم وَجْدِ شيء منها في أنفسهم."}, {"q": "أصلي على الرسول صلى الله عليه و سلم في التشهد بصيغة الفاتح بدلا عن الإبراهيمية إقتداء بنصيحة أحد المقدمين ، لكني سمعت أن صلواتي غير صحيحة من أجل هذا ، هل يمكنكم إيضاحي الأمر", "a": "قد علمنا أن بعض المقدمين ينصحون بصلاة الفاتح بدل الإبراهيمية، وهذا و إن كان لا يبطل الصلاة من الناحية الفقهية، فإننا لا ننصح به البتة كما سنبينه لاحقا\nنبدأ أولا بسؤالك حول الصلوات التي قمت فيها باستعمال صلاة الفاتح بدل الإبراهيمية بعد التشهد هل هي صحيحة أم لا، فنقول و الله الموفق للصواب، أنها صحيحة من الناحية الفقهية أي أنه لا تجب عليك إعادتها\nفقد اختلف العلماء في الصلاة على النبي صلى الله عليه وسلم في الصلاة ، فالذي عليه الجم الغفير والجمهور الكثير : أن ذلك من سنن الصلاة ومستحباتها .\nقال ابن المنذر: يستحب ألا يصلي أحد صلاة إلا صلى فيها على رسول الله صلى الله عليه وسلم ، فإن ترك ذلك تارك فصلاته مجزية في مذهب مالك وسفيان الثوري وأهل المدينة وأهل الكوفة من أصحاب الرأي وغيرهم . وهو قول جل أهل العلم . وحكي عن مالك وسفيان أنها في التشهد الأخير مستحبة ، وأن تاركها في التشهد مسيء وشذ الشافعي فأوجب على تاركها في الصلاة الإعادة . وأوجب إسحاق الإعادة قال: مع تعمد تركها دون النسيان\nو لكننا أخي الكريم و إن كان إبدالك الإبراهيمية بالفاتح مما لا ينجر عنه عدم صحة الصلاة، فإننا ننصحك بترك هذا و الإقلاع عنه فورا، و إليك بعض آراء و أقوال علماء الطريقة في هذا الموضوع\nقال العارف بالله سيدي مَحمد بن عبد الواحد النظيفي رضي الله عنه في كتاب مبادئ الإشراق والإسعاد عند جوابه على السؤال رقم 22 : “وصلاة الفاتح محلها السجود لاغير {لاتغلوا في دينكم} النساء 171 وآخر التشهد الأول عبده ورسوله وليس فيها صلاة الفاتح ولا في آخر القنوت وما هذه البدع التي اشتغلتم بها وماهذا الغلو في الدين ؟ فعمل قليل في سنة خير من عمل كثير في بدعة ومن أحب صلاة الفاتح فليتل ماشاء في غير الصلاة ليلا ونهارا.”\nوالشيخ سيدي أحمد التجاني رضي الله عنه كما في جواهر المعاني ما رأى أحدا أخل بشيء من آداب الشريعة إلا نبهه ويقول له إذا كان ممن له معرفة بها على سبيل الإنكار والتوبيخ : “أهكذا ورد في السنة!”\nوالصلاة الإبراهيمية هي الواردة في التشهد\nومن صلى عليه صلى الله عليه وسلم في السجود إنما صلى عليه من باب الدعاء الذي أرشدنا إليه النبي صلى الله عليه وسلم وأمرنا بالاجتهاد فيه .\nروى مسلم في صحيحه عن أبي هريرة رضي الله عنه أن النبي صلى الله عليه وسلم قال :”أقرب ما يكون العبد من ربه وهو ساجد فأكثروا الدعاء.” وفي صحيح إبن خزيمة قال :” وأما السجود فاجتهدوا في الدعاء !”.وفي صحيح مسلم عن أبي هريرة رضي الله عنه أن النبي صلى الله عليه وسلم قال:”من صلى علي واحدة صلى الله عليه عشرا.“.\nوجاء في كتاب اليواقيت الأحمدية العرفانية أن العلامة سكيرج قال :” بأن الشيخ سيدي أحمد التجاني رضي الله عنه كان يذكر الفاتح في السجدة الثانية مرة واحدة وفي رواية ثلاث مرات .”\nوجاء في الإراءة للعارف بالله سيدي الأحسن البعقيلي رضي الله عنه أن الشيخ سيدي أحمد التجاني رضي الله عنه قال : “رأيته صلى الله عليه وسلم يقرأ صلاة الفاتح في السجود .”"}, {"q": "مامعنى لقب مقدم أو خليفة ؟ ماهي أدوارهم وواجباتهم ؟", "a": "المقدم هو من له الإذن في تلقين الأوراد ، وهو تحت مسؤولية الخليفة الذي يمثل أعلى فئة من المقدمين\n\nوهناك أربع فئات من المقدمين : فئتان لهما الإذن المقيد و فئتان لهما الإذن المطلق\n\nبالنسبة لفئتي الإذن المقيد :\n\n1 – في الأولى يؤذن للمقدم في تلقين الأوراد اللازمة للطريقة مع بعض الأذكار الخاصة ، لكن لا يمكنه تسمية مقدم .\n\n2 – في الثانية يؤذن للمقدم في تلقين الأوراد اللازمة للطريقة مع بعض الأذكار الخاصة أحيانا، كما يؤذن له أيضا في تسمية مقدمين آخرين لتلقين الأوراد لكن بصفة محدودة بحيث لا يتجاوز عددا معينا كما هو الحال بالنسبة لسيدي الحافظ الشنقيطي رضي الله عنه و الذي أذن له سيدنا أحمد التجاني قدس الله سره في تقديم عشرة أشخاص لا أكثر.\n\nبعد ذلك هناك فئتي الإذن المطلق :\n\n3 – الأولى لها الإذن في تسمية المقدمين بلا حد معين للعدد لكنها محدودة في وظيفتها بحيث لا يمكنها مثلا إلا تلقين الأوراد اللازمة أو ما إلى ذلك.\n4 – الفئة الرابعة لها مميزات الثالثة لكن لها الإذن أيضا في تلقين الأوراد الخاصة و أسرار أخرى ، وهو النوع الأعلى من أنواع الإذن في التلقين.\n\nأما بالنسبة لمصطلح خليفة ، وهو لغة من خلف أي بقي بعده و قام مقامه فله تعريفان في طريقتنا :\n\n– التعريف الظاهر و العملي ، وهو يرمز للمقدم الذي يحوز على النوع الأعلى من التقديم في الإذن المطلق كما بيناه أي التقديم من الدرجة الرابعة ، و هذا هو المعنى المتعارف عليه غالبا لتعيين من له هذه المسؤولية في بعض الدول…\n\nـ أما التعريف في معناه الأعمق و الروحاني فهو كما أشار إليه الشيخ عمر الفوتي رضي الله عنه في كتابه “الرماح”:\n\n“إن الخلافة عبارة عن نيابة الشيخ الذي كان الخليفة خليفة عنه ، لأنه يوصل إلى التلاميذ ما كان الشيخ يوصله إليهم من الأذكار و الأوراد و الأحزاب و الأسرار و التوجيهات و المقاصد و الخلوات و الآداب و العلوم و المعارف ، و الحاصل أنه يفعل لهم و بهم ما كان الشيخ يفعله ، و له عليهم من الحقوق جميع ما كان للشيخ عليهم بحكم الخلافة و النيابة.\n\nفإن قلت ما الفرق بين المقدم و الخليفة فالجواب أن المقدم هو من أمره الشيخ أو من أذن له بالإذن و هكذا إلى أن يرث الله الأرض و من عليها بتلقين الأذكار اللازمة مع بعض الأذكار التي يختص بها الخواص و لكل مقدم مرتبة عظيمة تجب بها طاعته واحترامه… و ليس الخليفة كذلك بل هو نائب عن الشيخ مطلقا فلذلك كان المقدمون و تلاميذهم من جملة رعية الخليفة ، تجب عليهم طاعة الخليفة لأن وجوب الامتثال للخليفة و حرمة مخالفته تجب على جميع أهل الطريقة ، يستوي فيه من لقنه الخليفة و من لقنه غيره لمرتبة الخلافة .”\n\nلكن في وقتنا الحالي أصبح هذا المصطلح أكثر انتشارا واستعمالا خاصة في البلدان الإفريقية.\nالجدير بالذكر أن للطريقة خليفة عالميا من أحفاد شيخنا القطب المكتوم أحمد التجاني رضي الله عنه (أنظر في خلفاءه) وهو يمثل السلطة العليا العامة .\nكما أنه في البلدان التي تتواجد فيها الطريقة منذ وقت طويل و بها عدد كبير من المنتسبين يوجد عادة خليفة لهذا البلد أو لأحد العائلات الكبيرة فيها مثل عائلة الحاج عمر فوتي طل أو عائلة الحاج مالك سي\n\nو بالمناسبة ،بما أننا فتحنا موضوع المقدم و الخليفة ، فإننا نأسف لما نراه أحيانا من إفراط في استعمال هذه الألقاب الشرفية أو من استعمالاتها الخاطئة .\nللعلم أنه في حياة سيدنا أحمد التجاني رضي الله عنه و رغم أنه كان قد عين عددا كبيرا من المقدمين فإنه لم يكن يدعوا بهذا اللقب إلا واحدا منهم فقط ، و نحن نذكر أن دور كل منتسب لهذه الطريقة مريدا كان أو مقدما أو خليفة أن يكون في خدمة هذه الطريقة المباركة المحمدية و خدمة الإسلام عامة و عدم الاكتراث بالألقاب و عليه بالمحبة الصادقة في شيخنا أحمد التجاني قدس الله سره الذي قال : ” أصحابي كلهم واحد و من يعرفني يعرفني وحدي”\n\nأما في شروط المقدم التي يجب عليه تحصيلها حتى يكون أهلا لتلقين أوراد الطريق للمريدين فهي كما ذكرها سيدي الحاج مكي عبد الله في “اليواقيت و الجواهر المضيئة”\nوأما شروط المقدم فكثيرة منها :\n\nالأول: الأهلية وهي التخلي عن الرذائل و التحلي بالفضائل\n\nالثاني: العلم بأركان الأوراد الثلاثة و شروطها و ما يقضى منها و ما لا يقضى\n\nالثالث: العلم بما يلزم المريد التجاني عند إرادة الدخول للطريقة التجانية و بعد دخوله فيها\n\nالرابع: الإذن الصحيح ممن له الإذن الصريح من صاحب الطريقة التجانية و لو بوسائط\n\nالخامس: العلم و الاعتقاد بأن صحبة الشيخ لا يراد منها إلا أمرين:\n\nالأول: كونه وليا لله و قد أحبه الله واصطفاه و من هذا شأنه تجب محبته لوجه الله\nالثاني : كونه يعلم ما يجب للحضرة الإلهية من آداب وإذا خدمته عبارة عن تلمذة له ليربيه\n\nالسادس: معرفة شروط الطهارة بجميع أنواعها المائية والترابية الخبثية والحكمية والبدنية و المكانية\n\nالسابع: الاتصاف بالديانة و حسن العبادة\n\nالثامن: التحلي بالعقل الذي هو منبع العلم و السعادة\n\nالتاسع: التحلي بالحلم و الأناة و الصبر\n\nالعاشر: معرفة سياسة المريدين و حسن تربيتهم\n\nالحادي عشر: رفع الهمة عن الخلق ثقة بالملك الحق، و بالرجوع إلى وصايا مولانا الشيخ سيدي أحمد التجاني رضي الله عنه و عنا به الموجودة بجواهر المعاني و الجامع و غيرهما يستفيد المقدم و المريد\nإفادة عظمى"}, {"q": "أريد أن أعرف هل بالإمكان القيام بصلاة التسبيح بالرغم مما يقال أن الأحاديث المتعلقة بها ضعيفة أو حتى باطلة ؟ كيف نقوم بها ؟", "a": "أولا من ناحية علماء الحديث فإنه ليس هناك إجماع على بطلان أو ضعف الحديث بل ذهب الجمهور إلى استحبابها قال ابن عابدين وحديثها حسن لكثرة طرقه ووهم من زعم وضعه.\nوقد رُوى حديث صلاة التسبيح من طرق كثيرة عن جماعة من الصحابة منهم عبد الله بن عباس و أبو رافع الأنصاري مولى رسول الله صلى الله عليه و سلم و عبد الله بن عمرو الأنصاري .\nقال المنذري في ” الترغيب و الترهيب ” أمثلها حديث عكرمة و قد صححه جماعة منهم الحفاظ : أبو بكر الآجري و أبو محمد بن عبد الرحيم المصري و أبو الحسن المقدسي .\nوحديث ابن عباس يقرب من شرط الحسن. قال أبو منصور الديلمي في مسند الفردوس : صلاة التسبيح أشهر الصلوات وأصحها إسناداً . وقال البيهقي :” كان عبد الله بن المبارك يصليها وتداولها الصالحون بعضهم عن بعض ، وفي ذلك تقوية للحديث.”\nوقد اختلف الحفاظ في الحكم على هذا الحديث فمنهم من صححه ومنهم من ضعفه والذين صححوه هم جمهور المحققين ، ومنهم الدارقطني ، والخطيب البغدادي ، وأبو موسى المدني. وكل ألف فيه جزءاً ، وأبو بكر بن أبي داود ، والحاكم ، والسيوطي ، والحافظ ابن حجر ، والألباني ، وغيرهم …\nإذا فلا خوف على من أراد القيام بهذه الصلاة راجيا ثوابها العظيم خاصة أن جماعة كبيرة من العلماء في كافة العصور و السلف الصالح كانوا لا يتركون فعلها .\nمن ناحية أخرى فإن علماء الحقيقة و المعرفة من شيوخ السلوك الواصلين أصحاب الأنوار و المعارف قد قرروا أن أصل هذه الصلاة هو من التعاليم النبوية المحققة على صاحبها أفضل الصلاة و السلام وأنها من الأعمال الفضيلة التي يجب على كل سالك لله تعالى الارتباط بها .\nو من المعلوم عند أهل التحقيق أن درجة علماء الحقيقة من العارفين بالله فوق درجة الفقهاء و المحدثين لأنهم جمعوا شرف العلوم الرسمية و المكنونة.\nأما صفتها فتصلي أربع ركعات تقرا في كل ركعة فاتحة الكتاب و سورة فإذا فرغت من القراءة في أول ركعة قلت و أنت قائم: “سبحان الله و الحمد لله و لا اله إلا الله و الله أكبر” خمس عشرة مرة ثم تركع فتقولها عشرا ثم ترفع رأسك من الركوع فتقولها عشرا ثم تهوى ساجدا فتقولها عشرا ثم ترفع رأسك من السجود الأول فتقولها عشرا ثم تسجد و تقولها عشرا و ترفع رأسك من السجود الثاني فتقولها عشرا فذلك خمس و سبعون في كل ركعة ثم تفعل ذلك في أربع ركعات.\nعَنْ عكرمة عَنْ ابنِ عبَّاسٍ رَضِيَ اللهُ عَنْهُ قَالَ : قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيهِ وَسَلَّمَ للعبَّاسِ ابنِ عَبْدِ المُطَّلِبِ : « يَا عبَّاسُ يَا عَمَّاهُ ! أَلا أُعْطيكَ ، أَلا أَمْنَحُكَ ، أَلا أَحْبُوكَ ، أَلا أَفْعَلُ بِكَ عَشْرَ خِصَالٍ ؟ إِذَا أَنْتَ فَعَلْتَ ذَلِكَ غَفَرَ اللهُ لَكَ ذَنْبَكَ : أَوَّلَهُ وَآخِرَهُ ، قَدِيمَهُ وَ حَديِثَهُ خَطَأَهُ وَعَمْدَهُ ، صَغِيرَهُ وَكَبِيَرهُ ، سِرَّهُ وَعَلانِيَتَهُ ، عَشْرَ خِصَالٍ : أَنْ تُصَلِّيَ أَرْبَعَ رَكَعَاتٍ تَقْرَأُ في كُلِّ رَكْعَةٍ فَاتِحَةَ الْكِتَابِ وَسُورَةً ، فَإِذَا فَرَغْتَ مِنَ الْقِرَاءَةِ في أَوَّلِ رَكْعَةٍ فَقُلْ وَأَنْتَ قَائِمٌ : سُبْحَانَ اللهِ وَالْحَمْدُ للهِ وَلا إِلهً إِلَّا اللهُ وَاللهُ أَكْبَرُ خَمْسَ عَشَرَةَ مَرَّةً ، ثُمَّ تَرْكَعُ فَتَقُولُهَا وَأَنْتَ رَاكِعٌ عَشَراً ، ثُمَّ تَرْفَعُ رَأْسَكَ مِنَ الرُّكُوعِ فَتَقُولُهَا عَشْراً ، ثُّمَ تَهْوِي سَاجِدَاً فَتَقُولُهَا وَأَنْتَ سَاجِدٌ عَشْراً ، ثُمَّ تَرْفَعُ رَأْسَكَ مِنَ السُّجُودِ فَتَقُولُهَا عَشْراً ، ثُمَّ تَسْجُدُ وَتُقُولُهَا عَشْراً ، ثُمَّ تَرْفَعُ رَأْسَكَ فَتَقُولُهَا عَشْراً ، فَذلِكَ خَمْسٌ وَسَبْعُونَ في كُلِّ رَكْعَةٍ ، تَفْعَلُ ذلِكَ في أَرْبَعِ رَكَعَاتٍ ، إِنْ اسْتَطَعْتَ أَنْ تُصَلِّيَهَا في كُلِّ يَوْمٍ مَرَّةً فَافْعَلْ ، فَإِنْ لَمْ تَسْتَطِعْ فَفِي كُلِّ جُمُعَةٍ مَرَّةً ، فَإِنْ لَمْ تَفْعَلْ فَفِي كُلِّ شَهْرٍ مَرَّةً ، فَإِنْ لَمْ تَفْعَلْ فَفِي كُلِّ سَنَةٍ مَرَّةً ، فَإِنْ لَمْ تَفْعَلْ فَفِي عُمُرِكَ مَرَّةً » .\nأخرجه أبو داوود وابن ماجه وابن خزيمة في صحيحه\nقوله “غفر الله لك ذنبك أوله و آخره … صغيره و كبيره ” يدل بظاهره على مغفرة الكبائر ، وهو محمول على إذا ما اقترنت ببقية شروط التوبة من الاستغفار و الندم و العزم على عدم العودة ؛ كما أنه لا يتناول حقوق العباد ، فلا تسقط عن ذمته إلا بإرجاع الحقوق إلى أصحابها ، و إنما تبرأ ذمته مما هو خاص بحقوق الله تعالى المحضة.\nو قوله ” تقرأ في كل ركعة بفاتحة الكتاب و سورة ” مطلق في أي السور يختار القارئ و قد اختار بعضهم لذلك التكاثر، العصر، الكافرون، الإخلاص\nو قوله: ” ثم ترفع رأسك من السجود فتقولها عشرا ” أي بعد قول:”سمع الله لمن حمده ربنا ولك الحمد.” و كذلك في كل ما يأتي تقال التسبيحات بعد أذكار الصلوات الأصلية ."}, {"q": "هل من الممكن رؤية الله ؟ لقد روي لي أن بعض ما يسمَّون ب “المرابط” في وقتنا رأوه ، و هل رآه أحمد التجاني؟", "a": "رؤية الحق\n\nرؤية الحق في الدنيا غير واقعة يقظة، وأما في النوم فجائزة. وهي إذ ذاك أمر روحي. ومن يدعيها يقظة من الصالحين، تحمل دعواه على رؤية الروح الرؤية البرزخية التي هي عين رؤية النوم .\n{ وجوه يومئذ ناضرة إلى ربها ناظرة } وقد قال تعالى:\nوهذا خاص بالآخرة لقوله صلى الله عليه وسلم: « واعلموا أنكم لن تروا ربكم حتى تموتوا » أخرجه مسلم في صحيحه .ولا يدخل في ذلك المتكلم ، فالتحقيق أن الله عز وجل ، أنعم عليه برؤيته بغير كيف ، كما يرى سبحانه في الدار الآخرة. والموت في الحديث، هو الموت المعروف في اللغة .\nجاء في كتاب التعرف لمذهب أهل التصوف لأبي بكر الكلاباذي رحمه الله :”\nوأجمعوا أنه لا يرى في الدنيا بالأبصار ولا بالقلوب إلا من جهة الإيقان؛ لأنه غاية الكرامة، وأفضل النعم، ولا يجوز أن يكون ذلك إلا في أفضل المكان، ولو أعطوا في الدنيا أفضل النعم لم يكن بين الدنيا الفانية والجنة الباقية فرق، ولما منع الله سبحانه كليمه موسى عليه السلام ذلك في الدنيا وكان من هو دونه أحرى. وأخرى: أن الدنيا دار فناء، ولا يجوز أن يرى الباقي في الدار الفانية، ولو رأوه في الدنيا لكان الإيمان به ضرورة. والجملة أن الله تعالى أخبر أنها تكون في الآخرة، ولم يخبر أنها تكون في الدنيا، فوجب الانتهاء إلى ما أخبر الله تعالى به. ولا نعلم أحدا من مشايخ هذه العصبة المعروفين منهم والمتحققين به، ولم نر في كتبهم، ولا مصنفاتهم ولا رسائلهم، ولا في الحكايات الصحيحة عنهم، ولا سمعنا ممن أدركنا منهم زَعَمَ أن الله تعالى يرى في الدنيا، أو رآه أحد من الخلق، إلا طائفة لم يعرفوا بأعيانهم، بل زعم بعض الناس: أن قوما من الصوفية ادعوها لأنفسهم. وقد أطبق المشايخ كلهم على تضليل من قال ذلك، وتكذيب من ادعاه، وصنفوا في ذلك كتبا، منهم أبو سعيد الخراز، وللجنيد في تكذيب من ادعاه وتضليله رسائل وكلام كثير. وزعموا أن من ادعى ذلك لم يعرف الله عز وجل وهذه كتبهم تشهد على ذلك. ”\nو في جواهر المعاني قال سيدنا رضي الله عنه في سؤال عن قوله صلى الله عليه وسلم:” حجابه النور لو كشفه لأحرقت سبحات وجهه ما أدركه بصره من خلقه…” ،\nفأجاب رضي الله عنه :”\nمعنى هذا أن الموجودات لو نظرت إلى الله عز وجل بلا حجاب و أدركته أبصارها لأحرقت سبحات وجهه سبحانه وتعالى جميع الموجودات التي أدركته أبصارها بلا حجاب و لرجعت في أسرع من طرفة عين إلى عدميتها الأولى ، و قوله “ما” صادقة على جميع الموجودات و الضمير الأخير في “أدركه” يعود على الله تعالى و فاعل أدرك هو بصره و الضمير في بصره هو المفسر بقوله “من خلقه” .”.\nو قال سيدنا رضي الله عنه عن معنى قوله تعالى: { قال ربي أرني أنظر إليك قال لن تراني} أن سيدنا موسى عليه السلام طلب رؤية الله وهو التجلي الذي اختص به نبينا صلى لله عليه وسلم فطلبه من الله ،” قال لن تراني” ، أراه سبحانه وتعالى أنه لا يطيق ذلك ثم أراه الآية بذلك بالجبل من حيث أنه أشد منه قوة ضربه له مثلا فقال له ولكن انظر إلى الجبل فإن استقر مكانه حين أتجلى عليه فسوف تراني أنت فلما تجلى ربه للجبل ، قيل أخرق من الحجاب للجبل مقدار عين الإبرة حتى طالع الجلال الذاتي القدسي ، فتهدم الجبل من حيه وصار دكا من هيبة الجلال .\nفلما رأى موسى ذلك صعق من هيبة الجلال فلما أفاق قال:” سبحانك تبت إليك” ، يعني من هذا ، وأنا أول المؤمنين ، بأنك لا تُرَى."}, {"q": "هل أن علم الأرقام ، و الحروف و الأسماء هي جزء من علوم الطريقة التجانية ، لأني أعرف عديدا من المقدمين المتفرغين لها", "a": "جاء في كشف الحجاب للعلامة سيدي أحمد سكيرج رضي الله عنه عند ترجمة سيدي محمد بن العربي التازي الدمراوي رضي الله عنه أن الشيخ سيدي أحمد التجاني أمر صاحب الترجمة بترك هذه الأشياء وذلك أنه كان له التصرف التام بالجداول والأوفاق حتى إنه كان يستعمل الجدول وينقر منه الدنانير بمرأى من الناس حتى نهاه سيدنا رضي الله عنه عن ذلك وقال له إن هذه الأمور من وقف معها لايحصل له فتح البتة فترك ذلك امتثالا لأمر سيدنا رضي الله عنه ففتح عليه بالفتح الأكبر. إهـ\nوجاء في كتاب جواهر المعاني للعارف بالله الخليفة سيدي علي حرازم برادة رضي الله عنه في رسائل الشيخ سيدي أحمد التجاني رضي الله عنه مانصه:\n” ومما كتب به إلى بعض الفقهاء من أحبائه بفاس ونصه: ” اعلم أن التمسك بما في كتب أهل الخواص من دائرة الشاذلية رضي الله عنه وأسماء الله والحروف والجداول كله كسراب بقيعة يحسبه الظمآن ماء حتى إذا جاءه لم يجده شيئا ما في جميعها إلا التعب.” وفي الجواهر أيضا من نفس الفصل قال شيخ الطريقة سيدي أحمد التجاني رضي الله عنه :” فتعلقك بالخواص في طلب الدنيا وأغراضها وشهواتها وأنت مشغول بإطلاق لسانك في الغيبة والنميمة وفيما لايرضي الله منهمك في البعد عن الله لاربح في هذه التجارة إلا التعب فلا تظفر منها بشيء ، إن الخواص بحر الطمع متعلق به كالذي يريد الظفر بشراب بقيعة.\nإنما الخواص وأسرارها لا يتمكن منها أحد من خلق الله إلا أحد رجلين:\nإما رجل ظفر بالولاية وإما رجل جعل أكثر أوقاته في ذكر الله وفي صحة التوجه إليه سبحانه وتعالى وفي الصلاة على نبيه صلى الله عليه وسلم طلبا لوجه الله الكريم لا لغرض غير ذلك وداوم على هذا المنوال وصان لسانه عن الأقاويل التي لا تُرتضى شرعا كالغيبة والنميمة والكذب والسخرية وسائر مالايرتضى وصان قلبه عما لايرضي الله كالكبر والحسد وظلم الناس والبغض بغير أمر شرعي إلى غير ذلك وهو في هذا كله قائم لله تعالى.فهذا هو الذي لعله يدرك بعض أسرار الخواص ومن سوى هذين لايفيد التعلق بالخواص إلا بالتعب .إهـ\nوجاء في اليواقيت الأحمدية العرفانية واللطائف الربانية في الأجوبة عن بعض الأسئلة في الطريقة التجانية من إملاء العارف بالله سيدي أحمد سكيرج على جامعها المقدم سيدي محمد امغارة التطواني:”\nوسألته رضي الله عنه عما ورد عن الشيخ رضي الله عنه وعن خاصة أصحابه من كون طريقته المحمدية غير مبنية على الخواص المنوطة بالأذكار والأسماء والأوفاق والحروف وغير ذلك مع ما صح عن الشيخ رضي الله عنه من أنه كان يتعاطى ذلك ونقله عنه الخاصة من الأصحاب ووجد شيء منه مقيدا بخطه الشريف وبخط الواسطة المعظم سيدي محمد الدمراوي والخليفة سيدي علي حرازم رضي الله عن الجميع كما وقع النص على ذلك في كتب الطريقة وخصوصا كتابكم نيل الأماني فأجاب :”\nأما الأذكار الخصوصية والجداول الوقفية وخواص ذلك مع خواص بعض الأسماء والآيات القرآنية المنقولة عن الشيخ رضي الله عنه فقد كان ذلك في أول الأمر قبل اجتماعه بالنبي صلى الله عليه وسلم ولم يكن همه قبل الوصول إلى هذه الدرجة إلا العثور على ما يتوصل به إلى هذا المطلب الذي هو المطلب الأهم عند أهل الله لا أنه كان يخوض في ذلك ليحرز المأمول من الأغراض التي يقصدها الخائضون في علم الأوفاق والأسماء وغيرها من جلب شيء أو دفعه أو خفض شيء أو رفعه أو إقبال الخلق عليه إلى أن قال وقد نهى سيدنا رضي الله عنه الخاصة من أصحابه عن الوقوف مع تلك المطالب لأن المتصرف بذلك لا ينال الفتح إلى أن قال وأحسن ما يذكر هنا ماقاله العلامة ابن المشري في الجامع ونصه ما جاء من الأذكار والعبادات لسعة الرزق ودفع الضر وهلاك الظالم ودفع الفقر وقضاء الحوائج إلى غير ذلك فما كان من ذلك منها من جلب رزق ودفع فقر وقضاء حاجة مطلوبا لذاته بذكر الذكر والعبادة فهو شرك الأغراض وهو حرام بإجماع وإن كان ذلك المطلوب ليعين على عبادة الله عز وجل فلا يخلو من أمرين أيضا إما أن يكون قصده في ذلك الذكر الخاص أو العبادة الخاصة مجرد غرض من سعة الرزق وغيره عن قصد وجه الله عز وجل بالذكر والعبادة الخاصة فذلك من شرك الأغراض أيضا وهو حرام وإن قصد بالذكر والعبادة وجه الله ورجا مع ذلك قضاء غرضه ليستعين به على عبادة ربه وليدعوا عقب عبادته لله بقضاء حاجته فهو جائز ولا حرج فيه لكن بعد إعتقاد أن الله هو الفاعل باختياره لابذلك الذكر بل عنده لا به وطلب بالذكر وجه الله عز وجل وأن الأذكار والعبادات لاتأثير لها وخواصها من الثواب هنا وهناك وأن الله هو الفاعل عندها بمحض اختياره لا بعلة فهذا هو وجه صحته وكل هذا تكشفه الأدلة النقلية.\nوفي هذا القسم الجائز كان يخوض فيه في أوائل أمره ويستعمل ذلك بعض من له الإذن فيه من أصحابه ومع هذا فإن طريقته التي تلقاها عن الرسول صلى الله عليه وسلم ليست من هذا القبيل بل هي مجرد أذكار توصل المريد لرضا الله بضمان الرسول عليه السلام ووقع التصريح منه بأن الخوض في ذلك ليس من الأمر الذي يسلك عليه فيها حتى لايظن أحد أن ذلك من نفس الطريقة التي تلقاها عن الرسول عليه السلام يقظة لامناما ولاينافي هذا ماتلقى عنه من بعض خواص الأذكار وغيرها ووجد بخطه إن تحققت ما أومأنا إليه والله يلهمنا وإياكم نهج الصواب آمين.\nوجاء في كتاب التربية في الطريقة التجانية في ضمن الأجوبة البعقيلية لأمين محمد الفطواكي :” فلا تذكرالأسماء للتصرف بها ولاستخدام أرواحها فإنه رجس وإنما نقصد بها حمد ربنا وشكره.”\nواستشهد المحقق العلامة سيدي العربي ابن السائح رضي الله عنه في بغيته بكلام الشيخ محي الدين من فتوحاته المكية للتنبيه على أن الهرب من صحبة الجن وترك مجالستهم أولى للعاقل وأن الإيثار لمجالستهم جهل فقال:” فرجال الله يفرون من صحبة الجن وقد أخبرت بأن صحبتهم تورث التكبر على الناس ومن تكبر على الناس مقته الله تعالى من حيث لايشعر فنسأل الله العافية.”\nوجاء في كتاب مواهب اللطيف للعارف بالله سيدي محمد بن عبد الواحد النظيفي رضي الله عنه قوله :\nفليس مـن طريقة التجاني رسمك للجـدول في التـربان\nبقـصد تربيـع أو التنقـيـر والبحث في الكنوز والإكسير\nلاتك مغـتـرا بخالي الوسط فإنــــه خـال بــــدون شطـط\nكـذا تقـصيصك للكاغـيــد فكـل ذا يحـرم كالوقـيـــــــــد\nتلاوة لبعــض آي المحكـم أو بعض أسماء الاله الاكـرم\nلجــلـب درهـــم أو الدينار أو لـنمـــــو المــال والثـمـــار\nأو مايسمــــونه بالتدمــيــر لظالـــــــم وجائــــــــر مبـيـر\nمن حرفة العجـزة الأغـمار ماهـــــــكـــذا عـبــادة الغـفــار\nوإنما طريقة التجانــــــــي وكــــــــل صادق من الاخوان\nتمعش بالكسب والصناعة وبالتجارة وبالزراعــــــــــــــة\nوكـــــل ما أباحت الشريعة لنــا من الأسباب في المعـيشة\n\nفبان لك أيها السائل من هذه النقول أن علم الأرقام والحروف والأسماء ليست من علوم الطريقة التجانية في شيء وإنما علومها تدور حول العمل على تصفية باطن الفقير وظاهره مما لايرضي الله قائما لله في جميع توجهاته مخلصا له محكما سنة مولانا رسول الله صلى الله عليه وسلم في كل حركاته وسكناته قلبا وقالبا سرا وعلانية ."}, {"q": "كثيرا ما سمعت ان هناك الكثير من تزكة النفس في مقولات أحمد التجاني وهو شيء منكر في الشريعة لأننا لم نجد ذلك عند أفاضل الرجال من الصحابة ، و خاصة منه ما يزعم أنه فوق الصحابة", "a": "بالنسبة لمسألة تزكية الشيخ نفسه و تفضيله و المنتسبين اليه على الصحابة رضي الله عنهم و ارضاهم التي كثيرا ما تتردد نورد الجواب ان شاء الله على لسان سيدي عمر بن سعيد الفوتي رضي الله عنه حيث يقول في الفصل 36 من كتاب رماح حزب الرحيم على نحور حزب الرجيم\n” فالجواب و الله تعالى الموفق للصواب ان هذا الٳيراد(تزكية الشيخ نفسه) غير وارد كما قال الحافظ جلال الدين السيوطي في الصواعق على رؤوس النواعق : ليس من باب الإفتخار ولا تزكية النفس بل في هذا وجهان:\nاحدهما ان هذا من باب التعريف بحاله اذ جهل مقامه ، قال النووي في الأذكار في باب مدح الإنسان نفسه و ذكر محاسنه :اعلم ان ذاكر محاسنه مذموم و محمود ، فاما المذموم ان يذكره للافتخار و الإرتفاع و شبه ذلك . و اما المحمود ان يكون فيه مصلحة دينية و ذلك بان يكون آمرا بالمعروف او ناهيا عن المنكر او ناصحا او مشيرا او معلما او مأدبا او واعظا او مصلحا بين اثنين او يدفع عن نفسه .. و قد جاء في مثل هذا كثير من النصوص كقول النبي صلى الله عليه و سلم :” أنا سيد ولد آدم ولا فخر انا أول من تنشق عنه الأرض و يدخل الجنة و أنا أعلمكم بالله و أتقاكم ” الحديث و اشباه هذه كثيرة و قال يوسف عليه السلام اجعلني على خزائن الأرض إني حفيظ عليم . و روي في الصحيحين عن سعد ابن ابي وقاص رضي الله عنه انه قل حين اشتكاه اهل الكوفة للخليفة عمر رضي الله عنه من انه لا يحسن الصلاة : اني اول من رمى بسهم في سبيل الله و كنا نغزو مع رسول الله صلى الله عليه و سلم و ذكر تمام الحديث ، و في صحيح مسلم عن ابن عباس رضي الله عنه سئل عن الدية فقال على الخبير سقطت يعني بنفسه و روى الحديث و في صحيحه ايضا عن علي ابن ابي طالب كرم الله وجهه : والذي برأ النسمة انه لعهد رسول الله صلى الله عليه و سلم ان لا يحبني الا مؤمن و لا يبغضني الا منافق…. و نضائر هذا كثير لا ينحصر …\n\nالوجه الثاني ان هذا من باب التحدث بنعمة الله شكرا وامتثالا لقوله تعالى ( و أمّا بنعمة ربّك فحدّث ).أخرج عبد الله بن احمد بن حنبل في رواية المسند و البهيقي في شعب الإيمان قال رسول الله صلى الله عليه و سلم “التحدث بنعمة الله شكر و تركها كفر” وقال الشيخ العلامة شمس الدين ابن القيم : الشيء الواحد تكون صورته واحدة و ينقسم الى محمود و مذموم ،فمن ذلك التحدث بالنعمة شكر و الفخر كفر بها ، فالأول المقصود به اظهار فضل الله تعالى و احسانه و نعمته و افشاؤها و فيه حديث التحدث بالنعمة شكر و تركها كفر ….\n\nأما الإيراد الثاني(تفضيل الشيخ على الصحابة) فالجواب و الله تعالى الموفق للصواب ان العلماء كما قال السيوطي في مثل هذا فرقتين فمنهم من جعل ذلك اصطلاحا عرفيا و منهم من قال هو موكول الى تخصيص العقل اي انه من العلم الذي اريد به الخصوص الذي تعذر بيانه ومن ذلك قوله تعالى (تدمر كل شيء بأمر ربها) أطبق العلماء من العام المراد به الخصوص ، لأنها لم تدمر الملائكة و لا العرش ولا الكرسي و لا السماوات ولا الأرض ولا الجبال ولا بقية البشر الا قوم عاد ….. و منها قوله صلى الله عليه و سلم ” ما أضلت الخضراء و لا اقلت الغبراء اصدق لهجة من ابي ذر” فهذا من العام المراد به الخصوص قطعا ،ولا سبيل الى دخوله صلى الله عليه و سلم و سائر الأنبياء في هذا العموم …. و منها ما اخرجه ابن ابي شيبة في المصنف في خطبة الحسن بن علي رضي الله عنهما حين قتل علي :” يا اهل الكوفة لقد كان بين اظ
