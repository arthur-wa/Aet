كنه إجابتي ما الذي يبرهن أن أحمد التجاني رأى الرسول صلى الله عليه وسلم فعلا ؟", "a": "روى البخاري في صحيحه عن سيدنا أبي هريرة رضي الله عنه قال سمعت النبي صلى الله عليه وسلم يقول :” من رآني في المنام فسيراني في اليقظة ولا يتمثل الشيطان بي.”\nولتأكيد رؤية الشيخ التجاني رضي الله عنه للنبي صلى الله عليه وسلم نذكر بين ذلك جملة من شهادات وأقوال العلماء الأجلاء من غير التيجانيين في التعريف بهذا الشيخ الجليل سيدي أحمد التجاني رضي الله عنه لنكون على بصيرة أن هذه المنقبة العظيمة رؤية النبي صلى الله عليه وسلم يقظة هو أهل لها بلا شك ولا ريب رضي الله عنه وعنا به آمين.\nوكما قال ابن الحاج في المدخل : ”\nرؤيته صلى الله عليه وسلم في اليقظة باب ضيق وقل من يقع له ذلك إلا من كان على صفة عزيزة وجودها في هذا الزمان بل عدمت غالبا مع أننا لا ننكر من يقع له ذلك من الأكابر الذين حفظهم الله تعالى في ظواهرهم وبواطنهم . “\n\nوهو كذلك كما ستقف عليه إنشاء الله :\n1ـ قال الحافظ سيدي محمد بن جعفر الكتاني في كتابه سلوة الأنفاس فيمن أقبر من العلماء والصالحين بفاس ج1ص193 :” ومنهم الشيخ الواصل القدوة الكامل الطود الشامخ العارف الراسخ جبل السنة والدين وعلم المتقين والمهتدين العلامة الدراكة المشارك الفهامة الجامع بين الشريعة والحقيقة الفائض النور والبركات على سائر الخليقة الواضح الآيات والأسرار ومعدن الجود والافتخار البحر الزاخر الطام المعترف بخصوصيته بين الخاص والعام نادرة الزمان ومصباح الأوان القطب الجامع والغوث النافع أبو العباس مولانا أحمد بن الولي الكبير والعالم الخير أبي عبد الله محمد (فتحا) بن المختار بن أحمد بن محمد ابن سالم الشريف الحسني الكاملي التجاني يرفع نسبه إلى الإمام محمد النفس الزكية بن عبد الله الكامل كان رحمه الله من العلماء العاملين والأئمة المجتهدين ممن جمع بين شرف الجرثومة والدين وشرف العلم والعمل واليقين والأحوال الربانية الشريفة والمقامات العلية المنيفة والخوارق العظام والكرامات الجسام قوي الظاهر والباطن كامل الأنوار والمحاسن عالي المقام راسخ التمكين والمرام بهي المنظر جميل المظهر منور الشيبة عظيم الهيبة جليل القدر شهير الذكر ذا صيت بعيد وعلم وحال مفيد وكلمة نافذة في الأمر بالمعروف والنهي عن المنكر عائدة ولد سنة خمسين ومائة وألف بقرية عين ماضي ونشأ في عفاف وأمانة وحفظ وصيانة مقبلا على الجد والاجتهاد مائلا إلى العزلة والانفراد مشتغلا بالقراءة معتاد التلاوة فحفظ القرآن وهو ابن سبعة أعوام ثم اشتغل بطلب العلوم حتى رأس فيها وحصل معانيها ….إلى أن قال رحمه الله ثم رجع إلى قرية أبي سمغون وأقام بها واستوطنها وفيها وقع له الفتح الكبير وأذن له صلى الله عليه وسلم في تلقين الخلق بعد أن كان فارا من ملاقاتهم…. “.\n2ـ الشيخ سيدي جعفر بن إدريس الكتاني في كتابه الشرب المحتظر والسر المنتظر من معين بعض أهل القرن الثالث عشر : “ومنهم الولي الشهير والقطب الواضح الكبير الغوث الرباني أبو العباس سيدي أحمد التجاني إلى أن قال والحاصل أن أوصافه عظيمة وأحواله عجيبة ومقامه في الولاية حال كبير.” .\n3ـ العلامة الطالب بن حمدون في كتابه الإشراف يحدث عن أبيه أنه كان يثني على هذا الشيخ بالعلم والمعرفة ويقول إنه من الكمل .\n4ـ الشيخ محمد ظافر المدني في كتابه اليواقيت الثمينة في أعيان مذهب عالم المدينة قال : ” أحمد بن محمد بن المختار بن أحمد بن محمد ابن سالم الشريف التجاني الشهير القدوة الكامل العارف الراسخ جبل السنة والدين والعلامة الدراكة المشارك الفهامة الجامع بين الشريعة والحقيقة نادرة الزمان ومصباح الأوان . ” .\n5ـ الشيخ محمد بن محمد مخلوف في كتابه شجرة النور الزكية في طبقات المالكية (ج1ص378 تحت رقم 1513) وقال فيها :” أبو العباس أحمد بن محمد بن المختار بن أحمد الشريف التجاني العالم العامل المتصوف العارف بالله الرباني الولي الكبير القطب الشامخ الشهير كان ذا صيت بعيد وحال مفيد له بالمغرب وما والاها أصحاب وأتباع كثيرون…إلخ. ” .\n6ـ وأشار الشيخ أحمد بن الهادي العلوي الشنقيطي في كتابه منتهى السيل الجارف من تناقضات مشتهى الخارف إلى بعض أسماء من ترجموا للشيخ سيدي أحمد التجاني رضي الله عنه كالنبهاني في كتابه جامع كرامات الأولياء(ج1ص579) وعبد الرزاق البيطار في كتابه حلية البشر(ج1ص301) والشيخ بيرم التونسي في صفوة الاعتبار والشيخ ماء العينين في نعت البدايات . وهي مراجع لمن أراد التوسع .\n7ـ صاحب الاستقصاء لأخبار دول المغرب الأقصى الشيخ الناصري أثناء الكلام على دولة مولاي سليمان ما نصه : ” وفي هذه السنة يعني1211 قدم الشيخ الفقيه المتصوف أبو العباس التجاني إلى فاس فاستوطنها وكان الباي محمد بن عثمان صاحب وهران أزعجه من تلمسان إلى قرية أبي سمغون وأقبل أهلها عليه ثم لما مات الباي المذكور وولى بعده ابنه عثمان بن محمد سعى عنده بالشيخ التجاني فبعث إلى أهل أبي سمغون وتهددهم ليُخْرجوه ولما سمع بذلك الشيخ المذكور خرج مع بعض تلامذته وأولاده وسلك طريق الصحراء حتى احتل بفاس ولما دخلها بعث رسوله بكتابه إلى أمير المؤمنين المولى سليمان يعلمه بأنه هاجر إليه من جور الترك وظلمهم واستجار منهم بأهل البيت الكريم فقبله السلطان وأذن له في الدخول عليه والحضور بمجلسه ولما اجتمع به ورأى سمته ومشاركته في العلوم أقبل عليه واعتقده وأعطاه دارا معتبرة من دوره وأقبل عليه الخلق واشتهر أمره بفاس والمغرب وهو شيخ الطائفة التجانية رحمه الله ونفعنا به . وقد ذكر تاريخ وفاته في موضع آخر وأثنى عليه بالعلم والمعرفة وذكره أيضا عند كلامه على زيارة القبور وما حدث فيها من بدع قال وهذا القول رآه الشيخ الصوفي أحمد التجاني رحمه الله . “إهـ .\nوقال الشيخ محمد فال بن عبد الله في كتابه رشق السهام في ما في كلام المنكر على الشيخ التجاني من الأغلاط والأوهام (طبعة 1974م) ص148 :” وكان الذي وقع بين الشيخ وأتراك الجزائر أنه كان ينقم منهم تقديم القوانين على الأحكام الشرعية وشدة ظلمهم وفسادهم في البلاد وهذا يعلمه منهم كل من له إلمام بتاريخهم وكان الشيخ يشدد النكير عليهم في ذلك ويصرح به كما نرى بعض ذلك في كلامه في الإفادة الأحمدية ولاشك أن ذلك يبلغهم فلم يطيقوا بقاءه معهم مع ما يقول ولم يطق هو البقاء في أرضهم دون أن ينكر ما يرى من منكر ويؤدي أمانة العلم ويرضي ضميره أمام الحق غير مداهن ولا هياب فاضطر إلى الهجرة عن أرض المنكر فقدم فاس واستقبله سلطان العلماء وعالم السلاطين مولاي سليمان المشهور بسلفيته وسنيته لما رأى من بعد غوره في العلوم وشدة تمسكه بالسنة المحمدية مع ما يلوح على ظاهره المشرق المعنون باطنه المتحلي بصفات الكمال فاعتقده وأخذ عنه طريقه بعد ما شاهد من كراماته ما يبهر العقل وليس مولاي سليمان ممن يقعقع له بالشنان بل هو الجامع بين إمارة السيف والقلم الشديد على أهل الزيغ والبدعة ولما أعطاه أولا الدار المذكورة أبى الشيخ عنها فقال له مولاي سليمان إنها من أطيب ماله وبين له وجه ذلك فسكنها ومع ذلك كان يتصدق بكرائها كل شهر على المساكين كما في الإفادة . ” .إهـ .\nوينقل العدول الثقات رضي الله عنهم عن مولانا سليمان أنه ما أذعن للشيخ التجاني إلا بعد أن وقف على حقيقة الشيخ رضي الله عنه ورأى بعيني رأسه رضي الله عنه ما اطمأن له وبه فؤاده وتحَققِهِ مِنْ أن الشيخ التجاني يرى النبي صلى الله عليه وسلم غير مكترث بأقوال الحاسدين المنكرين عن الشيخ رضي الله عنه والذين سرعان ما انطفأت شعلة بغضهم وإنكارهم ورغما عن أنوفهم حتى أن بعض المنكرين المتأخرين أهل التدليس والتلبيس الذين يتكلم على ألسنتهم إبليس تعجب من سكوت علماء المغرب عن الإنكار على الشيخ التجاني رضي الله عنه .\nوفيه يقول صاحب رشق السهام : ” وأنا أقول لم يسكتوا فقط وإنما أثنى عليه فضلاؤهم وترجموا عنه التراجم الحافلة بالثناء اللائق بمقامه الرفيع القدر وتقيد بعضهم بطريقه وليس هذا خاصا بعلماء المغرب بل أثنى عليه علماء تونس والجزائر ومصر والسودان وشنقيط (موريتانيا) وأخذ بعضهم طريقه وعلماء إفريقيا السوداء وهم الذين نشروا الدعوة الإسلامية بواسطة طريقه وإرشاداته ومازالوا ينشرونها في تلك البلاد كما هو معلوم وهب العلماء سكتوا عن الإنكار على شيخنا أفلا يسع الجاهل ما وسع العلماء . “إهـ .\nومن بين هؤلاء الأعلام الثقات رضي الله عنهم الذين نقلوا إلينا أن الشيخ التجاني رضي الله عنه كان يرى النبي صلى الله عليه وسلم يقظة العالم العلامة القاضي سيدي أحمد سكيرج في كتابه كشف الحجاب عند ذكره لترجمة مولانا السلطان سليمان رضي الله عنه فقال : ” وقد بلغني على لسان الثقة أنه كان كثيرا ما يطلب من الشيخ رضي الله عنه أن يريه النبي في اليقظة وسيدنا رضي الله عنه يقول له:” أخاف عليك أن لا تقدر على ذلك .” وهو حريص على ذلك ومقصود صاحب الترجمة بذلك أمران أولهما والمهم عنده أن يسمع منه بأنه من أولاده الحقيقيين كما أخبره بذلك سيدنا رضي الله عنه ، الثاني أن يتيقن بأن جميع ما يخبر به سيدنا رضي الله عنه حق لا ريب فيه فتطمئن نفسه بذلك ، فلا يلتفت بعد ذلك لقول أعاديه فلما اشتد طلبه لذلك من سيدنا رضي الله عنه ولم تفد في رده عن هذا المطلب حيلة أجابه سيدنا رضي الله عنه لبغيته وأوصاه أن يكتم سره عن كل أحد وليجعل محلا طاهرا طيبا فارغا من جميع الأمور من فرش وغيره يعده مخصوصا لذلك وأن يكون وحده في ذلك الموضع فاستعمل ذلك كله ولما أراد الدخول إلى ذلك المحل حصلت له هيبة عظيمة لم يقدر على الجلوس به وحده لذكر ما لقنه من الأذكار الخصوصية لذلك فلم يكمل العمل من كثرة ما حصل له من الدهشة.\nوسمعت من بعض الإخوان أنه طلب من سيدنا رضي الله عنه الحضور معه بنفسه لذلك فأجابه لمرغوبه وحضر معه في ذلك المحل فبينما هما يذكران إذ أشرق المحل الذي هما فيه وامتلأ بالأنوار المحمدية فحصل الدهش لصاحب الترجمة لما رأى ذلك وغاب عن حسه وبعد ساعة أفاق من غيبته فوجد يد سيدنا رضي الله عنه على صدره فلما فتح عينيه قال له سيدنا رضي الله عنه:” لا بأس عليك.” فقال له صاحب الترجمة:” جازاك الله خيرا ولقد قلت لي لا أقدر على ذلك وأنا أتهم نفسي حتى رأيت ذلك بالعيان . ” إهـ .\nومن خلال هذه الترجمة نستشف أن عالم السلاطين أبو الربيع السلطان مولانا سليمان قد ناب عن أمثال أخينا السائل وبرهن أن الشيخ التجاني رضي الله عنه رأى فعلا وصدقا مولانا رسول الله صلى الله عليه وسلم يقظة.\nو جاء في الإفادة الأحمدية لسيدي الطيب السفياني أن الشيخ التجاني رضي الله عنه قال : ” طريقتنا طريقة محض الفضل أعطاها لي صلى الله عليه وسلم منه إلي من غير واسطة يقظة لا مناما .” إهـ .\nلتتوالى النقول عن الأعلام الثقات العدول من مختلف البلدان الإسلامية برواية هذه المنقبة العظيمة عنه رضي الله عنه دون نكير ولا اعتراض اللهم ما كان ممن ينكرون رؤية رسول الله صلى الله عليه وسلم يقظة بالجملة وهم الشواذ في هذه الأمة المحمدية التي اجتمع نبيها بالأنبياء جميعهم وصلى بهم ببيت المقدس عند حادثة الإسراء والمعراج وهؤلاء شرذمة لايعبء بهم.\nورؤية النبي صلى الله عليه وسلم مما ثبت عن صناديد الأولياء والعلماء العاملين ولمن أراد الوقوف عن أولئك الذين ثبتت عنهم رؤيته صلى الله عليه وسلم فعليه بكتاب معجم من رأى رسول الله في النوم واليقظة تأليف سيدي محيي الدين الطعمي .\nوإليك ما يزيد تأكيدا على أن الشيخ رضي الله عنه كان ممن يأخذ عن النبي صلى الله عليه وسلم يقظة أن عددا من تلاميذ ته السالكين لنهجه ومنهاجه الصادقين في اعتماد توجيهاته وإرشاداته كانوا يصرحون برؤيتهم للنبي صلى الله عليه وسلم فما بالك بشيخهم رضي الله عنهم جميعا ورزقنا الصدق معهم وفيهم آمين.\nو كنموذج للتقريب: ما ذكره الشيخ سيدي أحمد سكيرج في كتابه كشف الحجاب أن سيدي الحاج عبد الوهاب بن الأحمر كان ممن يجلس في الصف الأول من الزاوية المباركة قرب المحراب الشريف وكان كثيرا ما يذكر في ذلك الموضع بعد وفاة سيدنا رضي الله عنه (يعني سيدي أحمد التجاني ) فبينما هو يذكر يوما إذ رأى سيدنا رضي الله عنه خرج من قبره وأتى إليه وقال له قم فقام معه وخطا به خطوتين أو ثلاث فإذا هو بالنبي صلى الله عليه وسلم ثم قال له سيدنا رضي الله عنه :”ها أنت ونبيك ! ” فصار يقبل يديه صلى الله عليه وسلم ويبكي بين يديه ثم أفاق من غيبته فوجد نفسه جالسا بموضعه .\nومما ذكره أيضا أنه حدثه سيدي أحمد العبدلاوي أن سيدي محمد بن العربي التازي الدمراوي كان في اليوم يجتمع بالنبي صلى الله عليه وسلم أربعا وعشرين مرة وصرح له سيد الوجود صلى الله عليه وسلم بأن قال له:” لولا محبتك في التجاني ما رأيتني قط .” .\nومما ذكره العارف بالله سيدي العربي بن السائح نقلا من كشف الحجاب أن القطب سيدي الحاج علي التماسيني رضي الله عنه قال :”إن من الرجال من لا يفعل فعلا قل أو جل إلا على إذن منه صلى الله عليه وسلم من طريق المكاشفة والعيان حتى إنه لا يقوم لفراشه الذي ينام فيه إلا إذا أمره صلى الله عليه وسلم بذلك .” .\nوقد فهم عنه من سمع ذلك أنه يعني نفسه. إهـ .\nوقال العارف بالله سيدي محمد الحافظ المصري في كتابه أصفى مناهل الصفا في مشرب خاتم الأولياء وسيد الأصفياء :” وقد اتفق العارفون طرا على تصديق الولي فيما يصرح به عن مقامه على ظاهره ما لم يكن ثم ما يصرفه عن الظاهر . ” وقال في نفس الكتاب أيضا ص23:” والمشايخ رضوان الله عليهم لا يأخذون أورادهم إلا عن النبي صلى الله عليه وسلم وهو الذي يشترط ما يلزم من الشروط عليه الصلاة والسلام. “إهـ."}, {"q": "هل التبرك بقبر الرسول صلى الله عليه و سلم أو بقبور الأولياء هو شرك ؟", "a": "قال ابن حجر في فتح الباري شرح صحيح البخاري :\n” باب ماجاء في قبر النبي صلى الله عليه وسلم وأبي بكر وعمر رضي الله عنهما في حديث استئذان سيدنا عمر أمنا عائشة رضي الله عنها في الدفن بالحجرة النبوية :وفيه الحرص على مجاورة الصالحين في القبور طمعا في إصابة الرحمة إذا نزلت عليهم وفي دعاء من يزورهم من أهل الخير. ”\nوفي عمدة القاري بشرح صحيح البخاري للعيني مانصه:\n“وقال( يعني شيخه زين الدين ) وأخبرني الحافظ أبو سعيد ابن العلائي قال: رأيت في كلام أحمد بن حنبل من جزء قديم عليه خط ابن ناصر وغيره من الحفاظ أن الإمام أحمد سئل عن تقبيل قبر النبي صلى الله عليه وسلم وتقبيل منبره فقال لابأس بذلك قال فأريناه للشيخ تقي الدين ابن تيمية فصار يتعجب من ذلك ويقول عجبت أحمد عندي جليل يقوله وهذا استفهام إنكاري أي أيقوله وقال زين الدين وأي عجب في ذلك وقد روينا عن الإمام أحمد أنه غسل قميصا للشافعي وشرب الماء الذي غسله به إلى أن قال المحب الطبري يمكن أن يستنبط من تقبيل الحجر واستلام الأركان جواز تقبيل مافي تقبيله تعظيم الله تعالى.”\nوفي كشاف القناع عن متن الإقناع للإمام البهوتي الحنبلي عن عبد الله بن الإمام احمد بن حنبل قال:” سألت أبي عن مس الرجل رمانة المنبر يقصد التبرك وكذلك عن مس القبر” فقال:” لابأس بذلك.”\n\nوقال الذهبي في سير أعلام النبلاء :” أين المتنطع المنكر على أحمد وقد ثبت أن عبد الله سأل أباه عمن يلمس رمانة منبر النبي ويمس الحجرة النبوية فقال:” لاأرى بذلك بأسا .” وختم الذهبي كلامه بقوله:” أعاذنا الله وإياكم من رأي الخوارج ومن البدع. ”\nوفي خلاصة الوفا مانصه وفي كتاب العلل والسؤالات لعبد الله ابن أحمد ابن حنبل قال :” سألت أبي عن الرجل يمس قبر النبي صلى الله عليه وسلم يتبرك بمسه وتقبيله ويفعل بالمنبر مثل ذلك رجاء ثواب الله تعالى.” فقال:” لابأس به.”\nوقال صاحب غاية المنتهى الشيخ مرعي بن يوسف الحنبلي مانصه:\n“ولابأس بلمس قبر بيد لاسيما من ترجى بركته. ”\nوروى ابن عساكر بسند جيد عن أبي الدرداء رضي الله عنه قصة نزول بلال بن رباح بداري بعد فتح عمر رضي الله عنه بيت المقدس قال :” ثم إن بلالا رأى النبي صلى الله عليه وسلم وهو يقول له:” ماهذه الجفوة يابلال ؟ أما آن لك أن تزورني!” فانتبه حزينا خائفا فركب راحلته وقصد المدينة فأتى قبر رسول الله صلى الله عليه وسلم فجعل يبكي عنده ومرغ وجهه عليه. “\nوقال الحافظ تقي الدين السبكي في كتابه شفاء السقام في زيارة خير الأنام:” وممن روي ذلك عنه من الصحابة بلال بن رباح مؤذن رسول الله صلى الله عليه وسلم سافر من الشام إلى المدينة لزيارة قبره صلى الله عليه وسلم روينا ذلك بإسناد جيد إليه .”\nوفي تحفة ابن عساكر عن علي رضي الله عنه قال:” لما رمس رسول الله صلى الله عليه وسلم جاءت فاطمة رضي الله عنها فوقفت على قبره وأخذت قبضة من تراب القبر ووضعتها على عينها وبكت وأنشأت تقول :\nماذا على من شم تربة أحمد * أن لايشم مدى الزمان غواليا\nصبت علي مصائب لو أنها * صبت على الأيام عدن لياليا . “\nوروى الإمام أحمد في المسند أن مروان أقبل يوما فوجد رجلا واضعا وجهه على القبر فقال:” أتدري ما تصنع؟ ” فأقبل عليه فإذا هو أبو أيوب فقال:” نعم ! جئت رسول الله صلى الله عليه وسلم ولم آت الحجر! سمعت رسول الله يقول:” لا تبكوا على الدين إذا وليه أهله ولكن ابكوا عليه إذا وليه غير أهله.”\nوأخرجه من هذا الوجه الحاكم في المستدرك وقال صحيح الإسناد ولم يخرجاه وأقره الذهبي في التلخيص .\nوذكر القرطبي في تفسيره عند قوله تعالى:”{ ولو أنهم إذ ظلموا أنفسهم جاؤوك…} الآية روى عن علي قال:” قدم علينا أعرابي بعدما دفنا رسول الله صلى الله عليه وسلم بثلاث أيام فرمى بنفسه على قبر رسول الله صلى الله عليه وسلم وحثا على رأسه من ترابه فقال:” قلت يارسول الله فسمعنا قولك ووعيت عن الله فوعينا عنك وكان فيما أنزل الله عليك {ولو أنهم ظلموا أنفسهم …..}الآية وقد ظلمت نفسي وجئتك تستغفر لي فنودي من القبر :” أنه قد غفر لك !”\nوقال النووي في كتابه الأذكار باب مايقول زائر القبور :” ويستحب الإكثار من الزيارة وأن يكثر الوقوف عند قبور أهل الخير والفضل . ”\nوقال ابن الحاج المالكي في المدخل:” وينبغي لولي الميت أن يختار له الدفن عند العلماء والأولياء والصالحين للتبرك بهم لما ورد هم القوم لايشقى بهم جليسهم. والتبرك عمل لايخدش في التوحيد لامن قريب ولامن بعيد إذ التبرك بالآثار والمقامات مما أجازه الشرع الحنيف فما أجازه الشرع فلا خوف علينا منه فالتبرك بالأشخاص مثلا فلاعتقاد تقواها وصلاح عملها وقربها من الله سبحانه وتعالى مع الجزم بأن لامؤثر إلا الله قال تعالى { كلما دخل عليها زكرياء المحراب وجد عندها رزقا قال يامريم أنى لك هذا قالت هو من عند الله إن الله يرزق من يشاء بغير حساب هنالك دعا زكرياء ربه }.و أما الآثار فلأنها أجزاء منسوبة إلى تلك الأشخاص قال تعالى:{ اذهبوا بقميصي هذا فالقوه على وجه أبي يأت بصيرا}. فهي في حكم أصحابها . وأما الأمكنة فلا فضل لها لذاتها من حيث هي أمكنة وإنما من أجل ساكنها قال تعالى:{واتخذوا من مقام إبراهيم مصلى}. ولما يعمل فيها من خير وبر إذ تتنزل فيها الرحمات وتحضرها الملائكة وتغشاها السكينة فتتحقق عندها البركة التي تطلب من الله عندها.”\nوإليك أيها السائل الكريم بعض أقوال العلماء بل أعلام العلماء في التبرك بالقبور.\nقال الحافظ ابن حجر في تهذيب التهذيب قال الحاكم (صاحب المستدرك) في تاريخ نيسابور:” سمعت أبا بكر محمد بن المؤمل يقول خرجنا مع إمام أهل الحديث أبي بكر بن خزيمة مع جماعة من مشايخنا وهم إذ ذاك متوافرون إلى زيارة قبر علي بن موسى الرضى بطوس قال فرأيت من تعظيمه يعني ابن خزيمة لتلك البقعة وتواضعه لها وتضرعه عندها ماتحيرنا .”\nوبه يتبين أن إمام الأئمة ابن خزيمة كان يتضرع ويعظم قبور الصالحين. وروى الخطيب البغدادي عن إبراهيم الحربي أحد أئمة الحديث أنه قال:” قبر معروف (يعني الكرخي) الترياق المجرب.”\nوروى أيضا عن المحاملي أحد أئمة الحديث أنه قال:” أعرف قبر معروف الكرخي منذ سبعين سنة ماقصده مهموم إلا فرج الله همه . ”\nقال الذهبي في سير اعلام النبلاء وعن إبراهيم الحربي قال:” قبر معروف الترياق المجرب.” يريد إجابة دعاء المضطر عنده لأن البقاع المباركة يستجاب عندها الدعاء.\nوقال ابن حبان في الثقات في ترجمة علي بن موسى الرضا :”وقبره بسنا باذ خارج النوقان مشهور يزار بجنب قبر الرشيد قد زرته مرارا كثيرة وما حلت بي شدة في وقت مقامي بطوس فزرت قبر علي بن موسى الرضا صلوات الله على جده وعليه ودعوت الله إزالتها عني إلا استجيب لي وزالت عني تلك الشدة وهذا شيء جربته مرارا فوجدته كذلك. ”\nوقال الحافظ أبو بكر ابن المقرئ في مسند أصبهان :” كنت أنا والطبراني وأبو الشيخ في مدينة النبي صلى الله عليه وسلم فضاق بنا الوقت فوصلنا ذلك اليوم فلما كان وقت العشاء أتيت إلى القبر الشريف وقلت:” يارسول الله الجوع !” فقال لي الطبراني:” اجلس فإما أن يكون الرزق أو الموت !” فقمت أنا وأبو الشيخ فحضر الباب علوي ففتحنا له فإذا معه غلامان بزنبيلين بهما شيء كثير فقال:” ياقوم شكيتم إلى النبي صلى الله عليه وسلم فإني رأيته ؛ فأمرني بحمل شيء إليكم.” ونقل هذه الحادثة الحافظ السخاوي في القول البديع وابن المقري والطبراني وأبو الشيخ كلهم من كبار الحفاظ المشهورين .\nوقال اللالكائي في كتابه شرح أصول اعتقاد أهل السنة والجماعة :” فحياتهم للخلق منبهة ومسيرهم إلى مصيرهم لمن بعدهم عبرة وقبورهم مزارة.” إلى أن قال:” يزارون في قبورهم كأنهم أحياء في بيوتهم لينشر الله لهم بعد موتهم الأعلام.” واللالكائي عند أصحابه بمكانة عظيمة حتى قال فيه ابن القيم في نونيته :\nأعني الفقيه الشافعي اللالكائي * المسدد ناصـــــر الإيمان.\nوفيما ذكرت كفاية لمن أراد الرجوع عن تكفير الأمة وجعل علمائها وعوامها من المشركين."}, {"q": "لقد فُسر لي أن الرسول صلى الله عليه و سلم كان واضحا في تأكيد أن كل محدثة ضلالة, فما بال من يناقض بقول أنه يوجد أيضا بدع حسنة ؟ ما قولكم", "a": "اعلم وفقني الله وإياك إلى ما يحب ويرضى أن النبي صلى الله عليه وسلم في الحديث المشهور الصحيح الذي قال فيه :” فإنه من يعش منكم بعدي فسيرى اختلافا كثيرا فعليكم بسنتي وسنة الخلفاء المهديين الراشدين تمسكوا بها وعضوا عليها بالنواجذ وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة “.\nقد أرشدنا إلى العمل بسنة الخلفاء الراشدين وقد ثبت بالحديث الصحيح الذي رواه البخاري أن سيدنا عمر ابن الخطاب رضي الله عنه ثاني الخلفاء الراشدين قال :”نعمت البدعة هذه” فثبت والحمد لله أن إطلاق مفهوم البدعة الحسنة جائز وأن القائلين بأن ليس َثم بدعة حسنة كلامهم مردود وقولهم هذا من البدعة الضلالة كيف لا والنبي صلى الله عليه وسلم يأمرنا بأن نقتدي بالخلفاء الراشدين وهم أفهم الناس لكلام الله ورسوله من غيرهم وأخشى لله وأطوعَ له وهؤلاء القوم ُيلبسون علينا أن لا َثم بدعة حسنة وقائل هذا الكلام والعياذ بالله إنما هوإنكارعلى الخليفة الراشد عمر ابن الخطاب رضي الله عنه وردٌ لكلامه وفي رد كلامه رد لأمر رسول الله صلى الله عليه وسلم الذي أمرنا بالأخذ بسنة خلفائه الراشدين وعمر منهم ، فأي الفريقين أحق بالإتباع ؟ من أمرنا الرسول الأعظم صلى الله عليه وسلم بالاقتداء بهم أو من يأمرنا بعدم الاقتداء بمن أمرنا رسول الله صلى الله عليه وسلم بالاقتداء بهم.\nوالقائلين بعدم تقسيم البدعة رغم جحودهم وتعنتهم إلا أنهم قسموا البدعة رغما عنهم وجعلوها باسم آخر وهو المصلحة ، ولتقريب هذا المعنى سأضرب مثلا من كتاب الاعتصام للشاطبي باعتباره رأس القائلين بعدم التقسيم وكل من تحدث بهذا الرأي إنما ينهل منه ويدور في فلكه لايعدوه .\nففي القصة المبسوطة في صحيح البخاري( باب يستحب للكاتب أن يكون أمينا عاقلا) أشار سيدنا عمر ابن الخطاب رضي الله عنه على سيدنا أبو بكر الصديق رضي الله عنه بجمع القرآن في صحف حين كثر القتل بين الصحابة في وقعة اليمامة فتوقف أبو بكر وقال:” كيف نفعل شيئا لم يفعله رسول الله صلى الله عليه وسلم؟”\nفقال له عمر:” هو والله خير.” فلم يزل عمر يراجعه حتى شرح الله صدره له وبعث إلى زيد ابن ثابت رضي الله عنه فكلفه بتتبع القرآن وجمعه قال زيد:” فوالله لو كلفوني نقل جبل من الجبال ما كان أثقل علي مما كلفني به من جمع القرآن.” قال زيد:” كيف تفعلون شيئا لم يفعله رسول الله صلى الله عليه وسلم.” قال:” هو والله خير” فلم يزل أبو بكر يراجعني حتى شرح الله صدري للذي شرح له صدر أبي بكر وعمر رضي الله عنهما .\nفقول أبي بكر وعمر:” هو والله خير” يؤيد أن النبي صلى الله عليه وسلم لم يفعل جميع المندوبات أو جميع ماهو خير وجمع القرآن كان واجبا على المسلمين مع أنه بدعة ليحفظ من الضياع فألهم الله عمر بفعل هذه البدعة الواجبة لما فيها من خير كبير للإسلام والمسلمين . قال عبد الله ابن الصديق في إتقان الصنعة في تحقيق معنى البدعة :” وقد اعترف الشاطبي بهذا العمل وأنه واجب وسماه مصلحة وأبى أن يسميه بدعة.” إهـ\nقال في الاعتصام إثر هذه القصة :” ولم يرد نص عن النبي صلى الله عليه وسلم بما صنعوا من ذلك ولكن رأوه مصلحة تناسب تصرفات الشرع قطعا .”\nولا يدري رحمه الله ولا من قلده أن هذا هو عين ما أجمعت عليه الأمة في التعريف بالبدعة وإنما أتعب نفسه في كتابه الاعتصام بما لا طائل وراءه والمتمعن في كتابه هذا يجده يعرف البدعة في مجمل كلامه على أنها الزيادة على الشرع والمسلمين قاطبة لم يقل أحد منهم بالزيادة في الدين والزيادة في الدين أمر مردود بالإجماع ، والذين قسموا البدعة إلى مذمومة ومحمودة إنما مراعاة لأصول الدين فالمحمودة منها ما شهدت أصول الدين لها كما بين هو أن العمل الذي أحدثه هؤلاء الصحابة في جمع القرآن يناسب تصرفات الشرع وإن لم يرد نص يدل عليه ولكن عموميات الشرع تشهد بجواز هذا الفعل.\nأما المذمومة منها فهي التي تشهد أصول الدين أيضا لها بعدم جوازها لا أقل ولا أكثر.\nوهذا نموذج من كلام من رد التقسيم قال صاحب أصول الفقه على منهج أهل الحديث زكريا ابن غلام قادر الباكستاني :” ليس في الشرع بدعة حسنة بل كل بدعة هي ضلالة عن العرباض بن سارية عن النبي صلى الله عليه وسلم أنه قال:” إياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة وكل ضلالة في النار .” هذا الحديث يدل على أنه ليس في الشرع بدعة حسنة بل كل بدعة ضلالة وهذا ما فهمه الصحابة فقد قال عبد الله ابن عمر:” كل بدعة ضلالة وإن رآها الناس حسنة.” أخرجه اللالكائي بإسناد صحيح ومنه تعلم أن تقسيم بعض أهل العلم البدعة إلى خمسة أقسام واجبة ومندوبة ومحرمة ومكروهة ومباحة تقسيم ليس بصحيح لمخالفته للأحاديث ولفهم السلف الصالح.” إهـ\nوحسبنا في رد هذا الكلام ما مر معنا من كلام الخليفة الراشد عمر ابن الخطاب نعمت البدعة وما ورد عن ابنه عبد الله رضي الله عنهما الذي استشهد به في جعل كل بدعة ضلالة وإن حسنها الناس أنه جاء عنه فيما رواه ابن أبي شيبة في مصنفه والطبراني في الكبير عن الأعرج قال : سألت ابن عمر عن صلاة الضحى فقال:” بدعة ونعمت البدعة .” ورواه أيضا البخاري في تاريخه الكبير، والأمة المحمدية لما قسمت البدعة إنما استنادا لأصول الشرع الحنيف لا اعتمادا على تحسين الناس ، وما ثبت أيضا في مصنف ابن أبي شيبة في باب كتاب الأذان والإقامة (في التثويب في أي صلاة هو) عن عبد الرحمان بن أبي ليلى قال :” ما ابتدعوا بدعة أحب إلي من التثويب في الصلاة يعني العشاء والفجر،وما نقله السيوطي في كتابه الأمر بالإتباع والنهي عن الابتداع عن الحسن قال :” القصص بدعة ونعمت البدعة كم من أخ يستفيد ودعوة تستجاب.”، هذا هو فهم السلف الصالح الصحيح ثناءٌ وتَحْسِينٌ للمحدثة إن كانت الشريعة تشهد لها الذي لا يسعنا إلا الرجوع إليه لا تأويلات واستدلالات هؤلاء المانعين عفا الله عنا وعنهم أما أهل العلم الذين نبزهم بالبعض سأختم إنشاء الله هذه السطور بكلامهم ِلنَسْتبينَ أَهُمْ بعضُ أهل العلم أم هُم أكابرُ علماءِ هذه الأمة وحُماة دِينها.\nقال الدكتور عمر عبد الله كامل في سلسلته مفاهيم يجب أن تصحح المفهوم العاشر (البدعة) :” وقد تطرف البعض وجعل كل محدث (وهو الأمر المبتدأ من غير مثال) من أعمال الخير والطاعات لم يكن في عهده صلى الله عليه وسلم ولا في القرون الثلاثة أنه بدعة ضلالة وأنكروا على الفقهاء تقسيمهم للبدعة إلى مقبولة ومردودة أو إلى حسنة وسيئة مستدلين على إنكارهم للتقسيم بما رواه مسلم عن جابر رضي الله عنه أن رسول الله صلى الله عليه وسلم قال في خطبة له :”وشر الأمور محدثاتها وكل محدثة بدعة وكل بدعة ضلالة.” وقد تناسى هؤلاء المنكرون للتقسيم أن رسول الله صلى الله عليه وسلم هو الذي قسم المحدث إلى مقبول ومردود فيما رواه مسلم عن جرير رضي الله عنه وابن ماجة عن أبي جحيفة أنه قال صلى الله عليه وسلم :” من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها من بعده إلى يوم القيامة من غير أن ينقص من أجورهم شيء ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده من غير أن ينقص من أوزارهم شيء”.\nففي هذا الحديث تقسيم للأمر المبتدأ من غير مثال إلى مردود ومقبول وهو يشرع ابتداء الخير في أي عصر ….\nويكفي أن يكون رسول الله صلى الله عليه وسلم هو البادئ بالتقسيم القائل في التقسيم من سن سنة حسنة ومن سن سنة سيئة ، فالتهويش الوارد في حديث كل محدثة بدعة وكل بدعة ضلالة هو من باب تضليل الناس بأن الحديث وارد في البدعة مطلقا لصرف نظرهم عن استعمالها في الحديث بالاستعمال الشرعي الذي يطلق شرعا على ما يصادم أصول التشريع ، ومن سمى المقْبولَ من البدعة اللغوية سنة حسنة فبرسول الله صلى الله عليه وسلم اقتدى في التسمية.\nولقد حاول البعض التخلص مما تضمنه حديث من سن سنة حسنة ومن سن سنة سيئة من تقسيم البدعة ففسر الحديث بما لا ينطبق على ألفاظه فزعم أن المراد من الحديث من أحيا سنة مهجورة بينما ألفاظ الحديث واضحة في الحث على إنشاء سنن الخير وهناك أحاديث تحث على إحياء السنن المهجورة وفرق بين إنشاء سنن الخير وبين إحياء السنن المهجورة. إهـ\nقال الإمام النووي في شرحه على مسلم : “من سن في الإسلام سنة حسنة فله أجرها إلى آخره فيه الحث على الابتداء بالخيرات وسن السنن الحسنات والتحذير من اختراع الأباطيل والمستقبحات …وفي هذا الحديث تخصيص قوله صلى الله عليه وسلم كل محدثة بدعة وكل بدعة ضلالة وأن المراد به المحدثات الباطلة والبدع المذمومة.”\nوقال السندي في حاشيته على ابن ماجة:” قوله:” سنة حسنة ” أي طريقة مرضية يقتدي بها والتمييز بين الحسنة والسيئة بموافقة أصول الشرع وعدمها.”\nوقال صاحب التحفة: من سن سنة خير وفي رواية مسلم من سن في الإسلام سنة حسنة أي طريقة مرضية يشهد لها أصل من أصول الدين …ومن سن في الإسلام سنة سيئة أي طريقة غير مرضية لا يشهد لها أصل من أصول الدين. وإذا تأملت الحديث المذكور علمت بأنه صلى الله عليه وسلم قد أجاز لنا ابتداع ماهو حسن وسماه سنة وجعل فيه الأجر للذي ابتدعه أولا ولمن عمل به إلى يوم القيامة ثانيا ولا يسمى المحدث بدعة حتى يخالف صريح الكتاب والسنة فمتى وافقهما فهو سنة حسنة يكون لمبتدعه أجره وأجر من عمل به إلى يوم القيامة.\n(طريفة) ـ قال الشيخ محمد الحافظ المصري في كتابه أهل الحق العارفون بالله : وقد زارنا رجل من الصالحين من شنقيط وكان دائم التلاوة لكتاب الله عز وجل وزار عالما ينكر على الطريقة (التجانية) فقال له:” يا فلان أنت رجل عالم وصالح فلم لم تكتف بكتاب الله ؟ ودعك من أوراد الطريقة.” فقال له:” وأنت عالم أيضا وهل أوراد الطريقة إلا كتاب الله أو ما أمر به كتاب الله ؟ فلفظ الجلالة لا إله إلا الله هو أفضل ما في كتاب الله وهي ذكر وقرآن في آن واحد والاستغفار أمر به الكتاب والصلاة على النبي صلى الله عليه وسلم أمر بها الكتاب وما شغلنا ذلك عن كتاب الله ولا سنة رسول الله صلى الله عليه وسلم ولله الحمد.”\nفقال له:” ولِمَ لَمْ تأخذ أنت ذلك من كتاب الله والسنة مباشرة فتنتقي لنفسك ما شئت من الذكر والدعاء ؟” فقال له:” وماذا علي أن آخذ عمن أخذ عن الكتاب والسنة فيكون له أجر الدلالة على الخير ولي أجر العمل ولن ينقص من أجري شيئا ؟ ولم يفرض ذلك علي وإنما أنا الذي أعجبني اختياره ووثقت به في علمه وعمله وهل بك الحسد أن يعطي الله الشيخ أجر التعليم والدلالة على الخير؟” فقال له :” صدقت وليس في أوراد الطريقة(التجانية) إلا ما أذن فيه الله ورسوله صلى الله عليه وسلم وما خالف ذلك فالشيوخ ومن تبعهم منه بريئون قال تعالى : “وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان. ”\nوحديث من سن في الإسلام سنة حسنة لهو أقوى دليل على أن البدعة إذا كانت حسنة فهي داخلة في عموم الشريعة المحمدية وإنكارها هو البدعة المحرمة ونحن والحمد لله ضد البدع المخالفة للكتاب والسنة وضد الأوهام والخرافات الباطلة أيا كان مصدرها نسعى إلى محقها والقضاء عليها بكل ما أوتينا من حول وقوة ولكننا في نفس الوقت نرى وجوب التمييز بين المحدثات الحسنة والمحدثات المذمومة لنسمي الأولى سنة كما في الحديث من سن في الإسلام سنة حسنة ونسمي الثانية بدعة كما في الحديث كل بدعة ضلالة وحديث من سن في الإسلام سنة… الخ لا يعارضه البتة حديث أم المؤمنين رضي الله عنها الذي رواه الشيخان قالت:” قال رسول الله صلى الله عليه وسلم:” من أحدث في أمرنا هذا ما ليس منه فهو رد.” وفي رواية لمسلم :”من عمل عملا ليس عليه أمرنا فهو رد.” وفي بعض ألفاظه ” من أحدث في ديننا ما ليس منه فهو رد.”، كما يردد الكثير من المتمسكين بعدم التقسيم فقد قال الحافظ ابن حجر في الفتح:” هذا الحديث معدود في أصول الإسلام وقاعدة من قواعده فإن معناه من اخترع في الدين ما لا يشهد له أصل من أصوله فلا يُلتفت إليه.” ، وقال ابن رجب الحنبلي:” هذا الحديث يدل بمنطوقه على أن كل عمل ليس عليه أمر الشارع فهو مردود ويدل على أن كل عمل عليه أمره فهو غير مردود.”\nأخرج البزار والحاكم وقال صحيح وأقره الذهبي وقال الهيثمي في مجمع الزوائد إسناده حسن ورواته موثقون عن أبي الدرداء قال النبي صلى الله عليه وسلم:” ما أحل الله في كتابه فهو حلال وما حرم فهو حرام وما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئا ثم تلا هذه الآية وما كان ربك نسيا.”\nقال تقي الدين الهلالي في كتيبه الحسام الماحق لكل مشرك ومنافق :” لو أن المبتدعين تأملوا هذا الحديث وأخلصوا لله لم يبتدعوا في دين الله ولكن طبع الله على قلوبهم وأصمهم وأعمى أبصارهم والمقصود هنا أن كل شيء لم ينص الكتاب والسنة على تحريمه ولا على تحليله فقد عفا الله عنه وهو مباح .”إهـ\nولم يدري أنه هو الأولى بالتأمل في هذا الحديث إذ لا أحد من المسلمين يجرؤ على مناقشة القسمين الأولين فالحلال حلال والحرام حرام أما المباح فهو القسم الذي يختلف فيه الناس وهذا القسم هو الذي أنكروا فيه هم على المسلمين باسم البدعة وشنعوا عليهم والحديث يشهد بأنه عافية من الله .\nفتأمل معي أخي أن أحدا من المسلمين بعدما صلى خَمْسَهُ على أحسن ما أمر به الشرع وبات ليله يصلي (النافلة) تقربا إلى الله أيحق لنا أن ننكر عليه قيامه ليله بالصلاة وأن نرميه بالبدعة بحجة أن النبي:( ما بات يومًا ُركوعْ سجودْ ركوعْ سجودْ حتى الفجر كما هو مشهور من كلامهم) هذا لا يقول به إلا الذين لا يقبلون من الله عافيته ، أو مسلم بات ليله يستغفر الله أو يصلي على رسول الله صلى الله عليه وسلم أيجوز لأحد أن يبدعه مع العلم أن رسول الله صلى الله عليه وسلم لم يثبت عنه ذلك لم يثبت عنه أنه قام ليله بالصلاة عليه صلى الله عليه وسلم ولكن عموميات الشرع تبيح ذلك وتشهد لصاحبه بالمصداقية ، فمن لا يقدر على قيام الليل بطوله وبركعات محدودة أو غير محدودة أو بأي نوع من أنواع التعبدات بالاستغفار أو التسبيح أو التهليل أو قراءة القرآن أو مُدارسة العلم إلى غير ذلك من أنواعها فلا ينكر على الذي يفعله.\nذكر الذهبي في سير أعلام النبلاء وغيره من أصحاب السير أن الإمام أحمد كان يصلي في كل يوم وليلة ثلاث مائة ركعة فلما مرض من تلك الأسواط أضعفته فكان يصلي كل يوم وليلة مائة وخمسين ركعة وفيه أيضا عن الأوزاعي أن علي ابن عبد الله ابن عباس كان يصلي في اليوم ألف سجدة وفيه أيضا أن علي ابن الحسين زين العابدين كان يصلي مثلها في كل ليلة وفيه أيضا أن الباقر كان يصلي في اليوم والليلة مائة وخمسين ركعة وفيه أيضا عن ابن سيرين أن تميما الداري كان يقرأ القرآن في ركعة وفيه أيضا أن تميم الداري صلى ليلة حتى أصبح أو كاد يقرأ آية يرددها ويبكي {أم حسب الذين اجترحوا السيئات أن نجعلهم كالذين آمنوا وعملوا الصالحات } وفيه أيضا أن عبد الرحمان ابن الأسود صلى يوم جمعة قبل الصلاة ستا وخمسين ركعة.\nقال أبو بكر بن العربي المعافري في كتابه القبس في شرح موطأ مالك بن أنس:” ليس لصلاة رمضان ولا غيرها تعديد إنما التعديد والتقدير للفرائض وإنما هو قيام الليل كله إلى طلوع الفجر لمن استطاع أو بعضه على قدر ما تنتهي إليه قدرته. وأحوال الصحابة والتابعين وأهل القرون الثلاثة المشهودِ لها بالخيرية في الصلاة والصيام وقراءة القران مشحونة بها كتب السير والتراجم لمن أراد التوسع في الاطلاع والمنكرون لهذه الخصائص والمناقب وهم كُثر لِضُعْفٍ في إيمانهم ولإسقاط أحوالهم على غيرهم وباحْتِكامِهم للوقت وخفي عليهم أن الذي عنده علمٌ من الكتاب أتى بعرش ملكة سبأ في أقل من ارتداد الطرف\nوالمباح باب واسع يأخذ كل واحد منا على قدر طاقته والمانع المحارب لذلك هو المبتدع على الحقيقة وعلته والله أعلم أنه لا يفعل ولا يريد من يفعل .روى ابن حبان في صحيحه عن عمران ابن حصين قال: قال رسول الله صلى الله عليه وسلم:” أخوف ما أخاف عليكم جدال المنافق عليم اللسان.”\n( معالجة) : ـ فإن قال قائل بأن الورد التجاني بدعة ليس من الدين لأن الدين قد تم قبل الشيخ التجاني لقوله تعالى:” اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا.” وقوله تعالى:” وأن هذا صراطي مستقيما فاتبعوه ولا تتبعوا السبل فتفرق بكم عن سبيله.” ويزعم أن هذا الورد من السبل المعنية في نص الآية .\nنقول :”هذا الدين الذي تم قبل الشيخ التجاني هل تم بلا استغفار والصلاة على النبي صلى الله عليه وسلم ولا إله إلا الله التي هي أركان الورد التجاني والتي عليها مداره وهي الأذكار التي يلتزمها كل تجاني أينما وجد فإن كان قد تم بدونها حكمنا على الورد التجاني بالضلال لأنه زاد على الدين الذي كمل واكتمل ما ليس منه وإن كانت هذه الثلاثة (الاستغفار والصلاة على النبي صلى الله عليه وسلم ولا إله إلا الله ) مما أمر به الدين ومما حث عليه ونطق بها الكتاب والسنة وكانت من الدين الذي اكتمل وهي كذلك نقول إذن بأن هذا الورد التجاني من الدين وبالتالي لا نلقي بالا لمن أنكره .\nوليطمئن من ينكر على أهل الله الصوفية باسم البدعة أن الشاطبي الذي أقام الدنيا وأقعدها في كتابه الاعتصام حول عدم تقسيم البدعة يقول فيهم في كتابه الموافقات:” ومن ههنا يفهم شأن المنقطعين إلى الله فيما امتازوا به من نحلتهم المعروفة(التصوف)فإن الذي يظهر لبادئ الرأي منهم أنهم التزموا أمورا لا توجد عند العامة ولاهي مما يلزمهم شرعا فيظن الظان أنهم شددوا على أنفسهم وتكلفوا ما لم يكلفوا ودخلوا على غير مدخل أهل الشريعة وحاشا لله ما كانوا ليفعلوا ذلك وقد بنوا نِحْلتهم على إتباع السنة وهم باتفاق أهل السنة صفوة الله من الخليقة.” إهـ\n\nوهذه جملة من التعريفات التي عرف بها العلماء البدعة وأوجه تقسيمها سائلا من الله سبحانه وتعالى أن يهدينا إلى الحق والصراط المستقيم:\n1ـ القرطبي في تفسيره عند قوله تعالى { بديع السماوات والأرض} قال :” كل بدعة صدرت من مخلوق فلا يخلو أن يكون لها أصل في الشرع أولا فإن كان لها أصل كانت واقعة تحت عموم ما ندب الله إليه وحض رسوله عليه فهي في حيز المدح وإن لم يكن الفاعل قد سبق إليه ويعضد هذا قول عمر رضي الله عنه نعمت البدعة هذه لما كانت من أفعال الخير وداخلة في حيز المدح وهي وإن كانت في خلاف ما أمر الله به ورسوله فهي في حيز الذم والإنكار قال معناه الخطابي وغيره قلت وهو معنى قوله صلى الله عليه وسلم في خطبته : وشر الأمور محدثاتها وكل محدثة بدعة وكل بدعة ضلالة يريد ما لم يوافق كتابا أو سنة أو عمل الصحابة رضي الله عنهم وقد بين هذا بقوله : من سن في الإسلام سنة حسنة كان له أجرها وأجر من عمل بها من بعده من غير أن ينقص من أجورهم شيء ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده من غير أن ينقص من أوزارهم شيء وهذا إشارة إلى ما ابتدع من قبيح وحسن وهو أصل هذا الباب وبالله العصمة والتوفيق لا رب غيره.”\n2ـ العلامة بدر الدين العيني في كتابه عمدة القاري شرح صحيح البخاري : “والبدعة في الأصل إحداث أمر لم يكن في زمن رسول الله صلى الله عليه وسلم ثم البدعة على نوعين إن كانت مما يندرج تحت مستحسن في الشرع فهي بدعة حسنة وإن كانت مما يندرج تحت مستقبح في الشرع فهي بدعة مستقبحة. ”\n3ـ ابن حجر العسقلاني في كتابه فتح الباري شرح صحيح البخاري:” والبدعة أصلها ما أحدث على غير مثال سابق وتطلق في الشرع في مقابل السنة فتكون مذمومة والتحقيق أنها إن كانت مما تندرج تحت مستحسن في الشرع فهي حسنة وإن كانت مما تندرج تحت مستقبح في الشرع فهي مستقبحة وإلا فهي من قسم المباح وقد تنقسم إلى الأحكام الخمسة. وقال في محل آخر قول عمر:” نعمت البدعة ” هو فعل ما لم يسبق إليه فما وافق السنة فحسن وما خالف فضلالة.”\n4ـ ابن بطال في شرحه على البخاري قال :” فالبدعة اختراع ما لم يكن قبلُ فما خالف السنة فهو بدعة ضلالة وما وافقها فهو بدعة هُدى. ”\n5ـ ابن رجب الحنبلي في كتابه جامع العلوم والحكم:” المراد بالبدعة ما أحدث مما لا أصل له في الشريعة يدل عليه وأما ما كان له أصل من الشرع يدل عليه فليس ببدعة وإن كان بدعة لغة…. فقوله صلى الله عليه وسلم كل بدعة ضلالة من جوامع الكلام يخرج عنه شيء وهو أصل عظيم من أصول الدين وهو شبيه بقوله صلى الله عليه وسلم: من أحدث في أمرنا ما ليس منه فهو رد، فكل من أحدث شيئا ونسبه إلى الدين ولم يكن له أصل من الدين يرجع إليه فهو ضلالة والدين بريء منه وسواء في ذلك مسائل الاعتقاد أو الأعمال أو الأقوال الظاهرة والباطنة ….قال الشافعي البدعة بدعتان بدعة محمودة وبدعة مذمومة فما وافق السنة فهو محمود وما خالف السنة فهو مذموم ….ومراد الشافعي رضي الله عنه ما ذكرناه من قبل وهو أن البدعة المذمومة ما ليس لها أصل في الشريعة ترجع إليه وهي البدعة في إطلاق الشرع وأما البدعة المحمودة فما وافق السنة وقد روي عن الشافعي كلام آخر يفسر هذا وهو أنه قال: والمحدثات ضربان ما أحدث مما يخالف كتابا أو سنة أو أثرا أو إجماعا فهذه هي بدعة الضلالة وما أحدث من الخير لا خلاف فيه لواحد من هذا وهذه محدثة غير مذمومة.” ( وكلام الشافعي هذا رواه البيهقي في كتابه :مناقب الشافعي)\n6ـ الحافظ ابن عبد البر في كتابه الاستذكار شرح الموطأ : ” فالبدعة في لسان العرب اختراع ما لم يكن وابتداؤه فما كان من ذلك في الدين خلافا للسنة التي مضى عليها العمل فتلك بدعة لا خير فيها وواجب ذمها والنهي عنها والأمر باجتنابها وهجران مبتدعها إذا تبين له سوء مذهبه وما كان من بدعة لا تخالف أصل الشريعة والسنة فتلك نعمت البدعة كما قال عمر لأن أصل ما فعله سنة. ”\n7ـ الإمام النووي في شرحه على صحيح مسلم: ” وكل بدعة ضلالة… مخصوص والمراد غالب البدع قال أهل اللغة هي كل شيء عمل على غير مثال سابق قال العلماء البدعة خمسة أقسام واجبة ومندوبة ومحرمة ومكروهة ومباحة…..وقد أوضحت المسألة بأدلتها المبسوطة في تهذيب الأسماء واللغات ….ولا يمنع من كون الحديث عاما مخصوصا قوله كل بدعة مؤكدا بكل بل يدخله التخصيص مع ذلك كقوله تعالى : ” تدمر كل شيء…“.” (ونقل السيوطي في الديباج شرح صحيح مسلم ابن الحجاج كلام النووي هذا في تقسيم البدعة كما نقله أيضا في شرحه لسنن النسائي)\n8ـ شرح الأربعين لإبن دقيق العيد : قوله:” وإياكم ومحدثات الأمور.” اعلم أن المحدث على قسمين محدث ليس له أصل في الشريعة فهذا باطل مذموم ومحدث بحمل النظير على النظير فهذا ليس بمذموم لأن لفظ المحدث ولفظ البدعة لا يذمان لمجرد الاسم بل لمعنى المخالفة للسنة والداعي للضلالة ولا يذم ذلك مطلقا.”\n9ـ عون المعبود شرح سنن أبي داوود للعظيم آبادي : ” قال المنذري:” والمحدث على قسمين محدث ليس له أصل إلا الشهرة (الشهوة) والعمل بالإرادة فهذا باطل وما كان على قواعد الأصول أو مردود إليها فليس ببدعة ولا ضلالة. ”\n10ـ حاشية السندي على النسائي :” قال :” محدثاتها يريد المحدثات التي ليس في الشريعة أصل يشهد لها بالصحة. “. ”\n11ـ المناوي في كتابه فيض القدير شرح الجامع الصغير :” من أحيا سنة من سنتي قد أميتت بعدي كان له من الأجر مثل من عمل بها من غير أن ينقص من أجورهم شيئا ومن ابتدع بدعة ضلالة (قال الأشرفي ُروي بالإضافة ويَصح نَصبُه نعتا ومنعوتا وفيه إشارة إلى أن بعض البدع غير ضلالة) وقال أيضا وشر الأمور محدثاتها التي لم يشهد لها أصل من أصول الشرع وقال أيضا المراد بالمحدث الذي هو بدعة وضلالة ما لا أصل له في الشرع …بخلاف محدث له أصل فيه . ”\n12ـ الطحاوي في حاشيته على المراقي: ” عند ذكر الصلاة على النبي صلى الله عليه وسلم بعد الأذان على المنارة قال: والصواب من الأقوال أنها بدعة حسنة. ”\n13ـ الألوسي في تفسيره روح المعاني قال:” وتفصيل الكلام في البدعة ما ذكره محي الدين النووي في شرحه صحيح مسلم قال العلماء:” البدعة خمسة أقسام واجبة ومندوبة ومحرمة ومكروهة ومباحة.”.”\n14ـ وفي: توضيح المقاصد وتصحيح القواعد في شرح قصيدة الإمام ابن القيم لأحمد ابن إبراهيم بن عيسى قال: عند قوله والكل بعد فبدعة أو فرية:” البدعة هي ما أحدث مما يخالف كتاب أو سنة.”\n15ـ أبو شامة في كتابه :” الباعث على إنكار البدع والحوادث: بعد ما ذكر تقسيم الشافعي للمحدثات قال : فالبدع الحسنة متفق على جواز فعلها والاستحباب لها ورجاء الثواب لمن حسنت نيته فيها وهي كل مبتدع موافق لقواعد الشريعة غير مخالف لشيء منها ولا يلزم من فعله محذور شرعي …..وأما المستقبحة فهي التي أردنا نفيها بهذا الكتاب وإنكارها وهي كل ما كان مخالفا للشريعة أو ملتزما لمخالفتها. ”\n16ـ وفي تحقيق الدكتور مصطفى ديب البغا على صحيح البخاري عند قول عمر رضي الله عنه نعم البدعة هذه قال:” نعم البدعة هذه ليدل على فضلها وأن من البدع ما هو مستحسن ومقبول إن كان يندرج تحت مستحسن في الشرع. ”\n17ـ التفتازاني في شرحه على المقاصد : “من الجهلة من يجعل كل أمر لم يكن في عهد الصحابة بدعة مذمومة وإن لم يقم دليل على قبحه تمسكا بقوله عليه السلام : إياكم ومحدثات الأمور ولا يعلمون أن المراد بذلك هو أن يجعل من الدين ما ليس منه.”\n18ـ ابن الأثير في النهاية قال:” البدعة بدعتان بدعة هدى وبدعة ضلالة فما كان في خلاف ما أمر الله به رسوله صلى الله عليه وسلم فهو في حيز الذم والإنكار وما كان واقعا تحت عموم ما ندب إليه وحض عليه فهو في حيز المدح .”\n19ـ حجة الإسلام أبو حامد الغزالي في كتابه إحياء علوم الدين:” ليس كل ما أبدع منهيا عنه بل المنهي عنه بدعة تضاد سنة ثابتة وترفع أمرا من الشرع. ”\n20ـ ابن حجر المكي في شرحه للأربعين :” البدعة لغة ما كان مخترعا وشرعا ما أحدث على خلاف الشرع ودليله الخاص والعام.”\n21ـ عبد الحق الدهلوي في شرح المشكاة قال:” كل ما ظهر بعد رسول الله صلى الله عليه وسلم فهو بدعة وكل ما وافق سنته وقواعدها أو قيس عليها فهو بدعة حسنة وكل ما خالفها فهو بدعة سيئة وضلالة.”\n22ـ نقل النووي في كتابه تهذيب الأسماء واللغات وقال:” قال الشيخ المجمع على جلالته وتمكنه من أنواع العلوم وبراعته أبو محمد عبد العزيز بن عبد السلام رحمه الله ورضي عنه في آخر كتاب القواعد : البدعة منقسمة إلى واجبة ومحرمة ومندوبة ومباحة قال والطريق في ذلك أن تعرض البدعة على قواعد الشريعة.”\n23ـ عبد الله بن الصديق في كتابه إتقان الصنعة:” فمن زعم في فعلِ خير مُستحدثٍ أنه بدعة مذمومة فقد أخطأ وتجرأ على الله ورسوله حيث ذم ما ندب الله إليه في عموميات الكتاب والسنة.”\n24ـ قال ابن لب في الرد على من كره الدعاء عقب الصلاة (أنظر إتقان الصنعة) : “غاية ما يستند إليه منكر الدعاء أدبار الصلوات أن التزامه على ذلك الوجه لم يكن من عمل السلف وعلى تقدير صحة هذا النقل فالترك ليس بموجب لحكم في ذلك المتروك إلا جواز الترك وانتفاء الحرج فيه وأما تحريم أو لصوق كراهية بالمتروك فلا ولاسيما فيما له أصل جملي مقرر في الشرع كالدعاء. ”\n25ـ روى البيهقي بإسناده في كتابه مناقب الشافعي أنه قال : “المحدثات من الأمور ضربان أحدهما ما أحدث مما يخالف كتابا أو سنة أو أثرا أو إجماعا فهذه بدعة الضلالة والثاني ما أحدث من الخير لا خلاف فيه لواحد من هذا فهذه محدثة غير مذمومة.”\n26ـ قال الشيخ سعيد رمضان البوطي نقلا من الرد المحكم المنيع على منكرات وشبهات ابن منيع تأليف السيد هاشم الرفاعي:” إن مناط إنكار البدعة وردها على صاحبها أن المبتدع يقحم في بنية الدين وجوهره ما ليس منه ولما كان المشرع هو الله عز وجل لم يبق مجال لأي تزيد أو تغيير على شرعه أما سائر الأفعال والتصرفات الأخرى التي تصدر من الإنسان دون أن يتصور أنها جزء من جوهر الدين أو واحد من أحكامه وإنما يندفع إليها ابتغاء تحقيق هدف أو مصلحة له دينية كانت أو دنيوية فهي في أبعد ما تكون عن احتمال تسميتها بدعة وإن كانت مستحدثة في حياة المسلمين غير معروفة لهم من قبل بل مآلها أن تصنف إما تحت ما سماه رسول الله صلى الله عليه وسلم سنة حسنة أو تحت ما سماه سنة سيئة وأنت تعلم أنه صلى الله عليه وسلم قال فيما رواه مسلم وغيره من سن في الإسلام سنة حسنة ….” إهـ\n27ـ قال ابن كثير في تفسيره : ” والبدعة على قسمين تارة تكون شرعية كقوله:” فإن كل محدثة بدعة وكل بدعة ضلالة.” وتارة تكون لغوية كقول أمير المؤمنين عمر ابن الخطاب رضي الله عنه عن جمعه إياهم على صلاة التراويح واستمرارهم” نعمت البدعة هذه. “.”\n28ـ قال الزحيلي في كتابه الفقه الإسلامي وأدلته :” أن الأئمة متفقون على أن إعادة الإمام الصلاة مرتين بأن يؤم الناس مرتين في صلاة واحدة بدعة مكروهة ، وقال أيضا عن الصلاة على النبي صلى الله عليه وسلم بعد الآذان أن الفقهاء قالوا بدعة حسنة.”\n29ـ قال صاحب التحرير والتنوير : “وفي هذه الآية على أظهر الاحتمالين إشارة إلى مشروعية تحقيق المناط وهو إثبات العلة في آحاد جزئياتها وإثبات القاعدة الشرعية في صورها وفي حجة لانقسام البدعة إلى محمودة ومذمومة بحسب اندراجها تحت نوع من أنواع المشروعية فتعتريها الأحكام الخمسة كما حققه القرافي وحذاق العلماء وأما الذين حاولوا حصرها في الذم فلم يجدوا مصرفا. ”\n30ـ قال الخطابي في معالم السنن شرح أبي داوود :” كل محدثة بدعة هي كل شيء أحدث على غير أصل من أصول الدين وعلى غير عياره وقياسه وما كان منها مبنيا على قواعد الأصول ومردودا إليها فليس ببدعة ولا ضلالة .”\n31ـ قال الأمير الصنعاني في كتابه سبل السلام :” البدعة لغة ما عمل على غير مثال سابق والمراد بها هنا ما عمل من دون أن يسبق له شرعية من كتاب ولا سنة وقد قسم العلماء البدعة على خمسة أقسام ….. فقوله كل بدعة ضلالة عام مخصوص.”\n32ـ اللكنوي في شرحه على موطأ مالك :” وكل ما لم يكن في زمانه (صلى الله عليه وسلم) يسمى بدعة لكنها منها ما يكون حسنا ومنها ما يكون بخلاف ذلك .”\n33ـ ابن علان في كتابه دليل الفالحين لطرق رياض الصالحين:” والمراد بالضلالة هنا ما ليس له أصل في الشرع وإنما حمل عليه مجرد الشهوة أو الإرادة بخلاف محدث له أصل في الشرع إما بحمل النظر على النظير أو بغير ذلك فإنه حسن إذ هو سنة الخلفاء الراشدين والأئمة المهديين فمنشأ الذم في البدعة ليس مجرد لفظ محدث أو بدعة بل ما اقترن به من مخالفته للسنة ورعايته للضلالة ولذا انقسمت البدعة إلى الأحكام الخمسة لأنها إذا عرضت على القواعد الشرعية لم تخل عن واحد منها ….. فعلم أن قوله وكل بدعة ضلالة عام أريد به خاص. ”\n34ـ قال الكشميري في العرف الشذي :” البدعة مالا يكون في الكتاب والسنة واجتهاد مجتهد مسلم الاجتهاد.”\n35ـ قال المباركفوري في تحفة الأحوذي مستشهدا بكلام ابن رجب الحنبلي :” والمراد بالبدعة ما أحدث مما لا أصل له في الشريعة يدل عليه وأما ما كان له أصل من الشرع يدل عليه فليس ببدعة شرعا وإن كانت بدعة لغة. ”\n36ـ سلطان العلماء العز بن عبد السلام في كتابه قواعد الأحكام:” البدعة منقسمة إلى واجبة ومحرمة ومندوبة ومكروهة ومباحة.”\n37ـ الشيخ ابن عابدين الحنفي في حاشيته رد المحتار قسم البدعة إلى خمسة أقسام.\n38ـ الإمام الزرقاني المالكي في شرحه على الموطأ قال :” وهي لغة (البدعة) ما أحدث على غير مثال سابق وتطلق شرعا على مقابل السنة وهي ما لم يكن في عهده صلى الله عليه وسلم ثم تنقسم إلى الأحكام الخمسة. ”\n39ـ شمس الدين بن أبي الفتوح الحنبلي في كتابه المطلع على أبواب المقنع من كتاب الطلاق: “والبدعة مما عمل على غير مثال سابق والبدعة بدعتان بدعة هدى وبدعة ضلالة والبدعة منقسمة بانقسام أحكام التكليف الخمسة.”\n40ـ الونشريسي في المعيار المعرب قال ما نصه:” وأصحابنا وإن اتفقوا على إنكار البدع في الجملة فالتحقيق الحق عندهم أنها خمسة أقسام ….فالحق في البدعة إذا عرضت أن تعرض على قواعد الشرع فأي القواعد اقتضتها ألحقت بها. ”\n41ـ الملا علي قاري في مرقاة المفاتيح شرح مشكاة المصابيح مستشهدا بكلام النووي والعز بن عبد السلام والشافعي في تقسيم البدعة .\n42ـ القاضي عياض المالكي في مشارق الأنوار على صحاح الآثار : ” كل ما أحدث بعد النبي صلى الله عليه وسلم فهو بدعة والبدعة فعل ما لم يسبق إليه فما وافق أصلا من السنة يقاس عليها فهو محمود وما خالف أصول السنن فهو ضلالة .”\n43ـ الشوكاني في نيل الأوطار استشهد بكلام الحافظ ابن حجر في الفتح في تقسيم البدعة. وقال في القول المفيد في أدلة الاجتهاد والتقليد :” أن المحدثات من الأمور ضربان أحدهما ما أحدث يخالف كتابا أو سنة أو أثرا أو إجماعا فهذه بدعة الضلالة والثانية ما أحدث من الخير لا خلاف فيه لواحد من هذه الأمور وهذه محدثة غير مذمومة.”\n44ـ القاضي الباجي في المنتقى شرح موطأ مالك :” وإنما وصفها بنعمت البدعة لما فيها من وجوه المصالح. “"}, {"q": "يقول سيدنا أحمد التجاني ” أنَّ على الذاكر أن يعتقد أنَّها مِن كلام الله ، كالأحاديث القدسية ليست من تأليف مؤلف ” فهل يعني هذا أن صلاة الفاتح من كلام الذات قديم مثل القرآن ؟", "a": "لفظ الشيخ سيدي أحمد التجاني في الجواهر :” أنها من حضرة الغيب.” و لم يقل قط أن صلاة الفاتح من كلام الله القديم أو من القرآن أو من الأحاديث القدسية أو من أي وجه من وجوه وحي النبوة، وقد ذكر رضي الله عنه مكالمة العارفين، وفرق بينها و بين كلامه عز وجل للأنبياء.\nقال شيخنا أحمد التجاني رضي الله عنه في” جواهر المعاني” :”\nأما المكالمة التي يدعيها العارفون، من قولهم: “سمعت و قيل لي…”، إنما حدها في هذا المحل، أن الكلام الوارد على الرجال في هذا الميدان، أن نسبته إلى الله تعالى، نسبة الخلق إلى الخالق، لا نسبة الكلام إلى المتكلم. و من ظن من الرجال أنه يسمع كلام الذات ، كما سمعه موسى عليه الصلاة و السلام ، فقد ضل وفارق الحق و خسر . قال تعالى: { ما كان لبشر أن يكلمه الله إلا وحيا أو من وراء حجاب } الآية .”.\nو هذا الذي عليه المحققون من العلماء. وأما من ذكر أنها من كلام الله، عبر عن كلام الشيخ رضي الله عنه، حسب المعنى الذي فهمه والمقصود أنها من الإلهام ، أي أنها من قبيل الأدعية التي لا تنافي أي أصل من أصول الكتاب و السنة، بل ترجع إليها، والتي يتلقاها العارفون عن الحضرة القدسية، أو عن المصطفى صلى الله عليه وسلم ، أو يسمعون هاتف يهتف به، أو يرونه مكتوبا. أو غير ذلك .\nو من ذلك ما ذكره الحافظ المنذري في الترغيب و الترهيب ، قال : عن السري بن يحي عن رجل من طي ، و أثنى عليه خيرا ، قال :” كنت أسأل الله عز وجل أن يرني الاسم الأعظم ، الذي إذا دعي به أجاب ، فرأيت مكتوبا في الكواكب في السماء يا بديع السماوات و الأرض يا ذا الجلال و الإكرام .” رواه أبو يعلى ورواته ثقاة .\nفمن لم يفرق بين الوحي العام و وحي الإلهام وهو للصالحين كما قال تعالى: {و أوحينا إلى أم موسى } وهو وحي ليس فيه تشريع، فقد أخطأ خطأ بينا."}, {"q": "بعض المقولات حول فضائل صلاة الفاتح أو فضل أحمد التجاني تجعلنا نعتقد أن هذه الصلاة افضل من القرآن الكريم أو أنه هو أفضل من الأنبياء عليهم السلام ، هل كانت هنالك أقوال مشابهة لهذه في عصر الصحابة او الرسول عليه الصلاة و السلام", "a": "اعلم رحمك الله ان الجواب عما جاء في التفضيل بين الصلاة على النبي صلى الله عليه و سلم و بين تلاوة القرآن موجود في نفس الكتاب – اي جواهر المعاني – في الفصل الأول من الباب الخامس حيث قال رضي الله عنه في تبيين ذلك أن في تلاوة القرآن أربعة مراتب صاحب المرتبة الرابعة منها تكون الصلاة على النبي صلى الله عليه و سلم في حقه أفضل من تلاوة القرآن لانه يزداد بتلاوة القرآن بعدا و لعنا من الله تعالى في حين ان الله يصلي عليه بكل صلاة على النبي صلى الله عليه و سلم عشرا :\n“اما تفضيل القرآن على جميع الكلام من الأذكار و الصلاة على النبي صلى الله عليه و سلم و غيره من الكلام فأمر اوضح من الشمس ،… و تفضيله من حيثيتين الاولى كونه كلام الذات المقدسة المتصفة بالعظمة و الجلال فهو في هذه المرتبة لا يوازيه كلام ، والثانية ما دل عليه من العلوم و المعارف و محاسن الآداب و طرق الهدى و مكارم الأخلاق و الأحكام الإلهية و الأوصاف العلية…\nثم ان هاتين الحيثيتين لا يبلغ فضل القرآن فيهما الا عارف بالله قد انكشفت له بحار الحقائق فهو يسبح في لججها ، فصاحب هذه المرتبة هو الذي يكون القرآن في حقه أفضل من جميع الأذكار و الكلام ..\nو المرتبة الثانية في القرآن دون هذه المرتبة وهي من عرف معاني القرآن ظاهرا و ألقى سمعه عند تلاوته كأنه يسمعه من الله يقصه عليه و يتلوه عليه مع وفائه بالحدود فهذا ايضا لاحق في الفضيلة بالمرتبة الأولى الا أنه دونها\nو المرتبة الثالثة رجل لا يعلم شيئا من معانيه ليس له الا سرد حروفه و لايعلم ماذا تدل عليه من العلوم و المعارف … الا أنه يعتقد أنه كلام الله يلقي سمعه عند تلاوته معتقدا أن الله يتلو عليه تلاوة لا يعلم معناها فهذا لاحق في الفضل بين الرتبتين الا انه منحط عنها بكثيركثير بشرط ان يكون مهتديا موفيا بالحدود و الواجبات غير مخل بشيء منها .\nو المرتبة الرابعة رجل يتلو القرآن سواء علم معانيه او لم يعلم الا انه مجترئ على معصية الله غير متوقف عن شيء منها فهذا لا يكون القرآن في حقه افضل ,بلى كل ما ازداد تلاوته ازداد ذنبا وتعاظم عليه هلاك يشهد له قوله سبحانه و تعالى (ومن أظلم ممن ذكر بآيات ربه)الى قوله(فلن يهتدوا إذاأبدا)و قوله تعالى (ويل لكل أفاك أثيم) الى قوله(و لهم عذاب عظيم) و قوله تعالى ( قل يا أهل الكتاب لستم على شيء حتى تقيموا التوراة و الإنجيل) و كل من يحفظ القرآن و لم يقم بحدوده فقد اتخذه هزوا ،قال تعالى (ولا تتخذوا آيات الله هزوا) و قوله صلى الله عليه و سلم ” ما بال أقوام يشرفون المترفين و يستخفون بالعابدين و يقولون بالقرآن ما وافق أهواءهم ،وما خالف أهواءهم تركوه فعند ذلك يؤمنون ببعض الكتاب و يكفرون ببعض الحديث“… و قوله صلى الله عليه و سلم “ ان أشد الناس عذابا يوم القيامة عالما لم ينفعه الله بعلمه ” و قوله سبحانه و تعالى (ومن أعرض عن ذكري )الى قوله(و كذلك اليوم تنسى) فمن ترك العمل بالقرآن فقد نسيه و الوعيد ثابت عليه، فمثل هذا لا يكون القرآن في حقهم أفضل من الصلاة على النبي صلى الله عليه و سلم… و بيان ذلك انه يزداد بتلاوة القرآن طردا و لعنا و بعدا الا ان يكون صاحب مرتبة الهية في الغيب مدخرة له… فان خلا عن هذه المرتبة فهو عند الله بين امرين : اما ان يعامله بالعفو في الآخرة و عدم المؤاخذة بالعذاب على ذنوبه لسبب من الأسباب المعلومة في الغفران و هي كثيرة، واما ان يناقشه ربه الحساب في الآخرة ثم يقول :لنؤاخذنك بها ذرة ذرة …\n\nو اما في مسألة ان صلاة الفاتح من كلام الله عز و جل فيوضح سيدي الحاج احمد سكيرج رضي الله عنه في كتاب جناية المنتسب فيم نسبه للشيخ التجاني قائلا : ”\nاولا-ان الشيخ رضي الله عنه لم يقل بأن الفاتح لما اغلق أفضل من حرف واحد من القرآن ، و انما المنقول عنه ان تلاوة الفاتح في حق بعض الأشخاص أفضل من تلاوة القرآن ، و فرق في التفضيل بين التلاوة و جوهر اللفظ … ورد عن أنس رضي الله عنه : رب قارئ للقرآن و القرآن يلعنه . ولاشك ان لعن القرآن لبعض قرائه شيء عظيم . والصلاة على النبي صلى الله عليه و سلم مطلقا ما فيها لعن لصاحبها….\nثانيا- فان اعتقاد كونها من كلام الله على فرض ثبوت ذلك عن الشيخ رضي الله عنه ، فان ذلك لا يوجب قدحا في كلام الله او يلزم منه ما الزموه من الوحي بها على غير النبي صلى الله عليه و سلم محتجين بقوله تعالى ( و من أظلم ممن افترى على الله كذبا أو قال أوحي إلي و لم يوح إليه شيء و من قال سأنزل مثل ما أنزل الله ) فان الإستدلال بهذه الآية موضوع في غير محله لأنها نزلت في حق معاند عاند الله و رسوله ..وحاشى الشيخ رضي الله عنه من ادعاء نزول الوحي عليه و انما المقصود انها برزت من حضرة الغيب كما تبرز الأحاديث القدسية من حضرة الغيب ، و المشبه لا يقوى قوة المشبه به . و لقد أفضى الجهل بمن أنكرها بأن قصروا كلام الله تعالى في القرآن ولا يكون من كلام الله غيره ، فغفلوا عن الكتب المنزلة و الصحف المنزلة ، ولم يعلم المنتقد ان جميع ذلك لم ينحصر فيه كلام الله . مع ان الله تعالى متكلم دائما في أزله وهو متكلم سرمدا بغير صوت ولا حرف و لا تقديم ولا تاخير كما هو مقرر في كتب الكلام.\nو قد يكلم سبحانه غير الأنبياء ، و لا مانع من ذلك و لا يعد ذلك وحيا الا من تكلف و تعسف و حرف الكلم و كذب الأعلام و لم يشم رائحة مقام الإحسان الذي أشار اليه سيد الأنام بجوابه عن سؤال جبريل عليه السلام بقوله : أن تعبد الله كأنك تراه فان لم تكن تراه فهو يراك ، و ما ورد في المناجاة في الصلاة فان أهل الله في هذا المقام متفاوتون و بالمناجاة متولهون كل على قدر تمكنه في ولاية الحق له.. و ههنا كلام طويل بسطناه في كتابنا الحق المبين …”\n\nاما بالنسبة لجوهرة الكمال لا يمكن تلاوتها الا بالطهارة المائية في حين انه يمكن تلاوة القرآن بدونها عند العذر فهذا لا يعني أنها تفضل القرآن انما هو شرط فقط او خاصية لهذه الصلاة على النبي صلى الله عليه و سلم و تخصيص شيء ما بخاصية لا يعني تفضيله على غيره و المزية لا تختص بالفاضل دون المفضول في كل شيءفان المزايا يختص الله بها اامفضول في بعض المراتب، كما جاء في الحديث في فضل سيدنا عمر الفاروق رضي الله عنه حيث قال له صلى الله عليه و سلم : ما سلكت فجا الا سلك الشيطان غيره ، في حين ان الحال لم يكن كذلك مع الرسول صلى الله عليه و سلم حين أوثق الشيطان بسارية المسجد… فهذا لا يعني بالمرة ان عمر رضي الله عنه افضل من الرسول صلى الله عليه و سلم انما هي ميزة او خاصية فحسب . أو كمزية ابراهيم عليه الصلاة و السلام لكونه اول من يكسى يوم القيامة من جميع الخلق و مزية موسى عليه الصلاة و السلام كونه صاحب لحية في الجنة دون جميع الخلق ، و لم تكن له صلى الله عليه و سلم رغم شفوف رتبته.\nاو كما ثبت عنه صلى الله عليه و سلم انه قال : ” ان لله عبادا ليسوا بأنبياء و لا شهداء يغبطهم النبيون ” الحديث و هذه المزية يختص الله بها المفضل دون الفاضل وهم الأنبياء عليهم السلام على جلالة قدرهم و شفوف مرتبتهم و مركزهم الأسمى لم يحرك لهم الحق هذه المزية التي لاطف بها صغار الأحباب ."}, {"q": "يؤكد بعضهم أن والدا الرسول صلى الله عليه وسلم في النار و يستدل بحديث رواه الإمام مسلم؟", "a": "الذي عندنا أن والدا الرسول صلى الله عليه و سلم لا يمكن أن يكونا كافرين بأدلة متعددة و أنه لا يجوز ذكرهما بنقص فإن ذلك يؤذي رسول الله صلى الله عليه وسلم كما ورد في الحديث :” لا تؤذوا الأحياء بسبب الأموات ” الطبراني.\nوقد ذكر ذلك الفضيل بن عياظ عند تفسير آية ” إن الذين يؤذون الله ورسوله …..” قال إن من أعظم الأذى له صلى الله عليه وسلم أن يقال إن أبوي النبي في النار.\nو الأدلة على ذلك عديدة نذكر منها :\n– أن آباء النبي صلى الله عليه وسلم وأمهاته من عبد الله إلى آدم ليس فيهم كافر لأن الكافر لا يقال في حقه أنه طيب ولا طاهر بل يقال نجس كما في الآية { إنما المشركون نجس}.\nقال صلى الله عليه و سلم:” إن الله اصطفى كنانة من نسب إسماعيل واصطفى قريشا من كنانة واصطفى من قريش بني هاشم واصطفاني من بني هاشم.” مسلم\nوروى الطبراني وأبو نعيم وابن عساكر عنه صلى الله عليه وسلم قال : “خرجت من نكاح ولم أخرج من سفاح من لدن آدم إلى أن ولدني أبي وأمي ولم يصبني من سفاح الجاهلية شيء.”\nوروى أبو نعيم قوله صلي الله عليه وسلم :” لم يلتق أبواي قط على سفاح ولم يزل الله ينقلني من الأصلاب الطيبة إلي الأرحام الطاهرة مصفى مهذبا لا تتشعب شعبتان إلا كنت في خيرهما.”\nوروي ابن مردويه أنه صلي الله عليه وسلم قرأ :” لقد جاءكم رسول من أنفسكم بفتح الفاء وقال : أنا أنفسكم نسبا وصهرا وحسبا ليس في آبائي من لدن آدم سفاح كلنا نكاح.”\n\n– ما قرره الحافظ السيوطي في” مسالك الحنفا في إسلام والدي المصطفى” و من تلك المسالك أنهما ماتا قبل البعثة ولا تعذيب قبلها لقوله تعالى: {وما كنا معذبين حتى نبعث رسولا} وقد اتفقت الأشاعرة من أهل الكلام والأصول، والشافعية من الفقهاء على أن من مات ولم تبلغه الدعوة يموت ناجيا.\nإنهما لم يثبت عنهما شرك بل كانا على الحنيفية دين جدهما إبراهيم عليه السلام كما كان على ذلك طائفة من العرب كزيد بن عمرو بن نفيل وورقة بن نوفل، وذهب إلى هذا المسلك طائفة منهم الإمام الرازي، بل قالوا إن سائر آبائه صلى الله عليه وسلم لهم هذا الحكم، فليس فيهم كافر، وأما آزر فليس بوالد إبراهيم بل عمه على الصحيح.\nأن الله أحيا له أبويه صلى الله عليه وسلم حتى آمنا به، وهذا المسلك مال إليه طائفة كثيرة من حفاظ المحدثين وغيرهم منهم ابن شاهين والحافظ أبو بكر البغدادي والسهيلي والقرطبي والمحب الطبري وغيرهم، واستدلوا لذلك بما أخرجه ابن شاهين والخطيب البغدادي والدارقطني وابن عساكر بسند ضعيف عن عائشة قالت:” حج بنا رسول الله صلى الله عليه وسلم حجة الوداع، فمر بي على عقبة الحجون وهو باك حزين مغتم، فنزل فمكث عني طويلا، ثم عاد إلي وهو فرح متبسم، قلت له، فقال ذهبت لقبر أمي فسألت الله أن يحيها فأحياها فآمنت بي وردها الله.”\nو هذا لا يستغرب كرامة لسيد الخلق صلى الله عليه و سلم و الله على كل شيء قدير {أو كالذي مر على قريةٍ وهي خاوية على عروشها قال أنى يحيي هذه الله بعد موتها فأماته الله مائة عام ثم بعثه}\nأما الحديث الذي رواه مسلم : أن رجلا قال:” يا رسول الله أين أبي؟ ” قال:” في النار“، قال: وأين أبوك؟ قال:” إن أبي وأباك في النار”، فمذهب أغلب أهل العلم إما أن يكون قصد بأبيه عمه كما هي العادة عند العرب ينادون العم بأبي و كذا بالنسبة لسيدنا إبراهيم في قوله تعالى: { لأبيه آزر} أنه عمه ، أو أنهم لم يتفقوا على لفظ الحديث .\nقال الحافظ السيوطي في رسالته “مسالك الحنفا في والدي المصطفى” ما نصه :”\nالجواب: إن هذه اللفظة لم يتفق على ذكرها الرواة، وإنما ذكرها حماد بن سلمة عن ثابت عن أنس، وهي الطريق التي رواها مسلم منها وقد خالفه معمر عن ثابت فلم يذكر: إن أبي وأباك في النار، ولكنه قال: إذا مررت بقبر مشرك فبشره بالنار، وهذا اللفظ لا دلالة فيه البتة على أن والده في النار، وهو أثبت من حيث الرواية، فإن معمرا أثبت في الرواية من حماد، فإن حماداً تكلم في حفظه ووقع في أحاديث مناكير ذكروا أن ربيبه دسها في كتبه، وكان حمادا لا يحفظ فحدث بها فوهم فيها، ومن ثم لم يخرج له البخاري شيئا، وأما معمر فلم يتكلم في حفظه، ولا استنكر شيء من حديثه، واتفق على التخريج له الشيخان فكان لفظه اثبت.\nثم وجدنا الحديث ورد من طريق سعد بن أبي وقاص بمثل لفظ رواية معمر عن ثابت عن أنس؛ فأخرج البزار والطبراني والبيهقي من طريق إبراهيم بن سعد عن الزهري عن عامر بن سعد عن أبيه أن أعرابيا قال لرسول الله صلى الله عليه وسلم: “أين أبي؟” قال:” في النار“، قال: “فأين أبوك؟” قال:” حيثما مررت بقبر كافر فبشره بالنار.”.”"}, {"q": "السلام عليكم، سمعت بأن التوسل(بواسطة شخص ما) يعتبر من الإشراك بالله في الإسلام، فهل هو كذلك", "a": "عن عثمان بن حنيف أن رجلا ضرير البصر أتى النبي صلى الله عليه وسلم فقال:” ادع الله أن يعافيني !” قال:” إن شئت دعوت وإن شئت صبرت فهو خير لك.” قال:” فادعه!” قال:” فأمره أن يتوضأ فيحسن وضوءه ويدعو بهذا الدعاء:” اللهم إني أسألك وأتوجه إليك بنبيك محمد نبي الرحمة يا محمد إني توجهت بك إلى ربي في حاجتي هذه لتقضى لي اللهم فشفعه في .” رواه الإمام أحمد في المسند والترمذي في سننه وقال هذا حديث حسن صحيح غريب وابن خزيمة في صحيحه والبخاري في التاريخ الكبير والحاكم في المستدرك وصححه وسلمه الذهبي والنسائي في عمل اليوم والليلة وابن ماجة في السنن والبيهقي في دلائل النبوة والطبراني في الكبير وقال صحيح.\nوحمل ابن تيمية الحديث على كون التوسل من الأعمى كان بدعاء النبي صلى الله عليه وسلم له كما صرح بذلك في كتابه التوسل والوسيلة وفي كلامه من المغالطة ما يكشفه متن الحديث :\n1 ـ جاء الأعمى إلى النبي صلى الله عليه وسلم فقال له ادع الله أن يعافيني .فالأعمى طلب الدعاء\n2 ـ فأجابه النبي صلى الله عليه وسلم إن شئت دعوت وإن شئت صبرت فهو خير لك فخيره رسول الله صلى الله عليه وسلم بين الدعاء والصبر\n3ـ فرد عليه الأعمى بالتماس الدعاء لشدة حاجته إلى البصر\n4ـ فأمره النبي صلى الله عليه وسلم أن يتوضأ فيحسن وضوءه ويدعو بهذا الدعاء : اللهم إني أسألك وأتوجه إليك بنبيك محمد. إلى آخر الدعاء.\nفعلمه النبي صلى الله عليه وسلم الدعاء وهو نص في التوسل به صلى الله عليه وسلم لا يحتمل أي تأويل وكيف يحتمل غير التوسل به صلى الله عليه وسلم وفيه “أتوجه إليك بنبيك ، إني توجهت بك إلى ربي…” ؟!\nومن رأى غير ذلك فقد استعجم عليه الحديث . فيا ترى أين دعاء الرسول صلى الله عليه وسلم لهذا الأعمى؟ وماهي صيغته؟ ومتى دعا له ؟ اللهم إن حملنا الحديث فوق طاقته ! وقولناه بما لم يقل !\nوابتهج الألباني في توسله بكلام ابن تيمية فردده قائلا:” وعلى هذا فالحادثة كلها تدور حول الدعاء كما هو ظاهر وليس فيها ذكر شيء مما يزعمون . ”\nوهذه مصادرة للنص وتعمية على القارئ وكيف لايكون كذلك ؟ والنبي صلى الله عليه وسلم علم الرجل دعاءا فيه السؤال بالنبي صلى الله عليه وسلم وهو السبب في رد بصر الأعمى وهذا ما فهمه الأئمة الحفاظ الذين خرجوا الحديث في مصنفاتهم فذكروا الحديث على أنه من الأدعية التي تقال عند الحاجات ، فقال البيهقي في دلائل النبوة :” باب ما جاء في تعليمه الضرير ما كان فيه شفاءه حين لم يبصر”، ولا يخفى أن تعليمه للضرير هو الدعاء الذي فيه التوسل بالذات المحمدية وعبارة البيهقي واضحة جدا وهو الحافظ الفقيه ، وذكره النسائي و ابن السني في عمل اليوم والليلة والترمذي في الدعوات والطبراني في الدعاء والمنذري في الترغيب والترهيب والهيثمي في مجمع الزوائد في صلاة الحاجة ودعائها والنووي في الأذكار وغيرهم على أنه من الأذكار التي تقال عند عروض الحاجات ، وذكره ابن الجزري في العدة في باب صلاة الضر والحاجة .\nوقال الشوكاني في تحفة الذاكرين :” وفي هذا الحديث دليل على جواز التوسل برسول الله صلى الله عليه وسلم إلى الله عز وجل مع اعتقاد أن الفاعل هو الله سبحانه وتعالى وأنه المعطي المانع ماشاء الله كان ومالم يشأ لم يكن . “\nواستقصاء أسماء الحفاظ وأئمة الدين الذين فهموا أن الحديث في التوسل برسول الله صلى الله عليه وسلم لا بدعائه يطول.\nقال ابن تيمية :” ولو توسل غيره من العميان الذين لم يدع لهم النبي صلى الله عليه بالسؤال به لم تكن حالهم كحاله.”\nوردد أتباعه صدا كلامه فقال الألباني في توسله:” لو كان السر في شفاء الأعمى أنه توسل بجاه النبي وقدره وحقه كما يفهم عامة المتأخرين لكان المفروض أن يحصل هذا الشفاء لغيره من العميان الذين يتوسلون بجاهه صلى الله عليه وسلم ….” وذكر نحوه نسيب الرفاعي صاحب التوصل إلى حقيقة التوسل وكذا صاحب هذه مفاهيمنا .\nوهذه أيضا من مغالطاتهم وجدالاتهم المضللة فإجابة الدعاء ليست من شروط صحة الدعاء لأن الله سبحانه وتعالى قد يدخرها له ليوم القيامة فلا تظهر للسائل في الدنيا أبدا أو قد تأتي الإجابة ولكن على غير الوجه الذي أراد السائل بحيث مثلا يدفع الله بها عنه بلاءا ينزل به وهذا من المعروف عند عامة المسلمين وكم من داع متوسلا لله بأسمائه وصفاته ولم يستجب له والتوسل بأسماء الله والدعاء بها مما أجمعت عليه الأمة قال تعالى :{ ولله الأسماء الحسنى فادعوه بها. } ، وكم من متوسل بعمله الصالح ولم نرى إجابة لدعائه والتوسل بالعمل الصالح مما أجمعت عليه الأمة أيضا روى البخاري في صحيحه قصة الثلاثة الذين انحدرت صخرة من الجبل فسدت عليهم الغار فقالوا:” إنه لا ينجيكم منها إلا الدعاء بصالح الأعمال.”\nفهل عدم إجابة الدعاء ننفي به مشروعية التوسل بأسماء الله والتوسل بالأعمال الصالحة ؟!! هذا لا يقول به أي مسلم بالأحرى العلماء منهم وهذا والحمد لله من تمام الحجة عليهم ونقض إيرادهم فلا تلازم بين الدعاء والإجابة.\nوسيدنا عثمان بن حنيف رضي الله عنه وهو راوي الحديث فهم منه العموم ، ووجه رجلا يريد أن يدخل على عثمان بن عفان رضي الله عنه في خلافته إلى التوجه بالدعاء المذكور، وإسناد هذه القصة صحيح كما قال الطبراني في الكبير وفهم الصحابي الجليل عثمان بن حنيف رضي الله عنه هو ما لا يستقيم فهم الحديث إلا به. ورغم جدال الألباني ومراءه وتحت قوة الدليل لم يستطع إلا الاعتراف بجواز التوسل بالنبي صلى الله عليه وسلم وأنه لاغبارعليه فشكك في حججه وأسقط كلامه وتعنته فقال في توسله :” على أنني أقول لو صح أن الأعمى إنما توسل بذاته صلى الله عليه وسلم فيكون حكما خاصا به صلى الله عليه وسلم لايشاركه فيه غيره من الأنبياء والصالحين.” . فأقر بجواز التوسل بالنبي صلى الله عليه وسلم خاصة وحكم على نفسه بما حكم على عامة المسلمين المتوسلين إلى الله برسوله صلى الله عليه وسلم. وإليك أيها الأخ الباحث عن حقيقة الأمر أن تنظر بعين الإنصاف وتعتقد ماأجمعت عليه الأمة والسواد الأعظم من العلماء من أن التوسل بواسطة النبي صلى الله عليه وسلم وبورثته من العلماء والصالحين لا يعتبر من الإشراك بالله في الإسلام. وبعد هذا الدليل الذي لايرده إلا متنطع في جواز التوسل أسوق إليك من الأدلة ما تطمئن بها فؤادك وتحول بها بين تكفير الأمة وقلبك.\nروى البخاري في صحيحه وابن خزيمة وابن حبان والبيهقي في دلائل النبوة عن أنس رضي الله عنه أن عمر ابن الخطاب رضي الله عنه كان إذا قحطوا استسقى بالعباس بن عبد المطلب فقال : “اللهم إنا كنا نتوسل إليك بنبينا فتسقينا وإنا نتوسل إليك بعم نبينا فاسقينا ” قال:” فيسقون.” والمنكرين للتوسل أفهموا الناس أن الاستسقاء كان بدعاء العباس رضي الله عنه فقط . وهو خطأ منهم ، ذكر الحافظ ابن حجر العسقلاني في الفتح أن الزبير بن بكار في الأنساب قد بين صفة مادعا به سيدنا العباس في هذه الواقعة فأخرج بإسناد له أن العباس لما استسقى به عمر قال:” اللهم إنه لم ينزل بلاء إلا بذنب ولم يكشف إلا بتوبة وقد توجه القوم بي إليك لمكاني من نبيك وهذه أيدينا إليك بالذنوب ونواصينا إليك بالتوبة فاسقينا الغيث!” فأرخت السماء مثل الجبال حتى أخصبت الأرض وعاش الناس.\nفأقر رضي الله عنه بإتخاده وسيلة إلى الله بقوله:” وقد توجه القوم بي إليك” كما توسل هو أيضا بسيدنا محمد صلى الله عليه وسلم بقوله:” لمكاني من نبيك” أي لقرابتي منه أي احفظ اللهم نبيك في عمه أي إقبل دعائي لأجل نبيك. كما تلمح ذلك أيضا في قول سيدنا عمر:” بعم نبينا ” أي بقرابته لسيدنا محمد صلى الله عليه وسلم وهو بذلك لايخرج عن كونه توسل بالنبي صلى الله عليه وسلم.\nوقال الحافظ في الفتح:” ويستفاد من قصة العباس استحباب الاستشفاع بأهل الخير والصلاح وأهل بيت النبوة.”\nوأخرج الحاكم في المستدرك من طريق داوود بن عطاء المدني عن زيد ابن أسلم عن ابن عمر أنه قال :” استسقى عمر بن الخطاب عام الرمادة بالعباس بن عبد المطلب فقال:” أيها الناس إن رسول الله صلى الله عليه وسلم كان يرى للعباس مايرى الولد لوالده يعظمه ويفخمه ويبر قسمه فاقتدوا أيها الناس برسول الله صلى الله عليه وسلم في عمه واتخذوه وسيلة إلى الله فيما نزل بكم.” وهكذا رواه الزبير بن بكار في الأنساب كما في الفتح وأخرجه ابن عساكر في تاريخ دمشق من طريق الزبير بن بكار وداوود بن عطاء المدني ضعيف وقد ضعفه الذهبي في تلخيص المستدرك أما الحاكم فلم يتكلم عليه.\nقال الحافظ ابن حجر في الفتح بعد سياقه لطريق داوود بن عطاء الضعيف مانصه: “وأخرجه البلاذري من طريق هشام بن سعد عن زيد بن أسلم فقال عن أبيه بدل ابن عمر فيحتمل أن يكون لزيد فيه شيخان. والعجب أن الألباني لم يأتي على هذا الاحتمال القوي في توسله واشتغل بتضعيف داوود بن عطاء المدني ولما رأى متابعة هشام بن سعد قال:” إن في السند اضطرابا ” وهذا الحكم لادعامة له إلا الهوى المتبع الذي أداه لمخالفة قواعد الحديث فإن من المعروف أن الحكم بالاضطراب على السند لايكون إلا إذا تساوت الروايات وامتنع الجمع والترجيح ، عند ذلك يحكم بالاضطراب وهو هنا ممتنع فإن هشام بن سعد من رجال مسلم فحديثه راجح وداوود بن عطاء ضعيف وقد حسن مرات عدة حديث هشام بن سعد فكيف يغض طرفه؟ غفر الله لنا وله !عن هذا الحق الواضح!\nفثبت ولله الحمد توسل سيدنا عمر بالعباس رضي الله عنهما بدليل قوله:” واتخذوه وسيلة إلى الله فيما نزل بكم .” والضمير يعود على شخص سيدنا العباس رضي الله عنه قولا واحدا.\nوقال ابن تيمية :” لو كان السؤال به صلى الله عليه وسلم معروفا عند الصحابة لقالوا إن السؤال والتوسل به أولى من السؤال والتوسل بالعباس وفي ذلك ترك السنة المشروعة وعدول عن الأفضل وسؤال الله تعالى بأضعف السببين مع القدرة على أعلاهما ونحن مضطرون غاية الاضطرار في عام الرمادة.”\nوالناظر في كلام ابن تيمية يجده ينفي التوسل برسول الله صلى الله عليه وسلم مطلقا لأن الصحابة رضي الله عنهم تركوا التوسل به بعد وفاته لأنه مقصور على الدعاء فقط ودعاؤه بعد انتقاله غير ممكن في رأيه ولو كان توسلهم بذاته ممكنا لما تركوه مع قيام المقتضى وشدة الحاجة.\nوهذا الإشكال الجواب عنه والحمد لله سهل ميسور فالترك بمفرده لايدل على التحريم أو الكراهة وإنما الترك يفيد أن المتروك جائز تركه أما التحريم والكراهة فيحتاجان إلى دليل أخر يفيدهما ولو كان الترك يفيد التحريم كما فهم ابن تيمية ومن شاكله فإن الصحابة رضي الله عنهم تركوا التوسل المتفق على جلالته وأفضليته وهو التوسل بأسماء الله وصفاته وتوسلوا بالعباس الذي لايملك لنفسه ضرا ولا نفعا فضلا عن غيره وهم مضطرون غاية الاضطرار لحال الشدة والقحط ، كما تركوا التوسل بمن هم أفضل من العباس بالإجماع سيدنا عثمان ابن عفان وسيدنا علي ابن أبي طالب رضي الله عنهما. وفهم الصحابة رضي الله عنهم يخالف قول ابن تيمية وأتباعه والصحابة أفهم من غيرهم لكلام الله وكلام رسوله صلى الله عليه وسلم فكان التوسل عندهم لايقتصر على دعاء الحي فقط وإنما تعداه إلى التوسل بذاته صلى الله عليه وسلم بعد وفاته.\nقال ابن حجر في الفتح روى ابن أبي شيبة بإسناد صحيح من رواية أبي صالح السمان عن مالك الداري (وكان خازن عمر) قال:” أصاب الناس قحط في زمن عمر فجاء رجل إلى قبر النبي صلى الله عليه وسلم فقال:” يارسول الله استسق لأمتك فإنهم قد هلكوا فأتى الرجل في المنام فقيل له:” ائت عمر” .” الحديث\nوقال ابوبكر البيهقي بإسناد صحيح كما قال الحافظ ابن كثير في البداية عن أبي صالح عن مالك قال أصاب الناس قحط في زمن عمر ابن الخطاب فجاء رجل إلى قبر النبي صلى الله عليه وسلم فقال:” يارسول الله استسق لأمتك فإنهم قد هلكوا !” فأتاه رسول الله صلى الله عليه وسلم في المنام فقال:” ائت عمر فأقرئه مني السلام وأخبرهم أنهم مسقون وقل له:” عليك بالكيس الكيس.”.” فأتى الرجل فأخبر عمر فقال:” يارب ما آلو إلا ما عجزت عنه.” وهذه حجة دامغة في جواز التوسل بالنبي صلى الله عليه وسلم حيا وميتا .\nوقد بعد عن الصواب من رمى المسلمين بالشرك بسبب ذلك مع قوله بجواز التوسل بالحي والتوسل لو كان شركا ما جاز لا بالحي ولا بالميت.\nوركب عبد العزيز بن باز في تعليقه على فتح الباري الصعب معلقا على هذا الأثر الصحيح فقال:” هذا الأثر على فرض صحته كما قال الشارح ليس بحجة على جواز الاستسقاء بالنبي صلى الله عليه وسلم بعد وفاته لأن السائل مجهول ولأن عمل الصحابة على خلافه …” إلى أن قال:” وأن ما فعله هذا الرجل منكر ووسيلة إلى الشرك بل قد جعله بعض أهل العلم من أنواع الشرك.”\nفقوله:” لأن السائل مجهول ” هو معنى كلام الألباني في توسله حيث قال:” هب أن القصة صحيحة فلا حجة فيها لأن مدارها على رجل لم يسم وتسميته بلالا في رواية سيف لايساوي شيئا لأن سيف متفق على ضعفه. ” .\nوهذا التعليل ميت أو كما قيل عذر أقبح من ذنب يحتج به على أثر صحيح فالجائي إلى القبر الشريف سواء كان صحابيا أو تابعيا مجهولا كان أو معروفا لا يفيد في شيء وإنما الحجة والدليل القاطع في إقرار سيدنا عمر بن الخطاب رضي الله عنه لعمله حيث لم ينهه عما فعل وعمر وما أدراك ما عمر في شدته على الباطل بالأحرى الشرك . وقوله :” لأن عمل الصحابة على خلافه ” كلام باطل وإقرار سيدنا عمر لهذا الجائي فيه لفت نظر القارئ الكريم إلى أن فعل الصحابة ليس على خلافه وسيدنا عمر من أكابر الصحابة رضي الله عنهم جميعا . ولمزيد توضيح أن فعل الصحابة ليس على خلافه إليك أيها الباحث عن الحقيقة مايلي : روى الحافظ الدارمي في سننه باب ما أكرم الله تعالى نبيه بعد موته قال:” قحط أهل المدينة قحطا شديدا فشكوا إلى عائشة ، فقالت :” انظروا إلى قبر النبي صلى الله عليه وسلم فاجعلو منه كوا إلى السماء حتى لايكون بينه وبين السماء سقف.” قال:” ففعلوا فمطرنا مطرا حتى نبت العشب وسمنت الإبل حتى تفتقت من الشحم فسمي عام الفتق”. وإسناد هذا الأثر صحيح أو حسن لا يعدوهما ورجال السند رجال الصحيح ماخلا عمروبن مالك النكري وهو ثقة غير أن الألباني ضعفه ورفض توثيق الحفاظ له كالمنذري والهيثمي والذهبي وابن حبان وما ذلك إلا ليضعف به الحديث نعوذ بالله من الهوى المتبع.\nفإرشاد أمنا عائشة رضي الله عنها أهل المدينة إلى قبر سيد الوجود صلى الله عليه وسلم فيه إبطال من زعم أن عمل الصحابة على خلاف الجائي إلى القبر الشريف. أما قوله:” ولأن مافعله هذا الرجل منكر ووسيلة إلى الشرك ” كلام باطل أيضا وخطأ بين ، فبعدما سلم بصحة الأثر أترى أمير المؤمنين عمر ابن الخطاب رضي الله عنه يقر الرجل على الشرك في رأيك ؟ حاشاه من هذا ! ثم للقارئ الكريم أن يتعجب ويسأل هل نتعلم من الصحابة رضوان الله عليهم ديننا أم ننظر في أعمالهم ونحكم عليها وفق أهوائنا ؟ أعاذنا الله من ذلك! والخير في الإتباع والشر في الابتداع ! ففهم تسلم !\nوحتى لا أطيل عليك أيها السائل الكريم سأذكر لك جملة من أشهر علماء الأمة ممن يرى أن التوسل جائز بالأحياء وبالأموات مشيرا إلى مراجعهم فأقول:\n1ـ الامام أحمد بن حنبل : في إتحاف السادة المتقين لمرتضى الزبيدي ذكر صفوان بن سليم عند أحمد فقال:” هو رجل يستسقى بحديثه وينزل القطر من السماء بذكره.” كما ذكره عنه أيضا المزي في تهذيب الكمال وعنه أيضا ابن حجر في تهذيب التهذيب وابن سليم هذا توفي قبل أن يولد الإمام أحمد ولم يقل يستسقى بدعائه كما يقول ابن تيمية بل جعل ذكره سببا لنزول المطر. وفي العلل ومعرفة الرجال عن عبد الله بن الإمام أحمد عن أبيه أنه قال:” قال ابن عيينة :” رجلان صالحان يستسقى بهما ابن عجلان ويزيد بن يزيد بن جابر.”\n2ـ الإمام الحافظ ابن حجر العسقلاني: ذكر قصة الرجل الذي جاء إلى قبر النبي وتوسل به وصحح سندها في الفتح كما ذكر في الإصابة في تمييز الصحابة في ترجمة الصحابي عبد الرحمان بن أبي ربيعة الباهلي أنه استشهد ببلنجر من أرض الترك ودفن هناك فهم يستسقون به إلى الآن.\n3ـ الامام الحافظ المفسر ابن كثير: في تفسيره عند قوله تعالى:”{ ولو أنهم ظلموا أنفسهم …} الآية فقد ذكر قصة العتبي ولم يعترض عليها بشيء مما يدل على قبولها عنده. وذكر قصة الرجل الذي جاء إلى القبر الشريف وتوسل به وقال إن إسنادها صحيح من البداية .\n4ـ المفس الإمام القرطبي: في تفسيره عند قوله تعالى:”{ ولو أنهم ظلموا أنفسهم }.\n5ـ الامام الشوكاني: في تحفة الذاكرين .\n6 ـ العلامة ابن حجر الهيثمي: في حاشيته على الإيضاح وله رسالة خاصة في هذا الباب تسمى بالجوهر المنظم.\n7ـ الإمام الزرقاني: في شرحه على المواهب.\n8 ـ الامام النووي: في كتابه الإيضاح في الباب السادس .\n9ـ الحافظ القسطلاني: في كتابه المواهب اللدنية في المقصد الأول من الكتاب .\n10 ـ العلامة شهاب الدين الخفاجي: في شرحه على الشفا.\n11 ـ الشيخ نور الدين القاري المعروف بملا علي قاري: في شرحه على الشفا.\n12 ـ القاضي عياض : في الشفا.\n13ـ الحافظ أبو الفرج ابن الجوزي: في كتابه الوفا.\n14 ـ الحافظ جلال الدين السيوطي: في الخصائص الكبرى.\n15 ـ الحافظ البيهقي: في كتابه دلائل النبوة وقد التزم أن لايذكر فيه الموضوعات.\n16ـ الحافظ أبو عبد الله الحاكم: في المستدرك على الصحيحين.\n17ـ العلامة المرداوي الحنبلي: في كتاب الانصاف وفيه ويجوز التوسل بالرجل الصالح على الصحيح من المذهب وقيل يستحب.\n18ـ ابن مفلح الحنبلي: في الفروع وفيه ويجوز التوسل بصالح وقيل يستحب .\n19 ـ المحقق ابن قدامة الحنبلي: في كتابه المغني .\n20 ـ الفقيه شمس الدين الرملي الشافعي: في فتاويه بهامش الفتاوى الكبرى لابن حجر الهيثمي.\n21 ـ العلامة المجتهد تقي الدين السبكي: في شفاء السقام .\n22ـ شمس الدين ابن الجزري: كما قال نور الدين ملا علي القاري الحنفي في شرح المشكاة مانصه :” قال شيخ مشايخنا علامة العلماء المتبحرين شمس الدين بن الجزري في مقدمة شرحه للمصابيح المسمى بتصحيح المصابيح :” إني زرت قبره بنيسابور(يعني مسلم بن الحجاج) وقرأت بعض صحيحه على سبيل التيمن والتبرك عند قبره ورأيت اثار البركة ورجاء الاجابة في تربته. ”\n23ـ الامام مالك بن أنس: كما ذكر القاضي عياض في الشفا باسناد صحيح مشيرا إلى القصة التي وقعت بينه وبين الخليفة المنصور عند قوله:” وهو وسيلتنك ووسيلة أبيك آدم.” كما ذكرها أيضا السيد السمهودي في خلاصة الوفا والقسطلاني في المواهب وابن حجر في الجوهر المنظم.\n24ـ العلامة ابن الحاج المالكي: في المدخل المعروف بشدة انكاره للبدعة عند قوله:” فالتوسل به عليه الصلاة والسلام هو محط أحمال الأوزار وأثقال الذنوب والخطايا لأن بركة شفاعته عليه الصلاة والسلام وعظمها عند ربه لايتعاظمها ذنب… ”\n25ـ البدر العيني: في عمدة القاري بشرح صحيح البخاري .\n26 ـ الشيخ مرعي بن يوسف الحنبلي: في غاية المنتهى.\n27 ـ الدكتور سعيد رمضان البوطي: في فقه السيرة النبوية .\nوالقائمة طويلة جدا وفي ما ذكرت كفاية لمن كان قصده البحث عن الحقيقة والوقوف على الصواب في هذه المسألة ومن لم تكن له في هؤلاء الأعلام الحجة وهم الذين يمثلون السواد الأعظم من الأمة المقتدى بهم فلا حول ولا قوة إلا بالله العلي العظيم ."}, {"q": "اريد بعض التوضيحات حول موضوع بدأ يحرك الأوساط الفكرية التجانية في السنغال وهو حول المرأة المسيحية التي تزوجت من سيدي أحمد عمار التجاني رضي الله عنه ( انظر جريدة الفجر بتاريخ 17/01/2005…)", "a": "قال العارف بالله سيدي محمد الحافظ المصري في كتابه القيم “الانتصاف في رد الافتراء على السادة التجانية” :\n\nاتهم الفرنسيون سيدي أحمد عمار بالثورة وتحريض بعض القبائل على فرنسا فنفوه إلى مدينة الجزائر فاعتقل فيها سنة وحالوا بينه وبين تلاميذه لايتصل بهم ولايتصلون به فلما قامت الحرب بين فرنسا وألمانيا لم تخش فرنسا أحدا في الجزائر كلها إلا سيدي أحمد عمار فأبعدته إلى فرنسا ثم خشيت أن يقوم أخوه سيدي محمد البشير بالثورة فألحقته به وبقيا طول الحرب معتقلين في فرنسا. وحين كان سيدي أحمد عمار معتقلا في فرنسا جعلت الحكومة على حراسته المسيو بيكار وهو ضابط فرنسي قديم وكانت له ابنة مثقفة وكانت تسأل سيدي أحمد عمار عن الإسلام ورأت من أخلاقه وتمسكه بدينه ماراعها فلما انتهت الحرب الفرنسية الألمانية وأراد سيدي أحمد عمار الرجوع إلى وطنه إتفق مع والد أوريلى على الزواج بابنته على الشرع الإسلامي وكان الأمر كذلك لاكما يدعي المغرقون في الكذب أنه تزوجها زواجا كنسيا وأن الذي عقد لهما الزواج الكردينال ( لاأدري مااسمه ) وتم ذلك الزواج في مدرسة لا في كنيسة كما يزعم الكاذبون والذي تولى العقد هو المفتي الحنفي.\n\nوإليك صورة عقد الزواج بإمضاء والد أوريلى وقبوله الزواج الاسلامي وإمضاء سيدي أحمد عمار:\n\nإلى أن قال رضي الله عنه:” أما هي فقد أسلمت وحسن إسلامها وأوصت ألا يحضرها عند موتها أحد من القسس وأعلنت إسلامها أمام الفرنسيين والمسلمين وثبت ذلك للحكومة الفرنسية وأوصت أن تدفن في مقابر المسلمين وصلى عليها ودفنت في مقابر المسلمين بالفعل ، وقد افترى قوم أغرقوا في الكذب أنه أقيم على قبرها قبة ووضع عليه صليب وهلال وقد أرسلنا إلى عين ماضي بذلك فأجابونا أن ذلك من الكذب المضحك ، وقد سافرت سنة 1356 هجرية إلى عين ماضي وكوردان التي دفنت فيها وعاينت القبر بنفسي ولم أجد على قبرها لاقبة ولاصليب ولاهلال .وذلك يدل على أن هؤلاء القوم لا يتقون الله ولا يتورعون عن اختلاق الأكاذيب الواضحة البطلان . وقبر أوريلى هو الثالث بجوار قبر سيدي احمد عمار في فناء حديقة القصر ليس فوقه إلا السماء وعليه حجر قائم يقابله حجر آخر كتب عليه تاريخ وفاتها وأنها ماتت مسلمة بشهادة عدول المسلمين.”"}, {"q": "لماذا علم الرسول صلى الله عليه و سلم أصحابه الصلاة الإبراهيمية حين طلبوا منه كيفية الصلاة عليه", "a": "تعتبر مسألة الصلاة على النبي صلى الله عليه و سلم من جملة المسائل التي اتفق المسلمون على أصلها واختلفوا في تفاصيلها وكيفيتها.\nوأصل هذه المسألة قوله تعالى: [ إن الله وملائكته يصلّون على النبيّ يا أيّها الذين آمنوا صلّوا عليه وسلّموا تسليما ]. و قد علم رسول الله صلى الله عليه وسلم أصحابه رضوان الله عليهم كيفية الصلاة عليه بأن علمهم صيغة الصلاة الإبراهيمية و لكن هذا لا يعني بأي حال من الأحوال أنه لا يمكن الصلاة عليه بصيغة أخرى ، كما أنه لا يوجد أي دليل في الكتاب أو في السنة يمنع الصلاة عليه صلى الله عليه و سلم بصيغة مغايرة للصلاة الإبراهيمية إذ أن الصلاة على النبي صلى الله عليه وسلم بأي صيغة محمودة و جائزة.\nولم يقتصر الصحابة رضوان الله عليهم بالصلاة على رسول الله صلى الله عليه وسلم بصيغة الصلاة الإبراهيمية بل صلوا عليه صلى الله عليه و سلم بما ألهمهم الله عز و جل ، و من المعلوم أن الصلاة على الحبيب صلى الله عليه و سلم وردت مروية بصيغ كثيرة مختلفة مأثورة ، كما نقل عن الصحابة و التابعين رضوان الله عليهم صيغ كثيرة اجتهدوا فيها بمزيد الثناء .\nمما يدل على جواز تعدد هذه الصيغ ، و عدم التقيد بالمأثور ما ورد عن عبد الله ابن مسعود رضي الله عنه أنه كان يقول : ” إذا صليتم على النبي صلى الله عليه و سلم فأحسنوا الصلاة عليه ، فإنكم لا تدرون لعل ذلك يعرض عليه” فقالوا:” علمنا” قال : “قولوا:” اللهم اجعل صلاتك و رحمتك و بركاتك على سيد المرسلين و إمام المتقين و خاتم النبيين محمد عبدك و رسولك إمام الخير و قائد الخير و رسول الرحمة …”.”. أخرجه ابن ماجة و حسنه المنذري.\nو عن ابن عباس رضي الله عنهما أنه كان يقول :” اللهم تقبل شفاعة محمد الكبرى وارفع درجته العليا و آته سؤله في الآخرة و الأولى كما أتيت إبراهيم و موسى. “.\nو عن الحسن البصري أنه كان يقول:” من أراد أن يشرب بالكأس الأوفى من حوض المصطفى فليقل:” اللهم صل على محمد و على آله و أصحابه و أولاده و أزواجه و ذريته و أهل بيته و أصهاره و أنصاره و شيعته و محبيه و أمته و علينا معهم أجمعين يا أرحم الراحمين.”.”.\nوعن الإمام الشافعي رضي الله عنه في “الرسالة” أنه قال:” و صلى الله على محمد عدد ما ذكره الذاكرون و عدد ما غفل عن ذكره الغافلون “.\nو حدث سلامة الكندي أن عليا رضي الله عنه كان يعلم الناس هذا الدعاء :” اللهم داحي المدحوات و بارئ المسموكات و جبار القلوب على فطرتها، شقيها و سعيدها ، اجعل شرائف صلواتك و بركاتك و فضائل آلائك على على محمد عبدك و رسولك الفاتح لما أغلق و الخاتم لما سبق والمعلن الحق بالحق و الدامغ لجيشات الأباطيل …” والله ولي التوفيق ."}, {"q": "لماذا يقتصر الاستغفار في الوظيفة على استغفر الله الذي لا إله إلا هو الحي القيوم دون إضافة وأتوب إليه كما جاء في الحديث عن ابن مسعود رضي الله عنه عن رسول الله صلى الله عليه وسلم قال( من قال استغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه غفرت ذنوبه وإن كان قد فر من الزحف)", "a": "أولا لابد من العلم أنه قد ثبتت الأخبار عنه صلى الله عليه و سلم بالروايتين بالنسبة لهذه الصيغة من الاستغفار مشتملة على “ وأتوب إليه ” و خالية منها.\nو الاستغفار في الوظيفة لا يزيد الإنسان فيها لفظة “ و أتوب إليه ” و لعل وجه اختيار هذه الرواية أن الاستغفار إذا ما أتى به العبد لا يكون كاذبا فيه بخلاف التوبة فإنه إن قال:” و أتوب إليه ” استلزم ذلك:\n– الإقلاع عن المعصية أي تركها\n– العزم على أن لا يعود لمثلها\n– والندم على ما صدر منه\n\nفإن لم يستوف هذه الشروط فهو كاذب بخلاف ما اختير للوظيفة فإنه ليس فيه إلا طلب المغفرة فحسب، و الله أعلم."}, {"q": "ما هوردكم على ما أجده من اتهام في كتاب الشيخ الإفريقي حيث يقول قال في جواهر المعاني: (إن هذا الورد ادخره رسول الله صلّى الله عليه وسلّم لي و لم يُعَلِّمْهُ لأحد من أصحابه) – إلى أن قال -: (لعلمه صلّى الله عليه وسلّم بتأخير وقته، وعدم وجود من يظهره الله على يديه). وكذا في الجيش (ص91). ففي قوله: ادخره لي ولم يعلمه لأحد من أصحابه ردّ على قوله تعالى: { يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنزِلَ إِلَيْكَ مِن رَّبِّكَ } [المائدة: 67]. ومعلوم أن الكتمان محال على الأنبياء والرسل، لأنه خيانة للأمانة. ولا شك أن نسبة الكتمان إليه صلّى الله عليه وسلّم كفر بإجماع العلماء. وفي قوله: عدم وجود من يظهره الله على يديه تفضيل لنفسه على أبي بكر الصديق رضي الله عنه، حيث لا يقدر أن يحمل هذا الورد. وهذا كلام في غاية الفساد، بل في غاية الوقاحة.", "a": "لقد اطلعنا على ما في هذا الكتاب ولاشك أن من أول التساؤلات التي ستخطر ببال من قرأه من أصحاب النزاهة الدينية و العلمية هو من أين جلب كاتبه لقب الشيخ…\n(والذين يؤذون المؤمنيــن والمؤمنات بغير ما اكتسبوا فقد احتملوا بهتانا وإثما مبينا).\nو سوف لن نطيل في هذا لندخل مباشرة في الرد على اتهامه و افتراءه و إدعاؤه على الشيخ أحمد التجاني رضي الله عنه قال في جواهر المعاني : “إن هذا الورد ادخره رسول الله صلّى الله عليه وسلّم لي و لم يُعَلِّمْهُ لأحد من أصحابه.” يحتوي على تحريف و زيادة و نقصان وهو مخالف للأمانة العلمية و فيه نسيان أو تناسي نقل ما جاء بعده على منوال “ويل للمصلين ” أو “يا أيها الذين آمنوا لا تقربوا الصلاة“\nأما التحريف :\n. اختراعه للفظ ” ادخره ” فليس هناك أي أثر لهذه الكلمة البتة\nإبداله لفظ “هذا الفضل” بلفظ ” هذا الورد ”\nإبداله لفظ ” لم يذكره” ب ” لم يعلمه “\nإضافته للفظ “ لأحد ” في قوله لأحد من أصحابه\nو النص كما جاء في” الجواهر” أنظر ص 59 طبعة دار الفكر:\n(قلت) لسيدنا رضي الله عنه :” و هل كان سيد الوجود صلى الله عليه و سلم عالما بهذا الفضل المتأخر في وقته ؟” قال:” نعم هو عالم به” (قلت) : ” و لِمَ لَمْ يذكره لأصحابه رضوان الله عليهم أجمعين …”\nوهو هنا يتحدث عن الفضل و ليس عن الورد أو عن صلاة الفاتح في حد ذاتها فصلاة الفاتح لما أغلق موجودة ومعروفة قبل الشيخ التجاني رضي الله عنه بمئات السنين وقد صرح الشيخ بذلك وقد ذكر بها الشيخ البكري ولقنها لمريديه وذكر بها غيره من المشايخ رضوان الله عليهم أجمعين .\nو قوله : “ولم يعلمه لأحد من أصحابه”، كلام يناقض حقيقة معلومة للجميع وهي أن ورده مؤلف من الاستغفار والصلاة على النبي صلى الله عليه وسلم ولا إله إلا الله ، وهي أذكار علمها صلى الله عليه وسلم اتفاقا لأصحابه رضي الله عنهم.\n\nيقول الشيخ إبراهيم انياس في كتابه ” الأضواء السطع على المرهفات القطع” :”\n\nالشيخ التجاني رضي الله عنه لم يقل شيئا يدل على نسبة الكتمان إلى النبي في جميع كتبه ووصاياه ولا تصح به رواية عنه، حاشاه رضي الله عنه ، فإنما ذكر وردا أخذه عن سيد الوجود صلى الله عليه وسلم رتبه له وذكر له فضائله وذلك دعوى سبقه الأولياء إليها …ومع ذلك فورده مما بلغ فليس الورد إلا الاستغفار والصلاة على النبي المختار والهيللة التي هي أفضل الأذكار تقرأ بالعشي والإبكار. وهذه الأذكار كانت الصحابة رضوان الله عليهم عاملين بها ولهم فيها أجر غير ممنون.\nو عدم ذكر الرسول صلى الله عليه و سلم فضلها لعموم الصحابة لعلة جائز كما ثبت في حديث معاذ ابن جبل رضي الله عنه في فضل لا إله إلا الله قال:” يا رسول الله أفلا أخبر به الناس فيستبشروا ؟” قال: “إذاً يتكلوا“، وأخبر بها معاذ عند موته تأثما. كما أن عدم ذكرها لعموم الصحابة لا يعني عدم ذكرها لخاصتهم حيث كان يخص بعض الصحابة ببعض
