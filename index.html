<style>
:root{--bg:#fff;--fg:#000;--mute:#555;--line:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#aaa;--line:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#aaa;--line:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",Tahoma,serif;line-height:2;font-size:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand svg{width:34px;height:34px;flex:none}
main{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.count{color:var(--mute);font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bar{height:3px;background:var(--mute);opacity:.35;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .25s}
.label{display:inline-block;border:2px solid var(--line);padding:0 12px;font-size:15px;font-weight:700;line-height:1.7;margin-bottom:8px}
.label.a{background:var(--fg);color:var(--bg)}
.q{font-size:22px;font-weight:700;white-space:pre-wrap;margin:0 0 24px;line-height:2}
.ans{white-space:pre-wrap;margin:0;border-right:4px solid var(--line);padding-right:14px;overflow-wrap:anywhere}
.none{color:var(--mute);border:2px dashed var(--mute);padding:10px 14px;margin:0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
button{font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;background:var(--bg);color:var(--fg);border:2px solid var(--line);min-height:46px}
button:hover,button:focus-visible{background:var(--fg);color:var(--bg);outline:none}
button.main{flex:1 1 180px;background:var(--fg);color:var(--bg)}
button.main:hover,button.main:focus-visible{background:var(--bg);color:var(--fg)}
button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.ic{padding:8px 12px}
</style>

<script>
var D=[{"q": "تقسيم أضحية العيد في المذهب المالكي ؟", "a": "بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق والخاتم لما سبق ناصر الحق بالحق والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم\n\nقال تعالى:\nيَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ وَمَن يَتَّبِعْ خُطُوَاتِ الشَّيْطَانِ فَإِنَّهُ يَأْمُرُ بِالْفَحْشَاءِ وَالْمُنكَرِ\n(سورة النور، الآية 21)\n\nقال تعالى:\nقُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ\n(سورة آل عمران، الآية 31)\n\nقال تعالى:\nلَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ\n(سورة الأحزاب، الآية 21)\n\nقال تعالى:\nوَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا\n(سورة الحشر، الآية 7)\n\nقال تعالى:\nقُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا ۖ هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ\n(سورة يونس، الآية 58)\n\nقال سيدنا أحمد التجاني قدس الله سره:\n• كلُّ فتحٍ، وكلُّ نورٍ، وكلُّ ترقٍّ لا يتحقَّق إلا بالاتباع الصادق للحبيب ﷺ.\n• كل طريقٍ لا يؤدّي إلى اتباع النبي ﷺ فهو طريقُ ضلال.\n• الخير كله في اتباع السنة، والشر كله في مخالفتها.\n\nتقسيم أضحية العيد في المذهب المالكي\n\nفي مذهب الإمام مالك بن أنس، تُعدّ الأضحية عبادةً عظيمة وسنّةً مؤكدة. وقد بيّن علماء المالكية الأحكام المتعلقة بتقسيم لحم الأضحية، اعتمادًا على القرآن الكريم وسنّة النبي الكريم ﷺ.\n\nقال تعالى:\n\nفَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ\n(سورة الحج، الآية 36)\n\nوقد فهم العلماء من هذه الآية الكريمة أنه يُستحب:\n\nأن يأكل المضحي جزءًا من أضحيته؛\n\nوأن يُهدي جزءًا منها؛\n\nوأن يتصدّق بجزء منها على الفقراء والمحتاجين.\n\nما ذكره علماء المالكية\n\nأوضح فقهاء المالكية أن الشريعة لم تُحدد نسبةً واجبةً لتقسيم الأضحية.\n\nوعليه، فإن تقسيمها إلى ثلاثة أجزاء متساوية:\n\nجزء للأهل ،\n\nوجزء للأقارب والجيران،\n\nوجزء للفقراء،\n\nهو أمر مستحب وليس واجبًا.\n\nوقد ذكر الإمام خليل بن إسحاق الجندي في مختصره استحباب الأكل من الأضحية وإطعام الآخرين منها.\n\nكما شرح الإمام أحمد الدردير في «الشرح الكبير» أنه يُستحب:\n\nأن يأكل الإنسان جزءًا من اللحم؛\n\nوأن يُهدي جزءًا منه؛\n\nوأن يتصدّق بجزء منه.\n\nوفي المذهب المالكي، فإن إعطاء جزء من الأضحية للفقراء والمحتاجين يُعد من المندوب، أي من الأعمال المستحبة ذات الأجر، وليس أمرًا واجبًا.\n\nلذلك، إذا احتفظ الشخص بكل اللحم لأسرته، فإن أضحيته تبقى صحيحة عند علماء المالكية، خاصة عند الحاجة، أو كثرة أفراد الأسرة، أو ضيق الحال.\n\nغير أن الفقهاء نبّهوا إلى أن ترك مشاركة الفقراء والمحتاجين بالكلية يخالف:\n\nالحكمة الروحية من الأضحية؛\n\nوروح الكرم التي شرعت من أجلها؛\n\nوالهدي النبوي الشريف.\n\nفالأضحية ليست عبادة فردية فحسب، بل هي أيضًا مظهر من مظاهر:\n\nالرحمة؛\n\nوالأخوّة؛\n\nوالتكافل مع المحتاجين.\n\nولهذا رأى العلماء أن الأفضل والمستحب:\n\nأن يأكل المضحي جزءًا؛\n\nوأن يُهدي جزءًا؛\n\nوأن يتصدّق بجزء على الفقراء،\n\nمن غير إلزام بنسبة محددة شرعًا.\n\nهل يجوز الاحتفاظ بكل اللحم؟\n\nنعم. أجاز علماء المالكية أن يحتفظ الإنسان بكل لحم الأضحية لأسرته، خاصة عند الحاجة أو الفقر.\n\nلكنهم أكدوا أن إهمال الفقراء والمحتاجين تمامًا يتعارض مع روح هذه العبادة المباركة.\n\nفالأضحية عبادة تتضمن:\n\nشكر الله تعالى؛\n\nوالكرم؛\n\nوالأخوّة؛\n\nوالتذكير بتضحية النبي الكريم إبراهيم ـ عليه السلام.\n\nهل يجوز إهداء جزء منها لغير المسلم؟\n\nأجاز عدد من علماء المالكية إهداء جزء من لحم الأضحية للجار غير المسلم، من باب حسن المعاملة، واحترام الجوار، وإظهار أخلاق الإسلام، ما دام ذلك لا يَحْرِمُ المسلمين الفقراء.\n\nبيع اللحم أو الجلد\n\nصرّح علماء المالكية بتحريم:\n\nبيع لحم الأضحية؛\n\nوبيع جلدها؛\n\nوكل صور المتاجرة بشيء من الأضحية.\n\nكما لا يجوز دفع أجرة الجزار بجزء من الأضحية.\n\nبل يجب دفع أجرته بشكل منفصل.\n\nوذلك استنادًا إلى الحديث الذي رواه علي بن أبي طالب، وفيه أن النبي ﷺ أمر بتوزيع جلود الأضاحي، ونهى عن إعطاء الجزار منها مقابل عمله.\n\nالخاتمة\n\nيُعلّمنا المذهب المالكي أن:\n\nتقسيم الأضحية أمر مستحب؛\n\nوإطعام الفقراء من أعظم حكم هذه العبادة؛\n\nولا توجد نسبة واجبة محددة للتقسيم؛\n\nوينبغي أن تصاحب الأضحية روح التقوى والكرم.\n\nقال تعالى:\n\nلَن يَنَالَ اللَّهَ لُحُومُهَا وَلَا دِمَاؤُهَا وَلَٰكِن يَنَالُهُ التَّقْوَىٰ مِنكُمْ\n(سورة الحج، الآية 37)\n\nاللهم صل على سيدنا محمد الفاتح لما أغلق والخاتم لما سبق ناصر الحق بالحق والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم\n\nالعبد الفقير إلى الله وتلميذ سيدنا الشيخ أحمد التجاني قدس الله سره:\nمحمد المنصور المحيي الدين التجاني"}, {"q": "هل يمنع على التجاني قراءة كتاب دلائل الخيرات و كتب التصوف الأخرى؟", "a": "قال العلامة سيدي أحمد سكيرج رضي الله عنه في كتابه الرحلة الحبيبية الوهرانية الجامعة للطائف العرفانية بتحقيق سيدي محمد الراضي كنون ص238: إن تلاوة دلائل الخيرات من جملة أذكار الشيخ رضي الله عنه الغير اللازمة فذكره وتلاوته متابعة للشيخ رضي الله عنه وذلك من كمال المريد و لا بأس على المريد التجاني إن كان محافظا على أذكاره اللازمة أن يذكر ما شاء من الأذكار الغير اللازمة في الطريقة وغيرها من الأذكار وإن لم تكن من أذكار الشيخ رضي الله عنه لأن الشيخ رضي الله عنه لم يمنع من ذكر الأذكار مطلقا وإنما الممنوع في طريقته أخذ طريقة أخرى على طريقه ولا تعطى طريقه إلا لمن ترك غيرها من جميع الطرق.إهـ\n\nأما قراءة كتب التصوف فقد قال الإمام البعقيلي رضي الله عنه في الإراءة ج1ص159:لا يجوز للفقير أن يطالع كتب القوم وإن ابتلي بها فلا ينجح إلا إذا كان من العلماء الراسخين في الطريقة فيطالع تبحرا وتغلغلا في العلوم لا غير…إلى أن قال رضي الله عنه:فيجب على عالم في الطريقة و مقتدى به ألا يدرس في الزوايا لضعفاء الفقراء إلا ما يناسب الطريقة وهو القرآن وحديث النبي الكريم ولا بأس بفروع مذهبه من أحكام الوضوء والعبادة لا غير من كل ما فيه مصلحة عائدة على الفقراء.إهـ\n\nقال المقدم سيدي أمين محمد الفطواكي رضي الله عنه في كتابه التربية في الطريقة التجانية في ضمن الأجوبة البعقيلية ص 67 أن الإمام البعقيلي رضي الله عنه سئل :هل يجوز للتجانيين أن يسردوا نحو دلائل الخيرات من الأحزاب والأدعية المروية عن مولاي عبد القادر وسيدي زروق وسيدي أحمد بناصر مع أنها لا تخلوا غالبا عن التوسلان بالأقطاب والأبدال والنجباء والشهداء وحملة القرآن إلى آخره فالجواب: أن من وصله الإذن في دلائل الخيرات من القدوة رضي الله عنه فلا بأس إن كان مجردا من الأدعية التي لم تنسب لمؤلفه…فمن لم يصله الإذن تركه فإن سيدنا الحاج الحسين اليفراني قال لي وأما الأحزاب كحزب البحر والدور الأعلى فلا بأس لمن أذن فيهما كغيره من كل ما ثبت عن القدوة رضي الله عنه من غير زيادة ولا نقصان…وأما قولكم مع أنها لا تخلوا من التوسلات بالأقطاب وهذا يحرم عليه حينئذ أن يتعاطاها ذكرا وتبركا فإنه لم يكن فيه إذن لأحد من أهل الطريقة فمن توسل بهم رضي الله عنهم انقطع عن شيخه.إهـ"}, {"q": "هل من الممكن أن تقدم المرأة لتلقين الورد؟", "a": "قال سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص5:قد أنجبت الطريقة التجانية العديد من النساء العابدات القانتات العارفات الكبار وقد عرفن بالفتح وبمراتب عالية في الولاية والمعرفة بالله وكان ساداتنا العارفون بالله من أهل الطريقة التجانية يقدمون النساء لأن المرأة عندما تكون مستعدة ولها الأهلية فبدورها تعطي الطريقة للنساء وتكون قريبة منهن وقد كانت العديد من النساء التجانيات مقدمات مأذونات في جميع أوراد الطريقة وفي أسرار وفوائد أهل الحقيقة وكن يلقن الأوراد والأذكار والفوائد و الأسرار كلها لجميع نساء بلادهن.إهـ\n\nوقال العلامة أبي بكر عتيق ابن خضر التجاني رضي الله عنه في رسالته رفع الإعتراض و الملام عمن قدم المرأة لتلقين ورد خاتم الأعلام: اعلم أيها الأخ أن تقديم النساء لإعطاء الورد التجاني اللازم وغيره من أسرار الطريقة وأورادها الخاصة جائز لا اعتراض على فاعله ولا لوم بشرط الأهلية في ذلك والدليل على جواز ذلك أن جميع مشايخ الطريقة الذين وضعوا التآليف في شأن الورد ما اشترطوا الذكورة في المقدم وإنما اشترطوا الأهلية فقط كما هو مبسوط في كتبهم كبغية المستفيد و شهدة الجاني وشرحها تيسير الأماني ودرة التاج وشرحها المسمى بالكوكب الوهاج والفتح الرباني ثم إن الشيوخ المعتبرين في هذه الطريقة ممن يحتج بهم قدموا النساء لتلقين الورد وأشهرهم في وقتنا الشيخ محمد الفوتي الشهير بألفا هاشم المتوفي بالمدينة المنورة فإنه قدم الشيخة العارفة الملقبة بالله حي لكثرة قولها ذلك.إهـ\n\nوقال العلامة أحمد بن محم بن العباس العلوي الشنجيطي رضي الله عنه في كتابه روض شمائل أهل الحقيقة في التعريف بأكابر أهل الطريقة عند ترجمته للسيد محمد الحنفي رضي الله عنه ص54:ووالدته من الواصلات في الطريق العارفات بالله تعالى على التحقيق قدمها الشيخ محمد الحافظ وجعلها من العشرة الذين أمره الشيخ التجاني بتقديمهم.إهـ\n\nوقال سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص53عند ترجمته للسيدة سكينة:من المقدمات التجانيات بالمدينة المنورة كانت امرأة صالحة تقية نقية معروفة بالإستقامة أجرى الله على يديها كرامات كثيرة كما كانت تتمتع بأخلاق عالية من الكرم والسخاء والحياء والرقة أخذت الطريقة التجانية عن المقدمة السيدة فاطمة الملقبة بين عامة الناس ب{الله حي}وهي أيضا التي قدمتها لتلقين أوراد هذه الطريقة لمن طلبها منها.إهـ\n\nوقال العلامة أبي بكر عتيق ابن خضر التجاني رضي الله عنه في رسالته رفع الإعتراض والملام عمن قدم المرأة لتلقين ورد خاتم الأعلام :ثم بعد فراغي من كتابة هذه الرسالة بخمس سنين وقفت على جوابين فيهما الزيادة على ما كتبت فأردت إلحاقهما بها أحدهما للعارف بالله القطب الكامل سيدنا ومولانا الحاج إبراهيم بن الحاج عبد الله الكولخي رضي الله عنه في ضمن إفادة المريد عن أسئلة السيد محمد بن محمد العيد والثاني للعارف بالله سيدي ومولاي الحاج أحمد سكيرج الأنصاري رضي الله عنه في ضمن أجوبة أسئلة مرزوق الأنصاري ونص الأول مع جوابه هو قوله:{السؤال}الحادي والعشرون عن حكم تقديم المرأة إذا كانت أهلا للتقديم وعلى أنها تقدم هل تعطي الورد للرجال؟ فالجواب:والله الموفق للصواب إننا ما عرفنا من المقدمات إلا ما قال صاحب روض الشمائل في ترجمة السيد محمد الحنفي ووالدته من الواصلات في الطريق العارفات بالله تعالى على التحقيق قدمها الشيخ محمد الحافظ رضي الله عنه وجعلها من العشرة الذين أمره الشيخ بتقديمهم فعلى هذا إن أدت الحال إلى تقديم امرأة صالحة فلها أن تلقن الأوراد للرجال والنساء على الوجه الذي يليق شرعا و لا تصافح الرجال الذين ليسوا بالمحارم كما أن المقدم ليس له أن يصافح غير ذوات المحارم وقد قال السيد العربي بن السائح في الجواب الشافي وقد طالعت إجازة الشيخ للشيخ أبي سالم العياشي ومن جملة ما رأيت فيها من الشروط أن لا يصافح الملقن بيده يد امرأة ليست بذات محرم منه.وفي البغية وكان الشيخ رضي الله عنه يأمر ذوي محارمهن أن يلقنوهن وربما لقن بعضهن بالكلام فقط ويده لم تصافح يد امرأة قط عند التلقين للورد…إهـ ونص السؤال الثاني مع جوابه {السؤال الحادي عشر}لم أجد فيما وقفت عليه من كلام علماء الطريقة باشتراط الذكورة والبلوغ في أهلية التقديم لإعطاء الإذن في الورد وقد ذكروا صفات المقدم بصيغة التذكير المسندة للشخص المحتمل للذكر البالغ وغيره فما حقيقة الأمر؟ وهل حكم الإذن في الورد من باب الرواية والسند والعلم ؟أو من باب الإمامة والإمارة والحكم؟ وقد وقفت في بعض الرسائل على وصف بعض السيدات التجانيات بالتقديم{الجواب}من المقرر عندنا في الطريقة تقديم المرأة لتلقين الأوراد كما جرى عليه عمل الشيخ رضي الله عنه وعمل خلفائه بعده وقد قدم رضي الله عنه جماعة من النساء تعرضنا لذكر بعضهن في كشف الحجاب ورفع النقاب وكان يكاتبهن ويراسلهن وإذا اجتمع بواحدة منهن لا يصافحهن مع إلقاء طرف برنوسه على وجهه ويأمرهن بالجلوس وراءه ويحدثهن فيما يرجع للطريقة وغيرها ومنهن من أطلق لهن في تقديم المستحقات من النساء وغيرها من الرجال الذين فيهم الأهلية كما بلغنا ذلك على لسان الثقة من الإخوان ووقفنا عليه في بعض رسائل الشيخ قدس سره وكفى دليلا على صحة تقديم السيدات التجانيات ما وقفتم عليه من الرسائل بوصفهم بالتقديم وبذلك نتحقق بأنه لا تشترط في التقديم الذكورة بل يقدم من فيه الأهلية ذكرا كان أو أنثى كبيرا كان أو صغيرا حرا أو عبدا مثل تلقين الورد لهم وللمقدم أن يلقن مقدمة لتقوم مقامه في تلقين الأوراد للنساء وهو أولى من مباشرة تلقينهن بنفسه لما فيه من الإحتياط من مشافهة النساء والإنسان غير معصوم ويجري الشيطان من الشخص مجرى الدم ولا يثق بالنساء إلا مغرور أو غبي غير معذور فما في كتب الطريقة من عدم التعرض للمقدمات الإناث إنما هو جرى على الغالب في التقديم للذكور كما لم يصرح بالتقديم للصبيان المستحقين اتكالا على شرط الأهلية فيه مطلقا في حق الذكر والأنثى طبق ما هو مذكور في المأذون له بالورد مع توفر الشروط المقررة والأركان المعتبرة فحقيقة الأمر عندنا في التقديم للشخص الداخل فيه الذكر والأنثى على حد سواء بالغا كان أو غير بالغ كما قررنا…إهـ\n\nوفي كشف الحجاب للعلامة سيدي أحمد سكيرج رضي الله عنه عند ترجمته للسيد الحاج الطيب القبَّاب قال:ووقفت على رسالة بخط الفقيه سيدي محمد بن المشري رحمه الله يخاطب بها جماعة من أعيان فقراء فاس وصدر فيها بصاحب الترجمة ونصها{بعد حمد الله جل ثناؤه وتقدست أسماؤه وعز كرمه ومجده يصل الكتاب إلى أحبابنا ومن أعز الناس لدينا ذي الشيبة الطاهرة والأحوال الزاهرة محبنا صدقا وصفينا حقا سيدي الحاج الطيب القباب ومحبنا وولده أبي عبد الله سيدي محمد وأولاده والحرة الجليلة الكريمة السيدة المقدمة فاطمة}…إلى أن قال في آخر الرسالة والسلام عليكم من الفقير إلى ربه أخيكم كاتب الحروف محمد بن المشري عن إذن سيدنا رضي الله تعالى عنه إهـ\n\nوقال العلامة سيدي أحمد سكيرج رضي الله عنه في كتابه رفع النقاب الربع الثالث ص192عند ترجمته للعلامة سيدي محمد بن المشري رضي الله عنه:ومما بلغني عنه أنه قدم الشيخ مرة إلى عين ماضي من إحدى سفراته من فاس فنزل قرب القرية وقد نصبت له هناك قبة للنزول بها ليتلاقى مع الذين قدموا لملاقاته وزيارته فنزل على القرب منه سيدي محمد بن المشري في قبة نصبها كما نزل سيدي محمود قبالته في قبة أخرى فكان جل الزائرين لا يدخلون لقبة الشيخ إلا بعد ملاقاتهم مع كل واحد منهما وكان من جملة الزائرين المرابطة الزهراء إحدى المقدمات في رفقة جماعة من الأصحاب…فدخلوا إلى قبة الفقيه المذكور ولم تدخل هي معهم وقصدت قبة الشيخ رضي الله عنه وكان معه نجلاه سيدي محمد الكبير وسيدي محمد الحبيب فسألهما عمن قدم معها فقالت فلان وفلان وقد دخلوا إلى قبة الفقيه المذكور فقال ولم لم تدخلين معهم فقالت إنما جئت لزيارتك ولو كان في محل كل منهما ضربت قبة لنجليك ما دخلت لمحلهما إلا بعد زيارتك ولا أعرف غيرك فقال لها رضي الله عنه{أحسنت من يعرفني يعرفني وحدي}.إهـ وقال عنها سيدي محمد الراضي كنون أطال الله في عمره في كتابه نساء تجانيات ص25:من المقدمات التجانيات كانت معاصرة للشيخ أبي العباس التجاني ولها فيه محبة عظيمة.إهـ"}, {"q": "ما عقيدتكم في الإمام المهدي وهل تعتقدون فعلا أنه من طريقتكم؟", "a": "بعد التحية و السلام\n\nقال العلامة سيدي محي الدين الطعمي التجاني رضي الله عنه في معجم من رأى رسول الله في النوم واليقظة ص36: الولاية من حيث هي على قسمين ظاهرة وباطنة فالظاهرة لأهل الأمر و التصريف الظاهر وهي معروفة وهذه الولاية تختم على الإمام العدل المسمى بالمهدي المنتظر والباطنة لأهل التصريف الباطن وتنقسم إلى عامة وخاصة فالعامة من آدم إلى سيدنا عيسى عليه السلام وعليه تختم حين ينزل في آخر الزمان والخاصة هي من نبينا صلى الله عليه وسلم إلى الختم الأكبر سيدي أبي العباس أحمد التجاني رضي الله عنه فالحمد لله الذي جعلنا من مريديه ومحبيه رضي الله عنه.إهـ\n\nوذكر العلامة سيدي أحمد سكيرج رضي الله عنه في كشف الحجاب عند ترجمته للسيد مولاي أحمد بن عبد السلام الفيلالي الودغيري أن الشيخ سيدي أحمد التجاني قال{إن المهدي رضي الله عنه يأخذ عنا إذا قام آخر الزمان بعد مماتنا وانتقالنا من دار الفناء إلى دار البقاء}.إهـ\n\nوقال العارف بالله سيدي محمد بن عبد الواحد النظيفي رضي الله عنه في الدرة الخريدة شرح الياقوتة الفريدة م1ج1ص187:\n\nفيأخذها المهدي عند ظهوره لدا من له الإذن الصحيح بطيبة\n\n{فيأخذها} أي بسبب ما ذكر من بقائها وحدها آخر الدهر يأخذها الإمام المنتظر سيدي محمد بن عبد الله المهدي رضي الله عنه.إهـ\n\nوقال الشيخ سيدي أحمد التجاني رضي الله عنه في الإفادة الأحمدية:{إذا جاء المنتظر يطلب من أصحابنا الفاتحة}قال سيدي محمد الطيب السفياني رضي الله عنه مؤلفها:سببه أنه قيل له إنه المنتظر يذبح طلبة العلم ويفعل كذلك بالطلبة من أصحابك فذكره.إهـ\n\nوقال العلامة سيدي أحمد سكيرج رضي الله عنه في رفع النقاب الربع الثالث ص8عند ترجمته للعلامة سيدي محمد الكبير بن الشيخ رضي الله عنه:قد أشاع بعض الإخوان ممن لهم الغلو في محبة جنابه أن سيدنا محمد الكبير لازال إلى الآن حيا في أحد الدهاليز إلى أن يخرج مع المنتظر ولم يستشهد في تلك الوقعة وإنما شبه لهم وهذا الإعتقاد فاسد وهو من غلو جهلة الطريق بل توفاه الله شهيدا وكان أمر الله قدرا مقدورا ولا يخفى على أهل التصديق وذوي التحقق والتحقيق أن طريقة سيدنا رضي الله عنه وكمال فضله ومناقبه ومناقب أصله ونسله لا يحتاج في تكثير سوادها بما يختلقه المختلقون ويجد فيه سبيلا للطعن المنتقدون مثل هذه القولة التي يشيعها الجهال ويظنون ذلك فيه مما له من الكمال ويشبه هذه القولة ما يتقوله بعض الإخوان عن الشيخ عمر الفوتي مؤلف الرماح بأنه دخل دهليز إلى أن يخرج أيضا مع المنتظر أو مع أهل الكهف إن هذا لشيء عجاب فاعتقاد مثل هذا والتنويه به مضر ومؤد إلى سوء الإعتقاد في ذلك الجناب المتنور وإن كانت المحبة تقضي على صاحبها بما لم تقض به على غيره لكن خير الأمور الوسط ويشبه هذا الإعتقاد تمسك الإمامية من الشيعة فاعتقدوا المهدوية في العارف الكامل الإمام العدل السيد محمد بن الحسن العسكري أحد الأئمة الإثنى عشر فإنهم يقولون بأنه هو المهدي المنتظر وهو في دهليزه قد استتر وينتظرون خروجه في آخر الزمان وإلى الآن في اعتقادهم حي ولكن طال منهم الإنتظار وذلك من غلو المحبة التي لها الإستيلاء على القلوب في حضور وغيبة وهو اعتقاد الشيعة ولهم أشياع من زمانه إلى الآن…إلى أن قال ونحن نقول إن المهدي غيره…إلى أن قال وليس المهدي من أصحاب سيدنا رضي الله عنه ولكن من المحبين في جنابه وجناب أحبابه وقد بلغنا عن سيدنا رضي الله عنه أنه إذا جاء المنتظر فإنه يطلب الفاتحة من أصحابنا و أعدى
